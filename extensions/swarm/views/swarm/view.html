<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .chip, .btn, .seg, .table, .list-row) and the theme's tokens come with the frame; this page
     only lays them out */
  html, body { margin: 0; height: 100%; }
  [hidden] { display: none !important; }
  body { background: var(--surface-card); display: flex; flex-direction: column; overflow: hidden; }
  #bar { flex: none; padding: 10px 16px 8px; border-bottom: 1px solid var(--border-hairline); background: var(--surface-card); }
  /* as a card (thimble.card) the page has no pager, a top row only at full size, and its bar runs to the card's edges */
  body.in-card #bar { padding: 0 0 8px; }
  body.in-card #toprow, body.in-card #pager { display: none; }
  body.in-card.full #toprow { display: flex; }
  body.in-card #title { visibility: hidden; }
  body.in-card #toprow + #threads { margin-top: 0; }
  body.in-card.full #toprow + #threads { margin-top: 7px; }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .row + .row { margin-top: 7px; }
  .grow { flex: 1 1 auto; }
  /* the places keep to one row that scrolls sideways */
  #threads { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
  #threads > * { flex: none; }
  #title { flex: 1 1 200px; min-width: 0; margin: 0; font: 500 var(--text-sm) / 1.35 var(--font-body); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #counts { font: 400 var(--text-xs) / 1.3 var(--font-body); color: var(--text-secondary); font-variant-numeric: tabular-nums; margin-right: 6px; white-space: nowrap; }
  #q { flex: 0 1 190px; min-width: 110px; }
  .thr { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; margin-right: 8px; }
  .thr .chip { font-weight: 600; }
  .plink { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; font: 400 var(--text-xs) / 1.3 var(--font-body); color: var(--text-secondary); text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), .3); text-underline-offset: 2px; cursor: pointer; }
  .plink:hover { color: var(--text-primary); text-decoration-color: currentColor; }
  .chip .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); font-variant-numeric: tabular-nums; }
  .chip.active .n { color: inherit; opacity: .75; }
  .sw { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 2px; }
  select.field { field-sizing: content; max-width: 200px; }
  #types { gap: 4px; }
  .ico { width: 12px; height: 12px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .cbtn { gap: 6px; padding: 0 7px 0 9px; }
  .cbtn .k { color: var(--text-tertiary); font-weight: 400; }
  .cbtn .ico { color: var(--text-tertiary); }
  #pager { display: inline-flex; align-items: center; gap: 4px; font: 400 var(--text-xs) / 1 var(--font-body); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  #problems { margin: 7px 0 0; font: 400 var(--text-xs) / 1.4 var(--font-body); color: var(--status-warning); overflow-wrap: anywhere; }
  .lg { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px 0 4px; border-radius: var(--radius-chip); font: 400 var(--text-xs) / 1 var(--font-body); color: var(--text-secondary); }
  .lg { cursor: pointer; }
  .lg:hover { background: var(--surface-hover); color: var(--text-primary); }
  .lg .n { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .lg.off { opacity: .38; }
  .swb { display: inline-grid; place-items: center; width: 16px; height: 16px; margin: 0 -4px; border-radius: 3px; flex: none; cursor: pointer; }
  .swb:hover { background: var(--track-bg); }

  main { flex: 1; min-height: 0; display: flex; position: relative; }
  #chart { flex: 1; min-width: 0; overflow: auto; position: relative; outline: none; }
  #empty { margin: 48px auto; max-width: 420px; padding: 0 16px; text-align: center; font: 400 var(--text-sm) / 1.5 var(--font-body); color: var(--text-secondary); }
  #grid { display: grid; width: max-content; min-width: 100%; }
  #corner { grid-area: 1 / 1; position: sticky; left: 0; top: 0; z-index: 6; background: var(--surface-card); border-right: 1px solid var(--border-hairline); border-bottom: 1px solid var(--border-hairline); box-sizing: border-box; padding: 10px 12px 0 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .seg-sm .seg-opt { height: 20px; padding: 0 7px; }
  #cols { grid-area: 1 / 2; position: sticky; top: 0; z-index: 5; background: var(--surface-card); border-bottom: 1px solid var(--border-hairline); box-sizing: border-box; }
  #rows { grid-area: 2 / 1; position: sticky; left: 0; z-index: 4; background: var(--surface-card); border-right: 1px solid var(--border-hairline); box-sizing: border-box; }
  #plot { grid-area: 2 / 2; position: relative; }
  .hcap { font: 500 10.5px / 1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); white-space: nowrap; }
  #cols .hcap { position: absolute; left: 16px; top: 10px; }
  #cols .hcap .note { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .col { position: absolute; top: 26px; font: 400 10.5px / 1.3 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-secondary); white-space: nowrap; }
  .col .d { color: var(--text-tertiary); }
  .col.none { color: var(--text-tertiary); }
  .band { position: absolute; left: 0; right: 0; }
  .band.odd { background: rgba(var(--ink-rgb), .022); }

  .agent { position: absolute; left: 0; right: 0; box-sizing: border-box; padding: 0 12px 0 16px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .agent:hover .nm, .agent.sel .nm { text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), .35); text-underline-offset: 2px; }
  .agent.odd { background: rgba(var(--ink-rgb), .022); }
  .av { flex: none; width: 28px; height: 28px; border-radius: 7px; background: var(--track-bg); display: block; }
  .av rect { fill: var(--text-secondary); }
  .who { min-width: 0; flex: 1; }
  .who .nm { font: 600 var(--text-ui-sm) / 1.3 var(--font-body); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .goal { margin-top: 1px; font: 400 var(--text-xs) / 1.38 var(--font-body); color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .who .sig { margin-top: 2px; font: 400 10.5px / 1.35 var(--font-mono); color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .card { position: absolute; box-sizing: border-box; padding: 7px 10px 8px; background: var(--surface-card); border: 1px solid rgba(var(--ink-rgb), .16); border-radius: var(--radius-ui); cursor: pointer; transition: opacity .12s, border-color .12s; }
  .card:hover { border-color: rgba(var(--ink-rgb), .38); }
  .card.sel { border-color: var(--text-primary); box-shadow: 0 0 0 1px var(--text-primary); }
  .card.ctx { border-style: dashed; }
  .card .hd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; min-width: 0; font: 400 10.5px / 1.3 var(--font-mono); color: var(--text-tertiary); white-space: nowrap; }
  .card .hd .tag { font-weight: 600; color: var(--text-primary); }
  /* a value too long for the rest of the line goes to a line of its own, and wraps there rather than being cut */
  .card .hd .v { flex: 0 0 auto; max-width: 100%; white-space: normal; overflow-wrap: anywhere; font-weight: 600; font-family: var(--font-body); }
  /* the name a card's save signs with, or its account, on a line of its own so neither it nor the value is cut */
  .card .as { margin-top: 1px; font: 400 10.5px / 1.3 var(--font-body); color: var(--text-tertiary); overflow-wrap: anywhere; }
  .card .ac { margin-top: 3px; font: 500 12.5px / 1.36 var(--font-body); color: var(--text-primary); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .tick { position: absolute; left: -1px; right: -1px; top: -1px; height: 3px; border-radius: var(--radius-ui) var(--radius-ui) 0 0; }
  #links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #links .hit { pointer-events: stroke; stroke: transparent; stroke-width: 10; fill: none; cursor: pointer; }
  #links .ln { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; transition: opacity .12s; }
  #links .end { transition: opacity .12s; }
  .lbl { position: absolute; height: 14px; box-sizing: border-box; padding: 0 3px; border-radius: 3px; background: var(--surface-card); font: 500 10.5px / 14px var(--font-mono); white-space: nowrap; cursor: pointer; transition: opacity .12s; }
  .lbl:hover { text-decoration: underline; }
  .focus .card:not(.lit), .focus .agent:not(.lit) .who, .focus .agent:not(.lit) .av { opacity: .3; }
  .focus .lbl:not(.lit), .focus #links g:not(.lit) .ln, .focus #links g:not(.lit) .end { opacity: .1; }
  .focus #links g.lit .ln { stroke-width: 2.2; }
  #links g.dropped .ln, #links g.dropped .end, .lbl.dropped { opacity: .25; }

  #detail { flex: none; width: 380px; box-sizing: border-box; overflow: auto; border-left: 1px solid var(--border-hairline); background: var(--surface-card); padding: 12px 16px 28px; }
  .d-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .d-when { margin-top: 8px; font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); color: var(--text-secondary); overflow-wrap: anywhere; }
  .d-h { margin: 10px 0 0; font: 500 var(--text-lg) / 1.35 var(--font-body); color: var(--text-primary); overflow-wrap: anywhere; }
  .d-agent { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; cursor: pointer; }
  .d-sec { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 6px; }
  .d-sec .t { font: 500 var(--text-ui-sm) / 1.2 var(--font-body); color: var(--text-primary); }
  .d-sec .n { font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .d-sec .grow + .btn { margin: -4px 0; }
  .lrow { display: grid; grid-template-columns: 8px auto 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; padding: 6px 6px; margin: 0 -6px; border-radius: var(--radius-ui); cursor: pointer; }
  .lrow:hover { background: var(--surface-hover); }
  .lrow .sw { align-self: center; }
  .lrow .k { font: 500 var(--text-mono-sm) / 1.3 var(--font-mono); white-space: nowrap; }
  .lrow .o { min-width: 0; font: 400 var(--text-xs) / 1.35 var(--font-body); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .r { grid-column: 2 / 4; font: 400 var(--text-xs) / 1.4 var(--font-body); color: var(--text-secondary); overflow-wrap: anywhere; }
  .arow { display: flex; align-items: baseline; gap: 8px; padding: 5px 6px; margin: 0 -6px; border-radius: var(--radius-ui); cursor: pointer; font: 400 var(--text-xs) / 1.35 var(--font-body); }
  .arow:hover { background: var(--surface-hover); }
  .arow .no { flex: none; width: 26px; font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); color: var(--text-tertiary); }
  .arow .tg { flex: none; font: 600 var(--text-mono-sm) / 1.3 var(--font-mono); }
  .arow .x { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
  .diff { margin: 0; font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); color: var(--text-primary); border: 1px solid var(--border-hairline); border-radius: var(--radius-ui); overflow: hidden; }
  .diff .h { padding: 3px 8px; background: rgba(var(--ink-rgb), .03); color: var(--text-tertiary); border-top: 1px solid var(--border-hairline); }
  .diff .h:first-child { border-top: 0; }
  .diff .l { display: flex; gap: 8px; padding: 0 8px; }
  .diff .l .g { flex: none; width: 8px; color: var(--text-tertiary); user-select: none; }
  .diff .l .t { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diff .l.del .t { color: var(--text-tertiary); text-decoration: line-through; text-decoration-color: rgba(var(--ink-rgb), .35); }
  .diff .l.add { background: rgba(var(--ink-rgb), .035); }
  .text { margin: 0; max-height: 360px; overflow: auto; padding: 8px 10px; border: 1px solid var(--border-hairline); border-radius: var(--radius-ui); font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: minmax(70px, max-content) 1fr; gap: 3px 12px; margin: 0; }
  .facts dt { font: 400 var(--text-xs) / 1.45 var(--font-body); color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facts dd { margin: 0; min-width: 0; font: 400 var(--text-mono-sm) / 1.45 var(--font-mono); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skel { height: 60px; border-radius: var(--radius-ui); background: rgba(var(--ink-rgb), .04); }
  .menu { position: fixed; z-index: 50; min-width: 240px; max-width: 320px; max-height: 70vh; overflow: auto; padding: 4px; border-radius: var(--radius-card); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), .14); }
  .mh { padding: 8px 8px 4px; color: var(--text-tertiary); font: 400 10.5px / 1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; }
  .mi { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-chip); background: none; color: var(--text-primary); font: 400 var(--text-ui-sm) / 1 var(--font-body); text-align: left; cursor: pointer; }
  .mi:hover { background: var(--surface-hover); }
  .mi.sub { padding-left: 30px; color: var(--text-secondary); cursor: default; }
  .mi .ck { width: 14px; display: inline-grid; place-items: center; flex: none; }
  .mi .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mi .n { margin-left: auto; display: inline-flex; gap: 1px; color: var(--text-tertiary); font-size: var(--text-xs); flex: none; }
  .box { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--mark); box-sizing: border-box; }
  .box.on { background: var(--mark); }
  .msep { height: 1px; margin: 4px 0; background: var(--border-hairline); }
  .pal { position: fixed; z-index: 60; display: grid; grid-template-columns: repeat(7, 20px); gap: 6px; padding: 10px; border-radius: var(--radius-card); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), .14); }
  .pal button { width: 20px; height: 20px; padding: 0; border: 0; border-radius: 4px; cursor: pointer; }
  .pal button.cur { box-shadow: 0 0 0 2px var(--surface-card), 0 0 0 3.5px var(--text-primary); }
  /* as a card the chart fits the card's width (layoutCard), so it has no zoom; a fade with a control at its foot says
     there is more below */
  body.in-card #corner, body.in-card #rows { display: none; }
  .agent.inl { right: auto; height: auto; padding: 0; gap: 5px; align-items: center; background: none; }
  .agent.inl .av { width: 16px; height: 16px; border-radius: 4px; }
  .agent.inl .nm { font-size: var(--text-xs); }
  .agent.inl .goal, .agent.inl .sig { display: none; }
  body.in-card .card { padding: 6px 8px 7px; }
  body.in-card .card .ac { font-size: 12px; -webkit-line-clamp: 2; }
  .lbl.nin { height: 15px; padding: 0 4px; border: 1px solid var(--border-hairline); color: var(--text-secondary); font-weight: 400; }
  #more { position: sticky; left: 0; bottom: 0; z-index: 7; height: 36px; margin-top: -36px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; box-sizing: border-box; background: linear-gradient(to bottom, rgba(0, 0, 0, 0), var(--surface-card) 80%); pointer-events: none; }
  #more .btn { pointer-events: auto; }
  #fromcard { max-width: 280px; }
  #fromcard .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 899px) {
    #detail { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 20; box-shadow: -8px 0 24px rgba(var(--ink-rgb), .08); }
  }
  @media (max-width: 560px) {
    #bar { padding: 8px 12px 6px; }
    #title { flex-basis: 100%; }
    #q { flex: 1 1 110px; }
    /* so do the filters */
    #filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #filters > * { flex: none; }
    .plink { max-width: 160px; }
    #corner { padding-left: 10px; }
    .agent { padding: 0 6px 0 8px; gap: 6px; }
    .av { width: 20px; height: 20px; border-radius: 5px; }
    .who .nm { font-size: var(--text-xs); }
    .who .goal { font-size: 11px; }
    .who .sig { display: none; }
    #detail { width: 100%; }
  }
  /* the overview (the view): the bar's swimlane controls give way to the overview's, and the chart to its rows */
  body.ov #threads, body.ov #filters, body.ov #chart { display: none; }
  body:not(.ov) #ovbarrow, body:not(.ov) #ov { display: none; }
  #ovcounts { font: 400 var(--text-xs) / 1.3 var(--font-body); color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #ovfilters { display: contents; }
  #ovfilters .chip .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  #ov { flex: 1; min-width: 0; overflow: auto; position: relative; padding: 4px 16px 24px; box-sizing: border-box; }
  #ovrows { position: relative; }
  .ovhead { display: grid; grid-template-columns: 200px minmax(0, 1fr) 56px; column-gap: 10px; position: sticky; top: -4px; z-index: 3; background: var(--surface-card); padding-top: 4px; }
  #ovaxis { grid-column: 2; width: 100%; height: 22px; display: block; }
  .ovcap { margin: 14px 0 4px; font: 500 var(--text-ui-sm) / 1.2 var(--font-body); color: var(--text-primary); }
  .ovrow { display: grid; grid-template-columns: 200px minmax(0, 1fr) 56px; column-gap: 10px; align-items: center; min-height: 26px; }
  .ovrow + .ovrow { border-top: 1px solid var(--border-hairline); }
  .ovname { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 3px 6px; margin: 0 0 0 -6px; border: 0; border-radius: var(--radius-ui); background: none; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .ovname:hover { background: var(--surface-hover); }
  .ovname.active { background: var(--surface-selected); }
  .ovname .nm { max-width: 100%; font: 500 var(--text-xs) / 1.3 var(--font-body); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ovname .sub { max-width: 100%; font: 400 11px / 1.3 var(--font-body); color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ovrow.rest .nm { color: var(--text-secondary); font-weight: 400; }
  .ovcells { width: 100%; height: 18px; display: block; cursor: crosshair; touch-action: none; }
  .ovn { font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); text-align: right; font-variant-numeric: tabular-nums; }
  #ovband { position: absolute; top: 0; bottom: 0; background: rgba(var(--ink-rgb), .08); border-left: 1px solid var(--text-primary); border-right: 1px solid var(--text-primary); pointer-events: none; }
  #ovempty { margin: 48px auto; max-width: 420px; text-align: center; font: 400 var(--text-sm) / 1.5 var(--font-body); color: var(--text-secondary); }
  .ovrec .tg { width: 38px; }
  .ovrec .who { flex: none; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
  @media (max-width: 560px) {
    .ovhead, .ovrow { grid-template-columns: 110px minmax(0, 1fr) 40px; column-gap: 6px; }
    #ov { padding: 4px 12px 24px; }
  }
</style>
</head>
<body>
<div id="bar">
  <div class="row" id="toprow">
    <p id="title"></p>
    <input id="q" class="field" type="search" placeholder="Search cards" aria-label="Search cards" autocomplete="off" spellcheck="false">
    <button id="cbtn" class="btn btn-secondary btn-sm cbtn" data-anchor-name="Labels"></button>
  </div>
  <div class="row" id="threads"></div>
  <div class="row" id="filters">
    <button id="fromcard" class="chip chip-sans chip-act active" hidden></button>
    <select id="agent" class="field" aria-label="Account"></select>
    <div id="types" class="row"></div>
    <div id="near" class="seg seg-track seg-sm" aria-label="Linked cards">
      <button class="seg-opt active" data-v="0">Matches</button><button class="seg-opt" data-v="1">With linked</button>
    </div>
    <div id="group" class="seg seg-track seg-sm" aria-label="Rows"><button class="seg-opt active" data-v="account">By account</button><button class="seg-opt" data-v="sig">By signature</button></div>
    <button id="clear" class="btn btn-ghost btn-sm">Clear filters</button>
    <span class="grow"></span>
    <span id="pager"><button id="prev" class="btn btn-ghost btn-sm" aria-label="Earlier cards">‹</button><span id="span"></span><button id="next" class="btn btn-ghost btn-sm" aria-label="Later cards">›</button></span>
  </div>
  <div class="row" id="ovbarrow"><span id="ovcounts"></span><span id="ovfilters"></span></div>
  <div class="row" id="legend" hidden></div>
  <p id="problems" role="status" hidden></p>
</div>
<main id="main">
  <div id="chart" tabindex="0">
    <p id="empty" hidden></p>
    <div id="grid">
      <div id="corner"><span class="hcap" id="rowcap">Account · goal</span>
        <div id="zoom" class="seg seg-track seg-sm" aria-label="Zoom"><button class="seg-opt" data-v="fit">Fit</button><button class="seg-opt active" data-v="1">100%</button></div>
      </div>
      <div id="cols"></div>
      <div id="rows"></div>
      <div id="plot"></div>
    </div>
    <div id="more" hidden><button id="moreb" class="btn btn-ghost btn-sm" aria-label="Scroll down"></button></div>
  </div>
  <div id="ov">
    <div class="ovhead"><canvas id="ovaxis"></canvas></div>
    <p id="ovempty" hidden></p>
    <div id="ovrows">
      <p class="ovcap" id="ovpcap"></p>
      <div id="ovplaces"></div>
      <p class="ovcap" id="ovacap"></p>
      <div id="ovaccounts"></div>
      <div id="ovband" hidden></div>
    </div>
  </div>
  <aside id="detail" hidden></aside>
</main>
<div id="pop"></div>
<script>
// Swarm: a row per account (or per name the cards sign with), a card per record the labels that are on mark, in event
// order, and the links between cards that the records carry, drawn from the reader's chart. Columns follow event
// order, one card each, so their spacing is no measure of time; each is headed by its card's UTC time, or "Time
// unknown".
// As a card (thimble.view.card, a card's code calling thimble.card("swarm", …)), the page draws the chart the card
// stored, which the bridge's `init` brings, and fetches only a record's detail. Its records and their values are the
// card's; the legend, grouping, account, places, link types and search narrow what it shows here, and the first four
// are told to thimble as the call's arguments they would set (thimble.setQuery), which Keep writes into the call. The
// colours are the labels' as the analyst edits them, and a record a label marked after the card ran takes the colour of
// its mark as the label runs. A citation hovered in the card's takeaway lights its record, and a click on it opens the
// record beside the chart. While the Files filter dims records, their links are dimmed too, and the chart scrolls to
// the first record it keeps. It tells thimble the height it needs, and that it has drawn; `init` again with the same
// key keeps what the analyst did here. At full size it shows the top row, with search and the Labels menu. Rows and
// places carry no unit ref in a card, so a ⌘-click on them asks about the card. As a card the chart has a layout of its
// own that fits the card's width (layoutCard), and a fade at its foot while more of it is below.
// A view opened from a card (Open as view) gets the card's arguments with `open` (place.query: {card, title, args}) and
// draws its records by them, live: labels turned on change its records as in any view. A chip names the card while its
// arguments hold; a click on it, or an `open` whose query is null, drops them.
// Layout: a card spans more than its column, so cards of one row that would overlap stack in the row's lanes. The part
// of a card no neighbouring column's card reaches, its band, carries the vertical runs of its links, and each link runs
// horizontally in the gap between rows next to its target, so no link crosses a card. A gap is as tall as the links it
// carries need, each on a track of its own with its label beside its source.
// Filters: account, link type and search narrow the cards; "With linked" adds the cards one link away. Hovering a card,
// a row, a link or a place lights its neighbourhood. A click shows a card's record, a row, a link or a cited record
// beside the chart; "Open record" opens it in thimble.
// Labels: while a label is on it is the colouring: cards take its values' colours, and links are drawn in ink, told
// apart by dash and label; a click on a value in the legend hides its cards or shows them again, a shift-click keeps
// only its cards; with none on, each place's tag takes a viz colour and each link type another. Cards carry
// their record's ref as data-anchor, and rows and places their unit keys, so thimble marks them. A value's colour is
// looked up in what thimble last sent (onLabels), so a colour the analyst changes shows at once.
const slug = (thimble.view && thimble.view.slug) || 'swarm'
const CARD = !!(thimble.view && thimble.view.card)
if (CARD) document.body.classList.add('in-card')
const NS = 'http://www.w3.org/2000/svg'
const TYPE_VIZ = { reply: 1, names: 3, 'same place': 7 } // the viz colour of each link type
const DASH = { reply: '', names: '', 'same place': '1.5 3.5' }
const MON = 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')
const HEAD_H = 58 // the column header's height
const ROW_PAD = 10 // above and below a row's cards
const LANE_GAP = 8 // between a row's lanes
const GAP_MIN = 14 // a gap between rows that carries no link
const TRACK = 16 // a link's track in a gap
const CARD_GAP = 8 // between two cards in one lane
const PAD_L = 16, PAD_R = 40
const END_GAP = 8 // between two link ends on one card
const FIT_MIN = 0.3
// as a card (layoutCard): a card's least and greatest width, the corridor right of each column, a row's head (narrow:
// in a narrow frame), the padding left of the chart, the tracks of runs in a corridor and in a gap, a gap that carries
// none, and the space above and below a row's cards
const C_CW = 150, C_CW_MAX = 260, C_CORR = 24, C_HEAD = 104, C_HEAD_NARROW = 84, C_PAD = 4, C_TRACK = 4, C_GAP_TRACK = 7, C_GAP_MIN = 8, C_ROW_PAD = 6
const C_DASH = { reply: '', names: '5 3', 'same place': '1.5 3.5' }
const RUN_POLL_MS = 3000 // how often the chart is read again while a label that is on runs

const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const fmt = (n) => Number(n).toLocaleString('en-US')
const pad2 = (n) => String(n).padStart(2, '0')
const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
function h(tag, cls, text) {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (text != null) e.textContent = text
  return e
}
function s(tag, attrs) {
  const e = document.createElementNS(NS, tag)
  for (const k in attrs || {}) if (attrs[k] != null) e.setAttribute(k, attrs[k])
  return e
}
function plural(n, one, many) { return `${fmt(n)} ${n === 1 ? one : many || one + 's'}` }
const CARET = '<svg class="ico" viewBox="0 0 12 12"><path d="M3.5 4.75 6 7.25l2.5-2.5"/></svg>'
const PLUS = '<svg class="ico" viewBox="0 0 12 12"><path d="M6 2.5v7M2.5 6h7"/></svg>'
const OPEN = '<svg class="ico" viewBox="0 0 12 12"><path d="M5 2.5H2.5v7h7V7M7 2.5h2.5V5M9.5 2.5 5.5 6.5"/></svg>'
const CLOSE = '<svg class="ico" viewBox="0 0 12 12"><path d="m3 3 6 6M9 3 3 9"/></svg>'

function parseTime(t) {
  if (!t) return null
  const d = new Date(t)
  return Number.isNaN(d.getTime()) ? null : d
}
const dayOf = (d) => `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`
const hmOf = (d) => `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`
const whenOf = (t) => { const d = parseTime(t); return d ? `${dayOf(d)} ${hmOf(d)}:${pad2(d.getUTCSeconds())} UTC` : 'Time unknown' }

// a small figure for each row, drawn from its name: a 5×5 grid mirrored left to right
function hash(str) {
  let x = 2166136261
  for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619) }
  return x >>> 0
}
function avatar(name) {
  const svg = s('svg', { class: 'av', viewBox: '0 0 7 7', 'aria-hidden': 'true' })
  let bits = hash(name)
  for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) {
    if (bits & 1) {
      svg.append(s('rect', { x: 1 + x, y: 1 + y, width: 1, height: 1 }))
      if (x < 2) svg.append(s('rect', { x: 5 - x, y: 1 + y, width: 1, height: 1 }))
    }
    bits >>>= 1
  }
  return svg
}

// ---------------------------------------------------------------- data
let D = null // the reader's chart
let byId = new Map(), rowOfCard = new Map(), rowBy = new Map(), placeBy = new Map(), linksOf = new Map()
let rowsList = [] // [{key, name, goal, accounts, n}] in order of first card
let labelState = { labels: [], filter: null, all: null, palette: null }
const F = { row: '', places: new Set(), types: new Set() }
let q = ''
let near = false
let group = 'account' // 'account' or 'sig'
let zoom = 1 // 1 or 'fit'
let offset = 0
let only = [] // the label values the legend keeps, [{label, value}]; all when empty
let mode = 'view' // or, in a card's frame, the card's mode: card, full or render
let drawnKey = null // in a card, the key of what the card stored as it was last drawn
let stored = null // in a card, the call's arguments the card was made with
let base = {} // in a view opened from a card, the card's arguments that choose the records and links
let baseKey = ''
let fromCard = null // {card, title} of the card the view was opened from while its arguments hold
let filterKey = 'null'
let sel = null // {kind: card|row|link|record, id|key|ref}
let hover = null
let keepRef = null // the record a citation opened, shown whatever the labels mark
let target = null // the place thimble.onOpen asked for, applied once the chart is loaded
let loadSeq = 0
let failed = false // the first load failed, so the next label change tries again
const recCache = new Map()
let L = null // the layout: {cards, cells, linkEls, width, height}

const labelsOn = () => !!(D && D.source !== 'addressed' && D.marks.length)
function typeColour(t) {
  if (labelsOn()) return token('--viz-ink-2')
  return TYPE_VIZ[t] ? token(`--viz-${TYPE_VIZ[t]}`) : token('--viz-ink-2')
}
function placeColour(tag) {
  const i = Number(String(tag).slice(1)) - 1
  return i >= 0 && i < 6 ? token(`--viz-${[1, 2, 5, 6, 4, 3][i]}`) : token('--viz-ink-3')
}
// a label value's colour as thimble last sent it, else the one the chart was drawn with
function markColour(m) {
  const label = (labelState.all || labelState.labels || []).find((l) => l.name === m.label)
  const v = label && (label.values || []).find((x) => x.name === m.value)
  return (v && v.colour) || m.colour
}
function cardColour(c) {
  if (!labelsOn()) return null
  if (c.m >= 0) return markColour(D.marks[c.m])
  // a record the card's own labels marked after the card ran takes their colour; other labels that are on only mark it
  const live = CARD && thimble.markOf ? thimble.markOf(c.ref) : null
  const own = new Set(D.marks.map((m) => m.label))
  return live && live.bar && (live.names || []).some((n) => own.has(n)) ? live.bar : null
}
const types = () => [...new Set(D.links.map((x) => x.type))]
const rowKey = (c) => (group === 'sig' && c.sig ? c.sig : c.account)

async function load() {
  if (CARD) {
    // a card's records are the ones it stored; the legend narrows them here
    offset = 0
    return !!D
  }
  const seq = ++loadSeq
  let data
  try {
    data = await thimble.fetch({ ...base, op: 'chart', offset, only, keep: keepRef ? [keepRef] : [] })
  } catch (e) {
    const p = document.getElementById('problems')
    p.hidden = false
    p.textContent = `The records could not be read: ${e.message || e}`
    failed = !D
    return false
  }
  if (seq !== loadSeq) return false
  D = data
  offset = D.offset
  index()
  if (sel && sel.kind === 'card' && !byId.has(sel.id)) sel = null
  if (sel && sel.kind === 'row' && !rowBy.has(sel.key)) sel = null
  if (sel && sel.kind === 'link' && !D.links.some((x) => x.key === sel.key)) sel = null
  document.getElementById('problems').hidden = true
  return true
}
// the rows as the grouping keys them: an account, or a name the cards sign with, with the accounts that signed it
function index() {
  byId = new Map(D.cards.map((c) => [c.id, c]))
  placeBy = new Map(D.places.map((p) => [p.tag, p]))
  linksOf = new Map(D.cards.map((c) => [c.id, []]))
  for (const x of D.links) { linksOf.get(x.from).push(x); linksOf.get(x.to).push(x) }
  const goals = new Map(D.rows.map((r) => [r.account, r]))
  rowBy = new Map()
  rowOfCard = new Map()
  for (const c of D.cards) {
    const key = rowKey(c)
    rowOfCard.set(c.id, key)
    if (!rowBy.has(key)) rowBy.set(key, { key, name: key, accounts: [], sigs: [], goal: '', n: 0 })
    const r = rowBy.get(key)
    if (!r.accounts.includes(c.account)) r.accounts.push(c.account)
    if (c.sig && c.sig !== key && !r.sigs.includes(c.sig)) r.sigs.push(c.sig)
    r.n++
  }
  for (const r of rowBy.values()) {
    const own = goals.get(r.key)
    r.goal = own ? own.goal : ''
    r.own = !!own
  }
  rowsList = [...rowBy.values()]
  if (F.row && !rowBy.has(F.row)) F.row = ''
  for (const t of [...F.places]) if (!placeBy.has(t)) F.places.delete(t)
}

// ---------------------------------------------------------------- filters
function hay(c) {
  const p = placeBy.get(c.tag) || { name: '' }
  return [`#${c.id}`, c.account, c.sig || '', c.tag, p.name, c.line, D.marks[c.m] ? D.marks[c.m].value : '', c.time || 'time unknown'].join('\n').toLowerCase()
}
function matches(c) {
  if (CARD && only.length && !only.some((o) => c.mb & (1 << D.marks.findIndex((m) => m.label === o.label && m.value === o.value)))) return false
  if (F.row && rowOfCard.get(c.id) !== F.row) return false
  if (F.places.size && !F.places.has(c.tag)) return false
  if (q && !hay(c).includes(q)) return false
  if (F.types.size && !linksOf.get(c.id).some((x) => F.types.has(x.type))) return false
  return true
}
const filtered = () => !!(F.row || F.places.size || F.types.size || q)
function visible() {
  const core = D.cards.filter(matches)
  const ids = new Set(core.map((c) => c.id))
  const ctx = new Set()
  const typeOk = (x) => !F.types.size || F.types.has(x.type)
  if (near && filtered()) for (const c of core) for (const x of linksOf.get(c.id)) {
    if (!typeOk(x)) continue
    const o = x.from === c.id ? x.to : x.from
    if (!ids.has(o)) ctx.add(o)
  }
  for (const o of ctx) ids.add(o)
  if (sel && sel.kind === 'card' && byId.has(sel.id) && !ids.has(sel.id)) { ids.add(sel.id); ctx.add(sel.id) }
  return { cards: D.cards.filter((c) => ids.has(c.id)), ctx, links: D.links.filter((x) => ids.has(x.from) && ids.has(x.to) && typeOk(x)) }
}

// ---------------------------------------------------------------- the bar
function renderBar(v) {
  const title = document.getElementById('title')
  title.textContent = D.title
  title.title = D.title
  const shownRows = new Set(v.cards.map((c) => rowOfCard.get(c.id)))
  const shownPlaces = new Set(v.cards.map((c) => c.tag))
  const count = (n, total, one, many) => (n === total ? plural(n, one, many) : `${fmt(n)} of ${plural(total, one, many)}`)
  // a card counts what its code chose, as its listing does; the view counts what it shows of the corpus
  const counts = (CARD
    ? [plural(D.total, 'record'), plural(D.accounts_total, 'account'), plural(D.places_total, 'place'), `${count(v.cards.length, D.cards.length, 'card')} shown`, count(v.links.length, D.links.length, 'link')]
    : [count(shownRows.size, rowsList.length, group === 'sig' ? 'row' : 'account'), count(v.cards.length, D.cards.length, 'card'),
      count(v.links.length, D.links.length, 'link'), `${fmt(D.counts.records)} records`]).join(' · ')
  const tr = document.getElementById('threads')
  tr.innerHTML = ''
  const cs = h('span', null, counts)
  cs.id = 'counts'
  tr.append(cs)
  for (const p of D.places) {
    if (!shownPlaces.has(p.tag) && !F.places.has(p.tag)) continue
    const w = h('span', 'thr')
    if (!CARD) w.dataset.anchor = `view:${slug}/place/${p.name.replace(/ /g, '%20')}`
    w.dataset.anchorName = `${p.tag} ${p.name}`
    const b = h('button', `chip chip-act chip-tone-neutral${F.places.has(p.tag) ? ' active' : ''}`)
    b.title = `${p.name}: ${plural(p.n, 'record')} by ${plural(p.accounts, 'account')}\nClick: only this place · Shift-click: add it`
    if (!labelsOn()) { const sw = h('i', 'sw'); sw.style.background = placeColour(p.tag); b.append(sw) }
    b.append(p.tag)
    b.onclick = (e) => { toggleSet(F.places, p.tag, e.shiftKey); refresh() }
    const a = h('a', 'plink', p.title && p.title !== p.name ? `${p.name} · ${p.title}` : p.name)
    a.title = `Open ${p.ref}`
    a.onclick = () => thimble.navigate(p.ref)
    w.append(b, a)
    w.onmouseenter = () => setHover({ kind: 'place', tag: p.tag })
    w.onmouseleave = () => setHover(null)
    tr.append(w)
  }
  const rsel = document.getElementById('agent')
  rsel.innerHTML = `<option value="">${group === 'sig' ? 'All rows' : 'All accounts'}</option>` + rowsList.map((r) => `<option value="${esc(r.key)}">${esc(r.name)} (${r.n})</option>`).join('')
  rsel.value = F.row
  const ty = document.getElementById('types')
  ty.innerHTML = ''
  for (const t of types()) {
    const n = D.links.filter((x) => x.type === t).length
    const b = h('button', `chip chip-act chip-sans chip-tone-neutral${F.types.has(t) ? ' active' : ''}`)
    const sw = h('i', 'sw')
    sw.style.background = TYPE_VIZ[t] ? token(`--viz-${TYPE_VIZ[t]}`) : token('--viz-ink-2')
    b.append(sw, t, h('span', 'n', String(n)))
    b.title = `${plural(n, `${t} link`)}\nClick: only this type · Shift-click: add it`
    b.onclick = (e) => { toggleSet(F.types, t, e.shiftKey); refresh() }
    ty.append(b)
  }
  for (const o of document.querySelectorAll('#near .seg-opt')) o.classList.toggle('active', (o.dataset.v === '1') === near)
  for (const o of document.querySelectorAll('#zoom .seg-opt')) o.classList.toggle('active', String(zoom) === o.dataset.v)
  for (const o of document.querySelectorAll('#group .seg-opt')) o.classList.toggle('active', o.dataset.v === group)
  document.getElementById('rowcap').textContent = group === 'sig' ? 'Signed name · accounts' : 'Account · goal'
  document.getElementById('clear').hidden = !filtered()
  const fc = document.getElementById('fromcard')
  fc.hidden = CARD || !fromCard
  if (fromCard) {
    fc.innerHTML = `<span class="t">${esc(fromCard.title || `card:${fromCard.card}`)}</span>${CLOSE}`
    fc.title = `Drawn by the arguments of card:${fromCard.card}\nClick: all records`
    fc.dataset.anchor = `card:${fromCard.card}`
  }
  const pager = document.getElementById('pager')
  pager.hidden = D.total <= D.page
  document.getElementById('span').textContent = D.cards.length ? `${fmt(D.offset + 1)}–${fmt(D.offset + D.cards.length)} of ${fmt(D.total)}` : ''
  document.getElementById('prev').disabled = D.offset <= 0
  document.getElementById('next').disabled = D.offset + D.cards.length >= D.total
  const on = labelState.labels
  const cname = on.length ? on.map((l) => l.name).join(', ') : 'none on'
  const sws = on.slice(0, 4).map((l) => `<i class="sw" style="width:5px;border-radius:1px;background:${esc(l.colour)}"></i>`).join('')
  const cb = document.getElementById('cbtn')
  cb.innerHTML = `<span class="k">Labels</span><span style="display:inline-flex;gap:2px">${sws}</span>${esc(cname)}${CARET}`
  const ids = on.map((l) => l.id).filter(Boolean).join(' ')
  if (ids) cb.dataset.label = ids
  else delete cb.dataset.label
  renderLegend()
}
function toggleSet(set, x, add) {
  if (add) set.has(x) ? set.delete(x) : set.add(x)
  else if (set.size === 1 && set.has(x)) set.clear()
  else { set.clear(); set.add(x) }
}
// while a label is on: its values with the records each marks, a click hiding that value's cards or showing them again
// (shift-click keeping only them), a value's swatch opening thimble's palette
function renderLegend() {
  const el = document.getElementById('legend')
  el.hidden = !labelsOn()
  el.innerHTML = ''
  if (el.hidden) return
  const same = (a, b) => a.label === b.label && a.value === b.value
  const kept = (m) => !only.length || only.some((o) => same(o, m))
  const held = (m) => !(D.only || []).length || D.only.some((o) => same(o, m))
  // a card lists only the values it holds records of
  const shown = D.marks.filter((m, j) => !CARD || ((D.mark_counts || [])[j] && held(m)))
  const all = CARD ? (D.only || []).slice() : []
  D.marks.forEach((m, j) => {
    if (!shown.includes(m)) return
    const label = (labelState.all || labelState.labels).find((l) => l.name === m.label)
    const it = h('span', `lg${kept(m) ? '' : ' off'}`)
    if (label && label.id) it.dataset.label = label.id
    it.title = kept(m) ? 'Click: hide these cards · Shift-click: only these' : 'Click: show these cards · Shift-click: only these'
    it.append(swatch(markColour(m), label, m.value), h('span', null, new Set(D.marks.map((x) => x.label)).size > 1 ? `${m.label}: ${m.value}` : m.value), h('span', 'n', fmt((D.mark_counts || [])[j] || 0)))
    it.onclick = async (e) => {
      const one = { label: m.label, value: m.value }
      const cur = shown.filter(kept).map((x) => ({ label: x.label, value: x.value }))
      let next
      if (e.shiftKey) next = cur.length === 1 && same(cur[0], one) ? shown : [one]
      else next = kept(m) ? cur.filter((o) => !same(o, one)) : [...cur, one]
      if (!next.length) return
      only = next.length === shown.length ? all : next.map((o) => ({ label: o.label, value: o.value }))
      offset = 0
      sel = null
      if (await load()) refresh()
    }
    el.append(it)
  })
  if (CARD && D.unmarked) {
    const it = h('span', 'lg')
    const sw = h('i', 'sw')
    sw.style.background = token('--label-none')
    it.append(sw, h('span', null, 'no highlighted value'), h('span', 'n', fmt(D.unmarked)))
    el.append(it)
  }
}
function swatch(colour, label, value) {
  const sw = h('i', 'sw')
  sw.style.background = colour
  if (!label || !label.id || !(labelState.palette || []).length || !thimble.setLabelColour) return sw
  const b = h('span', 'swb')
  b.setAttribute('role', 'button')
  b.title = 'Change colour'
  b.dataset.act = 'palette'
  b.dataset.id = label.id
  b.dataset.value = value
  b.append(sw)
  b.onclick = (e) => { e.stopPropagation(); openPalette(label.id, value, 'legend') }
  return b
}

document.getElementById('q').addEventListener('input', (e) => { q = e.target.value.trim().toLowerCase(); refresh() })
document.getElementById('agent').addEventListener('change', (e) => { F.row = e.target.value; refresh() })
document.getElementById('near').addEventListener('click', (e) => { const o = e.target.closest('.seg-opt'); if (o) { near = o.dataset.v === '1'; refresh() } })
document.getElementById('zoom').addEventListener('click', (e) => { const o = e.target.closest('.seg-opt'); if (o) { zoom = o.dataset.v === 'fit' ? 'fit' : 1; refresh() } })
document.getElementById('group').addEventListener('click', (e) => {
  const o = e.target.closest('.seg-opt')
  if (!o || o.dataset.v === group) return

// lanes: a card that would overlap the last card of every lane so far in its row starts a lane below them
function stackLanes(cards0, cards, nRows) {
  const lanes = Array.from({ length: nRows }, () => [])
  const laneH = Array.from({ length: nRows }, () => [])
  for (const c of cards0) {
    const k = cards.get(c.id)
    const ls = lanes[k.row]
    let j = ls.findIndex((right) => right + CARD_GAP <= k.x)
    if (j < 0) { j = ls.length; ls.push(0); laneH[k.row].push(0) }
    ls[j] = k.x + k.w
    laneH[k.row][j] = Math.max(laneH[k.row][j], k.h)
    k.lane = j
  }
  return laneH
}
// rows and gaps top to bottom, the bands and row heads placed, the cards placed in their lanes; {gapTop, plotH}
function placeRows(rowKeys, cells, cellH, laneH, gapH, cards, plot, rows, pad) {
  let y = 0
  const gapTop = [], rowTop = []
  rowKeys.forEach((key, i) => {
    gapTop[i] = y
    y += gapH[i]
    rowTop[i] = y
    const inner = laneH[i].reduce((sum, hh) => sum + hh, 0) + LANE_GAP * Math.max(0, laneH[i].length - 1)
    y += Math.max(cellH[i], inner + 2 * pad)
  })
  gapTop[rowKeys.length] = y
  y += gapH[rowKeys.length]
  const plotH = Math.max(y, 40)
  plot.style.height = `${plotH}px`
  rows.style.height = `${plotH}px`
  // bands: each row from the middle of the gap above it to the middle of the gap below it
  rowKeys.forEach((key, i) => {
    const top = i === 0 ? 0 : gapTop[i] + gapH[i] / 2
    const bottom = i === rowKeys.length - 1 ? plotH : gapTop[i + 1] + gapH[i + 1] / 2
    const band = h('div', `band${i % 2 ? ' odd' : ''}`)
    band.style.top = `${top}px`
    band.style.height = `${bottom - top}px`
    plot.prepend(band)
    const el = cells[i]
    el.classList.toggle('odd', i % 2 === 1)
    el.style.top = `${top}px`
    el.style.height = `${bottom - top}px`
    el.style.paddingTop = `${rowTop[i] - top + pad - 2}px`
    el.style.visibility = ''
  })
  for (const k of cards.values()) {
    const offs = laneH[k.row].slice(0, k.lane).reduce((sum, hh) => sum + hh + LANE_GAP, 0)
    k.y = rowTop[k.row] + pad + offs
    k.el.style.top = `${k.y}px`
    k.el.style.visibility = ''
  }
  return { gapTop, plotH }
}
// tracks of their own for the items {span: [a, b]} that overlap, each item's `track` set; the number of tracks
function packTracks(items) {
  items.sort((p, p2) => p.span[0] - p2.span[0] || p.span[1] - p2.span[1])
  const ends = []
  for (const r of items) {
    let t = ends.findIndex((e) => e <= r.span[0])
    if (t < 0) { t = ends.length; ends.push(0) }
    ends[t] = r.span[1]
    r.track = t
  }
  return ends.length
}
function layout(v) {
  const M = metrics()

  const empty = document.getElementById('empty')

      : labelState.labels.length ? 'No record of these files takes a highlighted value of the labels that are on.'

    col.style.left = `${colX(i)}px`

  })

  rows.style.height = '1px'

  // cards, measured at their width

  for (const c of cards0) {

  }

  const bandOf = (k) => [k.x + (CW - W) + 6, k.x + W - 6]
  const ends = new Map()
  const routes = v.links.map((x) => {
    const S = cards.get(x.from), T = cards.get(x.to)
    const gap = T.row < S.row ? T.row + 1 : T.row
    const r = { x, S, T, gap, sSide: gap <= S.row ? 'top' : 'bottom', tSide: gap > T.row ? 'bottom' : 'top' }
    for (const [card, other] of [[S, T], [T, S]]) {

    const x0 = (b0 + b1) / 2 - (step * (list.length - 1)) / 2

    g.append(s('path', { class: 'ln', d, stroke: colour, 'stroke-dasharray': DASH[r.x.type] || null }))
    g.append(s('circle', { class: 'end', cx: r.xs, cy: ys, r: 2.6, fill: colour }))
    const dir = r.tSide === 'top' ? 1 : -1
    g.append(s('path', { class: 'end', d: `M${r.xt - 4},${yt - dir * 7}L${r.xt},${yt - dir * 0.5}L${r.xt + 4},${yt - dir * 7}Z`, fill: colour }))
    g.append(linkHit(d, r.x))

    const lb = h('span', 'lbl', r.label)
    lb.title = r.x.reason
    lb.style.left = `${r.lx}px`
    lb.style.top = `${ty - 7}px`
    lb.style.color = colour
    lb.onmouseenter = () => setHover({ kind: 'link', key: r.x.key })

  for (const { lb } of linkEls.values()) plot.append(lb)

  applyZoom()
}

// As a card, the chart fits the card's width. Its records fall into as many columns as fit, in event order, the cards

// whose records lie in different columns share a band. Each column has a corridor at its right that no card or head
// reaches, which carries the vertical runs of the links: a link leaves its source's right side, runs up or down its
// corridor, along the gap next to its target's band when the target is in another column, and down that column's

function layoutCard(v) {

  const colOf = new Map(cards0.map((c, i) => [c.id, Math.floor((i * nCols) / cards0.length)]))
  const rowKeys = rowsList.map((r) => r.key).filter((k) => cards0.some((c) => rowOfCard.get(c.id) === k))
  const rowIdx = new Map(rowKeys.map((k, i) => [k, i]))

    const times = cards0.filter((c) => colOf.get(c.id) === j).map((c) => parseTime(c.time)).filter(Boolean)
    const col = h('div', `col${times.length ? '' : ' none'}`)

function orth(pts, rad) {
  const p = pts.filter((pt, i) => i === 0 || pt[0] !== pts[i - 1][0] || pt[1] !== pts[i - 1][1])

    const [ax, ay] = p[i - 1], [bx, by] = p[i], [cx, cy] = p[i + 1]
    const r1 = Math.min(rad, Math.hypot(bx - ax, by - ay) / 2, Math.hypot(cx - bx, cy - by) / 2)
    const ux = Math.sign(bx - ax), uy = Math.sign(by - ay), vx = Math.sign(cx - bx), vy = Math.sign(cy - by)
    d += `L${bx - ux * r1},${by - uy * r1}Q${bx},${by} ${bx + vx * r1},${by + vy * r1}`
  }
  const last = p[p.length - 1]
  return d + `L${last[0]},${last[1]}`
}

// ---------------------------------------------------------------- focus: what hover or the selection lights
function neighbourhood(f) {
  const cardsLit = new Set(), linksLit = new Set(), rowsLit = new Set()
  const addLink = (x) => { linksLit.add(x.key); cardsLit.add(x.from); cardsLit.add(x.to) }
  if (f.kind === 'card' && byId.has(f.id)) { cardsLit.add(f.id); for (const x of linksOf.get(f.id)) addLink(x) }
  else if (f.kind === 'link') { const x = D.links.find((y) => y.key === f.key); if (x) addLink(x) }
  else if (f.kind === 'row') { rowsLit.add(f.key); for (const c of D.cards) if (rowOfCard.get(c.id) === f.key) { cardsLit.add(c.id); for (const x of linksOf.get(c.id)) addLink(x) } }
  else if (f.kind === 'place') { for (const c of D.cards) if (c.tag === f.tag) cardsLit.add(c.id); for (const x of D.links) if (cardsLit.has(x.from) && cardsLit.has(x.to)) linksLit.add(x.key) }
  else if (f.kind === 'record') { for (const c of D.cards) if (c.account === f.account) cardsLit.add(c.id) }
  for (const id of cardsLit) { const c = byId.get(id); if (c) rowsLit.add(rowOfCard.get(id)) }
  return { cardsLit, linksLit, rowsLit }
}
function setHover(f) { hover = f; applyFocus() }
function applyFocus() {

  document.getElementById('grid').classList.toggle('focus', !!f)
  const n = f ? neighbourhood(f) : { cardsLit: new Set(), linksLit: new Set(), rowsLit: new Set() }
  for (const [id, k] of L.cards) {
    k.el.classList.toggle('lit', n.cardsLit.has(id))
    k.el.classList.toggle('sel', !!sel && sel.kind === 'card' && sel.id === id)
  }
  for (const [key, { g, lb }] of L.linkEls) { g.classList.toggle('lit', n.linksLit.has(key)); if (lb) lb.classList.toggle('lit', n.linksLit.has(key)) }
  for (const [key, el] of L.cells) {
    el.classList.toggle('lit', n.rowsLit.has(key))
    el.classList.toggle('sel', !!sel && sel.kind === 'row' && sel.key === key)
  }
}

// ---------------------------------------------------------------- selection and the detail beside the chart
function select(f, { reveal = true } = {}) {

}
function revealSel() {
  if (!L || !sel) return
  let box = null

  else if (sel.kind === 'link') {
    const x = D.links.find((y) => y.key === sel.key)
    const a = x && L.cards.get(x.from), b = x && L.cards.get(x.to)
    if (a && b) box = { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.max(a.x + a.w, b.x + b.w) - Math.min(a.x, b.x), h: Math.max(a.y + a.h, b.y + b.h) - Math.min(a.y, b.y) }
  } else if (sel.kind === 'row') {
    const own = [...L.cards.values()].filter((k) => rowOfCard.get(k.c.id) === sel.key)
    if (own.length) box = { x: own[0].x, y: own[0].y, w: own[0].w, h: own[0].h }

function revealBox(box, behavior = 'smooth') {
  if (!box) return
  const chart = document.getElementById('chart')
  const z = parseFloat(document.getElementById('grid').style.zoom || '1') || 1
  const M = metrics()
  const det = document.getElementById('detail')
  const over = !det.hidden && getComputedStyle(det).position === 'absolute' ? Math.min(det.offsetWidth, chart.clientWidth * 0.6) : 0
  const viewW = Math.max(120, (chart.clientWidth - over) / z - M.AGW), viewH = chart.clientHeight / z - HEAD_H

  let nx = left, ny = top
  if (box.x < left + 12 || box.x + Math.min(box.w, viewW) > left + viewW - 12) nx = Math.max(0, box.x - Math.max(24, (viewW - box.w) / 2))

}

// arrows step through the shown cards in event order; Escape closes the detail

// in a card, the call's arguments what the analyst narrowed here would set: {} while it shows what the card stored
function reportQuery() {

  const key = (xs) => JSON.stringify((xs || []).map((o) => `${o.label}\u0000${o.value}`).sort())
  if (key(only) !== key(D.only)) patch.only = only.length ? only.map((o) => ({ label: o.label, value: o.value })) : null

// in a card, the links of the records the Files filter dims are dimmed too, and a new filter scrolls the chart to the

function afterDrops(scroll) {
  if (!L) return
  const dropped = new Set([...L.cards.values()].filter((k) => k.el.hasAttribute('data-thimble-drop')).map((k) => k.c.id))
  for (const { g, lb, x } of L.linkEls.values()) {

  const first = scroll && dropped.size ? [...L.cards.values()].find((k) => !dropped.has(k.c.id)) : null

// a card's page asks for the height its chart needs; thimble fits the frame to it within the card's range

function applyTarget(t) {
  if (!t) return

  if (card) select({ kind: 'card', id: card.id })

// a view opened from a card ({card, title, args}): the card's arguments choose the records and links, set the grouping
// and the legend; null drops them. True when they differ from those the view was last opened with
function applyQuery(qy) {
  const key = qy && qy.args ? JSON.stringify(qy) : ''
  if (key === baseKey) return false
  baseKey = key
  base = {}
  const a = (key && qy.args) || {}
  fromCard = key ? { card: String(qy.card || ''), title: String(qy.title || '') } : null
  for (const k of ['within', 'accounts', 'places', 'links', 'edges']) if (a[k] != null) base[k] = a[k]
  group = a.rows === 'signature' ? 'sig' : 'account'
  only = Array.isArray(a.only) ? a.only.filter((o) => o && o.label && o.value).map((o) => ({ label: o.label, value: o.value })) : []
  offset = 0
  sel = null

}
async function start() {

thimble.onOpen(async (place) => {

  if (place && 'query' in place && applyQuery(place.query)) {

  const again = t && t.ref && t.ref !== keepRef
  if (t && t.ref) keepRef = t.ref

thimble.onLabels(async (state) => {

  if (OV) return ovLabels()

    const fk = JSON.stringify(labelState.filter)

// ---------------------------------------------------------------- the overview (the view; a card draws the chart above)
// Every record the view reads, counted per time bin: totals, a strip per place and a row per account (the busiest, the
// rest in one row each), shaded by count and coloured by the labels that are on, the filter's dropped records left
// out of the shade. Drag across the rows to zoom into that time; click a place's name to count the accounts over its
// records alone, a cell for its records beside the rows, a record for the record. Rows and places carry their unit keys
// and listed records their refs as data-anchor, so thimble marks them.
const OV = !CARD

function ovQuery() {
  const plot = document.getElementById('ov').clientWidth - OV_LABEL - 90
  const bins = Math.max(12, Math.min(480, Math.floor(plot / OV_CELL)))
  const q = { ...ovBase, op: 'overview', bins }
  for (const k of ['run', 'from', 'to', 'place', 'q', 'pin']) if (ovq[k] != null && ovq[k] !== '') q[k] = ovq[k]

async function ovLoad() {

const ovWhen = (t) => { const d = new Date(t * 1000); return `${dayOf(d)} ${hmOf(d)}` }

}

function ovRow(kind, row, max, rest) {

function ovDraw(cv) {
  const { row, max } = cv._row
  const nb = O.bins + (O.untimed && !O.zoomed ? 1 : 0)
  const w = cv.clientWidth, hh = cv.clientHeight
  const dpr = devicePixelRatio || 1
  cv.width = Math.round(w * dpr)
  cv.height = Math.round(hh * dpr)
  const g = cv.getContext('2d')
  g.scale(dpr, dpr)
  g.clearRect(0, 0, w, hh)
  const cw = w / Math.max(1, nb)
  g.fillStyle = token('--track-bg') || 'rgba(0,0,0,.04)'
  g.fillRect(0, 0, w, hh)
  const ink = token('--viz-ink-1') || token('--text-primary')
  const filt = !!labelState.filter
  for (const c of row.cells) {
    const v = filt ? c.k : c.n
    const x = c.b * cw
    if (!v) {
      if (c.n) { g.strokeStyle = ink; g.globalAlpha = 0.25; g.strokeRect(x + 0.5, 1.5, Math.max(1, cw - 1.5), hh - 3) }
      continue
    }
    const a = 0.18 + 0.82 * Math.sqrt(v / Math.max(1, max))
    let col = ink
    if (c.m && c.m.length) {
      let best = c.m[0]
      for (const m of c.m) if (m[1] > best[1]) best = m
      col = markColour(O.marks[best[0]])
    }
    g.globalAlpha = a
    g.fillStyle = col
    g.fillRect(x, 1, Math.max(1, cw - (cw > 3 ? 1 : 0)), hh - 2)
  }
  g.globalAlpha = 1
}
function ovAxis() {
  const cv = document.getElementById('ovaxis')
  const w = cv.clientWidth, hh = cv.clientHeight
  const dpr = devicePixelRatio || 1
  cv.width = Math.round(w * dpr)
  cv.height = Math.round(hh * dpr)
  const g = cv.getContext('2d')
  g.scale(dpr, dpr)
  g.clearRect(0, 0, w, hh)
  if (!O.window) return
  const nb = O.bins + (O.untimed && !O.zoomed ? 1 : 0)
  const cw = w / Math.max(1, nb)
  g.font = `400 10.5px ${token('--font-mono') || 'monospace'}`
  g.fillStyle = token('--text-tertiary')
  g.strokeStyle = token('--border-hairline')
  const every = Math.max(1, Math.ceil(90 / cw))
  let lastDay = ''
  for (let b = 0; b < O.bins; b += every) {
    const t = O.start + b * O.step
    const d = new Date(t * 1000)
    const day = dayOf(d)
    const text = day !== lastDay || O.step >= 86400 ? `${day}${O.step < 86400 ? ` ${hmOf(d)}` : ''}` : hmOf(d)
    lastDay = day
    g.beginPath()
    g.moveTo(b * cw + 0.5, hh - 5)
    g.lineTo(b * cw + 0.5, hh)
    g.stroke()
    g.fillText(text, b * cw + 3, hh - 7)
  }
  if (nb > O.bins) g.fillText('no time', O.bins * cw + 2, hh - 7)

function ovRender() {

  const name = cv._row.rest ? `${fmt(cv._row.row.count)} others` : cv._row.row.name
  const when = b >= O.bins ? 'no time' : ovSpanText(O.start + b * O.step, O.start + (b + 1) * O.step)
  cv.title = `${name} · ${when}\n${c ? plural(c.n, 'record') : 'no record'}${c && labelState.filter ? ` · ${fmt(c.k)} kept` : ''}`
})
document.getElementById('ovrows').addEventListener('pointerup', async (e) => {
  if (!ovDrag) return
  const d = ovDrag
  ovDrag = null
  document.getElementById('ovband').hidden = true
  const b1 = ovBinAt(d.cv, e.clientX)
  if (d.moved && O.window) {
    const lo = Math.min(d.b0, b1), hi = Math.min(O.bins - 1, Math.max(d.b0, b1))
    if (lo >= O.bins) return
    ovq.from = O.start + lo * O.step
    ovq.to = O.start + (hi + 1) * O.step
    await ovReload()
    return
  }
  const { kind, row, rest } = d.cv._row
  if (row.cells.some((x) => x.b === d.b0)) ovOpenBin(kind, row, rest, d.b0)
})

// details on demand: a cell's or a row's records, then one record
function ovBinQuery(kind, row, rest, b) {
  const q = { ...ovBase, op: 'bin' }
  for (const k of ['run', 'from', 'to']) if (ovq[k] != null) q[k] = ovq[k]
  if (O.place && kind === 'account') q.place = O.place
  const names = (list) => list.map((x) => x.name)
  if (rest) q[kind === 'place' ? 'except_places' : 'except_accounts'] = names(kind === 'place' ? O.places : O.accounts)
  else q[kind === 'place' ? 'places' : 'accounts'] = [row.name]
  if (kind === 'account' && !rest && ovBase.accounts) q.accounts = [row.name]
  if (b != null && b >= O.bins) q.untimed = true
  else if (b != null) { q.from = O.start + b * O.step; q.to = O.start + (b + 1) * O.step }
  return q
}
function ovOpenBin(kind, row, rest, b) {
  const name = rest ? `${fmt(row.count)} other ${kind === 'place' ? 'places' : 'accounts'}` : row.name
  const when = b == null ? (O.window ? ovSpanText(O.window[0], O.window[1]) : '') : b >= O.bins ? 'no time' : ovSpanText(O.start + b * O.step, O.start + (b + 1) * O.step)
  ovDetail = { kind: 'bin', query: ovBinQuery(kind, row, rest, b), title: name, when, anchor: rest ? null : `view:${slug}/${kind === 'place' ? 'place' : 'agent'}/${row.name.replace(/ /g, '%20')}`, offset: 0 }
  ovRenderDetail()
}
function ovClose() { ovDetail = null; ovRenderDetail() }
function ovTop(chips, ref, back) {
  const top = h('div', 'd-top')
  if (back) {
    const bk = h('button', 'btn btn-ghost btn-sm', '‹ Records')
    bk.onclick = () => { ovDetail = back; ovRenderDetail() }
    top.append(bk)
  }
  for (const c of chips) top.append(c)
  top.append(h('span', 'grow'))
  if (ref) {
    const open = h('button', 'btn btn-secondary btn-sm')
    open.innerHTML = `${OPEN}Open record`
    open.title = `Open ${ref} in thimble`
    open.onclick = () => thimble.navigate(ref)
    top.append(open)
  }
  const x = h('button', 'btn btn-ghost btn-sm')
  x.innerHTML = CLOSE
  x.title = 'Close'
  x.setAttribute('aria-label', 'Close')
  x.onclick = ovClose
  top.append(x)
  return top
}
async function ovRenderDetail() {
  const box = document.getElementById('detail')
  box.hidden = !ovDetail
  box.replaceChildren()
  delete box.dataset.anchor
  if (!ovDetail) return
  const mine = ovDetail
  if (mine.kind === 'bin') {
    box.append(ovTop([]))
    const hd = h('p', 'd-h', mine.title)
    if (mine.anchor) hd.dataset.anchor = mine.anchor
    box.append(hd, h('p', 'd-when', mine.when))
    const list = h('div', 'ovlist')
    list.append(h('div', 'skel'))
    box.append(list)
    let data
    try { data = await thimble.fetch({ ...mine.query, offset: mine.offset }) } catch (e) { list.replaceChildren(h('p', 'd-when', String(e && e.message ? e.message : e))); return }
    if (ovDetail !== mine) return
    list.replaceChildren(sec('Records', `${fmt(data.offset + 1)}–${fmt(data.offset + data.records.length)} of ${fmt(data.total)}`))
    for (const r of data.records) {
      const row = h('div', 'arow ovrec')
      row.dataset.anchor = r.ref
      const tg = h('span', 'tg', r.time ? hmOf(new Date(r.time)) : '—')
      if (r.m >= 0 && O.marks[r.m]) tg.style.color = markColour(O.marks[r.m])
      const who = h('span', 'who', mine.query.accounts ? r.place : r.account)
      row.append(tg, who, h('span', 'x', r.line))
      row.title = `${r.account} · ${r.place}\n${whenOf(r.time)}\n${r.line}`
      row.onclick = () => { ovDetail = { kind: 'record', ref: r.ref, back: mine }; ovRenderDetail() }
      list.append(row)
    }
    const pager = h('div', 'd-top')
    if (data.offset > 0) { const p = h('button', 'btn btn-ghost btn-sm', 'Earlier'); p.onclick = () => { mine.offset = Math.max(0, data.offset - data.records.length); ovRenderDetail() }; pager.append(p) }
    if (data.offset + data.records.length < data.total) { const n = h('button', 'btn btn-ghost btn-sm', 'Later'); n.onclick = () => { mine.offset = data.offset + data.records.length; ovRenderDetail() }; pager.append(n) }
    if (pager.childNodes.length) list.append(pager)
    return
  }
  box.dataset.anchor = mine.ref
  box.append(ovTop([], mine.ref, mine.back))
  const body = h('div')
  body.append(h('div', 'skel'))
  box.append(body)
  const rec = await recordOf(mine.ref)
  if (ovDetail !== mine) return
  if (rec.account || rec.time) {
    const hd = h('p', 'd-h', rec.account || '')
    if (rec.account) hd.dataset.anchor = `view:${slug}/agent/${String(rec.account).replace(/ /g, '%20')}`
    box.insertBefore(hd, body)
    box.insertBefore(h('p', 'd-when', [whenOf(rec.time), rec.place].filter(Boolean).join(' · ')), body)
  }
  renderRecordInto(body, rec)
}

// a view opened from a card ({card, title, args}) counts the records its arguments choose; null drops them
function ovApplyQuery(qy) {
  const key = qy && qy.args ? JSON.stringify(qy) : ''
  if (key === ovBaseKey) return false
  ovBaseKey = key
  ovBase = {}
  const a = (key && qy.args) || {}
  ovFrom = key ? { card: String(qy.card || ''), title: String(qy.title || '') } : null
  for (const k of ['within', 'accounts', 'places']) if (a[k] != null) ovBase[k] = a[k]
  if (a.account) { ovBase.accounts = [a.account]; ovq.pin = a.account }
  ovq.from = ovq.to = null
  ovq.place = null
  ovDetail = null
  return true
}
async function ovOpen(place) {
  const t = (place && place.target) || null
  let again = false
  if (place && 'query' in place) again = ovApplyQuery(place.query)
  if (t && t.account && t.account !== ovq.pin) { ovq.pin = t.account; again = true }
  if (t && t.place && !t.ref && t.place !== ovq.place) { ovq.place = t.place; again = true }
  if (again || !O) { if (!(await ovLoad())) return; ovRender() }
  if (t && t.ref) { ovDetail = { kind: 'record', ref: t.ref, back: null }; ovRenderDetail() }
  else if (t && t.account) {
    const row = O.accounts.find((r) => r.name === t.account)
    if (row) ovOpenBin('account', row, false, null)
  }
}
async function ovLabels() {
  if (!O) return
  const was = JSON.stringify([O.marks, O.mark_counts])
  if (!(await ovLoad())) return
  if (JSON.stringify([O.marks, O.mark_counts]) === was) ovRedraw()
  else ovRender()
  renderPop()
}
function ovWatchRuns() {
  clearTimeout(ovRunT)
  if (!(labelState.all || []).some((l) => l.on && l.count == null)) return
  ovRunT = setTimeout(async () => { if (await ovLoad()) ovRedraw(); ovWatchRuns() }, RUN_POLL_MS)
}
let ovQT = null
if (OV) {
  document.body.classList.add('ov')
  const bar = document.getElementById('ovbarrow')
  bar.append(document.getElementById('legend'))
  document.getElementById('q').placeholder = 'Search accounts'
  document.getElementById('q').setAttribute('aria-label', 'Search accounts')
  document.getElementById('q').addEventListener('input', (e) => {
    clearTimeout(ovQT)
    ovQT = setTimeout(async () => { ovq.q = e.target.value.trim(); await ovReload() }, 250)
  })
  let ovResizeT = null
  addEventListener('resize', () => { clearTimeout(ovResizeT); ovResizeT = setTimeout(() => ovReload(), 200) })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ovDetail && !menu && !pal) ovClose() })
}

if (CARD) {
  let marksT = null
  thimble.onMarks(() => { if (D && marksT == null) marksT = requestAnimationFrame(() => { marksT = null; refresh() }) })
  thimble.onInit((init) => {
    mode = init.mode
    document.body.classList.toggle('full', mode === 'full')
    stored = init.args || {}
    if (D && init.key && init.key === drawnKey) {
      refresh()
      requestAnimationFrame(() => thimble.settled())
      return
    }
    drawnKey = init.key
    D = init.data
    group = D.rows_by === 'sig' ? 'sig' : 'account'
    only = (D.only || []).slice()
    sel = null
    F.row = ''
    F.places.clear()
    F.types.clear()
    q = ''
    document.getElementById('q').value = ''
    index()
    refresh()
    // the chart opens at its first card a label marks, so the card first shows what its labels found
    const first = labelsOn() && L ? [...L.cards.values()].find((k) => k.c.m >= 0) : null
    if (first) revealBox({ x: first.x, y: first.y, w: first.w, h: first.h }, 'instant')
    updateMore()
    requestAnimationFrame(() => thimble.settled())
  })
} else ovReload()
</script>
