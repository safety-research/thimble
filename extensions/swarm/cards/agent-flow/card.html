<!doctype html>
<html>
<head>
<style>
  html, body { margin: 0; }
  body { background: var(--surface-card); padding: 2px 0 8px; }
  [hidden] { display: none !important; }
  #head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 0 2px 10px; }
  #who { font: 600 var(--text-sm) / 1.3 var(--font-body); color: var(--text-primary); }
  #nums { font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); color: var(--text-tertiary); }
  #goal { flex-basis: 100%; font: 400 var(--text-ui-sm) / 1.4 var(--font-body); color: var(--text-secondary); }
  #flow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 2.2fr) minmax(0, 1fr); column-gap: 10px; }
  .side { display: flex; flex-wrap: wrap; align-content: center; gap: 4px; padding: 6px 0; min-width: 0; }
  .side.l { justify-content: flex-end; }
  .side .chip { cursor: pointer; }
  .side .chip .k { width: 8px; height: 2px; flex: none; border-radius: 1px; }
  .side .chip.names .k { height: 0; border-top: 2px dashed; background: none !important; }
  .side .chip.same .k { height: 0; border-top: 2px dotted; background: none !important; }
  .side .more { font: 400 var(--text-mono-sm) / 22px var(--font-mono); color: var(--text-tertiary); }
  .mid { position: relative; padding: 5px 0; }
  .mid::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px solid var(--border-hairline); }
  .first .mid::before { top: 50%; }
  .last .mid::before { bottom: 50%; }
  .step { position: relative; box-sizing: border-box; padding: 6px 10px 7px; background: var(--surface-card); border: 1px solid rgba(var(--ink-rgb), .16); border-radius: var(--radius-ui); cursor: pointer; }
  .step:hover { border-color: rgba(var(--ink-rgb), .38); }
  .step .tick { position: absolute; left: -1px; right: -1px; top: -1px; height: 3px; border-radius: var(--radius-ui) var(--radius-ui) 0 0; }
  .step .hd { display: flex; flex-wrap: wrap; gap: 0 6px; font: 400 10.5px / 1.3 var(--font-mono); color: var(--text-tertiary); }
  .step .hd .pl { font-weight: 600; color: var(--text-primary); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .step .ln { margin-top: 3px; font: 500 12.5px / 1.36 var(--font-body); color: var(--text-primary); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .gap { grid-column: 2; text-align: center; font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); padding: 6px 0; position: relative; }
  .row { display: contents; }
  .row.dim > * { opacity: .35; }
</style>
</head>
<body>
<div id="head"><span id="who"></span><span id="nums"></span><span id="goal" hidden></span></div>
<div id="flow"></div>
<script>
// Agent flow: a step per run of one account's records on one place, top to bottom in time order. The chips left of a
// step are the other accounts' records it followed, those right the ones that followed it, each by link kind; a click
// on a chip or a step opens that record. A step carries its first record's ref as data-anchor, so thimble marks it.
const TYPE_VIZ = { reply: 1, names: 3, 'same place': 7 }
const MON = 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')
const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const fmt = (n) => Number(n).toLocaleString('en-US')
const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : many || one + 's'}`
const pad2 = (n) => String(n).padStart(2, '0')
function h(tag, cls, text) {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (text != null) e.textContent = text
  return e
}
function when(t) {
  const d = t ? new Date(t) : null
  return d && !Number.isNaN(d.getTime()) ? `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}` : 'Time unknown'
}
let D = null
let labelState = { labels: [], all: null }
function markColour(m) {
  const label = (labelState.all || labelState.labels || []).find((l) => l.name === m.label)
  const v = label && (label.values || []).find((x) => x.name === m.value)
  return (v && v.colour) || m.colour
}
function typeColour(t) { return TYPE_VIZ[t] ? token(`--viz-${TYPE_VIZ[t]}`) : token('--viz-ink-2') }

function chip(c) {
  const b = h('button', `chip chip-sans chip-tone-neutral chip-act ${c.kind === 'names' ? 'names' : c.kind === 'same place' ? 'same' : ''}`)
  const k = h('span', 'k')
  k.style.background = typeColour(c.kind)
  k.style.borderColor = typeColour(c.kind)
  b.append(k, h('span', null, c.n > 1 ? `${c.account} ×${c.n}` : c.account))
  b.title = `${c.kind}: ${c.account}${c.n > 1 ? `, ${c.n} links` : ''}`
  b.dataset.anchor = c.ref
  b.onclick = () => thimble.navigate(c.ref)
  return b
}
function side(cls, chips, more) {
  const d = h('div', `side ${cls}`)
  for (const c of chips) d.append(chip(c))
  if (more) d.append(h('span', 'more', `+${fmt(more)}`))
  return d
}
function draw() {
  document.getElementById('who').textContent = D.account
  document.getElementById('nums').textContent = [plural(D.records, 'record'), plural(D.places, 'place'),
    D.steps.length < D.steps_total ? `${D.steps.length} of ${plural(D.steps_total, 'step')}` : plural(D.steps_total, 'step')].join(' · ')
  const g = document.getElementById('goal')
  g.hidden = !D.goal
  g.textContent = D.goal || ''
  const flow = document.getElementById('flow')
  flow.replaceChildren()
  const filter = labelState.filter
  D.steps.forEach((s, i) => {
    if (s.gap) flow.append(h('div', 'gap', `${plural(s.gap, 'step')} more`))
    const row = h('div', `row${i === 0 ? ' first' : ''}${i === D.steps.length - 1 ? ' last' : ''}`)
    const mid = h('div', 'mid')
    const box = h('div', 'step')
    box.dataset.anchor = s.ref
    if (s.m.length) {
      const t = h('div', 'tick')
      t.style.background = markColour(D.marks[s.m[0][0]])
      box.append(t)
    }
    const hd = h('div', 'hd')
    hd.append(h('span', null, `${s.step}`), h('span', null, s.end ? `${when(s.time)} – ${when(s.end).split(' ').pop()}` : when(s.time)),
      h('span', 'pl', s.place), ...(s.n > 1 ? [h('span', null, `${s.n} ${s.kind}s`)] : []))
    box.append(hd, h('div', 'ln', s.line))
    box.title = s.title && s.title !== s.place ? s.title : ''
    box.onclick = () => thimble.navigate(s.ref)
    mid.append(box)
    row.append(side('l', s.left, s.left_more), mid, side('r', s.right, s.right_more))
    if (filter && thimble.markOf) {
      const mk = thimble.markOf(s.ref)
      if (mk && mk.keep === false) row.classList.add('dim')
    }
    flow.append(row)
  })
  if (D.gap_after) flow.append(h('div', 'gap', `${plural(D.gap_after, 'step')} more`))
}
thimble.onLabels((state) => {
  labelState = { labels: state.labels || [], all: state.all || null, filter: state.filter || null }
  if (D) draw()
})
thimble.onInit((init) => {
  D = init.data
  draw()
  requestAnimationFrame(() => thimble.settled())
})
thimble.onOpen((place) => {
  const t = place && place.target
  if (!t || !t.ref) return
  const el = document.querySelector(`.step[data-anchor="${CSS.escape(t.ref)}"]`)
  if (el) el.scrollIntoView({ block: 'center' })
})
</script>
</body>
</html>
