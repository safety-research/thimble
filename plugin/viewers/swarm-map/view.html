<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .chip, .btn, .seg, .table, .list-row) and the theme's tokens come with the frame; this page
     only lays them out */
  html, body { margin: 0; height: 100%; }
  [hidden] { display: none !important; }
  body { background: var(--surface-card); display: flex; flex-direction: column; overflow: hidden; }
  #bar { flex: none; padding: 10px 16px 8px; border-bottom: 1px solid var(--border-hairline); background: var(--surface-card); }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .row + .row { margin-top: 7px; }
  .grow { flex: 1 1 auto; }
  #title { flex: 1 1 260px; min-width: 0; margin: 0; font: 500 var(--text-sm) / 1.35 var(--font-body); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #q { flex: 0 1 220px; min-width: 120px; }
  #counts { font: 400 var(--text-xs) / 1.3 var(--font-body); color: var(--text-secondary); font-variant-numeric: tabular-nums; margin-right: 6px; white-space: nowrap; }
  .thr { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; margin-right: 8px; }
  .thr .chip { font-weight: 600; }
  .plink { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; font: 400 var(--text-xs) / 1.3 var(--font-body); color: var(--text-secondary); text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), .3); text-underline-offset: 2px; cursor: pointer; }
  .plink:hover { color: var(--text-primary); text-decoration-color: currentColor; }
  .chip .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); font-variant-numeric: tabular-nums; }
  .chip.active .n { color: inherit; opacity: .75; }
  .sw { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 2px; }
  select.field { field-sizing: content; max-width: 220px; }
  #types { gap: 4px; }
  .cap { font: 400 var(--text-xs) / 1 var(--font-body); color: var(--text-tertiary); }
  .ico { width: 12px; height: 12px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .cbtn { gap: 6px; padding: 0 7px 0 9px; }
  .cbtn .k { color: var(--text-tertiary); font-weight: 400; }
  .cbtn .ico { color: var(--text-tertiary); }
  #problems { margin: 7px 0 0; font: 400 var(--text-xs) / 1.4 var(--font-body); color: var(--status-warning); overflow-wrap: anywhere; }
  .lg { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px 0 4px; border-radius: var(--radius-chip); font: 400 var(--text-xs) / 1 var(--font-body); color: var(--text-secondary); cursor: pointer; }
  .lg:hover { background: var(--surface-hover); color: var(--text-primary); }
  .lg .n { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .lg.off { opacity: .38; }
  .swb { display: inline-grid; place-items: center; width: 16px; height: 16px; margin: 0 -4px; border-radius: 3px; flex: none; cursor: pointer; }
  .swb:hover { background: var(--track-bg); }

  main { flex: 1; min-height: 0; display: flex; position: relative; }
  #chart { flex: 1; min-width: 0; overflow: auto; position: relative; outline: none; }
  #grid { display: grid; width: max-content; min-width: 100%; }
  #corner { grid-area: 1 / 1; position: sticky; left: 0; top: 0; z-index: 6; background: var(--surface-card); border-right: 1px solid var(--border-hairline); border-bottom: 1px solid var(--border-hairline); box-sizing: border-box; padding: 10px 12px 0 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  #zoom .seg-opt { height: 20px; padding: 0 7px; }
  #cols { grid-area: 1 / 2; position: sticky; top: 0; z-index: 5; background: var(--surface-card); border-bottom: 1px solid var(--border-hairline); box-sizing: border-box; }
  #rows { grid-area: 2 / 1; position: sticky; left: 0; z-index: 4; background: var(--surface-card); border-right: 1px solid var(--border-hairline); box-sizing: border-box; }
  #plot { grid-area: 2 / 2; position: relative; }
  .hcap { font: 500 10.5px / 1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); white-space: nowrap; }
  #cols .hcap { position: absolute; left: 16px; top: 10px; }
  .col { position: absolute; top: 26px; font: 400 10.5px / 1.3 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-secondary); white-space: nowrap; }
  .col .d { color: var(--text-tertiary); }
  .col.none { color: var(--text-tertiary); }
  .band { position: absolute; left: 0; right: 0; }
  .band.odd { background: rgba(var(--ink-rgb), .022); }

  .agent { position: absolute; left: 0; right: 0; box-sizing: border-box; padding: 0 12px 0 16px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .agent:hover .nm, .agent.sel .nm { text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), .35); text-underline-offset: 2px; }
  .agent.odd { background: rgba(var(--ink-rgb), .022); }
  .av { flex: none; width: 28px; height: 28px; border-radius: 7px; background: var(--track-bg); display: block; }
  .av rect { fill: var(--text-secondary); }
  .who { min-width: 0; flex: 1; }
  .who .nm { font: 600 var(--text-ui-sm) / 1.3 var(--font-body); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .goal { margin-top: 1px; font: 400 var(--text-xs) / 1.38 var(--font-body); color: var(--text-secondary); overflow-wrap: anywhere; }
  .who .sig { margin-top: 2px; font: 400 10.5px / 1.35 var(--font-mono); color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .card { position: absolute; box-sizing: border-box; padding: 7px 10px 8px; background: var(--surface-card); border: 1px solid rgba(var(--ink-rgb), .16); border-radius: var(--radius-ui); cursor: pointer; transition: opacity .12s, border-color .12s; }
  .card:hover { border-color: rgba(var(--ink-rgb), .38); }
  .card.sel { border-color: var(--text-primary); box-shadow: 0 0 0 1px var(--text-primary); }
  .card.ctx { border-style: dashed; }
  .card .hd { display: flex; align-items: baseline; gap: 6px; min-width: 0; font: 400 10.5px / 1.3 var(--font-mono); color: var(--text-tertiary); white-space: nowrap; }
  .card .hd .tag { font-weight: 600; color: var(--text-primary); }
  .card .hd .pg { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .card .ac { margin-top: 3px; font: 500 12.5px / 1.36 var(--font-body); color: var(--text-primary); overflow-wrap: anywhere; }
  .card .tick { position: absolute; left: -1px; right: -1px; top: -1px; height: 3px; border-radius: var(--radius-ui) var(--radius-ui) 0 0; }
  #links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #links .hit { pointer-events: stroke; stroke: transparent; stroke-width: 10; fill: none; cursor: pointer; }
  #links .ln { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; transition: opacity .12s; }
  #links .end { transition: opacity .12s; }
  .lbl { position: absolute; height: 14px; box-sizing: border-box; padding: 0 3px; border-radius: 3px; background: var(--surface-card); font: 500 10.5px / 14px var(--font-mono); white-space: nowrap; cursor: pointer; transition: opacity .12s; }
  .lbl:hover { text-decoration: underline; }
  .focus .card:not(.lit), .focus .agent:not(.lit) .who, .focus .agent:not(.lit) .av { opacity: .3; }
  .focus .lbl:not(.lit), .focus #links g:not(.lit) .ln, .focus #links g:not(.lit) .end { opacity: .1; }
  .focus #links g.lit .ln { stroke-width: 2.2; }

  #detail { flex: none; width: 380px; box-sizing: border-box; overflow: auto; border-left: 1px solid var(--border-hairline); background: var(--surface-card); padding: 12px 16px 28px; }
  #detail[hidden] { display: none; }
  .d-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .d-when { font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); color: var(--text-secondary); }
  .d-h { margin: 10px 0 0; font: 500 var(--text-lg) / 1.35 var(--font-body); color: var(--text-primary); overflow-wrap: anywhere; }
  .d-sub { margin: 4px 0 0; font: 400 var(--text-xs) / 1.45 var(--font-body); color: var(--text-secondary); overflow-wrap: anywhere; }
  .d-agent { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; cursor: pointer; }
  .d-agent .who .goal { font-size: var(--text-xs); }
  .d-quote { margin: 12px 0 0; padding: 2px 0 2px 10px; border-left: 2px solid rgba(var(--ink-rgb), .25); font: 400 var(--text-sm) / 1.45 var(--font-body); color: var(--text-primary); overflow-wrap: anywhere; white-space: pre-wrap; }
  .d-sec { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 6px; }
  .d-sec .t { font: 500 var(--text-ui-sm) / 1.2 var(--font-body); color: var(--text-primary); }
  .d-sec .n { font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); }
  .d-sec .grow + .btn { margin: -4px 0; }
  .lrow { display: grid; grid-template-columns: 8px auto 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; padding: 6px 6px; margin: 0 -6px; border-radius: var(--radius-ui); cursor: pointer; }
  .lrow:hover { background: var(--surface-hover); }
  .lrow .sw { align-self: center; }
  .lrow .k { font: 500 var(--text-mono-sm) / 1.3 var(--font-mono); white-space: nowrap; }
  .lrow .o { min-width: 0; font: 400 var(--text-xs) / 1.35 var(--font-body); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .r { grid-column: 2 / 4; font: 400 var(--text-xs) / 1.4 var(--font-body); color: var(--text-secondary); overflow-wrap: anywhere; }
  .arow { display: flex; align-items: baseline; gap: 8px; padding: 5px 6px; margin: 0 -6px; border-radius: var(--radius-ui); cursor: pointer; font: 400 var(--text-xs) / 1.35 var(--font-body); }
  .arow:hover { background: var(--surface-hover); }
  .arow .no { flex: none; width: 26px; font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); color: var(--text-tertiary); }
  .arow .tg { flex: none; font: 600 var(--text-mono-sm) / 1.3 var(--font-mono); }
  .arow .x { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
  .ev { padding: 6px 0; border-top: 1px solid var(--border-hairline); }
  .ev:first-of-type { border-top: 0; }
  .ev q { display: block; quotes: none; font: 400 var(--text-xs) / 1.45 var(--font-body); color: var(--text-primary); overflow-wrap: anywhere; }
  .ev .chip { margin-top: 4px; }
  .diff { margin: 0; font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); color: var(--text-primary); border: 1px solid var(--border-hairline); border-radius: var(--radius-ui); overflow: hidden; }
  .diff .h { padding: 3px 8px; background: rgba(var(--ink-rgb), .03); color: var(--text-tertiary); border-top: 1px solid var(--border-hairline); }
  .diff .h:first-child { border-top: 0; }
  .diff .l { display: flex; gap: 8px; padding: 0 8px; }
  .diff .l .g { flex: none; width: 8px; color: var(--text-tertiary); user-select: none; }
  .diff .l .t { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diff .l.del .t { color: var(--text-tertiary); text-decoration: line-through; text-decoration-color: rgba(var(--ink-rgb), .35); }
  .diff .l.add { background: rgba(var(--ink-rgb), .035); }
  mark { background: color-mix(in srgb, var(--viz-2) 30%, transparent); color: inherit; border-radius: 2px; }
  .text { margin: 0; max-height: 360px; overflow: auto; padding: 8px 10px; border: 1px solid var(--border-hairline); border-radius: var(--radius-ui); font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: minmax(70px, max-content) 1fr; gap: 3px 12px; margin: 0; }
  .facts dt { font: 400 var(--text-xs) / 1.45 var(--font-body); color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facts dd { margin: 0; min-width: 0; font: 400 var(--text-mono-sm) / 1.45 var(--font-mono); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skel { height: 60px; border-radius: var(--radius-ui); background: rgba(var(--ink-rgb), .04); }
  .menu { position: fixed; z-index: 50; min-width: 240px; max-width: 320px; padding: 4px; border-radius: var(--radius-card); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), .14); }
  .mh { padding: 8px 8px 4px; color: var(--text-tertiary); font: 400 10.5px / 1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; }
  .mi { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-chip); background: none; color: var(--text-primary); font: 400 var(--text-ui-sm) / 1 var(--font-body); text-align: left; cursor: pointer; }
  .mi:hover { background: var(--surface-hover); }
  .mi.sub { padding-left: 30px; color: var(--text-secondary); cursor: default; }
  .mi .ck { width: 14px; display: inline-grid; place-items: center; flex: none; }
  .mi .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mi .n { margin-left: auto; display: inline-flex; gap: 1px; color: var(--text-tertiary); font-size: var(--text-xs); flex: none; }
  .box { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--mark); box-sizing: border-box; }
  .box.on { background: var(--mark); }
  .msep { height: 1px; margin: 4px 0; background: var(--border-hairline); }
  .pal { position: fixed; z-index: 60; display: grid; grid-template-columns: repeat(7, 20px); gap: 6px; padding: 10px; border-radius: var(--radius-card); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), .14); }
  .pal button { width: 20px; height: 20px; padding: 0; border: 0; border-radius: 4px; cursor: pointer; }
  .pal button.cur { box-shadow: 0 0 0 2px var(--surface-card), 0 0 0 3.5px var(--text-primary); }
  #tip { position: fixed; z-index: 40; pointer-events: none; display: none; max-width: 320px; padding: 7px 9px; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-ui); box-shadow: 0 6px 18px rgba(var(--ink-rgb), .1); font: 400 var(--text-xs) / 1.45 var(--font-body); color: var(--text-primary); }
  #tip .m { font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-tertiary); }
  #tip .b { margin-top: 3px; color: var(--text-secondary); overflow-wrap: anywhere; }
  @media (max-width: 899px) {
    #detail { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 20; box-shadow: -8px 0 24px rgba(var(--ink-rgb), .08); }
  }
  @media (max-width: 560px) {
    #bar { padding: 8px 12px 6px; }
    #title { flex-basis: 100%; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    #q { flex: 1 1 120px; }
    /* the threads and the filters each keep to one row that scrolls sideways */
    #threads, #filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #threads > *, #filters > * { flex: none; }
    .plink { max-width: 170px; }
    #corner { padding-left: 10px; }
    .agent { padding: 0 6px 0 8px; gap: 6px; }
    .av { width: 20px; height: 20px; border-radius: 5px; }
    .who .nm { font-size: var(--text-xs); }
    .who .goal { font-size: 11px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .who .sig { display: none; }
    #detail { width: 100%; }
  }
</style>
</head>
<body>
<div id="bar">
  <div class="row">
    <p id="title"></p>
    <input id="q" class="field" type="search" placeholder="Search actions" aria-label="Search actions" autocomplete="off" spellcheck="false">
    <button id="cbtn" class="btn btn-secondary btn-sm cbtn" data-anchor-name="Colour"></button>
  </div>
  <div class="row" id="threads"></div>
  <div class="row" id="filters">
    <select id="agent" class="field" aria-label="Agent"></select>
    <select id="sig" class="field" aria-label="Signs as"></select>
    <div id="types" class="row"></div>
    <div id="near" class="seg seg-track" aria-label="Linked actions">
      <button class="seg-opt active" data-v="0">Matches</button><button class="seg-opt" data-v="1">With linked</button>
    </div>
    <button id="clear" class="btn btn-ghost btn-sm">Clear filters</button>
  </div>
  <div class="row" id="legend" hidden></div>
  <p id="problems" role="status" hidden></p>
</div>
<main id="main">
  <div id="chart" tabindex="0">
    <div id="grid">
      <div id="corner"><span class="hcap">Agent · goal</span>
        <div id="zoom" class="seg seg-track" aria-label="Zoom"><button class="seg-opt" data-v="fit">Fit</button><button class="seg-opt active" data-v="1">100%</button></div>
      </div>
      <div id="cols"></div>
      <div id="rows"></div>
      <div id="plot"></div>
    </div>
  </div>
  <aside id="detail" hidden></aside>
</main>
<div id="pop"></div>
<div id="tip"></div>
<script>
// Swarm map: a row per agent with its goal, a card per significant action in event order at its agent's row, and the
// typed links between actions, drawn from the map the reader serves. Columns follow event order, one action each, so
// their spacing is no measure of time; each is headed by its action's UTC time, or "Time unknown".
// Layout: a card spans more than its column, so cards of one agent that would overlap stack in a row's lanes. The part
// of a card no neighbouring column's card reaches, its band, carries the vertical runs of its links, and each link runs
// horizontally in the gap between rows next to its target, so no link crosses a card. A gap is as tall as the links it
// carries need, each on a track of its own with its label beside its source.
// Filters: agent, signature, thread, link type and search narrow the actions; "With linked" adds the actions one link
// away. Hovering a card, an agent, a link or a thread lights its neighbourhood. A click shows a card's record, an
// agent, a link or a cited record beside the chart; "Open record" opens it in thimble.
// Labels: the reader keeps only what the label filter keeps and hands each action its marks. While a label is on it is
// the colouring: cards take its values' colours, and links are drawn in ink, told apart by dash and label. Cards carry
// their record's ref as data-anchor, and agents, threads and links their unit keys, so thimble marks them.
const slug = (thimble.view && thimble.view.slug) || 'swarm-map'
const NS = 'http://www.w3.org/2000/svg'
const TYPE_VIZ = { reply: 1, support: 3, contradicts: 4, related: 2 } // the viz colour of each link type
const EXTRA_VIZ = [5, 6, 7] // the viz colours of types beyond those
const DASH = { reply: '', support: '', contradicts: '6 3', related: '1.5 3.5' }
const MON = 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')
const HEAD_H = 58 // the column header's height
const ROW_PAD = 10 // above and below a row's cards
const LANE_GAP = 8 // between a row's lanes
const GAP_MIN = 14 // a gap between rows that carries no link
const TRACK = 16 // a link's track in a gap
const CARD_GAP = 8 // between two cards in one lane
const PAD_L = 16, PAD_R = 28
const END_GAP = 8 // between two link ends on one card
const FIT_MIN = 0.35

const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const fmt = (n) => Number(n).toLocaleString('en-US')
const pad2 = (n) => String(n).padStart(2, '0')
const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
function h(tag, cls, text) {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (text != null) e.textContent = text
  return e
}
function s(tag, attrs) {
  const e = document.createElementNS(NS, tag)
  for (const k in attrs || {}) if (attrs[k] != null) e.setAttribute(k, attrs[k])
  return e
}
function plural(n, one, many) { return `${fmt(n)} ${n === 1 ? one : many || one + 's'}` }
const CARET = '<svg class="ico" viewBox="0 0 12 12"><path d="M3.5 4.75 6 7.25l2.5-2.5"/></svg>'
const CHECK = '<svg class="ico" viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.5l4.5-5"/></svg>'
const PLUS = '<svg class="ico" viewBox="0 0 12 12"><path d="M6 2.5v7M2.5 6h7"/></svg>'
const OPEN = '<svg class="ico" viewBox="0 0 12 12"><path d="M5 2.5H2.5v7h7V7M7 2.5h2.5V5M9.5 2.5 5.5 6.5"/></svg>'
const CLOSE = '<svg class="ico" viewBox="0 0 12 12"><path d="m3 3 6 6M9 3 3 9"/></svg>'

function parseTime(t) {
  if (!t) return null
  const d = new Date(t)
  return Number.isNaN(d.getTime()) ? null : d
}
const dayOf = (d) => `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`
const hmOf = (d) => `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`
const whenOf = (t) => { const d = parseTime(t); return d ? `${dayOf(d)} ${hmOf(d)}:${pad2(d.getUTCSeconds())} UTC` : 'Time unknown' }

// a small figure for each agent, drawn from its name: a 5×5 grid mirrored left to right
function hash(str) {
  let x = 2166136261
  for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619) }
  return x >>> 0
}
function avatar(name) {
  const svg = s('svg', { class: 'av', viewBox: '0 0 7 7', 'aria-hidden': 'true' })
  let bits = hash(name)
  for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) {
    if (bits & 1) {
      svg.append(s('rect', { x: 1 + x, y: 1 + y, width: 1, height: 1 }))
      if (x < 2) svg.append(s('rect', { x: 5 - x, y: 1 + y, width: 1, height: 1 }))
    }
    bits >>>= 1
  }
  return svg
}

// ---------------------------------------------------------------- data
let D = null // the reader's map
let byId = new Map(), agentBy = new Map(), threadBy = new Map(), linksOf = new Map()
let labelState = { labels: [], filter: null, all: null, palette: null }
const F = { agent: '', sig: '', threads: new Set(), types: new Set() }
let q = ''
let near = false
let colourBy = 'type' // 'type' or 'thread'; a label that is on colours instead
let zoom = 1 // 1 or 'fit'
let sel = null // {kind: action|agent|link|record, id|name|key|ref}
let hover = null // {kind, ...} under the pointer
let keepRef = null // the record a citation opened, kept whatever the label filter keeps
let target = null // the place thimble.onOpen asked for, applied once the map is loaded
let loadSeq = 0
const recCache = new Map() // ref -> the reader's record
let L = null // the layout: {cols, rows, cards, links}

const labelsOn = () => labelState.labels.length > 0 && D && D.marks.length > 0
function typeColour(t) {
  if (labelsOn() || colourBy !== 'type') return token('--viz-ink-2')
  if (TYPE_VIZ[t]) return token(`--viz-${TYPE_VIZ[t]}`)
  const extra = D.types.length ? [...new Set(D.links.map((x) => x.type))].filter((x) => !TYPE_VIZ[x]) : []
  const i = extra.indexOf(t)
  return i >= 0 && i < EXTRA_VIZ.length ? token(`--viz-${EXTRA_VIZ[i]}`) : token('--viz-ink-2')
}
const legendTypeColour = (t) => (TYPE_VIZ[t] ? token(`--viz-${TYPE_VIZ[t]}`) : token('--viz-ink-2'))
function threadColour(tag) {
  const i = D.threads.findIndex((t) => t.tag === tag)
  return i >= 0 && i < 7 ? token(`--viz-${i + 1}`) : token('--viz-ink-3')
}
function cardColour(a) {
  if (labelsOn()) return a.m >= 0 ? D.marks[a.m].colour : null
  if (colourBy === 'thread') return threadColour(a.thread)
  return null
}
const types = () => [...new Set([...D.types.filter((t) => D.links.some((x) => x.type === t)), ...D.links.map((x) => x.type)])]

async function load() {
  const seq = ++loadSeq
  let data
  try {
    data = await thimble.fetch(keepRef ? { op: 'map', keep: [keepRef] } : { op: 'map' })
  } catch (e) {
    document.getElementById('problems').hidden = false
    document.getElementById('problems').textContent = `The map could not be read: ${e.message || e}`
    return false
  }
  if (seq !== loadSeq) return false
  D = data
  byId = new Map(D.actions.map((a) => [a.id, a]))
  agentBy = new Map(D.agents.map((a) => [a.username, a]))
  threadBy = new Map(D.threads.map((t) => [t.tag, t]))
  linksOf = new Map(D.actions.map((a) => [a.id, []]))
  for (const x of D.links) { linksOf.get(x.from).push(x); linksOf.get(x.to).push(x) }
  if (F.agent && !agentBy.has(F.agent)) F.agent = ''
  for (const t of [...F.threads]) if (!threadBy.has(t)) F.threads.delete(t)
  if (sel && sel.kind === 'action' && !byId.has(sel.id)) sel = null
  if (sel && sel.kind === 'agent' && !agentBy.has(sel.name)) sel = null
  if (sel && sel.kind === 'link' && !D.links.some((x) => x.key === sel.key)) sel = null
  showProblems(D.problems)
  return true
}
function showProblems(p) {
  const el = document.getElementById('problems')
  el.hidden = !(p && p.count)
  if (el.hidden) return
  el.textContent = `${plural(p.count, 'line')} of the map or its records ${p.count === 1 ? 'does' : 'do'} not parse and ${p.count === 1 ? 'is' : 'are'} left out: ${p.examples.join('; ')}${p.count > p.examples.length ? '; …' : ''}`
}

// ---------------------------------------------------------------- filters
function signedBy(a, sig) { return a.username === sig || a.signs_as.includes(sig) }
function hay(a) {
  const ag = agentBy.get(a.agent) || { goal: '', signs_as: [] }
  const t = threadBy.get(a.thread) || { id: '' }
  return [`#${a.id}`, a.agent, ag.goal, ag.signs_as.join(' '), a.thread, t.id, a.action, a.quote, a.time || 'time unknown'].join('\n').toLowerCase()
}
function matches(a) {
  if (F.agent && a.agent !== F.agent) return false
  if (F.sig && !signedBy(agentBy.get(a.agent), F.sig)) return false
  if (F.threads.size && !F.threads.has(a.thread)) return false
  if (q && !hay(a).includes(q)) return false
  if (F.types.size && !linksOf.get(a.id).some((x) => F.types.has(x.type))) return false
  return true
}
const filtered = () => !!(F.agent || F.sig || F.threads.size || F.types.size || q)
// {actions: shown, ctx: ids shown only as linked, links: shown}
function visible() {
  const core = D.actions.filter(matches)
  const ids = new Set(core.map((a) => a.id))
  const ctx = new Set()
  const typeOk = (x) => !F.types.size || F.types.has(x.type)
  if (near && filtered()) for (const a of core) for (const x of linksOf.get(a.id)) {
    if (!typeOk(x)) continue
    const o = x.from === a.id ? x.to : x.from
    if (!ids.has(o)) ctx.add(o)
  }
  for (const o of ctx) ids.add(o)
  if (sel && sel.kind === 'action' && byId.has(sel.id) && !ids.has(sel.id)) { ids.add(sel.id); ctx.add(sel.id) }
  const actions = D.actions.filter((a) => ids.has(a.id))
  const links = D.links.filter((x) => ids.has(x.from) && ids.has(x.to) && typeOk(x))
  return { actions, ctx, links }
}

// ---------------------------------------------------------------- the bar
function renderBar(v) {
  const title = document.getElementById('title')
  title.textContent = D.title
  title.title = D.title
  const shownAgents = new Set(v.actions.map((a) => a.agent))
  const shownThreads = new Set(v.actions.map((a) => a.thread))
  const count = (n, total, one, many) => (n === total ? plural(n, one, many) : `${fmt(n)} of ${plural(total, one, many)}`)
  const counts = [count(shownAgents.size, D.total.agents, 'agent'), count(shownThreads.size, D.total.threads, 'thread'),
    count(v.actions.length, D.total.actions, 'action'), count(v.links.length, D.total.links, 'link')].join(' · ')
  const tr = document.getElementById('threads')
  tr.innerHTML = ''
  const cs = h('span', null, counts)
  cs.id = 'counts'
  tr.append(cs)
  const perThread = new Map(D.threads.map((t) => [t.tag, 0]))
  for (const a of D.actions) perThread.set(a.thread, (perThread.get(a.thread) || 0) + 1)
  for (const t of D.threads) {
    const w = h('span', 'thr')
    w.dataset.anchor = `view:${slug}/thread:${t.tag}`
    w.dataset.anchorName = `${t.tag} ${t.id}`
    const b = h('button', `chip chip-act chip-tone-neutral${F.threads.has(t.tag) ? ' active' : ''}`)
    b.title = `${t.id}\nClick: only this thread · Shift-click: add it`
    if (!labelsOn() && colourBy === 'thread') { const sw = h('i', 'sw'); sw.style.background = threadColour(t.tag); b.append(sw) }
    b.append(t.tag)
    b.onclick = (e) => { toggleSet(F.threads, t.tag, e.shiftKey); refresh() }
    const a = h('a', 'plink', t.id)
    a.title = t.ref ? `${t.id}\nOpen ${t.ref}` : t.id
    if (t.ref) a.onclick = () => thimble.navigate(t.ref)
    w.append(b, a)
    w.onmouseenter = () => setHover({ kind: 'thread', tag: t.tag })
    w.onmouseleave = () => setHover(null)
    tr.append(w)
  }
  // agent and signature selects, each value with its count of actions
  const agentSel = document.getElementById('agent')
  const perAgent = new Map()
  for (const a of D.actions) perAgent.set(a.agent, (perAgent.get(a.agent) || 0) + 1)
  agentSel.innerHTML = `<option value="">All agents</option>` + D.agents.map((a) => `<option value="${esc(a.username)}">${esc(a.username)} (${perAgent.get(a.username) || 0})</option>`).join('')
  agentSel.value = F.agent
  const sigs = [...new Set(D.agents.flatMap((a) => a.signs_as))].sort((x, y) => x.localeCompare(y))
  const sigSel = document.getElementById('sig')
  sigSel.hidden = !sigs.length
  sigSel.innerHTML = `<option value="">Any signature</option>` + sigs.map((g) => {
    const n = D.agents.filter((a) => signedBy(a, g)).length
    return `<option value="${esc(g)}">Signs as ${esc(g)} (${plural(n, 'account')})</option>`
  }).join('')
  sigSel.value = F.sig
  const ty = document.getElementById('types')
  ty.innerHTML = ''
  for (const t of types()) {
    const n = D.links.filter((x) => x.type === t).length
    const b = h('button', `chip chip-act chip-sans chip-tone-neutral${F.types.has(t) ? ' active' : ''}`)
    const sw = h('i', 'sw')
    sw.style.background = legendTypeColour(t)
    b.append(sw, t, h('span', 'n', String(n)))
    b.title = `${plural(n, `${t} link`)}\nClick: only this type · Shift-click: add it`
    b.onclick = (e) => { toggleSet(F.types, t, e.shiftKey); refresh() }
    ty.append(b)
  }
  for (const o of document.querySelectorAll('#near .seg-opt')) o.classList.toggle('active', (o.dataset.v === '1') === near)
  for (const o of document.querySelectorAll('#zoom .seg-opt')) o.classList.toggle('active', String(zoom) === o.dataset.v)
  document.getElementById('clear').hidden = !filtered()
  const on = labelState.labels
  const cname = labelsOn() ? on.map((l) => l.name).join(', ') : colourBy === 'thread' ? 'Thread' : 'Link type'
  const sws = labelsOn() ? D.marks.slice(0, 4).map((m) => `<i class="sw" style="width:5px;border-radius:1px;background:${esc(m.colour)}"></i>`).join('')
    : (colourBy === 'thread' ? D.threads.slice(0, 4).map((t) => threadColour(t.tag)) : types().slice(0, 4).map(legendTypeColour)).map((c) => `<i class="sw" style="width:5px;border-radius:1px;background:${c}"></i>`).join('')
  const cb = document.getElementById('cbtn')
  cb.innerHTML = `<span class="k">Colour</span><span style="display:inline-flex;gap:2px">${sws}</span>${esc(cname)}${CARET}`
  const ids = labelsOn() ? on.map((l) => l.id).filter(Boolean).join(' ') : ''
  if (ids) cb.dataset.label = ids
  else delete cb.dataset.label
  renderLegend(v)
}
function toggleSet(set, v, add) {
  if (add) set.has(v) ? set.delete(v) : set.add(v)
  else if (set.size === 1 && set.has(v)) set.clear()
  else { set.clear(); set.add(v) }
}
// while a label is on: its values with the cards each marks, a value's swatch opening thimble's palette
function renderLegend(v) {
  const el = document.getElementById('legend')
  el.hidden = !labelsOn()
  el.innerHTML = ''
  if (el.hidden) return
  const n = new Map()
  let none = 0
  for (const a of v.actions) {
    if (a.mb) for (let j = 0; j < D.marks.length; j++) { if (a.mb & (1 << j)) n.set(j, (n.get(j) || 0) + 1) }
    else none++
  }
  D.marks.forEach((m, j) => {
    const label = (labelState.all || labelState.labels).find((l) => l.name === m.label)
    const it = h('span', 'lg')
    if (label && label.id) it.dataset.label = label.id
    it.append(swatch(m.colour, label, m.value), h('span', null, labelState.labels.length > 1 ? `${m.label}: ${m.value}` : m.value), h('span', 'n', fmt(n.get(j) || 0)))
    el.append(it)
  })
  const it = h('span', 'lg')
  const sw = h('i', 'sw')
  sw.style.background = token('--viz-ink-4')
  it.append(sw, h('span', null, 'no label'), h('span', 'n', fmt(none)))
  el.append(it)
}
function swatch(colour, label, value) {
  const sw = h('i', 'sw')
  sw.style.background = colour
  if (!label || !label.id || !(labelState.palette || []).length || !thimble.setLabelColour) return sw
  const b = h('span', 'swb')
  b.setAttribute('role', 'button')
  b.title = 'Change colour'
  b.dataset.act = 'palette'
  b.dataset.id = label.id
  b.dataset.value = value
  b.append(sw)
  b.onclick = (e) => { e.stopPropagation(); openPalette(label.id, value, 'legend') }
  return b
}

document.getElementById('q').addEventListener('input', (e) => { q = e.target.value.trim().toLowerCase(); refresh() })
document.getElementById('agent').addEventListener('change', (e) => { F.agent = e.target.value; refresh() })
document.getElementById('sig').addEventListener('change', (e) => { F.sig = e.target.value; refresh() })
document.getElementById('near').addEventListener('click', (e) => { const o = e.target.closest('.seg-opt'); if (o) { near = o.dataset.v === '1'; refresh() } })
document.getElementById('zoom').addEventListener('click', (e) => { const o = e.target.closest('.seg-opt'); if (o) { zoom = o.dataset.v === 'fit' ? 'fit' : 1; refresh() } })
document.getElementById('clear').addEventListener('click', () => {
  F.agent = ''; F.sig = ''; F.threads.clear(); F.types.clear(); q = ''
  document.getElementById('q').value = ''
  refresh()
})

// ---------------------------------------------------------------- the Colour menu and the palette
let menu = false
let pal = null // {id, value, from} while a label value's palette is open
document.getElementById('cbtn').addEventListener('click', () => { menu = !menu; pal = null; renderPop() })
function openPalette(id, value, from) {
  pal = pal && pal.id === id && pal.value === value ? null : { id, value, from }
  renderPop()
}
function menuHtml() {
  const field = (k, name, colours) => {
    const on = !labelsOn() && colourBy === k
    const sws = colours.slice(0, 4).map((c) => `<i class="sw" style="width:5px;border-radius:1px;background:${c}"></i>`).join('')
    return `<button class="mi" data-act="field" data-f="${k}"><span class="ck">${on ? CHECK : ''}</span>${esc(name)}<span class="n">${sws}</span></button>`
  }
  const fields = field('type', 'Link type', types().map(legendTypeColour)) + field('thread', 'Thread', D.threads.map((t) => threadColour(t.tag)))
  const all = labelState.all || labelState.labels.map((l) => ({ ...l, on: true }))
  const sw = (l, v) => {
    const i = `<i class="sw" style="background:${esc(v.colour)}"></i>`
    return l.id && (labelState.palette || []).length && thimble.setLabelColour
      ? `<span class="swb" role="button" title="Change colour" data-act="palette" data-id="${esc(l.id)}" data-value="${esc(v.name)}">${i}</span>` : i
  }
  const rows = all.map((l) => {
    const lit = (l.values || []).filter((v) => v.highlight !== false)
    const box = `<span class="box ${l.on ? 'on' : ''}" style="--mark:${esc(l.colour)}"></span>`
    const main = `<button class="mi" data-act="label" data-id="${esc(l.id || '')}" data-label="${esc(l.id || '')}" ${l.id && thimble.setLabel ? '' : 'disabled'}><span class="ck">${box}</span><span class="nm">${esc(l.name)}</span><span class="n">${l.count == null ? '' : fmt(l.count)}</span>${lit.length === 1 ? sw(l, lit[0]) : ''}</button>`
    const subs = l.on && lit.length > 1 ? lit.map((v) => `<div class="mi sub" data-label="${esc(l.id || '')}"><span class="nm">${esc(v.name)}</span><span class="n"></span>${sw(l, v)}</div>`).join('') : ''
    return main + subs
  }).join('')
  const make = thimble.newLabel ? `<div class="msep"></div><button class="mi" data-act="newlabel"><span class="ck">${PLUS}</span>New label…</button>` : ''
  return `<div class="menu" id="menu" data-anchor-name="Colour menu"><div class="mh">Fields</div>${fields}${rows ? `<div class="msep"></div><div class="mh">Labels</div>${rows}` : ''}${make}</div>`
}
function palHtml() {
  const l = (labelState.all || labelState.labels || []).find((x) => x.id === pal.id)
  const cur = String((l && ((l.values || []).find((v) => v.name === pal.value) || {}).colour) || '').toLowerCase()
  return `<div class="pal" id="pal" data-label="${esc(pal.id)}">${labelState.palette.map((c) => `<button data-act="colour" data-colour="${esc(c)}" class="${c.toLowerCase() === cur ? 'cur' : ''}" style="background:${esc(c)}" aria-label="Colour ${esc(c)}"></button>`).join('')}</div>`
}
function renderPop() {
  const pop = document.getElementById('pop')
  const btn = document.getElementById('cbtn')
  if (pal && !(labelState.palette || []).length) pal = null
  pop.innerHTML = (menu && D ? menuHtml() : '') + (pal ? palHtml() : '')
  const m = document.getElementById('menu')
  if (m) {
    const r = btn.getBoundingClientRect()
    m.style.left = `${Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8))}px`
    m.style.top = `${Math.max(8, Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8))}px`
  }
  const p = document.getElementById('pal')
  if (p) {
    const q2 = `[data-act="palette"][data-id="${CSS.escape(pal.id)}"][data-value="${CSS.escape(pal.value)}"]`
    const a = document.querySelector(`${pal.from === 'menu' ? '#menu' : '#legend'} ${q2}`)
    if (!a) { pal = null; p.remove(); return }
    const r = a.getBoundingClientRect()
    const x = pal.from === 'menu' ? r.right + 6 : r.left, y = pal.from === 'menu' ? r.top - 10 : r.bottom + 4
    p.style.left = `${Math.max(8, Math.min(x, innerWidth - p.offsetWidth - 8))}px`
    p.style.top = `${Math.max(8, Math.min(y, innerHeight - p.offsetHeight - 8))}px`
  }
}
document.getElementById('pop').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]')
  if (!el) return
  const act = el.dataset.act
  const all = labelState.all || labelState.labels.map((x) => ({ ...x, on: true }))
  if (act === 'field') {
    colourBy = el.dataset.f
    menu = false
    // a field colours the cards only while no label is on, so choosing one turns the labels off in thimble
    if (thimble.setLabel) for (const l of all) if (l.on && l.id) thimble.setLabel(l.id, false)
    renderPop()
    refresh()
  } else if (act === 'label') {
    const l = all.find((x) => x.id === el.dataset.id)
    if (l && thimble.setLabel) thimble.setLabel(l.id, !l.on)
  } else if (act === 'newlabel') {
    menu = false
    renderPop()
    if (thimble.newLabel) thimble.newLabel()
  } else if (act === 'palette') openPalette(el.dataset.id, el.dataset.value, 'menu')
  else if (act === 'colour') {
    if (pal && thimble.setLabelColour) thimble.setLabelColour(pal.id, pal.value, el.dataset.colour)
    pal = null
    renderPop()
  }
})
document.addEventListener('click', (e) => {
  const el = e.target instanceof Element ? e.target : null
  if ((menu || pal) && !(el && el.closest('#pop, #cbtn, .swb'))) { menu = false; pal = null; renderPop() }
}, true)

// ---------------------------------------------------------------- layout
// Everything is measured at zoom 1 and in CSS pixels of the plot; the zoom is applied to the whole grid afterwards.
function metrics() {
  const narrow = innerWidth < 560
  return { AGW: narrow ? 124 : 256, W: narrow ? 112 : 120, CW: narrow ? 168 : 180 }
}
function layout(v) {
  const M = metrics()
  const grid = document.getElementById('grid')
  grid.style.zoom = ''
  const cols = document.getElementById('cols'), rows = document.getElementById('rows'), plot = document.getElementById('plot')
  cols.innerHTML = ''; rows.innerHTML = ''; plot.innerHTML = ''
  const acts = v.actions
  const colOf = new Map(acts.map((a, i) => [a.id, i]))
  const agents = D.agents.filter((a) => acts.some((x) => x.agent === a.username))
  const rowOf = new Map(agents.map((a, i) => [a.username, i]))
  const W = M.W, CW = M.CW
  const colX = (c) => PAD_L + c * W
  const plotW = PAD_L + Math.max(0, acts.length - 1) * W + CW + PAD_R
  grid.style.gridTemplateColumns = `${M.AGW}px ${plotW}px`
  grid.style.gridTemplateRows = `${HEAD_H}px auto`
  document.getElementById('corner').style.height = `${HEAD_H}px`
  cols.style.height = `${HEAD_H}px`

  // the column heads: each action's UTC time, the day in lighter type
  cols.append(Object.assign(h('span', 'hcap', 'Event order · UTC')))
  acts.forEach((a, i) => {
    const d = parseTime(a.time)
    const c = h('div', `col${d ? '' : ' none'}`)
    c.style.left = `${colX(i)}px`
    c.style.width = `${W - 8}px`
    if (d) { c.append(h('div', 'd', dayOf(d)), h('div', null, hmOf(d))); c.title = whenOf(a.time) } else c.append(h('div', null, 'Time'), h('div', null, 'unknown'))
    cols.append(c)
  })

  // agent cells, measured at the column's width
  const cells = agents.map((ag) => {
    const el = h('div', 'agent')
    el.dataset.anchor = `view:${slug}/agent:${ag.username}`
    el.dataset.anchorName = ag.username
    el.dataset.name = ag.username
    const who = h('div', 'who')
    const nm = h('div', 'nm', ag.username)
    nm.title = ag.username
    who.append(nm)
    if (ag.goal) { const g = h('div', 'goal', ag.goal); g.title = ag.goal; who.append(g) }
    if (ag.signs_as.length) { const sg = h('div', 'sig', `signs as ${ag.signs_as.join(', ')}`); sg.title = sg.textContent; who.append(sg) }
    el.append(avatar(ag.username), who)
    el.onmouseenter = () => setHover({ kind: 'agent', name: ag.username })
    el.onmouseleave = () => setHover(null)
    el.onclick = () => select({ kind: 'agent', name: ag.username })
    el.style.top = '0px'
    el.style.visibility = 'hidden'
    rows.append(el)
    return el
  })
  rows.style.height = '1px'
  const cellH = cells.map((el) => el.offsetHeight)

  // cards, measured at their width
  const cards = new Map()
  for (const a of acts) {
    const el = h('div', `card${v.ctx.has(a.id) ? ' ctx' : ''}`)
    el.dataset.anchor = a.ref
    el.dataset.anchorText = `#${a.id} ${a.action}`
    el.dataset.id = a.id
    const t = threadBy.get(a.thread)
    const hd = h('div', 'hd')
    hd.append(h('span', 'no', `#${a.id}`), h('span', 'tag', a.thread), h('span', 'pg', t ? t.id : ''))
    el.append(hd, h('div', 'ac', a.action))
    const colour = cardColour(a)
    if (colour) {
      const tick = h('i', 'tick')
      tick.style.background = colour
      el.append(tick)
      if (labelsOn()) el.style.background = `color-mix(in srgb, ${colour} 13%, var(--surface-card))`
      else hd.querySelector('.tag').style.color = colour
    }
    el.style.width = `${CW}px`
    el.style.left = `${colX(colOf.get(a.id))}px`
    el.style.top = '0px'
    el.style.visibility = 'hidden'
    el.onmouseenter = (e) => { setHover({ kind: 'action', id: a.id }); showTip(e, tipAction(a)) }
    el.onmousemove = moveTip
    el.onmouseleave = () => { setHover(null); hideTip() }
    el.onclick = () => { if (!String(getSelection() || '')) select({ kind: 'action', id: a.id }) }
    el.ondblclick = () => thimble.navigate(a.ref)
    plot.append(el)
    cards.set(a.id, { el, a, col: colOf.get(a.id), row: rowOf.get(a.agent), x: colX(colOf.get(a.id)), w: CW, h: 0, lane: 0 })
  }
  for (const c of cards.values()) c.h = c.el.offsetHeight

  // lanes: a card that would overlap the last card of every lane so far starts a lane below them
  const lanes = agents.map(() => []) // per row, per lane: the right edge of its last card
  const laneH = agents.map(() => [])
  for (const a of acts) {
    const c = cards.get(a.id)
    const ls = lanes[c.row]
    let k = ls.findIndex((right) => right + CARD_GAP <= c.x)
    if (k < 0) { k = ls.length; ls.push(0); laneH[c.row].push(0) }
    ls[k] = c.x + c.w
    laneH[c.row][k] = Math.max(laneH[c.row][k], c.h)
    c.lane = k
  }

  // link ends: each card's band holds the vertical runs of its links, spread out, those going left first
  const bandOf = (c) => [c.x + (CW - W) + 6, c.x + W - 6]
  const ends = new Map() // card id -> [{link, other column}]
  const routes = v.links.map((x) => {
    const S = cards.get(x.from), T = cards.get(x.to)
    // the gap next to the target: below it when the source is lower, else above it
    const gap = T.row < S.row ? T.row + 1 : T.row
    const r = { x, S, T, gap, sSide: gap <= S.row ? 'top' : 'bottom', tSide: gap > T.row ? 'bottom' : 'top' }
    for (const [card, other] of [[S, T], [T, S]]) {
      if (!ends.has(card.a.id)) ends.set(card.a.id, [])
      ends.get(card.a.id).push({ r, other: other.col, own: card === S })
    }
    return r
  })
  for (const [id, list] of ends) {
    const c = cards.get(id)
    const [b0, b1] = bandOf(c)
    list.sort((p, q2) => p.other - q2.other || (p.own ? 0 : 1) - (q2.own ? 0 : 1))
    const step = list.length > 1 ? Math.min(END_GAP, (b1 - b0) / (list.length - 1)) : 0
    const x0 = (b0 + b1) / 2 - (step * (list.length - 1)) / 2
    list.forEach((e, i) => { if (e.own) e.r.xs = x0 + i * step; else e.r.xt = x0 + i * step })
  }

  // tracks: each gap's links on tracks of their own, a link's label beside its source's vertical run
  const labelW = labelMeasure()
  const gaps = Array.from({ length: agents.length + 1 }, () => [])
  for (const r of routes) {
    r.label = `${r.x.from}→${r.x.to} · ${r.x.type}`
    r.lw = Math.ceil(labelW(r.label)) + 8
    const left = r.xt < r.xs
    r.lx = left ? r.xs - 5 - r.lw : r.xs + 5
    r.span = [Math.min(r.xt, r.xs, r.lx) - 4, Math.max(r.xt, r.xs, r.lx + r.lw) + 4]
    gaps[r.gap].push(r)
  }
  const gapH = gaps.map((list) => {
    list.sort((p, q2) => p.span[0] - q2.span[0] || p.span[1] - q2.span[1])
    const ends2 = []
    for (const r of list) {
      let t = ends2.findIndex((e) => e <= r.span[0])
      if (t < 0) { t = ends2.length; ends2.push(0) }
      ends2[t] = r.span[1]
      r.track = t
    }
    return ends2.length ? 10 + ends2.length * TRACK : GAP_MIN
  })

  // rows and gaps top to bottom
  let y = 0
  const gapTop = [], rowTop = [], rowH = []
  agents.forEach((ag, i) => {
    gapTop[i] = y
    y += gapH[i]
    rowTop[i] = y
    const inner = laneH[i].reduce((sum, hh) => sum + hh, 0) + LANE_GAP * Math.max(0, laneH[i].length - 1)
    rowH[i] = Math.max(cellH[i], inner + 2 * ROW_PAD)
    y += rowH[i]
  })
  gapTop[agents.length] = y
  y += gapH[agents.length]
  const plotH = Math.max(y, 40)
  plot.style.height = `${plotH}px`
  rows.style.height = `${plotH}px`

  // bands: each row from the middle of the gap above it to the middle of the gap below it
  agents.forEach((ag, i) => {
    const top = i === 0 ? 0 : gapTop[i] + gapH[i] / 2
    const bottom = i === agents.length - 1 ? plotH : gapTop[i + 1] + gapH[i + 1] / 2
    const band = h('div', `band${i % 2 ? ' odd' : ''}`)
    band.style.top = `${top}px`
    band.style.height = `${bottom - top}px`
    plot.prepend(band)
    const el = cells[i]
    el.classList.toggle('odd', i % 2 === 1)
    el.style.top = `${top}px`
    el.style.height = `${bottom - top}px`
    el.style.paddingTop = `${rowTop[i] - top + ROW_PAD - 2}px`
    el.style.visibility = ''
  })
  for (const c of cards.values()) {
    const offs = laneH[c.row].slice(0, c.lane).reduce((sum, hh) => sum + hh + LANE_GAP, 0)
    c.y = rowTop[c.row] + ROW_PAD + offs
    c.el.style.top = `${c.y}px`
    c.el.style.visibility = ''
  }

  // the links: out of the source's edge, along the gap next to the target, into the target's edge
  const svg = s('svg', { id: 'links', width: plotW, height: plotH })
  const linkEls = new Map()
  for (const r of routes) {
    const { S, T } = r
    const ty = gapTop[r.gap] + 5 + TRACK / 2 + r.track * TRACK
    const ys = r.sSide === 'top' ? S.y : S.y + S.h
    const yt = r.tSide === 'top' ? T.y : T.y + T.h
    const colour = typeColour(r.x.type)
    const g = s('g', { 'data-key': r.x.key })
    const d = orth([[r.xs, ys], [r.xs, ty], [r.xt, ty], [r.xt, yt]], 5)
    g.append(s('path', { class: 'ln', d, stroke: colour, 'stroke-dasharray': DASH[r.x.type] || null }))
    g.append(s('circle', { class: 'end', cx: r.xs, cy: ys, r: 2.6, fill: colour }))
    const dir = r.tSide === 'top' ? 1 : -1 // the arrow points down into a top edge, up into a bottom edge
    g.append(s('path', { class: 'end', d: `M${r.xt - 4},${yt - dir * 7}L${r.xt},${yt - dir * 0.5}L${r.xt + 4},${yt - dir * 7}Z`, fill: colour }))
    const hit = s('path', { class: 'hit', d })
    hit.addEventListener('mouseenter', (e) => { setHover({ kind: 'link', key: r.x.key }); showTip(e, tipLink(r.x)) })
    hit.addEventListener('mousemove', moveTip)
    hit.addEventListener('mouseleave', () => { setHover(null); hideTip() })
    hit.addEventListener('click', () => select({ kind: 'link', key: r.x.key }))
    g.append(hit)
    svg.append(g)
    const lb = h('span', 'lbl', r.label)
    lb.dataset.anchor = `view:${slug}/${r.x.key}`
    lb.dataset.anchorName = r.label
    lb.style.left = `${r.lx}px`
    lb.style.top = `${ty - 7}px`
    lb.style.color = colour
    lb.onmouseenter = (e) => { setHover({ kind: 'link', key: r.x.key }); showTip(e, tipLink(r.x)) }
    lb.onmousemove = moveTip
    lb.onmouseleave = () => { setHover(null); hideTip() }
    lb.onclick = () => select({ kind: 'link', key: r.x.key })
    linkEls.set(r.x.key, { g, lb })
  }
  plot.prepend(svg)
  for (const b of [...plot.querySelectorAll('.band')].reverse()) plot.prepend(b)
  for (const { lb } of linkEls.values()) plot.append(lb)
  L = { cards, cells: new Map(agents.map((a, i) => [a.username, cells[i]])), linkEls, width: M.AGW + plotW }
  applyZoom()
}
// an orthogonal polyline with its corners rounded
function orth(pts, rad) {
  const p = pts.filter((pt, i) => i === 0 || pt[0] !== pts[i - 1][0] || pt[1] !== pts[i - 1][1])
  let d = `M${p[0][0]},${p[0][1]}`
  for (let i = 1; i < p.length - 1; i++) {
    const [ax, ay] = p[i - 1], [bx, by] = p[i], [cx, cy] = p[i + 1]
    const r1 = Math.min(rad, Math.hypot(bx - ax, by - ay) / 2, Math.hypot(cx - bx, cy - by) / 2)
    const ux = Math.sign(bx - ax), uy = Math.sign(by - ay), vx = Math.sign(cx - bx), vy = Math.sign(cy - by)
    d += `L${bx - ux * r1},${by - uy * r1}Q${bx},${by} ${bx + vx * r1},${by + vy * r1}`
  }
  const last = p[p.length - 1]
  return d + `L${last[0]},${last[1]}`
}
let measureCtx = null

function applyZoom() {

// ---------------------------------------------------------------- focus: what hover or the selection lights
function neighbourhood(f) {
  const cardsLit = new Set(), linksLit = new Set(), agentsLit = new Set()
  const addLink = (x) => { linksLit.add(x.key); cardsLit.add(x.from); cardsLit.add(x.to) }
  if (f.kind === 'action' && byId.has(f.id)) { cardsLit.add(f.id); for (const x of linksOf.get(f.id)) addLink(x) }
  else if (f.kind === 'link') { const x = D.links.find((y) => y.key === f.key); if (x) addLink(x) }
  else if (f.kind === 'agent') { agentsLit.add(f.name); for (const a of D.actions) if (a.agent === f.name) { cardsLit.add(a.id); for (const x of linksOf.get(a.id)) addLink(x) } }
  else if (f.kind === 'thread') { for (const a of D.actions) if (a.thread === f.tag) cardsLit.add(a.id); for (const x of D.links) if (cardsLit.has(x.from) && cardsLit.has(x.to)) linksLit.add(x.key) }
  else if (f.kind === 'record') { for (const n of f.agents || []) agentsLit.add(n); for (const a of D.actions) if ((f.agents || []).includes(a.agent)) cardsLit.add(a.id) }
  for (const id of cardsLit) { const a = byId.get(id); if (a) agentsLit.add(a.agent) }

}
function setHover(f) { hover = f; applyFocus() }
function applyFocus() {

  const main = document.getElementById('grid')
  main.classList.toggle('focus', !!f)
  const n = f ? neighbourhood(f) : { cardsLit: new Set(), linksLit: new Set(), agentsLit: new Set() }
  for (const [id, c] of L.cards) {
    c.el.classList.toggle('lit', n.cardsLit.has(id))
    c.el.classList.toggle('sel', !!sel && sel.kind === 'action' && sel.id === id)
  }
  for (const [key, { g, lb }] of L.linkEls) { g.classList.toggle('lit', n.linksLit.has(key)); lb.classList.toggle('lit', n.linksLit.has(key)) }
  for (const [name, el] of L.cells) {
    el.classList.toggle('lit', n.agentsLit.has(name))
    el.classList.toggle('sel', !!sel && sel.kind === 'agent' && sel.name === name)
  }
}

function showTip(e, html) {

}
function moveTip(e) {
  const tip = document.getElementById('tip')
  if (tip.style.display !== 'block') return
  const w = tip.offsetWidth, hh = tip.offsetHeight
  let x = e.clientX + 14, y = e.clientY + 16

  if (y + hh > innerHeight - 8) y = e.clientY - hh - 12

// ---------------------------------------------------------------- selection and the detail beside the chart
function select(f, { reveal = true } = {}) {

  hover = null

}
function revealSel() {
  if (!L || !sel) return
  const chart = document.getElementById('chart')
  const z = parseFloat(document.getElementById('grid').style.zoom || '1') || 1
  const M = metrics()
  let box = null
  if (sel.kind === 'action' && L.cards.has(sel.id)) { const c = L.cards.get(sel.id); box = { x: c.x, y: c.y, w: c.w, h: c.h } }
  else if (sel.kind === 'link') {
    const x = D.links.find((y) => y.key === sel.key)
    const a = x && L.cards.get(x.from), b = x && L.cards.get(x.to)
    if (a && b) box = { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.max(a.x + a.w, b.x + b.w) - Math.min(a.x, b.x), h: Math.max(a.y + a.h, b.y + b.h) - Math.min(a.y, b.y) }
  } else if (sel.kind === 'agent') {
    const own = [...L.cards.values()].filter((c) => c.a.agent === sel.name)
    if (own.length) box = { x: own[0].x, y: own[0].y, w: own[0].w, h: own[0].h }
  }
  if (!box) return
  const det = document.getElementById('detail')
  const over = !det.hidden && getComputedStyle(det).position === 'absolute' ? Math.min(det.offsetWidth, chart.clientWidth * 0.6) : 0
  const viewW = Math.max(120, (chart.clientWidth - over) / z - M.AGW), viewH = chart.clientHeight / z - HEAD_H
  const left = chart.scrollLeft / z, top = chart.scrollTop / z
  let nx = left, ny = top
  if (box.x < left + 12 || box.x + Math.min(box.w, viewW) > left + viewW - 12) nx = Math.max(0, box.x - Math.max(24, (viewW - box.w) / 2))
  if (box.y < top + 12 || box.y + Math.min(box.h, viewH) > top + viewH - 12) ny = Math.max(0, box.y - Math.max(24, (viewH - box.h) / 2))
  chart.scrollTo({ left: nx * z, top: ny * z, behavior: 'smooth' })
}

function highlight(text, quote) {

    const e = esc(qline)

  }

}

    box.append(agentBlock(ag.username))
    const acts = D.actions.filter((a) => a.agent === ag.username)
    box.append(sec('Actions', acts.length))
    for (const a of acts) box.append(actionRow(a))
    if (ag.evidence.length) {
      box.append(sec('Evidence for the goal', ag.evidence.length))
      for (const e of ag.evidence) {
        const ev = h('div', 'ev')
        ev.dataset.anchor = e.ref
        ev.append(h('q', null, e.quote), refChip(e.ref))
        box.append(ev)
      }
    }
  } else if (sel.kind === 'link') {
    const x = D.links.find((y) => y.key === sel.key)
    if (!x) return
    box.dataset.anchor = `view:${slug}/${x.key}`
    const k = chip(`${x.from}→${x.to} · ${x.type}`)
    k.style.color = typeColour(x.type)
    box.append(detailHead([k], null))
    box.append(h('p', 'd-h', x.reason))
    box.append(sec('From'), actionRow(byId.get(x.from)), sec('To'), actionRow(byId.get(x.to)))
    if (x.evidence.length) {
      box.append(sec('Evidence', x.evidence.length))
      for (const e of x.evidence) {
        const ev = h('div', 'ev')
        ev.dataset.anchor = e.ref
        ev.append(h('q', null, e.quote), refChip(e.ref))
        box.append(ev)
      }
    }
  } else if (sel.kind === 'record') {
    box.dataset.anchor = sel.ref
    box.append(detailHead([chip(sel.ref)], sel.ref))
    const names = h('div', 'd-top')
    names.style.marginTop = '10px'
    for (const n of sel.agents || []) { const c = h('button', 'chip chip-act chip-sans', n); c.onclick = () => select({ kind: 'agent', name: n }); names.append(c) }
    for (const tg of sel.threads || []) { const t = threadBy.get(tg); const c = h('button', 'chip chip-act chip-sans', `${tg} ${t ? t.id : ''}`); c.onclick = () => { F.threads = new Set([tg]); refresh() }; names.append(c) }
    if (names.childNodes.length) box.append(names)
    const rbox = h('div')
    rbox.append(h('div', 'skel'))
    box.append(rbox)
    try {
      const rec = await recordOf(sel.ref)
      if (sel === mine) renderRecordInto(rbox, rec, null)
    } catch (e) { rbox.textContent = `The record could not be read: ${e.message || e}` }
  }
}

// arrows step through the shown actions in event order; Escape closes the detail
document.addEventListener('keydown', (e) => {
  if (e.target instanceof Element && e.target.closest('input, select, textarea')) return
  if (e.key === 'Escape') { if (menu || pal) { menu = false; pal = null; renderPop() } else if (sel) closeDetail(); return }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && sel && sel.kind === 'action' && L) {
    const ids = [...L.cards.keys()]
    const i = ids.indexOf(sel.id) + (e.key === 'ArrowRight' ? 1 : -1)
    if (i >= 0 && i < ids.length) { e.preventDefault(); select({ kind: 'action', id: ids[i] }) }
  }
})

// ---------------------------------------------------------------- drawing it all
function refresh() {
  if (!D) return
  hover = null
  hideTip()
  const v = visible()
  renderBar(v)
  layout(v)
  applyFocus()
  renderDetail()
}
let resizeT = null
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (D) { layout(visible()); applyFocus() } }, 120) })

async function applyTarget(t) {
  if (!t) return
  if (t.action != null && byId.has(t.action)) select({ kind: 'action', id: t.action })
  else if (t.link) select({ kind: 'link', key: t.link })
  else if (t.ref) {
    select({ kind: 'record', ref: t.ref, agents: t.agent ? [t.agent] : [], threads: t.thread ? [t.thread] : [] }, { reveal: false })
    if (t.agent && L && L.cells.has(t.agent)) {
      const own = D.actions.find((a) => a.agent === t.agent)
      if (own) { const keep = sel; sel = { kind: 'action', id: own.id }; revealSel(); sel = keep }
    }
  } else if (t.agent) select({ kind: 'agent', name: t.agent })
  else if (t.thread) { F.threads = new Set([t.thread]); refresh() }
}
async function start() {
  if (!(await load())) return
  if (target && target.action != null && !byId.has(target.action) && keepRef) await load()
  refresh()
  if (target) { const t = target; target = null; await applyTarget(t) }
}
thimble.onOpen(async (place) => {
  const t = (place && place.target) || null
  const ref = t && t.action != null && t.ref ? t.ref : null
  const again = ref && ref !== keepRef
  if (ref) keepRef = ref
  if (!D) { target = t; return }
  if (again && !byId.has(t.action)) { if (!(await load())) return; refresh() }
  await applyTarget(t)
})
thimble.onLabels(async (state) => {
  const was = JSON.stringify([labelState.labels, labelState.filter])
  labelState = { labels: state.labels || [], filter: state.filter || null, all: state.all || null, palette: state.palette || null }
  if (!D) return
  if (JSON.stringify([labelState.labels, labelState.filter]) === was) { renderPop(); return }
  if (!(await load())) return
  refresh()
  renderPop()
})
start()
</script>
