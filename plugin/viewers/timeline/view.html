<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .chip), Color by, the time range, its axis and the theme's tokens come with the frame;
     this page lays out the top row, the lanes under the range, and the list */
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-card); overflow: hidden; }
  * { box-sizing: border-box; }
  #view { height: 100%; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 16px 10px; border-bottom: 1px solid var(--border-subtle); }
  #q { flex: 0 1 200px; min-width: 120px; }
  /* the readout, the range, its axis and the lanes share one column of time; the lanes' names stand in the gutter */
  .chart { flex: none; display: grid; grid-template-columns: 56px minmax(0, 1fr); padding: 8px 16px 6px; border-bottom: 1px solid var(--border-hairline); }
  #read { flex-direction: row; gap: 10px; margin-bottom: 4px; }
  #names div { height: 22px; color: var(--text-secondary); font: 400 var(--text-xs) / 22px var(--font-body); }
  #lanes { display: block; width: 100%; cursor: pointer; }
  #lanes .base { stroke: var(--border-hairline); }
  #lanes .none { fill: rgba(var(--ink-rgb), 0.32); }
  #lanes .guide { stroke: var(--text-primary); stroke-opacity: 0.45; }
  #list { flex: 1; min-height: 0; overflow: auto; padding-bottom: 12px; }
  .day { padding: 10px 16px 4px; border-bottom: 1px solid var(--border-strong); font: 500 var(--text-ui-sm) / 1.3 var(--font-body); }
  .ev { padding: 3px 16px 3px 14px; border-bottom: 1px solid var(--border-hairline); cursor: pointer; }
  .ev:hover { background: rgba(var(--ink-rgb), 0.03); }
  .line { display: grid; grid-template-columns: 60px 46px 76px 96px 58px minmax(0, 1fr); gap: 10px; align-items: baseline; }
  .line > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); font: 400 var(--text-xs) / 1.6 var(--font-body); }
  .line time, .link time { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.6 var(--font-mono); font-variant-numeric: tabular-nums; }
  .line .text { color: var(--text-primary); font-size: var(--text-sm); }
  /* a failed outcome in the ink's own gray with a ✕, since only Color by's choice takes a color */
  .line .failed { color: var(--text-primary); }
  /* an event opened in place: its whole text, the fields its line leaves out, what it answers and what answers it,
     and its lines as the file holds them */
  .thimble-details { padding: 2px 0 10px 70px; cursor: default; font: 400 var(--text-xs) / 1.5 var(--font-body); }
  .thimble-details p { margin: 2px 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--text-sm); }
  .thimble-details dl { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: 0; color: var(--text-secondary); }
  .thimble-details dt { display: inline; color: var(--text-tertiary); }
  .thimble-details dd { display: inline; margin: 0 0 0 4px; }
  .thimble-details h4 { margin: 8px 0 2px; font: 500 var(--text-xs) / 1.4 var(--font-body); }
  .link { display: grid; grid-template-columns: 112px 150px minmax(0, 1fr); gap: 10px; padding: 1px 0; cursor: pointer; }
  .link > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link:hover .text { text-decoration: underline; }
  .raw { margin: 8px 0 6px; padding: 6px 8px; border-radius: var(--radius-ui); background: rgba(var(--ink-rgb), 0.035); font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .raw b { display: inline-block; min-width: 32px; color: var(--text-tertiary); font-weight: 400; }
  .empty { padding: 28px 16px; color: var(--text-tertiary); }
</style>
</head>
<body>
<div id="view">
  <div class="top">
    <input class="field" id="q" type="search" placeholder="Search events" aria-label="Search events">
    <select class="field" id="inc" aria-label="Incident"><option value="">All incidents</option></select>
    <span id="colour"></span>
  </div>
  <div class="chart">
    <div></div><div id="read"></div>
    <div></div><div id="range"></div>
    <div></div><div id="axis"></div>
    <div id="names"></div><svg id="lanes"></svg>
  </div>
  <div id="list"></div>
</div>
<script>
// Timeline: a ferry operator's events from five sources on one time axis. The time range's viewfinder picks the
// time the lanes (one per source) and the list show; the list opens an event in place with what it answers and what
// answers it. One fetch gives the events the search, the incident and Color by keep; the lanes and the overview draw
// them in Color by's colors.
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const hms = (t) => new Date(t * 1000).toISOString().slice(11, 19)
const dayOf = (t) => new Date(t * 1000).toISOString().slice(0, 10)
const dur = (s) => (s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`)
const SLUG = (thimble.view && thimble.view.slug) || 'timeline'
const SOURCES = ['alert', 'deploy', 'agent', 'chat', 'ticket']
const LH = 22 // a lane's height
const $ = (id) => document.getElementById(id)
const q = $('q'), inc = $('inc'), lanes = $('lanes'), list = $('list')
let E = [] // the events shown, in time order: {r, t, ref, source, kind, actor, service, severity, outcome, incident, text, value}
let span = null, flags = [], scale = null
let open = null, detail = null // the event opened in place, and its record in full
let keep = [] // the row a citation opened, kept whatever the label filter
let guide = null // the time of the flag hovered, drawn as a line through the lanes
let seq = 0, markLoaded
const loaded = new Promise((ok) => (markLoaded = ok))

const colour = thimble.colorBy({
  mount: '#colour',
  // each field says what it is (from view.json's records), and `meanings` what the values the sources' formats fix
  // mean (reader.py's notes), which the menu and a chip's hover give; a value with none, such as a service or a
  // person, shows what the field is. `meanings` declares no value, so the values keep the colors the records give them
  fields: [
    { name: 'service', title: 'Service', description: "The service the event is about: its svc or service, the ticket's in tickets/index.csv, else its summary's first word" },
    {
      name: 'kind', title: 'Kind', description: "What happened, from its state, event, Status or action: an alert firing read as fired, a ticket's first message as opened",
      meanings: {
        fired: 'An alert started firing', resolved: 'An alert stopped firing; it answers the alert it resolves',
        started: 'A deploy started', finished: 'A deploy finished, ok or failed', rollback: 'A deploy put an earlier version back',
        message: 'A chat message', opened: "A ticket's first message, or an agent opening an incident",
        updated: "A ticket's later message that does not close it", closed: "A ticket's message that closes it, or an agent closing an incident",
        restart: 'An agent restarted a replica or a worker', page: 'An agent paged a person, or escalated a page',
        scale: 'An agent changed how many replicas a service runs', tag: 'An agent tagged support tickets',
        pause: 'An agent paused, as a person asked in chat', resume: 'An agent resumed, as a person asked in chat',
      },
    },
    {
      name: 'severity', title: 'Severity', description: "The alert's severity, or the ticket's priority in tickets/index.csv",
      meanings: {
        critical: "An alert of severity critical", warning: 'An alert of severity warning',
        urgent: 'A ticket of priority urgent in tickets/index.csv', high: 'A ticket of priority high in tickets/index.csv',
        normal: 'A ticket of priority normal in tickets/index.csv', low: 'A ticket of priority low in tickets/index.csv',
      },
    },
    {
      name: 'outcome', title: 'Outcome', description: 'The result an event records: ok, failed or held',
      meanings: {
        ok: "The agent's action or the deploy succeeded", failed: "The agent's action or the deploy failed, such as a restart that timed out",
        held: 'The agent held the action back, such as a page held until 07:00 in quiet hours',
      },
    },
    { name: 'actor', title: 'Actor', description: 'Who acted: a login or chat id as chat/users.json names it, or the agent', meanings: { monitor: 'The monitor, which raises and resolves the alerts' } },
    {
      name: 'source', title: 'Source', description: "The file the event comes from: alerts, deploys, the agents' log, chat or tickets",
      meanings: {
        alert: "One of the monitor's alerts, in alerts/*.jsonl", deploy: "A deploy tool event, a row of deploys.csv",
        chat: "A message in a channel's file in chat/", ticket: "A support ticket's message, in tickets/*.txt",
        agent: "An automated agent's action, a line of agents.log",
      },
    },
  ],
  chips: 'filter',
  strip: '#list',
  onChange: load,
})
const hover = (m) => { guide = m ? m.t : null; drawLanes() }
const range = thimble.timeRange({ mount: '#range', readout: '#read', onChange: draw, onMark: hover })
thimble.onReset({ changed: () => open != null, reset: () => { open = null; keep = []; load() } })
$('names').innerHTML = SOURCES.map((s) => `<div>${s}</div>`).join('')
lanes.setAttribute('height', LH * SOURCES.length)

async function load() {
  const my = ++seq, query = { op: 'overview', colour: colour.query(), incident: inc.value, q: q.value.trim(), keep }
  const cols = {}, counts = {}
  let from = 0
  try {
    do {
      const page = await thimble.fetch({ ...query, from }, { key: 'events' })
      if (my !== seq) return
      if (page.span) { span = page.span; flags = Object.entries(page.starts).map(([label, t]) => ({ t, label })) }
      for (const k in page.cols) (cols[k] = cols[k] || []).push(...page.cols[k])
      for (const k in page.counts) counts[k] = (counts[k] || 0) + page.counts[k]
      from = page.next
    } while (from != null)
  } catch (e) {
    if (e.name === 'AbortError') return
    throw e
  }
  E = (cols.r || []).map((_, i) => Object.fromEntries(Object.keys(cols).map((k) => [k, cols[k][i]])))
  if (inc.options.length === 1) for (const f of flags) inc.add(new Option(f.label, f.label))
  colour.counts(counts)
  // the overview keeps the whole span whatever the search keeps, so the viewfinder stays where it was
  const pad = (span[1] - span[0]) * 0.005
  range.data({ times: E.map((e) => e.t), values: E.map((e) => e.value), span: [span[0] - pad, span[1] + pad], marks: flags })
  markLoaded()
  draw()
}

function draw() {
  if (!span) return
  scale = range.scale(lanes.clientWidth)
  thimble.timeAxis('#axis', scale, { marks: flags, onMark: hover })
  drawLanes()
  drawList()
}

// a lane per source: the events in the range in bins of the axis's scale, each bin stacked in Color by's colors,
// every lane on one height scale
function drawLanes() {
  if (!scale) return
  const bins = scale.bins(3), order = colour.values.map((v) => v.value)
  const n = SOURCES.map(() => bins.map(() => new Map()))
  for (const e of E) {
    const b = scale.binOf(e.t), l = SOURCES.indexOf(e.source)
    if (b >= 0 && l >= 0) n[l][b].set(e.value, (n[l][b].get(e.value) || 0) + 1)
  }
  const total = (m) => [...m.values()].reduce((a, b) => a + b, 0)
  const max = Math.max(1, ...n.flat().map(total))
  let s = ''
  n.forEach((lane, l) => {
    const base = (l + 1) * LH - 3
    s += `<line class="base" x1="0" x2="${scale.width}" y1="${base + 0.5}" y2="${base + 0.5}"/>`
    lane.forEach((m, b) => {
      const sum = total(m)
      if (!sum) return
      const x = scale.x(bins[b][0]), w = Math.max(1, scale.x(bins[b][1]) - x - 1)
      let y = base
      const h = Math.max(2, Math.sqrt(sum / max) * (LH - 6))
      for (const [v, k] of [...m].sort((a, c) => order.indexOf(a[0]) - order.indexOf(c[0]))) {
        const c = colour.colourOf(v), hh = (k / sum) * h
        y -= hh
        s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}"${c ? ` fill="${c}"` : ' class="none"'}/>`
      }
    })
  })
  const at = E.find((e) => e.r === open)
  for (const t of [guide, at && at.t]) if (t != null && range.has(t)) s += `<line class="guide" x1="${scale.x(t)}" x2="${scale.x(t)}" y1="0" y2="${LH * SOURCES.length}"/>`
  lanes.innerHTML = s
}

// the events in the range, a heading for each day, each row with a 3 px bar in its Color by color; a heading is no
// record, so it takes no label's mark
function drawList() {
  let h = '', day = ''
  for (const e of E) {
    if (!range.has(e.t)) continue
    if (dayOf(e.t) !== day) h += `<div class="day">${range.format(e.t, (day = dayOf(e.t), 86400))}</div>`
    const failed = e.outcome === 'failed' ? ' class="failed" title="failed"' : ''
    h += `<div class="ev" data-r="${e.r}" data-anchor="${esc(e.ref)}" data-anchor-text="${esc(e.text)}"${colour.attr(e)}><div class="line"><time>${hms(e.t)}</time><span>${esc(e.source)}</span><span${failed}>${failed ? '✕ ' : ''}${esc(e.kind)}</span><span>${esc(e.actor)}</span><span>${esc(e.incident)}</span><span class="text">${esc(e.text)}</span></div>${e.r === open && detail ? details(detail) : ''}</div>`
  }
  list.innerHTML = h || '<div class="empty">No event</div>'
}

function details(d) {
  const r = d.record, fact = (k, v) => (v != null && v !== '' ? `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>` : '')
  const link = (b) => `<div class="link" data-go="${b.r}" data-anchor="${esc(b.ref)}"><time>${range.format(b.t, 1)}</time><span>${esc(b.source)} · ${esc(b.actor)}</span><span class="text">${esc(b.text)}</span></div>`
  return `<div class="thimble-details"><p>${esc(r.text)}</p><dl>${fact('service', r.service)}${fact('severity', r.severity)}${fact('outcome', r.outcome)}${fact('id', r.id)}${fact('took', r.took != null ? dur(r.took) : '')}</dl>` +
    (d.answers ? `<h4>Answers</h4>${link(d.answers)}` : '') + (d.answered.length ? `<h4>Answered by</h4>${d.answered.map(link).join('')}` : '') +
    `<div class="raw">${d.raw.map(([n, s]) => `<b>${n}</b>${esc(s)}`).join('\n')}</div><button class="chip chip-tone-evidence chip-act" type="button" data-file="${esc(d.ref)}" title="Open in the File browser">${esc(d.ref)}</button></div>`
}

// the viewfinder on an incident's main burst, with a little room on each side: the run of its events with no gap over
// BURST_GAP that holds the most of them, so a follow-up days later does not shrink the burst to a sliver; the
// follow-ups stay in the overview
const BURST_GAP = 6 * 3600
function frame() {
  if (!E.length) return
  let best = [0, 0], from = 0
  for (let i = 1; i <= E.length; i++) {
    if (i < E.length && E[i].t - E[i - 1].t <= BURST_GAP) continue
    if (i - from > best[1] - best[0] + 1) best = [from, i - 1]
    from = i
  }
  const a = E[best[0]].t, b = E[best[1]].t, pad = Math.max(300, (b - a) * 0.05)
  range.set(a - pad, b + pad)
}

// an event opened in place from anywhere: a link in another event's details, a lane, a citation
async function show(r) {
  if (!E.some((e) => e.r === r)) { keep = [r]; q.value = ''; inc.value = ''; await load() }
  const e = E.find((x) => x.r === r)
  if (!e) return
  if (!range.has(e.t)) { const w = range.to - range.from; range.set(e.t - w / 2, e.t + w / 2) }
  detail = await thimble.fetch({ op: 'record', r, keep }, { key: 'record' })
  open = r
  draw()
  list.querySelector(`.ev[data-r="${r}"]`)?.scrollIntoView({ block: 'center' })
}

list.addEventListener('click', async (ev) => {
  const go = ev.target.closest('[data-go]'), file = ev.target.closest('[data-file]'), row = ev.target.closest('.ev')
  if (go) return show(+go.dataset.go)
  if (file) return thimble.navigate(file.dataset.file, { browser: true })
  if (!row || ev.target.closest('.thimble-details')) return
  const r = +row.dataset.r
  if (open !== r) detail = await thimble.fetch({ op: 'record', r, keep }, { key: 'record' })
  open = open === r ? null : r
  thimble.expand(row, () => { drawList(); drawLanes() })
})
// a click on a lane opens the event nearest the pointer in that lane
lanes.addEventListener('click', (ev) => {
  const box = lanes.getBoundingClientRect(), source = SOURCES[Math.floor((ev.clientY - box.top) / LH)]
  const t = scale.t(ev.clientX - box.left), near = (e) => Math.abs(e.t - t)
  const hit = E.filter((e) => e.source === source && range.has(e.t) && near(e) <= scale.step(6)).sort((a, b) => near(a) - near(b))[0]
  if (hit) show(hit.r)
})
let typing = null
q.addEventListener('input', () => { clearTimeout(typing); typing = setTimeout(load, 200) })
// an incident picked in the top row narrows to it and frames its span, as its citation does; All incidents frames the
// whole span again
inc.addEventListener('change', async () => {
  await load()
  if (inc.value) frame()
  else range.set(null)
})
addEventListener('resize', draw)
// the label filter changed: fetch again, since the reader keeps only what it keeps
let filter = null
thimble.onLabels((s) => { const f = JSON.stringify(s.filter || null); if (f !== filter) { filter = f; load() } })
// a label's values arrive while it runs, which the lanes, the overview and the chips follow while it is the color
let later = null
thimble.onMarks(() => { if (colour.label) { clearTimeout(later); later = setTimeout(load, 300) } })
// a citation: an event opened in place, an incident narrowed to and framed, a day or a window framed
thimble.onOpen(async (place) => {
  const t = (place && place.target) || {}
  await loaded
  if (t.r != null) return show(t.r)
  if (t.incident) {
    q.value = ''
    inc.value = t.incident
    await load()
    return frame()
  }
  if (t.day) { const a = Date.parse(t.day + 'T00:00:00Z') / 1000; return range.set(a, a + 86400) }
  if (t.from && t.to) range.set(Date.parse(t.from + ':00Z') / 1000, Date.parse(t.to + ':00Z') / 1000)
})
load()
</script>
</body>
</html>
