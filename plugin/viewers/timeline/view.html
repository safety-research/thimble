<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.table, .btn) and the theme's tokens come with the frame; this page only lays them out */
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; }
  #top { flex: none; padding: 12px 16px 4px; }
  #bin { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 32px; border-top: 1px solid var(--border-hairline); }
  /* the head leaves room at its left for the bar thimble draws on a marked unit, as the table's first cell does */
  #bin > div:first-child { padding-left: 8px; }
  h2 { margin: 0; font: 500 var(--text-lg) / 1.3 var(--font-body); }
  .meta { margin: 2px 0 10px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-tertiary); }
  .table td { vertical-align: top; }
  .table td.t, .table td.k { white-space: nowrap; color: var(--text-tertiary); }
  .table td.s, .table td.o, .table td.st { font-family: var(--font-body); font-size: var(--text-xs); }
  .table td.s, .table td.st { white-space: nowrap; }
  .table td.o { width: 100%; color: var(--text-secondary); }
  .table .note { color: var(--text-tertiary); }
  .table tbody tr { cursor: pointer; }
  .pages { display: flex; gap: 8px; margin-top: 10px; }
  /* vega-embed's tooltip in the theme's surface and type */
  #vg-tooltip-element.vg-tooltip { background: var(--surface-card); color: var(--text-primary); border: 1px solid var(--border-subtle); border-radius: var(--radius-ui); box-shadow: none; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  #vg-tooltip-element.vg-tooltip td.key { color: var(--text-tertiary); }
</style>
</head>
<body>
  <div id="top"><div id="chart"></div></div>
  <div id="bin"></div>
<script>
  // Deliveries: every record as a stacked bar per time bin and route, with one bin's records listed below. It opens on
  // the whole span with the busiest bin listed. A bar opens its bin; a row opens its record. Each row's data-anchor is
  // its file ref and the bin's head is view:<slug>/<bin>, so thimble marks them. While a label is on, the bars show the
  // label's part in its colour; a filter is applied by the reader, so the page fetches again in thimble.onLabels.
  const slug = (thimble.view && thimble.view.slug) || 'deliveries'
  const token = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim()
  const DAY = 86400
  const PAGE = 200 // reader.py BIN_ROWS
  const NOUN = ['delivery', 'deliveries']
  const count = (n) => `${n} ${NOUN[n === 1 ? 0 : 1]}`
  let chart = null // {bin: {seconds, first, last}, busiest, rows}
  let chartView = null
  let shown = null // {key, offset} of the listed bin
  let targetRef = null
  let label = null // the first label that is on

  function el(tag, cls, text) {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }

  // The axis names the unit the span needs: weekday and time within a week of short bins, the date beyond it, days for
  // day bins and the year for week bins.
  function axisFormat(bin) {
    const spanDays = (bin.last - bin.first) / 1000 / DAY
    if (bin.seconds < DAY) return spanDays < 1 ? '%H:%M' : spanDays < 7 ? '%a %H:%M' : '%d %b %H:%M'
    return bin.seconds < 7 * DAY ? '%d %b' : '%d %b %Y'
  }

  const DAYS = 'Sun Mon Tue Wed Thu Fri Sat'.split(' ')
  const MONTHS = 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')
  function binName(key, seconds) {
    const start = new Date(key.length > 10 ? key + ':00Z' : key + 'T00:00:00Z')
    const day = `${DAYS[start.getUTCDay()]} ${start.getUTCDate()} ${MONTHS[start.getUTCMonth()]} ${start.getUTCFullYear()}`
    const hm = (d) => d.toISOString().slice(11, 16)
    if (seconds < DAY) return `${day}, ${hm(start)} to ${hm(new Date(start.getTime() + seconds * 1000))}`
    return seconds < 7 * DAY ? day : `Week of ${day}`
  }

  // vega-lite sizes each bar to the reader's bin through its time unit
  function timeUnit(seconds) {
    if (seconds % DAY === 0) return { unit: 'utcyearmonthdate', step: seconds / DAY, binned: true }
    if (seconds % 3600 === 0) return { unit: 'utcyearmonthdatehours', step: seconds / 3600, binned: true }
    return { unit: 'utcyearmonthdatehoursminutes', step: Math.max(1, Math.round(seconds / 60)), binned: true }
  }

  // one row per bin and part, the label's records and the rest
  function byBin(rows, name) {
    const bins = new Map()
    for (const r of rows) {
      const b = bins.get(r.key) || { start: r.start, key: r.key, n: 0, marked: 0 }
      b.n += r.n
      b.marked += r.marked
      bins.set(r.key, b)
    }
    return [...bins.values()].flatMap((b) => [
      { start: b.start, key: b.key, part: name, n: b.marked },
      { start: b.start, key: b.key, part: `other ${NOUN[1]}`, n: b.n - b.marked },
    ]).filter((r) => r.n > 0)
  }

  async function drawChart() {
    chart = await thimble.fetch({ op: 'counts' })
    const width = Math.max(200, document.getElementById('chart').clientWidth)
    const ink = token('--text-tertiary')
    const mono = token('--font-mono')
    // Label colours repeat the viz colours, so while a label is on the bars show only its part in its colour and the
    // rest in a quiet ink; the routes get their viz colours back when no label is on.
    const rows = label ? byBin(chart.rows, label.name) : chart.rows
    const parts = label ? [label.name, ...(rows.some((r) => r.part !== label.name) ? [`other ${NOUN[1]}`] : [])] : []
    const legend = { orient: 'top', title: null, labelColor: token('--text-secondary'), labelFont: mono, labelFontSize: 11, symbolType: 'square' }
    const colour = label
      ? { field: 'part', type: 'nominal', scale: { domain: parts, range: [label.colour, token('--viz-ink-4')] }, legend }
      : { field: 'kind', type: 'nominal', scale: { range: [1, 2, 3, 4, 5].map((i) => token(`--viz-${i}`)) }, legend }
    const starts = chart.rows.map((r) => r.start)
    const domain = starts.length ? [Math.min(...starts), Math.max(...starts) + chart.bin.seconds * 1000] : undefined
    const spec = {
      width: 'container', height: 170, background: 'transparent', autosize: { type: 'fit-x', contains: 'padding' },
      data: { values: rows },
      mark: { type: 'bar', cursor: 'pointer' },
      encoding: {
        x: {
          field: 'start', type: 'temporal', timeUnit: timeUnit(chart.bin.seconds), title: null, scale: domain ? { domain } : {},
          axis: { format: axisFormat(chart.bin), labelOverlap: 'greedy', labelFlush: true, tickCount: Math.max(2, Math.floor(width / 90)) },
        },
        y: { field: 'n', type: 'quantitative', title: null, axis: { domain: false, ticks: false, tickMinStep: 1 } },
        color: colour,
        tooltip: [{ field: 'key', title: 'from' }, { field: label ? 'part' : 'kind', title: label ? 'part' : 'route' }, { field: 'n', title: NOUN[1] }],
        stroke: { condition: { test: 'datum.key === open', value: token('--text-primary') }, value: null },
        strokeWidth: { condition: { test: 'datum.key === open', value: 1.5 }, value: 0 },
      },
      params: [{ name: 'open', value: shown ? shown.key : '' }],
      config: {
        view: { stroke: null },
        font: token('--font-body'),
        axis: { labelFont: mono, labelFontSize: 11, labelColor: ink, tickColor: ink, domainColor: ink, gridColor: token('--border-hairline') },
      },
    }
    const res = await vegaEmbed('#chart', spec, { actions: false, renderer: 'svg' })
    chartView = res.view
    res.view.addEventListener('click', (_, item) => {
      const key = item && item.datum && item.datum.key
      if (key) thimble.navigate(`view:${slug}/${key}`)
    })
  }

  async function openBin(key, offset) {
    shown = { key, offset: offset || 0 }
    const res = await thimble.fetch(offset == null && targetRef ? { op: 'bin', key, ref: targetRef } : { op: 'bin', key, offset: shown.offset, ref: targetRef })
    shown.offset = res.offset
    const head = el('div')
    head.dataset.anchor = `view:${slug}/${key}`
    head.dataset.anchorName = `the ${NOUN[1]} from ${key}`
    const range = res.total > res.items.length ? `, ${res.offset + 1} to ${res.offset + res.items.length} shown` : ''
    head.append(el('h2', null, binName(key, chart.bin.seconds)), el('div', 'meta', count(res.total) + range))
    if (chartView) await chartView.signal('open', key).runAsync()
    const table = el('table', 'table')
    const thead = el('thead')
    const hr = el('tr')
    for (const h of ['Time', 'Route', 'Stop', 'Order', 'Status']) hr.append(el('th', null, h))
    thead.append(hr)
    const body = el('tbody')
    for (const d of res.items) {
      const tr = el('tr', d.ref === targetRef ? 'active' : '')
      tr.dataset.anchor = d.ref
      tr.dataset.anchorName = `the delivery to ${d.stop} at ${d.time}`
      tr.dataset.anchorText = [d.stop, d.order, d.status, d.note].filter(Boolean).join(' ')
      const order = el('td', 'o', d.order)
      if (d.note) order.append(el('div', 'note', d.note))
      tr.append(el('td', 't', d.time.slice(11, 16)), el('td', 'k', d.kind), el('td', 's', d.stop), order, el('td', 'st', d.status))
      tr.onclick = () => thimble.navigate(d.ref)
      body.append(tr)
    }
    table.append(thead, body)
    const pages = el('div', 'pages')
    if (res.offset > 0) {
      const prev = el('button', 'btn btn-secondary btn-sm', 'Earlier')
      prev.onclick = () => openBin(key, Math.max(0, res.offset - PAGE))
      pages.append(prev)
    }
    if (res.offset + res.items.length < res.total) {
      const next = el('button', 'btn btn-secondary btn-sm', 'Later')
      next.onclick = () => openBin(key, res.offset + res.items.length)
      pages.append(next)
    }
    const box = document.getElementById('bin')
    box.replaceChildren(head, table, pages)
    const hit = box.querySelector('tr.active')
    if (hit) hit.scrollIntoView({ block: 'center' })
    else box.scrollTop = 0
  }

  thimble.onOpen(async (place) => {
    const t = (place && place.target) || {}
    targetRef = t.ref || null
    if (!chart) await drawChart()
    if (t.bin) await openBin(t.bin)
    else if (!shown && chart.busiest) await openBin(chart.busiest, 0)
  })
  thimble.onLabels(async (state) => {
    label = state.labels[0] || null
    if (!chart) return // the first fetch reads them
    await drawChart()
    if (shown) await openBin(shown.key, 0)
    else if (chart.busiest) await openBin(chart.busiest, 0)
  })
</script>
</body>
</html>
