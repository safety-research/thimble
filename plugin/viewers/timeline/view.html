<!doctype html>
<html>
<head>
<style>
  /* thimble's parts come with the frame: the search, Filter by, Rows, Color by, the time range and its axis, the lanes,
     the divider, the table, the side panel, the text, the record and the theme's tokens. This page lays them out */
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-card); overflow: hidden; }
  * { box-sizing: border-box; }
  #view { height: 100%; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 12px 16px 10px; border-bottom: 1px solid var(--border-subtle); }
  #search { flex: 0 1 260px; min-width: 200px; }
  #colour { min-width: min(300px, 100%); max-width: 100%; }
  /* the overview: the readout, the range and its axis over the lanes, one column of time with the lanes' names in its
     gutter; the time stays put while the lanes scroll under it, and the divider under it sets its height; it is as wide
     as the pane, so it never scrolls sideways */
  #overview { flex: none; max-height: 46%; overflow: hidden auto; }
  .time { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 112px minmax(0, 1fr); padding: 8px 16px 0; background: var(--surface-card); }
  #read { flex-direction: row; gap: 10px; margin-bottom: 4px; }
  #key { align-self: center; }
  #lanes { padding: 2px 16px 8px; }
  /* the list: what it shows named over the table, and the side panel at its right */
  #body { flex: 1; min-height: 0; border-top: 1px solid var(--border-hairline); }
  .listbox { display: flex; flex-direction: column; min-height: 0; }
  .lhead { flex: none; display: flex; align-items: baseline; gap: 8px; min-width: 0; padding: 8px 16px 4px; }
  .lhead b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 var(--text-sm) / 1.4 var(--font-body); }
  .lhead span { flex: none; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); font-variant-numeric: tabular-nums; }
  .lhead .btn { flex: none; margin-left: auto; }
  #list { flex: 1; min-height: 0; }
  /* a failed outcome: ✕ and its kind in the problem red, as the lanes mark it */
  .failed { color: var(--status-negative); }
  /* an event in the side panel: its words, the event it answers and those that answer it, then its record */
  .words { margin: 0 0 12px; }
  .event h4 { margin: 14px 0 4px; font: 500 var(--text-xs) / 1.4 var(--font-body); }
  .event h4 span { margin-left: 6px; color: var(--text-tertiary); font-weight: 400; }
  .event .list-row { gap: 10px; min-width: 0; }
  .list-row > * { flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 var(--text-xs) / 1.6 var(--font-body); }
  .list-row time { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.6 var(--font-mono); font-variant-numeric: tabular-nums; }
  .list-row .what { color: var(--text-secondary); }
  .list-row .text { flex: 1; min-width: 0; }
  .rec { margin-top: 16px; }
</style>
</head>
<body>
<div id="view">
  <div class="top">
    <span id="search"></span>
    <span id="filter"></span>
    <span id="rows"></span>
    <span id="colour"></span>
  </div>
  <div id="overview">
    <div class="time">
      <div></div><div id="read"></div>
      <div></div><div id="range"></div>
      <div id="key"></div><div id="axis"></div>
    </div>
    <div id="lanes"></div>
  </div>
  <div id="body">
    <div class="listbox">
      <div class="lhead" id="lhead"></div>
      <div id="list"></div>
    </div>
  </div>
</div>
<script>
// Timeline: a ferry operator's events from five sources on one time axis. The top row searches the events, filters them
// (Filter by), groups the lanes (Rows) and colors them (Color by); the time range's viewfinder picks the time the lanes
// and the table show; an event opens in the side panel with the event it answers and those that answer it. One fetch
// gives the events the search and Filter by keep, each with its Color by value and its Rows group.
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const FAILED = (e) => e.outcome === 'failed'
const dur = (s) => (s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`)
const cap = (s) => String(s).charAt(0).toUpperCase() + String(s).slice(1)
const $ = (id) => document.getElementById(id)
let E = [] // the events shown, in time order: {r, t, ref, source, kind, actor, service, severity, outcome, incident, text, value, group}
let span = null
let shown = [] // the table's events: those in the range and in the lane chosen
let picked = null // the lane chosen, whose events the table shows: {key, value, name}
let open = null // the event in the side panel
let keep = [] // the row a citation opened, kept whatever the filters
let narrowTo = null // an incident a citation narrows Filter by to, once its values are in
let busy = false, seq = 0, markLoaded
const loaded = new Promise((ok) => (markLoaded = ok))

// the view's fields, which Filter by, Rows and Color by each offer: what each is (from view.json's records), and
// `meanings`, what the values the sources' formats fix mean (reader.py's notes), which the menus and a value's hover
// give; a value with none, such as a service or a person, shows what the field is
const SOURCES = ['alert', 'deploy', 'agent', 'chat', 'ticket']
const FIELDS = [
  { name: 'service', title: 'Service', description: "The service the event is about: its svc or service, the ticket's in tickets/index.csv, else its summary's first word" },
  {
    name: 'kind', title: 'Kind', description: "What happened, from its state, event, Status or action: an alert firing read as fired, a ticket's first message as opened",
    meanings: {
      fired: 'An alert started firing', resolved: 'An alert stopped firing; it answers the alert it resolves',
      started: 'A deploy started', finished: 'A deploy finished, ok or failed', rollback: 'A deploy put an earlier version back',
      message: 'A chat message', opened: "A ticket's first message, or an agent opening an incident",
      updated: "A ticket's later message that does not close it", closed: "A ticket's message that closes it, or an agent closing an incident",
      restart: 'An agent restarted a replica or a worker', page: 'An agent paged a person, or escalated a page',
      scale: 'An agent changed how many replicas a service runs', tag: 'An agent tagged support tickets',
      pause: 'An agent paused, as a person asked in chat', resume: 'An agent resumed, as a person asked in chat',
    },
  },
  {
    name: 'incident', title: 'Incident',
    description: "The incident the event belongs to: its incident, an inc- channel, an INC number in its text or the ticket's in tickets/index.csv; a deploy's later steps take its incident",
  },
  {
    name: 'severity', title: 'Severity', description: "The alert's severity, or the ticket's priority in tickets/index.csv",
    meanings: {
      critical: 'An alert of severity critical', warning: 'An alert of severity warning',
      urgent: 'A ticket of priority urgent in tickets/index.csv', high: 'A ticket of priority high in tickets/index.csv',
      normal: 'A ticket of priority normal in tickets/index.csv', low: 'A ticket of priority low in tickets/index.csv',
    },
  },
  {
    name: 'outcome', title: 'Outcome', description: 'The result an event records: ok, failed or held',
    meanings: {
      ok: "The agent's action or the deploy succeeded", failed: "The agent's action or the deploy failed, such as a restart that timed out",
      held: 'The agent held the action back, such as a page held until 07:00 in quiet hours',
    },
  },
  { name: 'actor', title: 'Actor', description: 'Who acted: a login or chat id as chat/users.json names it, or the agent', meanings: { monitor: 'The monitor, which raises and resolves the alerts' } },
  {
    name: 'source', title: 'Source', description: "The file the event comes from: alerts, deploys, the agents' log, chat or tickets", values: SOURCES,
    meanings: {
      alert: "One of the monitor's alerts, in alerts/*.jsonl", deploy: 'A deploy tool event, a row of deploys.csv',
      chat: "A message in a channel's file in chat/", ticket: "A support ticket's message, in tickets/*.txt",
      agent: "An automated agent's action, a line of agents.log",
    },
  },
]

// the search marks the words in the table's rows, and the reader keeps only the events that hold them, so the lanes
// show those alone
const search = thimble.search({ mount: '#search', in: '#list', placeholder: 'Search events', onChange: () => load() })
const colour = thimble.colorBy({ mount: '#colour', fields: FIELDS, initial: 'service', onChange: load })
const filter = thimble.filterBy({ mount: '#filter', fields: FIELDS, initial: 'incident', onChange: load })
const rows = thimble.rows({ mount: '#rows', fields: FIELDS, initial: 'source', onChange: () => { pick(null); load() } })
const range = thimble.timeRange({ mount: '#range', readout: '#read', onChange: draw })
// the lanes and the table's strip draw each event in the value the reader gave it, which holds for a label too, whose
// marks reach only the rows the table draws; a row's bar is Color by's own (attr). In the lanes a failed event is
// a ✕ in the problem red, and the table's rows in view are a tint across them
const painted = { keeps: () => true, valueOf: (e) => e.value, colourOf: (v) => colour.colourOf(v), attr: (e) => colour.attr(e) }
const lanes = thimble.timeline({
  mount: '#lanes', keyMount: '#key', rows, range, colour: painted, names: 112, follow: '#list',
  problem: FAILED, words: { problem: 'failed' },
  tip: (e) => `${e.kind}${FAILED(e) ? ' · failed' : ''} · ${e.actor} · ${e.text}`,
  onPick: (lane) => pick(picked && picked.key === lane.key ? null : lane),
  onMark: (e) => show(e.r, true),
})
const side = thimble.side({ mount: '#body', onClose: () => { open = null } })
// the events in the range as a table: the time (the date on a day's first event), the source, the kind (✕ before a
// failure), the actor and the incident, which a narrow table drops first, and the text; a row opens in the side panel,
// and ↑ ↓ move it to the next
const table = thimble.table({
  mount: '#list', side, search, colour: painted,
  columns: [
    { name: 't', title: 'Time', type: 'time', drop: false, days: true },
    { name: 'source', title: 'Source', width: 64 },
    { name: 'kind', title: 'Kind', width: 96, html: (e) => (FAILED(e) ? `<span class="failed" title="failed">✕ ${esc(e.kind)}</span>` : esc(e.kind)) },
    { name: 'actor', title: 'Actor', width: 110, drop: 2 },
    { name: 'incident', title: 'Incident', width: 76, drop: 1 },
    { name: 'text', title: 'Text' },
  ],
  details: (e) => ({ title: `${cap(e.source)} ${e.kind}${e.service ? ' · ' + e.service : ''}`, sub: `${range.format(e.t, 1)} · ${e.actor}`, render: (body) => details(body, e) }),
  onOpen: (e) => { open = e.r; reset.check() },
})
thimble.divider({ top: '#overview' })
const reset = thimble.onReset({ changed: () => picked != null || keep.length > 0, reset: () => { pick(null); keep = []; load() } })

async function load() {
  const my = ++seq
  const query = { op: 'overview', colour: colour.query(), filter: filter.query(), rows: rows.query(), q: search.text.trim(), keep }
  const cols = {}, counts = {}, fcounts = {}
  let from = 0
  busy = true
  head()
  try {
    do {
      const page = await thimble.fetch({ ...query, from }, { key: 'events' })
      if (my !== seq) return
      if (page.span) span = page.span
      for (const k in page.cols) (cols[k] = cols[k] || []).push(...page.cols[k])
      for (const k in page.counts) counts[k] = (counts[k] || 0) + page.counts[k]
      for (const k in page.fcounts) fcounts[k] = (fcounts[k] || 0) + page.fcounts[k]
      from = page.next
    } while (from != null)
  } catch (e) {
    if (e.name === 'AbortError') return
    throw e
  } finally {
    if (my === seq) busy = false
  }
  E = (cols.r || []).map((_, i) => Object.fromEntries(Object.keys(cols).map((k) => [k, cols[k][i]])))
  colour.counts(counts)
  filter.counts(fcounts)
  // the overview keeps the whole span whatever the filters keep, so the viewfinder stays where it was
  const pad = (span[1] - span[0]) * 0.005
  range.data({ times: E.map((e) => e.t), values: E.map((e) => e.value), span: [span[0] - pad, span[1] + pad] })
  markLoaded()
  if (narrowTo != null && filter.field === 'incident') narrowNow()
  draw()
}

function draw() {
  if (!span) return
  thimble.timeAxis('#axis', range.scale($('axis').clientWidth))
  lanes.draw(E)
  drawList()
}

// the table: the events in the range and in the lane chosen
function drawList() {
  const inLane = (e) => !picked || (rows.groupOf(e) ?? null) === picked.value
  shown = E.filter((e) => range.has(e.t) && inLane(e))
  table.draw(shown)
  head()
}

// what the table shows, named over it: the lane chosen or every event, its first and last time, and how many
function head() {
  const what = picked ? `${rows.by ? rows.by.title + ': ' : ''}${picked.name}` : 'In the range'
  const when = shown.length ? `${range.format(shown[0].t, 60)} – ${range.format(shown[shown.length - 1].t, 60)}` : ''
  $('lhead').innerHTML = `<b>${esc(what)}</b>${when ? `<span>${esc(when)}</span>` : ''}<span>${span ? `${shown.length} ${shown.length === 1 ? 'event' : 'events'}` : ''}${busy ? ' · loading…' : ''}</span>` +
    (picked ? '<button class="btn btn-ghost btn-sm" type="button" data-all>Every lane</button>' : '')
}

function pick(lane) {
  picked = lane ? { key: lane.key, value: lane.value, name: lane.name } : null
  lanes.choose(picked ? picked.key : null)
  if (span) drawList()
  reset.check()
}

// an event in the side panel from anywhere: a lane, a link in another event, a citation; the table opens its row, so
// the row is chosen and in view
async function show(r, keys) {
  if (!E.some((e) => e.r === r)) { keep = [r]; await load() }
  const e = E.find((x) => x.r === r)
  if (!e) return
  if (!range.has(e.t)) { const w = range.to - range.from; range.set(e.t - w / 2, e.t + w / 2) }
  if (picked && (rows.groupOf(e) ?? null) !== picked.value) pick(null)
  drawList()
  table.open(e.ref)
  // opened by a click in the page, a mark or a link: the table takes the keys, so ↑ ↓ go on from the event
  if (keys) $('list').focus({ preventScroll: true })
}

// an event's details, once the reader sends it whole: its words, the event it answers and those that answer it, each a
// link that opens it, and its record under its citation: its fields but those the panel's title and sub give (the
// source, the kind, the service, the time and the actor), and its lines as the file holds them, in mono
async function details(body, e) {
  body.innerHTML = '<div class="event"></div>'
  let d
  try {
    d = await thimble.fetch({ op: 'record', r: e.r, keep }, { key: 'record' })
  } catch (err) {
    if (err.name === 'AbortError') return // the next event's fetch took its place, as ↓ moves on
    throw err
  }
  if (open !== e.r || !d || !body.isConnected) return
  const { text, source, kind, service, time, actor, ...fields } = d.record
  const link = (b) => `<div class="list-row" data-go="${b.r}" data-anchor="${esc(b.ref)}"><time>${range.format(b.t, 1)}</time><span class="what">${esc(b.source)} ${esc(b.kind)} · ${esc(b.actor)}</span><span class="text">${esc(b.text)}</span></div>`
  const box = body.firstElementChild
  box.innerHTML = '<div class="words"></div>' +
    (d.answers ? `<h4 title="The event this one follows: the alert it resolves, the message its thread starts with, the ticket's first message, the deploy's start, or what set the agent off">Response to<span>${dur(fields.took)} earlier</span></h4>${link(d.answers)}` : '') +
    (d.answered.length ? `<h4 title="The events that follow this one: the alert that resolves it, its thread's replies, the ticket's later messages, the deploy's later steps, the agents' actions it set off">Responses<span>${d.answered.length}</span></h4>${d.answered.map(link).join('')}` : '') +
    '<div class="rec"></div>'
  thimble.text(box.querySelector('.words'), text || kind, { format: 'plain' })
  // its bar the event's Color by value, which its fields may leave out
  thimble.record({ mount: box.querySelector('.rec'), value: { ...fields, [d.raw.length > 1 ? 'lines' : 'line']: d.raw.map(([, s]) => s).join('\n') }, ref: d.ref, mono: ['line', 'lines'], colour: { attr: () => painted.attr(e) } })
}
$('body').addEventListener('click', (ev) => {
  const go = ev.target.closest('[data-go]')
  if (go && !ev.metaKey && !ev.ctrlKey) show(+go.dataset.go, true)
})
$('lhead').addEventListener('click', (ev) => { if (ev.target.closest('[data-all]')) pick(null) })
addEventListener('resize', draw)
// the label filter changed: fetch again, since the reader keeps only what it keeps
let labelFilter = null
thimble.onLabels((s) => { const f = JSON.stringify(s.filter || null); if (f !== labelFilter) { labelFilter = f; load() } })
// a label's values arrive while it runs, which the lanes, the overview and the chips follow while a label is Color by's
// or Rows' choice: fetch again when a mark gives an event another value than the reader did, and not for the marks of
// the rows a scroll brings into view (Filter by and Rows hear a label's changes themselves)
const moved = (id, e, v) => {
  const m = id && thimble.markOf(e.ref)
  const got = m && (m.values || []).find((x) => x.id === id)
  return !!m && (got ? String(got.value) : null) !== (v ?? null)
}
let later = null
thimble.onMarks(() => {
  if ((colour.label || rows.label) && E.some((e) => moved(colour.label, e, e.value) || moved(rows.label, e, e.group))) { clearTimeout(later); later = setTimeout(load, 300) }
})

// the viewfinder on an incident's main burst, with a little room on each side: the run of its events with no gap over
// BURST_GAP that holds the most of them, so a follow-up days later does not shrink the burst to a sliver; the
// follow-ups stay in the overview
const BURST_GAP = 6 * 3600
function frame(incident) {
  const ts = E.filter((e) => e.incident === incident).map((e) => e.t)
  if (!ts.length) return
  let best = [0, 0], from = 0
  for (let i = 1; i <= ts.length; i++) {
    if (i < ts.length && ts[i] - ts[i - 1] <= BURST_GAP) continue
    if (i - from > best[1] - best[0] + 1) best = [from, i - 1]
    from = i
  }
  const a = ts[best[0]], b = ts[best[1]], pad = Math.max(300, (b - a) * 0.05)
  range.set(a - pad, b + pad)
}
// an incident's citation: Filter by on Incident with that incident alone on, and the viewfinder on its burst
function narrow(incident) {
  narrowTo = incident
  if (filter.field === 'incident') narrowNow()
  else filter.choose('incident') // its onChange fetches the incidents' counts, and load() narrows then
}
function narrowNow() {
  const want = narrowTo
  narrowTo = null
  frame(want)
  for (const v of filter.values) if ((v.value === want) !== v.on) filter.toggle(v.value)
}
// a citation: an event in the side panel, an incident narrowed to and framed, a day or a window framed
thimble.onOpen(async (place) => {
  const t = (place && place.target) || {}
  await loaded
  if (t.r != null) return show(t.r)
  if (t.incident) return narrow(t.incident)
  if (t.day) { const a = Date.parse(t.day + 'T00:00:00Z') / 1000; return range.set(a, a + 86400) }
  if (t.from && t.to) range.set(Date.parse(t.from + ':00Z') / 1000, Date.parse(t.to + ':00Z') / 1000)
})
load()
</script>
</body>
</html>
