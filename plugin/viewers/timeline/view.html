<!doctype html>
<html>
<head>
<style>
  :root {
    --ink: var(--text-primary, #23211d);
    --ink-2: var(--text-secondary, #5f5a52);
    --ink-3: var(--text-tertiary, #8b857b);
    --card: var(--surface-card, #ffffff);
    --inset: var(--bg-sunken, #f3f1ec);
    --line-2: var(--border-subtle, rgba(35, 33, 29, 0.12));
    --live: var(--accent, #5b5bd6);
    --sans: var(--font-body, ui-sans-serif, system-ui, sans-serif);
    --mono: var(--font-mono, ui-monospace, monospace);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 13px/1.5 var(--sans); color: var(--ink); display: flex; flex-direction: column; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #chart { flex: none; padding: 12px 16px 0; }
  #window { flex: 1; min-height: 0; overflow: auto; padding: 8px 16px 32px; border-top: 1px solid var(--line-2); }
  h2 { font-size: 14px; font-weight: 500; margin: 8px 0 2px; }
  .meta { font-size: 11px; color: var(--ink-3); margin-bottom: 10px; }
  table { border-collapse: collapse; width: 100%; max-width: 980px; }
  td { padding: 4px 10px 4px 0; border-top: 1px solid var(--line-2); font-size: 12px; vertical-align: top; }
  td.t, td.k { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  tr { cursor: pointer; }
  tr:hover td { background: var(--inset); }
  tr.target td { color: var(--live); }
</style>
</head>
<body>
  <div id="chart"></div>
  <div id="window"></div>
<script>
  // Activity by ten minutes: a stacked bar per window and kind of call (vega-lite, one of the libraries thimble
  // inlines), and below it the calls of the window the analyst clicks or the ref names, each row a data-anchor with its
  // line. The windows are UTC, so the axis is too.
  const slug = (thimble.view && thimble.view.slug) || 'activity-by-ten-minutes'
  const css = (name, fallback) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback
  let targetRef = null
  let chartDrawn = false

  function el(tag, cls, text) {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }

  async function drawChart() {
    const values = await thimble.fetch({ op: 'counts' })
    const ink = css('--text-tertiary', '#8b857b')
    const palette = [['--viz-1', '#0072b2'], ['--viz-2', '#e69f00'], ['--viz-3', '#009e73'], ['--viz-4', '#d62728'], ['--viz-5', '#cc79a7'], ['--viz-6', '#8c65e8']]
    const spec = {
      width: 'container', height: 180, background: 'transparent',
      data: { values },
      mark: { type: 'bar', cursor: 'pointer' },
      encoding: {
        // the reader has already counted each window, so the time unit only sizes the bars to ten minutes and formats the axis
        x: { field: 'start', type: 'temporal', timeUnit: { unit: 'utcyearmonthdatehoursminutes', step: 10, binned: true }, title: null, axis: { labelColor: ink, tickColor: ink, domainColor: ink, format: '%H:%M' } },
        y: { field: 'n', type: 'quantitative', title: null, axis: { labelColor: ink, gridColor: css('--border-hairline', '#eee'), domain: false, ticks: false } },
        color: { field: 'kind', type: 'nominal', title: null, scale: { range: palette.map(([name, fallback]) => css(name, fallback)) }, legend: { orient: 'top', labelColor: ink, labelFont: css('--font-mono', 'monospace') } },
        tooltip: [{ field: 'window', title: 'window (UTC)' }, { field: 'kind' }, { field: 'n', title: 'calls' }],
      },
      config: { view: { stroke: null }, font: css('--font-body', 'sans-serif') },
    }
    const res = await vegaEmbed('#chart', spec, { actions: false, renderer: 'svg' })
    res.view.addEventListener('click', (_, item) => {
      const w = item && item.datum && item.datum.window
      if (w) thimble.navigate(`view:${slug}/${w}`)
    })
    chartDrawn = true
  }

  async function openWindow(key) {
    const res = await thimble.fetch({ op: 'window', window: key })
    const box = document.getElementById('window')
    const head = el('div')
    head.dataset.anchor = `view:${slug}/${key}`
    head.dataset.anchorName = `the calls of the ten minutes from ${key}`
    head.append(el('h2', null, `${key.replace('T', ' ')} UTC`), el('div', 'meta mono', `${res.total} calls${res.total > res.items.length ? `, the first ${res.items.length} shown` : ''}`))
    const table = el('table')
    for (const call of res.items) {
      const tr = el('tr', call.ref === targetRef ? 'target' : '')
      tr.dataset.anchor = call.ref
      tr.dataset.anchorName = `the ${call.action} call at ${call.time}`
      tr.dataset.anchorText = [call.action, call.agent, call.detail].filter(Boolean).join(' ')
      tr.append(el('td', 't', call.time.slice(11, 19)), el('td', 'k', call.action), el('td', null, call.agent), el('td', null, call.detail))
      tr.onclick = () => thimble.navigate(call.ref)
      table.append(tr)
    }
    box.replaceChildren(head, table)
    const hit = box.querySelector('tr.target')
    if (hit) hit.scrollIntoView({ block: 'center' })
  }

  thimble.onOpen(async (place) => {
    const t = (place && place.target) || {}
    targetRef = t.ref || null
    if (!chartDrawn) await drawChart()
    if (t.window) await openWindow(t.window)
  })
</script>
</body>
</html>
