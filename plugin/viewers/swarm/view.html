<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .chip, .btn, .seg, .table, .list-row) and the theme's tokens come with the frame; this page
     only lays them out */
  html, body { margin: 0; height: 100%; }
  [hidden] { display: none !important; }
  body { background: var(--surface-card); display: flex; flex-direction: column; overflow: hidden; }
  #bar { flex: none; padding: 10px 16px 8px; border-bottom: 1px solid var(--border-hairline); background: var(--surface-card); }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .row + .row { margin-top: 7px; }
  .grow { flex: 1 1 auto; }
  /* the places keep to one row that scrolls sideways */
  #threads { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
  #threads > * { flex: none; }
  #askf { display: flex; gap: 6px; }
  #ask { flex: 1 1 auto; min-width: 0; }
  #asked { margin: 6px 0 0; font: 400 var(--text-xs) / 1.4 var(--font-body); color: var(--text-secondary); overflow-wrap: anywhere; }
  #asked.err { color: var(--status-danger, var(--status-warning)); }
  #title { flex: 1 1 200px; min-width: 0; margin: 0; font: 500 var(--text-sm) / 1.35 var(--font-body); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #counts { font: 400 var(--text-xs) / 1.3 var(--font-body); color: var(--text-secondary); font-variant-numeric: tabular-nums; margin-right: 6px; white-space: nowrap; }
  #q { flex: 0 1 190px; min-width: 110px; }
  .thr { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; margin-right: 8px; }
  .thr .chip { font-weight: 600; }
  .plink { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; font: 400 var(--text-xs) / 1.3 var(--font-body); color: var(--text-secondary); text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), .3); text-underline-offset: 2px; cursor: pointer; }
  .plink:hover { color: var(--text-primary); text-decoration-color: currentColor; }
  .chip .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); font-variant-numeric: tabular-nums; }
  .chip.active .n { color: inherit; opacity: .75; }
  .sw { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 2px; }
  select.field { field-sizing: content; max-width: 200px; }
  #types { gap: 4px; }
  .ico { width: 12px; height: 12px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .cbtn { gap: 6px; padding: 0 7px 0 9px; }
  .cbtn .k { color: var(--text-tertiary); font-weight: 400; }
  .cbtn .ico { color: var(--text-tertiary); }
  #pager { display: inline-flex; align-items: center; gap: 4px; font: 400 var(--text-xs) / 1 var(--font-body); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  #problems { margin: 7px 0 0; font: 400 var(--text-xs) / 1.4 var(--font-body); color: var(--status-warning); overflow-wrap: anywhere; }
  .lg { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px 0 4px; border-radius: var(--radius-chip); font: 400 var(--text-xs) / 1 var(--font-body); color: var(--text-secondary); }
  .lg { cursor: pointer; }
  .lg:hover { background: var(--surface-hover); color: var(--text-primary); }
  .lg .n { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .lg.off { opacity: .38; }
  .swb { display: inline-grid; place-items: center; width: 16px; height: 16px; margin: 0 -4px; border-radius: 3px; flex: none; cursor: pointer; }
  .swb:hover { background: var(--track-bg); }

  main { flex: 1; min-height: 0; display: flex; position: relative; }
  #chart { flex: 1; min-width: 0; overflow: auto; position: relative; outline: none; }
  #empty { margin: 48px auto; max-width: 420px; padding: 0 16px; text-align: center; font: 400 var(--text-sm) / 1.5 var(--font-body); color: var(--text-secondary); }
  #grid { display: grid; width: max-content; min-width: 100%; }
  #corner { grid-area: 1 / 1; position: sticky; left: 0; top: 0; z-index: 6; background: var(--surface-card); border-right: 1px solid var(--border-hairline); border-bottom: 1px solid var(--border-hairline); box-sizing: border-box; padding: 10px 12px 0 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .seg-sm .seg-opt { height: 20px; padding: 0 7px; }
  #cols { grid-area: 1 / 2; position: sticky; top: 0; z-index: 5; background: var(--surface-card); border-bottom: 1px solid var(--border-hairline); box-sizing: border-box; }
  #rows { grid-area: 2 / 1; position: sticky; left: 0; z-index: 4; background: var(--surface-card); border-right: 1px solid var(--border-hairline); box-sizing: border-box; }
  #plot { grid-area: 2 / 2; position: relative; }
  .hcap { font: 500 10.5px / 1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); white-space: nowrap; }
  #cols .hcap { position: absolute; left: 16px; top: 10px; }
  #cols .hcap .note { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .col { position: absolute; top: 26px; font: 400 10.5px / 1.3 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-secondary); white-space: nowrap; }
  .col .d { color: var(--text-tertiary); }
  .col.none { color: var(--text-tertiary); }
  .band { position: absolute; left: 0; right: 0; }
  .band.odd { background: rgba(var(--ink-rgb), .022); }

  .agent { position: absolute; left: 0; right: 0; box-sizing: border-box; padding: 0 12px 0 16px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .agent:hover .nm, .agent.sel .nm { text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), .35); text-underline-offset: 2px; }
  .agent.odd { background: rgba(var(--ink-rgb), .022); }
  .av { flex: none; width: 28px; height: 28px; border-radius: 7px; background: var(--track-bg); display: block; }
  .av rect { fill: var(--text-secondary); }
  .who { min-width: 0; flex: 1; }
  .who .nm { font: 600 var(--text-ui-sm) / 1.3 var(--font-body); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .goal { margin-top: 1px; font: 400 var(--text-xs) / 1.38 var(--font-body); color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .who .sig { margin-top: 2px; font: 400 10.5px / 1.35 var(--font-mono); color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .card { position: absolute; box-sizing: border-box; padding: 7px 10px 8px; background: var(--surface-card); border: 1px solid rgba(var(--ink-rgb), .16); border-radius: var(--radius-ui); cursor: pointer; transition: opacity .12s, border-color .12s; }
  .card:hover { border-color: rgba(var(--ink-rgb), .38); }
  .card.sel { border-color: var(--text-primary); box-shadow: 0 0 0 1px var(--text-primary); }
  .card.ctx { border-style: dashed; }
  .card .hd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; min-width: 0; font: 400 10.5px / 1.3 var(--font-mono); color: var(--text-tertiary); white-space: nowrap; }
  .card .hd .tag { font-weight: 600; color: var(--text-primary); }
  /* a value too long for the rest of the line goes to a line of its own, and wraps there rather than being cut */
  .card .hd .v { flex: 0 0 auto; max-width: 100%; white-space: normal; overflow-wrap: anywhere; font-weight: 600; font-family: var(--font-body); }
  /* the name a card's save signs with, or its account, on a line of its own so neither it nor the value is cut */
  .card .as { margin-top: 1px; font: 400 10.5px / 1.3 var(--font-body); color: var(--text-tertiary); overflow-wrap: anywhere; }
  .card .ac { margin-top: 3px; font: 500 12.5px / 1.36 var(--font-body); color: var(--text-primary); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .tick { position: absolute; left: -1px; right: -1px; top: -1px; height: 3px; border-radius: var(--radius-ui) var(--radius-ui) 0 0; }
  #links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #links .hit { pointer-events: stroke; stroke: transparent; stroke-width: 10; fill: none; cursor: pointer; }
  #links .ln { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; transition: opacity .12s; }
  #links .end { transition: opacity .12s; }
  .lbl { position: absolute; height: 14px; box-sizing: border-box; padding: 0 3px; border-radius: 3px; background: var(--surface-card); font: 500 10.5px / 14px var(--font-mono); white-space: nowrap; cursor: pointer; transition: opacity .12s; }
  .lbl:hover { text-decoration: underline; }
  .focus .card:not(.lit), .focus .agent:not(.lit) .who, .focus .agent:not(.lit) .av { opacity: .3; }
  .focus .lbl:not(.lit), .focus #links g:not(.lit) .ln, .focus #links g:not(.lit) .end { opacity: .1; }
  .focus #links g.lit .ln { stroke-width: 2.2; }

  #detail { flex: none; width: 380px; box-sizing: border-box; overflow: auto; border-left: 1px solid var(--border-hairline); background: var(--surface-card); padding: 12px 16px 28px; }
  .d-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .d-when { margin-top: 8px; font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); color: var(--text-secondary); overflow-wrap: anywhere; }
  .d-h { margin: 10px 0 0; font: 500 var(--text-lg) / 1.35 var(--font-body); color: var(--text-primary); overflow-wrap: anywhere; }
  .d-agent { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; cursor: pointer; }
  .d-sec { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 6px; }
  .d-sec .t { font: 500 var(--text-ui-sm) / 1.2 var(--font-body); color: var(--text-primary); }
  .d-sec .n { font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .d-sec .grow + .btn { margin: -4px 0; }
  .lrow { display: grid; grid-template-columns: 8px auto 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; padding: 6px 6px; margin: 0 -6px; border-radius: var(--radius-ui); cursor: pointer; }
  .lrow:hover { background: var(--surface-hover); }
  .lrow .sw { align-self: center; }
  .lrow .k { font: 500 var(--text-mono-sm) / 1.3 var(--font-mono); white-space: nowrap; }
  .lrow .o { min-width: 0; font: 400 var(--text-xs) / 1.35 var(--font-body); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .r { grid-column: 2 / 4; font: 400 var(--text-xs) / 1.4 var(--font-body); color: var(--text-secondary); overflow-wrap: anywhere; }
  .arow { display: flex; align-items: baseline; gap: 8px; padding: 5px 6px; margin: 0 -6px; border-radius: var(--radius-ui); cursor: pointer; font: 400 var(--text-xs) / 1.35 var(--font-body); }
  .arow:hover { background: var(--surface-hover); }
  .arow .no { flex: none; width: 26px; font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); color: var(--text-tertiary); }
  .arow .tg { flex: none; font: 600 var(--text-mono-sm) / 1.3 var(--font-mono); }
  .arow .x { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
  .diff { margin: 0; font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); color: var(--text-primary); border: 1px solid var(--border-hairline); border-radius: var(--radius-ui); overflow: hidden; }
  .diff .h { padding: 3px 8px; background: rgba(var(--ink-rgb), .03); color: var(--text-tertiary); border-top: 1px solid var(--border-hairline); }
  .diff .h:first-child { border-top: 0; }
  .diff .l { display: flex; gap: 8px; padding: 0 8px; }
  .diff .l .g { flex: none; width: 8px; color: var(--text-tertiary); user-select: none; }
  .diff .l .t { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diff .l.del .t { color: var(--text-tertiary); text-decoration: line-through; text-decoration-color: rgba(var(--ink-rgb), .35); }
  .diff .l.add { background: rgba(var(--ink-rgb), .035); }
  .text { margin: 0; max-height: 360px; overflow: auto; padding: 8px 10px; border: 1px solid var(--border-hairline); border-radius: var(--radius-ui); font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: minmax(70px, max-content) 1fr; gap: 3px 12px; margin: 0; }
  .facts dt { font: 400 var(--text-xs) / 1.45 var(--font-body); color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facts dd { margin: 0; min-width: 0; font: 400 var(--text-mono-sm) / 1.45 var(--font-mono); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skel { height: 60px; border-radius: var(--radius-ui); background: rgba(var(--ink-rgb), .04); }
  .menu { position: fixed; z-index: 50; min-width: 240px; max-width: 320px; max-height: 70vh; overflow: auto; padding: 4px; border-radius: var(--radius-card); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), .14); }
  .mh { padding: 8px 8px 4px; color: var(--text-tertiary); font: 400 10.5px / 1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; }
  .mi { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-chip); background: none; color: var(--text-primary); font: 400 var(--text-ui-sm) / 1 var(--font-body); text-align: left; cursor: pointer; }
  .mi:hover { background: var(--surface-hover); }
  .mi.sub { padding-left: 30px; color: var(--text-secondary); cursor: default; }
  .mi .ck { width: 14px; display: inline-grid; place-items: center; flex: none; }
  .mi .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mi .n { margin-left: auto; display: inline-flex; gap: 1px; color: var(--text-tertiary); font-size: var(--text-xs); flex: none; }
  .box { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--mark); box-sizing: border-box; }
  .box.on { background: var(--mark); }
  .msep { height: 1px; margin: 4px 0; background: var(--border-hairline); }
  .pal { position: fixed; z-index: 60; display: grid; grid-template-columns: repeat(7, 20px); gap: 6px; padding: 10px; border-radius: var(--radius-card); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), .14); }
  .pal button { width: 20px; height: 20px; padding: 0; border: 0; border-radius: 4px; cursor: pointer; }
  .pal button.cur { box-shadow: 0 0 0 2px var(--surface-card), 0 0 0 3.5px var(--text-primary); }
  @media (max-width: 899px) {
    #detail { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 20; box-shadow: -8px 0 24px rgba(var(--ink-rgb), .08); }
  }
  @media (max-width: 560px) {
    #bar { padding: 8px 12px 6px; }
    #title { flex-basis: 100%; }
    #q { flex: 1 1 110px; }
    /* so do the filters */
    #filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #filters > * { flex: none; }
    .plink { max-width: 160px; }
    #corner { padding-left: 10px; }
    .agent { padding: 0 6px 0 8px; gap: 6px; }
    .av { width: 20px; height: 20px; border-radius: 5px; }
    .who .nm { font-size: var(--text-xs); }
    .who .goal { font-size: 11px; }
    .who .sig { display: none; }
    #detail { width: 100%; }
  }
</style>
</head>
<body>
<div id="bar">
  <div id="askf" data-anchor-name="Question box">
    <input id="ask" class="field" type="text" placeholder="Ask how these agents coordinated" aria-label="Ask a question about these records" autocomplete="off" spellcheck="false">
    <button id="askb" class="btn btn-secondary btn-sm" type="button">Ask</button>
  </div>
  <p id="asked" role="status" hidden></p>
  <div class="row" style="margin-top:8px">
    <p id="title"></p>
    <input id="q" class="field" type="search" placeholder="Search cards" aria-label="Search cards" autocomplete="off" spellcheck="false">
    <button id="cbtn" class="btn btn-secondary btn-sm cbtn" data-anchor-name="Labels"></button>
  </div>
  <div class="row" id="threads"></div>
  <div class="row" id="filters">
    <select id="agent" class="field" aria-label="Account"></select>
    <div id="types" class="row"></div>
    <div id="near" class="seg seg-track seg-sm" aria-label="Linked cards">
      <button class="seg-opt active" data-v="0">Matches</button><button class="seg-opt" data-v="1">With linked</button>
    </div>
    <div id="group" class="seg seg-track seg-sm" aria-label="Rows"><button class="seg-opt active" data-v="account">By account</button><button class="seg-opt" data-v="sig">By signature</button></div>
    <button id="clear" class="btn btn-ghost btn-sm">Clear filters</button>
    <span class="grow"></span>
    <span id="pager"><button id="prev" class="btn btn-ghost btn-sm" aria-label="Earlier cards">‹</button><span id="span"></span><button id="next" class="btn btn-ghost btn-sm" aria-label="Later cards">›</button></span>
  </div>
  <div class="row" id="legend" hidden></div>
  <p id="problems" role="status" hidden></p>
</div>
<main id="main">
  <div id="chart" tabindex="0">
    <p id="empty" hidden></p>
    <div id="grid">
      <div id="corner"><span class="hcap" id="rowcap">Account · goal</span>
        <div id="zoom" class="seg seg-track seg-sm" aria-label="Zoom"><button class="seg-opt" data-v="fit">Fit</button><button class="seg-opt active" data-v="1">100%</button></div>
      </div>
      <div id="cols"></div>
      <div id="rows"></div>
      <div id="plot"></div>
    </div>
  </div>
  <aside id="detail" hidden></aside>
</main>
<div id="pop"></div>
<script>
// Swarm: a row per account (or per name the cards sign with), a card per record the labels that are on mark, in event
// order, and the links between cards that the records carry, drawn from the reader's chart. Columns follow event
// order, one card each, so their spacing is no measure of time; each is headed by its card's UTC time, or "Time
// unknown". The question box sends a question to the analyst's Claude Code session with what the chart shows, and the
// labels it answers with, once on, become the cards.
// Layout: a card spans more than its column, so cards of one row that would overlap stack in the row's lanes. The part
// of a card no neighbouring column's card reaches, its band, carries the vertical runs of its links, and each link runs
// horizontally in the gap between rows next to its target, so no link crosses a card. A gap is as tall as the links it
// carries need, each on a track of its own with its label beside its source.
// Filters: account, link type and search narrow the cards; "With linked" adds the cards one link away. Hovering a card,
// a row, a link or a place lights its neighbourhood. A click shows a card's record, a row, a link or a cited record
// beside the chart; "Open record" opens it in thimble.
// Labels: while a label is on it is the colouring: cards take its values' colours, and links are drawn in ink, told
// apart by dash and label; with none on, each place's tag takes a viz colour and each link type another. Cards carry
// their record's ref as data-anchor, and rows and places their unit keys, so thimble marks them.
const slug = (thimble.view && thimble.view.slug) || 'swarm'
const NS = 'http://www.w3.org/2000/svg'
const TYPE_VIZ = { reply: 1, names: 3, 'same place': 7 } // the viz colour of each link type
const DASH = { reply: '', names: '', 'same place': '1.5 3.5' }
const MON = 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')
const HEAD_H = 58 // the column header's height
const ROW_PAD = 10 // above and below a row's cards
const LANE_GAP = 8 // between a row's lanes
const GAP_MIN = 14 // a gap between rows that carries no link
const TRACK = 16 // a link's track in a gap
const CARD_GAP = 8 // between two cards in one lane
const PAD_L = 16, PAD_R = 40
const END_GAP = 8 // between two link ends on one card
const FIT_MIN = 0.3
const CONTEXT_MAX = 1900 // characters of what the chart shows, sent with a question (a thread keeps 2,000)
const RUN_POLL_MS = 3000 // how often the chart is read again while a label that is on runs
const CARD_REFS_SENT = 20

const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const fmt = (n) => Number(n).toLocaleString('en-US')
const pad2 = (n) => String(n).padStart(2, '0')
const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
function h(tag, cls, text) {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (text != null) e.textContent = text
  return e
}
function s(tag, attrs) {
  const e = document.createElementNS(NS, tag)
  for (const k in attrs || {}) if (attrs[k] != null) e.setAttribute(k, attrs[k])
  return e
}
function plural(n, one, many) { return `${fmt(n)} ${n === 1 ? one : many || one + 's'}` }
const CARET = '<svg class="ico" viewBox="0 0 12 12"><path d="M3.5 4.75 6 7.25l2.5-2.5"/></svg>'
const PLUS = '<svg class="ico" viewBox="0 0 12 12"><path d="M6 2.5v7M2.5 6h7"/></svg>'
const OPEN = '<svg class="ico" viewBox="0 0 12 12"><path d="M5 2.5H2.5v7h7V7M7 2.5h2.5V5M9.5 2.5 5.5 6.5"/></svg>'
const CLOSE = '<svg class="ico" viewBox="0 0 12 12"><path d="m3 3 6 6M9 3 3 9"/></svg>'

function parseTime(t) {
  if (!t) return null
  const d = new Date(t)
  return Number.isNaN(d.getTime()) ? null : d
}
const dayOf = (d) => `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`
const hmOf = (d) => `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`
const whenOf = (t) => { const d = parseTime(t); return d ? `${dayOf(d)} ${hmOf(d)}:${pad2(d.getUTCSeconds())} UTC` : 'Time unknown' }

// a small figure for each row, drawn from its name: a 5×5 grid mirrored left to right
function hash(str) {
  let x = 2166136261
  for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619) }

}
function avatar(name) {
  const svg = s('svg', { class: 'av', viewBox: '0 0 7 7', 'aria-hidden': 'true' })
  let bits = hash(name)
  for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) {
    if (bits & 1) {
      svg.append(s('rect', { x: 1 + x, y: 1 + y, width: 1, height: 1 }))
      if (x < 2) svg.append(s('rect', { x: 5 - x, y: 1 + y, width: 1, height: 1 }))

const labelsOn = () => !!(D && D.source === 'labels' && D.marks.length)

  return i >= 0 && i < 6 ? token(`--viz-${[1, 2, 5, 6, 4, 3][i]}`) : token('--viz-ink-3')

const rowKey = (c) => (group === 'sig' && c.sig ? c.sig : c.account)

async function load() {
  const seq = ++loadSeq
  let data
  try {
    data = await thimble.fetch({ op: 'chart', offset, only, keep: keepRef ? [keepRef] : [] })
  } catch (e) {
    const p = document.getElementById('problems')
    p.hidden = false
    p.textContent = `The records could not be read: ${e.message || e}`
    return false
  }
  if (seq !== loadSeq) return false
  D = data
  offset = D.offset
  index()
  if (sel && sel.kind === 'card' && !byId.has(sel.id)) sel = null
  if (sel && sel.kind === 'row' && !rowBy.has(sel.key)) sel = null
  if (sel && sel.kind === 'link' && !D.links.some((x) => x.key === sel.key)) sel = null
  document.getElementById('problems').hidden = true
  return true
}
// the rows as the grouping keys them: an account, or a name the cards sign with, with the accounts that signed it
function index() {
  byId = new Map(D.cards.map((c) => [c.id, c]))
  placeBy = new Map(D.places.map((p) => [p.tag, p]))
  linksOf = new Map(D.cards.map((c) => [c.id, []]))
  for (const x of D.links) { linksOf.get(x.from).push(x); linksOf.get(x.to).push(x) }
  const goals = new Map(D.rows.map((r) => [r.account, r]))
  rowBy = new Map()
  rowOfCard = new Map()
  for (const c of D.cards) {
    const key = rowKey(c)
    rowOfCard.set(c.id, key)
    if (!rowBy.has(key)) rowBy.set(key, { key, name: key, accounts: [], sigs: [], goal: '', n: 0 })
    const r = rowBy.get(key)
    if (!r.accounts.includes(c.account)) r.accounts.push(c.account)
    if (c.sig && c.sig !== key && !r.sigs.includes(c.sig)) r.sigs.push(c.sig)
    r.n++
  }
  for (const r of rowBy.values()) {
    const own = goals.get(r.key)
    r.goal = own ? own.goal : ''
    r.own = !!own
  }
  rowsList = [...rowBy.values()]
  if (F.row && !rowBy.has(F.row)) F.row = ''
  for (const t of [...F.places]) if (!placeBy.has(t)) F.places.delete(t)
}

// ---------------------------------------------------------------- the question box
// what the chart shows, sent with a question as the thread's text, so the answer can be about these records
function context() {
  if (!D) return ''
  const on = labelState.labels.map((l) => (l.id ? `${l.name} (concept:${l.id})` : l.name))
  const lines = [
    `The ${thimble.view && thimble.view.name ? thimble.view.name : 'Swarm'} view (view:${slug}) draws a row per account, columns in event order and as cards the records the labels that are on give a highlighted value, coloured by value, linked by replies, names of other accounts and the record before on the same place.`,
  ]
  if (!labelsOn()) lines.push(`No label is on, so it shows the records that answer or name another account on the places that hold the most of them, which need not bear on the question.`)
  else {
    lines.push(`Now: ${D.cards.length ? `cards ${D.offset + 1}–${D.offset + D.cards.length} of ${fmt(D.total)}` : 'no cards'}; labels on: ${on.join(', ')}${only.length ? `; the legend keeps ${only.map((o) => o.value).join(', ')}` : ''}${labelState.filter ? `; filter: ${labelState.filter.label} = ${labelState.filter.value}` : ''}.`)
    if (D.cards.length) lines.push(`Cards: ${D.cards.slice(0, CARD_REFS_SENT).map((c) => c.ref).join(', ')}${D.cards.length > CARD_REFS_SENT ? ', …' : ''}`)
  }
  const text = lines.join('\n')
  return text.length > CONTEXT_MAX ? text.slice(0, CONTEXT_MAX - 1) + '…' : text
}
// the frame's sandbox blocks a form's submission, so Enter and the button send the question themselves
async function ask() {
  const input = document.getElementById('ask'), btn = document.getElementById('askb'), out = document.getElementById('asked')
  const question = input.value.trim()
  if (!question || !thimble.ask) return
  input.disabled = btn.disabled = true
  out.hidden = false
  out.className = ''
  out.textContent = 'Asking…'
  try {
    const thread = await thimble.ask(question, context())
    input.value = ''
    out.textContent = `“${question}”, asked in the thread ${thread}: the labels that answer it come on here as they run.`
  } catch (err) {
    out.className = 'err'
    out.textContent = `The question was not sent: ${err.message || err}`
  } finally {
    input.disabled = btn.disabled = false
  }
}

// ---------------------------------------------------------------- filters
function hay(c) {
  const p = placeBy.get(c.tag) || { name: '' }
  return [`#${c.id}`, c.account, c.sig || '', c.tag, p.name, c.line, D.marks[c.m] ? D.marks[c.m].value : '', c.time || 'time unknown'].join('\n').toLowerCase()
}
function matches(c) {
  if (F.row && rowOfCard.get(c.id) !== F.row) return false
  if (F.places.size && !F.places.has(c.tag)) return false
  if (q && !hay(c).includes(q)) return false
  if (F.types.size && !linksOf.get(c.id).some((x) => F.types.has(x.type))) return false
  return true
}
const filtered = () => !!(F.row || F.places.size || F.types.size || q)
function visible() {
  const core = D.cards.filter(matches)
  const ids = new Set(core.map((c) => c.id))
  const ctx = new Set()
  const typeOk = (x) => !F.types.size || F.types.has(x.type)
  if (near && filtered()) for (const c of core) for (const x of linksOf.get(c.id)) {
    if (!typeOk(x)) continue
    const o = x.from === c.id ? x.to : x.from
    if (!ids.has(o)) ctx.add(o)
  }
  for (const o of ctx) ids.add(o)
  if (sel && sel.kind === 'card' && byId.has(sel.id) && !ids.has(sel.id)) { ids.add(sel.id); ctx.add(sel.id) }
  return { cards: D.cards.filter((c) => ids.has(c.id)), ctx, links: D.links.filter((x) => ids.has(x.from) && ids.has(x.to) && typeOk(x)) }
}

function orth(pts, rad) {

    box.append(detailHead(chips, c.ref))
    box.append(h('div', 'd-when', `${whenOf(c.time)}${p ? ` · ${p.name}` : ''}${c.sig && c.sig !== c.account ? ` · signed ${c.sig}` : ''}`), h('p', 'd-h', c.line), rowBlock(rowOfCard.get(c.id)))
    const ls = linksOf.get(c.id) || []
    const out = ls.filter((x) => x.from === c.id), inc = ls.filter((x) => x.to === c.id)
    if (out.length) { box.append(sec('Links to earlier cards', out.length)); for (const x of out) box.append(linkRow(x, c.id)) }
    if (inc.length) { box.append(sec('Links from later cards', inc.length)); for (const x of inc) box.append(linkRow(x, c.id)) }
    const rbox = h('div')
    rbox.append(h('div', 'skel'))
    box.append(rbox)
    try {
      const rec = await recordOf(c.ref)
      if (sel === mine) renderRecordInto(rbox, rec)
    } catch (e) { rbox.textContent = `The record could not be read: ${e.message || e}` }
  } else if (sel.kind === 'row') {
    const r = rowBy.get(sel.key)
    if (!r) return
    box.dataset.anchor = `view:${slug}/agent/${r.own ? r.key : r.accounts[0]}`
    const solo = h('button', 'btn btn-ghost btn-sm', F.row === r.key ? 'All rows' : 'Only this row')
    solo.onclick = () => { F.row = F.row === r.key ? '' : r.key; refresh() }
    box.append(detailHead([chip(group === 'sig' ? 'Signed name' : 'Account', 'chip chip-sans chip-tone-neutral'), solo], null))
    box.append(rowBlock(r.key))
    const own = D.cards.filter((c) => rowOfCard.get(c.id) === r.key)
    box.append(sec('Cards', own.length))
    for (const c of own) box.append(cardRow(c))
  } else if (sel.kind === 'link') {
    const x = D.links.find((y) => y.key === sel.key)
    if (!x) return
    const k = chip(`${x.from}→${x.to} · ${x.type}`)
    k.style.color = typeColour(x.type)
    box.append(detailHead([k], null))
    box.append(h('p', 'd-h', x.reason))
    box.append(sec('From'), cardRow(byId.get(x.from)), sec('To'), cardRow(byId.get(x.to)))
  } else if (sel.kind === 'record') {
    box.dataset.anchor = sel.ref
    box.append(detailHead([chip(sel.ref)], sel.ref))
    const rbox = h('div')
    rbox.append(h('div', 'skel'))
    box.append(rbox)
    try {
      const rec = await recordOf(sel.ref)
      if (sel === mine) {
        if (rec.account) box.insertBefore(h('div', 'd-when', [rec.account, rec.place, rec.sig && rec.sig !== rec.account ? `signed ${rec.sig}` : ''].filter(Boolean).join(' · ')), rbox)
        renderRecordInto(rbox, rec)
      }
    } catch (e) { rbox.textContent = `The record could not be read: ${e.message || e}` }
  }
}

// arrows step through the shown cards in event order; Escape closes the detail
document.addEventListener('keydown', (e) => {
  if (e.target instanceof Element && e.target.closest('input, select, textarea')) return
  if (e.key === 'Escape') { if (menu || pal) { menu = false; pal = null; renderPop() } else if (sel) closeDetail(); return }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && sel && sel.kind === 'card' && L) {
    const ids = [...L.cards.keys()]
    const i = ids.indexOf(sel.id) + (e.key === 'ArrowRight' ? 1 : -1)
    if (i >= 0 && i < ids.length) { e.preventDefault(); select({ kind: 'card', id: ids[i] }) }
  }
})

// ---------------------------------------------------------------- drawing it all
function refresh() {
  if (!D) return
  hover = null
  const v = visible()
  renderBar(v)
  layout(v)
  applyFocus()
  renderDetail()
}
let resizeT = null
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (D) { layout(visible()); applyFocus() } }, 120) })

function applyTarget(t) {
  if (!t) return
  const card = t.ref ? D.cards.find((c) => c.ref === t.ref) : null
  if (card) select({ kind: 'card', id: card.id })
  else if (t.ref) select({ kind: 'record', ref: t.ref, account: t.account }, { reveal: false })
  else if (t.account) {
    const key = [...rowBy.values()].find((r) => r.accounts.includes(t.account))
    if (key) select({ kind: 'row', key: key.key })
  } else if (t.place) {
    const p = D.places.find((x) => x.name === t.place)
    if (p) { F.places = new Set([p.tag]); refresh() }
  }
}
async function start() {
  if (!(await load())) return
  refresh()
  if (target) { const t = target; target = null; applyTarget(t) }
  watchRuns()
}
thimble.onOpen(async (place) => {
  const t = (place && place.target) || null
  const again = t && t.ref && t.ref !== keepRef
  if (t && t.ref) keepRef = t.ref
  if (!D) { target = t; return }
  if (again && !D.cards.some((c) => c.ref === t.ref)) { if (!(await load())) return; refresh() }
  applyTarget(t)
})
thimble.onLabels(async (state) => {
  const was = JSON.stringify([labelState.labels, labelState.filter, (labelState.all || []).map((l) => [l.id, l.count])])
  labelState = { labels: state.labels || [], filter: state.filter || null, all: state.all || null, palette: state.palette || null }
  if (!D) return
  // a label turned on, off or still running (its count moving) changes the cards
  if (JSON.stringify([labelState.labels, labelState.filter, (labelState.all || []).map((l) => [l.id, l.count])]) === was) { renderPop(); return }
  offset = 0
  only = only.filter((o) => labelState.labels.some((l) => l.name === o.label && (l.values || []).some((x) => x.name === o.value)))
  if (!(await load())) return
  refresh()
  renderPop()
  watchRuns()
})
// a label that is on has no count while it runs, and the page hears of no rows until it ends, so the chart is read again
// meanwhile and drawn again when its cards changed
let runT = null
function watchRuns() {
  clearTimeout(runT)
  if (!(labelState.all || []).some((l) => l.on && l.count == null)) return
  runT = setTimeout(async () => {
    const was = D && JSON.stringify([D.total, D.mark_counts, D.cards.map((c) => c.ref)])
    if ((await load()) && JSON.stringify([D.total, D.mark_counts, D.cards.map((c) => c.ref)]) !== was) refresh()
    watchRuns()
  }, RUN_POLL_MS)
}
start()
</script>
