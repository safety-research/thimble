<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.chip, .btn, .seg, .field, .table) and the theme's tokens come with the frame; this page lays them
     out as a code forge lays out its pages, and draws the charts, strips, avatars, diffs and icons */
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--surface-card); }
  button { font: inherit; color: inherit; }
  .mono { font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); font-variant-numeric: tabular-nums; }
  .dim { color: var(--text-tertiary); }
  .grow { flex: 1 1 auto; min-width: 0; }

  /* the head: the run selector and the mode over the tabs, which are underlined as a forge's are */
  #top { flex: none; padding: 12px 16px 0; border-bottom: 1px solid var(--border-subtle); }
  .toprow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .runbtn { gap: 6px; padding: 0 8px 0 10px; }
  .runbtn .k { color: var(--text-tertiary); font-weight: 400; }
  .runbtn b { font-weight: 600; }
  .runbtn .ico { color: var(--text-tertiary); }
  .runchips { display: flex; gap: 4px; flex-wrap: wrap; }
  .nav { display: flex; gap: 2px; margin: 6px -8px 0; overflow-x: auto; scrollbar-width: none; }
  .nav button { position: relative; flex: none; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; }
  .nav button > span { display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-ui); color: var(--text-secondary); font: 400 var(--text-sm) / 1.2 var(--font-body); white-space: nowrap; }
  .nav button:hover > span { background: var(--surface-hover); color: var(--text-primary); }
  .nav button.on > span { color: var(--text-primary); font-weight: 600; }
  .nav button.on::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
  .nav .ico { color: var(--text-tertiary); }
  .nav .chip { height: 18px; padding: 0 6px; }

  #body { flex: 1; min-height: 0; display: flex; }
  #main { flex: 1; min-width: 0; overflow: auto; padding: 16px 16px 28px; }
  #detail { display: none; flex: 0 0 min(52%, 820px); min-width: 0; overflow: auto; border-left: 1px solid var(--border-subtle); }
  .open #detail { display: block; }
  /* below this width the detail takes the pane, and its back button returns to the list */
  .narrow.open #main { display: none; }
  .narrow.open #detail { flex: 1; border-left: 0; }

  /* a box, as the forge frames its lists: a hairline border, rounded, with a tinted head */
  .box { border: 1px solid var(--border-subtle); border-radius: var(--radius-card); background: var(--surface-card); min-width: 0; }
  .box-head { box-sizing: border-box; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; min-height: 40px; padding: 5px 14px; background: var(--bg-sub); border-bottom: 1px solid var(--border-subtle); border-radius: var(--radius-card) var(--radius-card) 0 0; }
  .box-head h3 { margin: 0; font: 600 var(--text-sm) / 1.3 var(--font-body); }
  .box > :last-child { border-bottom-left-radius: var(--radius-card); border-bottom-right-radius: var(--radius-card); }

  /* the overview: the runs, which also choose the runs, beside the activity */
  #overview { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, 1fr); gap: 16px; margin-bottom: 16px; }
  .compare #overview, .w-xs #overview { grid-template-columns: minmax(0, 1fr); }
  #runs { overflow-x: auto; }
  .compare #activity { display: none; }
  .runs { margin: 0; }
  .runs td, .runs th { padding: 5px 10px 5px 12px; white-space: nowrap; }
  .runs th { font-size: 10px; }
  .runs tbody tr { cursor: pointer; }
  .runs tbody tr:last-child td { border-bottom: 0; }
  .runs tr.off td { color: var(--text-tertiary); }
  .runs tr.off .bars, .runs tr.off svg { opacity: .35; }
  .runs td.setup { font: 400 var(--text-xs) / 1.3 var(--font-body); color: var(--text-secondary); }
  .runs td.num, .runs th.num { text-align: right; }
  .runs td.act { padding-top: 2px; padding-bottom: 2px; width: 100%; }
  .runs td.act svg { display: block; }
  .runs tfoot td { border-bottom: 0; padding-top: 0; }
  .axisrow { position: relative; height: 14px; font: 400 10.5px / 14px var(--font-mono); color: var(--text-tertiary); }
  .axisrow span { position: absolute; top: 0; }
  .axisrow span:not(:first-child) { transform: translateX(-50%); }
  .bars { display: flex; height: 6px; margin: 3px 0; border-radius: 3px; overflow: hidden; background: rgba(var(--ink-rgb), 0.05); }
  .bars span { display: block; height: 100%; }
  .words { font: 400 var(--text-mono-sm) / 1.2 var(--font-mono); }
  .words b { font-weight: 500; }
  .spread { display: flex; align-items: flex-end; gap: 1px; height: 18px; }
  .spread span { width: 5px; background: var(--viz-ink-3); }
  /* the columns a narrow pane leaves out */
  .w-s .wide1, .w-s .wide2, .w-m .wide2 { display: none; }
  #activity .body { padding: 8px 14px 10px; }

  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 0 0 8px; font: 400 var(--text-xs) / 1 var(--font-body); color: var(--text-secondary); }
  .legend .per { margin-left: 6px; color: var(--text-tertiary); white-space: nowrap; }
  .legend .btn { margin-left: 4px; }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .cbtn { gap: 7px; padding: 0 8px 0 10px; }
  .cbtn .k { color: var(--text-tertiary); font-weight: 400; }
  .cbtn .ico { color: var(--text-tertiary); }
  .cbtn .sws { display: inline-flex; gap: 2px; }
  .cbtn .cnm { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cbtn .cnm[data-derived] { overflow: visible; } /* a field's name is short, and its derived mark sits above the line */
  .lg { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 6px 0 4px; border-radius: var(--radius-chip); white-space: nowrap; cursor: pointer; }
  .lg:hover { background: var(--surface-hover); color: var(--text-primary); }
  .lg.st { cursor: default; }
  .lg.st:hover { background: none; color: var(--text-secondary); }
  .lg .n { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .lg.off { opacity: .38; }
  .lg.off .sw { background: transparent !important; box-shadow: inset 0 0 0 1.3px var(--text-tertiary); }
  .swb { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-right: -3px; border-radius: 3px; flex: none; cursor: pointer; }
  .swb:hover { background: var(--track-bg); }
  .menu { position: fixed; z-index: 50; min-width: 250px; max-width: 340px; padding: 4px; border-radius: var(--radius-card); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), .14); font-size: var(--text-ui-sm); }
  .mh { padding: 8px 8px 4px; color: var(--text-tertiary); font: 400 10.5px / 1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; }
  .mi { box-sizing: border-box; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-chip); background: none; color: var(--text-primary); font: 400 var(--text-ui-sm) / 1 var(--font-body); text-align: left; cursor: pointer; }
  .mi:hover { background: var(--surface-hover); }
  .mi.sub { padding-left: 30px; color: var(--text-secondary); cursor: default; }
  .mi .ck { width: 14px; display: inline-grid; place-items: center; flex: none; }
  .mi .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mi .n { margin-left: auto; display: inline-flex; gap: 1px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; font-size: var(--text-xs); flex: none; }
  .mi .swb { width: 18px; height: 18px; margin: 0 -2px; }
  .mi.run { min-height: 40px; }
  .mi.run .nm b { display: block; font-weight: 600; margin-bottom: 2px; }
  .mi.run .nm span { color: var(--text-tertiary); font-size: var(--text-xs); }
  .tick { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border-strong); display: inline-grid; place-items: center; background: var(--surface-card); flex: none; cursor: pointer; }
  .tick:hover { border-color: var(--text-secondary); }
  .tick.on { background: var(--surface-inverse); border-color: var(--surface-inverse); color: var(--text-on-inverse); }
  .tick .ico { width: 10px; height: 10px; stroke-width: 2; }
  .lmark { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--mark); background: transparent; }
  .lmark.on { background: var(--mark); }
  .msep { height: 1px; margin: 4px 0; background: var(--border-hairline); }
  .pal { position: fixed; z-index: 60; display: grid; grid-template-columns: repeat(7, 20px); gap: 6px; padding: 10px; border-radius: var(--radius-card); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), .14); }
  .pal button { width: 20px; height: 20px; padding: 0; border: 0; border-radius: 4px; cursor: pointer; }
  .pal button:hover { transform: scale(1.12); }
  .pal button.cur { box-shadow: 0 0 0 2px var(--surface-card), 0 0 0 3.5px var(--text-primary); }
  svg.chart { display: block; overflow: visible; cursor: crosshair; user-select: none; }
  svg.chart text { font: 400 10.5px var(--font-mono); fill: var(--text-tertiary); }
  svg.chart .base { stroke: var(--border-hairline); }
  svg.chart .brush { fill: rgba(var(--ink-rgb), 0.07); stroke: var(--text-tertiary); stroke-dasharray: 2 2; }

  /* the filters over the list */
  #filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  #filters .search { position: relative; flex: 1 1 220px; max-width: 420px; }
  #filters .search .ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); pointer-events: none; }
  #filters .search .field { width: 100%; padding-left: 30px; box-sizing: border-box; }
  /* a select as wide as its chosen option, not its longest one */
  #filters select.field { flex: 0 1 auto; min-width: 0; max-width: 220px; field-sizing: content; }
  #filters select.set { border-color: var(--text-secondary); }
  .states { display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap; }
  .states button { display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; border: 0; background: none; color: var(--text-secondary); font: 400 var(--text-sm) / 1.3 var(--font-body); cursor: pointer; }
  .states button:hover { color: var(--text-primary); }
  .states button.on { color: var(--text-primary); font-weight: 600; }
  .states button .ico { width: 16px; height: 16px; }
  .box-head .field { height: var(--control-sm); }
  .box-head select.field { field-sizing: content; }
  .box-head .total { font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); white-space: nowrap; }

  /* rows of pull requests, issues and discussions, as the forge lists them */
  .row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto auto; column-gap: 14px; align-items: start; padding: 10px 16px; border-top: 1px solid var(--border-hairline); cursor: pointer; }
  .box-head + .row, .box-head + div > .row:first-child { border-top: 0; }
  .row:hover { background: rgba(var(--ink-rgb), 0.025); }
  .row.active { background: var(--surface-selected); }
  .row > .ico { margin-top: 3px; }
  .row .t { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; min-width: 0; }
  .row .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 calc(var(--text-lg) + 1px) / 1.35 var(--font-body); color: var(--text-primary); }
  .row:hover .title { color: var(--text-accent); }
  .row .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 4px; margin-top: 3px; font-size: var(--text-xs); color: var(--text-tertiary); }
  .row .meta .sep::before { content: '·'; margin: 0 6px 0 2px; }
  .row .why { margin-top: 5px; padding-left: 8px; border-left: 2px solid var(--border-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-xs); color: var(--text-secondary); }
  .row .flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .row .side { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .row svg.strip { margin-top: 5px; }
  .w-xs .row { grid-template-columns: 16px minmax(0, 1fr) auto auto; }
  .w-xs .row .rstrip { display: none; }
  .counts { display: flex; gap: 10px; margin-top: 3px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-tertiary); white-space: nowrap; }
  .counts span { display: inline-flex; align-items: center; gap: 4px; min-width: 26px; }
  .counts .ico { width: 14px; height: 14px; }
  .lnk { padding: 0; border: 0; background: none; color: inherit; cursor: pointer; font: inherit; }
  .lnk:hover { color: var(--text-accent); text-decoration: underline; }
  .lnk.strong { color: var(--text-secondary); font-weight: 500; }
  .more { margin: 12px 16px; }
  .empty { padding: 32px 16px; text-align: center; color: var(--text-tertiary); }

  /* labels, as the forge shows them after a title: thimble's chips, a label value's tinted in its colour */
  .row .t .chip, .facts .chip { height: 20px; }
  .lp { border-color: color-mix(in oklab, var(--c) 55%, transparent); background: color-mix(in oklab, var(--c) 14%, var(--surface-card)); color: var(--text-primary); font-weight: 500; }
  .lp::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

  /* avatars: a person's initial on a neutral disc, so the labels keep the colours */
  .avatar { position: relative; width: 20px; height: 20px; box-shadow: 0 0 0 1.5px var(--surface-card); font-size: 10px; }
  .avatar.s16 { width: 16px; height: 16px; font-size: 8.5px; }
  .avatar.s32 { width: 32px; height: 32px; font-size: 13px; }
  .avatar .v { position: absolute; right: -4px; bottom: -3px; display: grid; place-items: center; width: 12px; height: 12px; border-radius: 50%; background: var(--surface-card); }
  .avatar .v .ico { width: 10px; height: 10px; stroke-width: 2; }
  .avs { display: inline-flex; align-items: center; padding-left: 5px; }
  .avs .avatar { margin-left: -5px; }
  .who { display: inline-flex; align-items: center; gap: 6px; }

  /* the state of a pull request or an issue: a chip filled with the state's colour, with its icon */
  .chip.state { height: 28px; padding: 0 12px 0 10px; border-color: var(--c); background: var(--c); color: var(--surface-card); font-size: var(--text-sm); font-weight: 500; }
  .chip.state .ico { width: 15px; height: 15px; }

  /* icons: a state's in its colour, an action's in its colour while the records are coloured by activity, else in ink */
  .ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ico.s12 { width: 12px; height: 12px; }
  .s-open { color: var(--status-positive); }
  .s-merged, .s-fixed { color: var(--viz-6); }
  .s-closed { color: var(--status-negative); }
  .s-thread { color: var(--text-secondary); }
  .inked .matrix td .cr { color: var(--text-secondary); }

  /* a diff's size as its added and removed lines, and five blocks in those shares */
  .dstat { display: inline-flex; align-items: center; gap: 6px; font: 500 var(--text-mono-sm) / 1 var(--font-mono); white-space: nowrap; }
  .dstat .p { color: var(--status-positive); }
  .dstat .m { color: var(--status-negative); }
  .dstat .blk { display: inline-flex; gap: 1px; }
  .dstat .blk i { width: 7px; height: 7px; border-radius: 1px; background: rgba(var(--ink-rgb), .14); }
  .dstat .blk i.p { background: var(--status-positive); }
  .dstat .blk i.m { background: var(--status-negative); }

  /* the compare grid: one row per issue, one column per chosen run */
  .grid { width: 100%; border-collapse: collapse; }
  .grid th, .grid td { padding: 8px 12px; border-top: 1px solid var(--border-hairline); text-align: left; vertical-align: top; }
  .grid thead th { position: sticky; top: -16px; z-index: 1; background: var(--surface-card); font: 600 var(--text-xs) / 1.3 var(--font-body); color: var(--text-primary); }
  .grid thead th .sub { display: block; margin-top: 2px; font: 400 var(--text-xs) / 1.2 var(--font-body); color: var(--text-tertiary); }
  .grid td.issue { width: 34%; max-width: 0; }
  .grid td.issue .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .grid td.issue .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); margin-right: 6px; font-weight: 400; }
  .grid .cell { display: flex; flex-wrap: wrap; gap: 4px; }
  .grid .none { color: var(--text-tertiary); }
  .gchip { padding: 0 8px 0 6px; }
  .gchip .ico { width: 13px; height: 13px; }
  .cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 12px; }
  .cols .box-head { gap: 8px; }
  .cols .list-row { margin: 2px 4px; align-items: baseline; }
  .cols .list-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agents.mini { table-layout: fixed; margin: 0; }
  .agents.mini th, .agents.mini td { padding: 5px 6px; overflow: hidden; text-overflow: ellipsis; }
  .agents.mini th:first-child, .agents.mini td:first-child { width: 36%; padding-left: 12px; }

  /* agents */
  .agents { margin: 0; }
  .agents td { vertical-align: middle; }
  .agents tbody tr:last-child td { border-bottom: 0; }
  .w-s .agents .opt { display: none; }
  .agents td.n, .agents th.n { text-align: right; }
  .agents th button { padding: 0; border: 0; background: none; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; }
  .agents th button.on { color: var(--text-primary); }
  .agents tbody tr { cursor: pointer; }
  .agents .name { font: 600 var(--text-sm) / 1.3 var(--font-body); }
  .matrices { display: flex; flex-wrap: wrap; gap: 28px; padding: 14px 16px 20px; }
  .matrix { border-collapse: collapse; }
  .matrix caption { caption-side: top; text-align: left; padding-bottom: 8px; font-size: var(--text-xs); color: var(--text-secondary); }
  .matrix th { font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); padding: 3px 6px; }
  .matrix th.to { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; height: 52px; }
  .matrix th.by { text-align: right; }
  .matrix td { width: 30px; height: 30px; padding: 0; text-align: center; border: 1px solid var(--border-hairline); font: 400 var(--text-mono-sm) / 1 var(--font-mono); cursor: pointer; }
  .matrix td.self { background: rgba(var(--ink-rgb), 0.04); cursor: default; }
  .matrix td.mutual { outline: 1.5px solid var(--text-primary); outline-offset: -2px; }
  .matrix td .cr { display: block; margin-top: 1px; font-size: 9.5px; color: var(--viz-2); }
  .matrix .axis { vertical-align: bottom; text-align: right; font: 400 10px / 1.5 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); }

  /* a unit's page: its title and state, its own tabs, then its conversation, commits or files beside its facts */
  .dnav { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 0 8px; }
  .dhead { padding: 4px 20px 0; border-bottom: 1px solid var(--border-subtle); }
  .dhead h1 { margin: 0; font: 400 calc(var(--text-lg) + 8px) / 1.25 var(--font-body); overflow-wrap: anywhere; }
  .dhead h1 .num { color: var(--text-tertiary); font-weight: 300; }
  .dhead .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 10px; font-size: var(--text-sm); color: var(--text-secondary); }
  .dhead .sub b { color: var(--text-primary); font-weight: 600; }
  .dhead .nav { margin: 8px -8px 0; }
  .dbody { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 24px; padding: 16px 20px 40px; }
  .dnarrow .dbody { grid-template-columns: minmax(0, 1fr); }
  .dnarrow .facts { order: -1; }

  /* the conversation: a line down the left, comments as boxes by their author's avatar, events as badges on the line */
  .timeline { position: relative; }
  .timeline::before { content: ''; position: absolute; left: 15px; top: 8px; bottom: 8px; border-left: 2px solid var(--border-hairline); }
  .it { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 12px; align-items: start; padding: 8px 0; }
  .it.focus { background: var(--surface-selected); border-radius: var(--radius-ui); }
  .it > .avatar, .it > .badge { justify-self: center; }
  .badge { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--bg-sub); box-shadow: 0 0 0 3px var(--surface-card); color: var(--text-secondary); }
  .badge.fill { background: var(--c); color: var(--surface-card); }
  .badge .ico { width: 15px; height: 15px; }
  .it .line { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; min-height: 28px; font-size: var(--text-sm); color: var(--text-secondary); }
  .it .line b { color: var(--text-primary); font-weight: 600; }
  .it .when { font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); }
  .cbox { border: 1px solid var(--border-subtle); border-radius: var(--radius-card); background: var(--surface-card); overflow: hidden; }
  .cbox .ch { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; padding: 7px 12px; background: var(--bg-sub); border-bottom: 1px solid var(--border-subtle); font-size: var(--text-sm); color: var(--text-secondary); }
  .cbox .ch b { color: var(--text-primary); font-weight: 600; }
  .cbox .cb { padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--text-sm); line-height: 1.55; }
  .it .commit { display: flex; align-items: center; gap: 8px; min-width: 0; margin-top: 2px; font-size: var(--text-sm); }
  .it .commit .msg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
  .sha { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: var(--radius-chip); background: rgba(var(--ink-rgb), .06); font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-secondary); }
  .note { margin: 0 0 14px; padding: 10px 12px; border: 1px solid var(--border-subtle); border-radius: var(--radius-card); background: var(--bg-sub); color: var(--text-secondary); }
  .dstrip { margin: 4px 0 14px; }

  /* commits and files changed */
  .clist .crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--border-hairline); }
  .clist .crow:first-of-type { border-top: 0; }
  .clist .crow .msg { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clist .crow .by { grid-column: 1; display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--text-tertiary); }
  .clist .crow .r { grid-column: 2; grid-row: 1 / 3; display: flex; align-items: center; gap: 10px; }
  .file { margin-bottom: 16px; }
  .file .box-head { min-height: 38px; gap: 10px; }
  .file .path { font: 500 var(--text-mono-sm) / 1.3 var(--font-mono); color: var(--text-primary); overflow-wrap: anywhere; }
  .diff { width: 100%; border-collapse: collapse; font: 400 var(--text-mono-sm) / 20px var(--font-mono); table-layout: fixed; }
  .diff td { padding: 0 8px; vertical-align: top; }
  .diff col.ln { width: 44px; }
  .diff td.ln { text-align: right; color: var(--text-tertiary); user-select: none; }
  .diff td.code { white-space: pre-wrap; overflow-wrap: anywhere; padding-left: 22px; text-indent: -14px; color: var(--text-primary); }
  .diff tr.add td { background: color-mix(in oklab, var(--status-positive) 12%, var(--surface-card)); }
  .diff tr.add td.ln { background: color-mix(in oklab, var(--status-positive) 20%, var(--surface-card)); }
  .diff tr.del td { background: color-mix(in oklab, var(--status-negative) 11%, var(--surface-card)); }
  .diff tr.del td.ln { background: color-mix(in oklab, var(--status-negative) 18%, var(--surface-card)); }
  .diff tr.hunk td { background: color-mix(in oklab, var(--accent) 7%, var(--surface-card)); color: var(--text-tertiary); }
  .diff tr:last-child td { padding-bottom: 2px; }
  .diff + .diff { border-top: 1px solid var(--border-hairline); }
  .diff tr.by td { font-family: var(--font-body); color: var(--text-secondary); }
  .diff tr.by .sha { margin-right: 4px; }

  /* the facts beside a unit's page */
  .facts h4 { margin: 0 0 8px; font: 600 var(--text-xs) / 1.2 var(--font-body); color: var(--text-secondary); }
  .facts section { padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--border-hairline); font-size: var(--text-xs); }
  .facts section:last-child { border-bottom: 0; }
  .facts .fline { display: flex; align-items: center; gap: 8px; min-height: 24px; }
  .facts .fline .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facts .fline > .chip { flex: none; }
  .facts .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
  .facts .kv span:nth-child(odd) { color: var(--text-tertiary); }
  .facts .kv span:nth-child(even) { font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); }
  .facts .pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .runsgrid { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; }
  .runsgrid .cell { display: flex; flex-wrap: wrap; gap: 4px; }
</style>
</head>
<body>
  <header id="top">
    <div class="toprow">
      <button class="btn btn-secondary btn-sm runbtn" id="runbtn"></button>
      <div class="runchips" id="runchips"></div>
      <span class="grow"></span>
      <div class="seg seg-track" id="mode">
        <button class="seg-opt active" data-mode="combined">Combined</button>
        <button class="seg-opt" data-mode="compare">Compare</button>
      </div>
    </div>
    <nav class="nav" id="tabs"></nav>
  </header>
  <div id="body">
    <main id="main">
      <section id="overview"><div id="runs" class="box"></div><div id="activity" class="box"></div></section>
      <div id="filters"></div>
      <div id="list"></div>
    </main>
    <aside id="detail"></aside>
  </div>
  <div id="pop"></div>
<script>
  // Repository: several agent runs on one library, as a code forge shows them. The run selector at the top picks one run
  // or several (All takes every run), and every panel follows the chosen runs. It opens on the overview: one row per
  // run with its setup and measures, which also chooses the runs, beside the chosen runs' activity per time bin. The
  // tabs switch between pull requests, issues, discussions and agents; the filters narrow the tab by any field, each to
  // one value or several, with the count each value would give, and a drag across the activity narrows it to a time
  // range. Participant and Activity pick records, so with a time range they keep the units where that agent did that
  // in that range. The Colour menu colours the records in the activity, on the strips and on a page by their activity,
  // who did it, their run, a review's reviewer or verdict, or their unit's author, state, area, close reason, origin or
  // first flag, and its legend shows a value alone on a click and hides it on a shift-click. Compare puts the chosen
  // runs side by side: each run's activity in its row, and below it the pull requests or issues issue by issue, or the
  // discussions and agents run by run. A row opens its unit's page beside the list (or in its place in a narrow pane):
  // its conversation, and for a pull request its commits and the files they changed, as diffs.
  //
  // Labels: each unit's element carries view:<slug>/<key>, each record on a strip or a page its file ref, and each
  // run's row view:<slug>/<run>, so thimble marks them. A unit whose records a label marks carries its pill, as the
  // forge's labels. While a label is on it is the colouring, unless a field is chosen in the Colour menu, which colours
  // this page alone and leaves the labels on: the page draws the records each of its values marks in that value's
  // colour in the activity, the strips, the runs' bars and a page's badges, and the other categories in ink, all but
  // the states' icons, which keep the forge's colours. A value's swatch opens thimble's palette. The filter is applied by the reader, so the page fetches again in
  // thimble.onLabels.
  const slug = (thimble.view && thimble.view.slug) || 'repository'
  const $ = (s, root) => (root || document).querySelector(s)
  const NS = 'http://www.w3.org/2000/svg'
  const WIDE = 1100 // the pane width from which the detail sits beside the list

  const TABS = {
    pulls: { name: 'Pull requests', icon: 'pr', noun: ['pull request', 'pull requests'], states: ['open', 'merged', 'closed'],
      selects: [['author', 'Author', 'authors'], ['reviewer', 'Reviewer', 'reviewers'], ['verdict', 'Review', 'reviews'], ['actor', 'Participant', 'participants'], ['action', 'Activity', 'activities'], ['area', 'Area', 'areas'], ['reason', 'Close reason', 'close reasons'], ['flag', 'Flag', 'flags']],
      sorts: [['newest', 'Newest'], ['oldest', 'Oldest'], ['longest to merge', 'Longest to merge'], ['quickest first review', 'Quickest first review'], ['most reviews', 'Most reviews'], ['most commits', 'Most commits']] },
    issues: { name: 'Issues', icon: 'issue', noun: ['issue', 'issues'], states: ['open', 'fixed', 'closed'],
      selects: [['author', 'Author', 'authors'], ['actor', 'Participant', 'participants'], ['action', 'Activity', 'activities'], ['origin', 'Origin', 'origins'], ['area', 'Area', 'areas'], ['reason', 'Close reason', 'close reasons']],
      sorts: [['newest', 'Newest'], ['oldest', 'Oldest'], ['longest to fix', 'Longest to fix'], ['most comments', 'Most comments']] },
    discussions: { name: 'Discussions', icon: 'thread', noun: ['discussion', 'discussions'], states: null,
      selects: [['actor', 'Posted by', 'posters', 'Anyone posting']],
      sorts: [['most posts', 'Most posts'], ['latest', 'Latest post'], ['oldest', 'Oldest']] },
    agents: { name: 'Agents', icon: 'agent', noun: ['agent', 'agents'], states: null,
      selects: [['agent', 'Agent', 'agents'], ['action', 'Activity', 'activities'], ['reviewed', 'Reviewed', 'agents', 'Reviewed anyone']], sorts: [] },
  }
  const STATE_NAMES = { open: 'Open', merged: 'Merged', closed: 'Closed', fixed: 'Closed', thread: 'Discussion' }
  // what each action is drawn in, in the activity, on the strips and on a page's badges (reader.py ACTION)
  const ACTIONS = {
    opened: '--viz-ink-2', pushed: '--viz-ink-3', approved: '--viz-3', 'changes requested': '--viz-2', commented: '--viz-1',
    posted: '--viz-5', merged: '--viz-6', fixed: '--viz-6', closed: '--viz-4', reopened: '--viz-ink-1', 'signed off': '--viz-ink-4',
  }
  const STATE_COLOURS = { open: '--status-positive', merged: '--viz-6', fixed: '--viz-6', closed: '--status-negative' }
  // the states in ink on the runs' bars, while the records are coloured by a field whose colours they would repeat
  const STATE_INKS = { open: '--viz-ink-2', merged: '--viz-ink-3', fixed: '--viz-ink-3', closed: '--viz-ink-4' }
  // the fields the Colour menu offers on each tab (reader.py COLOURS), and the viz colours their values take in order
  const COLOURS = { pulls: ['action', 'actor', 'author', 'reviewer', 'verdict', 'run', 'state', 'area', 'reason', 'flag'],
    issues: ['action', 'actor', 'author', 'run', 'state', 'area', 'origin', 'reason'],
    discussions: ['action', 'actor', 'run'], agents: ['action', 'actor', 'run'] }
  const FIELD_NAMES = { action: 'Activity', actor: 'Participant', author: 'Author', reviewer: 'Reviewer', verdict: 'Review', run: 'Run',
    state: 'State', area: 'Area', reason: 'Close reason', origin: 'Origin', flag: 'Flag' }
  const derivedName = (f) => (f === 'flag' ? 'flags' : f) // the name reader.py's derived list gives a field
  const CAT = ['--viz-1', '--viz-2', '--viz-3', '--viz-6', '--viz-5', '--viz-7']
  // the derived field each sort orders by
  const SORT_FIELDS = { 'longest to merge': 'to_merge', 'quickest first review': 'first_review', 'most reviews': 'reviews',
    'most commits': 'commits', 'longest to fix': 'ended', 'most comments': 'comments', 'most posts': 'posts' }
  const AGENT_COLS = [['opened', 'Opened'], ['merged', 'Merged'], ['merges', 'Merges done'], ['approved', 'Approvals'], ['changes', 'Changes req.'], ['comments', 'Comments'], ['posts', 'Posts']]

  // what the analyst chose; every change refetches the tab. `filters` holds each filter's chosen values, `colour` the
  // field that colours the records, `byField` whether it does while labels are on, `hide` the label values whose records the legend hides ('none' for the records none
  // marks), and `page` the open unit's tab
  const S = { tab: 'pulls', runs: [], compare: false, q: '', filters: {}, sort: '', range: null, agentView: 'table', agentSort: 'merges',
    colour: 'action', byField: false, hide: [], page: 'conversation' }
  let data = null // the reader's answer for the tab (reader.py _view)
  let unit = null // the open unit's page (reader.py _detail)
  let focusRef = null // the record a citation opened
  let labelState = { labels: [], filter: null, all: null, palette: null } // what thimble.onLabels last said
  let menu = null // 'colour' or 'runs' while that menu is open
  let pal = null // {id, value, from} while a label value's palette is open
  let loading = 0

  function el(tag, cls, text) {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }
  function svg(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag)
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v)
    if (parent) parent.append(e)
    return e
  }
  const plural = (n, noun) => `${n} ${noun[n === 1 ? 0 : 1]}`
  const pad = (n) => String(n).padStart(2, '0')
  // a span of hours as the page writes it: 25m, 1h 04m
  function dur(h) {
    if (h == null) return '–'
    const m = Math.round(h * 60)
    return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${pad(m % 60)}m`
  }
  // a time as hours and minutes since its run started: +1:04
  function since(h) {
    const m = Math.max(0, Math.round(h * 60))
    return `+${Math.floor(m / 60)}:${pad(m % 60)}`
  }
  const MONTHS = 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')
  function clock(iso) {
    const m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(iso || '')
    return m ? `${Number(m[3])} ${MONTHS[Number(m[2]) - 1]} ${m[4]}:${m[5]} UTC` : iso || ''
  }
  const setup = (r) => `${r.team} agents · ${r.approvals} approval${r.approvals === 1 ? '' : 's'}`
  const colourOf = (action) => `var(${ACTIONS[action] || '--viz-ink-3'})`
  const unitRef = (key) => `view:${slug}/${key}`
  const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

  // ------------------------------------------------------------------------------------------------ colours
  // The records take the colours of the labels' values while a label is on (the reader's `classes`), else those of the
  // colour field's values: an action's or a state's own colour, and for the other fields the viz colours in the
  // reader's `order`, the values past them in ink.
  const labelOn = () => !S.byField && !!(data && data.classes.length)
  const field = () => (data ? data.colour.field : S.colour)
  const labelBy = (name) => (labelState.all || labelState.labels || []).find((l) => l.name === name)
  const classKey = (c) => `${c.label}\n${c.value}`
  function classColour(i) {
    const c = data.classes[i], l = labelBy(c.label), v = l && (l.values || []).find((x) => x.name === c.value)
    return (v && v.colour) || c.colour
  }
  function className(i) {
    const c = data.classes[i], l = labelBy(c.label)
    return l && (l.values || []).filter((v) => v.highlight !== false).length > 1 ? `${c.label}: ${c.value}` : c.label
  }
  const catIndex = (v) => data.colour.order.indexOf(v)
  function valueColour(f, v) {
    if (v === '') return 'var(--viz-ink-4)' // a record without the field is ink, as are the values past the viz colours
    if (f === 'action' || f === 'verdict') return colourOf(v)
    if (f === 'state') return `var(${STATE_COLOURS[v] || '--viz-ink-3'})`
    const i = catIndex(v)
    return i >= 0 && i < CAT.length ? `var(${CAT[i]})` : 'var(--viz-ink-4)'
  }
  const valueName = (f, v) => (v === '' ? `no ${FIELD_NAMES[f].toLowerCase()}` : String(v))
  // a record's part (reader.py _part) as a colour and a name
  const partColour = (p) => (labelOn() ? (p >= 0 ? classColour(p) : 'var(--viz-ink-4)') : valueColour(field(), p))
  const partName = (p) => (labelOn() ? (p >= 0 ? className(p) : 'no label') : valueName(field(), p))
  // the actions' own colours stand on the icons only while the records are coloured by activity; the states' while
  // they are coloured by activity or state
  const actionInk = () => labelOn() || field() !== 'action'
  const inked = () => labelOn() || (field() !== 'action' && field() !== 'state')
  const stateColour = (st) => `var(${(inked() ? STATE_INKS : STATE_COLOURS)[st] || '--viz-ink-3'})`
  // a flag chip's tone, neutral while a label is on
  const flagTone = () => (labelOn() ? 'chip-tone-neutral' : 'chip-tone-warning')

  // ------------------------------------------------------------------------------------------------ icons and avatars
  const ICONS = {
    pr: ['circle cx=4 cy=3.5 r=1.7', 'circle cx=4 cy=12.5 r=1.7', 'path d=M4 5.2v5.6', 'circle cx=12 cy=12.5 r=1.7', 'path d=M12 10.8V6.5a2 2 0 0 0-2-2H7.2'],
    merged: ['circle cx=4 cy=3.5 r=1.7', 'circle cx=4 cy=12.5 r=1.7', 'circle cx=12 cy=8 r=1.7', 'path d=M4 5.2v5.6', 'path d=M4.6 5.1C5.6 7.3 7.6 8 10.3 8'],
    prclosed: ['circle cx=4 cy=3.5 r=1.7', 'circle cx=4 cy=12.5 r=1.7', 'path d=M4 5.2v5.6', 'circle cx=12 cy=12.5 r=1.7', 'path d=M10.3 3.2l3.4 3.4M13.7 3.2l-3.4 3.4'],
    issue: ['circle cx=8 cy=8 r=6.2', 'circle cx=8 cy=8 r=1.3'],
    fixed: ['circle cx=8 cy=8 r=6.2', 'path d=M5.3 8.2l1.9 1.9 3.6-3.8'],
    issueclosed: ['circle cx=8 cy=8 r=6.2', 'path d=M5.6 10.4l4.8-4.8'],
    thread: ['path d=M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z'],
    commit: ['circle cx=8 cy=8 r=2.4', 'path d=M1.5 8h4.1M10.4 8h4.1'],
    approved: ['path d=M3.2 8.4l3 3 6.6-6.8'],
    changes: ['path d=M8 2.8v6.4M4.8 6h6.4M4.8 12.6h6.4'],
    comment: ['path d=M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z'],
    close: ['path d=M4.3 4.3l7.4 7.4M11.7 4.3l-7.4 7.4'],
    agent: ['circle cx=8 cy=5.2 r=2.6', 'path d=M3 13.6c.6-2.6 2.6-4 5-4s4.4 1.4 5 4'],
    branch: ['circle cx=4.5 cy=3.5 r=1.6', 'circle cx=4.5 cy=12.5 r=1.6', 'circle cx=11.5 cy=4.5 r=1.6', 'path d=M4.5 5.1v5.8', 'path d=M11.5 6.1c0 3-7 2.5-7 4.8'],
    file: ['path d=M4 1.8h5.2L12 4.6v9.6H4z', 'path d=M9 1.8v3h3'],
    search: ['circle cx=7 cy=7 r=4.5', 'path d=M10.5 10.5 14 14'],
  }
  function icon(name, cls) {
    const s = svg('svg', { viewBox: '0 0 16 16', class: 'ico' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' })
    for (const part of ICONS[name] || []) {
      const [tag, ...rest] = part.split(' ')
      const attrs = {}
      for (const kv of rest.join(' ').split(/ (?=[a-z]+=)/)) {
        const i = kv.indexOf('=')
        attrs[kv.slice(0, i)] = kv.slice(i + 1)
      }
      svg(tag, attrs, s)
    }
    return s
  }
  const CARET = '<svg class="ico s12" viewBox="0 0 12 12"><path d="M3.5 4.75 6 7.25l2.5-2.5"/></svg>'
  const CHECK = '<svg class="ico s12" viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.5l4.5-5"/></svg>'
  function stateIcon(tab, state) {
    if (tab === 'pulls') return icon(state === 'merged' ? 'merged' : state === 'closed' ? 'prclosed' : 'pr', 's-' + state)
    if (tab === 'issues') return icon(state === 'fixed' ? 'fixed' : state === 'closed' ? 'issueclosed' : 'issue', 's-' + state)
    return icon('thread', 's-thread')
  }
  const ACTION_ICON = { opened: 'pr', pushed: 'commit', approved: 'approved', 'changes requested': 'changes', commented: 'comment', posted: 'comment', merged: 'merged', fixed: 'merged', closed: 'close', reopened: 'pr', 'signed off': 'agent' }
  // a person as the initial of their name on a neutral disc, its shade from the name, so it reads the same everywhere
  function avatar(name, size, verdict) {
    const a = el('span', 'avatar' + (size ? ` s${size}` : ''), String(name || '?').replace(/[^a-z0-9]/gi, '').slice(0, 1) || '?')
    let h = 0
    for (const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0
    a.style.setProperty('--a', (0.08 + (h % 5) * 0.04).toFixed(2))
    a.title = name || ''
    if (verdict) {
      const v = el('span', 'v')
      const ic = icon(ACTION_ICON[verdict] || 'comment')
      ic.style.color = actionInk() ? 'var(--text-secondary)' : colourOf(verdict)
      v.append(ic)
      a.append(v)
    }
    return a
  }
  // a state as the forge's pill: its icon and name on the state's colour
  function statePill(tab, state) {
    const p = el('span', 'chip chip-sans state')
    p.style.setProperty('--c', `var(${STATE_COLOURS[state]})`)
    const ic = stateIcon(tab, state)
    ic.setAttribute('class', 'ico')
    p.append(ic, tab === 'issues' && state === 'fixed' ? 'Fixed' : STATE_NAMES[state] || state)
    return p
  }
  // a label value that marks a unit's records, as the forge's coloured label
  function labelPill(i) {
    const p = el('span', 'chip chip-sans lp', className(i))
    p.style.setProperty('--c', classColour(i))
    const l = labelBy(data.classes[i].label)
    if (l && l.id) p.dataset.label = l.id
    return p
  }
  function areaPill(area) {
    const b = el('button', 'chip chip-sans chip-tone-neutral chip-act', area)
    b.onclick = (e) => {
      e.stopPropagation()
      setFilter('area', area)
    }
    return b
  }
  function runTag(run) {
    return el('span', 'chip chip-tone-neutral', run)
  }
  // the size of a diff: its added and removed lines, and five blocks in those shares
  function diffstat(plus, minus) {
    const box = el('span', 'dstat')
    box.append(el('span', 'p', `+${plus}`), el('span', 'm', `−${minus}`))
    const blk = el('span', 'blk')
    const n = plus + minus, filled = Math.min(5, n), p = n ? Math.round((filled * plus) / n) : 0
    for (let i = 0; i < 5; i++) blk.append(el('i', i < p ? 'p' : i < filled ? 'm' : ''))
    box.append(blk)
    box.title = `${plus} lines added, ${minus} removed`
    return box
  }

  // ------------------------------------------------------------------------------------------------ fetching
  function query(extra) {
    return { op: 'view', tab: S.tab, runs: S.runs, compare: S.compare, q: S.q, filters: S.filters, range: S.range,
             sort: S.tab === 'agents' ? S.agentSort : S.sort, colour: S.colour, labels: !S.byField, hide: S.hide, offset: 0, ...extra }
  }
  async function load() {
    const mine = ++loading
    const res = await thimble.fetch(query())
    if (mine !== loading) return
    data = res
    S.hide = data.hide
    draw()
  }
  async function more() {
    const res = await thimble.fetch(query({ offset: data.items.length }))
    data.items = data.items.concat(res.items)
    drawList()
  }
  const chosen = () => new Set(data ? data.chosen : [])
  const allChosen = () => data && data.chosen.length === data.runs.length

  function draw() {
    document.body.classList.toggle('inked', inked())
    document.body.classList.toggle('compare', S.compare)
    drawTop()
    drawRuns()
    drawActivity()
    drawFilters()
    drawList()
    drawPop()
  }

  // ------------------------------------------------------------------------------------------------ the head
  // The run selector names the chosen runs; its menu takes one run on a click on its name, adds or removes a run on its
  // box, and takes every run on All runs.
  function drawTop() {
    const b = $('#runbtn')
    const names = allChosen() ? 'All runs' : data.chosen.length > 3 ? `${data.chosen.length} runs` : data.chosen.join(', ')
    b.innerHTML = ''
    b.append(icon('branch'))
    b.insertAdjacentHTML('beforeend', `<span class="k">Runs</span><b>${esc(names)}</b>${CARET}`)
    b.onclick = (e) => {
      e.stopPropagation()
      menu = menu === 'runs' ? null : 'runs'
      pal = null
      drawPop()
    }
    const chips = $('#runchips')
    chips.replaceChildren()
    if (!allChosen()) {
      const all = el('button', 'btn btn-ghost btn-sm', 'All runs')
      all.onclick = () => {
        S.runs = []
        load()
      }
      chips.append(all)
    }
    const box = $('#tabs')
    box.replaceChildren(...Object.entries(TABS).map(([key, t]) => {
      const btn = el('button', key === S.tab ? 'on' : '')
      const inner = el('span')
      inner.append(icon(t.icon), t.name, el('span', 'chip chip-tone-neutral', String(data.tabs[key])))
      btn.append(inner)
      btn.onclick = () => {
        if (S.tab === key) return
        Object.assign(S, { tab: key, filters: {}, sort: '', q: '' })
        $('#main').scrollTop = 0
        load()
      }
      return btn
    }))
    for (const m of document.querySelectorAll('#mode .seg-opt')) m.classList.toggle('active', (m.dataset.mode === 'compare') === S.compare)
  }
  function runsMenuHtml() {
    const all = allChosen()
    const rows = data.runs.map((r) => {
      const on = data.chosen.includes(r.run)
      return `<div class="mi run" data-act="onlyrun" data-run="${esc(r.run)}"><span class="tick ${on ? 'on' : ''}" data-act="togglerun" data-run="${esc(r.run)}" role="checkbox" aria-checked="${on}" title="Add or remove this run">${on ? CHECK : ''}</span><span class="nm"><b>${esc(r.run)}</b><span>${esc(setup(r))}</span></span><span class="n">${Math.round(r.hours * 10) / 10}h</span></div>`
    }).join('')
    return `<div class="menu" id="menu" data-anchor-name="Run selector"><div class="mh">Runs</div><button class="mi" data-act="allruns"><span class="ck">${all ? CHECK : ''}</span>All runs<span class="n">${data.runs.length}</span></button><div class="msep"></div>${rows}</div>`
  }

  // A run's row toggles the run; with every run chosen it takes that run alone, as a legend does, and the last run left
  // gives every run back.
  function toggleRun(run) {
    const all = data.runs.map((r) => r.run)
    let next
    if (allChosen()) next = [run]
    else if (chosen().has(run)) next = data.chosen.filter((r) => r !== run)
    else next = data.chosen.concat(run)
    S.runs = next.length && next.length < all.length ? all.filter((r) => next.includes(r)) : []
    load()
  }
  function onlyRun(run, filters) {
    S.runs = [run]
    Object.assign(S.filters, filters || {})
    load()
  }

  // the colour of the number of a run's units a label marks: its value's, while one value alone is on
  const markedColour = () => (data.classes.length === 1 ? classColour(0) : 'var(--text-primary)')
  // a run's units as a bar of their states in words, or while a label is on the part each of its values marks
  function stateBar(parts) {
    return (r, max) => {
      const box = el('div')
      const bars = el('div', 'bars')
      bars.style.width = `${Math.max(8, Math.round((r.n / Math.max(1, max)) * 100))}%`
      const words = el('div', 'words')
      if (labelOn()) {
        r.classes.forEach((n, i) => {
          if (!n) return
          const m = el('span')
          m.style.cssText = `flex:${n};background:${classColour(i)}`
          bars.append(m)
        })
        const rest = el('span')
        rest.style.cssText = `flex:${Math.max(0, r.n - r.marked)};background:var(--viz-ink-4)`
        bars.append(rest)
        const b = el('b', null, String(r.marked))
        b.style.color = markedColour()
        words.append(b, ` of ${r.n}`)
      } else {
        for (const p of parts) {
          if (!r[p]) continue
          const s = el('span')
          s.style.cssText = `flex:${r[p]};background:${stateColour(p)}`
          bars.append(s)
        }
        const shown = parts.filter((p) => r[p])
        shown.forEach((p, i) => {
          const b = el('b', null, String(r[p]))
          b.style.color = stateColour(p)
          words.append(b, ` ${p}${i < shown.length - 1 ? ' · ' : ''}`)
        })
        if (!shown.length) words.append('none')
      }
      box.append(bars, words)
      return box
    }
  }
  const num = (key, fmt) => (r) => (r[key] == null ? '–' : fmt ? fmt(r[key]) : String(r[key]))
  // each tab's measures per run: a head and a cell, or a count that narrows the list to its run and to a flag or a
  // filter's value; a narrow pane in compare mode leaves out the `wide1` columns, and `wide2` columns need a wide pane
  const RUN_COLS = {
    pulls: [
      { head: 'Pull requests', cell: stateBar(['merged', 'closed', 'open']) },
      { head: 'To merge', field: 'to_merge', cell: num('to_merge', dur), num: true },
      { head: 'First review', field: 'first_review', cell: num('first_review', dur), num: true, cls: 'wide1' },
      { head: 'Reviews each', field: 'reviews', cell: num('reviews', (v) => v.toFixed(1)), num: true, cls: 'wide1' },
      { head: 'Self-merged', flag: 'merged by its author', num: true, cls: 'wide2' },
      { head: 'Merged over changes', flag: 'merged over a change request', num: true, cls: 'wide2' },
      { head: 'Pushed after approval', flag: 'pushed after its last approval', num: true, cls: 'wide2' },
    ],
    issues: [
      { head: 'Issues', cell: stateBar(['fixed', 'closed', 'open']) },
      { head: 'To fix', field: 'to_fix', cell: num('to_fix', dur), num: true },
      { head: 'Found in run', filter: ['origin', 'found during the run'], key: 'found', num: true, cls: 'wide1' },
      { head: 'Several PRs', key: 'several', num: true, cls: 'wide1' },
    ],
    discussions: [
      { head: 'Discussions', cell: (r) => countWords(r.n, r.marked) },
      { head: 'Posts', field: 'posts', cell: num('posts'), num: true },
      { head: 'Posting', field: 'posters', cell: (r) => `${r.posters} of ${r.team}`, num: true },
    ],
    agents: [
      { head: 'Reviews by agent', field: 'spread', cell: (r) => spread(r.spread) },
      { head: 'Top share', field: 'top', cell: num('top', (v) => `${Math.round(v * 100)}%`), num: true },
      { head: 'Merges', field: 'merges', cell: num('merges'), num: true, cls: 'wide1' },
      { head: 'Approved each other', field: 'mutual', cell: (r) => `${r.mutual} pair${r.mutual === 1 ? '' : 's'}`, num: true, cls: 'wide1' },
    ],
  }
  function countWords(n, marked) {
    const box = el('div', 'words')
    if (labelOn()) {
      const b = el('b', null, String(marked))
      b.style.color = markedColour()
      box.append(b, ` of ${n}`)
    } else box.append(el('b', null, String(n)))
    return box
  }
  function spread(values) {
    const box = el('div', 'spread')
    const max = Math.max(1, ...values)
    for (const v of values) {
      const s = el('span')
      s.style.height = `${Math.max(1, Math.round((v / max) * 18))}px`
      s.title = `${v} reviews`
      box.append(s)
    }
    return box
  }

  function drawRuns() {
    const cols = RUN_COLS[S.tab]
    const table = el('table', 'table runs')
    const head = el('tr')
    head.append(el('th', null, 'Run'), el('th', null, 'Setup'))
    for (const c of cols) {
      const th = el('th', [c.num ? 'num' : '', c.cls || ''].join(' ').trim(), c.head)
      const f = c.field || c.key || c.flag
      if (f) th.dataset.field = f
      head.append(th)
    }
    if (S.compare) head.append(el('th', null, `Activity, per ${data.activity.bin} min`))
    const thead = el('thead')
    thead.append(head)
    const body = el('tbody')
    const max = Math.max(1, ...data.runs.map((r) => r.n))
    const on = chosen()
    const ymax = S.compare ? activityMax(data.activity.rows) : 0
    for (const r of data.runs) {
      const tr = el('tr', on.has(r.run) ? '' : 'off')
      tr.dataset.anchor = unitRef(r.run)
      tr.dataset.anchorName = `the run ${r.run}, ${setup(r)}`
      const chipTd = el('td')
      const chip = el('button', 'chip chip-sans chip-tone-neutral chip-act' + (on.has(r.run) && !allChosen() ? ' active' : ''), r.run)
      if (field() === 'run' && !labelOn()) {
        const sw = el('i', 'sw')
        sw.style.background = valueColour('run', r.run)
        chip.prepend(sw)
      }
      chipTd.append(chip)
      tr.append(chipTd, el('td', 'setup', setup(r)))
      for (const c of cols) {
        const td = el('td', [c.num ? 'num' : '', c.cls || ''].join(' ').trim())
        if (c.flag || c.filter) {
          const n = r[c.flag || c.key]
          if (n) {
            const b = el('button', 'btn btn-ghost btn-sm', String(n))
            b.onclick = (e) => {
              e.stopPropagation()
              onlyRun(r.run, c.flag ? { flag: [c.flag] } : { [c.filter[0]]: [c.filter[1]] })
            }
            td.append(b)
          } else td.append(el('span', 'dim', '0'))
        } else if (c.key) td.append(String(r[c.key]))
        else td.append(c.cell(r, max))
        tr.append(td)
      }
      if (S.compare) {
        const td = el('td', 'act')
        td.append(chart(data.activity.rows.filter((x) => x[0] === r.run), { width: RUN_ACTIVITY_WIDTH, height: 30, ymax, axis: false, fill: true }))
        tr.append(td)
      }
      tr.onclick = () => toggleRun(r.run)
      body.append(tr)
    }
    table.append(thead, body)
    const box = $('#runs')
    const bh = el('div', 'box-head')
    bh.append(el('h3', null, 'Runs'), el('span', 'dim', allChosen() ? `all ${data.runs.length}` : `${data.chosen.length} of ${data.runs.length} chosen`))
    if (S.compare) {
      const foot = el('tfoot')
      const tr = el('tr')
      tr.append(el('td'), el('td'), ...cols.map((c) => el('td', c.cls || '')))
      const axis = el('td', 'act')
      axis.append(axisRow())
      tr.append(axis)
      foot.append(tr)
      table.append(foot)
      bh.append(el('span', 'grow'), legend())
    }
    box.replaceChildren(bh, table)
    // the columns a narrow pane may leave out go one by one, the last of the wider ones first, while the table is
    // wider than its box
    const optional = [...cols.keys()].filter((i) => cols[i].cls).sort((a, b) => cols[b].cls.localeCompare(cols[a].cls) || b - a)
    for (const i of optional) {
      if (table.offsetWidth <= box.clientWidth) break
      for (const row of table.rows) if (row.cells[i + 2]) row.cells[i + 2].style.display = 'none'
    }
  }

  // ------------------------------------------------------------------------------------------------ activity
  // The chosen runs' kept records per time bin since each run started, stacked by their part: the colour field's value,
  // or while a label is on the first of its values that marks them. A drag across it narrows every panel to that time
  // range; a click takes one bin.
  const RUN_ACTIVITY_WIDTH = 400 // the viewBox width of a run's activity in compare mode, drawn at its cell's width
  function binsOf(rows) {
    const bins = new Map()
    for (const [, b, part, n] of rows) {
      const parts = bins.get(b) || new Map()
      parts.set(part, (parts.get(part) || 0) + n)
      bins.set(b, parts)
    }
    return bins
  }
  function activityMax(rows) {
    const per = new Map()
    for (const [run, b, , n] of rows) per.set(run + '/' + b, (per.get(run + '/' + b) || 0) + n)
    return Math.max(1, ...per.values())
  }
  // the parts bottom first: the labels' values in thimble's order, the actions or states in their own, the rest by order
  function partsOrder(present) {
    const f = field()
    const order = labelOn() ? [...data.classes.map((_, i) => i), -1] : f === 'action' ? Object.keys(ACTIONS) : f === 'state' ? Object.keys(STATE_COLOURS) : data.colour.order
    return [...order.filter((p) => present.has(p)), ...[...present].filter((p) => !order.includes(p))]
  }
  function chart(rows, { width, height, ymax, axis, fill }) {
    const a = data.activity
    const nb = Math.max(1, Math.ceil((a.hours * 60) / a.bin))
    const left = axis ? 24 : 0
    const bottom = axis ? 16 : 0
    const w = width - left
    const bw = w / nb
    const h = height - bottom
    const bins = binsOf(rows)
    const max = ymax || Math.max(1, ...[...bins.values()].map((p) => [...p.values()].reduce((s, v) => s + v, 0)))
    const s = fill
      ? svg('svg', { class: 'chart', width: '100%', height, viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'none' })
      : svg('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}` })
    if (axis) {
      svg('line', { class: 'base', x1: left, x2: width, y1: h + 0.5, y2: h + 0.5 }, s)
      svg('text', { x: left - 5, y: 8, 'text-anchor': 'end' }, s).textContent = String(max)
      svg('text', { x: left - 5, y: h, 'text-anchor': 'end' }, s).textContent = '0'
      const step = a.hours > 12 ? 4 : a.hours > 6 ? 2 : 1
      for (let t = 0; t <= a.hours; t += step) {
        const x = left + ((t * 60) / a.bin) * bw
        svg('text', { x, y: height - 3, 'text-anchor': t === 0 ? 'start' : 'middle' }, s).textContent = `${t}h`
      }
    }
    const order = partsOrder(new Set(rows.map((r) => r[2])))
    for (const [b, parts] of bins) {
      let y = h
      for (const p of order) {
        const n = parts.get(p)
        if (!n) continue
        const bh = (n / max) * (h - 2)
        y -= bh
        const r = svg('rect', { x: left + b * bw + 0.5, y, width: Math.max(1, bw - 1), height: bh, style: `fill:${partColour(p)}` }, s)
        svg('title', {}, r).textContent = `${since((b * a.bin) / 60)} to ${since(((b + 1) * a.bin) / 60)}: ${n} ${partName(p)}`
      }
    }
    brush(s, { left, h, nb, bw })
    return s
  }
  function brush(s, { left, h, nb, bw }) {
    const a = data.activity
    const hoursAt = (x) => Math.max(0, Math.min(nb, (x - left) / bw)) * (a.bin / 60)
    const xAt = (hours) => left + ((hours * 60) / a.bin) * bw
    const rect = svg('rect', { class: 'brush', y: 0, height: h, x: 0, width: 0, visibility: 'hidden' }, s)
    const show = (h0, h1) => {
      rect.setAttribute('x', xAt(h0))
      rect.setAttribute('width', Math.max(1, xAt(h1) - xAt(h0)))
      rect.setAttribute('visibility', 'visible')
    }
    if (S.range) show(S.range[0], S.range[1])
    let from = null
    // pointer positions in the drawing's own units, which a chart that fills its cell scales
    const local = (e) => {
      const box = s.getBoundingClientRect()
      return ((e.clientX - box.left) * s.viewBox.baseVal.width) / Math.max(1, box.width)
    }
    s.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return
      from = local(e)
      s.setPointerCapture(e.pointerId)
      e.stopPropagation()
    })
    s.addEventListener('pointermove', (e) => {
      if (from == null) return
      const x = local(e)
      show(hoursAt(Math.min(from, x)), hoursAt(Math.max(from, x)))
    })
    s.addEventListener('click', (e) => e.stopPropagation())
    s.addEventListener('pointerup', (e) => {
      if (from == null) return
      const x = local(e)
      const snap = (v, up) => (Math[up ? 'ceil' : 'floor']((v * 60) / a.bin) * a.bin) / 60
      let h0 = snap(hoursAt(Math.min(from, x)), false)
      let h1 = snap(hoursAt(Math.max(from, x)), true)
      if (h1 - h0 < a.bin / 60) h1 = h0 + a.bin / 60
      from = null
      S.range = [Math.round(h0 * 1000) / 1000, Math.round(h1 * 1000) / 1000]
      load()
    })
  }
  // the Colour menu's button and the legend of its colours: a click shows one value alone, or every value again when it
  // was alone, and a shift-click hides it or shows it again
  function legend() {
    const box = el('div', 'legend')
    box.append(colourButton())
    let hiding = false
    if (labelOn()) {
      data.classes.forEach((c, i) => box.append(legendItem(classColour(i), className(i), c.n, classKey(c), S.hide.includes(classKey(c)), labelBy(c.label), c.value)))
      if (data.none || S.hide.includes('none')) box.append(legendItem('var(--viz-ink-4)', 'no label', data.none, 'none', S.hide.includes('none')))
      hiding = S.hide.length > 0
    } else {
      const f = field(), own = data.colour.filter, chose = own ? S.filters[own] || [] : []
      const off = (v) => (f === 'run' ? !allChosen() && !chosen().has(v) : chose.length > 0 && !chose.includes(v))
      const can = f === 'run' || !!own
      const ownColours = f === 'action' || f === 'state'
      const rest = []
      let none = null // the records without the field, last and never folded into the rest
      for (const [v, n] of data.colour.values) {
        if (v === '') none = legendItem(valueColour(f, v), valueName(f, v), n, v, off(v), null, null, can)
        else if (!ownColours && (catIndex(v) < 0 || catIndex(v) >= CAT.length)) rest.push(n)
        else box.append(legendItem(valueColour(f, v), valueName(f, v), n, v, off(v), null, null, can))
      }
      if (rest.length) {
        const more = el('span', 'lg st')
        const sw = el('i', 'sw')
        sw.style.background = 'var(--viz-ink-4)'
        more.append(sw, `${rest.length} more`, el('span', 'n', String(rest.reduce((a, b) => a + b, 0))))
        box.append(more)
      }
      if (none) box.append(none)
      hiding = f === 'run' ? !allChosen() : chose.length > 0
    }
    if (hiding) {
      const all = el('button', 'btn btn-ghost btn-sm', 'Show all')
      all.onclick = (e) => {
        e.stopPropagation()
        if (labelOn()) S.hide = []
        else if (field() === 'run') S.runs = []
        else delete S.filters[data.colour.filter]
        load()
      }
      box.append(all)
    }
    box.append(el('span', 'per', `per ${data.activity.bin} min`))
    return box
  }
  function colourButton() {
    const b = el('button', 'btn btn-secondary btn-sm cbtn')
    b.id = 'cbtn'
    let what = `<span class="cnm" data-field="${derivedName(field())}">${esc(FIELD_NAMES[field()])}</span>`
    if (labelOn()) {
      const names = [...new Set(data.classes.map((c) => c.label))]
      const sws = data.classes.slice(0, 6).map((_, i) => `<i class="sw" style="background:${classColour(i)}"></i>`).join('')
      what = `<span class="sws">${sws}</span><span class="cnm">${esc(names.length === 1 ? names[0] : `${names.length} labels`)}</span>`
      const ids = labelState.labels.map((l) => l.id).filter(Boolean).join(' ')
      if (ids) b.dataset.label = ids
    }
    b.innerHTML = `<span class="k">Colour</span>${what}${CARET}`
    b.onclick = (e) => {
      e.stopPropagation()
      menu = menu === 'colour' ? null : 'colour'
      pal = null
      drawPop()
    }
    return b
  }
  function legendItem(colour, text, n, v, off, label, value, can = true) {
    const it = el('span', 'lg' + (off ? ' off' : '') + (can ? '' : ' st'))
    if (label && label.id) it.dataset.label = label.id
    it.append(swatch(colour, label, value), text, el('span', 'n', String(n || 0)))
    if (!can) return it
    it.setAttribute('role', 'button')
    it.title = 'Click: only this · Shift-click: hide'
    it.onclick = (e) => {
      e.stopPropagation()
      legendClick(v, e.shiftKey)
    }
    return it
  }
  // a label value's swatch opens the palette of thimble's label colours, where thimble takes a colour change
  function swatch(colour, label, value) {
    const sw = el('i', 'sw')
    sw.style.background = colour
    if (!label || !label.id || !(labelState.palette || []).length || !thimble.setLabelColour) return sw
    const b = el('span', 'swb')
    b.setAttribute('role', 'button')
    b.title = 'Change colour'
    Object.assign(b.dataset, { act: 'palette', id: label.id, value })
    b.append(sw)
    b.onclick = (e) => {
      e.stopPropagation()
      openPalette(label.id, value, 'legend')
    }
    return b
  }
  function legendClick(v, shift) {
    const pick = (all, now) => {
      let shown = new Set(now.length ? now : all)
      if (shift) {
        shown.has(v) ? shown.delete(v) : shown.add(v)
        if (!shown.size) return null
      } else shown = shown.size === 1 && shown.has(v) ? new Set(all) : new Set([v])
      return all.every((x) => shown.has(x)) ? [] : all.filter((x) => shown.has(x))
    }
    if (labelOn()) {
      const keys = [...data.classes.map(classKey), 'none']
      const shown = pick(keys, keys.filter((k) => !S.hide.includes(k)))
      if (!shown) return
      S.hide = shown.length ? keys.filter((k) => !shown.includes(k)) : []
    } else if (field() === 'run') {
      const shown = pick(data.runs.map((r) => r.run), allChosen() ? [] : data.chosen)
      if (!shown) return
      S.runs = shown
    } else {
      const own = data.colour.filter
      const shown = pick(data.colour.values.map(([x]) => x), S.filters[own] || [])
      if (!shown) return
      if (shown.length) S.filters[own] = shown
      else delete S.filters[own]
    }
    load()
  }

  // ------------------------------------------------------------------------------------------------ the menus and the palette
  function openPalette(id, value, from) {
    pal = pal && pal.id === id && pal.value === value ? null : { id, value, from }
    drawPop()
  }
  function previewColours(f) {
    if (f === 'action') return ['opened', 'approved', 'changes requested', 'merged'].map(colourOf)
    if (f === 'verdict') return ['approved', 'changes requested', 'commented'].map(colourOf)
    if (f === 'state') return ['open', 'merged', 'closed'].map((st) => `var(${STATE_COLOURS[st]})`)
    return CAT.slice(0, 4).map((c) => `var(${c})`)
  }
  function menuHtml() {
    const fields = COLOURS[S.tab].map((f) => {
      const on = !labelOn() && field() === f
      const sws = previewColours(f).map((c) => `<i class="sw" style="width:5px;border-radius:1px;background:${c}"></i>`).join('')
      return `<button class="mi" data-act="field" data-f="${f}"><span class="ck">${on ? CHECK : ''}</span>${thimble.field(derivedName(f), FIELD_NAMES[f])}<span class="n">${sws}</span></button>`
    }).join('')
    // every label over files, as thimble lists them; a click turns one on or off in thimble's Labels pane
    const all = labelState.all || labelState.labels.map((l) => ({ ...l, on: true }))
    const sw = (l, v) => {
      const i = `<i class="sw" style="background:${esc(v.colour)}"></i>`
      return l.id && (labelState.palette || []).length && thimble.setLabelColour
        ? `<span class="swb" role="button" title="Change colour" data-act="palette" data-id="${esc(l.id)}" data-value="${esc(v.name)}">${i}</span>` : i
    }
    const rows = all.map((l) => {
      const lit = (l.values || []).filter((v) => v.highlight !== false)
      const box = `<span class="lmark ${l.on ? 'on' : ''}" style="--mark:${esc(l.colour)}"></span>`
      const main = `<button class="mi" data-act="label" data-id="${esc(l.id || '')}" data-label="${esc(l.id || '')}" ${l.id && thimble.setLabel ? '' : 'disabled'}><span class="ck">${box}</span><span class="nm">${esc(l.name)}</span>
        <span class="n">${l.count == null ? '' : l.count}</span>${lit.length === 1 ? sw(l, lit[0]) : ''}</button>`
      const subs = l.on && lit.length > 1 ? lit.map((v) => `<div class="mi sub" data-label="${esc(l.id || '')}"><span class="nm">${esc(v.name)}</span><span class="n"></span>${sw(l, v)}</div>`).join('') : ''
      return main + subs
    }).join('')
    const make = thimble.newLabel ? '<div class="msep"></div><button class="mi" data-act="newlabel"><span class="ck"><svg class="ico s12" viewBox="0 0 12 12"><path d="M6 2.5v7M2.5 6h7"/></svg></span>New label…</button>' : ''
    return `<div class="menu" id="menu" data-anchor-name="Colour menu"><div class="mh">Fields</div>${fields}${rows ? `<div class="msep"></div><div class="mh">Labels</div>${rows}` : ''}${make}</div>`
  }
  function palHtml() {
    const l = (labelState.all || labelState.labels || []).find((x) => x.id === pal.id)
    const cur = String((l && ((l.values || []).find((v) => v.name === pal.value) || {}).colour) || '').toLowerCase()
    return `<div class="pal" id="pal" data-label="${esc(pal.id)}">${labelState.palette.map((c) => `<button data-act="colour" data-colour="${esc(c)}" class="${c.toLowerCase() === cur ? 'cur' : ''}" style="background:${esc(c)}" aria-label="Colour ${esc(c)}"></button>`).join('')}</div>`
  }
  // a menu opens under the button that opened it; the palette beside the swatch that opened it, in the menu or the legend
  function drawPop() {
    const pop = $('#pop')
    const btn = menu === 'runs' ? $('#runbtn') : $('#cbtn')
    if (menu && !btn) menu = null
    if (pal && !(labelState.palette || []).length) pal = null
    pop.innerHTML = (menu === 'colour' ? menuHtml() : menu === 'runs' && data ? runsMenuHtml() : '') + (pal ? palHtml() : '')
    const m = $('#menu')
    if (m) {
      const r = btn.getBoundingClientRect()
      m.style.left = `${Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8))}px`
      m.style.top = `${Math.max(8, Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8))}px`
    }
    const p = $('#pal')
    if (p) {
      const sel = `[data-act="palette"][data-id="${CSS.escape(pal.id)}"][data-value="${CSS.escape(pal.value)}"]`
      const a = $(`${pal.from === 'menu' ? '#menu' : '.legend'} ${sel}`)
      if (!a) {
        pal = null
        p.remove()
        return
      }
      const r = a.getBoundingClientRect()
      const x = pal.from === 'menu' ? r.right + 6 : r.left
      const y = pal.from === 'menu' ? r.top - 10 : r.bottom + 4
      p.style.left = `${Math.max(8, Math.min(x, innerWidth - p.offsetWidth - 8))}px`
      p.style.top = `${Math.max(8, Math.min(y, innerHeight - p.offsetHeight - 8))}px`
    }
  }
  // the hours under the runs' activity in compare mode, placed as a share of the column's width
  function axisRow() {
    const a = data.activity
    const box = el('div', 'axisrow')
    const span = Math.max(1, Math.ceil((a.hours * 60) / a.bin)) * (a.bin / 60)
    const step = a.hours > 12 ? 4 : a.hours > 6 ? 2 : 1
    for (let t = 0; t <= a.hours; t += step) {
      const tick = el('span', null, `${t}h`)
      tick.style.left = `${(t / span) * 100}%`
      box.append(tick)
    }
    return box
  }
  function drawActivity() {
    const box = $('#activity')
    if (S.compare) return box.replaceChildren()
    const head = el('div', 'box-head')
    head.append(el('h3', null, 'Activity'), el('span', 'dim', allChosen() ? 'every run' : data.chosen.join(', ')))
    const body = el('div', 'body')
    box.replaceChildren(head, body)
    const width = Math.max(240, body.clientWidth - 28 || 300)
    const narrow = $('#main').classList.contains('w-s')
    body.append(legend(), chart(data.activity.rows, { width, height: narrow ? 92 : 112, axis: true }))
  }

  // ------------------------------------------------------------------------------------------------ filters
  function facet(name) {
    return (data.facets && data.facets[name]) || []
  }
  function drawFilters() {
    const t = TABS[S.tab]
    const box = $('#filters')
    const parts = []
    const wrap = el('label', 'search')
    const search = el('input', 'field')
    search.type = 'search'
    search.placeholder = `Search ${t.name.toLowerCase()}`
    search.setAttribute('aria-label', `Search ${t.name.toLowerCase()}`)
    search.value = S.q
    let typing = null
    search.addEventListener('input', () => {
      clearTimeout(typing)
      typing = setTimeout(() => {
        S.q = search.value
        load()
      }, 180)
    })
    wrap.append(icon('search'), search)
    parts.push(wrap)
    // A select adds the value picked to its filter's values, or removes one already chosen (ticked); its closed face
    // names the field and the chosen values, and Any clears them.
    for (const [name, what, many, any] of t.selects) {
      const values = facet(name)
      if (!values.length) continue
      const picked = S.filters[name] || []
      const sel = el('select', 'field' + (picked.length ? ' set' : ''))
      sel.setAttribute('aria-label', what)
      sel.dataset.field = derivedName(name)
      sel.append(new Option(any || `${what}`, ''))
      if (picked.length) {
        const names = picked.join(', ')
        const face = new Option(`${what}: ${picked.length > 2 || names.length > 28 ? `${picked.length} ${many}` : names}`, 'chosen')
        face.hidden = true
        sel.append(face)
      }
      for (const [v, n] of values) {
        const o = new Option(`${picked.includes(v) ? '✓ ' : ''}${v} ${n}`, v)
        if (!n && !picked.includes(v)) o.disabled = true
        sel.append(o)
      }
      sel.value = picked.length ? 'chosen' : ''
      sel.onchange = () => (sel.value ? toggleFilter(name, sel.value) : setFilter(name, null))
      parts.push(sel)
    }
    if (S.range) {
      const c = el('button', 'chip chip-sans chip-tone-neutral chip-act active', `${since(S.range[0])} to ${since(S.range[1])} ✕`)
      c.setAttribute('aria-label', 'Clear the time range')
      c.onclick = () => {
        S.range = null
        load()
      }
      parts.push(c)
    }
    if (Object.keys(S.filters).length || S.q || S.range || S.hide.length) {
      const clear = el('button', 'btn btn-ghost btn-sm', 'Clear filters')
      clear.onclick = () => {
        Object.assign(S, { filters: {}, q: '', range: null, hide: [] })
        load()
      }
      parts.push(clear)
    }
    const hadFocus = document.activeElement && document.activeElement.type === 'search'
    box.replaceChildren(...parts)
    if (hadFocus) {
      search.focus()
      search.setSelectionRange(search.value.length, search.value.length)
    }
  }
  // a filter narrowed to one value, or cleared with none
  function setFilter(name, value) {
    if (value) S.filters[name] = [value]
    else delete S.filters[name]
    load()
  }
  function toggleFilter(name, value) {
    const now = S.filters[name] || []
    const next = now.includes(value) ? now.filter((v) => v !== value) : [...now, value]
    if (next.length) S.filters[name] = next
    else delete S.filters[name]
    load()
  }
  // the list's head: the states as the forge's open and closed switch, then the sort and the count
  function listHead() {
    const t = TABS[S.tab]
    const head = el('div', 'box-head')
    const states = el('div', 'states')
    if (t.states) {
      const counts = Object.fromEntries(facet('state'))
      const chosenStates = S.filters.state || []
      const total = Object.values(counts).reduce((s, v) => s + v, 0)
      const all = el('button', chosenStates.length ? '' : 'on')
      all.append(icon(t.icon), `${total} All`)
      all.onclick = () => setFilter('state', null)
      states.append(all)
      for (const st of t.states) {
        if (!counts[st] && !chosenStates.includes(st)) continue
        const b = el('button', chosenStates.includes(st) ? 'on' : '')
        b.append(stateIcon(S.tab, st), `${counts[st] || 0} ${st === 'fixed' ? 'Fixed' : STATE_NAMES[st]}`)
        b.onclick = () => setFilter('state', st)
        states.append(b)
      }
    } else states.append(el('h3', null, plural(data.total, t.noun)))
    head.append(states, el('span', 'grow'))
    if (S.tab === 'agents') {
      const seg = el('div', 'seg seg-track')
      for (const [v, text] of [['table', 'Table'], ['matrix', 'Who reviewed whom']]) {
        const b = el('button', 'seg-opt' + (S.agentView === v ? ' active' : ''), text)
        b.onclick = () => {
          S.agentView = v
          drawList()
        }
        seg.append(b)
      }
      head.append(seg)
    }
    if (t.sorts.length) {
      const sel = el('select', 'field')
      sel.setAttribute('aria-label', 'Sort')
      for (const [v, text] of t.sorts) {
        const o = new Option(`Sort: ${text}`, v, false, (S.sort || t.sorts[0][0]) === v)
        if (SORT_FIELDS[v]) o.dataset.field = SORT_FIELDS[v]
        sel.append(o)
      }
      sel.onchange = () => {
        S.sort = sel.value
        load()
      }
      head.append(sel)
    }
    if (t.states) head.append(el('span', 'total', plural(data.total, t.noun)))
    return head
  }

  // ------------------------------------------------------------------------------------------------ lists
  // A unit's records on the shared time axis of the run, one tick per record in its part's colour (partColour), those
  // no label marks in ink while a label is on, and those the time range or the record filters leave out faint.
  function strip(ticks, width, height) {
    const a = data.activity
    const s = svg('svg', { class: 'strip', width, height, viewBox: `0 0 ${width} ${height}` })
    svg('line', { x1: 0, x2: width, y1: height / 2, y2: height / 2, style: 'stroke:var(--border-subtle)' }, s)
    const span = Math.max(0.5, a.hours)
    for (const [ref, h, act, part, on] of ticks) {
      const colour = on === 0 ? 'var(--viz-ink-4)' : labelOn() && part < 0 ? 'var(--viz-ink-3)' : partColour(part)
      const r = svg('rect', { x: Math.min(width - 2, (Math.max(0, h) / span) * width), y: 1, width: 2, height: height - 2, style: `fill:${colour}` }, s)
      r.dataset.anchor = ref
      svg('title', {}, r).textContent = `${act} ${since(h)}`
    }
    return s
  }
  function who(name, filterName) {
    const b = el('button', 'lnk strong', name)
    b.onclick = (e) => {
      e.stopPropagation()
      setFilter(filterName, name)
    }
    return b
  }
  function openKey(key) {
    thimble.navigate(unitRef(key))
  }
  function unitLink(text, key) {
    const b = el('button', 'lnk strong', text)
    b.onclick = (e) => {
      e.stopPropagation()
      openKey(key)
    }
    return b
  }
  function rowBase(item, name) {
    const row = el('div', 'row' + (unit && unit.key === item.key ? ' active' : ''))
    row.dataset.anchor = unitRef(item.key)
    row.dataset.anchorName = name
    row.onclick = () => openKey(item.key)
    return row
  }
  function countsBox(pairs) {
    const box = el('div', 'counts')
    for (const [ic, n, tip] of pairs) {
      const s = el('span')
      s.title = tip
      if (n) s.append(icon(ic), String(n))
      box.append(s)
    }
    return box
  }
  function stripWidth() {
    const m = $('#main')
    return m.classList.contains('w-s') ? 110 : m.classList.contains('w-m') ? 150 : 200
  }
  // a unit's title with the forge's labels after it: its area, then the label values that mark its records
  function titleLine(text, item) {
    const t = el('div', 't')
    const title = el('span', 'title', text)
    title.title = text
    t.append(title, runTag(item.run))
    if (item.area) t.append(areaPill(item.area))
    for (const i of item.marks || []) t.append(labelPill(i))
    return t
  }
  function meta(...parts) {
    const m = el('div', 'meta')
    parts.filter((p) => p != null && p !== '').forEach((p, i) => {
      const s = el('span')
      if (i) s.append(el('span', 'sep'))
      s.append(...(Array.isArray(p) ? p : [p]))
      m.append(s)
    })
    return m
  }
  // each reviewer as an avatar with their latest verdict on it
  function reviewers(latest) {
    const box = el('span', 'avs')
    for (const [name, verdict] of Object.entries(latest || {})) {
      const a = avatar(name, 20, verdict)
      a.title = `${name}: ${verdict}`
      box.append(a)
    }
    return box
  }
  function pullRow(p) {
    const row = rowBase(p, `pull request ${p.run} #${p.number}, ${p.title}`)
    const main = el('div')
    const state = p.state === 'merged' ? [`merged by `, who(p.merged_by, 'actor'), ` ${dur(p.to_merge)} after opening`]
      : p.state === 'closed' ? [`closed by `, who(p.closed_by, 'actor'), ` as ${p.reason}`]
        : [`open for ${dur(data.runs.find((r) => r.run === p.run).hours - p.at)}`]
    main.append(titleLine(p.title, p), meta([`#${p.number} opened by `, who(p.author, 'author')], state,
      p.closes != null ? ['closes ', unitLink(`#${p.closes}`, `${p.run}/issues/${p.closes}`)] : null))
    if (p.why && p.why.text) main.append(whyLine(p.why))
    // a row names who opened and who merged it, so its chips leave out the self-merge flag
