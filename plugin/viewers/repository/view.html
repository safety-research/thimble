<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.chip, .btn, .seg, .field, .avatar), its Color by and Filter by and its side panel come with the
     frame; this page draws a code forge's repository pages in thimble's tokens */
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-card); overflow: hidden; }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }
  #view { height: 100%; display: flex; flex-direction: column; }

  /* the repository's head, as a forge's: its name in the switcher that chooses the run, and the run's facts */
  .repo { position: relative; flex: none; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 10px 16px 2px; color: var(--text-secondary); }
  .repo > .ico { color: var(--text-tertiary); }
  #run { flex: none; display: inline-flex; align-items: center; gap: 4px; }
  .run-name { color: var(--text-primary); font-weight: 600; }
  .repo-facts { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 var(--text-ui-sm) / 1.4 var(--font-body); }
  /* the switcher's list: each run's name, its day and its tabs' counts, the chosen one ticked; it opens down from the
     name, clear of the list's scrollbar */
  .runs { position: absolute; z-index: 5; top: 100%; left: 12px; width: min(340px, calc(100% - 64px)); padding: 4px; border: 1px solid var(--overlay-edge); border-radius: var(--radius-card); background: var(--raised-bg); box-shadow: var(--shadow-popover); }
  .runs[hidden] { display: none; }
  .run-opt { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 0 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--radius-hl); background: none; color: var(--text-secondary); cursor: pointer; text-align: left; }
  .run-opt:hover, .run-opt:focus-visible { background: var(--surface-hover); outline: none; }
  .run-opt b { color: var(--text-primary); font-weight: 600; margin-right: 8px; }
  .run-counts { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .run-counts span { display: inline-flex; align-items: center; gap: 3px; }
  .run-counts .ico { width: 14px; height: 14px; }

  /* the forge's tabs, each with its count, the chosen one underlined */
  .tabs { flex: none; display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border-subtle); overflow: hidden; }
  .tab { display: flex; flex: 0 1 auto; min-width: 0; align-items: center; gap: 7px; padding: 10px 10px 8px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--text-secondary); cursor: pointer; white-space: nowrap; font: 400 var(--text-sm) / 1.2 var(--font-body); }
  .tab-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tab:hover { color: var(--text-primary); }
  .tab.on { border-bottom-color: var(--accent); color: var(--text-primary); font-weight: 500; }
  .count { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: var(--radius-chip); background: rgba(var(--ink-rgb), 0.07); color: var(--text-secondary); text-align: center; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }

  .top { flex: none; display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px 16px 8px; }
  .search { flex: 0 1 170px; min-width: 80px; }
  #filter, #colour { min-width: 0; }
  #body { flex: 1; min-height: 0; border-top: 1px solid var(--border-subtle); }
  #list { overflow: auto; padding: 12px 16px 24px; container-type: inline-size; }

  .ico { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .ico .fill { fill: currentColor; stroke: none; }
  .dim { color: var(--text-tertiary); }
  .mono { font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }

  /* the list: one box, the names of its numbers over its rows, the rows on hairlines */
  .box { margin: 0 0 14px; border: 1px solid var(--border-subtle); border-radius: var(--radius-card); background: var(--surface-card); }
  .box-head, .item { display: grid; grid-template-columns: 22px minmax(0, 1fr) var(--cols); align-items: center; gap: 0 12px; }
  .box-head { padding: 8px 14px 8px 12px; border-bottom: 1px solid var(--border-subtle); border-radius: var(--radius-card) var(--radius-card) 0 0; background: rgba(var(--ink-rgb), 0.03); color: var(--text-secondary); font: 400 var(--text-ui-sm) / 1.3 var(--font-body); }
  .heads { display: contents; }
  .heads span, .num { text-align: right; white-space: nowrap; }
  .item { padding: 9px 14px 9px 12px; border-top: 1px solid var(--border-hairline); cursor: pointer; content-visibility: auto; contain-intrinsic-size: auto 58px; }
  .box-head + .item { border-top: 0; }
  .item:hover { background: var(--surface-hover); }
  .item.active { background: var(--surface-selected); }
  .item:last-child { border-radius: 0 0 var(--radius-card) var(--radius-card); }
  .state { color: var(--text-secondary); align-self: start; padding-top: 2px; }
  .main { min-width: 0; }
  .line1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 var(--text-sm) / 1.4 var(--font-body); }
  .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-tertiary); font: 400 var(--text-ui-sm) / 1.5 var(--font-body); }
  .lead { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text-secondary); }
  .num { display: inline-flex; align-items: center; justify-content: flex-end; gap: 3px; color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .num .ico { width: 14px; height: 14px; }
  .people { display: inline-flex; margin-right: 4px; vertical-align: middle; }
  .people .avatar { width: 18px; height: 18px; margin-right: -4px; font-size: 9px; box-shadow: 0 0 0 1.5px var(--surface-card); }
  .empty { padding: 28px 4px; color: var(--text-tertiary); }
  /* the list's numbers give way to the titles in a narrow list */
  @container (max-width: 560px) { .box-head, .item { grid-template-columns: 22px minmax(0, 1fr); } .heads, .num { display: none; } .box-head { display: none; } }

  /* an item's page in the side panel: its state and facts, the links to its issue or pull requests, then its parts */
  .page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 2px 0 10px; color: var(--text-secondary); }
  .page-head b { color: var(--text-primary); font-weight: 600; }
  .facts { margin: 0 0 12px; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font: 400 var(--text-ui-sm) / 1.5 var(--font-body); }
  .facts dt { color: var(--text-tertiary); }
  .facts dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; min-width: 0; }
  .go { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; color: var(--text-primary); cursor: pointer; text-align: left; }
  .go:hover { text-decoration: underline; }
  .go .ico { width: 14px; height: 14px; color: var(--text-secondary); }
  .parts { margin: 4px 0 12px; }

  /* a conversation: the forge's timeline, each event on a line with its icon and comments in boxes */
  .tl { position: relative; padding: 2px 0 6px; }
  .ev { position: relative; display: flex; align-items: flex-start; gap: 8px; padding: 5px 4px 5px 8px; color: var(--text-secondary); }
  .badge { display: grid; place-items: center; flex: none; width: 16px; height: 18px; background: var(--surface-card); }
  .ev-words { flex: 1; min-width: 0; padding-top: 1px; overflow-wrap: anywhere; }
  .ev-words b { color: var(--text-primary); font-weight: 600; }
  .ev time, .card-head time { flex: none; padding-top: 1px; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .card { position: relative; margin: 6px 0 8px; padding-left: 8px; }
  .card-box { border: 1px solid var(--border-subtle); border-radius: var(--radius-card); background: var(--surface-card); }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border-subtle); border-radius: var(--radius-card) var(--radius-card) 0 0; background: rgba(var(--ink-rgb), 0.03); color: var(--text-secondary); }
  .card-head .said { flex: 1; min-width: 0; }
  .card-head b { color: var(--text-primary); font-weight: 600; }
  .text { padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ev .text { padding: 4px 0 0; color: var(--text-primary); }
  .focus { background: var(--surface-selected); }
  .card.focus { background: none; }
  .card.focus .card-box { background: var(--surface-selected); }
  .ref { padding: 0; border: 0; background: none; color: var(--text-accent); cursor: pointer; }
  .ref:hover { text-decoration: underline; }
  code { font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-secondary); }

  /* commits, and the changed files as the commits' diffs by file, the signs in a gutter */
  .commit { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 0 8px; align-items: start; padding: 7px 8px; border-top: 1px solid var(--border-hairline); }
  .commit:first-child { border-top: 0; }
  .commit b { font-weight: 500; }
  .file { margin: 0 0 12px; border: 1px solid var(--border-subtle); border-radius: var(--radius-card); overflow: hidden; }
  .file-head { display: flex; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--border-subtle); background: rgba(var(--ink-rgb), 0.03); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .file-head span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .hunk { padding: 0 0 4px 6px; }
  .hunk-head { padding: 4px 4px 2px; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  /* a long line wraps in place, so the panel never scrolls sideways */
  .diff { margin: 0; font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); }
  .diff div { display: grid; grid-template-columns: 16px minmax(0, 1fr); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-secondary); }
  .diff div::before { content: attr(data-s); color: var(--text-tertiary); text-align: center; }
  .diff .add { color: var(--text-primary); background: rgba(var(--ink-rgb), 0.05); }
  .diff .del { color: var(--text-tertiary); background: rgba(var(--ink-rgb), 0.025); }

  /* a thread as a social board draws it: the first post, the replies indented under it, each with its author's avatar,
     time and words */
  .post { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 0 10px; padding: 8px; }
  .post:not(.op) { margin-left: 24px; }
  .rail { display: flex; justify-content: center; }
  .rail .avatar { width: 32px; height: 32px; font-size: 13px; }
  .post-head { display: flex; align-items: baseline; gap: 8px; }
  .post-head b { font-weight: 600; }
  .post .text { padding: 2px 0 0; }
  .post.op .text { font-size: var(--text-lg, 15px); line-height: 1.45; }
  .feed .item { align-items: start; }

  /* an agent's profile */
  .who { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
  .who .avatar { width: 44px; height: 44px; font-size: 18px; }
  .who b { display: block; font: 600 var(--text-lg, 15px) / 1.3 var(--font-body); }
  .note { margin: 0 0 12px; padding: 8px 10px; border-left: 3px solid var(--border-strong); color: var(--text-secondary); }
  .did { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 12px; color: var(--text-secondary); }
  .did b { color: var(--text-primary); font-weight: 600; }
</style>
</head>
<body>
<div id="view">
  <header class="repo" id="repo"></header>
  <nav class="tabs" id="tabs" aria-label="Kind of item"></nav>
  <div class="top">
    <input class="field search" id="q" type="search" placeholder="Search" aria-label="Search">
    <span id="filter"></span>
    <span id="colour"></span>
  </div>
  <div id="body"><div id="list"></div></div>
</div>
<script>
// Several agent runs on one library, each run its own repository on a code forge, drawn the way the forge draws one
// repository. Overview: the repository's head, whose switcher chooses the run (one run at a time, the others a click
// away), the forge's tabs with their counts, and the chosen tab's items as the forge lists them: pull requests and
// issues with their states, reviews and comments, threads as a board's feed, agents as people. Zoom and filter: Filter
// by any field or label, Color by's chips the values left on, and the search the items whose words hold it. Details on
// demand: an item opens as its page in the side panel: a pull request's conversation, commits and changed files, an
// issue's timeline, a thread's posts, an agent's profile. Color marks the unit its value belongs to: a field of the
// items colors their rows and the scrollbar beside them, an agent's row under Author by its own name; a label marks
// records, so it colors the records on an item's page, and a row, which stands for its records, shows only their mix,
// as an agent's row does under a field of the items it worked on (state, area).
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const $ = (id) => document.getElementById(id)
const slug = (thimble.view && thimble.view.slug) || 'repository'

// the forge's tabs: what each lists, and the headings of its list's numbers with their widths
const TABS = [
  { tab: 'pulls', name: 'Pull requests', icon: 'pr', heads: ['Reviews', 'Comments', 'Lines'], cols: '76px 72px 84px' },
  { tab: 'issues', name: 'Issues', icon: 'issue', heads: ['Fixed by', 'Comments'], cols: '76px 72px' },
  { tab: 'discussions', name: 'Discussions', icon: 'talk', heads: ['Posts', 'Last post'], cols: '52px 68px' },
  { tab: 'agents', name: 'Agents', icon: 'person', heads: ['Pull requests', 'Reviews', 'Merges', 'Comments'], cols: '92px 62px 58px 72px' },
]
const TAB_OF = { pull: 'pulls', issues: 'issues', discussions: 'discussions', agents: 'agents' } // a key's second part

// line icons in the text colour: a state is a shape, never a colour, which is Color by's
const ICONS = {
  repo: '<path d="M3.5 2.5h8.5v9.5H5a1.5 1.5 0 0 0-1.5 1.5zM3.5 13.5A1.5 1.5 0 0 0 5 15h7v-3"/><path d="M6 5h3.5"/>',
  chev: '<path d="M4.5 6.5L8 10l3.5-3.5"/>',
  check: '<path d="M3.5 8.5l3 3 6-6.5"/>',
  pr: '<circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><path d="M4 5.1v5.8"/><circle cx="12" cy="12.5" r="1.6"/><path d="M12 10.9V6.5a2 2 0 0 0-2-2H7.5M9 3L7.5 4.5 9 6"/>',
  merged: '<circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><path d="M4 5.1v5.8"/><circle cx="12" cy="8" r="1.6"/><path d="M4 5.1c0 2.2 2.3 2.9 6.4 2.9"/>',
  prclosed: '<circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><path d="M4 5.1v5.8"/><circle cx="12" cy="12.5" r="1.6"/><path d="M12 10.9V8.2M10.5 3l3 3M13.5 3l-3 3"/>',
  issue: '<circle cx="8" cy="8" r="6"/><circle class="fill" cx="8" cy="8" r="1.3"/>',
  fixed: '<circle cx="8" cy="8" r="6"/><path d="M5.4 8.2l1.8 1.8 3.4-3.7"/>',
  closed: '<circle cx="8" cy="8" r="6"/><path d="M5.6 5.6l4.8 4.8"/>',
  talk: '<path d="M2.5 3h8v5.5H6l-2.5 2v-2h-1z"/><path d="M12.5 6.5h1V12h-1v2L10 12H6.5"/>',
  person: '<circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.8-2.4 2.7-3.7 5-3.7s4.2 1.3 5 3.7"/>',
  comment: '<path d="M2.5 3h11v7.5H7l-3 2.5v-2.5H2.5z"/>',
  commit: '<circle cx="8" cy="8" r="2.5"/><path d="M1 8h4.5M10.5 8H15"/>',
  approved: '<path d="M3.5 8.5l3 3 6-6.5"/>',
  changes: '<path d="M8 2.5v6M5 5.5h6M5 12.5h6"/>',
  reviewed: '<path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="1.8"/>',
  reopened: '<path d="M12.6 7.2A4.7 4.7 0 1 0 11.4 11"/><path d="M13 3.5v3.7H9.3"/>',
  x: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
  flag: '<path d="M4 14V2.5M4 3h7.5l-1.8 2.8 1.8 2.7H4"/>',
}
const ico = (name) => `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true">${ICONS[name]}</svg>`
// a state's icon and word, by tab
const STATE = {
  pulls: { open: ['pr', 'Open'], merged: ['merged', 'Merged'], closed: ['prclosed', 'Closed'] },
  issues: { open: ['issue', 'Open'], fixed: ['fixed', 'Fixed'], closed: ['closed', 'Closed'] },
}
// a record's icon on a timeline, by its kind; a review's by its verdict, with what its line says
const EVENT = { commit: 'commit', merge: 'merged', close: 'x', reopen: 'reopened', pr: 'pr', issue: 'issue', comment: 'comment', post: 'comment', agent: 'flag' }
const VERDICT = { approved: ['approved', 'approved these changes'], 'changes requested': ['changes', 'requested changes'], commented: ['reviewed', 'reviewed'] }

const hm = (t) => new Date(t * 1000).toISOString().slice(11, 16)
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const day = (t) => { const d = new Date(t * 1000); return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}` }
const tOf = (iso) => Date.parse(iso) / 1000
function took(a, b) {
  const m = Math.round((b - a) / 60)
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}`
}
const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`
const cap = (s) => String(s || '').replace(/^./, (c) => c.toUpperCase())
// an avatar's shade from its name, so people tell apart without a colour
function shade(name) {
  let h = 0
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) | 0
  return (0.08 + (Math.abs(h) % 9) * 0.02).toFixed(2)
}
const avatar = (name) => `<span class="avatar" style="--a:${shade(name)}" title="${esc(name)}" aria-hidden="true">${esc(String(name || '?')[0])}</span>`

let tab = 'pulls'
let run = null // the run whose repository shows, the reader's first until one is chosen
let data = null // the reader's answer for the run's tab (reader.py _view)
let open = null // the item in the side panel: {key, ref (the record a citation opened), part (a pull request's tab)}
let want = null // a place thimble asked for before the items arrived
const units = new Map() // each opened item's page (reader.py _detail)

// the fields Filter by and Color by offer: each says what it is (view.json's records), and `meanings` what the states
// the forge gives mean (reader.py's notes), which the menus and a chip's hover show
const FIELDS = [
  {
    name: 'state', title: 'State', description: 'A pull request open, merged or closed by its records; an issue fixed once a pull request that fixes it merged',
    meanings: {
      open: 'A pull request neither merged nor closed, or an issue no merged pull request fixes yet', merged: 'A pull request merged',
      closed: 'A pull request closed without a merge', fixed: 'An issue that a merged pull request fixes',
    },
  },
  { name: 'area', title: 'Area', description: 'The part of the library: the first label, else the area of the issue it fixes' },
  { name: 'author', title: 'Author', description: 'Who opened the pull request or the issue, or started the thread' },
]
const filter = thimble.filterBy({ mount: '#filter', fields: FIELDS, onChange: load })
const colour = thimble.colorBy({ mount: '#colour', fields: FIELDS, chips: 'filter', onChange: load })
const side = thimble.side({ mount: '#body', width: 0.45, onClose: () => { open = null; draw() } })
// Reset puts back the run the view opens on, as it puts back the chips
const first = () => (data && data.runs.length ? data.runs[0].run : null)
const resetRun = thimble.onReset({
  changed: () => !!data && run !== first(),
  reset: () => { if (run !== first()) choose(first()) },
})

async function load() {
  let got
  try {
    got = await thimble.fetch({ op: 'view', run, tab, colour: colour.query(), filter: filter.query() }, { key: 'view' })
  } catch (e) {
    if (e.name === 'AbortError') return
    throw e
  }
  data = got
  run = got.run
  colour.counts(got.counts)
  filter.counts(got.filtered)
  resetRun.check()
  units.clear()
  if (open && got.items.some((it) => it.key === open.key)) await page(open.key, open.ref, open.part)
  else if (open) side.close()
  draw()
  if (want) go()
}

async function fetchUnit(key) {
  if (!units.has(key)) units.set(key, await thimble.fetch({ op: 'unit', key }))
  return units.get(key)
}

// ------------------------------------------------------------------------------------------------ the repository's head

// the facts a forge shows of a repository: its team, what a merge needs, the day it ran
const facts = (r) => [plural(r.team || 0, 'agent'), `${plural(r.approvals || 1, 'approval')} to merge`, day(r.start)].join(' · ')
const TAB_ICONS = TABS.map((t) => [t.tab, t.icon, t.name.toLowerCase()])

// the head: the switcher with the run's name, the run's facts, and the list of runs the switcher opens, each with its
// day and its tabs' counts
function head() {
  if (!data) return
  const r = data.runs.find((x) => x.run === run) || data.runs[0]
  if (!r) return
  const opened = !!$('runs') && !$('runs').hidden
  $('repo').innerHTML = ico('repo') +
    `<button type="button" class="btn btn-ghost btn-sm" id="run" aria-haspopup="listbox" aria-expanded="${opened}" title="Switch run">` +
    `<span class="run-name">${esc(r.run)}</span>${ico('chev')}</button><span class="repo-facts">${esc(facts(r))}</span>` +
    `<div class="runs" id="runs" role="listbox" aria-label="Runs"${opened ? '' : ' hidden'}>${data.runs.map((x) =>
      `<button type="button" class="run-opt" role="option" aria-selected="${x.run === r.run}" data-run="${esc(x.run)}">` +
      `<span>${x.run === r.run ? ico('check') : ''}</span><span><span><b>${esc(x.run)}</b>${esc(day(x.start))}</span>` +
      `<span class="run-counts">${TAB_ICONS.map(([t, i, w]) => `<span title="${esc(w)}">${ico(i)}${x.tabs[t]}</span>`).join('')}</span></span></button>`).join('')}</div>`
}

function switcher(on) {
  const m = $('runs')
  if (!m) return
  m.hidden = !on
  $('run').setAttribute('aria-expanded', String(on))
  if (on) (m.querySelector('[aria-selected="true"]') || m.querySelector('.run-opt'))?.focus()
}

// another run's repository, on the same tab
async function choose(r) {
  switcher(false)
  if (!r || r === run) return
  run = r
  side.close()
  open = null
  $('list').scrollTop = 0
  await load()
}

// ------------------------------------------------------------------------------------------------ the list

function draw() {
  head()
  $('tabs').innerHTML = TABS.map((t) => `<button type="button" class="tab${t.tab === tab ? ' on' : ''}" data-tab="${t.tab}">${ico(t.icon)}<span class="tab-name">${t.name}</span>` +
    `<span class="count">${data ? data.tabs[t.tab] : ''}</span></button>`).join('')
  if (!data) return
  const q = $('q').value.trim().toLowerCase()
  const shown = data.items.filter((it) => !q || it.search.includes(q))
  const T = TABS.find((t) => t.tab === tab)
  $('list').classList.toggle('feed', tab === 'discussions')
  $('list').innerHTML = shown.length
    ? `<section class="box" style="--cols:${T.cols}"><div class="box-head"><span></span><span></span><span class="heads">${T.heads.map((h) => `<span>${h}</span>`).join('')}</span></div>` +
      shown.map(ROW[tab]).join('') + '</section>'
    : `<div class="empty">No ${T.name.toLowerCase()}</div>`
  // the colored scrollbar only on a list of what is colored: the rows while a field colors them; the kit's plain track
  // while the rows stand for the records a label or a field colors (they show their mix), or Color by is Off
  colour.strip('#list', { whole: !!colour.field && !shown.some((it) => it.mix) })
}

// a row: under a field, the bar of its value; a row that stands for its records (any under a label, which marks
// records, and an agent's under a field it does not carry) none, its records' mix shown in the row (mix) and their own
// bars on its page
const rowOpen = (it) => `<div class="item${open && open.key === it.key ? ' active' : ''}" data-key="${esc(it.key)}" data-anchor="view:${slug}/${esc(it.key)}"` +
  `${colour.label || it.mix ? ' data-anchor-unmarked' : colour.attr(it)}>`
// the records' mix of the values ([[value, n]]) as the kit's proportion bar, where any of them takes a value
const mix = (it) => (it.mix && it.mix.some(([v]) => v != null) ? thimble.mix(it.mix) : '')
// the area as the forge's label, in words: only Color by colors
const areaChip = (it) => (!it.area ? '' : `<span class="chip chip-sans chip-tone-neutral"><span class="chip-text">${esc(it.area)}</span></span>`)
const stateIcon = (t, it) => { const [i, w] = STATE[t][it.state] || STATE[t].open; return `<span class="state" title="${w}">${ico(i)}</span>` }

const ROW = {
  pulls: (it) => {
    const meta = [`#${it.number} opened ${hm(it.opened)} by ${it.author}`, it.closes != null && `fixes #${it.closes}`, cap(it.review),
      it.state === 'merged' && !it.flags.includes('merged by its author') && `merged by ${it.merged_by}`,
      it.state === 'closed' && `closed by ${it.closed_by}${it.reason ? ` as ${it.reason}` : ''}`, ...it.flags].filter(Boolean).join(' · ')
    return rowOpen(it) + stateIcon('pulls', it) +
      `<div class="main"><div class="line1"><span class="title">${esc(it.title)}</span>${mix(it)}${areaChip(it)}</div><div class="meta" title="${esc(meta)}">${esc(meta)}</div></div>` +
      `<span class="num" title="Approvals and change requests, each reviewer's latest">${ico('approved')}${it.approvals}${it.changes ? ` ${ico('changes')}${it.changes}` : ''}</span>` +
      `<span class="num">${ico('comment')}${it.comments}</span><span class="num">+${it.plus} −${it.minus}</span></div>`
  },
  issues: (it) => {
    const meta = [`#${it.number} opened ${hm(it.opened)} by ${it.author}`, it.origin === 'backlog' ? 'from the backlog' : it.origin,
      it.state === 'fixed' && `fixed after ${took(it.opened, it.ended)}`].filter(Boolean).join(' · ')
    return rowOpen(it) + stateIcon('issues', it) +
      `<div class="main"><div class="line1"><span class="title">${esc(it.title)}</span>${mix(it)}${areaChip(it)}</div><div class="meta">${esc(meta)}</div></div>` +
      `<span class="num">${it.prs.length ? `${ico('pr')}${it.prs.map((n) => `#${n}`).join(' ')}` : ''}</span><span class="num">${ico('comment')}${it.comments}</span></div>`
  },
  discussions: (it) => {
    const others = it.posters.filter((p) => p !== it.author)
    return rowOpen(it) + avatar(it.author) +
      `<div class="main"><div class="meta"><b>${esc(it.author)}</b> · ${hm(it.opened)}</div><div class="line1"><span class="title">${esc(it.title)}</span>${mix(it)}</div>` +
      `<div class="lead">${esc(it.lead)}</div>${others.length ? `<div class="meta"><span class="people">${others.map(avatar).join('')}</span> ${esc(others.join(', '))} replied</div>` : ''}</div>` +
      `<span class="num">${ico('comment')}${it.posts}</span><span class="num">${it.last ? hm(it.last) : ''}</span></div>`
  },
  agents: (it) => rowOpen(it) + avatar(it.title) +
    `<div class="main"><div class="line1"><span class="title">${esc(it.title)}</span>${mix(it)}</div><div class="meta">${it.note ? `“${esc(it.note)}”` : 'left no transcript'}</div></div>` +
    ['pull requests', 'reviews', 'merges', 'comments'].map((k) => `<span class="num">${it.did[k] || 0}</span>`).join('') + '</div>',
}

// ------------------------------------------------------------------------------------------------ an item's page

// an item's page in the side panel, with the record `ref` marked and in view; `part` a pull request's tab
async function page(key, ref = null, part = null) {
  const d = await fetchUnit(key)
  if (!d) return
  open = { key, ref, part: part || 'conversation' }
  const f = d.facts
  const t = TAB_OF[key.split('/')[1]]
  const sub = t === 'agents' ? `${f.run} · agent` : t === 'discussions' ? `${f.run} · thread ${f.number}` : `${f.run} #${f.number}`
  side.open({ title: f.title, sub, ref: `view:${slug}/${key}`, html: PAGE[t](d) })
  const el = ref && side.body.querySelector(`[data-anchor="${CSS.escape(ref)}"]`)
  if (el) el.scrollIntoView({ block: 'center' })
}

// a record's words with each #<n> a link to the pull request or issue it names
const linked = (text, d) => esc(text).replace(/#(\d+)\b/g, (m, n) => (d.mentions[n] ? `<button type="button" class="ref" data-go="${esc(d.mentions[n].key)}" title="${esc(d.mentions[n].title)}">${m}</button>` : m))
const words = (r, d) => (r.text ? `<div class="text">${linked(r.text, d)}</div>` : '')
const focus = (r) => (open && r.ref === open.ref ? ' focus' : '')
const goTo = (b, what) => `<button type="button" class="go" data-go="${esc(b.key)}">${ico((STATE[TAB_OF[b.key.split('/')[1]]][b.state] || ['pr'])[0])}${what}</button>`
const badge = (state, t) => { const [i, w] = STATE[t][state] || STATE[t].open; return `<span class="chip chip-sans chip-tone-neutral">${ico(i)}<span class="chip-text">${w}</span></span>` }

// one record on a conversation's timeline: an opening or a comment in a box, any other record on a line
function entry(r, d) {
  const own = d.facts.number
  const at = `<time>${hm(tOf(r.at))}</time>`
  if (r.kind === 'comment' || (['pr', 'issue'].includes(r.kind) && r.number === own)) {
    const what = r.kind === 'comment' ? 'commented' : r.kind === 'pr' ? 'opened this pull request' : 'opened this issue'
    return `<div class="card${focus(r)}" data-anchor="${esc(r.ref)}"><div class="card-box"><div class="card-head">${avatar(r.author)}<span class="said"><b>${esc(r.author)}</b> ${what}</span>${at}</div>` +
      (r.text ? words(r, d) : '<div class="text dim">No description.</div>') + '</div></div>'
  }
  let icon = EVENT[r.kind] || 'comment'
  let said = ''
  if (r.kind === 'commit') said = `${r.forced ? `force-pushed <code>${esc(r.sha)}</code> over <code>${esc(r.before)}</code>` : `pushed <code>${esc(r.sha)}</code>`} ${esc((r.text || '').split('\n')[0])}`
  else if (r.kind === 'review') [icon, said] = VERDICT[r.verdict] || VERDICT.commented
  else if (r.kind === 'merge') said = r.number === own ? 'merged this' : `merged ${linked(`#${r.number}`, d)}, which fixed this`
  else if (r.kind === 'close') said = `closed this${r.reason ? ` as ${esc(r.reason)}` : ''}`
  else if (r.kind === 'reopen') said = 'reopened this'
  else if (r.kind === 'pr') said = `opened ${linked(`#${r.number}`, d)} ${esc(r.title || '')}, which fixes this`
  const body = r.kind !== 'commit' && r.kind !== 'pr' && r.text ? `<div class="text">${linked(r.text, d)}</div>` : ''
  return `<div class="ev${focus(r)}" data-anchor="${esc(r.ref)}"><span class="badge">${ico(icon)}</span><div class="ev-words"><b>${esc(r.author)}</b> ${said}${body}</div>${at}</div>`
}

// the same issue in the other runs, each a link to it
const elsewhere = (d) => (d.elsewhere || []).filter((x) => x.run !== d.facts.run).map((x) => goTo(x, `${esc(x.run)} #${esc(x.key.split('/')[2])} ${esc(x.state)}`)).join('')
const dl = (rows) => `<dl class="facts">${rows.filter((r) => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`

const PAGE = {
  pulls: (d) => {
    const f = d.facts
    const commits = d.records.filter((r) => r.kind === 'commit')
    const files = changed(commits)
    const end = f.state === 'merged' ? `${esc(f.merged_by)} merged it at ${hm(f.ended)}, ${took(f.opened, f.ended)} after it opened`
      : f.state === 'closed' ? `${esc(f.closed_by)} closed it at ${hm(f.ended)}${f.reason ? ` as ${esc(f.reason)}` : ''}` : 'still open'
    const head = `<div class="page-head">${badge(f.state, 'pulls')}<span><b>${esc(f.author)}</b> opened it at ${hm(f.opened)} · ${end}</span></div>` +
      dl([['Fixes', d.fixes && goTo(d.fixes, `#${d.fixes.number} ${esc(d.fixes.title)}`)], ['In the other runs', elsewhere(d)],
        ['Reviews', `${esc(cap(f.review))} · ${f.approvals} of ${plural(f.need, 'approval')}${f.reviewers.length ? ` · ${f.reviewers.map(([w, v]) => `${esc(w)} ${esc((VERDICT[v] || VERDICT.commented)[1].replace(' these changes', ''))}`).join(', ')}` : ''}`],
        ['Flags', f.flags.map(esc).join(' · ')]])
    const parts = [['conversation', 'Conversation', d.records.length], ['commits', 'Commits', commits.length], ['files', 'Files changed', files.length]]
    const seg = `<div class="seg parts">${parts.map(([k, w, n]) => `<button type="button" class="seg-opt${open.part === k ? ' active' : ''}" data-part="${k}">${w} <span class="count">${n}</span></button>`).join('')}</div>`
    const body = open.part === 'commits' ? `<div class="card-box">${commits.map(commitRow).join('') || '<div class="text dim">No commits.</div>'}</div>`
      : open.part === 'files' ? files.map(fileBox).join('') || '<div class="dim">No changes.</div>'
      : `<div class="tl">${d.records.map((r) => entry(r, d)).join('')}</div>`
    return head + seg + body
  },
  issues: (d) => {
    const f = d.facts
    const end = f.state === 'fixed' ? `fixed at ${hm(f.ended)}, ${took(f.opened, f.ended)} after it opened` : f.state === 'closed' ? `closed at ${hm(f.ended)}` : 'still open'
    return `<div class="page-head">${badge(f.state, 'issues')}<span><b>${esc(f.author)}</b> opened it at ${hm(f.opened)} · ${f.origin === 'backlog' ? 'from the backlog' : esc(f.origin)} · ${end}</span></div>` +
      dl([['Pull requests', (d.prs || []).map((p) => goTo(p, `#${p.number} ${esc(p.title)}`)).join('')], ['In the other runs', elsewhere(d)]]) +
      `<div class="tl">${d.records.map((r) => entry(r, d)).join('')}</div>`
  },
  discussions: (d) => {
    const f = d.facts
    return `<div class="page-head"><span>${plural(f.posts, 'post')} · ${plural(f.posters.length, 'person', 'people')} · ${hm(f.opened)}–${hm(f.last)}</span></div>` +
      d.records.map((r, i) => `<div class="post${i ? '' : ' op'}${focus(r)}" data-anchor="${esc(r.ref)}"><div class="rail">${avatar(r.author)}</div>` +
        `<div><div class="post-head"><b>${esc(r.author)}</b><span class="dim mono">${hm(tOf(r.at))}</span></div>${words(r, d)}</div></div>`).join('')
  },
  agents: (d) => {
    const f = d.facts
    const note = d.records.find((r) => r.kind === 'agent')
    const did = Object.entries(f.did).map(([k, n]) => `<span><b>${n}</b> ${k}</span>`).join('')
    return `<div class="who">${avatar(f.title)}<div><b>${esc(f.title)}</b><span class="dim">${esc(f.run)}</span></div></div>` +
      (note ? `<div class="note${focus(note)}" data-anchor="${esc(note.ref)}">“${linked(note.text, d)}”</div>` : '') +
      `<div class="did">${did}</div><div class="tl">${d.records.filter((r) => r.kind !== 'agent').map((r) => activity(r, d)).join('')}</div>`
  },
}

// an agent's record in its activity: what it did, to which item, and its words
function activity(r, d) {
  const [icon, said] = r.kind === 'review' ? VERDICT[r.verdict] || VERDICT.commented : [EVENT[r.kind] || 'comment', '']
  const what = r.kind === 'review' ? said.replace(' these changes', '') : r.kind === 'commit' ? `pushed <code>${esc(r.sha)}</code> to` : r.kind === 'post' ? 'posted in a thread' : esc(r.action)
  const on = r.number != null ? ` ${linked(`#${r.number}`, d)}` : ''
  const text = r.kind === 'commit' ? (r.text || '').split('\n')[0] : r.title || r.text || ''
  return `<div class="ev${focus(r)}" data-anchor="${esc(r.ref)}"><span class="badge">${ico(icon)}</span><div class="ev-words"><b>${what}</b>${on}` +
    `${text ? `<div class="text">${linked(text, d)}</div>` : ''}</div><time>${hm(tOf(r.at))}</time></div>`
}

const commitRow = (r) => `<div class="commit${focus(r)}" data-anchor="${esc(r.ref)}">${ico('commit')}<div><b>${esc((r.text || '').split('\n')[0])}</b>` +
  `<div class="meta">${esc(r.author)} ${r.forced ? `force-pushed over ${esc(r.before)}` : 'committed'} ${hm(tOf(r.at))}</div></div><code>${esc(r.sha || '')}</code></div>`

// the commits' diffs by the file they change, each hunk under its commit: [{path, plus, minus, hunks: [{ref, sha,
// head, lines}]}]
function changed(commits) {
  const files = new Map()
  for (const c of commits) {
    let file = null
    let hunk = null
    for (const line of String(c.diff || '').replace(/\n$/, '').split('\n')) {
      if (line.startsWith('--- ')) continue
      if (line.startsWith('+++ ')) {
        const path = line.slice(4).replace(/^b\//, '')
        file = files.get(path) || { path, plus: 0, minus: 0, hunks: [] }
        files.set(path, file)
        hunk = null
      } else if (file && line.startsWith('@@')) {
        hunk = { ref: c.ref, sha: c.sha, head: line, lines: [] }
        file.hunks.push(hunk)
      } else if (hunk) {
        hunk.lines.push(line)
        if (line[0] === '+') file.plus++
        else if (line[0] === '-') file.minus++
      }
    }
  }
  return [...files.values()]
}
const fileBox = (f) => `<div class="file"><div class="file-head"><span>${esc(f.path)}</span><span class="dim">+${f.plus} −${f.minus}</span></div>` +
  f.hunks.map((h) => `<div class="hunk${open && h.ref === open.ref ? ' focus' : ''}" data-anchor="${esc(h.ref)}"><div class="hunk-head">${esc(h.sha || '')} ${esc(h.head)}</div><div class="diff">` +
    h.lines.map((l) => `<div class="${l[0] === '+' ? 'add' : l[0] === '-' ? 'del' : ''}" data-s="${l[0] === '+' || l[0] === '-' ? l[0] : ''}">${esc(l.slice(1)) || ' '}</div>`).join('') + '</div></div>').join('') + '</div>'

// ------------------------------------------------------------------------------------------------ places and clicks

// open an item's page, on its tab, with the record `ref` marked: a citation, a link and another run's issue come here
async function show(key, ref = null) {
  const t = TAB_OF[key.split('/')[1]]
  if (!t) return
  const r = key.split('/')[0]
  if (t !== tab || r !== run) {
    tab = t
    run = r
    side.close()
    open = null
    await load()
  }
  const it = data && data.items.find((i) => i.key === key)
  if (it && !it.search.includes($('q').value.trim().toLowerCase())) $('q').value = ''
  await page(key, ref)
  draw()
  document.querySelector(`#list [data-key="${CSS.escape(key)}"]`)?.scrollIntoView({ block: 'nearest' })
}

// a run's citation opens its repository; any other opens its item
function go() {
  const t = want
  want = null
  if (t.run && data.runs.some((r) => r.run === t.run)) choose(t.run)
  else if (t.key) show(t.key, t.ref)
}

$('repo').addEventListener('click', (e) => {
  if (e.metaKey || e.ctrlKey) return
  const opt = e.target.closest('[data-run]')
  if (opt) return choose(opt.dataset.run)
  if (e.target.closest('#run')) switcher($('runs').hidden)
})
$('repo').addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('runs').hidden) {
    switcher(false)
    $('run').focus()
  } else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !$('runs').hidden) {
    const opts = [...$('runs').querySelectorAll('.run-opt')]
    const i = opts.indexOf(document.activeElement)
    opts[(i + (e.key === 'ArrowDown' ? 1 : opts.length - 1)) % opts.length]?.focus()
    e.preventDefault()
  }
})
// a click anywhere else closes the switcher's list
document.addEventListener('pointerdown', (e) => {
  if ($('runs') && !$('runs').hidden && !e.target.closest('#repo')) switcher(false)
})

$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]')
  if (!b || b.dataset.tab === tab) return
  tab = b.dataset.tab
  side.close()
  open = null
  load()
})
$('q').addEventListener('input', draw)
$('body').addEventListener('click', async (e) => {
  if (e.metaKey || e.ctrlKey) return // a ⌘-click asks about the element
  const link = e.target.closest('[data-go]')
  if (link) return show(link.dataset.go)
  const part = e.target.closest('[data-part]')
  if (part && open) return page(open.key, null, part.dataset.part)
  const row = e.target.closest('#list .item')
  if (!row) return
  if (open && open.key === row.dataset.key) side.close()
  else await page(row.dataset.key)
  draw()
})
thimble.onLabels(() => load())
// a label's values arrive while it runs, which the counts and the list follow while a label colors or filters
let later = null
thimble.onMarks(() => {
  if (!colour.label && !filter.label) return
  clearTimeout(later)
  later = setTimeout(load, 300)
})
thimble.onOpen((place) => {
  want = place.target || null
  if (want && data) go()
})
draw()
load()
</script>
</body>
</html>
