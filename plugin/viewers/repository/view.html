<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.chip, .btn, .seg, .avatar), its search, Filter by, Color by, table, side panel, messages, diff and
     text come with the frame; this page lays out a code forge's repository pages in thimble's tokens */
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-card); overflow: hidden; }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }
  #view { height: 100%; display: flex; flex-direction: column; }

  /* the repository's head, as a forge's: its name in the switcher that chooses the run, and the run's facts */
  .repo { position: relative; flex: none; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 10px 16px 2px; color: var(--text-secondary); }
  .repo > .ico { color: var(--text-tertiary); }
  #run { flex: none; display: inline-flex; align-items: center; gap: 4px; }
  .run-name { color: var(--text-primary); font-weight: 600; }
  .repo-facts { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 var(--text-ui-sm) / 1.4 var(--font-body); }
  /* the switcher's list: each run's name, its day and its tabs' counts, the chosen one ticked; it opens down from the
     name, clear of the list's scrollbar */
  .runs { position: absolute; z-index: 5; top: 100%; left: 12px; width: min(340px, calc(100% - 64px)); padding: 4px; border: 1px solid var(--overlay-edge); border-radius: var(--radius-card); background: var(--raised-bg); box-shadow: var(--shadow-popover); }
  .runs[hidden] { display: none; }
  .run-opt { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 0 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--radius-hl); background: none; color: var(--text-secondary); cursor: pointer; text-align: left; }
  .run-opt:hover, .run-opt:focus-visible { background: var(--surface-hover); outline: none; }
  .run-opt b { color: var(--text-primary); font-weight: 600; margin-right: 8px; }
  .run-counts { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .run-counts span { display: inline-flex; align-items: center; gap: 3px; }
  .run-counts .ico { width: 14px; height: 14px; }

  /* the forge's tabs, each with its count, the chosen one underlined */
  .tabs { flex: none; display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border-subtle); overflow: hidden; }
  .tab { display: flex; flex: 0 1 auto; min-width: 0; align-items: center; gap: 7px; padding: 10px 10px 8px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--text-secondary); cursor: pointer; white-space: nowrap; font: 400 var(--text-sm) / 1.2 var(--font-body); }
  .tab-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tab:hover { color: var(--text-primary); }
  .tab.on { border-bottom-color: var(--accent); color: var(--text-primary); font-weight: 500; }
  .count { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: var(--radius-chip); background: rgba(var(--ink-rgb), 0.07); color: var(--text-secondary); text-align: center; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }

  .top { flex: none; display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px 16px 8px; }
  #search { flex: 0 1 260px; min-width: 200px; }
  #filter, #colour { min-width: 0; }
  #body { flex: 1; min-height: 0; border-top: 1px solid var(--border-subtle); }
  #list { flex: 1; min-width: 0; }

  .ico { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
  .ico .fill { fill: currentColor; stroke: none; }
  .dim { color: var(--text-tertiary); }

  /* a row's cells: the state's icon or the author's avatar; the title in the forge's weight, cut before the records' mix
     and the area, a label as the forge's, in words; the counts with their icons; who replied, their avatars overlapping */
  .state { color: var(--text-secondary); }
  .line1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .line1 .chip, .line1 .thimble-mix { flex: none; }
  .num .ico { width: 13px; height: 13px; margin-right: 2px; }
  .people { display: inline-flex; margin-right: 6px; vertical-align: middle; }
  .people .avatar { width: 18px; height: 18px; margin-right: -4px; font-size: 9px; box-shadow: 0 0 0 1.5px var(--surface-card); }

  /* an item's page in the side panel: its state and facts, the links to its issue or pull requests, then its parts */
  .page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 2px 0 10px; color: var(--text-secondary); }
  .page-head b { color: var(--text-primary); font-weight: 600; }
  .facts { margin: 0 0 12px; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font: 400 var(--text-ui-sm) / 1.5 var(--font-body); }
  .facts dt { color: var(--text-tertiary); }
  .facts dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; min-width: 0; }
  .go { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; color: var(--text-primary); cursor: pointer; text-align: left; }
  .go:hover { text-decoration: underline; }
  .go .ico { width: 14px; height: 14px; color: var(--text-secondary); }
  .parts { flex-wrap: wrap; margin: 4px 0 12px; }
  /* the changed files: each commit's patch under its sha and message */
  .change { margin: 0 0 16px; }
  .change-head { display: flex; gap: 8px; align-items: baseline; margin: 0 0 6px; color: var(--text-secondary); }
  .change-head code { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }

  /* an agent's profile */
  .who { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
  .who .avatar { width: 44px; height: 44px; font-size: 18px; }
  .who b { display: block; font: 600 var(--text-lg, 15px) / 1.3 var(--font-body); }
  .note { margin: 0 0 12px; color: var(--text-secondary); }
  .did { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 12px; color: var(--text-secondary); }
  .did b { color: var(--text-primary); font-weight: 600; }
</style>
</head>
<body>
<div id="view">
  <header class="repo" id="repo"></header>
  <nav class="tabs" id="tabs" aria-label="Kind of item"></nav>
  <div class="top">
    <span id="search"></span>
    <span id="filter"></span>
    <span id="colour"></span>
  </div>
  <div id="body"><div id="list"></div></div>
</div>
<script>
// Several agent runs on one library, each run its own repository on a code forge, drawn the way the forge draws one
// repository. Overview: the repository's head, whose switcher chooses the run (one run at a time, the others a click
// away), the forge's tabs with their counts, and the chosen tab's items in a table with the forge's columns: pull
// requests and issues with their states, reviews and comments, threads with their posts, agents with what they did.
// Zoom and filter: Filter by any field or label, the search the items whose words hold it, and a click on a column's
// head sorts; Color by's chips only color. Details on demand: an item opens as its page in the side panel: a pull
// request's conversation, commits and changed files, an issue's timeline, a thread's posts, an agent's profile. Color
// marks the unit its value belongs to: a field of the items colors their rows and the scrollbar beside them, an agent's
// row under Author by its own name; a label marks records, so it colors the records on an item's page, and a row, which
// stands for its records, shows only their mix, as an agent's row does under a field of the items it worked on (state,
// area).
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const $ = (id) => document.getElementById(id)
const slug = (thimble.view && thimble.view.slug) || 'repository'
const unit = (key) => `view:${slug}/${key}` // an item's ref, its row's data-anchor

// the forge's tabs and what each lists
const TABS = [
  { tab: 'pulls', name: 'Pull requests', icon: 'pr' },
  { tab: 'issues', name: 'Issues', icon: 'issue' },
  { tab: 'discussions', name: 'Discussions', icon: 'talk' },
  { tab: 'agents', name: 'Agents', icon: 'person' },
]
const TAB_OF = { pull: 'pulls', issues: 'issues', discussions: 'discussions', agents: 'agents' } // a key's second part

// line icons in the text colour: a state is a shape, never a colour, which is Color by's
const ICONS = {
  repo: '<path d="M3.5 2.5h8.5v9.5H5a1.5 1.5 0 0 0-1.5 1.5zM3.5 13.5A1.5 1.5 0 0 0 5 15h7v-3"/><path d="M6 5h3.5"/>',
  chev: '<path d="M4.5 6.5L8 10l3.5-3.5"/>',
  check: '<path d="M3.5 8.5l3 3 6-6.5"/>',
  pr: '<circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><path d="M4 5.1v5.8"/><circle cx="12" cy="12.5" r="1.6"/><path d="M12 10.9V6.5a2 2 0 0 0-2-2H7.5M9 3L7.5 4.5 9 6"/>',
  merged: '<circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><path d="M4 5.1v5.8"/><circle cx="12" cy="8" r="1.6"/><path d="M4 5.1c0 2.2 2.3 2.9 6.4 2.9"/>',
  prclosed: '<circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><path d="M4 5.1v5.8"/><circle cx="12" cy="12.5" r="1.6"/><path d="M12 10.9V8.2M10.5 3l3 3M13.5 3l-3 3"/>',
  issue: '<circle cx="8" cy="8" r="6"/><circle class="fill" cx="8" cy="8" r="1.3"/>',
  fixed: '<circle cx="8" cy="8" r="6"/><path d="M5.4 8.2l1.8 1.8 3.4-3.7"/>',
  closed: '<circle cx="8" cy="8" r="6"/><path d="M5.6 5.6l4.8 4.8"/>',
  talk: '<path d="M2.5 3h8v5.5H6l-2.5 2v-2h-1z"/><path d="M12.5 6.5h1V12h-1v2L10 12H6.5"/>',
  person: '<circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.8-2.4 2.7-3.7 5-3.7s4.2 1.3 5 3.7"/>',
  comment: '<path d="M2.5 3h11v7.5H7l-3 2.5v-2.5H2.5z"/>',
  approved: '<path d="M3.5 8.5l3 3 6-6.5"/>',
  changes: '<path d="M8 2.5v6M5 5.5h6M5 12.5h6"/>',
}
const ico = (name) => `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true">${ICONS[name]}</svg>`
// a state's icon and word, by tab
const STATE = {
  pulls: { open: ['pr', 'Open'], merged: ['merged', 'Merged'], closed: ['prclosed', 'Closed'] },
  issues: { open: ['issue', 'Open'], fixed: ['fixed', 'Fixed'], closed: ['closed', 'Closed'] },
}
// a review's icon on a timeline (thimble.messages' own), and what its line says
const VERDICT = { approved: ['approve', 'approved these changes'], 'changes requested': ['changes', 'requested changes'], commented: ['comment', 'reviewed'] }

const hm = (t) => new Date(t * 1000).toISOString().slice(11, 16)
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const day = (t) => { const d = new Date(t * 1000); return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}` }
const tOf = (iso) => Date.parse(iso) / 1000
function took(a, b) {
  const m = Math.round((b - a) / 60)
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}`
}
const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`
const cap = (s) => String(s || '').replace(/^./, (c) => c.toUpperCase())
const firstLine = (s) => String(s || '').split('\n')[0]
// an avatar's shade from its name, so people tell apart without a colour
function shade(name) {
  let h = 0
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) | 0
  return (0.08 + (Math.abs(h) % 9) * 0.02).toFixed(2)
}
const avatar = (name) => `<span class="avatar" style="--a:${shade(name)}" title="${esc(name)}" aria-hidden="true">${esc(String(name || '?')[0])}</span>`

let tab = 'pulls'
let run = null // the run whose repository shows, the reader's first until one is chosen
let data = null // the reader's answer for the run's tab (reader.py _view)
let shown = [] // the tab's items the search keeps
let open = null // the item in the side panel: {key, ref (the record a citation opened), part (a pull request's tab)}
let want = null // a place thimble asked for before the items arrived
const units = new Map() // each opened item's page (reader.py _detail)

// the fields Filter by and Color by offer: each says what it is (view.json's records), and `meanings` what the states
// the forge gives mean (reader.py's notes), which the menus and a chip's hover show
const FIELDS = [
  {
    name: 'state', title: 'State', description: 'A pull request open, merged or closed by its records; an issue fixed once a pull request that fixes it merged',
    meanings: {
      open: 'A pull request neither merged nor closed, or an issue no merged pull request fixes yet', merged: 'A pull request merged',
      closed: 'A pull request closed without a merge', fixed: 'An issue that a merged pull request fixes',
    },
  },
  { name: 'area', title: 'Area', description: 'The part of the library: the first label, else the area of the issue it fixes' },
  { name: 'author', title: 'Author', description: 'Who opened the pull request or the issue, or started the thread' },
]
// the search keeps the items whose words hold it, their records' words among them, and marks the words in the rows
const search = thimble.search({ mount: '#search', placeholder: 'Search', onChange: draw })
const filter = thimble.filterBy({ mount: '#filter', fields: FIELDS, onChange: load })
const colour = thimble.colorBy({ mount: '#colour', fields: FIELDS, onChange: load })
const side = thimble.side({ mount: '#body', width: 0.45, onClose: () => { open = null } })
// Reset puts back the run the view opens on, as it puts back the chips and empties the search, and the page draws again
// with what they keep
const first = () => (data && data.runs.length ? data.runs[0].run : null)
const resetRun = thimble.onReset({
  changed: () => !!data && run !== first(),
  reset: () => (run !== first() ? choose(first()) : load()),
})

async function load() {
  let got
  try {
    got = await thimble.fetch({ op: 'view', run, tab, colour: colour.query(), filter: filter.query() }, { key: 'view' })
  } catch (e) {
    if (e.name === 'AbortError') return
    throw e
  }
  data = got
  run = got.run
  for (const it of got.items) it.ref = unit(it.key)
  colour.counts(got.counts)
  filter.counts(got.filtered)
  resetRun.check()
  units.clear()
  draw()
  // the page open is drawn again with the records the filters keep now, or closes with its item
  if (open && got.items.some((it) => it.key === open.key)) fill(side.body, open.key)
  else if (open) side.close()
  if (want) go()
}

async function fetchUnit(key) {
  if (!units.has(key)) units.set(key, await thimble.fetch({ op: 'unit', key }))
  return units.get(key)
}

// ------------------------------------------------------------------------------------------------ the repository's head

// the facts a forge shows of a repository: its team, what a merge needs, the day it ran
const facts = (r) => [plural(r.team || 0, 'agent'), `${plural(r.approvals || 1, 'approval')} to merge`, day(r.start)].join(' · ')
const TAB_ICONS = TABS.map((t) => [t.tab, t.icon, t.name.toLowerCase()])

// the head: the switcher with the run's name, the run's facts, and the list of runs the switcher opens, each with its
// day and its tabs' counts
function head() {
  if (!data) return
  const r = data.runs.find((x) => x.run === run) || data.runs[0]
  if (!r) return
  const opened = !!$('runs') && !$('runs').hidden
  $('repo').innerHTML = ico('repo') +
    `<button type="button" class="btn btn-ghost btn-sm" id="run" aria-haspopup="listbox" aria-expanded="${opened}" title="Switch run">` +
    `<span class="run-name">${esc(r.run)}</span>${ico('chev')}</button><span class="repo-facts">${esc(facts(r))}</span>` +
    `<div class="runs" id="runs" role="listbox" aria-label="Runs"${opened ? '' : ' hidden'}>${data.runs.map((x) =>
      `<button type="button" class="run-opt" role="option" aria-selected="${x.run === r.run}" data-run="${esc(x.run)}">` +
      `<span>${x.run === r.run ? ico('check') : ''}</span><span><span><b>${esc(x.run)}</b>${esc(day(x.start))}</span>` +
      `<span class="run-counts">${TAB_ICONS.map(([t, i, w]) => `<span title="${esc(w)}">${ico(i)}${x.tabs[t]}</span>`).join('')}</span></span></button>`).join('')}</div>`
}

function switcher(on) {
  const m = $('runs')
  if (!m) return
  m.hidden = !on
  $('run').setAttribute('aria-expanded', String(on))
  if (on) (m.querySelector('[aria-selected="true"]') || m.querySelector('.run-opt'))?.focus()
}

// another run's repository, on the same tab
async function choose(r) {
  switcher(false)
  if (!r || r === run) return
  run = r
  side.close()
  $('list').scrollTop = 0
  await load()
}

// ------------------------------------------------------------------------------------------------ the list

// the records' mix of the values ([[value, n]]) as the kit's proportion bar, where any of them takes a value
const mix = (it) => (it.mix && it.mix.some(([v]) => v != null) ? thimble.mix(it.mix) : '')
// the area as the forge's label, in words: only Color by colors
const areaChip = (it) => (!it.area ? '' : `<span class="chip chip-sans chip-tone-neutral"><span class="chip-text">${esc(it.area)}</span></span>`)
const stateIcon = (t, it) => { const [i, w] = STATE[t][it.state] || STATE[t].open; return `<span class="state" title="${w}">${ico(i)}</span>` }
// a row's first line: the title in the forge's weight, cut first, then the records' mix and the area
const titleLine = (it) => `<span class="line1"><span class="title">${esc(it.title)}</span>${mix(it)}${areaChip(it)}</span>`
// a row's second line, what the forge writes under the title: its facts joined by ·, whole on hover
const metaLine = (parts) => { const s = parts.filter(Boolean).join(' · '); return { html: `<span title="${esc(s)}">${esc(s)}</span>` } }
const counted = (icon, n) => `<span class="num">${ico(icon)}${n}</span>`
const changes = (it) => it.reviewers.filter(([, v]) => v === 'changes requested').length
// the state's icon, or the author's avatar, in a narrow column of its own at the row's left
const stateCol = (t) => ({ name: 'state', title: '', width: 32, drop: false, html: (it) => stateIcon(t, it) })
const avatarCol = (name) => ({ name, title: '', width: 40, drop: false, html: (it) => avatar(it[name]) })

// each tab's columns, as the forge lists its items: the title over a line of its facts, then its numbers
const COLUMNS = {
  pulls: [
    stateCol('pulls'),
    {
      name: 'title', title: 'Pull request', html: titleLine,
      sub: (it) => metaLine([`#${it.number} opened ${hm(it.opened)} by ${it.author}`, it.closes != null && `fixes #${it.closes}`, cap(it.review),
        it.state === 'merged' && !it.flags.includes('merged by its author') && `merged by ${it.merged_by}`,
        it.state === 'closed' && `closed by ${it.closed_by}${it.reason ? ` as ${it.reason}` : ''}`, ...it.flags]),
    },
    { name: 'approvals', title: 'Reviews', type: 'number', html: (it) => counted('approved', it.approvals) + (changes(it) ? ' ' + counted('changes', changes(it)) : '') },
    { name: 'comments', title: 'Comments', type: 'number', html: (it) => counted('comment', it.comments) },
    { name: 'lines', title: 'Lines', type: 'number', value: (it) => it.plus + it.minus, html: (it) => `+${it.plus} −${it.minus}` },
  ],
  issues: [
    stateCol('issues'),
    {
      name: 'title', title: 'Issue', html: titleLine,
      sub: (it) => metaLine([`#${it.number} opened ${hm(it.opened)} by ${it.author}`, it.origin === 'backlog' ? 'from the backlog' : it.origin,
        it.state === 'fixed' && `fixed after ${took(it.opened, it.ended)}`]),
    },
    { name: 'prs', title: 'Fixed by', type: 'number', width: 96, value: (it) => it.prs[0] ?? null, html: (it) => (it.prs.length ? `<span class="num">${ico('pr')}${it.prs.map((n) => `#${n}`).join(' ')}</span>` : '') },
    { name: 'comments', title: 'Comments', type: 'number', html: (it) => counted('comment', it.comments) },
  ],
  discussions: [
    avatarCol('author'),
    { name: 'title', title: 'Thread', html: titleLine, sub: (it) => `${it.author} · ${hm(it.opened)} · ${it.lead}` },
    { name: 'replied', title: 'Replied', width: 150, drop: 1, value: (it) => it.posters.filter((p) => p !== it.author).join(', '),
      html: (it) => { const others = it.posters.filter((p) => p !== it.author); return `<span class="people">${others.map(avatar).join('')}</span>${esc(others.join(', '))}` } },
    { name: 'posts', title: 'Posts', type: 'number', html: (it) => counted('comment', it.posts) },
    { name: 'last', title: 'Last post', type: 'time', html: (it) => (it.last ? hm(it.last) : '') },
  ],
  agents: [
    avatarCol('title'),
    { name: 'title', title: 'Agent', html: titleLine, sub: (it) => (it.note ? `“${it.note}”` : 'left no transcript') },
    ...['pull requests', 'reviews', 'merges', 'comments'].map((k) => ({ name: k, title: cap(k), type: 'number', value: (it) => it.did[k] || 0 })),
  ],
}

// The table of the tab's items: a row is an item, its ref the item's unit; under a field, its value's bar. A row that
// stands for its records (every row under a label, which marks records, and an agent's under a field it does not carry)
// takes none and no colour on the strip: its records' mix shows in the row (mix) and their own bars on its page. Made
// again when the tab changes or its rows come to stand for their records
let table = null
let tableFor = ''
function list() {
  const plain = !!colour.label || shown.some((it) => it.mix)
  if (table && tableFor === tab + plain) return table.draw(shown)
  tableFor = tab + plain
  table = thimble.table({
    mount: '#list', key: tab, columns: COLUMNS[tab], rows: shown, search, side,
    colour: plain ? false : undefined,
    attrs: (it) => (colour.label || it.mix ? { 'data-anchor-unmarked': true } : null),
    details: (it) => {
      if (!open || open.key !== it.key) open = { key: it.key, ref: null, part: 'conversation' }
      return { title: it.title, sub: subOf(it), render: (body) => fill(body, it.key) }
    },
  })
}

function draw() {
  head()
  $('tabs').innerHTML = TABS.map((t) => `<button type="button" class="tab${t.tab === tab ? ' on' : ''}" data-tab="${t.tab}">${ico(t.icon)}<span class="tab-name">${t.name}</span>` +
    `<span class="count">${data ? data.tabs[t.tab] : ''}</span></button>`).join('')
  if (!data) return
  shown = data.items.filter((it) => search.has(it.search))
  list()
}

// ------------------------------------------------------------------------------------------------ an item's page

const subOf = (it) => {
  const t = TAB_OF[it.key.split('/')[1]]
  return t === 'agents' ? `${it.run} · agent` : t === 'discussions' ? `${it.run} · thread ${it.number}` : `${it.run} #${it.number}`
}
// every #<n> its records name opens that pull request or issue
const mentionsOf = (d) => [{ match: /#(\d+)\b/g, ref: (m) => (d.mentions[m[1]] ? unit(d.mentions[m[1]].key) : null) }]
const goTo = (b, what) => `<button type="button" class="go" data-go="${esc(b.key)}">${ico((STATE[TAB_OF[b.key.split('/')[1]]][b.state] || ['pr'])[0])}${what}</button>`
const badge = (state, t) => { const [i, w] = STATE[t][state] || STATE[t].open; return `<span class="chip chip-sans chip-tone-neutral">${ico(i)}<span class="chip-text">${w}</span></span>` }
const elsewhere = (d) => (d.elsewhere || []).filter((x) => x.run !== d.facts.run).map((x) => goTo(x, `${esc(x.run)} #${esc(x.key.split('/')[2])} ${esc(x.state)}`)).join('')
const dl = (rows) => `<dl class="facts">${rows.filter((r) => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`

// One record on a conversation's timeline as thimble.messages takes it: an opening or a comment a message, any other
// record an event on one line, its words under it
function message(r, d) {
  const own = d.facts.number
  const base = { ref: r.ref, t: tOf(r.at), author: r.author }
  if (r.kind === 'comment' || r.kind === 'post' || (['pr', 'issue'].includes(r.kind) && r.number === own)) return { ...base, text: r.text || '' }
  const ev = { ...base, kind: 'event', text: r.text || '' }
  if (r.kind === 'commit') {
    const what = r.forced ? `force-pushed <code>${esc(r.sha)}</code> over <code>${esc(r.before)}</code>` : `pushed <code>${esc(r.sha)}</code>`
    return { ...ev, icon: 'commit', said: { html: `${what} ${esc(firstLine(r.text))}` }, text: '' }
  }
  if (r.kind === 'review') { const [icon, said] = VERDICT[r.verdict] || VERDICT.commented; return { ...ev, icon, said } }
  if (r.kind === 'merge') return r.number === own ? { ...ev, icon: 'merge', said: 'merged this' } : { ...ev, icon: 'merge', said: 'merged', text: `#${r.number}, which fixed this` }
  if (r.kind === 'close') return { ...ev, icon: 'close', said: `closed this${r.reason ? ` as ${r.reason}` : ''}` }
  if (r.kind === 'reopen') return { ...ev, icon: 'reopen', said: 'reopened this' }
  if (r.kind === 'pr') return { ...ev, icon: 'pull', said: 'opened', text: `#${r.number} ${r.title || ''}, which fixes this` }
  return { ...ev, icon: 'comment', said: r.action || r.kind }
}

// One record of an agent's activity: what it did, to which item, its words under it; its author is the agent, whom the
// page names, so the line says what happened alone
function activity(r) {
  const on = r.number != null ? ` #${r.number}` : ''
  const ev = { ref: r.ref, t: tOf(r.at), kind: 'event', record: r, text: r.title || r.text || '' }
  if (r.kind === 'review') { const [icon, said] = VERDICT[r.verdict] || VERDICT.commented; return { ...ev, icon, said: said.replace(' these changes', '') + on, text: r.text || '' } }
  if (r.kind === 'commit') return { ...ev, icon: 'commit', said: { html: `pushed <code>${esc(r.sha)}</code> to${esc(on)}` }, text: firstLine(r.text) }
  if (r.kind === 'post') return { ...ev, icon: 'comment', said: 'posted in a thread', text: r.text || '' }
  if (r.kind === 'comment') return { ...ev, icon: 'comment', said: `commented on${on}`, text: r.text || '' }
  const icon = { merge: 'merge', close: 'close', reopen: 'reopen', pr: 'pull', issue: 'issue' }[r.kind]
  return { ...ev, icon, said: `${r.action}${on}` }
}

// an item's page, drawn in the side panel's body once the reader sends it, with the record `open.ref` revealed: its head
// and facts, then its conversation, commits or changed files (a pull request's part), its timeline, its posts or its
// activity, each by the kit
async function fill(body, key) {
  const d = await fetchUnit(key)
  if (!d || !open || open.key !== key || !body.isConnected) return
  const f = d.facts
  const t = TAB_OF[key.split('/')[1]]
  const mentions = mentionsOf(d)
  let conv = null
  const thread = (sel, msgs, o = {}) => {
    conv = thimble.messages({ mount: body.querySelector(sel), mentions, onPick: o.onPick })
    conv.draw(msgs, { empty: o.empty })
  }
  if (t === 'pulls') {
    const commits = d.records.filter((r) => r.kind === 'commit')
    const end = f.state === 'merged' ? `${esc(f.merged_by)} merged it at ${hm(f.ended)}, ${took(f.opened, f.ended)} after it opened`
      : f.state === 'closed' ? `${esc(f.closed_by)} closed it at ${hm(f.ended)}${f.reason ? ` as ${esc(f.reason)}` : ''}` : 'still open'
    const parts = [['conversation', 'Conversation', d.records.length], ['commits', 'Commits', commits.length], ['files', 'Files changed', f.files]]
    body.innerHTML = `<div class="page-head">${badge(f.state, 'pulls')}<span><b>${esc(f.author)}</b> opened it at ${hm(f.opened)} · ${end}</span></div>` +
      dl([['Fixes', d.fixes && goTo(d.fixes, `#${d.fixes.number} ${esc(d.fixes.title)}`)], ['In the other runs', elsewhere(d)],
        ['Reviews', `${esc(cap(f.review))} · ${f.approvals} of ${plural(f.need, 'approval')}${f.reviewers.length ? ` · ${f.reviewers.map(([w, v]) => `${esc(w)} ${esc((VERDICT[v] || VERDICT.commented)[1].replace(' these changes', ''))}`).join(', ')}` : ''}`],
        ['Flags', f.flags.map(esc).join(' · ')]]) +
      `<div class="seg parts">${parts.map(([k, w, n]) => `<button type="button" class="seg-opt${open.part === k ? ' active' : ''}" data-part="${k}">${w} <span class="count">${n}</span></button>`).join('')}</div>` +
      '<div class="part"></div>'
    if (open.part === 'files') {
      // each commit's patch, under its sha and message: the forge's diff of the files it changed
      const box = body.querySelector('.part')
      box.innerHTML = commits.filter((c) => c.diff).map((c, i) => `<div class="change"><div class="change-head"><code>${esc(c.sha || '')}</code><span>${esc(firstLine(c.text))}</span></div><div data-i="${i}"></div></div>`).join('') || '<div class="dim">No changes.</div>'
      commits.filter((c) => c.diff).forEach((c, i) => thimble.diff({ mount: box.querySelector(`[data-i="${i}"]`), patch: c.diff, ref: c.ref }))
    } else thread('.part', (open.part === 'commits' ? commits : d.records).map((r) => message(r, d)), { empty: open.part === 'commits' ? 'No commits' : 'No records' })
  } else if (t === 'issues') {
    const end = f.state === 'fixed' ? `fixed at ${hm(f.ended)}, ${took(f.opened, f.ended)} after it opened` : f.state === 'closed' ? `closed at ${hm(f.ended)}` : 'still open'
    body.innerHTML = `<div class="page-head">${badge(f.state, 'issues')}<span><b>${esc(f.author)}</b> opened it at ${hm(f.opened)} · ${f.origin === 'backlog' ? 'from the backlog' : esc(f.origin)} · ${end}</span></div>` +
      dl([['Pull requests', (d.prs || []).map((p) => goTo(p, `#${p.number} ${esc(p.title)}`)).join('')], ['In the other runs', elsewhere(d)]]) +
      '<div class="part"></div>'
    thread('.part', d.records.map((r) => message(r, d)))
  } else if (t === 'discussions') {
    // a board's thread: the first post, the replies under it
    body.innerHTML = `<div class="page-head"><span>${plural(f.posts, 'post')} · ${plural(f.posters.length, 'person', 'people')} · ${hm(f.opened)}–${hm(f.last)}</span></div><div class="part"></div>`
    thread('.part', d.records.map((r, i) => ({ ref: r.ref, t: tOf(r.at), author: r.author, text: r.text || '', parent: i ? d.records[0].ref : null })))
  } else {
    const note = d.records.find((r) => r.kind === 'agent')
    const did = Object.entries(f.did).map(([k, n]) => `<span><b>${n}</b> ${k}</span>`).join('')
    body.innerHTML = `<div class="who">${avatar(f.title)}<div><b>${esc(f.title)}</b><span class="dim">${esc(f.run)}</span></div></div>` +
      (note ? '<div class="note"></div>' : '') + `<div class="did">${did}</div><div class="part"></div>`
    if (note) thimble.text(body.querySelector('.note'), `“${note.text}”`, { format: 'plain', ref: note.ref, mentions })
    // a record of its activity opens the item it is about, the record revealed there
    const itemOf = (r) => (r.kind === 'post' ? `${f.run}/discussions/${r.thread}` : r.number != null && d.mentions[r.number] ? d.mentions[r.number].key : null)
    thread('.part', d.records.filter((r) => r.kind !== 'agent').map(activity), { onPick: (m) => { const k = itemOf(m.record); if (k) show(k, m.ref) } })
  }
  // the record a citation opened, in view
  const ref = open.ref
  if (ref && !(conv && conv.reveal(ref))) body.querySelector(`[data-anchor="${CSS.escape(ref)}"]`)?.scrollIntoView({ block: 'center' })
}

// ------------------------------------------------------------------------------------------------ places and clicks

// open an item's page, on its tab, with the record `ref` revealed: a citation, a link and another run's issue come here
async function show(key, ref = null) {
  const t = TAB_OF[key.split('/')[1]]
  if (!t) return
  const r = key.split('/')[0]
  if (t !== tab || r !== run) {
    tab = t
    run = r
    side.close()
    await load()
  }
  const it = data && data.items.find((i) => i.key === key)
  if (it && !search.has(it.search)) search.set('') // its onChange draws the list again, with the item
  open = { key, ref, part: 'conversation' }
  // the table opens its row, chosen and in view; an item Filter by hides opens alone
  if (table && it && table.open(it.ref)) return
  const d = await fetchUnit(key)
  if (d) side.open({ title: d.facts.title, sub: subOf({ key, run: d.facts.run, number: d.facts.number }), ref: unit(key), render: (body) => fill(body, key) })
}

// a run's citation opens its repository; any other opens its item
function go() {
  const t = want
  want = null
  if (t.run && data.runs.some((r) => r.run === t.run)) choose(t.run)
  else if (t.key) show(t.key, t.ref)
}

$('repo').addEventListener('click', (e) => {
  if (e.metaKey || e.ctrlKey) return
  const opt = e.target.closest('[data-run]')
  if (opt) return choose(opt.dataset.run)
  if (e.target.closest('#run')) switcher($('runs').hidden)
})
$('repo').addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('runs').hidden) {
    switcher(false)
    $('run').focus()
  } else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !$('runs').hidden) {
    const opts = [...$('runs').querySelectorAll('.run-opt')]
    const i = opts.indexOf(document.activeElement)
    opts[(i + (e.key === 'ArrowDown' ? 1 : opts.length - 1)) % opts.length]?.focus()
    e.preventDefault()
  }
})
// a click anywhere else closes the switcher's list
document.addEventListener('pointerdown', (e) => {
  if ($('runs') && !$('runs').hidden && !e.target.closest('#repo')) switcher(false)
})

$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]')
  if (!b || b.dataset.tab === tab) return
  tab = b.dataset.tab
  side.close()
  load()
})
$('body').addEventListener('click', (e) => {
  if (e.metaKey || e.ctrlKey) return // a ⌘-click asks about the element
  const link = e.target.closest('[data-go]')
  if (link) return show(link.dataset.go)
  const part = e.target.closest('[data-part]')
  if (part && open) {
    open = { ...open, ref: null, part: part.dataset.part }
    fill(side.body, open.key)
  }
})
thimble.onLabels(() => load())
// a label's values arrive while it runs, which the counts and the list follow while a label colors or filters
let later = null
thimble.onMarks(() => {
  if (!colour.label && !filter.label) return
  clearTimeout(later)
  later = setTimeout(load, 300)
})
thimble.onOpen((place) => {
  want = place.target || null
  if (want && data) go()
})
draw()
load()
</script>
</body>
</html>
