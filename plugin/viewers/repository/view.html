    const loud = p.flags.filter((f) => f !== 'merged by its author')
    if (loud.length) {
      const f = el('div', 'flags')
      for (const x of loud) {
        const c = el('button', `chip chip-sans chip-act ${flagTone()}`, x)
        c.onclick = (e) => {
          e.stopPropagation()
          setFilter('flag', x)
        }
        f.append(c)
      }
      main.append(f)
    }
    const side = el('div', 'side')
    side.append(diffstat(p.plus || 0, p.minus || 0), reviewers(p.latest))
    const st = el('div', 'rstrip')
    st.append(strip(p.ticks, stripWidth(), 14))
    row.append(stateIcon('pulls', p.state), main, side, st,
      countsBox([['commit', p.commits, 'commits'], ['comment', p.comments, 'comments']]))
    return row
  }
  // a closed unit's close record, in the closer's words
  function whyLine(why) {
    const q = el('div', 'why', why.text)
    q.dataset.anchor = why.ref
    q.title = why.text
    return q
  }
  function issueRow(i) {
    const row = rowBase(i, `issue ${i.run} #${i.number}, ${i.title}`)
    const main = el('div')
    const opened = [`#${i.number} opened by `, who(i.author, 'author'), i.origin === 'backlog' ? ' in the backlog' : ` ${since(i.at)}`]
    const state = i.state === 'fixed' ? ['fixed by ', unitLink(`#${i.fixed_by}`, `${i.run}/pull/${i.fixed_by}`), i.origin === 'backlog' ? ` at ${since(i.ended)}` : ` ${dur(i.ended - i.at)} after it opened`]
      : i.state === 'closed' ? [`closed by ${i.closed_by} as ${i.reason}`]
        : i.prs.length ? [`${i.prs.length === 1 ? 'pull request' : 'pull requests'} ${i.prs.map((n) => '#' + n).join(', ')} not merged`] : null
    main.append(titleLine(i.title, i), meta(opened, state))
    if (i.why && i.why.text) main.append(whyLine(i.why))
    const side = el('div', 'side')
    const st = el('div', 'rstrip')
    st.append(strip(i.ticks, stripWidth(), 14))
    row.append(stateIcon('issues', i.state), main, side, st, countsBox([['pr', i.prs.length, 'pull requests that close it'], ['comment', i.comments, 'comments']]))
    return row
  }
  function threadRow(d) {
    const row = rowBase(d, `discussion ${d.run}, ${d.title}`)
    const main = el('div')
    main.append(titleLine(d.title || `Discussion ${d.number}`, d), meta(['started by ', who(d.author, 'actor')], `${d.posters.length} posting`,
      d.mentions.length ? `mentions ${[...d.mentions].sort((a, b) => a - b).map((n) => '#' + n).join(', ')}` : null))
    const side = el('div', 'side')
    const avs = el('span', 'avs')
    for (const n of d.posters.slice(0, 5)) avs.append(avatar(n, 20))
    side.append(avs)
    const st = el('div', 'rstrip')
    st.append(strip(d.ticks, stripWidth(), 14))
    row.append(stateIcon('discussions'), main, side, st, countsBox([['comment', d.posts, 'posts']]))
    return row
  }

  function agentTable(items) {
    const table = el('table', 'table agents')
    const hr = el('tr')
    hr.append(el('th', null, 'Agent'), el('th', null, 'Activity'))
    for (const [k, text] of AGENT_COLS) {
      const th = el('th', 'n' + (k === 'comments' || k === 'posts' ? ' opt' : ''))
      const b = el('button', S.agentSort === k ? 'on' : '', text + (S.agentSort === k ? ' ↓' : ''))
      b.dataset.field = k
      b.onclick = () => {
        S.agentSort = k
        load()
      }
      th.append(b)
      hr.append(th)
    }
    const thead = el('thead')
    thead.append(hr)
    const body = el('tbody')
    for (const a of items) {
      const tr = el('tr', unit && unit.key === a.key ? 'active' : '')
      tr.dataset.anchor = unitRef(a.key)
      tr.dataset.anchorName = `the agent ${a.name} of ${a.run}`
      const name = el('td')
      const w = el('span', 'who')
      w.append(avatar(a.name, 20), el('span', 'name', a.name), runTag(a.run))
      name.append(w)
      const act = el('td')
      act.append(strip(a.ticks, stripWidth(), 14))
      tr.append(name, act)
      for (const [k] of AGENT_COLS) tr.append(el('td', 'n' + (k === 'comments' || k === 'posts' ? ' opt' : ''), String(a[k])))
      tr.onclick = () => openKey(a.key)
      body.append(tr)
    }
    table.append(thead, body)
    return table
  }
  // One matrix per chosen run: who reviewed whose pull requests, a cell's shade its approvals and its orange count its
  // change requests, with pairs that approved each other outlined. A cell opens those pull requests.
  function matrices() {
    const box = el('div', 'matrices')
    for (const run of data.chosen) {
      const pairs = data.pairs[run] || {}
      const names = [...new Set([...Object.keys(pairs), ...Object.values(pairs).flatMap((p) => Object.keys(p))])].sort()
      if (!names.length) continue
      const info = data.runs.find((r) => r.run === run)
      const max = Math.max(1, ...Object.values(pairs).flatMap((p) => Object.values(p).map((v) => v[0])))
      const t = el('table', 'matrix')
      const cap = el('caption')
      cap.append(runTag(run), ` ${setup(info)}`)
      t.append(cap)
      const hr = el('tr')
      const corner = el('th', 'axis')
      corner.append('author →', el('br'), 'reviewer ↓')
      hr.append(corner)
      for (const n of names) hr.append(el('th', 'to', n))
      t.append(hr)
      for (const rev of names) {
        const tr = el('tr')
        tr.append(el('th', 'by', rev))
        for (const auth of names) {
          const td = el('td')
          if (rev === auth) {
            td.className = 'self'
          } else {
            const [ok, cr] = (pairs[rev] && pairs[rev][auth]) || [0, 0]
            const back = (pairs[auth] && pairs[auth][rev]) || [0, 0]
            if (ok) {
              td.append(String(ok))
              td.style.background = `color-mix(in oklab, var(${actionInk() ? '--viz-ink-2' : '--viz-3'}) ${Math.round((actionInk() ? 8 : 18) + (ok / max) * (actionInk() ? 30 : 50))}%, transparent)`
            }
            if (cr) td.append(el('span', 'cr', `✗${cr}`))
            if (ok && back[0]) td.classList.add('mutual')
            td.title = `${rev} reviewed ${auth}: ${ok} approved, ${cr} changes requested`
            td.onclick = () => {
              Object.assign(S, { tab: 'pulls', runs: [run], filters: { reviewer: [rev], author: [auth] }, sort: '', q: '' })
              load()
            }
          }
          tr.append(td)
        }
        t.append(tr)
      }
      box.append(t)
    }
    return box
  }

  // Compare: the pull requests or issues issue by issue, one column per chosen run.
  function grid() {
    const table = el('table', 'grid')
    const hr = el('tr')
    hr.append(el('th', null, 'Issue'))
    const runs = data.runs.filter((r) => data.chosen.includes(r.run))
    for (const r of runs) {
      const th = el('th')
      const sub = el('span', 'sub', setup(r))
      th.append(r.run, sub)
      hr.append(th)
    }
    const thead = el('thead')
    thead.append(hr)
    const body = el('tbody')
    for (const g of data.grid) {
      const tr = el('tr')
      const td = el('td', 'issue')
      const t = el('div', 't')
      if (g.number != null) t.append(el('span', 'n', `#${g.number}`))
      t.append(g.title || 'No linked issue')
      t.title = g.title
      td.append(t)
      tr.append(td)
      for (const r of runs) {
        const cell = el('td')
        const box = el('div', 'cell')
        for (const c of g.cells[r.run] || []) box.append(gridChip(c))
        if (!box.childNodes.length) box.append(el('span', 'none', '–'))
        cell.append(box)
        tr.append(cell)
      }
      body.append(tr)
    }
    table.append(thead, body)
    return table
  }
  function gridChip(c) {
    const b = el('button', 'chip chip-sans chip-tone-neutral chip-act gchip')
    b.dataset.anchor = unitRef(c.key)
    if (S.tab === 'pulls') {
      b.dataset.anchorName = `pull request #${c.number}`
      b.append(stateIcon('pulls', c.state), `#${c.number}`, el('span', 'dim', c.state === 'merged' ? dur(c.to_merge) : c.state))
      b.title = `${c.author}${c.flags.length ? ': ' + c.flags.join(', ') : ''}`
    } else {
      b.dataset.anchorName = `issue #${c.number}`
      b.append(stateIcon('issues', c.state), c.state === 'fixed' ? `#${c.fixed_by}` : c.state, el('span', 'dim', c.state === 'fixed' ? dur(c.to_fix) : c.prs.length ? c.prs.map((n) => '#' + n).join(' ') : ''))
    }
    b.onclick = () => openKey(c.key)
    return b
  }
  // Compare for discussions and agents: one column per chosen run.
  function columns(items) {
    const box = el('div', 'cols')
    for (const run of data.chosen) {
      const col = el('div', 'box')
      const info = data.runs.find((r) => r.run === run)
      const h = el('div', 'box-head')
      h.append(el('h3', null, run), el('span', 'dim', setup(info)))
      col.append(h)
      const mine = items.filter((x) => x.run === run)
      if (S.tab === 'agents') col.append(agentMini(mine))
      for (const it of S.tab === 'agents' ? [] : mine) {
        const row = el('div', 'list-row' + (unit && unit.key === it.key ? ' active' : ''))
        row.dataset.anchor = unitRef(it.key)
        row.dataset.anchorName = `the discussion ${it.title}`
        const name = el('span', 'name', it.title)
        name.title = it.title
        row.append(stateIcon('discussions'), name, el('span', 'mono dim', String(it.posts)))
        row.onclick = () => openKey(it.key)
        col.append(row)
      }
      box.append(col)
    }

  }
  // one run's agents with the counts a comparison needs, sorted as the table is
  const MINI = [['opened', 'PRs'], ['merges', 'Merges'], ['reviews', 'Reviews']]
  function agentMini(items) {
    const table = el('table', 'table agents mini')
    const hr = el('tr')
    hr.append(el('th', null, 'Agent'))
    for (const [k, text] of MINI) {
      const th = el('th', 'n')
      const b = el('button', S.agentSort === k ? 'on' : '', text + (S.agentSort === k ? ' ↓' : ''))
      b.dataset.field = k
      b.onclick = () => {
        S.agentSort = k
        load()
      }
      th.append(b)
      hr.append(th)
    }
    const thead = el('thead')
    thead.append(hr)
    const body = el('tbody')
    for (const a of items) {
      const tr = el('tr', unit && unit.key === a.key ? 'active' : '')
      tr.dataset.anchor = unitRef(a.key)
      tr.dataset.anchorName = `the agent ${a.name} of ${a.run}`
      const td = el('td')
      const w = el('span', 'who')
      w.append(avatar(a.name, 16), el('span', 'name', a.name))
      td.append(w)
      tr.append(td)
      for (const [k] of MINI) tr.append(el('td', 'n', String(a[k])))
      tr.onclick = () => openKey(a.key)

    table.append(thead, body)

  }

  // the list in its box under the states; compare lays the chosen runs out issue by issue in the box, or run by run in
  // boxes of their own under it
  function drawList() {
    const box = $('#list')
    const items = data.items
    const b = el('div', 'box')
    b.append(listHead())
    const parts = [b]
    if (!items.length) b.append(el('div', 'empty', `No ${TABS[S.tab].noun[1]} match.`))
    else if (S.tab === 'agents' && S.agentView === 'matrix') b.append(matrices())
    else if (S.compare && data.grid) b.append(grid())
    else if (S.compare) {
      const cols = columns(items)
      cols.style.marginTop = '12px'
      parts.push(cols)
    } else if (S.tab === 'agents') b.append(agentTable(items))
    else b.append(...items.map(S.tab === 'pulls' ? pullRow : S.tab === 'issues' ? issueRow : threadRow))
    if (items.length && items.length < data.total && !(S.compare && data.grid)) {
      const b = el('button', 'btn btn-secondary btn-sm more', `${data.total - items.length} more`)
      b.onclick = more
      parts.push(b)
    }
    box.replaceChildren(...parts)
  }

  // ------------------------------------------------------------------------------------------------ a unit's page
  function tabOf(key) {
    const kind = key.split('/')[1]
    return { pull: 'pulls', issues: 'issues', discussions: 'discussions', agents: 'agents' }[kind]
  }
  async function openUnit(key, ref) {
    focusRef = ref || null
    if (!unit || unit.key !== key) S.page = 'conversation'
    unit = await thimble.fetch({ op: 'unit', key, colour: S.colour, labels: !S.byField, hide: S.hide })
    // a cited commit opens on the commits
    if (unit && ref && unit.records.some((x) => x.ref === ref && x.kind === 'commit')) S.page = 'commits'
    const was = document.body.classList.contains('open')
    document.body.classList.toggle('open', !!unit)
    if (!was) relayout()
    drawDetail()
    for (const r of document.querySelectorAll('.row, .agents tbody tr, .cols .list-row')) r.classList.toggle('active', r.dataset.anchor === unitRef(key))
  }
  function closeUnit() {
    unit = null
    focusRef = null
    document.body.classList.remove('open')
    $('#detail').replaceChildren()
    for (const r of document.querySelectorAll('.row.active, tr.active, .list-row.active')) r.classList.remove('active')
    relayout()
  }
  function linkText(text, links) {
    const frag = document.createDocumentFragment()
    let last = 0
    for (const m of String(text || '').matchAll(/#(\d+)\b/g)) {
      const key = links && links[m[1]]
      if (!key) continue
      frag.append(text.slice(last, m.index))
      const b = el('button', 'lnk strong', m[0])
      b.style.textDecoration = 'underline'
      b.onclick = () => openKey(key)
      frag.append(b)
      last = m.index + m[0].length
    }
    frag.append(String(text || '').slice(last))
    return frag
  }
  const VERB = { opened: 'opened this', pushed: 'pushed', approved: 'approved these changes', 'changes requested': 'requested changes', commented: 'commented', posted: 'posted', merged: 'merged this', closed: 'closed this', reopened: 'reopened this', 'signed off': 'signed off' }
  // on an agent's page each record names the pull request or issue it was on
  const ON = { opened: 'opened', pushed: 'pushed to', approved: 'approved', 'changes requested': 'requested changes on', commented: 'commented on', merged: 'merged', closed: 'closed', reopened: 'reopened' }
  // what a record says it did, as the conversation's line names it
  function said(x, links) {
    const frag = document.createDocumentFragment()
    const fixes = unit.tab === 'issues' && x.kind === 'merge'
    if (fixes) frag.append('merged ', linkText(`#${x.number}`, links), ', which fixes this')
    else if (x.kind === 'issue' && x.hours <= 0) frag.append('reported this in the backlog')
    else if (unit.tab === 'agents' && x.number != null) frag.append(`${ON[x.action] || x.action} `, linkText(`#${x.number}`, links), x.title ? ` ${x.title}` : '')
    else if (x.kind === 'close') frag.append(`closed this as ${x.reason}`)
    else if (x.kind === 'commit') frag.append(x.forced ? 'force-pushed' : 'pushed a commit')
    else frag.append(VERB[x.action] || x.action)
    return frag
  }
  // a record's badge on the conversation's line: its action's icon, filled in its part's colour
  function badge(x) {
    const fixes = unit.tab === 'issues' && x.kind === 'merge'
    const b = el('span', 'badge')
    const ic = icon(x.kind === 'issue' ? 'issue' : fixes ? 'fixed' : ACTION_ICON[x.action] || 'comment')
    b.append(ic)
    const unmarked = labelOn() && x.part < 0
    if (!unmarked && !(field() === 'action' && !labelOn() && ['pushed', 'commented', 'opened', 'posted'].includes(x.action))) {
      b.classList.add('fill')
      b.style.setProperty('--c', partColour(x.part))
    }
    return b
  }
  // the label value that marks a record, as its pill on the conversation's line
  function markOf(x) {
    return labelOn() && x.part >= 0 ? labelPill(x.part) : null
  }
  function event(x, links) {
    const words = x.text && x.kind !== 'commit'
    const e = el('div', 'it' + (x.ref === focusRef ? ' focus' : ''))
    e.dataset.anchor = x.ref
    e.dataset.anchorName = `${x.author}'s ${x.kind} at ${x.at}`
    if (x.text) e.dataset.anchorText = x.text
    const when = el('span', 'when', since(x.hours))
    when.title = clock(x.at)
    if (words) {
      // a comment, a review with words, a post or an opening: a box by its author's avatar
      e.append(avatar(x.author, 32))
      const box = el('div', 'cbox')
      const ch = el('div', 'ch')
      ch.append(el('b', null, x.author), said(x, links), when)
      const m = markOf(x)
      if (m) ch.append(el('span', 'grow'), m)
      const body = el('div', 'cb')
      body.append(linkText(x.text, links))
      box.append(ch, body)
      e.append(box)
      return e
    }
    e.append(badge(x))
    const col = el('div')
    const line = el('div', 'line')
    line.append(avatar(x.author, 16), el('b', null, x.author), said(x, links), when)
    const m = markOf(x)
    if (m) line.append(m)
    col.append(line)
    if (x.kind === 'commit') {
      const c = el('div', 'commit')
      c.append(el('span', 'sha', x.sha || ''), el('span', 'msg', x.text || ''))
      if (x.diff) {
        const [p, n] = countDiff(x.diff)
        c.append(diffstat(p, n))
      }
      col.append(c)
    }
    e.append(col)
    return e
  }
  // a section of a unit's facts; its title is [name, the field it shows] where that field is one the reader made
  function factsSection(title, ...content) {
    const s = el('section')
    const [name, fieldName] = Array.isArray(title) ? title : [title]
    const h = el('h4', null, name)
    if (fieldName) h.dataset.field = fieldName
    s.append(h, ...content)
    return s
  }
  function kv(pairs) {
    const box = el('div', 'kv')
    for (const [k, v, fieldName] of pairs) {
      const name = el('span', null, k)
      if (fieldName) name.dataset.field = fieldName
      box.append(name, el('span', null, v))
    }
    return box
  }
  function unitChip(p, tab) {
    const b = el('button', 'chip chip-sans chip-tone-neutral chip-act gchip')
    b.dataset.anchor = unitRef(p.key)
    b.append(stateIcon(tab, p.state), `#${p.number}`)
    b.title = p.title || ''
    b.onclick = () => openKey(p.key)
    return b
  }
  // the same backlog issue in every run, with the pull requests each run opened for it
  function everyRun(list, here) {
    const box = el('div', 'runsgrid')
    for (const r of list) {
      const c = runTag(r.run)
      if (r.run === here) c.style.fontWeight = '700'
      const cell = el('div', 'cell')
      if (unit.tab === 'pulls') {
        for (const p of r.prs) cell.append(unitChip(p, 'pulls'))
        if (!r.prs.length) cell.append(el('span', 'dim', 'no pull request'))
      } else {
        cell.append(unitChip({ key: r.key, number: unit.number, state: r.state }, 'issues'))
        for (const p of r.prs) cell.append(unitChip(p, 'pulls'))
      }
      box.append(c, cell)
    }
    return box
  }

  // ------------------------------------------------------------------------------------------------ commits and diffs
  const countDiff = (d) => {
    const ls = String(d || '').split('\n')
    return [ls.filter((l) => l.startsWith('+') && !l.startsWith('+++')).length, ls.filter((l) => l.startsWith('-') && !l.startsWith('---')).length]
  }
  // a unified diff as its files, each with its hunks' lines and their old and new line numbers
  function parseDiff(text) {
    const files = []
    let f = null, oldN = 0, newN = 0
    for (const line of String(text || '').split('\n')) {
      if (line.startsWith('--- ')) continue
      if (line.startsWith('+++ ')) {
        f = { path: line.slice(4).replace(/^b\//, ''), rows: [], plus: 0, minus: 0 }
        files.push(f)
        continue
      }
      if (!f) continue
      const h = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)$/.exec(line)
      if (h) {
        oldN = Number(h[1])
        newN = Number(h[2])
        f.rows.push({ kind: 'hunk', text: line })
      } else if (line.startsWith('+')) {
        f.rows.push({ kind: 'add', b: newN++, text: line })
        f.plus++
      } else if (line.startsWith('-')) {
        f.rows.push({ kind: 'del', a: oldN++, text: line })
        f.minus++
      } else if (line.startsWith(' ')) f.rows.push({ kind: 'ctx', a: oldN++, b: newN++, text: line })
    }
    return files
  }
  // a file's lines from one commit, under a line naming the commit when `commit` is given
  function diffTable(rows, commit) {
    const t = el('table', 'diff')
    const cols = el('colgroup')
    cols.append(el('col', 'ln'), el('col', 'ln'), el('col'))
    t.append(cols)
    if (commit) {
      const td = el('td', 'code')
      td.colSpan = 3
      td.append(el('span', 'sha', commit.sha || ''), ` ${commit.author} · ${commit.text || ''}`)
      const tr = el('tr', 'hunk by')
      tr.append(td)
      t.append(tr)
    }
    for (const r of rows) {
      const tr = el('tr', r.kind)
      if (r.kind === 'hunk') {
        const td = el('td', 'code', r.text)
        td.colSpan = 3
        tr.append(td)
      } else tr.append(el('td', 'ln', r.a == null ? '' : String(r.a)), el('td', 'ln', r.b == null ? '' : String(r.b)), el('td', 'code', r.text))
      t.append(tr)
    }
    return t
  }
  function commitsOf(u) {
    return u.records.filter((x) => x.kind === 'commit')
  }
  // the commits, one row each with its author, sha and size
  function commitList(u) {
    const box = el('div', 'box clist')
    const head = el('div', 'box-head')
    const cs = commitsOf(u)
    head.append(el('h3', null, plural(cs.length, ['commit', 'commits'])))
    box.append(head)
    for (const x of cs) {
      const row = el('div', 'crow' + (x.ref === focusRef ? ' focus' : ''))
      row.dataset.anchor = x.ref
      row.dataset.anchorName = `the commit ${x.sha}`
      row.dataset.anchorText = x.text || ''
      const r = el('div', 'r')
      const [p, n] = countDiff(x.diff)
      r.append(diffstat(p, n), el('span', 'sha', x.sha || ''))
      const by = el('div', 'by')
      by.append(avatar(x.author, 16), el('b', null, x.author), x.forced ? 'force-pushed' : 'committed', el('span', 'mono', since(x.hours)))
      const m = markOf(x)
      if (m) by.append(m)
      row.append(el('div', 'msg', x.text || ''), r, by)
      row.onclick = () => {
        S.page = 'files'
        focusRef = x.ref
        drawDetail()
      }
      row.style.cursor = 'pointer'
      box.append(row)
    }
    if (!cs.length) box.append(el('div', 'empty', 'No commits.'))
    return box
  }
  // the files the commits changed, each once: its lines from each commit that changed it, in the order they were pushed
  function filesOf(u) {
    const byPath = new Map()
    for (const x of commitsOf(u)) {
      for (const f of parseDiff(x.diff)) {
        let g = byPath.get(f.path)
        if (!g) byPath.set(f.path, (g = { path: f.path, plus: 0, minus: 0, parts: [] }))
        g.plus += f.plus
        g.minus += f.minus
        g.parts.push({ x, rows: f.rows })
      }
    }
    return [...byPath.values()]
  }
  function filesChanged(u) {
    const wrap = el('div')
    const files = filesOf(u)
    for (const g of files) {
      const box = el('div', 'box file')
      const head = el('div', 'box-head')
      const one = g.parts.length === 1 ? g.parts[0].x : null
      head.append(icon('file'), el('span', 'path', g.path), diffstat(g.plus, g.minus), el('span', 'grow'))
      if (one) head.append(el('span', 'sha', one.sha || ''), el('span', 'dim', one.author))
      else head.append(el('span', 'dim', plural(g.parts.length, ['commit', 'commits'])))
      box.append(head)
      for (const { x, rows } of g.parts) {
        const t = diffTable(rows, one ? null : x)
        t.dataset.anchor = x.ref
        t.dataset.anchorName = `${g.path} in ${x.sha}`
        box.append(t)
      }
      wrap.append(box)
    }
    if (!files.length) wrap.append(el('div', 'empty', 'No files changed.'))
    return wrap
  }
  function drawDetail() {
    const box = $('#detail')
    if (!unit) return box.replaceChildren()
    const u = unit
    const nav = el('div', 'dnav')
    const back = el('button', 'btn btn-ghost btn-sm', `‹ ${TABS[u.tab].name}`)
    back.onclick = closeUnit
    const step = el('div')
    const keys = data ? data.items.map((x) => x.key) : []
    const at = keys.indexOf(u.key)
    for (const [text, d, aria] of [['‹', -1, 'Previous'], ['›', 1, 'Next']]) {
      const b = el('button', 'btn btn-ghost btn-sm', text)
      b.setAttribute('aria-label', aria)
      b.disabled = at < 0 || !keys[at + d]
      b.onclick = () => openKey(keys[at + d])
      step.append(b)
    }
    nav.append(back, step)

    const head = el('div', 'dhead')
    head.dataset.anchor = unitRef(u.key)
    const h1 = el('h1')
    const sub = el('div', 'sub')
    const runChip = el('button', 'chip chip-sans chip-tone-neutral chip-act', `${u.run} · ${setup(u.setup)}`)
    runChip.title = 'Show this run alone'
    runChip.onclick = () => onlyRun(u.run)
    const cs = commitsOf(u)
    if (u.tab === 'pulls' || u.tab === 'issues') {
      h1.append(u.title, ' ', el('span', 'num', `#${u.number}`))
      sub.append(statePill(u.tab, u.state))
      const line = el('span')
      if (u.tab === 'pulls') {
        const commits = plural(u.commits.length, ['commit', 'commits'])
        if (u.state === 'merged') line.append(el('b', null, u.merged_by), ` merged ${commits} ${dur(u.to_merge)} after `, el('b', null, u.author), ' opened this')
        else if (u.state === 'closed') line.append(el('b', null, u.closed_by), ` closed this as ${u.reason}; `, el('b', null, u.author), ` pushed ${commits}`)
        else line.append(el('b', null, u.author), ` wants to merge ${commits}, open since ${since(u.at)}`)
      } else line.append(el('b', null, u.author), u.origin === 'backlog' ? ' reported this in the backlog' : ` opened this ${since(u.at)}`)
      sub.append(line)
      head.dataset.anchorName = `${u.tab === 'pulls' ? 'pull request' : 'issue'} ${u.run} #${u.number}`
    } else if (u.tab === 'discussions') {
      h1.append(u.title || `Discussion ${u.number}`)
      sub.append(statePill('discussions', 'thread'))
      const line = el('span')
      line.append(el('b', null, u.author), ` started this · ${plural(u.posts, ['post', 'posts'])} by ${u.posters.length}`)
      sub.append(line)
      head.dataset.anchorName = `the discussion ${u.title}`
    } else {
      const w = el('span', 'who')
      w.append(avatar(u.name, 32), u.name)
      h1.append(w)
      sub.append(`${u.opened} opened · ${u.merges} merges · ${u.approved} approvals · ${u.changes} change requests · ${u.posts} posts`)
      head.dataset.anchorName = `the agent ${u.name} of ${u.run}`
    }
    sub.append(runChip)
    head.append(h1, sub)
    // a pull request's own tabs: its conversation, its commits and the files they changed
    if (u.tab === 'pulls') {
      const tabs = el('nav', 'nav')
      const conv = u.records.filter((x) => x.kind !== 'commit').length
      const files = filesOf(u).length
      for (const [key, name, ic, n] of [['conversation', 'Conversation', 'comment', conv], ['commits', 'Commits', 'commit', cs.length], ['files', 'Files changed', 'file', files]]) {
        const b = el('button', S.page === key ? 'on' : '')
        const inner = el('span')
        inner.append(icon(ic), name, el('span', 'chip chip-tone-neutral', String(n)))
        b.append(inner)
        b.onclick = () => {
          S.page = key
          drawDetail()
        }
        tabs.append(b)
      }
      head.append(tabs)
    } else head.style.paddingBottom = '16px'

    const main = el('div')
    const facts = el('div', 'facts')
    const links = u.links || {}
    const page = u.tab === 'pulls' ? S.page : 'conversation'
    if (page === 'commits') main.append(commitList(u))
    else if (page === 'files') main.append(filesChanged(u))
    else {
      if (u.tab === 'agents') {
        const note = u.records.find((x) => x.kind === 'agent')
        if (note) {
          const n = el('p', 'note')
          n.dataset.anchor = note.ref
          n.append(note.text)
          main.append(n)
        }
        main.append(strip(u.records.filter((x) => x.kind !== 'agent').map((x) => [x.ref, x.hours, x.action, x.part]), 420, 18))
        main.lastChild.classList.add('dstrip')
      }
      const tl = el('div', 'timeline')
      for (const x of u.records) if (!(u.tab === 'agents' && x.kind === 'agent')) tl.append(event(x, links))
      main.append(tl)
    }

    if (u.tab === 'pulls') {
      const revs = el('div')
      for (const [name, verdict] of Object.entries(u.latest)) {
        const line = el('div', 'fline')
        const ic = icon(ACTION_ICON[verdict] || 'comment')
        ic.style.color = actionInk() ? 'var(--text-secondary)' : colourOf(verdict)
        line.append(avatar(name, 20), el('span', 'grow', name), ic)
        line.title = `${name}: ${verdict}`
        revs.append(line)
      }
      if (!revs.childNodes.length) revs.append(el('span', 'dim', 'No reviews'))
      facts.append(factsSection(['Reviewers', 'latest'], revs))
    }
    if (u.tab === 'pulls' || u.tab === 'issues' || (u.marks || []).length) {
      const pills = el('div', 'pills')
      if (u.area) pills.append(areaPill(u.area))
      if (data) for (const i of u.marks || []) if (i < data.classes.length) pills.append(labelPill(i))
      if (!pills.childNodes.length) pills.append(el('span', 'dim', 'None'))
      facts.append(factsSection(['Labels', 'area'], pills))
    }
    if (u.tab === 'pulls') {
      if (u.issue) {
        const line = el('div', 'fline')
        line.append(unitChip(u.issue, 'issues'), el('span', 'grow', u.issue.title))
        line.lastChild.title = u.issue.title
        facts.append(factsSection(['Closes', 'issue'], line))
      }
      facts.append(factsSection('Timing', kv([['opened', since(u.at), 'time'], ['first review', u.first_review == null ? '–' : `${dur(u.first_review)} later`, 'first_review'],
        [u.state === 'closed' ? 'closed' : 'merged', u.ended == null ? '–' : since(u.ended), 'ended'], ['commits', String(u.commits.length), 'commits'], ['changed', `+${u.plus} −${u.minus} in ${plural(u.paths.length, ['file', 'files'])}`, 'files']])))
      if (u.flags.length) {
        const f = el('div', 'pills')
        for (const x of u.flags) f.append(el('span', `chip chip-sans ${flagTone()}`, x))
        facts.append(factsSection(['Flags', 'flags'], f))
      }
    }
    if (u.tab === 'issues') {
      const prs = el('div', 'pills')
      for (const p of u.pulls) prs.append(unitChip(p, 'pulls'))
      if (!u.pulls.length) prs.append(el('span', 'dim', 'None'))
      facts.append(factsSection(['Pull requests', 'pulls'], prs), factsSection('Details', kv([['origin', u.origin, 'origin'], ['comments', String(u.comments), 'comments']])))
    }
    if ((u.tab === 'pulls' || u.tab === 'issues') && u.elsewhere && u.elsewhere.length > 1) facts.append(factsSection(['In every run', 'elsewhere'], everyRun(u.elsewhere, u.run)))
    if (u.tab === 'discussions') {
      const people = el('div', 'avs')
      for (const n of u.posters) people.append(avatar(n, 20))
      facts.append(factsSection(['Posting', 'posters'], people))
      if (Object.keys(links).length) {
        const m = el('div', 'pills')
        for (const [n, key] of Object.entries(links)) {
          const b = el('button', 'chip chip-sans chip-tone-neutral chip-act gchip', `#${n}`)
          b.dataset.anchor = unitRef(key)
          b.onclick = () => openKey(key)
          m.append(b)
        }
        facts.append(factsSection(['Mentions', 'mentions'], m))
      }
    }
    if (u.tab === 'agents') {
      const t = el('div', 'kv')
      const names = [...new Set([...Object.keys(u.partners), ...Object.keys(u.reviewed_by)])].sort()
      for (const n of names) {
        const gave = u.partners[n] || [0, 0]
        const got = u.reviewed_by[n] || [0, 0]
        t.append(el('span', null, n), el('span', null, `gave ${gave[0]}✓ ${gave[1]}✗ · got ${got[0]}✓ ${got[1]}✗`))
      }
      if (names.length) facts.append(factsSection(['Review partners', 'partners'], t))
      if (u.pulls.length) {
        const prs = el('div', 'pills')
        for (const p of u.pulls) prs.append(unitChip(p, 'pulls'))
        facts.append(factsSection(['Pull requests opened', 'pulls'], prs))
      }
    }
    const body = el('div', 'dbody')
    body.append(main, facts)
    box.replaceChildren(nav, head, body)
    box.classList.toggle('dnarrow', box.clientWidth < 620)
    const hit = box.querySelector('.it.focus, .crow.focus')
    if (hit) hit.scrollIntoView({ block: 'center' })
    else if (page === 'files' && focusRef) box.querySelector(`.file [data-anchor="${CSS.escape(focusRef)}"]`)?.closest('.file').scrollIntoView({ block: 'start' })
    else box.scrollTop = 0
  }

  // ------------------------------------------------------------------------------------------------ layout and events
  function layout() {
    const w = document.body.clientWidth
    document.body.classList.toggle('narrow', w < WIDE)
    const m = $('#main').clientWidth || w
    const main = $('#main')
    main.classList.toggle('w-xs', m < 720)
    main.classList.toggle('w-s', m < 900)
    main.classList.toggle('w-m', m >= 900 && m < 1300)
    if ($('#detail').clientWidth) $('#detail').classList.toggle('dnarrow', $('#detail').clientWidth < 620)
  }
  // the list's panels are drawn to its width, so they are drawn again when it changes
  let lastWidth = 0
  function relayout() {
    layout()
    const w = $('#main').clientWidth
    if (data && Math.abs(w - lastWidth) > 4) {
      lastWidth = w
      drawRuns()
      drawActivity()
      drawList()
      drawPop()
    }
  }
  new ResizeObserver(relayout).observe(document.body)
  for (const b of document.querySelectorAll('#mode .seg-opt')) {
    b.onclick = () => {
      S.compare = b.dataset.mode === 'compare'
      load()
    }
  }

  thimble.onOpen(async (place) => {
    const t = (place && place.target) || {}
    layout()
    if (t.run) {
      S.runs = [t.run]
      closeUnit()
    }
    if (t.key && tabOf(t.key) && tabOf(t.key) !== S.tab) Object.assign(S, { tab: tabOf(t.key), filters: {}, sort: '', q: '' })
    if (!data || t.run || (t.key && data.tab !== S.tab)) await load()
    if (t.key) await openUnit(t.key, t.ref)
    layout()
  })
  thimble.onLabels(async (state) => {
    const was = JSON.stringify([labelState.labels, labelState.filter])
    const before = new Set(labelState.labels.map((l) => l.name))
    // a label turned on in thimble colours the page again
    if ((state.labels || []).some((l) => !before.has(l.name))) S.byField = false
    labelState = { labels: state.labels || [], filter: state.filter || null, all: state.all || null, palette: state.palette || null }
    if (!data) return // the first fetch reads them
    // the reader applies the labels that are on and the filter; the list of labels and the palette only redraw
    if (JSON.stringify([labelState.labels, labelState.filter]) === was) return draw()
    await load()
    if (unit) await openUnit(unit.key, focusRef)
  })
  $('#pop').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]')
    if (!b) return
    const act = b.dataset.act
    if (act === 'field') {
      Object.assign(S, { colour: b.dataset.f, byField: true, hide: [] })
      menu = null
      load()
      if (unit) openUnit(unit.key, focusRef)
    } else if (act === 'label') {
      // a label that is on colours the page again while a field does, and is turned off otherwise
      const l = (labelState.all || labelState.labels.map((x) => ({ ...x, on: true }))).find((x) => x.id === b.dataset.id)
      const was = S.byField
      S.byField = false
      if (l && l.on && was) {
        load()
        if (unit) openUnit(unit.key, focusRef)
      } else if (l && thimble.setLabel) thimble.setLabel(l.id, !l.on)
    } else if (act === 'newlabel') {
      menu = null
      drawPop()
      if (thimble.newLabel) thimble.newLabel()
    } else if (act === 'palette') openPalette(b.dataset.id, b.dataset.value, 'menu')
    else if (act === 'colour') {
      if (pal && thimble.setLabelColour) thimble.setLabelColour(pal.id, pal.value, b.dataset.colour)
      pal = null
      drawPop()
    } else if (act === 'allruns') {
      menu = null
      S.runs = []
      load()
    } else if (act === 'togglerun') {
      e.stopPropagation()
      const all = data.runs.map((r) => r.run)
      const next = data.chosen.includes(b.dataset.run) ? data.chosen.filter((r) => r !== b.dataset.run) : [...data.chosen, b.dataset.run]
      S.runs = next.length && next.length < all.length ? all.filter((r) => next.includes(r)) : []
      load()
    } else if (act === 'onlyrun') {
      menu = null
      onlyRun(b.dataset.run)
    }
  })
  // a click anywhere else closes the menus and the palette, before the page's own handlers see it
  document.addEventListener('click', (e) => {
    if ((menu || pal) && !e.target.closest('#pop, #cbtn, #runbtn, .swb')) {
      menu = null
      pal = null
      drawPop()
    }
  }, true)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && (menu || pal)) {
      menu = null
      pal = null
      drawPop()
    }
  })
</script>
</body>
