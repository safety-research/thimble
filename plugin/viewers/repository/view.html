<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.chip, .btn, .seg, .field, .table) and the theme's tokens come with the frame; this page lays
     them out and draws the charts, strips and icons */
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; }
  .mono { font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); font-variant-numeric: tabular-nums; }
  .dim { color: var(--text-tertiary); }

  #bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 8px; }
  #tabs .n { margin-left: 2px; font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); }
  #body { flex: 1; min-height: 0; display: flex; }
  #main { flex: 1; min-width: 0; overflow: auto; }
  #detail { display: none; flex: 0 0 min(50%, 760px); min-width: 0; overflow: auto; border-left: 1px solid var(--border-hairline); }
  .open #detail { display: block; }
  /* below this width the detail takes the pane, and its back button returns to the list */
  .narrow.open #main { display: none; }
  .narrow.open #detail { flex: 1; border-left: 0; }

  /* the overview: the runs, which are also the run selector, beside the activity */
  #overview { display: flex; gap: 20px; align-items: flex-start; padding: 2px 16px 12px; }
  #runs { flex: 0 1 auto; min-width: 0; }
  #activity { flex: 1 1 320px; min-width: 240px; }
  .compare #overview, .w-s #overview { display: block; }
  .w-s #runs .runs, .compare #runs .runs { width: 100%; }
  .w-s #activity { margin-top: 10px; }
  .compare #activity { display: none; }
  .runs td, .runs th { padding: 4px 10px 4px 8px; white-space: nowrap; }
  .runs th { font-size: 10px; }
  .runs tbody tr { cursor: pointer; }
  .runs tr.off td { color: var(--text-tertiary); }
  .runs tr.off .bars, .runs tr.off svg { opacity: .35; }
  .runs td.setup { font: 400 var(--text-xs) / 1.3 var(--font-body); }
  .runs td.num { text-align: right; }
  .runs th.num { text-align: right; }
  .runs td.act { padding-top: 2px; padding-bottom: 2px; width: 100%; }
  .runs td.act svg { display: block; }
  .runs tfoot td { border-bottom: 0; padding-top: 0; }
  .axisrow { position: relative; height: 14px; font: 400 10.5px / 14px var(--font-mono); color: var(--text-tertiary); }
  .axisrow span { position: absolute; top: 0; }
  .axisrow span:not(:first-child) { transform: translateX(-50%); }
  .bars { display: flex; height: 6px; margin: 3px 0 3px; border-radius: 1px; overflow: hidden; background: rgba(var(--ink-rgb), 0.05); }
  .bars span { display: block; height: 100%; }
  .words { font: 400 var(--text-mono-sm) / 1.2 var(--font-mono); }
  .words b { font-weight: 500; }
  .spread { display: flex; align-items: flex-end; gap: 1px; height: 18px; }
  .spread span { width: 5px; background: var(--viz-ink-3); }
  /* the columns a narrow pane leaves out; a narrow pane stacks the runs over the activity, so they have the width */
  .w-s .wide2, .w-m .wide2, .compare .w-s .wide1 { display: none; }

  .legend { display: flex; flex-wrap: wrap; gap: 2px 10px; margin: 2px 0 4px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-secondary); }
  .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 1px; vertical-align: 0; }
  .legend .per { color: var(--text-tertiary); }
  svg.chart { display: block; overflow: visible; cursor: crosshair; user-select: none; }
  svg.chart text { font: 400 10.5px var(--font-mono); fill: var(--text-tertiary); }
  svg.chart .base { stroke: var(--border-hairline); }
  svg.chart .brush { fill: rgba(var(--ink-rgb), 0.07); stroke: var(--text-tertiary); stroke-dasharray: 2 2; }

  #filters { position: sticky; top: 0; z-index: 2; display: flex; flex-direction: column; gap: 6px; padding: 8px 16px; background: var(--surface-card); border-top: 1px solid var(--border-hairline); border-bottom: 1px solid var(--border-hairline); }
  #filters .frow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  #filters .field[type=search] { flex: 1 1 160px; max-width: 320px; }
  #filters select.field { flex: 0 1 auto; min-width: 0; max-width: 136px; }
  #filters select.set { max-width: 220px; border-color: var(--text-secondary); }
  #filters .total { margin-left: auto; font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); white-space: nowrap; }
  .seg .n { font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); }

  /* rows of pull requests, issues and discussions, as a forge lists them */
  .row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto auto; column-gap: 12px; align-items: start; padding: 8px 16px 8px 12px; border-bottom: 1px solid var(--border-hairline); cursor: pointer; }
  .row:hover { background: rgba(var(--ink-rgb), 0.03); }
  .row.active { background: var(--surface-selected); }
  .row .ico { margin-top: 2px; }
  .row .t { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .row .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .row .num { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); white-space: nowrap; }
  .row .meta { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-xs); color: var(--text-secondary); }
  .row .why { margin-top: 3px; padding-left: 8px; border-left: 2px solid var(--border-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-xs); color: var(--text-secondary); }
  .row .t .chip { flex: none; }
  .row .flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .row .revs { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 8px; max-width: 220px; margin-top: 2px; font-size: var(--text-xs); color: var(--text-secondary); }
  .row .revs span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .row .revs .ico { width: 13px; height: 13px; }
  .w-s .row .revs { display: none; }
  .row svg.strip { margin-top: 3px; }
  .counts { display: flex; gap: 10px; margin-top: 2px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-tertiary); white-space: nowrap; }
  .counts span { display: inline-flex; align-items: center; gap: 3px; min-width: 28px; }
  .counts .ico { width: 13px; height: 13px; }
  .lnk { padding: 0; border: 0; background: none; color: inherit; cursor: pointer; }
  .lnk:hover { color: var(--text-primary); text-decoration: underline; }
  .more { margin: 12px 16px; }
  .empty { padding: 24px 16px; color: var(--text-tertiary); }

  /* icons, drawn in a state's or an action's colour until a label is on, then in ink */
  .ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .s-open { color: var(--status-positive); }
  .s-merged, .s-fixed { color: var(--viz-5); }
  .s-closed { color: var(--status-negative); }
  .s-thread { color: var(--text-secondary); }
  .labelled .s-open, .labelled .s-merged, .labelled .s-fixed, .labelled .s-closed, .labelled .matrix td .cr { color: var(--text-secondary); }

  /* the compare grid: one row per issue, one column per chosen run */
  .grid { width: 100%; border-collapse: collapse; }
  .grid th, .grid td { padding: 6px 10px; border-bottom: 1px solid var(--border-hairline); text-align: left; vertical-align: top; }
  .grid thead th { position: sticky; top: var(--filters-h, 0); z-index: 1; background: var(--surface-card); font: 400 10.5px / 1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--text-tertiary); }
  .grid thead th .sub { display: block; margin-top: 2px; letter-spacing: 0; text-transform: none; font: 400 var(--text-xs) / 1.2 var(--font-body); }
  .grid thead th .chip, .cols h3 .chip { letter-spacing: 0; text-transform: none; }
  .grid td.issue { width: 34%; max-width: 0; }
  .grid td.issue .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid td.issue .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); margin-right: 6px; }
  .grid .cell { display: flex; flex-wrap: wrap; gap: 4px; }
  .grid .none { color: var(--text-tertiary); }
  .chip .ico { width: 13px; height: 13px; }
  .cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0; }
  .cols > div { min-width: 0; border-right: 1px solid var(--border-hairline); }
  .cols > div:last-child { border-right: 0; }
  .cols h3 { margin: 0; padding: 8px 12px 6px; font: 400 10.5px / 1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--text-tertiary); border-bottom: 1px solid var(--border-hairline); }
  .cols h3 .sub { display: block; letter-spacing: 0; text-transform: none; font-size: var(--text-xs); }
  .cols .list-row { margin: 2px 4px; align-items: baseline; }
  .cols .list-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agents.mini { table-layout: fixed; }
  .agents.mini th, .agents.mini td { padding: 4px 6px; overflow: hidden; text-overflow: ellipsis; }
  .agents.mini th:first-child, .agents.mini td:first-child { width: 30%; padding-left: 12px; }
  .agents.mini thead th { letter-spacing: 0; text-transform: none; font-size: 11px; }
  .agents.mini td.who { font: 500 var(--text-xs) / 1.3 var(--font-body); }

  /* agents */
  .agents td { vertical-align: middle; }
  .w-s .agents .opt { display: none; }
  .agents td.n, .agents th.n { text-align: right; }
  .agents th button { padding: 0; border: 0; background: none; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; }
  .agents th button.on { color: var(--text-primary); }
  .agents tbody tr { cursor: pointer; }
  .agents .who { font: 500 var(--text-sm) / 1.3 var(--font-body); }
  .matrices { display: flex; flex-wrap: wrap; gap: 28px; padding: 14px 16px 24px; }
  .matrix { border-collapse: collapse; }
  .matrix caption { caption-side: top; text-align: left; padding-bottom: 8px; font-size: var(--text-xs); color: var(--text-secondary); }
  .matrix th { font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); padding: 3px 6px; }
  .matrix th.to { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; height: 52px; }
  .matrix th.by { text-align: right; }
  .matrix td { width: 30px; height: 30px; padding: 0; text-align: center; border: 1px solid var(--border-hairline); font: 400 var(--text-mono-sm) / 1 var(--font-mono); cursor: pointer; }
  .matrix td.self { background: rgba(var(--ink-rgb), 0.04); cursor: default; }
  .matrix td.mutual { outline: 1.5px solid var(--text-primary); outline-offset: -2px; }
  .matrix td .cr { display: block; margin-top: 1px; font-size: 9.5px; color: var(--viz-2); }
  .matrix .axis { vertical-align: bottom; text-align: right; font: 400 10px / 1.5 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); }

  /* details */
  .dnav { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 0 8px; }
  .dhead { padding: 6px 20px 12px; border-bottom: 1px solid var(--border-hairline); }
  .dhead h1 { margin: 0; font: 500 var(--text-lg) / 1.3 var(--font-body); }
  .dhead h1 .num { color: var(--text-tertiary); font-weight: 400; }
  .dhead .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 6px; font-size: var(--text-xs); color: var(--text-secondary); }
  .dbody { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 20px; padding: 14px 20px 40px; }
  .dnarrow .dbody { grid-template-columns: minmax(0, 1fr); }
  .dnarrow .facts { order: -1; }
  .timeline { position: relative; }
  .ev { position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 8px; padding: 6px 8px 8px 4px; }
  .ev::before { content: ''; position: absolute; left: 14px; top: 26px; bottom: -6px; border-left: 1px solid var(--border-hairline); }
  .ev:last-child::before { display: none; }
  .ev.focus { background: var(--surface-selected); }
  .ev .dot { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--bg-sub, var(--surface-card)); box-shadow: 0 0 0 1px var(--border-hairline); }
  .ev .dot .ico { width: 13px; height: 13px; }
  .ev .head { padding-top: 2px; font-size: var(--text-xs); color: var(--text-secondary); }
  .ev .head b { color: var(--text-primary); font-weight: 500; }
  .ev .when { margin-left: 6px; font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); }
  .ev .text { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ev.boxed .text { padding: 8px 10px; border: 1px solid var(--border-subtle); border-radius: var(--radius-ui); background: var(--surface-card); }
  .ev .sha { font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); }
  .facts h4 { margin: 0 0 6px; font: 400 10px / 1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--text-tertiary); }
  .facts section { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border-hairline); font-size: var(--text-xs); }
  .facts section:last-child { border-bottom: 0; }
  .facts .line { display: flex; align-items: center; gap: 6px; min-height: 22px; }
  .facts .line .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facts .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
  .facts .kv span:nth-child(odd) { color: var(--text-tertiary); }
  .facts .kv span:nth-child(even) { font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); }
  .runsgrid { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; }
  .runsgrid .cell { display: flex; flex-wrap: wrap; gap: 4px; }
  .note { margin: 0 0 12px; padding: 8px 10px; border-left: 2px solid var(--border-subtle); color: var(--text-secondary); }
  .dstrip { margin: 4px 0 14px; }
</style>
</head>
<body>
  <header id="bar">
    <div class="seg seg-track" id="tabs"></div>
    <div class="seg seg-track" id="mode">
      <button class="seg-opt active" data-mode="combined">Combined</button>
      <button class="seg-opt" data-mode="compare">Compare</button>
    </div>
  </header>
  <div id="body">
    <main id="main">
      <section id="overview"><div id="runs"></div><div id="activity"></div></section>
      <div id="filters"></div>
      <div id="list"></div>
    </main>
    <aside id="detail"></aside>
  </div>
<script>
  // Repository: several agent runs on one library, as a forge's pages show them. It opens on the overview: one row per
  // run with its setup and measures, which also chooses the runs (a row or its chip adds or removes the run, All takes
  // every run), beside the chosen runs' activity per time bin. Every panel below follows the chosen runs. The tabs
  // switch between pull requests, issues, discussions and agents; the filters narrow the tab by any field, with the
  // count each value would give, and a drag across the activity narrows it to a time range. Any participant and Any
  // activity pick records, so with a time range they keep the units where that agent did that in that range. Compare
  // puts the chosen runs side by side: each run's activity in its row, and below it the pull requests or issues issue
  // by issue, or the discussions and agents run by run. A row opens its unit's page beside the list (or in its place in
  // a narrow pane).
  //
  // Labels: each unit's element carries view:<slug>/<key>, each record on a strip or a page its file ref, and each
  // run's row view:<slug>/<run>, so thimble marks them. While a label is on, the page draws the records it marks in the
  // label's colour in the activity, the strips and the runs' bars, and the other categories in ink; the filter is
  // applied by the reader, so the page fetches again in thimble.onLabels.
  const slug = (thimble.view && thimble.view.slug) || 'repository'
  const $ = (s, root) => (root || document).querySelector(s)
  const NS = 'http://www.w3.org/2000/svg'
  const PAGE = 100 // reader.py PAGE
  const WIDE = 1100 // the pane width from which the detail sits beside the list

  const TABS = {
    pulls: { name: 'Pull requests', noun: ['pull request', 'pull requests'], states: ['open', 'merged', 'closed'],
      selects: [['author', 'Any author'], ['reviewer', 'Any reviewer'], ['verdict', 'Any review'], ['actor', 'Any participant'], ['action', 'Any activity'], ['area', 'Any area'], ['reason', 'Any close reason'], ['flag', 'Any flag']],
      sorts: [['newest', 'Newest'], ['oldest', 'Oldest'], ['longest to merge', 'Longest to merge'], ['quickest first review', 'Quickest first review'], ['most reviews', 'Most reviews'], ['most commits', 'Most commits']] },
    issues: { name: 'Issues', noun: ['issue', 'issues'], states: ['open', 'fixed', 'closed'],
      selects: [['author', 'Any author'], ['actor', 'Any participant'], ['action', 'Any activity'], ['origin', 'Any origin'], ['area', 'Any area'], ['reason', 'Any close reason']],
      sorts: [['newest', 'Newest'], ['oldest', 'Oldest'], ['longest to fix', 'Longest to fix'], ['most comments', 'Most comments']] },
    discussions: { name: 'Discussions', noun: ['discussion', 'discussions'], states: null,
      selects: [['author', 'Anyone posting']],
      sorts: [['most posts', 'Most posts'], ['latest', 'Latest post'], ['oldest', 'Oldest']] },
    agents: { name: 'Agents', noun: ['agent', 'agents'], states: null, selects: [], sorts: [] },
  }
  // what each action is drawn in, in the activity, on the strips and on a page's timeline (reader.py ACTION)
  const ACTIONS = {
    opened: '--viz-ink-2', pushed: '--viz-ink-3', approved: '--viz-3', 'changes requested': '--viz-2', commented: '--viz-1',
    posted: '--viz-1', merged: '--viz-5', fixed: '--viz-5', closed: '--viz-4', 'signed off': '--viz-ink-4',
  }
  const STATE_COLOURS = { open: '--status-positive', merged: '--viz-5', fixed: '--viz-5', closed: '--status-negative' }
  const COUNT_ACTION = { approved: 'approved', changes: 'changes requested', commit: 'pushed', comment: 'commented', pr: 'opened' }
  const AGENT_COLS = [['opened', 'Opened'], ['merged', 'Merged'], ['merges', 'Merges done'], ['approved', 'Approvals'], ['changes', 'Changes req.'], ['comments', 'Comments'], ['posts', 'Posts']]

  // what the analyst chose; every change refetches the tab
  const S = { tab: 'pulls', runs: [], compare: false, q: '', filters: {}, sort: '', range: null, agentView: 'table', agentSort: 'merges' }
  let data = null // the reader's answer for the tab (reader.py _view)
  let unit = null // the open unit's page (reader.py _detail)
  let focusRef = null // the record a citation opened
  let label = null // the first label that is on
  let loading = 0

  function el(tag, cls, text) {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }
  function svg(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag)
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v)
    if (parent) parent.append(e)
    return e
  }
  const plural = (n, noun) => `${n} ${noun[n === 1 ? 0 : 1]}`
  const pad = (n) => String(n).padStart(2, '0')
  // a span of hours as the page writes it: 25m, 1h 04m
  function dur(h) {
    if (h == null) return '–'
    const m = Math.round(h * 60)
    return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${pad(m % 60)}m`
  }
  // a time as hours and minutes since its run started: +1:04
  function since(h) {
    const m = Math.max(0, Math.round(h * 60))
    return `+${Math.floor(m / 60)}:${pad(m % 60)}`
  }
  const MONTHS = 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')
  function clock(iso) {
    const m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(iso || '')
    return m ? `${Number(m[3])} ${MONTHS[Number(m[2]) - 1]} ${m[4]}:${m[5]} UTC` : iso || ''
  }
  const setup = (r) => `${r.team} agents · ${r.approvals} approval${r.approvals === 1 ? '' : 's'}`
  const colourOf = (action) => `var(${ACTIONS[action] || '--viz-ink-3'})`
  // a flag chip's tone, neutral while a label is on
  const flagTone = () => (label ? 'chip-tone-neutral' : 'chip-tone-warning')
  const unitRef = (key) => `view:${slug}/${key}`

  // ------------------------------------------------------------------------------------------------ icons
  const ICONS = {
    pr: ['circle cx=4 cy=3.5 r=1.7', 'circle cx=4 cy=12.5 r=1.7', 'path d=M4 5.2v5.6', 'circle cx=12 cy=12.5 r=1.7', 'path d=M12 10.8V6.5a2 2 0 0 0-2-2H7.2'],
    merged: ['circle cx=4 cy=3.5 r=1.7', 'circle cx=4 cy=12.5 r=1.7', 'circle cx=12 cy=8 r=1.7', 'path d=M4 5.2v5.6', 'path d=M4.6 5.1C5.6 7.3 7.6 8 10.3 8'],
    prclosed: ['circle cx=4 cy=3.5 r=1.7', 'circle cx=4 cy=12.5 r=1.7', 'path d=M4 5.2v5.6', 'circle cx=12 cy=12.5 r=1.7', 'path d=M10.3 3.2l3.4 3.4M13.7 3.2l-3.4 3.4'],
    issue: ['circle cx=8 cy=8 r=6.2', 'circle cx=8 cy=8 r=1.3'],
    fixed: ['circle cx=8 cy=8 r=6.2', 'path d=M5.3 8.2l1.9 1.9 3.6-3.8'],
    issueclosed: ['circle cx=8 cy=8 r=6.2', 'path d=M5.6 10.4l4.8-4.8'],
    thread: ['path d=M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z'],
    commit: ['circle cx=8 cy=8 r=2.4', 'path d=M1.5 8h4.1M10.4 8h4.1'],
    approved: ['path d=M3.2 8.4l3 3 6.6-6.8'],
    changes: ['path d=M8 2.8v6.4M4.8 6h6.4M4.8 12.6h6.4'],
    comment: ['path d=M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z'],
    close: ['path d=M4.3 4.3l7.4 7.4M11.7 4.3l-7.4 7.4'],
    agent: ['circle cx=8 cy=5.2 r=2.6', 'path d=M3 13.6c.6-2.6 2.6-4 5-4s4.4 1.4 5 4'],
  }
  function icon(name, cls) {
    const s = svg('svg', { viewBox: '0 0 16 16', class: 'ico' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' })
    for (const part of ICONS[name] || []) {
      const [tag, ...rest] = part.split(' ')
      const attrs = {}
      for (const kv of rest.join(' ').split(/ (?=[a-z]+=)/)) {
        const i = kv.indexOf('=')
        attrs[kv.slice(0, i)] = kv.slice(i + 1)
      }
      svg(tag, attrs, s)
    }
    return s
  }
  function stateIcon(tab, state) {
    if (tab === 'pulls') return icon(state === 'merged' ? 'merged' : state === 'closed' ? 'prclosed' : 'pr', 's-' + state)
    if (tab === 'issues') return icon(state === 'fixed' ? 'fixed' : state === 'closed' ? 'issueclosed' : 'issue', 's-' + state)
    return icon('thread', 's-thread')
  }
  const ACTION_ICON = { opened: 'pr', pushed: 'commit', approved: 'approved', 'changes requested': 'changes', commented: 'comment', posted: 'comment', merged: 'merged', fixed: 'merged', closed: 'close', 'signed off': 'agent' }

  // ------------------------------------------------------------------------------------------------ fetching
  function query(extra) {
    return { op: 'view', tab: S.tab, runs: S.runs, compare: S.compare, q: S.q, filters: S.filters, range: S.range,
             sort: S.tab === 'agents' ? S.agentSort : S.sort, offset: 0, ...extra }
  }
  async function load() {
    const mine = ++loading
    const res = await thimble.fetch(query())
    if (mine !== loading) return
    data = res
    draw()
  }
  async function more() {
    const res = await thimble.fetch(query({ offset: data.items.length }))
    data.items = data.items.concat(res.items)
    drawList()
  }
  const chosen = () => new Set(data ? data.chosen : [])
  const allChosen = () => data && data.chosen.length === data.runs.length

  function draw() {
    document.body.classList.toggle('labelled', !!label)
    document.body.classList.toggle('compare', S.compare)
    drawTabs()
    drawRuns()
    drawActivity()
    drawFilters()
    drawList()
  }

  // ------------------------------------------------------------------------------------------------ tabs and runs
  function drawTabs() {
    const box = $('#tabs')
    box.replaceChildren(...Object.entries(TABS).map(([key, t]) => {
      const b = el('button', 'seg-opt' + (key === S.tab ? ' active' : ''), t.name + ' ')
      b.append(el('span', 'n', String(data.tabs[key])))
      b.onclick = () => {
        if (S.tab === key) return
        Object.assign(S, { tab: key, filters: {}, sort: '', q: '' })
        $('#main').scrollTop = 0
        load()
      }
      return b
    }))
    for (const b of document.querySelectorAll('#mode .seg-opt')) b.classList.toggle('active', (b.dataset.mode === 'compare') === S.compare)
  }

  // A run's row toggles the run; with every run chosen it takes that run alone, as a legend does, and the last run left
  // gives every run back.
  function toggleRun(run) {
    const all = data.runs.map((r) => r.run)
    let next
    if (allChosen()) next = [run]
    else if (chosen().has(run)) next = data.chosen.filter((r) => r !== run)
    else next = data.chosen.concat(run)
    S.runs = next.length && next.length < all.length ? all.filter((r) => next.includes(r)) : []
    load()
  }
  function onlyRun(run, filters) {
    S.runs = [run]
    Object.assign(S.filters, filters || {})
    load()
  }

  // a run's units as a bar of their states in words, or while a label is on the part it marks
  function stateBar(parts) {
    return (r, max) => {
      const box = el('div')
      const bars = el('div', 'bars')
      bars.style.width = `${Math.max(8, Math.round((r.n / Math.max(1, max)) * 100))}%`
      const words = el('div', 'words')
      if (label) {
        const m = el('span')
        m.style.cssText = `width:${r.n ? (r.marked / r.n) * 100 : 0}%;background:${label.colour}`
        const rest = el('span')
        rest.style.cssText = `flex:1;background:var(--viz-ink-4)`
        bars.append(m, rest)
        const b = el('b', null, String(r.marked))
        b.style.color = label.colour
        words.append(b, ` of ${r.n}`)
      } else {
        for (const p of parts) {
          if (!r[p]) continue
          const s = el('span')
          s.style.cssText = `flex:${r[p]};background:var(${STATE_COLOURS[p]})`
          bars.append(s)
        }
        const shown = parts.filter((p) => r[p])
        shown.forEach((p, i) => {
          const b = el('b', null, String(r[p]))
          b.style.color = `var(${STATE_COLOURS[p]})`
          words.append(b, ` ${p}${i < shown.length - 1 ? ' · ' : ''}`)
        })
        if (!shown.length) words.append('none')
      }
      box.append(bars, words)
      return box
    }
  }
  const num = (key, fmt) => (r) => (r[key] == null ? '–' : fmt ? fmt(r[key]) : String(r[key]))
  // each tab's measures per run: a head and a cell, or a count that narrows the list to its run and to a flag or a
  // filter's value; a narrow pane in compare mode leaves out the `wide1` columns, and `wide2` columns need a wide pane
  const RUN_COLS = {
    pulls: [
      { head: 'Pull requests', cell: stateBar(['merged', 'closed', 'open']) },
      { head: 'To merge', cell: num('to_merge', dur), num: true },
      { head: 'First review', cell: num('first_review', dur), num: true, cls: 'wide1' },
      { head: 'Reviews each', cell: num('reviews', (v) => v.toFixed(1)), num: true, cls: 'wide1' },
      { head: 'Self-merged', flag: 'merged by its author', num: true, cls: 'wide2' },
      { head: 'Merged over changes', flag: 'merged over a change request', num: true, cls: 'wide2' },
      { head: 'Pushed after approval', flag: 'pushed after its last approval', num: true, cls: 'wide2' },
    ],
    issues: [
      { head: 'Issues', cell: stateBar(['fixed', 'closed', 'open']) },
      { head: 'To fix', cell: num('to_fix', dur), num: true },
      { head: 'Found in run', filter: ['origin', 'found during the run'], key: 'found', num: true, cls: 'wide1' },
      { head: 'Several PRs', key: 'several', num: true, cls: 'wide1' },
    ],
    discussions: [
      { head: 'Discussions', cell: (r) => countWords(r.n, r.marked) },
      { head: 'Posts', cell: num('posts'), num: true },
      { head: 'Posting', cell: (r) => `${r.posters} of ${r.team}`, num: true },
    ],
    agents: [
      { head: 'Reviews by agent', cell: (r) => spread(r.spread) },
      { head: 'Top share', cell: num('top', (v) => `${Math.round(v * 100)}%`), num: true },
      { head: 'Merges', cell: num('merges'), num: true, cls: 'wide1' },
      { head: 'Approved each other', cell: (r) => `${r.mutual} pair${r.mutual === 1 ? '' : 's'}`, num: true, cls: 'wide1' },
    ],
  }
  function countWords(n, marked) {
    const box = el('div', 'words')
    if (label) {
      const b = el('b', null, String(marked))
      b.style.color = label.colour
      box.append(b, ` of ${n}`)
    } else box.append(el('b', null, String(n)))
    return box
  }
  function spread(values) {
    const box = el('div', 'spread')
    const max = Math.max(1, ...values)
    for (const v of values) {
      const s = el('span')
      s.style.height = `${Math.max(1, Math.round((v / max) * 18))}px`
      s.title = `${v} reviews`
      box.append(s)
    }
    return box
  }

  function drawRuns() {
    const cols = RUN_COLS[S.tab]
    const table = el('table', 'table runs')
    const head = el('tr')
    const allTh = el('th')
    const all = el('button', 'chip chip-sans chip-tone-neutral chip-act' + (allChosen() ? ' active' : ''), 'All')
    all.onclick = () => {
      S.runs = []
      load()
    }
    allTh.append(all)
    head.append(allTh, el('th', null, 'Setup'))
    for (const c of cols) head.append(el('th', [c.num ? 'num' : '', c.cls || ''].join(' ').trim(), c.head))
    if (S.compare) head.append(el('th', null, `Activity, per ${data.activity.bin} min`))
    const thead = el('thead')
    thead.append(head)
    const body = el('tbody')
    const max = Math.max(1, ...data.runs.map((r) => r.n))
    const on = chosen()
    const ymax = S.compare ? activityMax(data.activity.rows) : 0
    for (const r of data.runs) {
      const tr = el('tr', on.has(r.run) ? '' : 'off')
      tr.dataset.anchor = unitRef(r.run)
      tr.dataset.anchorName = `the run ${r.run}, ${setup(r)}`
      const chipTd = el('td')
      const chip = el('button', 'chip chip-sans chip-tone-neutral chip-act' + (on.has(r.run) && !allChosen() ? ' active' : ''), r.run)
      chipTd.append(chip)
      tr.append(chipTd, el('td', 'setup', setup(r)))
      for (const c of cols) {
        const td = el('td', [c.num ? 'num' : '', c.cls || ''].join(' ').trim())
        if (c.flag || c.filter) {
          const n = r[c.flag || c.key]
          if (n) {
            const b = el('button', 'btn btn-ghost btn-sm', String(n))
            b.onclick = (e) => {
              e.stopPropagation()
              onlyRun(r.run, c.flag ? { flag: c.flag } : { [c.filter[0]]: c.filter[1] })
            }
            td.append(b)
          } else td.append(el('span', 'dim', '0'))
        } else if (c.key) td.append(String(r[c.key]))
        else {
          const v = c.cell(r, max)
          td.append(v)
        }
        tr.append(td)
      }
      if (S.compare) {
        const td = el('td', 'act')
        td.append(chart(data.activity.rows.filter((x) => x[0] === r.run), { width: RUN_ACTIVITY_WIDTH, height: 30, ymax, axis: false, fill: true }))
        tr.append(td)
      }
      tr.onclick = () => toggleRun(r.run)
      body.append(tr)
    }
    table.append(thead, body)
    const box = $('#runs')
    if (S.compare) {
      const foot = el('tfoot')
      const tr = el('tr')
      tr.append(el('td'), el('td'), ...cols.map((c) => el('td', c.cls || '')))
      const axis = el('td', 'act')
      axis.append(axisRow())
      tr.append(axis)
      foot.append(tr)
      table.append(foot)
      box.replaceChildren(table, legend())
    } else box.replaceChildren(table)
  }

  // ------------------------------------------------------------------------------------------------ activity
  // The chosen runs' kept records per time bin since each run started, stacked by action, or while a label is on by
  // the part it marks. A drag across it narrows every panel to that time range; a click takes one bin.
  const RUN_ACTIVITY_WIDTH = 400 // the viewBox width of a run's activity in compare mode, drawn at its cell's width
  function binsOf(rows) {
    const bins = new Map()
    for (const [, b, act, n, m] of rows) {
      const parts = bins.get(b) || {}
      if (label) {
        parts.marked = (parts.marked || 0) + m
        parts.other = (parts.other || 0) + n - m
      } else parts[act] = (parts[act] || 0) + n
      bins.set(b, parts)
    }
    return bins
  }
  function activityMax(rows) {
    const per = new Map()
    for (const [run, b, , n] of rows) per.set(run + '/' + b, (per.get(run + '/' + b) || 0) + n)
    return Math.max(1, ...per.values())
  }
  function partsOrder() {
    return label ? ['marked', 'other'] : Object.keys(ACTIONS)
  }
  function partColour(p) {
    return label ? (p === 'marked' ? label.colour : 'var(--viz-ink-4)') : colourOf(p)
  }
  function chart(rows, { width, height, ymax, axis, fill }) {
    const a = data.activity
    const nb = Math.max(1, Math.ceil((a.hours * 60) / a.bin))
    const left = axis ? 24 : 0
    const bottom = axis ? 16 : 0
    const w = width - left
    const bw = w / nb
    const h = height - bottom
    const bins = binsOf(rows)
    const max = ymax || Math.max(1, ...[...bins.values()].map((p) => Object.values(p).reduce((s, v) => s + v, 0)))
    const s = fill
      ? svg('svg', { class: 'chart', width: '100%', height, viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'none' })
      : svg('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}` })
    if (axis) {
      svg('line', { class: 'base', x1: left, x2: width, y1: h + 0.5, y2: h + 0.5 }, s)
      svg('text', { x: left - 5, y: 8, 'text-anchor': 'end' }, s).textContent = String(max)
      svg('text', { x: left - 5, y: h, 'text-anchor': 'end' }, s).textContent = '0'
      const step = a.hours > 12 ? 4 : a.hours > 6 ? 2 : 1
      for (let t = 0; t <= a.hours; t += step) {
        const x = left + ((t * 60) / a.bin) * bw
        svg('text', { x, y: height - 3, 'text-anchor': t === 0 ? 'start' : 'middle' }, s).textContent = `${t}h`
      }
    }
    const order = partsOrder()
    for (const [b, parts] of bins) {
      let y = h
      for (const p of order) {
        const n = parts[p]
        if (!n) continue
        const bh = (n / max) * (h - 2)
        y -= bh
        const r = svg('rect', { x: left + b * bw + 0.5, y, width: Math.max(1, bw - 1), height: bh, style: `fill:${partColour(p)}` }, s)
        svg('title', {}, r).textContent = `${since((b * a.bin) / 60)} to ${since(((b + 1) * a.bin) / 60)}: ${n} ${label ? (p === 'marked' ? label.name : 'other') : p}`
      }
    }
    brush(s, { left, h, nb, bw })
    return s
  }
  function brush(s, { left, h, nb, bw }) {
    const a = data.activity
    const hoursAt = (x) => Math.max(0, Math.min(nb, (x - left) / bw)) * (a.bin / 60)
    const xAt = (hours) => left + ((hours * 60) / a.bin) * bw
    const rect = svg('rect', { class: 'brush', y: 0, height: h, x: 0, width: 0, visibility: 'hidden' }, s)
    const show = (h0, h1) => {
      rect.setAttribute('x', xAt(h0))
      rect.setAttribute('width', Math.max(1, xAt(h1) - xAt(h0)))
      rect.setAttribute('visibility', 'visible')
    }
    if (S.range) show(S.range[0], S.range[1])
    let from = null
    // pointer positions in the drawing's own units, which a chart that fills its cell scales
    const local = (e) => {
      const box = s.getBoundingClientRect()
      return ((e.clientX - box.left) * s.viewBox.baseVal.width) / Math.max(1, box.width)
    }
    s.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return
      from = local(e)
      s.setPointerCapture(e.pointerId)
      e.stopPropagation()
    })
    s.addEventListener('pointermove', (e) => {
      if (from == null) return
      const x = local(e)
      show(hoursAt(Math.min(from, x)), hoursAt(Math.max(from, x)))
    })
    s.addEventListener('click', (e) => e.stopPropagation())
    s.addEventListener('pointerup', (e) => {
      if (from == null) return
      const x = local(e)
      const snap = (v, up) => (Math[up ? 'ceil' : 'floor']((v * 60) / a.bin) * a.bin) / 60
      let h0 = snap(hoursAt(Math.min(from, x)), false)
      let h1 = snap(hoursAt(Math.max(from, x)), true)
      if (h1 - h0 < a.bin / 60) h1 = h0 + a.bin / 60
      from = null
      S.range = [Math.round(h0 * 1000) / 1000, Math.round(h1 * 1000) / 1000]
      load()
    })
  }
  function legend() {
    const box = el('div', 'legend')
    const present = new Set(data.activity.rows.map((r) => r[2]))
    const parts = label ? ['marked', 'other'] : Object.keys(ACTIONS).filter((a) => present.has(a))
    for (const p of parts) {
      const item = el('span')
      const sw = el('i')
      sw.style.background = partColour(p)
      item.append(sw, label ? (p === 'marked' ? label.name : 'other records') : p)
      box.append(item)
    }
    box.append(el('span', 'per', `per ${data.activity.bin} min`))
    return box
  }
  // the hours under the runs' activity in compare mode, placed as a share of the column's width
  function axisRow() {
    const a = data.activity
    const box = el('div', 'axisrow')
    const span = Math.max(1, Math.ceil((a.hours * 60) / a.bin)) * (a.bin / 60)
    const step = a.hours > 12 ? 4 : a.hours > 6 ? 2 : 1
    for (let t = 0; t <= a.hours; t += step) {
      const tick = el('span', null, `${t}h`)
      tick.style.left = `${(t / span) * 100}%`
      box.append(tick)
    }
    return box
  }
  function drawActivity() {
    const box = $('#activity')
    if (S.compare) return box.replaceChildren()
    const width = Math.max(240, box.clientWidth || 320)
    const narrow = $('#main').classList.contains('w-s')
    box.replaceChildren(legend(), chart(data.activity.rows, { width, height: narrow ? 92 : 118, axis: true }))
  }

  // ------------------------------------------------------------------------------------------------ filters
  function facet(name) {
    return (data.facets && data.facets[name]) || []
  }
  function drawFilters() {
    const t = TABS[S.tab]
    const box = $('#filters')
    const top = el('div', 'frow')
    const fields = el('div', 'frow')
    const search = el('input', 'field')
    search.type = 'search'
    search.placeholder = `Search ${t.name.toLowerCase()}`
    search.setAttribute('aria-label', `Search ${t.name.toLowerCase()}`)
    search.value = S.q
    let typing = null
    search.addEventListener('input', () => {
      clearTimeout(typing)
      typing = setTimeout(() => {
        S.q = search.value
        load()
      }, 180)
    })
    top.append(search)
    if (t.states) {
      const seg = el('div', 'seg seg-track')
      const counts = Object.fromEntries(facet('state'))
      const total = Object.values(counts).reduce((s, v) => s + v, 0)
      for (const st of [null, ...t.states]) {
        if (st && !counts[st] && S.filters.state !== st) continue
        const b = el('button', 'seg-opt' + ((S.filters.state || null) === st ? ' active' : ''), st ? st[0].toUpperCase() + st.slice(1) + ' ' : 'All ')
        b.append(el('span', 'n', String(st ? counts[st] || 0 : total)))
        b.onclick = () => setFilter('state', st)
        seg.append(b)
      }
      top.append(seg)
    }
    if (t.sorts.length) {
      const sel = el('select', 'field')
      sel.setAttribute('aria-label', 'Sort')
      for (const [v, text] of t.sorts) sel.append(new Option(text, v, false, (S.sort || t.sorts[0][0]) === v))
      sel.onchange = () => {
        S.sort = sel.value
        load()
      }
      top.append(sel)
    }
    if (S.tab === 'agents') {
      const seg = el('div', 'seg seg-track')
      for (const [v, text] of [['table', 'Table'], ['matrix', 'Who reviewed whom']]) {
        const b = el('button', 'seg-opt' + (S.agentView === v ? ' active' : ''), text)
        b.onclick = () => {
          S.agentView = v
          drawFilters()
          drawList()
        }
        seg.append(b)
      }
      top.append(seg)
    }
    top.append(el('span', 'total', plural(data.total, t.noun)))
    for (const [name, any] of t.selects) {
      const values = facet(name)
      if (!values.length) continue
      const sel = el('select', 'field' + (S.filters[name] ? ' set' : ''))
      sel.setAttribute('aria-label', any)
      sel.append(new Option(any, ''))
      for (const [v, n] of values) sel.append(new Option(`${v} (${n})`, v, false, S.filters[name] === v))
      sel.onchange = () => setFilter(name, sel.value || null)
      fields.append(sel)
    }
    if (S.range) {
      const c = el('button', 'chip chip-sans chip-tone-neutral chip-act active', `${since(S.range[0])} to ${since(S.range[1])} ✕`)
      c.setAttribute('aria-label', 'Clear the time range')
      c.onclick = () => {
        S.range = null
        load()
      }
      fields.append(c)
    }
    if (Object.keys(S.filters).length || S.q || S.range) {
      const clear = el('button', 'btn btn-ghost btn-sm', 'Clear')
      clear.onclick = () => {
        Object.assign(S, { filters: {}, q: '', range: null })
        load()
      }
      fields.append(clear)
    }
    const hadFocus = document.activeElement && document.activeElement.type === 'search'
    box.replaceChildren(...[top, fields].filter((r) => r.childNodes.length))
    if (hadFocus) {
      search.focus()
      search.setSelectionRange(search.value.length, search.value.length)
    }
    document.documentElement.style.setProperty('--filters-h', `${box.offsetHeight}px`)
  }
  function setFilter(name, value) {
    if (value) S.filters[name] = value
    else delete S.filters[name]
    load()
  }

  // ------------------------------------------------------------------------------------------------ lists
  // A unit's records on the shared time axis of the run, one tick per record in its action's colour, or while a label
  // is on in the label's colour for the records it marks and in ink for the rest.
  function strip(ticks, width, height) {
    const a = data.activity
    const s = svg('svg', { class: 'strip', width, height, viewBox: `0 0 ${width} ${height}` })
    svg('line', { x1: 0, x2: width, y1: height / 2, y2: height / 2, style: 'stroke:var(--border-subtle)' }, s)
    const span = Math.max(0.5, a.hours)
    for (const [ref, h, act, marked] of ticks) {
      const colour = label ? (marked ? label.colour : 'var(--viz-ink-3)') : colourOf(act)
      const r = svg('rect', { x: Math.min(width - 2, (Math.max(0, h) / span) * width), y: 1, width: 2, height: height - 2, style: `fill:${colour}` }, s)
      r.dataset.anchor = ref
      svg('title', {}, r).textContent = `${act} ${since(h)}`
    }
    return s
  }
  function chipFor(run) {
    return el('span', 'chip chip-tone-neutral', run)
  }
  function who(name, filterName) {
    const b = el('button', 'lnk', name)
    b.onclick = (e) => {
      e.stopPropagation()
      setFilter(filterName, name)
    }
    return b
  }
  function openKey(key) {
    thimble.navigate(unitRef(key))
  }
  function unitLink(text, key) {
    const b = el('button', 'lnk', text)
    b.onclick = (e) => {
      e.stopPropagation()
      openKey(key)
    }
    return b
  }
  function rowBase(item, name) {
    const row = el('div', 'row' + (unit && unit.key === item.key ? ' active' : ''))
    row.dataset.anchor = unitRef(item.key)
    row.dataset.anchorName = name
    row.onclick = () => openKey(item.key)
    return row
  }
  function countsBox(pairs) {
    const box = el('div', 'counts')
    for (const [ic, n, tip] of pairs) {
      const s = el('span')
      s.title = tip
      if (n) {
        const i = icon(ic)
        i.style.color = label ? 'var(--text-tertiary)' : colourOf(COUNT_ACTION[ic])
        s.append(i, String(n))
      }
      box.append(s)
    }
    return box
  }
  function stripWidth() {
    const m = $('#main')
    return m.classList.contains('w-s') ? 110 : m.classList.contains('w-m') ? 170 : 240
  }
  function titleLine(text, number, run) {
    const t = el('div', 't')
    const title = el('span', 'title', text)
    title.title = text
    t.append(title)
    if (number != null) t.append(el('span', 'num', `#${number}`))
    t.append(chipFor(run))
    return t
  }
  // each reviewer's latest verdict, as the row's own column
  function reviewers(latest) {
    const box = el('div', 'revs')
    for (const [name, verdict] of Object.entries(latest || {})) {
      const s = el('span')
      const ic = icon(ACTION_ICON[verdict] || 'comment')
      ic.style.color = label ? 'var(--text-tertiary)' : colourOf(verdict)
      s.append(ic, name)
      s.title = `${name}: ${verdict}`
      box.append(s)
    }
    return box
  }
  function pullRow(p) {
    const row = rowBase(p, `pull request ${p.run} #${p.number}, ${p.title}`)
    const main = el('div')
    const t = titleLine(p.title, p.number, p.run)
    const meta = el('div', 'meta')
    meta.append('by ', who(p.author, 'author'))
    if (p.state === 'merged') meta.append(` · merged by ${p.merged_by} ${dur(p.to_merge)} after opening`)
    else if (p.state === 'closed') meta.append(` · closed by ${p.closed_by} as ${p.reason}`)
    else meta.append(` · open for ${dur(data.runs.find((r) => r.run === p.run).hours - p.at)}`)
    if (p.closes != null) meta.append(' · closes ', unitLink(`#${p.closes}`, `${p.run}/issues/${p.closes}`))
    meta.append(' · ', who(p.area, 'area'))
    main.append(t, meta)
    if (p.why && p.why.text) main.append(whyLine(p.why))
    // a row names who opened and who merged it, so its chips leave out the self-merge flag
    const loud = p.flags.filter((f) => f !== 'merged by its author')
    if (loud.length) {
      const f = el('div', 'flags')
      for (const x of loud) {
        const c = el('button', `chip chip-sans chip-act ${flagTone()}`, x)
        c.onclick = (e) => {
          e.stopPropagation()
          setFilter('flag', x)
        }
        f.append(c)
      }
      main.append(f)
    }
    row.append(stateIcon('pulls', p.state), main, reviewers(p.latest), strip(p.ticks, stripWidth(), 14),
      countsBox([['approved', p.approvals, 'reviewers who approved'], ['changes', p.changes, 'reviewers requesting changes'], ['commit', p.commits, 'commits'], ['comment', p.comments, 'comments']]))
    return row
  }
  // a closed unit's close record, in the closer's words
  function whyLine(why) {
    const q = el('div', 'why', why.text)
    q.dataset.anchor = why.ref
    q.title = why.text
    return q
  }
  function issueRow(i) {
    const row = rowBase(i, `issue ${i.run} #${i.number}, ${i.title}`)
    const main = el('div')
    const t = titleLine(i.title, i.number, i.run)
    const meta = el('div', 'meta')
    meta.append('opened by ', who(i.author, 'author'), i.origin === 'backlog' ? ' in the backlog' : ` ${since(i.at)}`)
    if (i.state === 'fixed') meta.append(' · fixed by ', unitLink(`#${i.fixed_by}`, `${i.run}/pull/${i.fixed_by}`), i.origin === 'backlog' ? ` at ${since(i.ended)}` : ` ${dur(i.ended - i.at)} after it opened`)
    else if (i.state === 'closed') meta.append(` · closed by ${i.closed_by} as ${i.reason}`)
    else if (i.prs.length) meta.append(` · ${i.prs.length === 1 ? 'pull request' : 'pull requests'} ${i.prs.map((n) => '#' + n).join(', ')} not merged`)
    meta.append(' · ', who(i.area, 'area'))
    main.append(t, meta)
    if (i.why && i.why.text) main.append(whyLine(i.why))
    row.append(stateIcon('issues', i.state), main, el('div'), strip(i.ticks, stripWidth(), 14), countsBox([['pr', i.prs.length, 'pull requests that close it'], ['comment', i.comments, 'comments']]))
    return row
  }
  function threadRow(d) {
    const row = rowBase(d, `discussion ${d.run}, ${d.title}`)
    const main = el('div')
    const t = titleLine(d.title || `Discussion ${d.number}`, null, d.run)
    const meta = el('div', 'meta')
    meta.append('started by ', who(d.author, 'author'), ` · ${d.posters.length} posting`)
    if (d.mentions.length) meta.append(` · mentions ${[...d.mentions].sort((a, b) => a - b).map((n) => '#' + n).join(', ')}`)
    main.append(t, meta)
    row.append(stateIcon('discussions'), main, el('div'), strip(d.ticks, stripWidth(), 14), countsBox([['comment', d.posts, 'posts']]))
    return row
  }

  function agentTable(items) {
    const table = el('table', 'table agents')
    const hr = el('tr')
    hr.append(el('th', null, 'Agent'), el('th', null, 'Activity'))
    for (const [k, text] of AGENT_COLS) {
      const th = el('th', 'n' + (k === 'comments' || k === 'posts' ? ' opt' : ''))
      const b = el('button', S.agentSort === k ? 'on' : '', text + (S.agentSort === k ? ' ↓' : ''))
      b.onclick = () => {
        S.agentSort = k
        load()
      }
      th.append(b)
      hr.append(th)
    }
    const thead = el('thead')
    thead.append(hr)
    const body = el('tbody')
    for (const a of items) {
      const tr = el('tr', unit && unit.key === a.key ? 'active' : '')
      tr.dataset.anchor = unitRef(a.key)
      tr.dataset.anchorName = `the agent ${a.name} of ${a.run}`
      const name = el('td')
      name.append(el('span', 'who', a.name + ' '), chipFor(a.run))
      const act = el('td')
      act.append(strip(a.ticks, stripWidth(), 14))
      tr.append(name, act)
      for (const [k] of AGENT_COLS) tr.append(el('td', 'n' + (k === 'comments' || k === 'posts' ? ' opt' : ''), String(a[k])))
      tr.onclick = () => openKey(a.key)
      body.append(tr)
    }
    table.append(thead, body)
    return table
  }
  // One matrix per chosen run: who reviewed whose pull requests, a cell's shade its approvals and its orange count its
  // change requests, with pairs that approved each other outlined. A cell opens those pull requests.
  function matrices() {
    const box = el('div', 'matrices')
    for (const run of data.chosen) {
      const pairs = data.pairs[run] || {}
      const names = [...new Set([...Object.keys(pairs), ...Object.values(pairs).flatMap((p) => Object.keys(p))])].sort()
      if (!names.length) continue
      const info = data.runs.find((r) => r.run === run)
      const max = Math.max(1, ...Object.values(pairs).flatMap((p) => Object.values(p).map((v) => v[0])))
      const t = el('table', 'matrix')
      const cap = el('caption')
      cap.append(chipFor(run), ` ${setup(info)}`)
      t.append(cap)
      const hr = el('tr')
      const corner = el('th', 'axis')
      corner.append('author →', el('br'), 'reviewer ↓')
      hr.append(corner)
      for (const n of names) hr.append(el('th', 'to', n))
      t.append(hr)
      for (const rev of names) {
        const tr = el('tr')
        tr.append(el('th', 'by', rev))
        for (const auth of names) {
          const td = el('td')
          if (rev === auth) {
            td.className = 'self'
          } else {
            const [ok, cr] = (pairs[rev] && pairs[rev][auth]) || [0, 0]
            const back = (pairs[auth] && pairs[auth][rev]) || [0, 0]
            if (ok) {
              td.append(String(ok))
              td.style.background = label ? '' : `color-mix(in oklab, var(--viz-3) ${Math.round(18 + (ok / max) * 50)}%, transparent)`
            }
            if (cr) td.append(el('span', 'cr', `✗${cr}`))
            if (ok && back[0]) td.classList.add('mutual')
            td.title = `${rev} reviewed ${auth}: ${ok} approved, ${cr} changes requested`
            td.onclick = () => {
              Object.assign(S, { tab: 'pulls', runs: [run], filters: { reviewer: rev, author: auth }, sort: '', q: '' })
              load()
            }
          }
          tr.append(td)
        }
        t.append(tr)
      }
      box.append(t)
    }
    return box
  }

  // Compare: the pull requests or issues issue by issue, one column per chosen run.
  function grid() {
    const table = el('table', 'grid')
    const hr = el('tr')
    hr.append(el('th', null, 'Issue'))
    const runs = data.runs.filter((r) => data.chosen.includes(r.run))
    for (const r of runs) {
      const th = el('th')
      const sub = el('span', 'sub')
      sub.append(`${r.team} agents`, el('br'), `${r.approvals} approval${r.approvals === 1 ? '' : 's'}`)
      th.append(chipFor(r.run), sub)
      hr.append(th)
    }
    const thead = el('thead')
    thead.append(hr)
    const body = el('tbody')
    for (const g of data.grid) {
      const tr = el('tr')
      const td = el('td', 'issue')
      const t = el('div', 't')
      if (g.number != null) t.append(el('span', 'n', `#${g.number}`))
      t.append(g.title || 'No linked issue')
      t.title = g.title
      td.append(t)
      tr.append(td)
      for (const r of runs) {
        const cell = el('td')
        const box = el('div', 'cell')
        for (const c of g.cells[r.run] || []) box.append(gridChip(c))
        if (!box.childNodes.length) box.append(el('span', 'none', '–'))
        cell.append(box)
        tr.append(cell)
      }
      body.append(tr)
    }
    table.append(thead, body)
    return table
  }
  function gridChip(c) {
    const b = el('button', 'chip chip-sans chip-tone-neutral chip-act')
    b.dataset.anchor = unitRef(c.key)
    if (S.tab === 'pulls') {
      b.dataset.anchorName = `pull request #${c.number}`
      b.append(stateIcon('pulls', c.state), `#${c.number}`, el('span', 'dim', c.state === 'merged' ? dur(c.to_merge) : c.state))
      b.title = `${c.author}${c.flags.length ? ': ' + c.flags.join(', ') : ''}`
    } else {
      b.dataset.anchorName = `issue #${c.number}`
      b.append(stateIcon('issues', c.state), c.state === 'fixed' ? `#${c.fixed_by}` : c.state, el('span', 'dim', c.state === 'fixed' ? dur(c.to_fix) : c.prs.length ? c.prs.map((n) => '#' + n).join(' ') : ''))
    }
    b.onclick = () => openKey(c.key)
    return b
  }
  // Compare for discussions and agents: one column per chosen run.
  function columns(items) {
    const box = el('div', 'cols')
    for (const run of data.chosen) {
      const col = el('div')
      const info = data.runs.find((r) => r.run === run)
      const h = el('h3')
      h.append(chipFor(run), el('span', 'sub', setup(info)))
      col.append(h)
      const mine = items.filter((x) => x.run === run)
      if (S.tab === 'agents') col.append(agentMini(mine))
      for (const it of S.tab === 'agents' ? [] : mine) {
        const row = el('div', 'list-row' + (unit && unit.key === it.key ? ' active' : ''))
        row.dataset.anchor = unitRef(it.key)
        row.dataset.anchorName = `the discussion ${it.title}`
        const name = el('span', 'name', it.title)
        name.title = it.title
        row.append(stateIcon('discussions'), name, el('span', 'mono dim', String(it.posts)))
        row.onclick = () => openKey(it.key)
        col.append(row)
      }
      box.append(col)
    }
    return box
  }
  // one run's agents with the counts a comparison needs, sorted as the table is
  const MINI = [['opened', 'PRs'], ['merges', 'Merges'], ['reviews', 'Reviews']]
  function agentMini(items) {
    const table = el('table', 'table agents mini')
    const hr = el('tr')
    hr.append(el('th', null, 'Agent'))
    for (const [k, text] of MINI) {
      const th = el('th', 'n')
      const b = el('button', S.agentSort === k ? 'on' : '', text + (S.agentSort === k ? ' ↓' : ''))
      b.onclick = () => {
        S.agentSort = k
        load()
      }
      th.append(b)
      hr.append(th)
    }
    const thead = el('thead')
    thead.append(hr)
    const body = el('tbody')
    for (const a of items) {
      const tr = el('tr', unit && unit.key === a.key ? 'active' : '')
      tr.dataset.anchor = unitRef(a.key)
      tr.dataset.anchorName = `the agent ${a.name} of ${a.run}`
      tr.append(el('td', 'who', a.name))
      for (const [k] of MINI) tr.append(el('td', 'n', String(a[k])))
      tr.onclick = () => openKey(a.key)
      body.append(tr)
    }

  }

  function drawList() {
    const box = $('#list')
    const items = data.items
    const parts = []
    if (!items.length) parts.push(el('div', 'empty', `No ${TABS[S.tab].noun[1]} match.`))
    else if (S.tab === 'agents') parts.push(S.agentView === 'matrix' ? matrices() : S.compare ? columns(items) : agentTable(items))
    else if (S.compare && data.grid) parts.push(grid())
    else if (S.compare) parts.push(columns(items))
    else parts.push(...items.map(S.tab === 'pulls' ? pullRow : S.tab === 'issues' ? issueRow : threadRow))
    if (items.length && items.length < data.total && !(S.compare && data.grid)) {
      const b = el('button', 'btn btn-secondary btn-sm more', `${data.total - items.length} more`)
      b.onclick = more
      parts.push(b)
    }
    box.replaceChildren(...parts)
  }

  // ------------------------------------------------------------------------------------------------ details
  function tabOf(key) {
    const kind = key.split('/')[1]
    return { pull: 'pulls', issues: 'issues', discussions: 'discussions', agents: 'agents' }[kind]
  }
  async function openUnit(key, ref) {
    focusRef = ref || null
    unit = await thimble.fetch({ op: 'unit', key })
    document.body.classList.toggle('open', !!unit)
    drawDetail()
    for (const r of document.querySelectorAll('.row, .agents tbody tr, .cols .list-row')) r.classList.toggle('active', r.dataset.anchor === unitRef(key))
  }
  function closeUnit() {
    unit = null
    focusRef = null
    document.body.classList.remove('open')
    $('#detail').replaceChildren()
    for (const r of document.querySelectorAll('.row.active, tr.active, .list-row.active')) r.classList.remove('active')
    layout()
  }
  function linkText(text, links) {
    const frag = document.createDocumentFragment()
    let last = 0
    for (const m of String(text || '').matchAll(/#(\d+)\b/g)) {
      const key = links && links[m[1]]
      if (!key) continue
      frag.append(text.slice(last, m.index))
      const b = el('button', 'lnk', m[0])
      b.style.textDecoration = 'underline'
      b.onclick = () => openKey(key)
      frag.append(b)
      last = m.index + m[0].length
    }
    frag.append(String(text || '').slice(last))
    return frag
  }
  const VERB = { opened: 'opened this', pushed: 'pushed', approved: 'approved', 'changes requested': 'requested changes', commented: 'commented', posted: 'posted', merged: 'merged this', closed: 'closed this', 'signed off': 'signed off' }
  // on an agent's page each record names the pull request or issue it was on
  const ON = { opened: 'opened', pushed: 'pushed to', approved: 'approved', 'changes requested': 'requested changes on', commented: 'commented on', merged: 'merged', closed: 'closed' }
  function event(x, links) {
    const e = el('div', 'ev' + (x.ref === focusRef ? ' focus' : '') + (x.text && x.kind !== 'commit' ? ' boxed' : ''))
    e.dataset.anchor = x.ref
    e.dataset.anchorName = `${x.author}'s ${x.kind} at ${x.at}`
    if (x.text) e.dataset.anchorText = x.text
    const fixes = unit.tab === 'issues' && x.kind === 'merge'
    const dot = el('span', 'dot')
    const ic = icon(x.kind === 'issue' ? 'issue' : fixes ? 'fixed' : ACTION_ICON[x.action] || 'comment')
    ic.style.color = label ? 'var(--text-secondary)' : colourOf(fixes ? 'fixed' : x.action)
    dot.append(ic)
    const body = el('div')
    const head = el('div', 'head')
    head.append(el('b', null, x.author), ' ')
    if (fixes) head.append('merged ', linkText(`#${x.number}`, links), ', which fixes this')
    else if (x.kind === 'issue' && x.hours <= 0) head.append('reported this in the backlog')
    else if (unit.tab === 'agents' && x.number != null) head.append(`${ON[x.action] || x.action} `, linkText(`#${x.number}`, links), x.title ? ` ${x.title}` : '')
    else if (x.kind === 'close') head.append(`closed this as ${x.reason}`)
    else if (x.kind === 'commit') head.append('pushed ', el('span', 'sha', x.sha))
    else head.append(VERB[x.action] || x.action)
    const when = el('span', 'when', since(x.hours))
    when.title = clock(x.at)
    head.append(when)
    body.append(head)
    if (x.text) {
      const text = el('div', 'text')
      text.append(x.kind === 'commit' ? x.text : linkText(x.text, links))
      body.append(text)
    }
    e.append(dot, body)
    return e
  }
  function factsSection(title, ...content) {
    const s = el('section')
    s.append(el('h4', null, title), ...content)
    return s
  }
  function kv(pairs) {
    const box = el('div', 'kv')
    for (const [k, v] of pairs) box.append(el('span', null, k), el('span', null, v))
    return box
  }
  function unitChip(p, tab) {
    const b = el('button', 'chip chip-sans chip-tone-neutral chip-act')
    b.dataset.anchor = unitRef(p.key)
    b.append(stateIcon(tab, p.state), `#${p.number}`)
    b.title = p.title || ''
    b.onclick = () => openKey(p.key)
    return b
  }
  // the same backlog issue in every run, with the pull requests each run opened for it
  function everyRun(list, here) {
    const box = el('div', 'runsgrid')
    for (const r of list) {
      const c = el('span', 'chip chip-tone-neutral' + (r.run === here ? ' active' : ''), r.run)
      const cell = el('div', 'cell')
      if (unit.tab === 'pulls') {
        for (const p of r.prs) cell.append(unitChip(p, 'pulls'))
        if (!r.prs.length) cell.append(el('span', 'dim', 'no pull request'))
      } else {
        cell.append(unitChip({ key: r.key, number: unit.number, state: r.state }, 'issues'))
        for (const p of r.prs) cell.append(unitChip(p, 'pulls'))
      }
      box.append(c, cell)
    }
    return box
  }
  function drawDetail() {
    const box = $('#detail')
    if (!unit) return box.replaceChildren()
    const u = unit
    const nav = el('div', 'dnav')
    const back = el('button', 'btn btn-ghost btn-sm', `‹ ${TABS[u.tab].name}`)
    back.onclick = closeUnit
    const step = el('div')
    const keys = data ? data.items.map((x) => x.key) : []
    const at = keys.indexOf(u.key)
    for (const [text, d, aria] of [['‹', -1, 'Previous'], ['›', 1, 'Next']]) {
      const b = el('button', 'btn btn-ghost btn-sm', text)
      b.setAttribute('aria-label', aria)
      b.disabled = at < 0 || !keys[at + d]
      b.onclick = () => openKey(keys[at + d])
      step.append(b)
    }
    nav.append(back, step)

    const head = el('div', 'dhead')
    head.dataset.anchor = unitRef(u.key)
    const h1 = el('h1')
    const sub = el('div', 'sub')
    const runChip = el('button', 'chip chip-sans chip-tone-neutral chip-act', `${u.run} · ${setup(u.setup)}`)
    runChip.onclick = () => onlyRun(u.run)
    if (u.tab === 'pulls' || u.tab === 'issues') {
      h1.append(u.title, ' ', el('span', 'num', `#${u.number}`))
      const st = el('span', 'chip chip-sans chip-tone-neutral')
      st.append(stateIcon(u.tab, u.state), u.state[0].toUpperCase() + u.state.slice(1))
      sub.append(st)
      if (u.tab === 'pulls') {
        const whose = (by) => (by === u.author ? 'their own pull request' : `${u.author}'s pull request`)
        sub.append(u.state === 'merged' ? `${u.merged_by} merged ${whose(u.merged_by)} ${dur(u.to_merge)} after it opened`
          : u.state === 'closed' ? `${u.closed_by} closed ${whose(u.closed_by)} as ${u.reason}` : `${u.author} opened this ${since(u.at)}`)
      } else {
        sub.append(u.origin === 'backlog' ? `${u.author} reported this in the backlog` : `${u.author} opened this ${since(u.at)}`)
      }
      head.dataset.anchorName = `${u.tab === 'pulls' ? 'pull request' : 'issue'} ${u.run} #${u.number}`
    } else if (u.tab === 'discussions') {
      h1.append(u.title || `Discussion ${u.number}`)
      sub.append(`${u.author} started this · ${plural(u.posts, ['post', 'posts'])} by ${u.posters.length}`)
      head.dataset.anchorName = `the discussion ${u.title}`
    } else {
      h1.append(u.name)
      sub.append(`${u.opened} opened · ${u.merges} merges · ${u.approved} approvals · ${u.changes} change requests · ${u.posts} posts`)
      head.dataset.anchorName = `the agent ${u.name} of ${u.run}`
    }
    sub.append(runChip)
    head.append(h1, sub)

    const main = el('div')
    const facts = el('div', 'facts')
    const links = u.links || {}
    if (u.tab === 'agents') {
      const note = u.records.find((x) => x.kind === 'agent')
      if (note) {
        const n = el('p', 'note')
        n.dataset.anchor = note.ref
        n.append(note.text)
        main.append(n)
      }
      main.append(strip(u.records.filter((x) => x.kind !== 'agent').map((x) => [x.ref, x.hours, x.action, x.marked]), 420, 18))
      main.lastChild.classList.add('dstrip')
    }
    const tl = el('div', 'timeline')
    for (const x of u.records) if (!(u.tab === 'agents' && x.kind === 'agent')) tl.append(event(x, links))
    main.append(tl)

    if (u.tab === 'pulls') {
      const revs = el('div')
      for (const [name, verdict] of Object.entries(u.latest)) {
        const line = el('div', 'line')
        const ic = icon(ACTION_ICON[verdict] || 'comment')
        ic.style.color = label ? 'var(--text-secondary)' : colourOf(verdict)
        line.append(ic, el('span', 'grow', name), el('span', 'dim', verdict))
        revs.append(line)
      }
      if (!revs.childNodes.length) revs.append(el('span', 'dim', 'No reviews'))
      facts.append(factsSection('Reviewers', revs))
      if (u.issue) {
        const line = el('div', 'line')
        line.append(unitChip(u.issue, 'issues'), el('span', 'grow', u.issue.title))
        line.lastChild.title = u.issue.title
        facts.append(factsSection('Closes', line))
      }
      facts.append(factsSection('Timing', kv([['opened', since(u.at)], ['first review', u.first_review == null ? '–' : `${dur(u.first_review)} later`],
        [u.state === 'closed' ? 'closed' : 'merged', u.ended == null ? '–' : since(u.ended)], ['commits', String(u.commits.length)]])))
      if (u.flags.length) {
        const f = el('div', 'flags')
        f.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px'
        for (const x of u.flags) f.append(el('span', `chip chip-sans ${flagTone()}`, x))
        facts.append(factsSection('Flags', f))
      }
    }
    if (u.tab === 'issues') {
      const prs = el('div', 'cell')
      prs.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px'
      for (const p of u.pulls) prs.append(unitChip(p, 'pulls'))
      if (!u.pulls.length) prs.append(el('span', 'dim', 'None'))
      facts.append(factsSection('Pull requests', prs), factsSection('Details', kv([['area', u.area], ['origin', u.origin], ['comments', String(u.comments)]])))
    }
    if ((u.tab === 'pulls' || u.tab === 'issues') && u.elsewhere && u.elsewhere.length > 1) facts.append(factsSection('In every run', everyRun(u.elsewhere, u.run)))
    if (u.tab === 'discussions') {
      const people = el('div')
      people.append(u.posters.join(', '))
      facts.append(factsSection('Posting', people))
      if (Object.keys(links).length) {
        const m = el('div')
        m.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px'
        for (const [n, key] of Object.entries(links)) {
          const b = el('button', 'chip chip-sans chip-tone-neutral chip-act', `#${n}`)
          b.dataset.anchor = unitRef(key)
          b.onclick = () => openKey(key)
          m.append(b)
        }
        facts.append(factsSection('Mentions', m))
      }
    }
    if (u.tab === 'agents') {
      const t = el('div', 'kv')
      const names = [...new Set([...Object.keys(u.partners), ...Object.keys(u.reviewed_by)])].sort()
      for (const n of names) {
        const gave = u.partners[n] || [0, 0]
        const got = u.reviewed_by[n] || [0, 0]
        t.append(el('span', null, n), el('span', null, `gave ${gave[0]}✓ ${gave[1]}✗ · got ${got[0]}✓ ${got[1]}✗`))
      }
      if (names.length) facts.append(factsSection('Review partners', t))
      if (u.pulls.length) {
        const prs = el('div')
        prs.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px'
        for (const p of u.pulls) prs.append(unitChip(p, 'pulls'))
        facts.append(factsSection('Pull requests opened', prs))
      }
    }
    const body = el('div', 'dbody')
    body.append(main, facts)
    box.replaceChildren(nav, head, body)
    box.classList.toggle('dnarrow', box.clientWidth < 620)
    const hit = box.querySelector('.ev.focus')
    if (hit) hit.scrollIntoView({ block: 'center' })
    else box.scrollTop = 0
  }

  // ------------------------------------------------------------------------------------------------ layout and events
  function layout() {
    const w = document.body.clientWidth
    document.body.classList.toggle('narrow', w < WIDE)
    const m = $('#main').clientWidth || w
    const main = $('#main')
    main.classList.toggle('w-s', m < 900)
    main.classList.toggle('w-m', m >= 900 && m < 1300)
    if ($('#detail').clientWidth) $('#detail').classList.toggle('dnarrow', $('#detail').clientWidth < 620)
  }
  let lastWidth = 0
  new ResizeObserver(() => {
    layout()
    const w = $('#main').clientWidth
    if (data && Math.abs(w - lastWidth) > 4) {
      lastWidth = w
      drawRuns()
      drawActivity()
    }
  }).observe(document.body)
  for (const b of document.querySelectorAll('#mode .seg-opt')) {
    b.onclick = () => {
      S.compare = b.dataset.mode === 'compare'
      load()
    }
  }

  thimble.onOpen(async (place) => {
    const t = (place && place.target) || {}
    layout()
    if (t.run) {
      S.runs = [t.run]
      closeUnit()
    }
    if (t.key && tabOf(t.key) && tabOf(t.key) !== S.tab) Object.assign(S, { tab: tabOf(t.key), filters: {}, sort: '', q: '' })
    if (!data || t.run || (t.key && data.tab !== S.tab)) await load()
    if (t.key) await openUnit(t.key, t.ref)
    layout()
  })
  thimble.onLabels(async (state) => {
    label = state.labels[0] || null
    if (!data) return // the first fetch reads them
    await load()
    if (unit) await openUnit(unit.key, focusRef)
  })
</script>
</body>
</html>
