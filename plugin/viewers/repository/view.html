<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .table, .chip), its Color by control, its time range selector and its axis come with the
     frame; this page lays out the top row, the range and the table of items */
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-card); overflow: hidden; }
  * { box-sizing: border-box; }
  #view { height: 100%; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; border-bottom: 1px solid var(--border-subtle); }
  .search { flex: 0 1 180px; min-width: 110px; }
  #range { flex: none; padding: 10px 16px 6px; }
  #list { flex: 1; min-height: 0; overflow: auto; }
  .table { table-layout: fixed; }
  .table td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr.item { cursor: pointer; }
  .c-id { width: 76px; }
  /* the activity column's head is the axis of every row's strip, its labels as the axis writes them */
  th.act { text-transform: none; letter-spacing: 0; padding-bottom: 0; }
  .id, .dim { color: var(--text-tertiary); }
  /* a title with its flags after it, in gray (only Color by's choice takes a color), which wrap onto more lines when
     the cell is short of room rather than being cut */
  .table td.t { white-space: normal; }
  .title { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; min-width: 0; }
  .title b { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 var(--text-sm) / 1.4 var(--font-body); }
  .flags { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; max-width: 100%; }
  .flags .chip { max-width: 100%; }
  .strip { display: block; }
  .strip line { stroke: var(--border-strong); }
  .strip rect { fill: var(--viz-ink-3); }
  /* an item opened in place: its records in time order under its line */
  .thimble-details > td { padding: 2px 12px 10px 84px; white-space: normal; }
  .runs { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 0 6px 8px; }
  .rec { display: grid; grid-template-columns: 44px 72px 124px minmax(0, 1fr); gap: 0 10px; padding: 3px 0 3px 8px; }
  .rec.focus { background: var(--surface-selected); }
  .rec time, .rec span { color: var(--text-tertiary); }
  .rec .who { color: var(--text-secondary); }
  .rec .body { white-space: pre-wrap; overflow-wrap: anywhere; font: 400 var(--text-sm) / 1.5 var(--font-body); }
  .rec pre { margin: 4px 0 0; white-space: pre-wrap; color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.45 var(--font-mono); }
  .empty { padding: 28px 16px; color: var(--text-tertiary); }
</style>
</head>
<body>
<div id="view">
  <div class="top">
    <input class="field search" id="q" type="search" placeholder="Search" aria-label="Search">
    <select class="field" id="kind" aria-label="Items">
      <option value="pulls">Pull requests</option>
      <option value="issues">Issues</option>
      <option value="discussions">Discussions</option>
      <option value="agents">Agents</option>
    </select>
    <span id="colour"></span>
  </div>
  <div id="range"></div>
  <div id="list">
    <table class="table">
      <colgroup id="cols"></colgroup>
      <thead><tr id="heads"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<script>
// Several agent runs on one library. Overview: the runs' activity over time in the time range selector, and a table of
// the chosen kind of item, each row with its records as ticks on one shared time scale. Zoom and filter: the
// viewfinder narrows the table to the items active in its range, search and the kind of item narrow it, and the Color by
// chips hide a state, a run, an area or a label's value. Details on demand: a row opens its records in place.
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const $ = (id) => document.getElementById(id)
const slug = (thimble.view && thimble.view.slug) || 'repository'
const TAB = { pull: 'pulls', issues: 'issues', discussions: 'discussions', agents: 'agents' } // the kind of item a key names in its second part
let data = null // the reader's answer for the kind of item (reader.py _view)
let marks = [] // each run's start, a flag on the overview and on the axis
let open = null // the key of the item opened in place
let focus = null // the record a citation opened
let want = null // a place thimble asked for before the items arrived
const units = new Map() // each opened item's records (reader.py _detail)
// the table's columns between Title and the activity strip, each shown only while an item of the kind has a value in it,
// with its width in px
const COLS = [{ key: 'area', title: 'Area', w: 92, td: 'dim' }, { key: 'author', title: 'Author', w: 84 }, { key: 'state', title: 'State', w: 72 }]
let shown = COLS // the columns the items of the kind fill
const ID_W = 76 // px of the Item column (.c-id)
const TITLE_MIN = 48 // px the least Title takes, for its head

const colour = thimble.colorBy({
  mount: '#colour',
  // each field says what it is (from view.json's records), and `meanings` what the values the forge fixes mean
  // (reader.py's notes), which the menu and a chip's hover give; a value with none, such as a run or an area, shows what
  // the field is. `meanings` declares no value, so the values keep the colors the records give them
  fields: [
    {
      name: 'state', title: 'State', description: 'A pull request open, merged or closed by its records; an issue fixed once a pull request that fixes it merged',
      meanings: {
        open: 'A pull request neither merged nor closed, or an issue no merged pull request fixes yet', merged: 'A pull request merged',
        closed: 'A pull request closed without a merge', fixed: 'An issue that a merged pull request fixes',
      },
    },
    { name: 'run', title: 'Run', description: "The run whose folder holds the item" },
    { name: 'area', title: 'Area', description: 'The first label, else the area of the issue it fixes' },
  ],
  chips: 'filter',
  strip: '#list',
  onChange: load,
})
// the runs fall on different days, so the nights between them are narrow breaks
const range = thimble.timeRange({ mount: '#range', gap: 4 * 3600, onChange: draw })
thimble.onReset({ changed: () => open != null, reset: () => { open = null; load() } })

async function load() {
  try {
    data = await thimble.fetch({ op: 'view', tab: $('kind').value, colour: colour.query() }, { key: 'view' })
  } catch (e) {
    if (e.name === 'AbortError') return
    throw e
  }
  colour.counts(data.counts)
  const ev = data.items.flatMap((it) => it.events).filter((e) => colour.isOn(e[2]))
  marks = data.runs.map((r) => ({ t: r.start, label: r.run }))
  range.data({ times: ev.map((e) => e[0]), values: ev.map((e) => e[2]), marks })
  units.clear()
  if (open) await opened(open)
  draw()
  if (want) go()
}

async function opened(key) {
  if (!units.has(key)) units.set(key, await thimble.fetch({ op: 'unit', key }))
  return units.get(key)
}

// the head and the columns for the kind of item: Item, Title, the columns its items fill, and the activity strip,
// whose head is the axis
function heads() {
  const want = COLS.filter((c) => data.items.some((it) => it[c.key] != null && it[c.key] !== ''))
  if (!$('heads').children.length || want.map((c) => c.key).join() !== shown.map((c) => c.key).join()) {
    shown = want
    $('heads').innerHTML = `<th>Item</th><th>Title</th>${shown.map((c) => `<th>${c.title}</th>`).join('')}<th class="act"><div id="axis"></div></th>`
  }
  // the strip: a third of the table and the width of the columns the kind leaves out, so it widens rather than Title,
  // and whatever Title's widest title leaves on one line, so short titles such as the agents' names give it the rest;
  // in px, since a table's column takes no calc() of a share and a length
  const freed = COLS.filter((c) => !shown.includes(c)).reduce((n, c) => n + c.w, 0)
  // the list's width inside the room the kit's tracks take at its right
  const box = getComputedStyle($('list'))
  const w = $('list').clientWidth - parseFloat(box.paddingLeft) - parseFloat(box.paddingRight)
  const left = w - ID_W - shown.reduce((n, c) => n + c.w, 0) - titleWidth(data.items)
  const strip = Math.max(Math.round(w * 0.32) + freed, left)
  $('cols').innerHTML = `<col class="c-id"><col>${shown.map((c) => `<col style="width:${c.w}px">`).join('')}<col style="width:${strip}px">`
}

// the px Title takes for the widest of these titles on one line, with the cell's padding, in the title's own font
const ruler = document.createElement('canvas').getContext('2d')
let fontAsked = false
function titleWidth(items) {
  const probe = document.createElement('table')
  probe.className = 'table'
  probe.style.cssText = 'position:absolute;visibility:hidden;width:auto'
  probe.innerHTML = '<tbody><tr><td class="t"><div class="title"><b>Title</b></div></td></tr></tbody>'
  document.body.appendChild(probe)
  const td = getComputedStyle(probe.querySelector('td'))
  const b = getComputedStyle(probe.querySelector('b'))
  ruler.font = `${b.fontWeight} ${b.fontSize} ${b.fontFamily}`
  // a face still loading is measured again once it has, once
  if (!fontAsked && document.fonts && !document.fonts.check(ruler.font)) {
    fontAsked = true
    document.fonts.load(ruler.font).then(() => data && draw(), () => {})
  }
  const pad = parseFloat(td.paddingLeft) + parseFloat(td.paddingRight)
  probe.remove()
  return Math.ceil(items.reduce((n, it) => Math.max(n, ruler.measureText(it.title || '').width), TITLE_MIN) + pad) + 2
}

function draw() {
  if (!data) return
  heads()
  const q = $('q').value.trim().toLowerCase()
  const rows = data.items.filter((it) => (!q || it.search.includes(q)) && (range.full || it.events.some((e) => range.has(e[0]))))
  const sc = range.scale($('axis').clientWidth)
  thimble.timeAxis('#axis', sc, { marks })
  $('rows').innerHTML = rows.map((it) => row(it, sc)).join('') ||
    `<tr><td colspan="${shown.length + 3}" class="empty">No ${$('kind').selectedOptions[0].text.toLowerCase()}</td></tr>`
}

const flagChip = (f) => `<span class="chip chip-sans chip-tone-neutral" title="${esc(f)}"><span class="chip-text">${esc(f)}</span></span>`
const row = (it, sc) => `<tr class="item${it.key === open ? ' active' : ''}" data-key="${esc(it.key)}" data-anchor="view:${slug}/${esc(it.key)}"${colour.attr(it)}>` +
  `<td class="id">${esc(it.run)}${it.number != null ? ' #' + it.number : ''}</td>` +
  `<td class="t"><div class="title"><b title="${esc(it.title)}">${esc(it.title)}</b>${it.flags.length ? `<span class="flags">${it.flags.map(flagChip).join('')}</span>` : ''}</div></td>` +
  shown.map((c) => `<td${c.td ? ` class="${c.td}"` : ''}>${esc(it[c.key])}</td>`).join('') + `<td>${strip(it, sc)}</td></tr>` +
  (it.key === open && units.has(open) ? details(units.get(open)) : '')

// an item's records in the range as ticks in their Color by colors on the range's scale, over a line from its first
// to its last, so every row reads as a small multiple of the same time
function strip(it, sc) {
  const ev = it.events.filter((e) => range.has(e[0]) && colour.isOn(e[2]))
  if (!ev.length) return ''
  const x = (e) => Math.round(sc.x(e[0]) * 10) / 10
  const tick = (e, c = colour.colourOf(e[2])) => `<rect x="${x(e) - 1}" y="1" width="2" height="10"${c ? ` style="fill:${c}"` : ''}/>`
  return `<svg class="strip" width="${sc.width}" height="12"><line x1="${x(ev[0])}" x2="${x(ev[ev.length - 1])}" y1="6" y2="6"/>${ev.map((e) => tick(e)).join('')}</svg>`
}

// an item opened in place: the same issue in the other runs, then its records
function details(d) {
  const runs = (d.elsewhere || []).map((x) => `<button class="chip chip-sans chip-tone-neutral chip-act" data-go="${esc(x.key)}">${esc(x.run)} #${esc(x.key.split('/')[2])} ${esc(x.state)}</button>`).join('')
  return `<tr class="thimble-details"><td colspan="${shown.length + 3}">${runs ? `<div class="runs">${runs}</div>` : ''}${d.records.map(rec).join('')}</td></tr>`
}

const rec = (r) => `<div class="rec${r.ref === focus ? ' focus' : ''}" data-anchor="${esc(r.ref)}"><time>${r.at.slice(11, 16)}</time>` +
  `<span class="who">${esc(r.author)}</span><span>${esc(r.action)}${r.number != null && !open.endsWith('/' + r.number) ? ' #' + r.number : ''}</span>` +
  `<div class="body">${esc([r.sha, r.reason, r.text].filter(Boolean).join(' · '))}${r.diff ? `<pre>${esc(r.diff)}</pre>` : ''}</div></div>`

// open an item in place, on its kind, with the record `ref` picked; a citation, and an issue in another run, come here
async function show(key, ref) {
  const tab = TAB[key.split('/')[1]]
  if (!tab) return
  if ($('kind').value !== tab) {
    $('kind').value = tab
    open = null
    await load()
  }
  const it = data && data.items.find((i) => i.key === key)
  if (!it) return
  await opened(key)
  open = key
  focus = ref || null
  if (!it.search.includes($('q').value.trim().toLowerCase())) $('q').value = ''
  if (!range.full && !it.events.some((e) => range.has(e[0]))) range.set(null)
  draw()
  document.querySelector(`[data-anchor="${CSS.escape(ref || `view:${slug}/${key}`)}"]`)?.scrollIntoView({ block: 'center' })
}

// a run's citation frames its span in the range; any other opens its item
function go() {
  const t = want
  want = null
  const run = t.run && data.runs.find((r) => r.run === t.run)
  if (run) range.set(run.start, run.end)
  else if (t.key) show(t.key, t.ref)
}

$('q').addEventListener('input', draw)
$('kind').addEventListener('change', () => { open = null; load() })
$('list').addEventListener('click', async (e) => {
  const other = e.target.closest('[data-go]')
  if (other) return show(other.dataset.go)
  const tr = e.target.closest('tr.item')
  if (!tr) return
  const key = tr.dataset.key
  if (open !== key) await opened(key)
  open = open === key ? null : key
  focus = null
  thimble.expand(tr, draw)
})
new ResizeObserver(() => requestAnimationFrame(draw)).observe($('list'))
thimble.onLabels(() => load())
// a label's values arrive while it runs, which the chips' counts and the overview follow while a label is the color
let later = null
thimble.onMarks(() => {
  if (!colour.label) return
  clearTimeout(later)
  later = setTimeout(load, 300)
})
thimble.onOpen((place) => {
  want = place.target || null
  if (want && data) go()
})
load()
</script>
</body>
</html>
