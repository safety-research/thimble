<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .chip, .btn, .seg, .table, .list-row) and the theme's tokens come with the frame; this page
     only lays them out */
  html, body { margin: 0; }
  body { background: var(--surface-card); }
  #bar { position: sticky; top: 0; z-index: 5; background: var(--surface-card); padding: 10px 16px 8px; border-bottom: 1px solid var(--border-hairline); }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .row + .row { margin-top: 7px; }
  .grow { flex: 1 1 auto; }
  #q { flex: 1 1 200px; min-width: 160px; max-width: 360px; }
  /* a select as wide as its chosen option, not its longest one */
  #selects select { field-sizing: content; max-width: 220px; }
  .cap { font: 400 var(--text-xs) / 1 var(--font-body); color: var(--text-tertiary); }
  .chip .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); font-variant-numeric: tabular-nums; }
  .chip.active .n { color: inherit; opacity: 0.75; }
  .chip.off { opacity: 0.45; }
  .sq { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 2px; }
  #status { flex-wrap: nowrap; min-height: 24px; }
  #readout { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 0 2px 2px; font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  #status .btn { flex: none; }
  #charts { padding: 8px 16px 8px; min-width: 0; }
  #chartbar { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 6px 10px; margin: 2px 0 10px; }
  #chartbar .row + .row { margin-top: 0; }
  .lchip .box { width: 10px; height: 10px; }
  svg { display: block; overflow: visible; user-select: none; -webkit-user-select: none; }
  svg text { font-family: var(--font-mono); font-size: 10.5px; fill: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  svg text.cap { font-family: var(--font-body); font-size: 11px; fill: var(--text-secondary); }
  svg text.lane { font-family: var(--font-body); font-size: 12px; fill: var(--text-primary); }
  svg .hit { fill: transparent; }
  svg .lanehead { cursor: pointer; }
  svg .lanehead:hover .hit { fill: rgba(var(--ink-rgb), 0.05); }
  svg .lanehead.on .hit { fill: var(--surface-selected); }
  svg .lanehead.on text.lane { font-weight: 500; }
  svg .lane-off { opacity: 0.35; }
  svg .tick { cursor: pointer; }
  #focusbox { position: relative; }
  #legend { position: absolute; left: 0; display: flex; flex-direction: column; align-items: stretch; gap: 1px; min-width: 0; }
  #legend .cap { margin-bottom: 6px; }
  #legend > .btn { align-self: flex-start; margin-top: 4px; }
  .ico { width: 12px; height: 12px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .lg { display: flex; align-items: center; gap: 6px; min-width: 0; height: 22px; padding: 0 6px 0 4px; margin-left: -4px; border-radius: var(--radius-chip); font: 400 var(--text-xs) / 1 var(--font-body); color: var(--text-secondary); cursor: pointer; }
  .lg:hover { background: var(--surface-hover); color: var(--text-primary); }
  .lg.st { cursor: default; }
  .lg.st:hover { background: none; color: var(--text-secondary); }
  .lg .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg .n { margin-left: auto; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .lg.off { opacity: .38; }
  .lg.off .sw { background: transparent !important; box-shadow: inset 0 0 0 1.3px var(--text-tertiary); }
  .swb { display: inline-grid; place-items: center; width: 16px; height: 16px; margin: 0 -4px 0 -4px; border-radius: 3px; flex: none; cursor: pointer; }
  .swb:hover { background: var(--track-bg); }
  .box { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--mark); background: transparent; }
  .box.on { background: var(--mark); }
  #colour { column-gap: 14px; }
  #tbl td.s .mk { display: inline-flex; gap: 2px; margin-right: 6px; vertical-align: 0; }
  .pal { position: fixed; z-index: 60; display: grid; grid-template-columns: repeat(7, 20px); gap: 6px; padding: 10px; border-radius: var(--radius-card); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), .14); }
  .pal button { width: 20px; height: 20px; padding: 0; border: 0; border-radius: 4px; cursor: pointer; }
  .pal button:hover { transform: scale(1.12); }
  .pal button.cur { box-shadow: 0 0 0 2px var(--surface-card), 0 0 0 3.5px var(--text-primary); }
  #overview, #focus { cursor: crosshair; }
  #more { margin: 2px 0 0 -6px; }
  #records { min-width: 0; border-top: 1px solid var(--border-hairline); }
  #listbox { max-height: 260px; overflow: auto; outline: none; }
  #tbl { table-layout: fixed; }
  #tbl td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #tbl td.t { color: var(--text-secondary); }
  #tbl td.gap, #tbl th.gap, #tbl th.tk { text-align: right; padding-right: 10px; }
  #tbl th.sort { cursor: pointer; }
  #tbl th.sort:hover { color: var(--text-primary); }
  #tbl td.gap { color: var(--text-tertiary); }
  #tbl td.s .sq { margin-right: 6px; vertical-align: 0; }
  #tbl td.s, #tbl td.k, #tbl td.a, #tbl td.sv, #tbl td.x { font-family: var(--font-body); font-size: var(--text-xs); }
  #tbl td.k, #tbl td.sv { color: var(--text-secondary); }
  #tbl td.x { color: var(--text-primary); }
  #tbl td.none { color: var(--text-tertiary); }
  .bad { color: var(--status-negative); }
  #pager { padding: 6px 8px 10px; }
  #pager:empty { display: none; }
  #detail { padding: 12px 16px 28px; border-top: 1px solid var(--border-hairline); min-width: 0; }
  #detail:empty { display: none; }
  .d-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .d-when { font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); color: var(--text-secondary); }
  .d-text { margin: 10px 0 0; font: 500 var(--text-lg) / 1.35 var(--font-body); color: var(--text-primary); overflow-wrap: anywhere; white-space: pre-wrap; }
  .d-text.long { font: 400 var(--text-sm) / 1.5 var(--font-body); }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 18px; margin: 12px 0 0; }
  .facts + .facts { margin-top: 6px; }
  .fact { display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 22px; }
  .fact dt { flex: none; width: 60px; font: 400 var(--text-xs) / 1.3 var(--font-body); color: var(--text-tertiary); }
  .fact dd { margin: 0; min-width: 0; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .d-sec { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 4px; }
  .d-sec .t { font: 500 var(--text-ui-sm) / 1.2 var(--font-body); color: var(--text-primary); }
  .d-sec .n { font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); }
  .rec { gap: 10px; font: 400 var(--text-xs) / 1.3 var(--font-body); }
  .rec .t { flex: none; width: 64px; font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); color: var(--text-secondary); }
  .rec .d { flex: none; width: 52px; text-align: right; font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); color: var(--text-tertiary); }
  .rec .s { flex: none; width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
  .rec .a { flex: none; width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec .x { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
  #tip { position: fixed; z-index: 10; pointer-events: none; display: none; min-width: 150px; max-width: 300px; padding: 7px 9px; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-ui); font: 400 var(--text-mono-sm) / 1.45 var(--font-mono); color: var(--text-primary); font-variant-numeric: tabular-nums; }
  #tip .h { font: 500 var(--text-xs) / 1.3 var(--font-body); margin-bottom: 3px; }
  #tip .r { display: flex; gap: 8px; align-items: center; }
  #tip .r .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-body); color: var(--text-secondary); }
  #tip .body { margin-top: 4px; font: 400 var(--text-xs) / 1.4 var(--font-body); color: var(--text-primary); white-space: normal; }
  @media (min-width: 1100px) {
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    #bar { position: static; flex: none; }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(480px, 44%); }
    #charts { overflow: auto; }
    #records { border-top: 0; border-left: 1px solid var(--border-hairline); display: flex; flex-direction: column; min-height: 0; }
    #listbox { max-height: none; flex: 1 1 50%; min-height: 160px; }
    #detail { flex: 1 1 50%; overflow: auto; }
  }
</style>
</head>
<body>
<div id="bar">
  <div class="row">
    <input id="q" class="field" type="search" placeholder="Search records" aria-label="Search records" autocomplete="off" spellcheck="false">
    <div id="sources" class="row"></div>
  </div>
  <div class="row" id="selects"></div>
  <div class="row" id="status">
    <span id="readout"></span>
    <span class="grow"></span>
    <button id="clear" class="btn btn-ghost btn-sm">Clear filters</button>
    <button id="zoomout" class="btn btn-ghost btn-sm">Zoom out</button>
    <button id="whole" class="btn btn-ghost btn-sm">Whole span</button>
  </div>
</div>
<main>
  <section id="charts">
    <div id="chartbar">
      <span class="cap">Group by</span>
      <div class="row"><div id="group" class="seg seg-track"></div><span class="grow"></span><span class="cap">Time</span><div id="align" class="seg seg-track"></div></div>
      <span class="cap">Colour</span>
      <div class="row" id="colour"></div>
    </div>
    <svg id="overview"></svg>
    <div id="focusbox"><svg id="focus"></svg><div id="legend"></div></div>
    <svg id="lanes"></svg>
    <button id="more" class="btn btn-ghost btn-sm"></button>
  </section>
  <section id="records">
    <div id="listbox" tabindex="0">
      <table id="tbl" class="table">
        <colgroup id="cols"></colgroup>
        <thead><tr id="heads"></tr></thead>
        <tbody id="tb"></tbody>
      </table>
      <div id="pager"></div>
    </div>
    <div id="detail"></div>
  </section>
</main>
<div id="tip"></div>
<div id="pop"></div>
<script>
'use strict'
// Incident timeline: every record of every source on one time axis. The toolbar narrows by search, source (chips) and
// every other field (selects); the overview shows the whole span with a brush, the focus counts the window's records
// per bin in the colours of the field or the labels chosen under Colour, and the lanes lay out each value of the Group
// by field side by side, as small multiples of the same window. The legend beside the focus shows a value alone on a click and
// hides it on a shift-click. The Time control puts each incident's records at their time since the incident's first
// record, so incidents compare on one axis. The list holds every record in the window and filters, sortable by the
// time since the record before (Gap) or since the record it answers (Took), and a record's details show the record it
// answers, those that answer it and its neighbours in time across every source.
// Labels: the reader keeps only what the label filter keeps and hands each record its marks. Colour lists every label
// over files beside the fields, and turns one on or off in thimble. While a label is on it is the colouring: its values
// colour the bars and the lane ticks, get a lane each and a swatch on the list's rows and in the details, and a value's
// swatch in the legend opens thimble's palette. List rows and details carry their file ref as data-anchor, incident
// lanes their view key, so thimble marks them.
const slug = (thimble.view && thimble.view.slug) || 'incident-timeline'
const NS = 'http://www.w3.org/2000/svg'
// the reader's fields: [key, name, plural, the name of a record without it]; the first is narrowed by chips
const FIELDS = [
  ['source', 'Source', 'sources', 'no source'],
  ['incident', 'Incident', 'incidents', 'no incident'],
  ['service', 'Service', 'services', 'no service'],
  ['actor', 'Actor', 'actors', 'no actor'],
  ['kind', 'Kind', 'kinds', 'no kind'],
  ['severity', 'Severity', 'severities', 'no severity'],
  ['outcome', 'Outcome', 'outcomes', 'no outcome'],
]
const KEYS = FIELDS.map((f) => f[0])
const FIELD = Object.fromEntries(FIELDS.map((f) => [f[0], f]))
const BAD = new Set(['failed', 'critical', 'urgent'])
const RED = 3 // the index of --viz-4, the red a failure is drawn in
const MON = 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')
const STEPS = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800, 604800]
const TICKS = [5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800, 604800, 1209600]
const COLOURED = 5 // values of the colour field drawn in their own viz colour; the rest share one ink
const LANES = 12 // lanes shown before the rest are folded
const ROWS = 400 // list rows shown before the next ones are asked for
const RIGHT = 10
const GUTTER = 176 // the name column left of every chart, which holds the focus's legend

const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const fmt = (n) => Number(n).toLocaleString('en-US')
const pad2 = (n) => String(n).padStart(2, '0')
function h(tag, cls, text) {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (text != null) e.textContent = text
  return e
}
function s(tag, attrs, text) {
  const e = document.createElementNS(NS, tag)
  for (const k in attrs || {}) if (attrs[k] != null) e.setAttribute(k, attrs[k])
  if (text != null) e.textContent = text
  return e
}
function clip(str, n) { return str.length > n ? str.slice(0, n - 1) + '…' : str }
const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const PLUS = '<svg class="ico" viewBox="0 0 12 12"><path d="M6 2.5v7M2.5 6h7"/></svg>'
function plural(n, one, many) { return `${fmt(n)} ${n === 1 ? one : many}` }
function lowerBound(arr, x) {
  let lo = 0, hi = arr.length
  while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid] < x) lo = mid + 1; else hi = mid }
  return lo
}

// ---------------------------------------------------------------- time
// Clock time is seconds since the first record (T0 the epoch of it); "From incident start" is seconds since the first
// record of the record's incident.
let T0 = 0
const date = (t) => new Date((T0 + t) * 1000)
const dayStr = (t) => { const d = date(t); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}` }
const hm = (t) => { const d = date(t); return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}` }
const hms = (t) => { const d = date(t); return `${hm(t)}:${pad2(d.getUTCSeconds())}` }
const isoMin = (t) => date(t).toISOString().slice(0, 16)
function since(x, secs) {
  const a = Math.abs(Math.round(x)), sign = x < 0 ? '−' : '+'
  const hh = Math.floor(a / 3600), mm = Math.floor((a % 3600) / 60), ss = a % 60
  return secs ? `${sign}${hh}:${pad2(mm)}:${pad2(ss)}` : `${sign}${hh}:${pad2(mm)}`
}
function dur(sec) {
  const a = Math.abs(sec)
  if (a < 60) return `${Math.round(a)}s`
  if (a < 3600) return `${Math.floor(a / 60)}m${a % 60 >= 1 && a < 600 ? ` ${pad2(Math.round(a % 60))}s` : ''}`
  return `${Math.floor(a / 3600)}h ${pad2(Math.floor((a % 3600) / 60))}m`
}
const at = (x, secs = true) => (mode === 'start' ? since(x, secs) : secs ? hms(x) : hm(x))

// ---------------------------------------------------------------- data
let D = null
let N = 0
let C = null // the reader's columns as typed arrays: r t f ln <fields> re tk m mb
let rowAt = new Map() // reader row -> index into the columns
let X = new Float64Array(0) // each record's place on the time axis, NaN where it has none
let ORDER = new Int32Array(0) // the placed records, by X
let XS = new Float64Array(0) // X in ORDER's order, for the window's bounds
let SPAN = [0, 1]
let starts = [] // incident value -> its start, seconds since T0
let rankOf = {} // field -> value -> rank by records overall
let totals = {} // field -> the values that have records overall
let loadSeq = 0
let labelState = { labels: [], filter: null, all: null, palette: null } // what thimble.onLabels last said
const texts = new Map() // reader row -> its text

let mode = 'clock' // 'clock' or 'start'
let group = 'source'
let colourBy = 'source'
let hide = new Set() // the label values the legend hides, as markKey gives them, and 'none' for the records none marks
let pal = null // {id, value, from} while a label value's palette is open
let win = null // [a, b) on the time axis
const F = Object.fromEntries(KEYS.map((k) => [k, new Set()])) // field -> the value indices it is narrowed to
let searchQ = ''
let searchSet = null // reader rows holding the search, or null
let sel = null // the chosen record's reader row
let detail = null
let keepRow = null // the row a citation opened, shown whatever the label filter keeps
let foldLanes = true
let tableLimit = ROWS
let sortBy = 't' // the list's order: 't' by time, 'gap' by the time since the record before, 'tk' by the time since the record answered

async function load() {
  const my = ++loadSeq
  const data = await thimble.fetch(keepRow != null ? { op: 'overview', keep: [keepRow] } : { op: 'overview' })
  if (my !== loadSeq) return false
  D = data
  T0 = data.t0
  const c = data.cols
  N = c.r.length
  C = {}
  for (const k of ['r', 't', 'f', 'ln', ...KEYS, 're', 'tk', 'm', 'mb']) C[k] = Int32Array.from(c[k] || [])
  rowAt = new Map()
  for (let i = 0; i < N; i++) rowAt.set(C.r[i], i)
  const incNames = data.names.incident || ['']
  starts = incNames.map((name) => (name in data.starts ? data.starts[name] : NaN))
  rankOf = {}
  for (const k of KEYS) {
    const n = new Array((data.names[k] || ['']).length).fill(0)
    for (let i = 0; i < N; i++) n[C[k][i]]++
    // a value with no records overall ranks last, and "none" after every named value
    const order = n.map((_, v) => v).sort((a, b) => (a === 0) - (b === 0) || n[b] - n[a] || a - b)
    rankOf[k] = new Map(order.map((v, r) => [v, r]))
    totals[k] = order.filter((v) => n[v] > 0)
  }
  const keys = D.marks.map((_, j) => markKey(j))
  hide = new Set([...hide].filter((x) => (x === 'none' && keys.length) || keys.includes(x)))
  place()
  return true
}

// X, ORDER and SPAN for the Time control
function place() {
  X = new Float64Array(N)
  for (let i = 0; i < N; i++) {
    if (mode === 'clock') X[i] = C.t[i]
    else X[i] = C.incident[i] && Number.isFinite(starts[C.incident[i]]) ? C.t[i] - starts[C.incident[i]] : NaN
  }
  const idx = []
  for (let i = 0; i < N; i++) if (!Number.isNaN(X[i])) idx.push(i)
  idx.sort((a, b) => X[a] - X[b] || C.t[a] - C.t[b])
  ORDER = Int32Array.from(idx)
  XS = Float64Array.from(idx.map((i) => X[i]))
  SPAN = XS.length ? [XS[0], XS[XS.length - 1] + 1] : [0, 1]
  if (mode === 'clock') SPAN = [0, D.span[1] + 1]
  if (!win) win = SPAN.slice()
}

const nameOf = (k, v) => (D.names[k] && D.names[k][v]) || FIELD[k][3]
const labelsOn = () => !!(D && D.marks.length) || labelState.labels.length > 0
const ref = (i) => `${D.files[C.f[i]]}#L${C.ln[i]}`

// the label values the reader sends as `marks`, with the colour and the id thimble last gave their label
const labelBy = (name) => (labelState.all || labelState.labels || []).find((l) => l.name === name)
const markKey = (j) => `${D.marks[j].label}\n${D.marks[j].value}`
function markColour(j) {
  const m = D.marks[j], l = labelBy(m.label), v = l && (l.values || []).find((x) => x.name === m.value)
  return (v && v.colour) || m.colour
}
function markName(j) {
  const m = D.marks[j], l = labelBy(m.label)
  const multi = l ? (l.values || []).filter((v) => v.highlight !== false).length > 1 : m.value !== m.label
  return multi ? `${m.label}: ${m.value}` : m.label
}
const firstBit = (x) => (x ? 31 - Math.clz32(x & -x) : -1)
// the marks of record i, as indices into D.marks
const marksOf = (i) => D.marks.map((_, j) => j).filter((j) => C.mb[i] & (1 << j))
// a swatch per label value that marks record i, for a list row
function markSwatches(i) {
  const box = h('span', 'mk')
  for (const j of marksOf(i).slice(0, 3)) {
    const sq = h('span', 'sq')
    sq.style.background = markColour(j)
    sq.title = markName(j)
    box.append(sq)
  }
  return box
}
const whole = () => win[0] <= SPAN[0] && win[1] >= SPAN[1]

// ---------------------------------------------------------------- filters
let vis = new Int32Array(0) // the records in the window that pass every filter, by X
let laneRecs = new Map() // Group by value -> the window's records passing every filter but the Group by field's own
let counts = {} // field -> value -> the window's records passing every filter but that field's own
let passAll = [] // the placed records that pass every filter, the window aside, by X
let laneOrder = [] // the Group by field's values as the lanes list them
let colourOrder = [] // the colour field's values, in the order they take the colours
let colourRank = new Map() // colour field value -> its place among the coloured values
let M = new Int32Array(0) // each record's first mark the legend does not hide, -1 for none
let markN = [] // mark -> the window's records it marks that pass every filter, the legend's hiding aside
let noneN = 0 // the same for the records no mark marks
const anyFilter = () => !!searchSet || hide.size > 0 || KEYS.some((k) => F[k].size)

// which filter drops record i: '' for none, the field when exactly one does, '*' for more
function failing(i) {
  if (searchSet && !searchSet.has(C.r[i])) return '*'
  let bad = ''
  for (const k of KEYS) {
    if (!F[k].size || F[k].has(C[k][i])) continue
    if (bad) return '*'
    bad = k
  }
  return bad
}
function compute() {
  counts = Object.fromEntries(KEYS.map((k) => [k, new Map()]))
  laneRecs = new Map()
  passAll = []
  let hidden = 0
  D.marks.forEach((_, j) => { if (hide.has(markKey(j))) hidden |= 1 << j })
  M = new Int32Array(N)
  for (let i = 0; i < N; i++) M[i] = firstBit(C.mb[i] & ~hidden)
  markN = D.marks.map(() => 0)
  noneN = 0
  const out = []
  const lo = lowerBound(XS, win[0]), hi = lowerBound(XS, win[1])
  for (let p = 0; p < ORDER.length; p++) {
    const i = ORDER[p]
    const bad = failing(i)
    if (bad === '*') continue
    if (!bad && p >= lo && p < hi) {
      for (let j = 0; j < markN.length; j++) if (C.mb[i] & (1 << j)) markN[j]++
      if (!C.mb[i]) noneN++
    }
    if (hide.size && (C.mb[i] ? M[i] < 0 : hide.has('none'))) continue
    if (!bad) passAll.push(i)
    if (p < lo || p >= hi) continue
    if (bad) {
      counts[bad].set(C[bad][i], (counts[bad].get(C[bad][i]) || 0) + 1)
    } else {
      for (const k of KEYS) counts[k].set(C[k][i], (counts[k].get(C[k][i]) || 0) + 1)
      out.push(i)
    }
    if (!bad || bad === group) {
      const v = C[group][i]
      let arr = laneRecs.get(v)
      if (!arr) laneRecs.set(v, (arr = []))
      arr.push(i)
    }
  }
  vis = Int32Array.from(out)
  order()
}

// The lanes' and the colours' values in order: a field with few values keeps its order by records overall, so lanes
// and colours stay put while zooming; one with more is ranked by records in view. The first COLOURED named values of
// the colour field get the viz colours and the rest share one ink, as do records without the field.
function rank(k, n) {
  const all = [...rankOf[k].keys()].filter((v) => v !== 0 || n(0) > 0 || F[k].has(0))
  if (all.length <= LANES) return all
  return all.filter((v) => n(v) > 0 || F[k].has(v)).sort((p, q) => n(q) - n(p) || rankOf[k].get(p) - rankOf[k].get(q))
}
// the viz colour each of a field's first named values takes: a failure (BAD) the red, --viz-4, the others the rest
function slots(k, named) {
  const out = new Map()
  const top = named.slice(0, COLOURED)
  const bad = top.find((v) => BAD.has(nameOf(k, v)))
  const free = [0, 1, 2, 3, 4].filter((r) => bad == null || r !== RED)
  if (bad != null) out.set(bad, RED)
  for (const v of top) if (v !== bad) out.set(v, free.shift())
  return out
}
function order() {
  laneOrder = rank(group, (v) => (laneRecs.get(v) || []).length)
  colourOrder = rank(colourBy, (v) => counts[colourBy].get(v) || 0)
  colourRank = slots(colourBy, colourOrder.filter((v) => v !== 0))
  for (const v of colourOrder) if (v !== 0 && !colourRank.has(v)) colourRank.set(v, COLOURED + colourRank.size)
}
// while a label is on every record is ink but for the label's colour (recColour)
function colourOf(v) {
  const r = colourRank.get(v)
  return r != null && r < COLOURED ? token(`--viz-${r + 1}`) : token('--viz-ink-4')
}
const rankIn = (v) => { const p = colourOrder.indexOf(v); return v === 0 || p < 0 ? 1e9 : p }
const coloured = (v) => colourRank.has(v) && colourRank.get(v) < COLOURED
function recColour(i) {
  if (labelsOn()) return M[i] >= 0 ? markColour(M[i]) : token('--viz-ink-3')
  return colourOf(C[colourBy][i])
}

function toggle(k, v) {
  F[k].has(v) ? F[k].delete(v) : F[k].add(v)
  refresh()
}
function only(k, v) {
  F[k] = new Set([v])
  refresh()
}

// ---------------------------------------------------------------- toolbar
function renderSources() {
  const box = document.getElementById('sources')
  const k = KEYS[0]
  const vals = [...rankOf[k].keys()].filter((v) => v !== 0 || (counts[k].get(0) || 0) > 0)
  box.replaceChildren(...vals.map((v) => {
    const on = F[k].has(v)
    const n = counts[k].get(v) || 0
    const c = h('button', 'chip chip-sans chip-tone-neutral chip-act' + (on ? ' active' : '') + (n === 0 && !on ? ' off' : ''))
    c.append(nameOf(k, v), h('span', 'n', fmt(n)))
    c.setAttribute('aria-pressed', on ? 'true' : 'false')
    c.onclick = () => toggle(k, v)
    return c
  }))
}
// A select adds the value picked to its field's values, or removes one already chosen (ticked); its closed face names
// the chosen values, and "Any" clears them.
function renderSelects() {
  const box = document.getElementById('selects')
  box.replaceChildren(...FIELDS.slice(1).map(([k, name, many]) => {
    const pick = h('select', 'field')
    pick.setAttribute('aria-label', name)
    const chosen = [...F[k]].sort((a, b) => nameOf(k, a).localeCompare(nameOf(k, b), 'en', { numeric: true }))
    const vals = [...rankOf[k].keys()].filter((v) => v !== 0 || (counts[k].get(0) || 0) > 0 || F[k].has(0))
    vals.sort((a, b) => (counts[k].get(b) || 0) - (counts[k].get(a) || 0) || rankOf[k].get(a) - rankOf[k].get(b))
    const any = h('option', null, `Any ${name.toLowerCase()}`)
    any.value = ''
    pick.append(any)
    if (chosen.length) {
      const names = chosen.map((v) => nameOf(k, v)).join(', ')
      const face = h('option', null, `${name}: ${chosen.length > 2 || names.length > 28 ? `${chosen.length} ${many}` : names}`)
      face.value = 'chosen'
      face.hidden = true
      pick.append(face)
    }
    for (const v of vals) {
      const n = counts[k].get(v) || 0
      const o = h('option', null, `${F[k].has(v) ? '✓ ' : ''}${nameOf(k, v)} ${fmt(n)}`)
      o.value = String(v)
      if (n === 0 && !F[k].has(v)) o.disabled = true
      pick.append(o)
    }
    pick.value = chosen.length ? 'chosen' : ''
    pick.onchange = () => {
      if (pick.value === '') { F[k].clear(); refresh() } else toggle(k, Number(pick.value))
    }
    return pick
  }))
}
function renderSegs() {
  const g = document.getElementById('group')
  g.replaceChildren(...FIELDS.map(([k, name]) => {
    const b = h('button', 'seg-opt' + (group === k ? ' active' : ''), name)
    b.onclick = () => { if (group !== k) { group = k; foldLanes = true; refresh() } }
    return b
  }))
  const a = document.getElementById('align')
  a.replaceChildren(...[['clock', 'Clock'], ['start', 'From incident start']].map(([m, name]) => {
    const b = h('button', 'seg-opt' + (mode === m ? ' active' : ''), name)
    b.onclick = () => setMode(m)
    return b
  }))
  renderColour()
}
function setMode(m) {
  if (m === mode) return
  mode = m
  win = null
  place()
  refresh()
}
let readoutTimer = null
function renderReadout() {
  const r = document.getElementById('readout')
  const a = Math.max(win[0], SPAN[0]), b = Math.min(win[1], SPAN[1])
  let range
  if (mode === 'start') range = `${since(a)} to ${since(b)} from incident start`
  else range = dayStr(a) === dayStr(b - 1) ? `${dayStr(a)} ${hm(a)}–${hm(b)}` : `${dayStr(a)} ${hm(a)} – ${dayStr(b)} ${hm(b)}`
  const inWin = lowerBound(XS, win[1]) - lowerBound(XS, win[0])
  const actors = new Set()
  for (const i of vis) actors.add(C.actor[i])
  const n = vis.length < inWin ? `${fmt(vis.length)} of ${plural(inWin, 'record', 'records')}` : plural(vis.length, 'record', 'records')
  r.textContent = `${range} · ${n} · ${plural(actors.size, 'actor', 'actors')}`
  document.getElementById('whole').style.display = whole() ? 'none' : ''
  document.getElementById('zoomout').style.display = whole() ? 'none' : ''
  document.getElementById('clear').style.display = anyFilter() ? '' : 'none'
  // a zoomed clock window is a unit the analyst can ask about and cite, keyed once it settles
  clearTimeout(readoutTimer)
  readoutTimer = setTimeout(() => {
    if (mode === 'clock' && !whole()) {
      r.dataset.anchor = `view:${slug}/${isoMin(Math.floor(a / 60) * 60)}..${isoMin(Math.ceil(b / 60) * 60)}`
      r.dataset.anchorName = `the records from ${range}`
    } else {
      delete r.dataset.anchor
      delete r.dataset.anchorName
    }
  }, 500)
}

// ---------------------------------------------------------------- axis
function stepFor(span, px, minPx) {
  const want = span / Math.max(1, px / minPx)
  return STEPS.find((x) => x >= want) || STEPS[STEPS.length - 1]
}
function tickStep(span, px) {
  const want = span / Math.max(1, px / 78)
  return TICKS.find((x) => x >= want) || TICKS[TICKS.length - 1]
}
// ticks fall on round clock times, or round times since the start
function ticks(a, b, step) {
  const out = []
  const base = mode === 'clock' ? T0 : 0
  for (let t = Math.ceil((base + a) / step) * step; t < base + b; t += step) out.push(t - base)
  return out
}
function drawAxis(g, x, a, b, y, px, gridTop, gridBottom) {
  const step = tickStep(b - a, px)
  let lastDay = null
  for (const t of ticks(a, b, step)) {
    const X_ = x(t)
    if (gridTop != null) g.append(s('line', { x1: X_, x2: X_, y1: gridTop, y2: gridBottom, stroke: token('--border-hairline') }))
    if (X_ < GUTTER + 16 || X_ > GUTTER + px - 14) continue
    const label = mode === 'start' ? since(t, step < 60) : step >= 86400 ? dayStr(t) : step < 60 ? hms(t) : hm(t)
    g.append(s('text', { x: X_, y: y + 12, 'text-anchor': 'middle' }, label))
    if (mode === 'clock' && step < 86400 && dayStr(t) !== lastDay) g.append(s('text', { x: X_, y: y + 24, 'text-anchor': 'middle' }, dayStr(t)))
    lastDay = dayStr(t)
  }
}

// per bin of `step` seconds from a round time: its records' count per colour field value and per mark
function bins(a, b, step, idxs) {
  const base = mode === 'clock' ? Math.floor((T0 + a) / step) * step - T0 : Math.floor(a / step) * step
  const nb = Math.max(1, Math.ceil((b - base) / step))
  const out = []
  for (let j = 0; j < nb; j++) out.push({ t: base + j * step, n: 0, by: new Map(), marks: new Map(), first: -1 })
  for (const i of idxs) {
    const bn = out[Math.floor((X[i] - base) / step)]
    if (!bn) continue
    if (bn.first < 0) bn.first = i
    bn.n++
    const v = C[colourBy][i]
    bn.by.set(v, (bn.by.get(v) || 0) + 1)
    const m = M[i]
    bn.marks.set(m, (bn.marks.get(m) || 0) + 1)
  }
  return out
}
// one bar's parts, bottom first: [colour, count]
function stack(bn) {
  if (labelsOn()) {
    const out = []
    for (const [m, n] of [...bn.marks.entries()].sort((p, q) => p[0] - q[0])) if (m >= 0) out.push([markColour(m), n])
    if (bn.marks.get(-1)) out.push([token('--viz-ink-4'), bn.marks.get(-1)])
    return out
  }
  const out = []
  let other = 0
  for (const [v, n] of [...bn.by.entries()].sort((p, q) => rankIn(p[0]) - rankIn(q[0]))) {
    if (coloured(v)) out.push([colourOf(v), n])
    else other += n
  }
  if (other) out.push([token('--viz-ink-4'), other])
  return out
}
// the value axis: a round step giving at most four gridlines, and the top one at or above the tallest bar
function yTicks(v) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, v))))
  const stp = [1, 2, 5, 10].map((m) => m * p).find((x) => v / x <= 4) || 10 * p
  const top = Math.max(stp, Math.ceil(v / stp) * stp)
  const out = []
  for (let x = stp; x <= top; x += stp) out.push(x)
  return out
}
function binName(step) {
  if (step < 60) return `${step} s`
  if (step < 3600) return `${step / 60} min`
  if (step < 86400) return step === 3600 ? 'hour' : `${step / 3600} h`
  return step === 86400 ? 'day' : `${step / 86400} days`
}

// ---------------------------------------------------------------- overview
let ov = null
function renderOverview() {
  const svg = document.getElementById('overview')
  const W = svg.parentElement.clientWidth - 32
  const H = 38, top = 4, axis = 28
  svg.setAttribute('width', W)
  svg.setAttribute('height', top + H + axis)
  svg.replaceChildren()
  const px = W - GUTTER - RIGHT
  const [a, b] = SPAN
  const x = (t) => GUTTER + ((t - a) / (b - a)) * px
  const step = stepFor(b - a, px, 4)
  const bs = bins(a, b, step, passAll)
  const ghost = anyFilter() ? bins(a, b, step, ORDER) : null
  const max = Math.max(1, ...(ghost || bs).map((bn) => bn.n))
  const bw = Math.max(1, (step / (b - a)) * px - 1)
  const y0 = top + H
  svg.append(s('text', { x: 0, y: top + H / 2 + 4, class: 'cap' }, 'Whole span'))
  svg.append(s('line', { x1: GUTTER, x2: GUTTER + px, y1: y0, y2: y0, stroke: token('--border-subtle') }))
  if (ghost) {
    // the whole as an outline, so the filtered part shows against it
    let d = `M${GUTTER},${y0}`
    const sw = (step / (b - a)) * px
    for (const bn of ghost) {
      const X0 = Math.max(GUTTER, x(bn.t)), X1 = Math.min(GUTTER + px, x(bn.t) + sw)
      const y = y0 - (bn.n / max) * H
      d += `L${X0.toFixed(1)},${y.toFixed(1)}L${X1.toFixed(1)},${y.toFixed(1)}`
    }
    svg.append(s('path', { d: d + `L${GUTTER + px},${y0}`, fill: 'none', stroke: token('--viz-ink-3'), 'stroke-width': 1 }))
  }
  for (const bn of bs) {
    if (!bn.n) continue
    let acc = 0
    for (const [col, n] of stack(bn)) {
      const hh = (n / max) * H
      svg.append(s('rect', { x: x(bn.t), y: y0 - acc - hh, width: bw, height: Math.max(0.8, hh), fill: col }))
      acc += hh
    }
  }
  const ax = s('g')
  svg.append(ax)
  drawAxis(ax, x, a, b, y0, px)
  if (!whole()) {
    const bx0 = x(Math.max(a, win[0])), bx1 = x(Math.min(b, win[1]))
    const dim = token('--surface-card')
    svg.append(s('rect', { x: GUTTER, y: top - 2, width: Math.max(0, bx0 - GUTTER), height: H + 3, fill: dim, opacity: 0.65 }))
    svg.append(s('rect', { x: bx1, y: top - 2, width: Math.max(0, GUTTER + px - bx1), height: H + 3, fill: dim, opacity: 0.65 }))
    svg.append(s('rect', { x: bx0, y: top - 2, width: Math.max(1, bx1 - bx0), height: H + 3, fill: 'none', stroke: token('--accent'), 'stroke-width': 1.5, rx: 2 }))
    for (const X_ of [bx0, bx1]) svg.append(s('rect', { x: X_ - 2, y: top + H / 2 - 7, width: 4, height: 14, rx: 2, fill: token('--accent') }))
  }
  ov = { x, a, b, px, top, H }
}

// ---------------------------------------------------------------- focus
let fc = null
function renderFocus() {
  const svg = document.getElementById('focus')
  const W = svg.parentElement.clientWidth
  const top = 8, axis = 30
  // at least as tall as the legend beside it
  const rows = labelsOn() ? D.marks.length + 1 : Math.min(COLOURED + 1, colourOrder.length)
  let H = Math.max(150, 64 + 23 * (rows + 1))
  if (document.body.clientWidth >= 1100) {
    // where the charts have a column of their own, the focus takes the height the lanes leave
    const n = laneValues().shown.length
    const lanes = n * laneHeight(n) + markLanes().length * LANE + 40
    const box = document.getElementById('charts')
    const rest = document.getElementById('chartbar').offsetHeight + Number(document.getElementById('overview').getAttribute('height')) + lanes + 48
    H = Math.max(H, 170, Math.min(360, box.clientHeight - rest - top - axis))
  }
  svg.setAttribute('width', W)
  svg.setAttribute('height', top + H + axis)
  svg.replaceChildren()
  const px = W - GUTTER - RIGHT
  const [a, b] = win
  const x = (t) => GUTTER + ((t - a) / (b - a)) * px
  const step = stepFor(b - a, px, 7)
  const bs = bins(a, b, step, vis)
  const ys = yTicks(Math.max(1, ...bs.map((bn) => bn.n)))
  const max = ys[ys.length - 1]
  const y0 = top + H
  const k = H / max
  for (const v of ys) {
    const y = y0 - v * k
    svg.append(s('line', { x1: GUTTER, x2: GUTTER + px, y1: y, y2: y, stroke: token('--border-hairline') }))
    svg.append(s('text', { x: GUTTER - 6, y: y + 3.5, 'text-anchor': 'end' }, fmt(v)))
  }
  renderLegend(`Records per ${binName(step)}`, top)
  const bw = Math.max(1, (step / (b - a)) * px - 1)
  for (const bn of bs) {
    if (!bn.n) continue
    const X0 = Math.max(GUTTER, x(bn.t)), X1 = Math.min(GUTTER + px, x(bn.t) + bw)
    if (X1 <= X0) continue
    let acc = 0
    for (const [col, n] of stack(bn)) {
      const hh = n * k
      svg.append(s('rect', { x: X0, y: y0 - acc - hh, width: X1 - X0, height: Math.max(0.8, hh), fill: col }))
      acc += hh
    }
  }
  svg.append(s('line', { x1: GUTTER, x2: GUTTER + px, y1: y0, y2: y0, stroke: token('--text-tertiary') }))
  const ax = s('g')
  svg.append(ax)
  drawAxis(ax, x, a, b, y0, px)
  svg.append(s('rect', { id: 'fsel', x: 0, y: top, width: 0, height: H, fill: token('--accent'), opacity: 0.12, display: 'none' }))
  fc = { x, a, b, px, step, bs, top, H }
  drawChosen()
}

// the focus's gutter: what a bar counts and the legend of its colours
function renderLegend(caption, top) {
  const box = document.getElementById('legend')
  box.style.top = top + 'px'
  box.style.width = GUTTER - 22 + 'px'
  const items = []
  let hiding = false
  if (labelsOn()) {
    D.marks.forEach((m, j) => items.push(legendItem(markColour(j), markName(j), markN[j], markKey(j), hide.has(markKey(j)), labelBy(m.label), m.value)))
    items.push(legendItem(token('--viz-ink-4'), 'no label', noneN, 'none', hide.has('none')))
    hiding = hide.size > 0
  } else {
    const k = colourBy, off = (v) => F[k].size > 0 && !F[k].has(v)
    const named = colourOrder.filter((v) => v !== 0 && (counts[k].get(v) || 0) > 0)
    for (const v of named.slice(0, COLOURED)) items.push(legendItem(colourOf(v), nameOf(k, v), counts[k].get(v), v, off(v)))
    const rest = named.slice(COLOURED)
    if (rest.length) {
      const more = h('span', 'lg st')
      const sw = h('i', 'sw')
      sw.style.background = token('--viz-ink-4')
      const n = rest.reduce((sum, v) => sum + counts[k].get(v), 0) + (counts[k].get(0) || 0)
      more.append(sw, h('span', 'nm', `${rest.length} more`), h('span', 'n', fmt(n)))
      items.push(more)
    } else if ((counts[k].get(0) || 0) > 0) items.push(legendItem(token('--viz-ink-4'), FIELD[k][3], counts[k].get(0), 0, off(0)))
    hiding = F[k].size > 0
  }
  if (hiding) {
    const all = h('button', 'btn btn-ghost btn-sm', 'Show all')
    all.onclick = () => { if (labelsOn()) hide = new Set(); else F[colourBy].clear(); refresh() }
    items.push(all)
  }
  box.replaceChildren(h('div', 'cap', caption), ...items)
  renderPop()
}
function legendItem(colour, text, n, v, off, label, value) {
  const it = h('span', 'lg' + (off ? ' off' : ''))
  it.setAttribute('role', 'button')
  it.title = `${text}\nClick: only this · Shift-click: hide`
  if (label && label.id) it.dataset.label = label.id
  it.append(swatch(colour, label, value), h('span', 'nm', text), h('span', 'n', fmt(n || 0)))
  it.onclick = (e) => legendClick(v, e.shiftKey)
  return it
}
// a label value's swatch opens the palette of thimble's label colours, where thimble takes a colour change
function swatch(colour, label, value) {
  const sw = h('i', 'sw')
  sw.style.background = colour
  if (!label || !label.id || !(labelState.palette || []).length || !thimble.setLabelColour) return sw
  const b = h('span', 'swb')
  b.setAttribute('role', 'button')
  b.title = 'Change colour'
  b.dataset.act = 'palette'
  b.dataset.id = label.id
  b.dataset.value = value
  b.append(sw)
  b.onclick = (e) => { e.stopPropagation(); openPalette(label.id, value) }
  return b
}
// a click shows only that value, or every value again when it was alone; a shift-click hides it or shows it again
function legendClick(v, shift) {
  if (labelsOn()) {
    const keys = [...D.marks.map((_, j) => markKey(j)), 'none']
    if (shift) {
      const next = new Set(hide)
      next.has(v) ? next.delete(v) : next.add(v)
      if (next.size < keys.length) hide = next
    } else hide = hide.size === keys.length - 1 && !hide.has(v) ? new Set() : new Set(keys.filter((x) => x !== v))
  } else {
    const all = totals[colourBy]
    let shown = new Set(F[colourBy].size ? F[colourBy] : all)
    if (shift) {
      shown.has(v) ? shown.delete(v) : shown.add(v)
      if (!shown.size) return
    } else shown = shown.size === 1 && shown.has(v) ? new Set() : new Set([v])
    F[colourBy] = all.every((x) => shown.has(x)) ? new Set() : shown
  }
  refresh()
}

// ---------------------------------------------------------------- Colour and the palette
// Colour: a field, or the labels over files as thimble lists them, each turned on or off in thimble's Labels pane. A
// field colours the records only while no label is on, so choosing one turns the labels off.

// ---------------------------------------------------------------- lanes
let ln = null
function laneValues() {
  const k = group
  const vals = laneOrder
  const shown = foldLanes && vals.length > LANES ? vals.slice(0, LANES) : vals.slice()
  // a chosen value keeps its lane
  for (const v of F[k]) if (!shown.includes(v) && vals.includes(v)) shown.push(v)
  return { shown, total: vals.length }
}
const LANE = 20 // a lane's height
// while a label is on, a lane for each of its values the legend does not hide
const markLanes = () => (labelsOn() ? D.marks.map((m, j) => ({ j, m })).filter(({ j }) => !hide.has(markKey(j))) : [])
const SUB = 8 // a row's height where a lane splits by the colour field
// With a few lanes and a colour field other than the Group by one, each lane splits into a row per colour value, so
// the lanes compare by position as well as colour: the colour field's values in legend order, the rest in one row.
function subRows(nLanes) {
  if (group === colourBy || nLanes > 6 || labelsOn()) return null
  const vals = colourOrder.filter((v) => (counts[colourBy].get(v) || 0) > 0)
  const rows = vals.slice(0, COLOURED)
  if (vals.length > COLOURED) rows.push('rest')
  return rows.length > 1 ? rows : null
}
function laneHeight(nLanes) {
  const sub = subRows(nLanes)
  return sub ? sub.length * SUB + 8 : LANE
}
function renderLanes() {
  const svg = document.getElementById('lanes')
  const W = svg.parentElement.clientWidth - 32
  const px = W - GUTTER - RIGHT
  const [a, b] = win
  const x = (t) => GUTTER + ((t - a) / (b - a)) * px
  const { shown, total } = laneValues()
  const LH = laneHeight(shown.length)
  const sub = subRows(shown.length)
  const rowOf = (i) => {
    if (!sub) return 0
    const r = sub.indexOf(C[colourBy][i])
    return r >= 0 ? r : sub.length - 1
  }
  const marked = markLanes()
  const gap = marked.length ? 8 : 0
  const Ht = marked.length * LANE + shown.length * LH + gap + 4
  svg.setAttribute('width', W)
  svg.setAttribute('height', Ht)
  svg.replaceChildren()
  const narrowed = F[group].size > 0
  const laneName = (text, y) => s('text', { x: 14, y: y + 14, class: 'lane' }, clip(text, Math.floor((GUTTER - 54) / 6.4)))
  const tickW = 3
  const dense = (n) => n * (tickW + 1) > px * 1.5
  // a lane's records: a tick each, in its row; too many to tell apart are cells of a bin's width, darker for more
  const drawTicks = (g, idxs, y, h_, colour, rows) => {
    const nrows = rows ? rows.length : 1
    const rh = rows ? SUB : h_ - 8
    const top = (i) => y + 4 + (rows ? rowOf(i) * SUB : 0)
    if (dense(idxs.length)) {
      const step = stepFor(b - a, px, 4)
      const w = Math.max(1, (step / (b - a)) * px - 0.5)
      for (let r = 0; r < nrows; r++) {
        const bs = bins(a, b, step, rows ? idxs.filter((i) => rowOf(i) === r) : idxs)
        const max = Math.max(1, ...bs.map((bn) => bn.n))
        for (const bn of bs) {
          if (!bn.n) continue
          const opacity = 0.25 + 0.75 * (bn.n / max)
          g.append(s('rect', { x: x(bn.t), y: top(bn.first), width: w, height: rh - 1, fill: colour(bn.first), opacity }))
        }
      }
      return
    }
    for (const i of idxs) {
      const r = s('rect', { class: 'tick', x: x(X[i]) - tickW / 2, y: top(i), width: tickW, height: rh - 1, rx: 1, fill: colour(i) })
      r.dataset.i = i
      g.append(r)
    }
  }
  let y = 2
  for (const { j } of marked) {
    const idxs = []
    for (const i of vis) if (C.mb[i] & (1 << j)) idxs.push(i)
    const g = s('g')
    g.append(s('rect', { x: 0, y: y + 6, width: 8, height: 8, rx: 2, fill: markColour(j) }))
    g.append(laneName(markName(j), y))
    g.append(s('text', { x: GUTTER - 8, y: y + 14, 'text-anchor': 'end' }, fmt(idxs.length)))
    g.append(s('line', { x1: GUTTER, x2: GUTTER + px, y1: y + LANE / 2, y2: y + LANE / 2, stroke: token('--border-hairline') }))
    drawTicks(g, idxs, y, LANE, () => markColour(j), null)
    svg.append(g)
    y += LANE
  }
  y += gap
  const laneY = new Map()
  for (const v of shown) {
    const idxs = laneRecs.get(v) || []
    const on = F[group].has(v)
    const g = s('g', { class: narrowed && !on ? 'lane-off' : null })
    const head = s('g', { class: 'lanehead' + (on ? ' on' : '') })
    head.append(s('rect', { class: 'hit', x: -4, y, width: GUTTER - 2, height: LH, rx: 3 }))
    if (group === colourBy && !labelsOn()) head.append(s('rect', { x: 0, y: y + 6, width: 8, height: 8, rx: 2, fill: colourOf(v) }))
    const name = nameOf(group, v)
    const t = laneName(name, y)
    t.append(s('title', null, name))
    head.append(t, s('text', { x: GUTTER - 8, y: y + 14, 'text-anchor': 'end' }, fmt(idxs.length)))
    head.addEventListener('click', () => toggle(group, v))
    head.lane = { name, idxs }
    if (group === 'incident' && v) {
      head.dataset.anchor = `view:${slug}/${name}`
      head.dataset.anchorName = `the incident ${name}`
    }
    g.append(head)
    if (sub) {
      g.append(s('line', { x1: GUTTER, x2: GUTTER + px, y1: y + LH - 0.5, y2: y + LH - 0.5, stroke: token('--border-hairline') }))
      for (let r = 0; r < sub.length; r++) {
        const yy = y + 4 + r * SUB + (SUB - 1) / 2
        g.append(s('line', { x1: GUTTER, x2: GUTTER + px, y1: yy, y2: yy, stroke: token('--border-hairline'), 'stroke-dasharray': '1 3' }))
      }
    }
    else g.append(s('line', { x1: GUTTER, x2: GUTTER + px, y1: y + LH / 2, y2: y + LH / 2, stroke: token('--border-hairline') }))
    drawTicks(g, idxs, y, LH, recColour, sub)
    svg.append(g)
    laneY.set(v, y)
    y += LH
  }
  const more = document.getElementById('more')
  more.style.display = total > LANES ? '' : 'none'
  more.textContent = foldLanes ? `Show ${total - LANES} more` : 'Show fewer'
  ln = { x, px, laneY, top: 0, bottom: Ht }
  drawChosen()
}

// the chosen record as an accent line over the focus and the lanes
function drawChosen() {
  for (const id of ['focus', 'lanes']) {
    const svg = document.getElementById(id)
    const old = svg.querySelector('.chosen')
    if (old) old.remove()

// ---------------------------------------------------------------- list
// [class, name, width]; Service shows from WIDE px, since the text needs the room below it
const COLS = [['t', 'Time', 84], ['gap', 'Gap', 70], ['tk', 'Took', 66], ['s', 'Source', 76], ['k', 'Kind', 100],
  ['a', 'Actor', 94], ['sv', 'Service', 90], ['x', 'Text', null]]
const WIDE = 900
let tableSeq = 0
let listed = [] // the list's records in the order it shows them, which Earlier, Later and the arrow keys step through
async function renderTable() {
  const my = ++tableSeq
  const cols = document.getElementById('cols')
  const used = COLS.filter(([k]) => k !== 'sv' || document.getElementById('listbox').clientWidth >= WIDE)
  cols.replaceChildren(...used.map(([, , w]) => { const c = h('col'); if (w) c.style.width = w + 'px'; return c }))
  // from the incident's start, the time since the row above means little, and each row names its incident instead
  const head = (k, name) => (mode === 'start' && k === 't' ? 'From start' : mode === 'start' && k === 'gap' ? 'Incident' : name)
  if (mode === 'start' && sortBy === 'gap') sortBy = 't'
  const sortable = (k) => k === 't' || k === 'tk' || (k === 'gap' && mode === 'clock')
  document.getElementById('heads').replaceChildren(...used.map(([k, name]) => {
    const th = h('th', k + (sortable(k) ? ' sort' : ''), head(k, name) + (sortBy === k && k !== 't' ? ' ↓' : ''))
    if (sortable(k)) th.onclick = () => { sortBy = k; tableLimit = ROWS; renderTable() }
    return th
  }))
  const gapOf = new Map()
  let before = null
  for (const i of vis) { gapOf.set(i, before == null ? -1 : X[i] - X[before]); before = i }
  const rows = [...vis]
  if (sortBy === 'tk') rows.sort((p, q) => C.tk[q] - C.tk[p] || X[p] - X[q])
  else if (sortBy === 'gap') rows.sort((p, q) => gapOf.get(q) - gapOf.get(p) || X[p] - X[q])
  listed = rows
  const shown = rows.slice(0, tableLimit)
  const missing = [...shown].map((i) => C.r[i]).filter((r) => !texts.has(r))
  for (let p = 0; p < missing.length; p += 1000) {
    const res = await thimble.fetch({ op: 'texts', rows: missing.slice(p, p + 1000) })
    for (const [r, t] of res.texts) texts.set(r, t)
  }
  if (my !== tableSeq) return
  const tb = document.getElementById('tb')
  const out = []
  for (const i of shown) {
    const r = C.r[i]
    const tr = h('tr', r === sel ? 'active' : '')
    const text = texts.get(r) || ''
    tr.dataset.r = r
    tr.dataset.anchor = ref(i)
    tr.dataset.anchorText = text
    tr.dataset.anchorName = `the ${nameOf('source', C.source[i])} ${nameOf('kind', C.kind[i])} at ${hms(C.t[i])}`
    const src = h('td', 's')
    if (labelsOn()) src.append(markSwatches(i))
    else {
      const sq = h('span', 'sq')
      sq.style.background = recColour(i)
      src.append(sq)
    }
    src.append(nameOf('source', C.source[i]))
    const cell = (cls, k) => {
      const v = C[k][i]
      const td = h('td', cls + (v ? '' : ' none'), v ? nameOf(k, v) : '—')
      if (v && BAD.has(nameOf(k, v))) td.classList.add('bad')
      return td
    }
    const kind = cell('k', 'kind')
    const out_ = C.outcome[i] ? nameOf('outcome', C.outcome[i]) : ''
    if (out_ && out_ !== 'ok') {
      kind.textContent = `${nameOf('kind', C.kind[i])}, ${out_}`
      if (BAD.has(out_)) kind.classList.add('bad')
    }
    const time = h('td', 't', at(X[i]))
    if (mode === 'start') time.title = `${dayStr(C.t[i])} ${hms(C.t[i])}`
    const x = h('td', 'x', text)
    x.title = text
    // the time since the record before means something only while the rows are in time order or ranked by it
    const g = gapOf.get(i) < 0 || sortBy === 'tk' ? '' : dur(gapOf.get(i))
    const gap = h('td', 'gap', mode === 'start' ? nameOf('incident', C.incident[i]) : g)
    const took = h('td', 'gap', C.tk[i] < 0 ? '' : dur(C.tk[i]))
    tr.append(time, gap, took, src, kind, cell('a', 'actor'))
    if (used.length === COLS.length) tr.append(cell('sv', 'service'))
    tr.append(x)
    tr.onclick = () => select(r)
    out.push(tr)
  }
  tb.replaceChildren(...out)
  const pager = document.getElementById('pager')
  pager.replaceChildren()
  if (vis.length > shown.length) {
    const more = h('button', 'btn btn-secondary btn-sm', `Show ${fmt(Math.min(ROWS, vis.length - shown.length))} more of ${fmt(vis.length - shown.length)}`)

}

// ---------------------------------------------------------------- details
let detailSeq = 0
async function select(r, opts = {}) {
  sel = r
  for (const tr of document.querySelectorAll('#tb tr')) tr.classList.toggle('active', Number(tr.dataset.r) === r)
  drawChosen()
  scrollToChosen()
  const my = ++detailSeq
  const res = await thimble.fetch({ op: 'record', r, keep: keepRow != null ? [keepRow] : [] })
  if (my !== detailSeq) return
  detail = res
  renderDetail()

}
// in one column, the list and the details come up under the toolbar, the chosen row second in the list
function reveal() {
  if (window.matchMedia('(min-width: 1100px)').matches) return
  const box = document.getElementById('listbox')
  const tr = document.querySelector(`#tb tr[data-r="${sel}"]`)
  if (tr) box.scrollTop = Math.max(0, tr.offsetTop - document.querySelector('#tbl thead').offsetHeight - tr.offsetHeight)

function step(by) {
  const p = listed.findIndex((i) => C.r[i] === sel)
  const q = p < 0 ? 0 : p + by
  if (q < 0 || q >= listed.length) return
  if (q >= tableLimit) { tableLimit += ROWS; renderTable() }
  select(C.r[listed[q]])
}
function recRow(b, chosen) {
  const row = h('div', 'list-row rec' + (chosen ? ' active' : ''))
  const i = rowAt.get(b.r)
  const t = b.t - T0
  row.append(h('span', 't', mode === 'start' && i != null && !Number.isNaN(X[i]) ? since(X[i], true) : hms(t)))
  const d = h('span', 'd', chosen || !detail ? '' : (b.t < detail.t ? '−' : '+') + dur(b.t - detail.t))
  row.append(d, h('span', 's', `${b.source} ${b.kind}`), h('span', 'a', b.actor), h('span', 'x', b.text))
  row.title = b.text
  row.dataset.anchor = b.ref
  row.dataset.anchorText = b.text
  row.dataset.anchorName = `the ${b.source} ${b.kind} at ${hms(t)}`
  if (!chosen) row.onclick = () => select(b.r, { reveal: false })
  return row
}
function renderDetail() {

  const t = detail.t - T0
  const top = h('div', 'd-top')
  const sv = D.names.source ? D.names.source.indexOf(String(r.source || '')) : -1
  const srcOn = sv >= 0 && F.source.size === 1 && F.source.has(sv)
  const srcChip = h('button', 'chip chip-sans chip-tone-neutral chip-act' + (srcOn ? ' active' : ''), r.source || 'record')
  if (sv >= 0) srcChip.onclick = () => only('source', sv)

  const prev = h('button', 'btn btn-ghost btn-sm', 'Earlier')

  top.append(prev, next)
  const text = h('div', 'd-text' + ((r.text || '').length > 140 ? ' long' : ''), r.text || '')
  const facts = h('dl', 'facts')
  const fact = (name, content) => {
    const f = h('div', 'fact')
    const dd = h('dd')
    dd.append(content)
    f.append(h('dt', null, name), dd)
    facts.append(f)
  }
  for (const [k, name] of FIELDS.slice(1)) {
    const value = r[k]
    if (value == null || value === '') continue
    const v = D.names[k] ? D.names[k].indexOf(String(value)) : -1
    const on = v >= 0 && F[k].size === 1 && F[k].has(v)
    const chip = h('button', 'chip chip-sans chip-tone-neutral chip-act' + (on ? ' active' : '') + (BAD.has(String(value)) ? ' bad' : ''), String(value))

      chip.dataset.anchor = `view:${slug}/${value}`

    fact(name, chip)

  const labs = h('dl', 'facts')
  if (i != null && C.mb[i]) {
    const f = h('div', 'fact')

      const b = h('span', 'box on')

      c.append(b, markName(j))
      const l = labelBy(D.marks[j].label)
      if (l && l.id) c.dataset.label = l.id
      dd.append(c)

    const sec = h('div', 'd-sec')
    sec.append(h('span', 't', 'Answered by'), h('span', 'n', fmt(detail.answered.length)))
    parts.push(sec, ...detail.answered.map((b) => recRow(b, false)))
  }
  const sec = h('div', 'd-sec')
  sec.append(h('span', 't', 'Around it'), h('span', 'n', 'every source'))
  parts.push(sec, ...detail.near.map((b) => recRow(b, b.r === detail.r)))

  card.dataset.anchor = detail.ref
  card.dataset.anchorText = r.text || ''
  card.dataset.anchorName = `the ${r.source || 'record'} ${r.kind || ''} at ${hms(t)}`
  card.append(top, text, facts)
  box.replaceChildren(card, ...(labs.childNodes.length ? [labs] : []), ...parts.slice(3))
}

  renderOverview()
  renderFocus()
  renderLanes()

}
let frame = 0
function setWin(a, b) {
  const min = 60
  if (b - a < min) { const c = (a + b) / 2; a = c - min / 2; b = c + min / 2 }
  a = Math.max(SPAN[0], a)
  b = Math.min(SPAN[1], b)
  win = [a, b]
  cancelAnimationFrame(frame)
  frame = requestAnimationFrame(refreshWindow)
}

// ---------------------------------------------------------------- tooltip
const tip = document.getElementById('tip')
function showTip(e, build) {
  tip.replaceChildren()
  build(tip)
  tip.style.display = 'block'
  const w = tip.offsetWidth, hh = tip.offsetHeight
  let left = e.clientX + 14, top = e.clientY + 14
  if (left + w > innerWidth - 8) left = e.clientX - w - 14
  if (top + hh > innerHeight - 8) top = e.clientY - hh - 14
  tip.style.left = Math.max(4, left) + 'px'
  tip.style.top = Math.max(4, top) + 'px'
}
const hideTip = () => { tip.style.display = 'none' }
function tipRow(el, colour, label, n) {
  const r = h('div', 'r')
  const sq = h('span', 'sq')
  if (colour) sq.style.background = colour
  r.append(sq, h('span', 'l', label), h('span', null, n))
  el.append(r)
}
let tipFor = null // the record whose tooltip is wanted, so a text that arrives after the pointer left is not shown
async function recordTip(e, i) {
  const r = C.r[i]
  tipFor = i
  if (!texts.has(r)) {
    const res = await thimble.fetch({ op: 'texts', rows: [r] })
    for (const [row, t] of res.texts) texts.set(row, t)
    if (tipFor !== i) return
  }
  showTip(e, (el) => {
    el.append(h('div', 'h', `${at(X[i])} · ${nameOf('source', C.source[i])} ${nameOf('kind', C.kind[i])}`))
    const who = [nameOf('actor', C.actor[i]), C.service[i] ? nameOf('service', C.service[i]) : '',
      C.incident[i] ? nameOf('incident', C.incident[i]) : ''].filter(Boolean).join(' · ')
    el.append(h('div', 'r', who), h('div', 'body', clip(texts.get(r) || '', 220)))
  })
}

// a lane's records in the window: how many, from when to when, and how they split by the colour field or the marks
function laneTip(e, { name, idxs }) {
  showTip(e, (el) => {
    el.append(h('div', 'h', `${name} · ${plural(idxs.length, 'record', 'records')}`))
    if (!idxs.length) return
    const a = X[idxs[0]], b = X[idxs[idxs.length - 1]]
    el.append(h('div', 'r', `${at(a, false)}–${at(b, false)} · ${dur(b - a)}`))
    const by = new Map()
    for (const i of idxs) {
      const key = labelsOn() ? M[i] : C[colourBy][i]
      by.set(key, (by.get(key) || 0) + 1)
    }
    const top = [...by.entries()].sort((p, q) => q[1] - p[1])
    for (const [v, n] of top.slice(0, 6)) {
      if (!labelsOn()) tipRow(el, colourOf(v), nameOf(colourBy, v), fmt(n))
      else if (v >= 0) tipRow(el, markColour(v), markName(v), fmt(n))
      else tipRow(el, token('--viz-ink-4'), 'no label', fmt(n))
    }
    if (top.length > 6) tipRow(el, null, `${top.length - 6} more`, fmt(top.slice(6).reduce((sum, p) => sum + p[1], 0)))
  })
}

// ---------------------------------------------------------------- interaction
function svgX(svg, e) { return e.clientX - svg.getBoundingClientRect().left }
function within(xp, st) { return Math.max(GUTTER, Math.min(GUTTER + st.px, xp)) }
function toT(xp, st) { return st.a + ((within(xp, st) - GUTTER) / st.px) * (st.b - st.a) }

const ovSvg = document.getElementById('overview')
ovSvg.addEventListener('mousedown', (e) => {
  if (!ov || svgX(ovSvg, e) < GUTTER - 4) return
  e.preventDefault()
  const x0 = svgX(ovSvg, e), t0 = toT(x0, ov)
  const bx0 = ov.x(win[0]), bx1 = ov.x(win[1])
  let how = 'new'
  if (!whole()) {
    if (Math.abs(x0 - bx0) < 6) how = 'left'
    else if (Math.abs(x0 - bx1) < 6) how = 'right'
    else if (x0 > bx0 && x0 < bx1) how = 'move'
  }
  const w0 = win.slice()
  let moved = false
  const move = (ev) => {
    const t = toT(svgX(ovSvg, ev), ov)
    if (Math.abs(svgX(ovSvg, ev) - x0) > 2) moved = true
    if (!moved) return
    if (how === 'new') setWin(Math.min(t0, t), Math.max(t0, t))
    else if (how === 'left') setWin(Math.min(t, w0[1] - 60), w0[1])
    else if (how === 'right') setWin(w0[0], Math.max(t, w0[0] + 60))
    else {
      const d = Math.max(SPAN[0] - w0[0], Math.min(SPAN[1] - w0[1], t - t0))
      setWin(w0[0] + d, w0[1] + d)
    }
  }
  const up = () => {
    removeEventListener('mousemove', move)
    removeEventListener('mouseup', up)
    if (!moved && how !== 'move') {
      // a click centres the window on that moment, keeping its width, or a tenth of the span from the whole
      const w = whole() ? (SPAN[1] - SPAN[0]) / 10 : win[1] - win[0]
      setWin(t0 - w / 2, t0 + w / 2)
    }
  }
  addEventListener('mousemove', move)
  addEventListener('mouseup', up)
})
ovSvg.addEventListener('dblclick', () => setWin(SPAN[0], SPAN[1]))

const fcSvg = document.getElementById('focus')
fcSvg.addEventListener('mousedown', (e) => {
  if (!fc || svgX(fcSvg, e) < GUTTER) return
  e.preventDefault()
  hideTip()
  const x0 = within(svgX(fcSvg, e), fc)
  const box = fcSvg.querySelector('#fsel')
  let moved = false
  const move = (ev) => {
    const x1 = within(svgX(fcSvg, ev), fc)
    if (Math.abs(x1 - x0) > 3) moved = true
    if (!moved) return
    box.setAttribute('display', '')
    box.setAttribute('x', Math.min(x0, x1))
    box.setAttribute('width', Math.abs(x1 - x0))
  }
  const up = (ev) => {
    removeEventListener('mousemove', move)
    removeEventListener('mouseup', up)
    const x1 = within(svgX(fcSvg, ev), fc)
    if (moved) return setWin(toT(Math.min(x0, x1), fc), toT(Math.max(x0, x1), fc))
    const bn = binAt(x0)
    if (bn && bn.first >= 0) select(C.r[bn.first])
  }
  addEventListener('mousemove', move)
  addEventListener('mouseup', up)
})
function binAt(xp) {
  if (!fc) return null
  const t = toT(xp, fc)
  return fc.bs.find((bn) => t >= bn.t && t < bn.t + fc.step) || null
}
fcSvg.addEventListener('mousemove', (e) => {
  const bn = binAt(svgX(fcSvg, e))
  if (!bn || !bn.n || svgX(fcSvg, e) < GUTTER) return hideTip()
  showTip(e, (el) => {
    el.append(h('div', 'h', `${at(bn.t, false)}–${at(bn.t + fc.step, false)} · ${plural(bn.n, 'record', 'records')}`))
    if (labelsOn()) {
      for (const [m, n] of bn.marks) if (m >= 0) tipRow(el, markColour(m), markName(m), fmt(n))
      if (bn.marks.get(-1)) tipRow(el, token('--viz-ink-4'), 'no label', fmt(bn.marks.get(-1)))
      return
    }
    const top = [...bn.by.entries()].sort((p, q) => q[1] - p[1])
    for (const [v, n] of top.slice(0, 6)) tipRow(el, colourOf(v), nameOf(colourBy, v), fmt(n))
    if (top.length > 6) tipRow(el, null, `${top.length - 6} more`, fmt(top.slice(6).reduce((sum, p) => sum + p[1], 0)))
  })
})
fcSvg.addEventListener('mouseleave', hideTip)

const lnSvg = document.getElementById('lanes')
lnSvg.addEventListener('mousemove', (e) => {
  const t = e.target
  const head = t && t.closest ? t.closest('.lanehead') : null
  if (t && t.classList && t.classList.contains('tick')) recordTip(e, Number(t.dataset.i))
  else if (head && head.lane) { tipFor = null; laneTip(e, head.lane) }
  else { tipFor = null; hideTip() }
})
lnSvg.addEventListener('mouseleave', () => { tipFor = null; hideTip() })
lnSvg.addEventListener('click', (e) => {
  const t = e.target
  if (t && t.classList && t.classList.contains('tick')) select(C.r[Number(t.dataset.i)])
})

document.getElementById('more').onclick = () => { foldLanes = !foldLanes; renderLanes() }
document.getElementById('whole').onclick = () => setWin(SPAN[0], SPAN[1])
document.getElementById('zoomout').onclick = () => {
  const c = (win[0] + win[1]) / 2, w = (win[1] - win[0]) * 2
  setWin(c - w / 2, c + w / 2)
}
document.getElementById('clear').onclick = () => {
  for (const k of KEYS) F[k].clear()
  hide = new Set()
  searchQ = ''
  searchSet = null
  document.getElementById('q').value = ''
  refresh()
}
let typing = null
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(typing)
  typing = setTimeout(async () => {
    const q = e.target.value.trim()
    searchQ = q
    if (!q) searchSet = null
    else {
      const res = await thimble.fetch({ op: 'search', q })
      if (searchQ !== q) return
      searchSet = new Set(res.rows)
    }
    refresh()
  }, 200)
})
document.getElementById('listbox').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault()
    step(e.key === 'ArrowDown' ? 1 : -1)
  }
})
let resizeTimer = null
addEventListener('resize', () => {
  clearTimeout(resizeTimer)
  resizeTimer = setTimeout(refresh, 120)
})

// ---------------------------------------------------------------- places
// A record opens chosen, in its incident's span when it has one, else the hour around it, with any filter that drops
// it cleared; an incident opens filtered to it alone; a window opens zoomed to it with no filter.
async function openPlace(target) {
  if (target.r != null) {
    const i = rowAt.get(target.r)
    if (i == null) return
    for (const k of KEYS) if (F[k].size && !F[k].has(C[k][i])) F[k].clear()
    if (C.mb[i] ? D.marks.every((_, j) => !(C.mb[i] & (1 << j)) || hide.has(markKey(j))) : hide.has('none')) hide = new Set()
    if (searchSet && !searchSet.has(target.r)) { searchSet = null; searchQ = ''; document.getElementById('q').value = '' }
    if (Number.isNaN(X[i])) { mode = 'clock'; win = null; place() }
    setAround(i)
    refresh()
    await select(target.r)
  } else if (target.incident) {
    const v = D.names.incident.indexOf(target.incident)
    if (v < 0) return
    for (const k of KEYS) F[k].clear()
    F.incident = new Set([v])
    hide = new Set()
    searchSet = null
    searchQ = ''
    document.getElementById('q').value = ''
    const own = [...ORDER].filter((i) => C.incident[i] === v)
    if (own.length) {
      const a = X[own[0]], b = X[own[own.length - 1]], pad = Math.max(300, (b - a) * 0.05)
      win = [Math.max(SPAN[0], a - pad), Math.min(SPAN[1], b + pad)]
    }
    refresh()
  } else if (target.from && target.to) {
    for (const k of KEYS) F[k].clear()
    hide = new Set()
    searchSet = null
    searchQ = ''
    document.getElementById('q').value = ''
    if (mode !== 'clock') { mode = 'clock'; win = null; place() }
    const a = Date.parse(target.from + ':00Z') / 1000 - T0, b = Date.parse(target.to + ':00Z') / 1000 - T0
    if (b > a) win = [Math.max(SPAN[0], a), Math.min(SPAN[1], b)]
    refresh()
  } else refresh()
}
function setAround(i) {
  const v = C.incident[i]
  const own = v ? [...ORDER].filter((j) => C.incident[j] === v) : []
  let a = X[i] - 1800, b = X[i] + 1800
  if (own.length) {
    const pad = Math.max(300, (X[own[own.length - 1]] - X[own[0]]) * 0.05)
    a = Math.min(a, X[own[0]] - pad)
    b = Math.max(b, X[own[own.length - 1]] + pad)
  }
  win = [Math.max(SPAN[0], a), Math.min(SPAN[1], b)]
}

let opened = null
thimble.onOpen(async (place_) => {
  const t = (place_ && place_.target) || {}
  opened = t
  if (t.r != null) keepRow = t.r
  if (!D || (t.r != null && !rowAt.has(t.r))) { if (!(await load())) return }
  await openPlace(t)
})
thimble.onLabels(async (state) => {
  const was = JSON.stringify([labelState.labels, labelState.filter])
  labelState = { labels: state.labels || [], filter: state.filter || null, all: state.all || null, palette: state.palette || null }
  if (!D) return // the first fetch reads them
  // the reader applies the labels that are on and the filter; the list of labels and the palette only redraw
  if (JSON.stringify([labelState.labels, labelState.filter]) === was) { renderColour(); return renderFocus() }
  if (!(await load())) return
  if (sel != null && !rowAt.has(sel)) { sel = null; detail = null; renderDetail() }
  refresh()
  if (sel != null) select(sel, { reveal: false })
})
</script>
