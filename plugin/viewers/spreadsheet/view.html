<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .seg, .btn) and the theme's tokens come with the frame */
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; }
  nav { flex: none; display: flex; gap: 10px; align-items: center; overflow-x: auto; padding: 8px 12px; border-bottom: 1px solid var(--border-hairline); }
  nav .path { font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-tertiary); }
  #grid { flex: 1; min-height: 0; overflow: auto; }
  table { border-collapse: separate; border-spacing: 0; font: 400 var(--text-xs) / 1.4 var(--font-body); font-variant-numeric: tabular-nums; }
  th, td { max-width: 320px; overflow: hidden; padding: 3px 8px; border-right: 1px solid var(--border-hairline); border-bottom: 1px solid var(--border-hairline); text-overflow: ellipsis; white-space: nowrap; }
  th { background: var(--bg-sub); color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  thead th { position: sticky; top: 0; z-index: 2; }
  th.n { position: sticky; left: 0; z-index: 1; text-align: right; }
  thead th.n { z-index: 3; }
  td { background: var(--surface-card); }
  td.num { text-align: right; font-family: var(--font-mono); font-size: var(--text-mono-sm); }
  tr.target td, td.target { background: var(--accent-soft); }
  td.target { outline: 1px solid var(--accent); outline-offset: -1px; }
  .more { margin: 10px 12px; }
  .error { padding: 16px; color: var(--status-negative); }
</style>
</head>
<body>
  <nav id="nav"></nav>
  <div id="grid"></div>
<script>
  // Spreadsheet: one sheet at a time as a grid, its column letters and row numbers frozen, the cited cell, range or
  // row selected. A delimited file cites its rows by line; a workbook cites cells in its own notation, so each cell is
  // a data-anchor of the form <path>#<Sheet>!<A1> and a row of a delimited file one of the form <path>#L<n>.
  let files = []
  let view = null // {path, sheet, sheets, total, start, rows}
  let target = null
  const $ = (s) => document.querySelector(s)
  const el = (tag, cls, text) => {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }
  const colName = (i) => {
    let s = ''
    for (i += 1; i; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + ((i - 1) % 26)) + s
    return s
  }
  const isXlsx = (path) => /\.xlsx$/i.test(path)
  const sheetRef = (sheet) => encodeURIComponent(sheet).replace(/%2F/g, '/')
  const numeric = (v) => v !== '' && !Number.isNaN(Number(v))

  function drawNav() {
    const nav = $('#nav')
    nav.replaceChildren()
    if (files.length > 1) {
      const pick = el('select', 'field')
      for (const f of files) {
        const o = el('option', null, f.path)
        o.value = f.path
        o.selected = view && f.path === view.path
        pick.append(o)
      }
      pick.onchange = () => thimble.navigate(pick.value)
      nav.append(pick)
    } else if (view) nav.append(el('span', 'path', view.path))
    const sheets = (view && view.sheets) || []
    if (sheets.length) {
      const tabs = el('div', 'seg seg-track')
      for (const s of sheets) {
        const tab = el('button', 'seg-opt' + (s === view.sheet ? ' active' : ''), s)
        tab.dataset.anchor = `${view.path}#${sheetRef(s)}`
        tab.dataset.anchorName = `the sheet ${s} of ${view.path}`
        tab.onclick = () => thimble.navigate(`${view.path}#${sheetRef(s)}`)
        tabs.append(tab)
      }
      nav.append(tabs)
    }
  }

  function inTarget(r, c) {
    if (!target || target.path !== view.path) return false
    if (target.row != null) return r === target.row
    if (!target.cell) return false
    const [r0, c0] = target.cell
    const [r1, c1] = target.to || target.cell
    return r >= r0 && r <= r1 && c >= c0 && c <= c1
  }

  function drawGrid() {
    const box = $('#grid')
    box.replaceChildren()
    if (!view) return
    if (view.error) return box.append(el('div', 'error', view.error))
    const width = Math.max(0, ...view.rows.map(([, cells]) => cells.length))
    const table = el('table')
    const head = el('tr')
    head.append(el('th', 'n', ''))
    for (let c = 0; c < width; c++) head.append(el('th', null, colName(c)))
    const thead = el('thead')
    thead.append(head)
    const body = el('tbody')
    const xlsx = isXlsx(view.path)
    for (const [n, cells] of view.rows) {
      const tr = el('tr', !xlsx && inTarget(n, 0) ? 'target' : '')
      const num = el('th', 'n', String(n))
      if (!xlsx) {
        tr.dataset.anchor = `${view.path}#L${n}`
        tr.dataset.anchorName = `row ${n} of ${view.path}`
        tr.dataset.anchorText = cells.join('\t')
      }
      tr.append(num)
      for (let c = 0; c < width; c++) {
        const v = cells[c] ?? ''
        const td = el('td', (numeric(v) ? 'num' : '') + (xlsx && inTarget(n, c) ? ' target' : ''), v)
        if (xlsx) {
          td.dataset.anchor = `${view.path}#${sheetRef(view.sheet)}!${colName(c)}${n}`
          td.dataset.anchorName = `${view.sheet}!${colName(c)}${n}`
        }
        td.title = v
        tr.append(td)
      }
      body.append(tr)
    }
    table.append(thead, body)
    box.append(table)
    const last = view.start + view.rows.length - 1
    if (last < view.total) {
      const more = el('button', 'btn btn-secondary btn-sm more', `Rows ${last + 1} to ${Math.min(view.total, last + 200)}`)
      more.onclick = () => show(view.path, view.sheet, last + 1)
      box.append(more)
    }
    const hit = box.querySelector('td.target, tr.target')
    if (hit) hit.scrollIntoView({ block: 'center', inline: 'center' })
  }

  async function show(path, sheet, start) {
    view = await thimble.fetch({ op: 'sheet', path, sheet, start })
    drawNav()
    drawGrid()
  }

  thimble.onOpen(async (place) => {
    if (!files.length) files = await thimble.fetch({ op: 'files' })
    target = (place && place.target) || null
    const path = (target && target.path) || (place && place.path) || (files[0] && files[0].path)
    if (!path) return
    const row = target && (target.row || (target.cell && target.cell[0]))
    const start = row && row > 150 ? row - 50 : 1
    await show(path, target && target.sheet, start)
  })
</script>
</body>
</html>
