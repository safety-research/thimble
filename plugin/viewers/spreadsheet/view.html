<!doctype html>
<html>
<head>
<style>
  :root {
    --ink: var(--text-primary, #23211d);
    --ink-2: var(--text-secondary, #5f5a52);
    --ink-3: var(--text-tertiary, #8b857b);
    --card: var(--surface-card, #ffffff);
    --inset: var(--bg-sunken, #f3f1ec);
    --line: var(--border-hairline, rgba(35, 33, 29, 0.08));
    --line-2: var(--border-subtle, rgba(35, 33, 29, 0.12));
    --live: var(--accent, #5b5bd6);
    --live-soft: var(--accent-soft, rgba(91, 91, 214, 0.14));
    --sans: var(--font-body, ui-sans-serif, system-ui, sans-serif);
    --mono: var(--font-mono, ui-monospace, monospace);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 12px/1.4 var(--sans); color: var(--ink); display: flex; flex-direction: column; }
  nav { flex: none; display: flex; gap: 14px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line-2); }
  .tab { font: 12px var(--sans); color: var(--ink-2); cursor: pointer; padding: 2px 0; border-bottom: 2px solid transparent; }
  .tab.on { color: var(--live); border-bottom-color: var(--live); }
  #grid { flex: 1; min-height: 0; overflow: auto; }
  table { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
  th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 3px 8px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  thead th { position: sticky; top: 0; background: var(--inset); font: 500 11px var(--mono); color: var(--ink-3); z-index: 2; }
  th.n { position: sticky; left: 0; background: var(--inset); font: 11px var(--mono); color: var(--ink-3); text-align: right; z-index: 1; }
  thead th.n { z-index: 3; }
  td { background: var(--card); }
  td.num { text-align: right; font-family: var(--mono); }
  tr.target td, td.target { background: var(--live-soft); }
  td.target { outline: 1px solid var(--live); outline-offset: -1px; }
  /* the file menu is thimble's field (.field) and the next rows its button (.btn), which every view's page has */
  .more { margin: 10px 12px; }
  .error { padding: 16px; color: var(--status-negative, #b3261e); }
</style>
</head>
<body>
  <nav id="nav"></nav>
  <div id="grid"></div>
<script>
  // Spreadsheet: one sheet at a time as a grid, its column letters and row numbers frozen, the cited cell, range or
  // row selected. A delimited file cites its rows by line; a workbook cites cells in its own notation, so each cell is
  // a data-anchor of the form <path>#<Sheet>!<A1> and a row of a delimited file one of the form <path>#L<n>.
  let files = []
  let view = null // {path, sheet, sheets, total, start, rows}
  let target = null
  const $ = (s) => document.querySelector(s)
  const el = (tag, cls, text) => {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }
  const colName = (i) => {
    let s = ''
    for (i += 1; i; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + ((i - 1) % 26)) + s
    return s
  }
  const isXlsx = (path) => /\.xlsx$/i.test(path)
  const sheetRef = (sheet) => encodeURIComponent(sheet).replace(/%2F/g, '/')
  const numeric = (v) => v !== '' && !Number.isNaN(Number(v))

  function drawNav() {
    const nav = $('#nav')
    nav.replaceChildren()
    if (files.length > 1) {
      const pick = el('select', 'field mono')
      for (const f of files) {
        const o = el('option', null, f.path)
        o.value = f.path
        o.selected = view && f.path === view.path
        pick.append(o)
      }
      pick.onchange = () => thimble.navigate(pick.value)
      nav.append(pick)
    } else if (view) nav.append(el('span', 'mono', view.path))
    for (const s of (view && view.sheets) || []) {
      const tab = el('span', 'tab' + (s === view.sheet ? ' on' : ''), s)
      tab.dataset.anchor = `${view.path}#${sheetRef(s)}`
      tab.dataset.anchorName = `the sheet ${s} of ${view.path}`
      tab.onclick = () => thimble.navigate(`${view.path}#${sheetRef(s)}`)
      nav.append(tab)
    }
  }

  function inTarget(r, c) {
    if (!target || target.path !== view.path) return false
    if (target.row != null) return r === target.row
    if (!target.cell) return false
    const [r0, c0] = target.cell
    const [r1, c1] = target.to || target.cell
    return r >= r0 && r <= r1 && c >= c0 && c <= c1
  }

  function drawGrid() {
    const box = $('#grid')
    box.replaceChildren()
    if (!view) return
    if (view.error) return box.append(el('div', 'error', view.error))
    const width = Math.max(0, ...view.rows.map(([, cells]) => cells.length))
    const table = el('table')
    const head = el('tr')
    head.append(el('th', 'n', ''))
    for (let c = 0; c < width; c++) head.append(el('th', null, colName(c)))
    const thead = el('thead')
    thead.append(head)
    const body = el('tbody')
    const xlsx = isXlsx(view.path)
    for (const [n, cells] of view.rows) {
      const tr = el('tr', !xlsx && inTarget(n, 0) ? 'target' : '')
      const num = el('th', 'n', String(n))
      if (!xlsx) {
        tr.dataset.anchor = `${view.path}#L${n}`
        tr.dataset.anchorName = `row ${n} of ${view.path}`
        tr.dataset.anchorText = cells.join('\t')
      }
      tr.append(num)
      for (let c = 0; c < width; c++) {
        const v = cells[c] ?? ''
        const td = el('td', (numeric(v) ? 'num' : '') + (xlsx && inTarget(n, c) ? ' target' : ''), v)
        if (xlsx) {
          td.dataset.anchor = `${view.path}#${sheetRef(view.sheet)}!${colName(c)}${n}`
          td.dataset.anchorName = `${view.sheet}!${colName(c)}${n}`
        }
        td.title = v
        tr.append(td)
      }
      body.append(tr)
    }
    table.append(thead, body)
    box.append(table)
    const last = view.start + view.rows.length - 1
    if (last < view.total) {
      const more = el('button', 'btn btn-secondary btn-sm more', `Rows ${last + 1} to ${Math.min(view.total, last + 200)}`)
      more.onclick = () => show(view.path, view.sheet, last + 1)
      box.append(more)
    }
    const hit = box.querySelector('td.target, tr.target')
    if (hit) hit.scrollIntoView({ block: 'center', inline: 'center' })
  }

  async function show(path, sheet, start) {
    view = await thimble.fetch({ op: 'sheet', path, sheet, start })
    drawNav()
    drawGrid()
  }

  thimble.onOpen(async (place) => {
    if (!files.length) files = await thimble.fetch({ op: 'files' })
    target = (place && place.target) || null
    const path = (target && target.path) || (place && place.path) || (files[0] && files[0].path)
    if (!path) return
    const row = target && (target.row || (target.cell && target.cell[0]))
    const start = row && row > 150 ? row - 50 : 1
    await show(path, target && target.sheet, start)
  })
</script>
</body>
</html>
