<!doctype html>
<html>
<head>
<style>
  :root {
    --ink: var(--text-primary, #23211d);
    --ink-2: var(--text-secondary, #5f5a52);
    --ink-3: var(--text-tertiary, #8b857b);
    --card: var(--surface-card, #ffffff);
    --inset: var(--bg-sunken, #f3f1ec);
    --line: var(--border-hairline, rgba(35, 33, 29, 0.08));
    --line-2: var(--border-subtle, rgba(35, 33, 29, 0.12));
    --live: var(--accent, #5b5bd6);
    --live-soft: var(--accent-soft, rgba(91, 91, 214, 0.14));
    --node: var(--viz-ink-2, #6b665e);
    --sans: var(--font-body, ui-sans-serif, system-ui, sans-serif);
    --mono: var(--font-mono, ui-monospace, monospace);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 13px/1.5 var(--sans); color: var(--ink); display: grid; grid-template-columns: 1fr 340px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #graph { width: 100%; height: 100%; display: block; }
  .edge { stroke: var(--ink-3); stroke-opacity: 0.35; cursor: pointer; }
  .edge:hover, .edge.on { stroke: var(--live); stroke-opacity: 1; }
  .node circle { fill: var(--node); stroke: var(--card); stroke-width: 1.5; cursor: pointer; }
  .node.on circle { fill: var(--live); }
  .node text { font-family: var(--mono); fill: var(--ink-2); pointer-events: none; }
  aside { border-left: 1px solid var(--line-2); overflow: auto; padding: 16px; }
  aside h2 { font-size: 14px; font-weight: 500; margin: 0 0 2px; }
  aside .meta { font-size: 11px; color: var(--ink-3); margin-bottom: 12px; }
  .hop { background: var(--card); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; border: 1px solid transparent; }
  .hop:hover { background: var(--inset); }
  .hop.target { border-color: var(--live); }
  .hop .who { font-size: 12px; font-weight: 500; }
  .hop .where { font-size: 11px; color: var(--ink-3); }
</style>
</head>
<body>
  <svg id="graph" role="img" aria-label="Agents linked by hand-offs"></svg>
  <aside id="side"></aside>
<script>
  // Hand-offs: the overview is the whole network, every agent and the heaviest links between them, drawn as a force
  // layout; beside it the records behind the edge the analyst picks. A node focuses its agent's own links; an edge lists
  // its events, each a data-anchor with its line, so the labels the analyst turns on mark them, and a click on one opens
  // that event wherever thimble opens it. Each node carries view:<slug>/<agent>.
  const slug = (thimble.view && thimble.view.slug) || 'hand-offs'
  const NS = 'http://www.w3.org/2000/svg'
  const svg = document.getElementById('graph')
  const side = document.getElementById('side')
  let focus = null
  let chosenPair = null
  let targetRef = null
  let heaviest = null // the pair of the heaviest edge drawn, whose records the page lists when nothing is picked

  function node(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag)
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v)
    if (parent) parent.append(e)
    return e
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }

  // A plain force layout: nodes start on a circle, repel each other, edges pull their ends together. Deterministic, so
  // the same graph always lands the same way.
  function layout(nodes, edges, w, h) {
    const n = nodes.length
    const pos = new Map(nodes.map((d, i) => [d.id, { x: w / 2 + (w / 3) * Math.cos((2 * Math.PI * i) / n), y: h / 2 + (h / 3) * Math.sin((2 * Math.PI * i) / n) }]))
    const k = Math.sqrt((w * h) / Math.max(1, n)) * 0.6
    for (let step = 0, t = w / 10; step < 250; step++, t *= 0.985) {
      const disp = new Map(nodes.map((d) => [d.id, { x: 0, y: 0 }]))
      for (let i = 0; i < n; i++)
        for (let j = i + 1; j < n; j++) {
          const a = pos.get(nodes[i].id), b = pos.get(nodes[j].id)
          const dx = a.x - b.x, dy = a.y - b.y, d = Math.max(0.01, Math.hypot(dx, dy)), f = (k * k) / d
          disp.get(nodes[i].id).x += (dx / d) * f; disp.get(nodes[i].id).y += (dy / d) * f
          disp.get(nodes[j].id).x -= (dx / d) * f; disp.get(nodes[j].id).y -= (dy / d) * f
        }
      for (const e of edges) {
        const a = pos.get(e.source), b = pos.get(e.target)
        const dx = a.x - b.x, dy = a.y - b.y, d = Math.max(0.01, Math.hypot(dx, dy)), f = (d * d) / k
        disp.get(e.source).x -= (dx / d) * f; disp.get(e.source).y -= (dy / d) * f
        disp.get(e.target).x += (dx / d) * f; disp.get(e.target).y += (dy / d) * f
      }
      for (const d of nodes) {
        const p = pos.get(d.id), v = disp.get(d.id), len = Math.max(0.01, Math.hypot(v.x, v.y))
        p.x = Math.min(w - 80, Math.max(20, p.x + (v.x / len) * Math.min(len, t))) // room for a label on the right
        p.y = Math.min(h - 20, Math.max(20, p.y + (v.y / len) * Math.min(len, t)))
      }
    }
    // the settled layout is scaled to fill the box, so the whole network uses the page rather than a corner of it
    const xs = [...pos.values()].map((p) => p.x), ys = [...pos.values()].map((p) => p.y)
    const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)]
    const sx = (w - 120) / Math.max(1, x1 - x0), sy = (h - 60) / Math.max(1, y1 - y0)
    for (const p of pos.values()) {
      p.x = 30 + (p.x - x0) * sx
      p.y = 30 + (p.y - y0) * sy
    }
    return pos
  }

  async function drawGraph() {
    const g = await thimble.fetch({ op: 'graph', around: focus || undefined })
    const w = svg.clientWidth || 700, h = svg.clientHeight || 500
    svg.replaceChildren()
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`)
    const pos = layout(g.nodes, g.edges, w, h)
    heaviest = g.edges.length ? g.edges[0].pair : null
    const maxW = Math.max(1, ...g.edges.map((e) => e.weight))
    const maxN = Math.max(1, ...g.nodes.map((d) => d.weight))
    // Labels are sized and thinned by the number of nodes: a small network names every agent in a readable size, and
    // a crowded one names only its busier agents, a little smaller, since names drawn over each other name nobody.
    const n = g.nodes.length
    const font = n <= 15 ? 12 : n <= 40 ? 11 : 10
    const named = n <= 15 ? 0 : n <= 40 ? 0.15 : 0.35
    for (const e of g.edges) {
      const a = pos.get(e.source), b = pos.get(e.target)
      const line = node('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: 'edge' + (e.pair === chosenPair ? ' on' : ''), 'stroke-width': 1 + 5 * (e.weight / maxW) }, svg)
      node('title', {}, line).textContent = `${e.source} and ${e.target}: ${e.weight} hand-offs`
      line.onclick = () => openEdge(e.pair)
    }
    for (const d of g.nodes) {
      const p = pos.get(d.id)
      const grp = node('g', { class: 'node' + (d.id === focus ? ' on' : ''), transform: `translate(${p.x} ${p.y})` }, svg)
      grp.dataset.anchor = `view:${slug}/${d.id}`
      grp.dataset.anchorName = `the agent ${d.id}`
      grp.dataset.anchorText = `${d.id}, ${d.weight} hand-offs`
      node('circle', { r: 3 + 9 * Math.sqrt(d.weight / maxN) }, grp)
      if (d.weight / maxN > named || d.id === focus) node('text', { x: 12, y: 4, 'font-size': font }, grp).textContent = d.id
      grp.onclick = () => thimble.navigate(`view:${slug}/${d.id}`)
    }
  }

  async function openEdge(pair) {
    chosenPair = pair
    for (const e of svg.querySelectorAll('.edge')) e.classList.toggle('on', false)
    const res = await thimble.fetch({ op: 'edge', pair })
    const [a, b] = pair.split('|')
    side.replaceChildren(el('h2', null, `${a} and ${b}`), el('div', 'meta mono', `${res.total} hand-offs, newest first`))
    for (const hop of res.items) {
      const row = el('div', 'hop' + (hop.ref === targetRef ? ' target' : ''))
      row.dataset.anchor = hop.ref
      row.dataset.anchorName = `the hand-off of #${hop.pr} from ${hop.from} to ${hop.to}`
      row.dataset.anchorText = `${hop.from} → ${hop.to}, ${hop.action} #${hop.pr}, ${hop.time}`
      row.append(el('div', 'who', `${hop.from} → ${hop.to}`), el('div', 'where mono', `#${hop.pr} · ${hop.action} · ${hop.time.replace('T', ' ').slice(0, 16)}`))
      row.onclick = () => thimble.navigate(hop.ref)
      side.append(row)
    }
    const hit = side.querySelector('.hop.target')
    if (hit) hit.scrollIntoView({ block: 'center' })
    drawGraph()
  }

  thimble.onOpen(async (place) => {
    const t = (place && place.target) || {}
    focus = t.around || null
    targetRef = t.ref || null
    if (t.pair) return openEdge(t.pair)
    await drawGraph()
    // the side lists the heaviest link's records rather than waiting for a click, so there are records in view
    if (!chosenPair && heaviest) await openEdge(heaviest)
  })
</script>
</body>
</html>
