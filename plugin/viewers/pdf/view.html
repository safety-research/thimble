<!doctype html>
<html>
<head>
<style>
  :root {
    --ink: var(--text-primary, #23211d);
    --ink-2: var(--text-secondary, #5f5a52);
    --ink-3: var(--text-tertiary, #8b857b);
    --card: var(--surface-card, #ffffff);
    --line-2: var(--border-subtle, rgba(35, 33, 29, 0.12));
    --live: var(--accent, #5b5bd6);
    --sans: var(--font-body, ui-sans-serif, system-ui, sans-serif);
    --mono: var(--font-mono, ui-monospace, monospace);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 13px/1.55 var(--sans); color: var(--ink); display: grid; grid-template-columns: 220px 1fr; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  aside { border-right: 1px solid var(--line-2); overflow: auto; }
  aside .file { padding: 10px 12px 6px; font: 11.5px var(--mono); color: var(--ink-2); word-break: break-all; }
  /* the file menu is thimble's field (.field) and each page a row of its list (.list-row, the shown ones .active),
     which every view's page has */
  aside select { margin: 10px 12px 4px; max-width: calc(100% - 24px); }
  aside .list-row { margin: 0 4px; align-items: baseline; }
  .pg .n { font: 11px var(--mono); color: var(--ink-3); min-width: 3ch; text-align: right; }
  .pg .first { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { overflow: auto; padding: 16px 24px 48px; }
  .page { background: var(--card); border-radius: var(--radius-card, 8px); padding: 14px 18px; margin-bottom: 10px; max-width: 760px; border: 1px solid transparent; }
  .page.target { border-color: var(--live); }
  .page .head { font: 11px var(--mono); color: var(--ink-3); margin-bottom: 6px; }
  .page .text { white-space: pre-wrap; word-break: break-word; }
  .page .none { color: var(--ink-3); }
</style>
</head>
<body>
  <aside id="side"></aside>
  <main id="main"></main>
<script>
  // PDF: the pages of one PDF, each as the text it holds, the cited page (or run of pages) shown and selected. Each page
  // is a data-anchor of the form <path>#p<n>, the notation Claude Code's Read uses for PDF pages.
  let files = []
  let path = null
  let target = null
  const $ = (s) => document.querySelector(s)
  const el = (tag, cls, text) => {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }

  async function showPages(first, last) {
    const main = $('#main')
    main.replaceChildren()
    for (let n = first; n <= last; n++) {
      const pg = await thimble.fetch({ op: 'page', path, page: n })
      if (!pg) continue
      const box = el('section', 'page' + (target && n >= target.page && n <= (target.to || target.page) ? ' target' : ''))
      box.dataset.anchor = `${path}#p${n}`
      box.dataset.anchorName = `page ${n} of ${path}`
      box.append(el('div', 'head', `p. ${n} of ${pg.pages}`), pg.text ? el('div', 'text', pg.text) : el('div', 'none', 'no text layer'))
      main.append(box)
    }
    for (const row of document.querySelectorAll('.pg')) row.classList.toggle('active', Number(row.dataset.page) >= first && Number(row.dataset.page) <= last)
  }

  async function openFile(p, first, last) {
    path = p
    const info = await thimble.fetch({ op: 'pages', path })
    const side = $('#side')
    side.replaceChildren()
    if (files.length > 1) {
      const pick = el('select', 'field mono')
      for (const f of files) {
        const o = el('option', null, f.path)
        o.value = f.path
        o.selected = f.path === path
        pick.append(o)
      }
      pick.onchange = () => thimble.navigate(pick.value)
      side.append(pick)
    } else side.append(el('div', 'file', path))
    for (const p of info.pages || []) {
      const row = el('div', 'list-row pg')
      row.dataset.page = p.page
      row.dataset.anchor = `${path}#p${p.page}`
      row.dataset.anchorName = `page ${p.page} of ${path}`
      row.append(el('span', 'n', String(p.page)), el('span', 'first', p.first || ''))
      row.onclick = () => thimble.navigate(`${path}#p${p.page}`)
      side.append(row)
    }
    await showPages(first, Math.min(last, (info.pages || []).length || last))
  }

  thimble.onOpen(async (place) => {
    if (!files.length) files = await thimble.fetch({ op: 'files' })
    target = (place && place.target) || null
    const p = (target && target.path) || (place && place.path) || (files[0] && files[0].path)
    if (!p) return
    await openFile(p, (target && target.page) || 1, (target && (target.to || target.page)) || 1)
  })
</script>
</body>
</html>
