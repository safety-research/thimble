<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .list-row) and the theme's tokens come with the frame */
  html, body { margin: 0; height: 100%; }
  body { display: grid; grid-template-columns: 220px 1fr; }
  aside { overflow: auto; border-right: 1px solid var(--border-hairline); }
  aside .file { padding: 12px 12px 6px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-tertiary); word-break: break-all; }
  aside .field { display: block; box-sizing: border-box; width: calc(100% - 24px); margin: 6px 12px 0; }
  aside > .field:first-child { margin-top: 12px; }
  aside .cnt { padding: 10px 12px 4px; font-size: var(--text-xs); color: var(--text-tertiary); }
  aside .list-row { margin: 0 4px; align-items: baseline; }
  .pg .n { min-width: 3ch; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-tertiary); text-align: right; }
  .pg .first { overflow: hidden; font-size: var(--text-ui-sm); text-overflow: ellipsis; white-space: nowrap; }
  main { overflow: auto; padding: 4px 24px 48px; }
  .page { max-width: 760px; padding: 12px 12px 16px; border-bottom: 1px solid var(--border-hairline); }
  .page.active { background: var(--surface-selected); }
  .page .head { margin-bottom: 6px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-tertiary); }
  .page .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .none { color: var(--text-tertiary); }
  main > .none { padding: 16px 12px; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
  /* a second PDF beside the first, page by page */
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 16px; }
  .pair .page { max-width: none; min-width: 0; }
  .pair .who { position: sticky; top: 0; z-index: 1; padding: 10px 12px 6px; background: var(--surface-card); border-bottom: 1px solid var(--border-hairline); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <aside id="side"></aside>
  <main id="main"></main>
<script>
  // PDF: the pages of one PDF, each as the text it holds, every page in order with the cited page (or run of pages)
  // chosen and brought into view. Search narrows the pages, in this PDF and in the counts of the others, and another
  // PDF, such as another run's, can be read beside it page by page. Each page is a data-anchor of the form <path>#p<n>,
  // the notation Claude Code's Read uses for PDF pages.
  let files = [] // every PDF the view claims: {path, pages, error, hits?}
  let path = null
  let info = null // the open PDF's pages with their first lines, those holding the search
  let target = null
  let beside = null // the PDF read beside the open one
  let q = ''
  const texts = new Map() // path -> [text of page 1, ...]
  const $ = (s) => document.querySelector(s)
  const el = (tag, cls, text) => {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }
  const plural = (n, one, many) => `${n.toLocaleString('en-US')} ${n === 1 ? one : many}`
  // a PDF's name first, then its folder, so two files of one folder tell apart where a select cuts its text
  const named = (p) => { const name = p.split('/').pop(), folder = p.slice(0, -name.length - 1); return folder ? `${name} · ${folder}` : name }

  // every page's text of a PDF, a fetch at a time
  async function textsOf(p) {
    if (texts.has(p)) return texts.get(p)
    const out = []
    let from = 1
    while (from != null) {
      const got = await thimble.fetch({ op: 'texts', path: p, from })
      if (!got) break
      for (const [, t] of got.texts) out.push(t)
      from = got.next
    }
    texts.set(p, out)
    return out
  }
  const holds = (t) => !q || t.toLowerCase().includes(q.toLowerCase())
  // a page's text with the search's matches marked
  function textEl(t) {
    const box = el('div', 'text')
    if (!q) { box.textContent = t; return box }
    const low = t.toLowerCase(), needle = q.toLowerCase()
    let at = 0
    for (let i = low.indexOf(needle); i >= 0; i = low.indexOf(needle, at)) {
      box.append(t.slice(at, i), el('mark', null, t.slice(i, i + needle.length)))
      at = i + needle.length
    }
    box.append(t.slice(at))
    return box
  }
  function pageEl(p, n, total, t) {
    const box = el('section', 'page')
    box.dataset.anchor = `${p}#p${n}`
    box.dataset.anchorName = `page ${n} of ${p}`
    box.dataset.page = n
    const head = el('div', 'head', `p. ${n} of ${total}`)
    box.append(head, t == null ? el('div', 'none', 'no page') : t ? textEl(t) : el('div', 'none', 'no text layer'))
    return box
  }

  function drawSide() {
    const side = $('#side')
    const typing = document.activeElement && document.activeElement.type === 'search'
    side.replaceChildren()
    const readable = files.filter((f) => !f.error)
    if (files.length > 1) {
      const pick = el('select', 'field')
      pick.setAttribute('aria-label', 'PDF')
      for (const f of files) {
        const o = el('option', null, `${named(f.path)}${f.error ? ' · did not open' : q && f.hits != null ? ` · ${plural(f.hits, 'page', 'pages')}` : ''}`)
        o.value = f.path
        o.selected = f.path === path
        pick.append(o)
      }
      pick.title = path
      pick.onchange = () => thimble.navigate(pick.value)
      side.append(pick)
    } else side.append(el('div', 'file', path))
    if (readable.length > 1) {
      const other = el('select', 'field')
      other.setAttribute('aria-label', 'Beside')
      other.append(new Option('Beside: none', ''))
      for (const f of readable) if (f.path !== path) other.append(new Option(`Beside: ${named(f.path)}`, f.path, false, f.path === beside))
      other.title = beside || ''
      other.onchange = async () => { beside = other.value || null; await drawMain(); drawSide() }
      side.append(other)
    }
    const search = el('input', 'field')
    search.type = 'search'
    search.placeholder = 'Search pages'
    search.setAttribute('aria-label', 'Search pages')
    search.value = q
    search.oninput = () => { clearTimeout(drawSide.typing); drawSide.typing = setTimeout(() => setSearch(search.value), 200) }
    side.append(search)
    const total = info ? info.total : 0
    const cnt = el('div', 'cnt')
    const name = el('span', null, q ? `${(info.pages || []).length} of ${plural(total, 'page', 'pages')}` : plural(total, 'page', 'pages'))
    name.dataset.field = 'pages'
    cnt.append(name)
    side.append(cnt)
    for (const p of (info && info.pages) || []) {
      const row = el('div', 'list-row pg')
      row.dataset.page = p.page
      row.dataset.anchor = `${path}#p${p.page}`
      row.dataset.anchorName = `page ${p.page} of ${path}`
      row.append(el('span', 'n', String(p.page)), el('span', 'first', p.first || ''))
      row.title = p.first || ''
      row.onclick = () => thimble.navigate(`${path}#p${p.page}`)
      side.append(row)
    }
    if (typing) {
      search.focus()
      search.setSelectionRange(search.value.length, search.value.length)
    }
    mark()
  }

  // every page of the open PDF that holds the search, and beside it the same pages of the other PDF
  async function drawMain() {
    const main = $('#main')
    const mine = await textsOf(path)
    const theirs = beside ? await textsOf(beside) : null
    const out = []
    if (!mine.length && !theirs) out.push(el('div', 'none', 'No pages'))
    else if (!theirs) {
      mine.forEach((t, i) => { if (holds(t)) out.push(pageEl(path, i + 1, mine.length, t)) })
    } else {
      const pair = el('div', 'pair')
      pair.append(el('div', 'who', path), el('div', 'who', beside))
      pair.firstChild.title = path
      pair.children[1].title = beside
      for (let i = 0; i < Math.max(mine.length, theirs.length); i++) {
        if (!holds(mine[i] || '') && !holds(theirs[i] || '')) continue
        pair.append(i < mine.length ? pageEl(path, i + 1, mine.length, mine[i]) : el('div'),
          i < theirs.length ? pageEl(beside, i + 1, theirs.length, theirs[i]) : el('div'))
      }
      out.push(pair)
    }
    main.replaceChildren(...out)
    mark()
  }

  // the cited pages chosen, in the list and in the pages, and the first of them brought into view
  function mark(scroll) {
    const [a, b] = target && target.path === path ? [target.page || 1, target.to || target.page || 1] : [0, -1]
    for (const row of document.querySelectorAll('.pg')) row.classList.toggle('active', +row.dataset.page >= a && +row.dataset.page <= b)
    let first = null
    for (const box of document.querySelectorAll('#main .page')) {
      const on = box.dataset.anchor.startsWith(`${path}#p`) && +box.dataset.page >= a && +box.dataset.page <= b
      box.classList.toggle('active', on)
      if (on && !first) first = box
    }
    if (scroll) first ? first.scrollIntoView({ block: 'start' }) : ($('#main').scrollTop = 0)
  }

  async function setSearch(v) {
    q = v.trim()
    ;[files, info] = await Promise.all([thimble.fetch({ op: 'files', q }), thimble.fetch({ op: 'pages', path, q })])
    drawSide()
    await drawMain()
    mark(true)
  }

  async function openFile(p) {
    if (p !== path) {
      path = p
      if (beside === p) beside = null
      info = await thimble.fetch({ op: 'pages', path, q })
    }
    drawSide()
    await drawMain()
    mark(true)
  }

  thimble.onOpen(async (place) => {
    if (!files.length) files = await thimble.fetch({ op: 'files', q })
    target = (place && place.target) || null
    // with no place, the first PDF that opens
    const p = (target && target.path) || (place && place.path) || ((files.find((f) => !f.error) || files[0] || {}).path)
    if (!p) return
    if (target && target.path !== p) target = null
    await openFile(p)
  })
</script>
</body>
</html>
