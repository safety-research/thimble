<!doctype html>
<html>
<head>
<style>
  /* thimble's parts come with the frame: .btn, the search, Filter by, Rows and Color by, the time range, the lanes and
     their key, the divider, the side panel, the transcript, and the theme's tokens. This page lays them out: the top
     row, the sessions' lanes under the range, then the chosen session's transcript with what links it to the others */
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-card); overflow: hidden; }
  * { box-sizing: border-box; }
  #view { height: 100%; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 16px 10px; border-bottom: 1px solid var(--border-subtle); }
  #search { flex: 0 1 260px; min-width: 200px; }
  /* Color by takes the row's free width, and a row of its own where less than that is left, so the row never runs past the pane */
  #colour { min-width: min(100%, 280px); }
  /* the overview: the range and its axis over the lanes, the names in a column at the left. It never scrolls, down or
     sideways, though the divider sets it to: the lanes take the height it has, the divider's or about half the page */
  #overview { flex: none; min-height: 0; overflow: hidden !important; }
  .time { display: grid; grid-template-columns: var(--names) minmax(0, 1fr); padding: 10px 16px 0 8px; }
  #lanes { position: relative; padding: 0 16px 8px 8px; }
  #readout { align-self: center; padding-left: 8px; }
  /* the tint of the transcript's turns in view and the pointer's line end with the lanes, as they shrink too */
  .thimble-lanes-span, .thimble-lanes-cursor { max-height: 100%; }
  /* the session read: a tick on its parent's lane where it was started and one where its result came back */
  .ticks { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
  .ticks i { position: absolute; width: 2px; background: var(--text-primary); }
  /* the lanes past the room wait behind '… N more', a lane's height in the names' column */
  .more { display: block; height: 18px; margin: 0; padding: 0 0 0 8px; border: 0; background: none; color: var(--text-tertiary); font: 400 var(--text-ui-sm) / 18px var(--font-body); cursor: pointer; }
  .more:hover { color: var(--text-primary); }
  .more[hidden] { display: none; }
  /* the reading: what links the session to the others over its transcript, and a side panel at the right */
  #body { flex: 1; min-height: 0; }
  #main { display: flex; flex-direction: column; min-height: 0; }
  #rel { flex: none; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 8px 16px 6px 16px; color: var(--text-tertiary); font: 400 var(--text-ui-sm) / 1.5 var(--font-body); }
  #rel:empty { display: none; }
  #rel time { font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); font-variant-numeric: tabular-nums; }
  .go { margin: 0; padding: 0; border: 0; background: none; color: var(--text-primary); font: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  .go:hover { text-decoration-color: var(--text-primary); }
  #turns { flex: 1; min-height: 0; overflow: hidden auto; }
  .empty { padding: 28px 16px; color: var(--text-tertiary); }
  .side-acts { padding: 0 0 8px; }
</style>
</head>
<body>
<div id="view">
  <div class="top">
    <span id="search"></span>
    <span id="filter"></span>
    <span id="rows"></span>
    <span id="colour"></span>
  </div>
  <div id="overview">
    <div class="time">
      <div id="readout"></div><div id="range"></div>
      <div id="key"></div><div id="axis"></div>
    </div>
    <div id="lanes"></div>
  </div>
  <div id="body">
    <div id="main">
      <div id="rel"></div>
      <div id="turns"><div class="empty">Loading the sessions…</div></div>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const slug = (thimble.view && thimble.view.slug) || 'linked-sessions'
const hms = (t) => new Date(t * 1000).toISOString().slice(11, 19)
const runName = (id) => (/^r\d+$/.test(id) ? `Run ${id.slice(1)}` : id)
// the names' column, which the lanes and the range over them share
const NAMES = innerWidth < 640 ? 150 : 200
$('view').style.setProperty('--names', `${NAMES}px`)
const KIND = { prompt: 'Prompt', text: 'Text', result: 'Result', call: 'Tool call' }
const TOOLS = {
  Task: 'Starts a subagent, whose session sits under this one', Bash: 'Runs a shell command; its result gives the exit code',
  Read: 'Reads a file', Edit: 'Changes a file', Grep: 'Searches files; its result lists the files that match', WebSearch: 'Searches the web',
}
const OUTCOMES = {
  ok: 'The result came back with no error flag and no denial', error: 'The harness flagged the result as an error (is_error, or isError in r1)',
  denied: 'The result says permission to use the tool was denied',
}
const FILE_TYPES = {
  '.py': 'A Python file outside the tests', 'test .py': 'A Python file under tests/ or named test_*',
  'test .json': 'A JSON file under tests/, such as a fixture', '.md': 'A Markdown file', '.toml': 'A TOML file, such as pyproject.toml',
}

let data = null // the reader's overview: {runs, sessions, spawns, items, counts, fcounts, colours, groups}
let items = [] // the calls and messages the filters keep, in time order
let chosen = null // the lane read in the transcript: a session's id, or a group's key under another Rows choice
let drawn = '' // what the transcript last drew, so a redraw that changes nothing leaves it and its scroll alone
const S = {} // the sessions by id
const names = {} // each session's name, its agent numbered when its run has two
const kids = {} // the sessions each session started, in the order it started them
const spawnOf = {} // the Task call that started a session: {ref, session, child, time, duration}
const teams = {} // each run's team
const turnsOf = new Map() // a session's turns, or a selection's, as the reader sent them
const whole = new Map() // a call's whole input and what came back, once its turn opens
let loaded
const ready = new Promise((ok) => { loaded = ok })

// a session's lane: a lead under its run's name, a subagent under the session that started it
const laneName = (id) => (S[id] ? (S[id].parent ? names[id] : `${runName(S[id].run)} · ${names[id]}`) : id)
const runTitle = (id) => (teams[id] ? `${runName(id)} · ${teams[id]}` : runName(id))

// the search finds the words in the transcript, folded calls among them, and opens what holds them; the reader keeps only
// the turns that hold them, so the lanes show those alone
const search = thimble.search({ mount: '#search', in: '#turns', placeholder: 'Search the transcripts', onChange: () => load() })
// Color by, the one color: the speaker, the tool, the file type, the outcome or a label that is on
const colour = thimble.colorBy({
  mount: '#colour',
  // each field says what it is, and `meanings` what the values the transcripts' format fixes mean (reader.py's notes),
  // which the menu and a chip's hover give
  fields: [
    {
      name: 'speaker', title: 'Speaker', description: 'Who wrote the turn: the agent whose transcript holds it; for a prompt, the agent that started the session, or user for a lead',
      meanings: { lead: 'The session a run starts with, which starts the subagents', user: "The person who wrote a lead's prompt" },
    },
    { name: 'tool', title: 'Tool', description: 'The tool a call used, Agent read as Task', meanings: TOOLS },
    { name: 'file type', title: 'File type', description: "The extension of the call's first path, test files apart; none for a call with no file", meanings: FILE_TYPES },
    { name: 'outcome', title: 'Outcome', description: 'denied when the result says so, error when it is flagged, else ok', meanings: OUTCOMES },
  ],
  strip: '#turns',
  onChange: load,
})
// Filter by: which turns show, in the lanes and the transcript; the reader leaves out those of a value turned off
const filter = thimble.filterBy({
  mount: '#filter',
  fields: [
    { name: 'run', title: 'Run', description: "The run a session belongs to: a folder under runs/, its team named in the run's index", nameOf: runTitle },
    { name: 'agent', title: 'Agent', description: "The agent whose transcript holds the turn: lead, or a subagent's type" },
    {
      name: 'kind', title: 'Turn', description: 'What the turn is', values: ['prompt', 'text', 'call', 'result'], nameOf: (k) => KIND[k] || k,
      meanings: {
        prompt: "What the session was asked: the user's words for a lead, the Task call's prompt for a subagent", text: 'What the agent said along the way',
        call: 'A tool call and what came back', result: "The agent's last words, which go back to the session that started it",
      },
    },
    { name: 'tool', title: 'Tool', description: 'The tool a call used', meanings: TOOLS },
    { name: 'outcome', title: 'Outcome', description: 'denied when the result says so, error when it is flagged, else ok', meanings: OUTCOMES },
    { name: 'file type', title: 'File type', description: "The extension of the call's first path", meanings: FILE_TYPES },
  ],
  onChange: load,
})
// Rows: what the lanes are; by session they are each run's tree, a lead with the subagents it started under it
const rows = thimble.rows({
  mount: '#rows',
  fields: [
    {
      name: 'session', title: 'Session', description: 'A lane per session, each subagent under the session that started it',
      nameOf: laneName, parentOf: (id) => (S[id] ? S[id].parent : null),
    },
    { name: 'agent', title: 'Agent', description: "A lane per agent: lead, or a subagent's type, across the runs" },
    { name: 'run', title: 'Run', description: 'A lane per run', nameOf: runTitle },
    { name: 'tool', title: 'Tool', description: 'A lane per tool, the messages under no tool' },
  ],
  onChange: () => { chosen = null; load() },
})
// the one control for time: every turn over the whole span in the Color by colors, a break where the runs lie hours
// apart, and a viewfinder over the part the lanes and the transcript show
const range = thimble.timeRange({ mount: '#range', readout: '#readout', gap: 1200, onChange: draw })
// with a label chosen, a turn's value is the reader's, since the page holds a label's marks only for what it shows
const valueOf = (it) => (colour.label ? (data && data.colours[it.ref]) ?? null : colour.valueOf(it))
const laneColour = { keeps: () => true, valueOf, colourOf: (v) => colour.colourOf(v) }
const bySession = () => rows.field === 'session'
// the lanes: each turn a mark as wide as its call took (a Task call as long as its subagent ran), a failed call
// underlined in the problem red; the transcript's turns in view tinted across them; the groups of Rows in the room the
// overview has
const failed = (it) => it.kind === 'call' && it.outcome !== 'ok'
const lanes = thimble.lanes({
  mount: '#lanes', keyMount: '#key', range, colour: laneColour, names: NAMES,
  groups: (its) => fitted(rows.groups(its)),
  time: (it) => it.time,
  end: (it) => it.time + (it.duration || 0),
  follow: '#turns',
  problem: failed, words: { problem: 'failed' },
  anchor: (lane) => (bySession() && S[lane.key] ? `view:${slug}/${lane.key}` : null),
  onPick: (lane) => read(String(lane.key)),
  onMark: (it) => goTo(it.ref),
  tip: (it) => `${it.tool || KIND[it.kind]}${failed(it) ? ` · ${it.outcome}` : ''}  ${it.input ?? it.text}`,
})
// the transcript: a card per turn as the File browser draws it, a tool call folded to its line; a Task call opened
// shows the subagent's transcript beside it in the side panel
const tr = thimble.transcript({ mount: '#turns', colour, onOpen: (turn) => opened(turn) })
const side = thimble.side({ mount: '#body', width: 0.42, key: 'subagent' })
let sideTr = null

async function load() {
  let got
  try {
    got = await thimble.fetch({ op: 'overview', colour: colour.query(), filter: filter.query(), rows: rows.query(), search: search.text.trim() }, { key: 'overview' })
  } catch (e) {
    if (e.name === 'AbortError') return
    throw e
  }
  data = got
  colour.counts(data.counts)
  filter.counts(data.fcounts)
  sessions()
  // under a label, a turn's lane is the reader's value of it (`group`); under a field, the page reads the field
  items = data.items
  if (rows.label) for (const it of items) it.group = data.groups[it.ref] ?? null
  for (const it of items) filter.keeps(it) // the values of each field, for Filter by's menu
  range.data({ times: items.map((it) => it.time), values: items.map(valueOf) })
  draw()
  loaded()
}

// each session's name, its agent numbered when its run has two; the sessions each started, and the call that did
function sessions() {
  const seen = {}
  for (const r of data.runs) teams[r.id] = r.team
  for (const k of Object.keys(kids)) delete kids[k]
  for (const k of Object.keys(spawnOf)) delete spawnOf[k]
  for (const s of data.sessions) {
    S[s.id] = s
    seen[s.run + s.agent] = (seen[s.run + s.agent] || 0) + 1
    names[s.id] = seen[s.run + s.agent] > 1 ? `${s.agent} ${seen[s.run + s.agent]}` : s.agent
  }
  for (const sp of data.spawns) {
    spawnOf[sp.child] = sp
    ;(kids[sp.session] ||= []).push(sp.child)
  }
  for (const s of data.sessions) if (s.parent && !spawnOf[s.id] && S[s.parent]) (kids[s.parent] ||= []).push(s.id)
}

function draw() {
  if (!data) return
  const scale = range.scale($('axis').clientWidth)
  thimble.timeAxis('#axis', scale)
  fit.room = roomFor()
  lanes.draw(items.filter((it) => range.has(it.time)))
  // the lane read stays chosen while it has a turn in the range, though a folded lane may hold it; else the first
  const ls = lanes.lanes.filter((l) => !l.heading)
  if (bySession() ? !items.some((it) => it.session === chosen && range.has(it.time)) : !ls.some((l) => String(l.key) === chosen)) chosen = ls.length ? String(ls[0].key) : null
  // the run of the session read open, where it folded by itself
  if (bySession() && fit.auto.has(runOf(chosen))) lanes.draw()
  lanes.choose(chosen)
  ticks()
  return transcript()
}

// ------------------------------------------------------------------------------------------------ the lanes' room

// The overview never scrolls: its lanes take the height it has, the divider's or about half the page. Where they do not
// fit, a run's lead folds the lanes under it into its own by itself, the largest run first, as the terminal's lanes do,
// and the run of the session read last, so its lane shows where it can; a run that fits again opens, the smallest
// first. The analyst's ▸ ▾ come first, and a run they open is not folded again. The lanes past the room then wait
// behind '… N more'. The page lays this out itself until thimble's lanes fit their box on their own.
const LANE = 18 // px, a lane's height (thimble's .thimble-lane)
const fit = {
  room: Infinity, // the lanes the overview has room for
  first: 0, // the first lane shown, which '… N more' moves on
  fits: 0, // the lanes shown
  keys: [], // the lanes there are, the runs folded, by key
  auto: new Set(), // the runs folded by themselves in the last layout
  hand: new Set(), // the runs the analyst folded, which thimble keeps and the lanes fold
  open: new Set(), // the runs the analyst opened, never folded by themselves again
}
const more = document.createElement('button')
more.className = 'more'
more.type = 'button'
more.hidden = true
$('lanes').append(more)

// the lanes in fit.room rows: the groups of Rows with the runs folded that need to be, from fit.first on; in each lane
// the longest turns drawn first, so that a Task call's mark, as long as its subagent ran, never hides a turn's under it
function fitted(nodes) {
  const tops = nodes.filter((n) => n.depth === 0 && n.children)
  const under = new Map()
  for (const t of tops) {
    const i = nodes.indexOf(t)
    let k = i + 1
    while (k < nodes.length && nodes[k].depth > 0) k++
    under.set(t, nodes.slice(i + 1, k))
  }
  const shut = new Set(tops.filter((t) => fit.hand.has(String(t.key))))
  const need = () => nodes.length - [...shut].reduce((n, t) => n + under.get(t).length, 0)
  fit.auto = new Set()
  const mine = (t) => (String(t.key) === runOf(chosen) ? 1 : 0)
  for (const t of [...tops].sort((a, b) => mine(a) - mine(b) || under.get(b).length - under.get(a).length)) {
    if (need() <= fit.room) break
    if (shut.has(t) || fit.open.has(String(t.key))) continue
    shut.add(t)
    fit.auto.add(String(t.key))
  }
  for (const t of tops.filter((x) => fit.auto.has(String(x.key))).sort((a, b) => under.get(a).length - under.get(b).length)) {
    if (need() + under.get(t).length > fit.room) continue
    shut.delete(t)
    fit.auto.delete(String(t.key))
  }
  const out = []
  let top = null
  for (const n of nodes) {
    if (n.depth === 0) top = n
    else if (shut.has(top)) continue
    const its = shut.has(n) ? [...n.items, ...under.get(n).flatMap((x) => x.items)] : [...n.items]
    out.push({ ...n, items: its.sort((a, b) => (b.duration || 0) - (a.duration || 0)) })
  }
  fit.keys = out.map((n) => String(n.key))
  fit.fits = out.length <= fit.room ? out.length : Math.max(1, fit.room - 1)
  if (fit.first >= out.length || out.length <= fit.room) fit.first = 0
  const left = out.length - fit.first - fit.fits
  more.hidden = fit.fits >= out.length
  more.textContent = left > 0 ? `… ${left} more` : '… back to the first'
  return out.slice(fit.first, fit.first + fit.fits)
}
// the lead a session's run starts with, whose lane holds the run's lanes when it folds
const runOf = (id) => {
  while (id && S[id] && S[id].parent && S[S[id].parent]) id = S[id].parent
  return id
}
more.addEventListener('click', () => {
  fit.first = fit.first + fit.fits < fit.keys.length ? fit.first + fit.fits : 0
  lanes.draw()
})

// the lanes there is room for: the overview's height, less the range's and the lanes' padding, in lanes
function roomFor() {
  const box = $('overview')
  const h = box.style.height ? box.clientHeight : $('view').clientHeight * 0.48
  const top = $('lanes').getBoundingClientRect().top - box.getBoundingClientRect().top
  return Math.max(1, Math.floor((h - top - 8) / LANE))
}
function refit() {
  const room = roomFor()
  if (room === fit.room) return
  fit.room = room
  lanes.draw()
}
addEventListener('resize', refit)
new ResizeObserver(refit).observe(document.querySelector('.time'))
// the bar under the overview: a drag gives the lanes another height, which they fit
thimble.divider({ top: '#overview', onChange: refit })

// a run that folded by itself opens by hand; the analyst's own ▸ ▾ are the lanes', which this hears so the layout
// counts them
$('lanes').addEventListener('click', (e) => {
  const b = e.target.closest('[data-fold]')
  if (!b) return
  const k = b.dataset.fold
  if (fit.auto.has(k)) {
    e.stopPropagation()
    fit.open.add(k)
    lanes.draw()
  } else if (b.getAttribute('aria-expanded') === 'false') {
    fit.hand.delete(k)
    fit.open.add(k)
  } else {
    fit.hand.add(k)
    fit.open.delete(k)
  }
}, true)

// once the lanes draw: a run folded by itself shows ▸ as one folded by hand does, the runs folded by hand are read
// from what the lanes drew, and the session read gets its ticks
function painted() {
  const hand = new Set(fit.hand)
  for (const b of $('lanes').querySelectorAll('[data-fold]')) {
    const k = b.dataset.fold
    if (fit.auto.has(k)) {
      b.textContent = '▸'
      b.setAttribute('aria-expanded', 'false')
      b.setAttribute('aria-label', `Show the lanes under ${b.parentElement.title}`)
    } else if (b.getAttribute('aria-expanded') === 'false') hand.add(k)
    else hand.delete(k)
  }
  ticks()
  if ([...hand].sort().join(' ') === [...fit.hand].sort().join(' ')) return
  fit.hand = hand
  lanes.draw()
}
new MutationObserver(painted).observe($('lanes').querySelector('.thimble-lanes-body'), { childList: true })

// where the session read was started and where its result came back, a tick at each on its parent's lane, or on the lane
// a folded run holds it in; the tree's guides show which session started which
function ticks() {
  const box = $('lanes')
  let el = box.querySelector('.ticks')
  if (!el) {
    el = document.createElement('div')
    el.className = 'ticks'
    el.setAttribute('aria-hidden', 'true')
    box.append(el)
  }
  const body = box.querySelector('.thimble-lanes-body')
  const sp = bySession() && spawnOf[chosen]
  const sc = lanes.scale
  const at = {}
  for (const l of body.querySelectorAll('.thimble-lane')) at[l.dataset.key] = l
  let up = sp && sc ? sp.session : null
  while (up && !at[up]) up = S[up] ? S[up].parent : null
  const lane = up && at[up]
  const out = []
  if (lane)
    for (const t of [sp.time, sp.time + sp.duration])
      if (t >= sc.from && t <= sc.to) out.push(`<i style="left:${body.offsetLeft + NAMES + Math.round(sc.x(t)) - 1}px;top:${body.offsetTop + lane.offsetTop}px;height:${lane.offsetHeight}px"></i>`)
  el.innerHTML = out.join('')
}

// ------------------------------------------------------------------------------------------------ the transcript

// a turn as the transcript draws it: a call is a tool turn, folded to its tool and its input's line, a Task call naming
// the subagent it started; the rest keep the reader's fields, which Color by reads
function turnOf(it) {
  const call = it.kind === 'call'
  const w = whole.get(it.ref)
  return {
    ...it, t: it.time, time: null, kind: call ? 'tool' : it.kind === 'prompt' ? 'prompt' : 'text',
    input: call ? inputOf(it, w) : undefined, output: w ? w.output : undefined,
    error: failed(it) && it.outcome, sessionName: S[it.session] ? `${names[it.session]} · ${runTitle(S[it.session].run)}` : it.session,
  }
}
const inputOf = (it, w) => (it.child && S[it.child] ? `→ ${names[it.child]}\n` : '') + (w ? w.input : it.input)

// a session's turns, or a selection's, fetched once
async function fetchTurns(key, query) {
  if (!turnsOf.has(key)) turnsOf.set(key, (await thimble.fetch({ op: 'turns', ...query })).turns)
  return turnsOf.get(key)
}

// the chosen lane's turns in the range that the filters keep: a session's transcript, else the turns of the lane's
// group across the sessions, each session's start marked; the header names what it shows and how many
async function transcript() {
  const session = bySession() && S[chosen]
  const lane = session ? null : lanes.lanes.find((l) => String(l.key) === chosen)
  rel()
  if (!session && !lane) {
    drawn = ''
    tr.draw([], { title: 'No session', empty: 'No turn holds the search or passes the filters' })
    return
  }
  const keep = new Set((session ? items.filter((it) => it.session === chosen && range.has(it.time)) : lane.items).map((it) => it.ref))
  const key = session ? `s:${chosen}` : `r:${[...keep].sort().join(' ')}`
  const title = session ? `${names[chosen]} · ${runTitle(session.run)}` : `${rows.by ? rows.by.title : 'All'}: ${lane.name}`
  if (!turnsOf.has(key)) tr.draw([], { title, sub: 'loading…', empty: 'Loading the transcript…' })
  const all = await fetchTurns(key, session ? { session: chosen } : { refs: [...keep] })
  if (String(lanes.chosen) !== chosen) return // another lane was chosen while these came
  const turns = all.filter((t) => keep.has(t.ref)).map(turnOf)
  const total = session ? all.length : turns.length
  const sub = [
    turns.length < total ? `of ${total}` : '',
    session ? `${hms(session.start)} – ${hms(session.end)}` : `${new Set(turns.map((t) => t.session)).size} sessions`,
  ].filter(Boolean).join(' · ')
  const sig = JSON.stringify([key, turns.map((t) => t.ref), colour.query()])
  if (sig === drawn) return
  drawn = sig
  tr.draw(turns, { title, sub, empty: range.full ? 'No turn holds the search or passes the filters' : 'No turn in this time range' })
}

// what links the session read to the others: the session that started it and when, when its result came back, and
// the subagents it started; each a link that reads that session, at the call where it happened
function rel() {
  const s = bySession() && S[chosen]
  if (!s) return ($('rel').innerHTML = '')
  const out = []
  const sp = spawnOf[s.id]
  if (sp && S[sp.session]) {
    out.push(`<span class="fact">Started by <button class="go" data-call="${esc(sp.ref)}">${esc(names[sp.session])}</button> at <time>${hms(sp.time)}</time></span>`)
    out.push(`<span class="fact">Result back to ${esc(names[sp.session])} at <button class="go" data-call="${esc(sp.ref)}"><time>${hms(sp.time + sp.duration)}</time></button></span>`)
  } else if (s.parent && S[s.parent]) {
    out.push(`<span class="fact">Under <button class="go" data-read="${esc(s.parent)}">${esc(names[s.parent])}</button></span>`)
  } else {
    out.push(`<span class="fact">Lead of ${esc(runTitle(s.run))}</span>`)
  }
  const ks = kids[s.id] || []
  if (ks.length) out.push(`<span class="fact">Subagents ${ks.map((k) => `<button class="go" data-read="${esc(k)}">${esc(names[k])}</button>${spawnOf[k] ? ` <time>${hms(spawnOf[k].time)}</time>` : ''}`).join(', ')}</span>`)
  $('rel').innerHTML = out.join('')
}

// a turn opened: a call's whole input and what came back, fetched once; a Task call's subagent beside it
async function opened(turn) {
  if (turn.kind === 'tool' && !whole.has(turn.ref)) {
    whole.set(turn.ref, await thimble.fetch({ op: 'record', ref: turn.ref }))
    const w = whole.get(turn.ref)
    for (const t of [tr, sideTr]) if (t) t.set(turn.ref, { input: inputOf(turn, w), output: w.output })
  }
  if (turn.child && S[turn.child] && turn.child !== chosen) beside(turn.child)
}

// a subagent's transcript in the side panel, beside its parent's: its turns that the filters keep, and a link that
// reads it in the center
async function beside(id) {
  const s = S[id]
  const keep = new Set(items.filter((it) => it.session === id).map((it) => it.ref))
  const all = await fetchTurns(`s:${id}`, { session: id })
  const turns = all.filter((t) => keep.has(t.ref)).map(turnOf)
  side.open({
    title: `${names[id]} · started by ${names[s.parent] || 'its parent'}`,
    sub: `${turns.length} of ${all.length} turns · ${hms(s.start)} – ${hms(s.end)}`,
    ref: `view:${slug}/${id}`,
    render: (body) => {
      body.innerHTML = `<div class="side-acts"><button class="btn btn-secondary btn-sm" data-read="${esc(id)}">Read ${esc(names[id])} here</button></div><div class="side-turns"></div>`
      sideTr = thimble.transcript({ mount: body.querySelector('.side-turns'), colour, onOpen: (turn) => opened(turn) })
      sideTr.draw(turns, { empty: 'No turn passes the filters' })
    },
  })
}

// ------------------------------------------------------------------------------------------------ moving around

// read a lane: its turns in the transcript, from the top
async function read(key) {
  if (chosen === key) return
  chosen = key
  // a session in a run that folded by itself: the lanes laid out again, that run open; a lane behind '… N more' shown
  if (bySession() && fit.auto.has(runOf(key))) lanes.draw()
  const at = fit.keys.indexOf(key)
  if (at >= 0 && (at < fit.first || at >= fit.first + fit.fits)) {
    fit.first = at - (at % fit.fits)
    lanes.draw()
  }
  lanes.choose(key)
  ticks()
  await transcript()
  $('turns').scrollTop = 0
}

// a turn to show, from a lane's mark, a link or a citation: its session read, the turn opened and in the middle
async function goTo(ref) {
  let it = items.find((x) => x.ref === ref)
  if (!it && (search.text || filter.query())) {
    // a turn the search or Filter by hides: both put back, so it shows
    search.set('')
    if (filter.query()) filter.choose(null)
    await load()
    it = items.find((x) => x.ref === ref)
  }
  if (!it) return
  if (!range.has(it.time)) {
    range.set(null)
    await draw()
  }
  if (bySession()) await read(it.session)
  else {
    const lane = lanes.lanes.find((l) => l.items.includes(it))
    if (lane) await read(String(lane.key))
  }
  tr.reveal(ref)
}

document.addEventListener('click', (e) => {
  const call = e.target.closest('[data-call]'), go = e.target.closest('[data-read]')
  if (call) goTo(call.dataset.call)
  else if (go) {
    if (!bySession()) rows.choose('session')
    read(go.dataset.read)
  }
})
// a place thimble opens: a cited call or message in its session's transcript, a session read, a run filtered to, and a
// transcript or a run's index the analyst opened the view on as that session or that run
thimble.onOpen(async (place) => {
  await ready
  const t = place.target || {}, path = place.picked ? place.path || '' : ''
  const file = data.sessions.find((s) => s.path === path)
  const run = t.run || (/sessions-index\.json$/.test(path) ? path.split('/').slice(-2)[0] : null)
  if (t.call || t.message) return goTo(t.call || t.message)
  if (run) {
    // Filter by Run with only this run on, its lead read
    filter.choose('run')
    for (const r of data.runs) if ((r.id === run) !== filter.isOn(r.id)) filter.toggle(r.id)
    await load()
    const lead = data.sessions.find((s) => s.run === run && !s.parent)
    if (lead) await read(lead.id)
    return
  }
  if (t.session || file) {
    if (!bySession()) rows.choose('session')
    await read(t.session || file.id)
  }
})
// the label filter changes which records the reader keeps, and a label's values arrive while it runs
let later = null, labelFilter = null
const soon = () => { clearTimeout(later); later = setTimeout(load, 300) }
thimble.onLabels((state) => {
  const now = JSON.stringify(state.filter || null)
  if (labelFilter != null && now !== labelFilter) soon()
  labelFilter = now
})
thimble.onMarks(() => { if (colour.label || filter.label || rows.label) soon() })
load()
</script>
