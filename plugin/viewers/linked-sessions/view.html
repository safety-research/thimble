<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .btn), its Color by control, its time range selector and the theme's tokens come with the
     frame; this page lays out the top row, the sessions' lanes under the range and the list of messages and calls */
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-card); overflow: hidden; }
  * { box-sizing: border-box; }
  #view { --names: 204px; --indent: 318px; height: 100%; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; border-bottom: 1px solid var(--border-subtle); }
  #q { flex: 0 1 220px; min-width: 120px; }
  #scope { flex: 0 1 190px; min-width: 110px; }
  /* the names of the sessions in a column at the left and the time across the rest; the range and the lanes keep the
     same scrollbar gutter, so the lanes stand under the range and its axis */
  .time, .lane { display: grid; grid-template-columns: var(--names) minmax(0, 1fr); }
  .time, #lanes { padding: 0 16px 0 8px; scrollbar-gutter: stable; }
  .time { flex: none; padding-top: 10px; overflow: hidden; }
  #readout { align-self: center; padding-left: 8px; }
  .key { display: flex; align-items: center; gap: 12px; padding-left: 8px; color: var(--text-tertiary); font: 400 var(--text-xs) / 1 var(--font-body); }
  .key i { display: inline-block; width: 12px; margin-right: 5px; vertical-align: middle; }
  .key .k-span { height: 10px; background: rgba(var(--ink-rgb), 0.07); }
  .key .k-err { height: 2px; background: var(--status-negative); }
  #lanes { flex: 0 1 auto; max-height: 40%; overflow-y: auto; padding-bottom: 8px; border-bottom: 1px solid var(--border-subtle); }
  .run + .run { border-top: 1px solid var(--border-hairline); }
  .nm { padding: 0 10px 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); font: 400 var(--text-ui-sm) / 18px var(--font-body); cursor: pointer; }
  .nm.head { color: var(--text-secondary); font-weight: 500; line-height: 26px; }
  .nm:hover { text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  .lane svg { display: block; }
  .span { fill: rgba(var(--ink-rgb), 0.07); }
  .tick { fill: var(--viz-ink-3); cursor: pointer; }
  .err { fill: var(--status-negative); }
  .sep { stroke: var(--border-hairline); }
  /* the list: one row per message or call, its details opened in place under its line */
  #list { flex: 1; min-height: 0; overflow: auto; padding-bottom: 12px; }
  .row { padding: 3px 16px; border-bottom: 1px solid var(--border-hairline); cursor: pointer; }
  .row:hover { background: rgba(var(--ink-rgb), 0.03); }
  .line { display: grid; grid-template-columns: 62px 150px 76px minmax(0, 1fr) auto; gap: 0 10px; align-items: baseline; }
  .row time, .row .end { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .who, .row .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 var(--text-ui-sm) / 1.5 var(--font-body); }
  .row .who { color: var(--text-secondary); }
  .row .what { color: var(--text-tertiary); }
  .row .text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); font: 400 var(--text-sm) / 1.5 var(--font-body); }
  .row.call .text { font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); }
  .row .bad { margin-right: 8px; color: var(--status-negative); }
  .thimble-details { padding: 4px 0 8px var(--indent); cursor: auto; }
  .thimble-details pre { max-height: 240px; margin: 0 0 6px; padding: 6px 8px; overflow: auto; border-radius: var(--radius-ui); background: var(--bg-sub); color: var(--text-primary); font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .thimble-details .full { margin-bottom: 6px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-primary); font: 400 var(--text-sm) / 1.5 var(--font-body); }
  .acts { display: flex; align-items: center; gap: 8px; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .empty { padding: 28px 16px; color: var(--text-tertiary); }
  @media (max-width: 720px) { #view { --names: 140px; --indent: 0px; } .line { grid-template-columns: 62px 110px 64px minmax(0, 1fr) auto; } }
</style>
</head>
<body>
<div id="view">
  <div class="top">
    <input class="field" id="q" type="search" placeholder="Search messages and calls" aria-label="Search">
    <select class="field" id="scope" aria-label="Runs and sessions"><option value="">All runs</option></select>
    <span id="colour"></span>
  </div>
  <div class="time">
    <div id="readout"></div><div id="range"></div>
    <div class="key"><span><i class="k-span"></i>running</span><span><i class="k-err"></i>failed</span></div><div id="axis"></div>
  </div>
  <div id="lanes"></div>
  <div id="list"></div>
</div>
<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const slug = (thimble.view && thimble.view.slug) || 'linked-sessions'
const LANE = 18
const KIND = { prompt: 'Prompt', text: 'Text', result: 'Result' }
const hms = (t) => new Date(t * 1000).toISOString().slice(11, 19)
const secs = (d) => `${d < 10 ? d.toFixed(1) : Math.round(d)} s`
const runName = (id) => (/^r\d+$/.test(id) ? `Run ${id.slice(1)}` : id)
let data = null, items = [], open = null, several = false, menuHtml = ''
const S = {}, names = {}, full = new Map() // the sessions by id, their names, and each opened row's record in full
let loaded
const ready = new Promise((ok) => { loaded = ok })

// the one Color by control: Off, the view's own fields and every label in one menu, the values as chips in this row,
// a bar on each row's left edge, the list's two tracks, and Reset at the row's end
const colour = thimble.colorBy({
  mount: '#colour',
  fields: [{ name: 'speaker', title: 'Speaker' }, { name: 'tool', title: 'Tool' }, { name: 'file type', title: 'File type' }],
  chips: 'filter',
  strip: '#list',
  onChange: load,
})
// the one control for time: every message and call over the whole span in the Color by colors, a break where the runs
// lie hours apart, and a viewfinder over the part the lanes and the list show
const range = thimble.timeRange({ mount: '#range', readout: '#readout', gap: 1200, onChange: draw })
// what Reset puts back of this page's own state: the row opened in place (the kit puts back the search and the menu)
const reset = thimble.onReset({ changed: () => open != null, reset: () => { open = null; load() } })

async function load() {
  try {
    data = await thimble.fetch({ op: 'overview', colour: colour.query(), scope: $('scope').value, search: $('q').value.trim() }, { key: 'overview' })
  } catch (e) {
    if (e.name === 'AbortError') return
    throw e
  }
  colour.counts(data.counts)
  menu()
  items = [...data.calls, ...data.messages].sort((a, b) => a.time - b.time)
  range.data({ times: items.map((i) => i.time), values: items.map((i) => colour.valueOf(i)) })
  draw()
  reset.check() // the menu or the search may have changed without a click, as when thimble opens a place
  loaded()
}

// each session's name, its agent numbered when its run has two; the menu lists every run with its sessions as a tree
function menu() {
  const seen = {}
  for (const s of data.sessions) {
    S[s.id] = s
    seen[s.run + s.agent] = (seen[s.run + s.agent] || 0) + 1
    names[s.id] = seen[s.run + s.agent] > 1 ? `${s.agent} ${seen[s.run + s.agent]}` : s.agent
  }
  const opts = ['<option value="">All runs</option>']
  for (const r of data.runs) {
    opts.push(`<option value="r:${esc(r.id)}">${esc(runName(r.id))} · ${esc(r.team)}</option>`)
    for (const s of data.sessions) if (s.run === r.id) opts.push(`<option value="s:${esc(s.id)}">${'\u2003'.repeat(s.depth + 1)}${esc(names[s.id])}</option>`)
  }
  const el = $('scope'), was = el.value
  if (opts.join('') === menuHtml) return
  el.innerHTML = menuHtml = opts.join('')
  el.value = was
  if (el.selectedIndex < 0) { el.value = ''; soon() } // a session the label filter no longer keeps
}

function draw() {
  if (!data) return
  const scale = range.scale($('axis').clientWidth)
  thimble.timeAxis('#axis', scale)
  lanes(scale)
  list()
}

// a lane per session in scope under its run's name, each subagent under the session that spawned it: the time it ran
// as a gray band, and each message and call a mark in its Color by color, as wide as the call took, a failed call
// underlined in red. A run's name and a session's lane are the view's units, which a label marks where it marks
// one of their records
function lanes(scale) {
  const scope = new Set(data.scope), by = {}, runs = {}
  for (const it of items) (by[it.session] ||= []).push(it)
  for (const s of data.sessions) if (scope.has(s.id)) (runs[s.run] ||= []).push(lane(s, by[s.id] || [], scale))
  $('lanes').innerHTML = data.runs.filter((r) => runs[r.id]).map((r) => `<div class="run"><div class="nm head" data-scope="r:${esc(r.id)}" data-anchor="view:${slug}/${esc(r.id)}">${esc(runName(r.id))} · ${esc(r.team)}</div>${runs[r.id].join('')}</div>`).join('')
}
function lane(s, calls, scale) {
  const a = Math.max(0, scale.x(s.start)), b = Math.min(scale.width, scale.x(s.end))
  let svg = b > a ? `<rect class="span" x="${a}" y="4" width="${b - a}" height="${LANE - 8}"/>` : ''
  for (const it of calls) {
    const end = it.time + (it.duration || 0)
    if (end < range.from || it.time > range.to) continue
    const x = scale.x(it.time), w = Math.max(2, scale.x(end) - x), c = colour.colourOf(colour.valueOf(it))
    svg += `<rect class="tick" data-ref="${esc(it.ref)}" x="${x}" y="3" width="${w}" height="${LANE - 6}"${c ? ` style="fill:${c}"` : ''}><title>${hms(it.time)} ${esc(it.tool || KIND[it.kind])} ${esc(it.input ?? it.text)}</title></rect>`
    if (it.outcome && it.outcome !== 'ok') svg += `<rect class="err" x="${x}" y="${LANE - 2}" width="${Math.max(4, w)}" height="2"/>`
  }
  return `<div class="lane" data-anchor="view:${slug}/${esc(s.id)}"><div class="nm" style="padding-left:${8 + s.depth * 12}px" data-scope="s:${esc(s.id)}">${esc(names[s.id])}</div><svg width="${scale.width}" height="${LANE}">${svg}</svg></div>`
}

// the messages and calls in the range, in time order: each row its time, its session, its tool or kind and its first
// line, a call that failed saying so in red
function list() {
  const shown = items.filter((i) => range.has(i.time))
  several = new Set(data.scope.map((id) => S[id].run)).size > 1
  $('list').innerHTML = shown.length ? shown.map(row).join('') : '<div class="empty">No message or call</div>'
}
function row(it) {
  const s = S[it.session], who = several ? `${s.run} · ${names[s.id]}` : names[s.id]
  const bad = it.outcome && it.outcome !== 'ok' ? `<span class="bad">${esc(it.outcome)}</span>` : ''
  return `<div class="row ${it.tool ? 'call' : 'msg'}" data-anchor="${esc(it.ref)}"${colour.attr(it)}><div class="line"><time>${hms(it.time)}</time><span class="who">${esc(who)}</span><span class="what">${esc(it.tool || KIND[it.kind])}</span><span class="text">${esc(it.input ?? it.text)}</span><span class="end">${bad}${it.tool ? secs(it.duration) : ''}</span></div>${it.ref === open ? details(it) : ''}</div>`
}
// a row opened in place: a call's whole input and what came back, or a message's whole text, and the file it is in
function details(it) {
  const f = full.get(it.ref) || {}
  const out = f.new != null ? `${f.old ? `− ${f.old}\n` : ''}+ ${f.new}` : f.output || f.result
  const body = it.tool ? `<pre>${esc(f.input)}</pre>${out ? `<pre>${esc(out)}</pre>` : ''}` : `<div class="full">${esc(f.text)}</div>`
  return `<div class="thimble-details">${body}<div class="acts">${f.exit != null ? `<span>exit ${f.exit}</span>` : ''}${f.child ? `<button class="btn btn-secondary btn-sm" data-scope="s:${esc(f.child)}">Show ${esc(names[f.child] || 'subagent')}</button>` : ''}<button class="btn btn-ghost btn-sm" data-file="${esc(it.ref)}">Open in file</button></div></div>`
}

const rowOf = (ref) => $('list').querySelector(`.row[data-anchor="${CSS.escape(ref)}"]`)
async function fetchFull(ref) {
  if (!full.has(ref)) full.set(ref, await thimble.fetch({ op: 'record', ref }))
}
// a message or call to show, from a lane's mark or a citation: opened in place and scrolled to
async function reveal(ref) {
  if (!items.some((i) => i.ref === ref)) {
    $('scope').value = ''
    $('q').value = ''
    await load()
  }
  const it = items.find((i) => i.ref === ref)
  if (!it) return
  open = ref
  await fetchFull(ref)
  if (!range.has(it.time)) range.set(null)
  list()
  rowOf(ref)?.scrollIntoView({ block: 'center' })
}

let typing = null
$('q').addEventListener('input', () => { clearTimeout(typing); typing = setTimeout(load, 250) })
$('scope').addEventListener('change', load)
// a session's or a run's name narrows the view to it through the menu in the top row; a lane's mark opens its row
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-scope]'), file = e.target.closest('[data-file]'), mark = e.target.closest('[data-ref]')
  if (go) { $('scope').value = go.dataset.scope; load() }
  else if (file) thimble.navigate(file.dataset.file, { browser: true })
  else if (mark) reveal(mark.dataset.ref)
})
// a click on a row opens it in place under its line, the row kept under the pointer; a second click closes it
$('list').addEventListener('click', async (e) => {
  const el = e.target.closest('.row')
  if (!el || e.target.closest('.thimble-details')) return
  const ref = el.dataset.anchor
  open = open === ref ? null : ref
  if (open) await fetchFull(ref)
  thimble.expand(rowOf(ref) || el, list)
})
// a place thimble opens: a cited message or call in its row, a session or a run as the menu's choice, and a
// transcript or a run's index the analyst opened the view on as its session or its run
thimble.onOpen(async (place) => {
  await ready
  const t = place.target || {}, path = place.picked ? place.path || '' : ''
  const file = data.sessions.find((s) => s.path === path)
  const run = t.run || (/sessions-index\.json$/.test(path) ? path.split('/').slice(-2)[0] : null)
  if (t.call || t.message) return reveal(t.call || t.message)
  if (run || t.session || file) {
    $('scope').value = run ? `r:${run}` : `s:${t.session || file.id}`
    load()
  }
})
// the label filter changes which records the reader keeps, and a label's values arrive while it runs
let later = null, filter = null
const soon = () => { clearTimeout(later); later = setTimeout(load, 300) }
thimble.onLabels((state) => {
  const now = JSON.stringify(state.filter || null)
  if (filter != null && now !== filter) soon()
  filter = now
})
thimble.onMarks(() => { if (colour.label) soon() })
load()
</script>
</body>
</html>
