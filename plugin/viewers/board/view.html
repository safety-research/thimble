<!doctype html>
<html>
<head>
<style>
  /* the theme's tokens arrive as CSS variables; the fallbacks are the light theme's, for a page loaded on its own */
  :root {
    --ink: var(--text-primary, #23211d);
    --ink-2: var(--text-secondary, #5f5a52);
    --ink-3: var(--text-tertiary, #8b857b);
    --card: var(--surface-card, #ffffff);
    --inset: var(--bg-sunken, #f3f1ec);
    --line: var(--border-hairline, rgba(35, 33, 29, 0.08));
    --line-2: var(--border-subtle, rgba(35, 33, 29, 0.12));
    --live: var(--accent, #5b5bd6);
    --live-soft: var(--accent-soft, rgba(91, 91, 214, 0.14));
    --sans: var(--font-body, ui-sans-serif, system-ui, sans-serif);
    --mono: var(--font-mono, ui-monospace, monospace);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 13px/1.5 var(--sans); color: var(--ink); background: transparent; display: grid; grid-template-columns: 280px 1fr; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  aside { border-right: 1px solid var(--line-2); display: flex; flex-direction: column; min-height: 0; }
  aside input { margin: 12px; padding: 5px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--card); color: var(--ink); font: 12px var(--sans); }
  aside input:focus { outline: none; border-color: var(--live); }
  #count { font-size: 11px; color: var(--ink-3); padding: 0 12px 6px; }
  #threads { overflow: auto; flex: 1; }
  .thread { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: baseline; padding: 5px 12px; cursor: pointer; border-top: 1px solid var(--line); }
  .thread:hover { background: var(--inset); }
  .thread.on { color: var(--live); }
  .thread .name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread .n { font-size: 11px; color: var(--ink-3); }
  .thread .span { grid-column: 1 / -1; font-size: 10px; color: var(--ink-3); }
  main { overflow: auto; min-height: 0; padding: 16px 24px 48px; }
  header h1 { font-size: 16px; font-weight: 500; margin: 0 0 2px; }
  header .meta { font-size: 11px; color: var(--ink-3); margin-bottom: 16px; }
  .post { background: var(--card); border-radius: 8px; padding: 10px 14px 12px; margin: 0 0 8px; max-width: 760px; border: 1px solid transparent; }
  .post.target { border-color: var(--live); background: linear-gradient(var(--live-soft), var(--live-soft)), var(--card); }
  .post .head { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: 11px; color: var(--ink-3); margin-bottom: 4px; }
  .post .head > span { white-space: nowrap; }
  .post .who { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--ink); }
  .post .text { white-space: pre-wrap; word-break: break-word; }
  button.more { font: 12px var(--sans); color: var(--ink-2); background: none; border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 10px; margin: 0 0 12px; cursor: pointer; }
</style>
</head>
<body>
  <aside>
    <input id="q" type="search" placeholder="Threads" aria-label="Find a thread">
    <div id="count" class="mono"></div>
    <div id="threads" role="list"></div>
  </aside>
  <main id="main"></main>
<script>
  // Threads: the overview is the list of every thread, largest first, with its size and when it ran, so the analyst
  // sees the whole board before reading any of it. Beside it the chosen thread's posts, in time order. The page opens on
  // the largest thread rather than an empty pane, so there are records, and the labels on them, in view at once.
  // Every post carries its line as its data-anchor, so a ⌘-click asks about that post and the labels the analyst turns
  // on mark it; each thread's row and head carry view:<slug>/<thread_id>.
  const slug = (thimble.view && thimble.view.slug) || 'threads'
  const $ = (s) => document.querySelector(s)
  const el = (tag, cls, text) => {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }
  let current = null // {key, title, posts, first, last, start, items}
  let focusLine = null

  // a span of days names its days, and one within a day only its times
  function spanText(first, last) {
    const a = first.slice(0, 16).replace('T', ' '), b = last.slice(0, 16).replace('T', ' ')
    return a.slice(0, 10) === b.slice(0, 10) ? `${a} to ${b.slice(11)}` : `${a.slice(0, 10)} to ${b.slice(0, 10)}`
  }

  async function listThreads(q) {
    const res = await thimble.fetch({ op: 'threads', q: q || '' })
    const box = $('#threads')
    box.replaceChildren()
    $('#count').textContent = res.total > res.threads.length ? `${res.threads.length} of ${res.total} threads` : `${res.total} threads`
    for (const t of res.threads) {
      const row = el('div', 'thread' + (current && current.key === t.key ? ' on' : ''))
      row.setAttribute('role', 'listitem')
      row.dataset.key = t.key
      row.dataset.anchor = `view:${slug}/${t.key}`
      row.dataset.anchorName = `the thread ${t.title}`
      const name = el('span', 'name', t.title)
      name.title = t.title // a long title is cut to the row, and shown whole on hover
      row.append(name, el('span', 'n mono', String(t.posts)), el('span', 'span mono', spanText(t.first, t.last)))
      row.onclick = () => thimble.navigate(`view:${slug}/${t.key}`)
      box.append(row)
    }
  }

  // A post is shown the way the board showed it: its author, its time and its body with its own line breaks. A record
  // whose body is markup, such as a wiki page, would be rendered as the page it describes rather than shown as source.
  function postEl(p, title) {
    const card = el('article', 'post' + (p.line === focusLine ? ' target' : ''))
    card.dataset.line = p.line
    card.dataset.anchor = p.ref
    card.dataset.anchorText = p.text
    card.dataset.anchorName = `the post by ${p.author || 'no author'} in ${title}`
    const head = el('div', 'head mono')
    head.append(el('span', 'who', p.author || 'no author'), el('span', null, p.when))
    card.append(head, el('div', 'text', p.text))
    return card
  }

  function draw() {
    const main = $('#main')
    main.replaceChildren()
    if (!current) return
    const header = el('header')
    header.dataset.anchor = `view:${slug}/${current.key}`
    header.dataset.anchorName = `the thread ${current.title}`
    const span = `${current.first.slice(0, 16).replace('T', ' ')} to ${current.last.slice(0, 16).replace('T', ' ')}`
    header.append(el('h1', null, current.title), el('div', 'meta mono', `${current.posts} posts · ${span}`))
    main.append(header)
    if (current.start > 0) {
      const more = el('button', 'more', `Earlier (${current.start})`)
      more.onclick = async () => {
        const res = await thimble.fetch({ op: 'thread', key: current.key, before: current.start })
        current = { ...res, items: res.items.concat(current.items) }
        draw()
      }
      main.append(more)
    }
    for (const p of current.items) main.append(postEl(p, current.title))
    for (const row of document.querySelectorAll('.thread')) row.classList.toggle('on', row.dataset.key === current.key)
    const target = focusLine != null && main.querySelector(`.post[data-line="${focusLine}"]`)
    if (target) target.scrollIntoView({ block: 'center' })
    else main.scrollTop = 0
  }

  async function openThread(key, line) {
    focusLine = line == null ? null : line
    current = await thimble.fetch({ op: 'thread', key, around: line == null ? undefined : line })
    if (current) draw()
  }

  thimble.onOpen(async (place) => {
    const t = place && place.target
    if (t && t.thread != null) return openThread(t.thread, t.line)
    if (!current) {
      const res = await thimble.fetch({ op: 'threads', limit: 1 })
      if (res.threads.length) await openThread(res.threads[0].key, null)
    }
  })
  let typing = null
  $('#q').addEventListener('input', (e) => {
    clearTimeout(typing)
    typing = setTimeout(() => listThreads(e.target.value), 150)
  })
  listThreads('')
</script>
</body>
</html>
