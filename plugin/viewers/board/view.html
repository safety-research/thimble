<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .seg, .list-row, .chip, .btn) and the theme's tokens come with the frame; this page only
     lays them out */
  html, body { margin: 0; height: 100%; }
  body { display: grid; grid-template-columns: 260px 1fr; }
  aside { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border-hairline); }
  .tools { display: flex; gap: 6px; align-items: center; padding: 12px 12px 6px; }
  .tools .field { flex: 1; }
  #count { padding: 0 12px 6px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-tertiary); }
  #topics { flex: 1; overflow: auto; padding: 0 4px 12px; }
  .topic { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: baseline; }
  .topic .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-ui-sm); }
  .topic .n, .topic .span { font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-tertiary); }
  .topic .m { margin-right: 6px; color: var(--mark); font-weight: 500; }
  .topic .span { grid-column: 1 / -1; }
  main { min-height: 0; overflow: auto; padding: 16px 20px 48px; }
  header { margin-bottom: 8px; padding-left: 12px; }
  h1 { margin: 0; font: 500 var(--text-lg) / 1.3 var(--font-body); }
  .meta { margin-top: 2px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-tertiary); }
  .post { max-width: 720px; padding: 10px 12px; border-bottom: 1px solid var(--border-hairline); }
  .post.target { background: var(--surface-selected); }
  .post .head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 4px; }
  .post .who { font-weight: 500; }
  .post .when { font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); }
  .post .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .more { margin: 10px 0; }
</style>
</head>
<body>
  <aside>
    <div class="tools">
      <input id="q" class="field" type="search" placeholder="Topics" aria-label="Find a topic">
      <div class="seg seg-track" id="sort">
        <button class="seg-opt active" data-sort="size">Largest</button>
        <button class="seg-opt" data-sort="latest">Latest</button>
      </div>
    </div>
    <div id="count"></div>
    <div id="topics" role="list"></div>
  </aside>
  <main id="main"></main>
<script>
  // Forum: the list of every topic, with its size and when it ran, beside the chosen topic's posts in time order. It
  // opens on the largest topic, so posts are in view at once. Each post's data-anchor is its file ref, and each topic's
  // row and head are view:<slug>/<topic>, so thimble marks them. While a label is on, each row counts the posts it
  // marks in its colour; a filter is applied by the reader, so the page fetches again in thimble.onLabels.
  const slug = (thimble.view && thimble.view.slug) || 'forum'
  const $ = (s) => document.querySelector(s)
  const el = (tag, cls, text) => {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }
  const PAGE = 60 // reader.py PAGE_POSTS
  let current = null // the open topic: {key, title, posts, first, last, start, items}
  let focusLine = null
  let label = null // the first label that is on
  let sort = 'size'
  let listed = false

  // a span within one day names its day and times, a longer one its days
  const MONTHS = 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')
  const day = (t) => `${Number(t.slice(8, 10))} ${MONTHS[Number(t.slice(5, 7)) - 1]}`
  function spanText(first, last) {
    if (first.slice(0, 10) !== last.slice(0, 10)) return `${day(first)} to ${day(last)}`
    const a = first.slice(11, 16), b = last.slice(11, 16)
    return a === b ? `${day(first)} ${a}` : `${day(first)} ${a} to ${b}`
  }

  async function listTopics() {
    listed = true
    const res = await thimble.fetch({ op: 'topics', q: $('#q').value, sort })
    $('#count').textContent = res.total > res.topics.length ? `${res.topics.length} of ${res.total} topics` : `${res.total} topics`
    const rows = res.topics.map((t) => {
      const row = el('div', 'list-row topic' + (current && current.key === t.key ? ' active' : ''))
      row.setAttribute('role', 'listitem')
      row.dataset.key = t.key
      row.dataset.anchor = `view:${slug}/${t.key}`
      row.dataset.anchorName = `the topic ${t.title}`
      const name = el('span', 'name', t.title)
      name.title = t.title
      const n = el('span', 'n')
      if (label && t.marked) n.append(el('span', 'm', String(t.marked)))
      n.append(String(t.posts))
      row.append(name, n, el('span', 'span', spanText(t.first, t.last)))
      row.onclick = () => thimble.navigate(`view:${slug}/${t.key}`)
      return row
    })
    $('#topics').replaceChildren(...rows)
  }

  // A post reads as the forum showed it: author, time, the post it answers and the body with its own line breaks.
  function postEl(p) {
    const box = el('article', 'post' + (p.line === focusLine ? ' target' : ''))
    box.dataset.line = p.line
    box.dataset.anchor = p.ref
    box.dataset.anchorText = p.text
    box.dataset.anchorName = `the post by ${p.author || 'no author'} in ${current.title}`
    const head = el('div', 'head')
    head.append(el('span', 'who', p.author || 'no author'), el('span', 'when', p.when))
    if (p.reply) {
      const to = el('button', 'chip chip-sans chip-tone-neutral chip-act', `reply to ${p.reply.author}`)
      to.onclick = () => thimble.navigate(p.reply.ref)
      head.append(to)
    }
    box.append(head, el('div', 'text', p.text))
    return box
  }

  function pageButton(text, start) {
    const b = el('button', 'btn btn-secondary btn-sm more', text)
    b.onclick = () => openTopic(current.key, null, start)
    return b
  }

  function draw() {
    const main = $('#main')
    if (!current) return main.replaceChildren()
    const header = el('header')
    header.dataset.anchor = `view:${slug}/${current.key}`
    header.dataset.anchorName = `the topic ${current.title}`
    header.append(el('h1', null, current.title), el('div', 'meta', `${current.posts} posts · ${spanText(current.first, current.last)}`))
    const parts = [header]
    if (current.start > 0) parts.push(pageButton(`Earlier (${current.start})`, Math.max(0, current.start - PAGE)))
    parts.push(...current.items.map(postEl))
    const after = current.posts - current.start - current.items.length
    if (after > 0) parts.push(pageButton(`Later (${after})`, current.start + current.items.length))
    main.replaceChildren(...parts)
    for (const row of document.querySelectorAll('.topic')) row.classList.toggle('active', row.dataset.key === current.key)
    const target = focusLine != null && main.querySelector(`.post[data-line="${focusLine}"]`)
    if (target) target.scrollIntoView({ block: 'center' })
    else main.scrollTop = 0
  }

  async function openTopic(key, line, start) {
    focusLine = line == null ? null : line
    current = await thimble.fetch({ op: 'topic', key, around: line == null ? undefined : line, start })
    draw()
  }

  thimble.onOpen(async (place) => {
    const t = place && place.target
    if (!listed) await listTopics()
    if (t && t.topic != null) return openTopic(t.topic, t.line)
    if (!current) {
      const res = await thimble.fetch({ op: 'topics', limit: 1 })
      if (res.topics.length) await openTopic(res.topics[0].key, null)
    }
  })
  thimble.onLabels(async (state) => {
    label = state.labels[0] || null
    if (label) document.documentElement.style.setProperty('--mark', label.colour)
    if (!listed) return // the first fetches read them
    await listTopics()
    if (current) await openTopic(current.key, focusLine, current.start)
  })
  let typing = null
  $('#q').addEventListener('input', () => {
    clearTimeout(typing)
    typing = setTimeout(listTopics, 150)
  })
  for (const opt of document.querySelectorAll('#sort .seg-opt')) {
    opt.onclick = () => {
      sort = opt.dataset.sort
      for (const o of document.querySelectorAll('#sort .seg-opt')) o.classList.toggle('active', o === opt)
      listTopics()
    }
  }
</script>
</body>
</html>
