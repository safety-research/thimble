<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session mirror</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../common/chrome.css">
<link rel="stylesheet" href="mirror.css">
<!--
  The session mirror: this terminal session's messages as the browser draws them, from their records
  (thimble/messages/<session>/). The person's prompts; Claude's messages with their marks (citations, glosses,
  sparklines) and the verb row under each; the cards each turn saved, drawn by draw/svg.js. A mark opens the tray;
  a card opens its detail page. What the person does here goes to the terminal session as a prompt or a verb press.
-->
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="main">
    <header id="mhead">
      <div class="mt"><b id="title">This session</b><span class="chip" id="folder"></span><span class="modchip"><i></i>thimble</span></div>
      <div class="cov" id="cov"></div>
    </header>
    <div id="scroll"><div id="tx"><p class="notice" id="empty">Loading this session…</p></div></div>
    <div id="traywell"><section id="tray" aria-label="tray"><header class="th" id="th"></header><div class="tb" id="tb"></div></section></div>
    <div class="composer" id="composer">
      <div class="box" id="cbox">
        <div class="irow"><span class="scope" id="scope"></span><textarea id="prompt" class="prompt" rows="1" placeholder="Reply to Claude…" spellcheck="false"></textarea></div>
        <div class="brow">
          <span class="ckeys" id="ckeys"></span>
          <span class="model">to the terminal session</span>
          <button class="send" id="send" aria-label="Send to the terminal session">↑</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script type="module" src="mirror.js"></script>
</body>
</html>
