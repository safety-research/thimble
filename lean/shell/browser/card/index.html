<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../common/chrome.css">
<link rel="stylesheet" href="card.css">
<!--
  The card detail: one pattern for every card. A header (title, the takeaway with its citations, v1 · v2); the card
  large, its parts selectable; one "from" line (sources · rows used · labels used · coverage, from the object's
  lineage and the kernel's coverage); the examples behind the selected part, flipped with [ ]; a side thread; and the
  program behind p, over the page. No tab strip, no date.
-->
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="detail">
    <header class="dh">
      <div class="drow"><h1 id="dtitle">…</h1><div class="vers" id="vers"></div></div>
      <p class="take" id="take"></p>
    </header>
    <div id="dcard"><p class="notice">drawing…</p></div>
    <div id="dfrom"></div>
    <div id="dev"></div>
    <footer id="dfoot"></footer>
    <div id="dprog" aria-hidden="true">
      <div class="pgh"><span class="ast">✻</span><b>how Claude drew this</b><span class="meta" id="pgmeta"></span><span class="sp"></span><span class="meta"><span class="bar">▌</span> lines that drew <b id="pgpart"></b></span></div>
      <div class="pgq" id="pgq"></div>
      <div class="code" id="pgcode"></div>
    </div>
  </main>
  <aside id="thread">
    <div class="th">Thread <span>· this card</span></div>
    <div id="tmsgs"></div>
    <div id="tcomp">
      <div class="tscope" id="tscope"></div>
      <textarea id="tprompt" class="prompt" rows="1" spellcheck="false"></textarea>
      <div class="brow"><span class="ckeys" id="tkeys"><kbd>?</kbd> ask · <kbd>↵</kbd> send to the terminal session</span><button class="send" id="tsend" aria-label="Send to the terminal session">↑</button></div>
    </div>
  </aside>
</div>
<script type="module" src="card.js"></script>
</body>
</html>
