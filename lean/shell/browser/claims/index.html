<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims</title>
<!--
  Claims in the browser: the claims made in this session (thimble/claims/<session>.json, CONTRACT 7), deduped and
  clustered by what the work is doing, as a graph with no lines at rest. Pointing at a claim shows a card of what it
  means (the claim as said, precisely, based on, judgment, not stated) and draws its links; the rest fades. A click
  opens the message where it was said. Replay (or r) grows the graph again in the order the claims were made, the turn
  it is at in the button, its newest claims marked with their links; any key stops it.

  A page folder like the others, served behind the session's token: it reads /api/claims (or ?src=<json url>, or
  window.CLAIMS_STORE for a static page) and polls while visible. ?embed=1 leaves out its own header, for a tab of
  another page: a click on a claim then posts {type: 'thimble:row', row} to the parent page, and the parent can post
  {type: 'thimble:open-claim', claim} to show one claim's card. #ready opens on the settled graph with no arrival.
-->
<link rel="stylesheet" href="claims.css">
</head>
<body>
<div id="app">
  <header class="ah">
    <span class="icon"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g fill="#fff"><circle cx="4" cy="5" r="2"/><circle cx="11" cy="4" r="1.6"/><circle cx="6" cy="12" r="2.2"/><circle cx="13" cy="10" r="1.3"/></g></svg></span>
    <div class="tt"><b>Claims</b><small id="sub">loading</small></div>
  </header>
  <div class="card">
    <div id="gwrap">
      <canvas id="g"></canvas>
      <div id="hc" class="hc" role="tooltip"></div>
      <button id="replay" class="replay" title="Grow the graph again in the order the claims were made"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span>Replay</span><kbd>r</kbd></button>
      <div id="empty"></div>
    </div>
  </div>
</div>
<script src="claims.js"></script>
</body>
</html>
