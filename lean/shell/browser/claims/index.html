<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<!--
  Atlas in the browser: the claims of one atlas object as a force graph. Nodes are colored by kind, clusters are soft
  regions, a hover names a claim and its neighbors, a click opens the claim below the graph with its evidence (each
  citation opens its rows through `lean resolve`), its related claims and ↵ ask. 1-5 filter by kind, / searches.
  It reads the object through the page server: ?o=<object id> (the newest atlas when left out), or ?src=<json url>.
  #ready opens on the settled graph with no arrival.
-->
<link rel="stylesheet" href="atlas.css">
</head>
<body>
<div id="app">
  <header class="ah">
    <span class="icon"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g stroke="#fff" stroke-width="1.2" opacity=".75"><line x1="4" y1="5" x2="11" y2="4"/><line x1="4" y1="5" x2="6" y2="12"/><line x1="11" y1="4" x2="6" y2="12"/><line x1="11" y1="4" x2="13" y2="10"/></g><g fill="#fff"><circle cx="4" cy="5" r="2"/><circle cx="11" cy="4" r="1.6"/><circle cx="6" cy="12" r="2.2"/><circle cx="13" cy="10" r="1.3"/></g></svg></span>
    <div class="tt"><b>Atlas</b><small id="sub">loading</small></div>
    <span class="sp"></span>
    <span class="st" id="st"></span>
  </header>
  <div class="atool" id="atool"></div>
  <div id="gwrap">
    <canvas id="g"></canvas>
    <div id="gstat"></div>
    <div id="glegend"></div>
    <div id="ghint">hover a claim · click to open · drag to move</div>
    <div id="empty"></div>
    <div id="detail"></div>
  </div>
</div>
<script src="atlas.js"></script>
</body>
</html>
