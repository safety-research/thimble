[project]
name = "thimble-backend"
version = "0.6.1"
license = "Apache-2.0"
description = "thimble: an analyst workbench for reconstructing what happened in agent transcripts"
requires-python = ">=3.12"
dependencies = [
  # 0.132 refuses a JSON body sent without a JSON Content-Type (strict_content_type), which a cross-site form or
  # no-cors fetch cannot set; the Origin check (app/http_guard.py) is the first defence, this the second
  "fastapi>=0.132",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.7",
  "claude-agent-sdk>=0.1",
  "jupyter_client>=8.6",
  "ipykernel>=6.29",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "altair>=5.3",
  # the kernels read workbooks (pandas.read_excel), and a citation of a PDF page resolves to its text (app/pdfs.py)
  "openpyxl>=3.1",
  "pypdf>=5.0",
  # the card harness (app/render.py) draws every card offscreen in a headless Chromium, which install.sh fetches for
  # the version uv.lock pins
  "playwright>=1.55",
  # the plugin's MCP shim (plugin/bin/thimble-mcp) calls the server's tools and holds its subscription's stream with it,
  # in the tree's own venv, which a release installs without the dev extras
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests_public"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
