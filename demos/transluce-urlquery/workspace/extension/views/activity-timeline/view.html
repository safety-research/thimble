<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .chip, .btn, .seg), its Color by control, its time range selector and the theme's tokens
     come with the frame; this page lays out the control row, the timeline (the range selector, the axis and the lanes)
     and the side column (the list of the reports in the range, each opening in place) */
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--surface-card); color: var(--text-primary); font: 400 var(--text-ui-sm) / 1.4 var(--font-body); font-variant-numeric: tabular-nums; }
  button { font: inherit; }
  .ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  #ctl { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; padding: 9px 14px; border-bottom: 1px solid var(--border-hairline); }
  .search { position: relative; flex: 0 1 170px; min-width: 110px; }
  .search .field { width: 100%; padding-left: 27px; }
  .search .ico { position: absolute; left: 8px; top: 50%; margin-top: -7px; color: var(--text-tertiary); pointer-events: none; }
  .fbtn { flex: none; padding: 0 7px 0 9px; }
  .fbtn .ico { width: 12px; height: 12px; color: var(--text-tertiary); }
  .fbtn .v { font-weight: 500; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .fbtn .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .fbtn .clr { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-right: -3px; border-radius: 4px; color: var(--text-tertiary); }
  .fbtn .clr:hover { background: var(--track-bg); color: var(--text-primary); }
  #chips { display: contents; }
  /* the Color by control takes the row's free width, and a line of its own when less than its least is left */
  #colour { flex: 1 1 320px; min-width: 260px; margin-left: 4px; }
  #chips .chip { max-width: 240px; }
  .chip .ico { width: 10px; height: 10px; }
  /* the range selector over the lanes' time, its readout in the lanes' gutter; the lanes' one axis under it */
  #top { flex: none; display: flex; align-items: center; padding: 10px 0 4px; }
  #rread { flex: none; width: var(--gut); min-width: 0; box-sizing: border-box; padding-right: 10px; white-space: normal; }
  #range { flex: none; }
  #axrow { flex: none; display: flex; }
  #axrow .pad { flex: none; width: var(--gut); }
  #axis { flex: none; }
  .sw { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }

  #main { flex: 1; min-height: 0; display: flex; }
  #tl { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 0 0 0 14px; }
  #side { order: 2; flex: none; width: clamp(266px, 29vw, 420px); min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--border-hairline); }

  .ib { flex: none; width: 24px; padding: 0; }

  svg { display: block; overflow: visible; user-select: none; -webkit-user-select: none; }
  svg text { font: 400 10.5px var(--font-mono); fill: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  svg text.strong { fill: var(--text-secondary); }
  svg .grid { stroke: var(--border-hairline); }
  svg .major { stroke: rgba(var(--ink-rgb), 0.16); }
  svg .rule { stroke: rgba(var(--ink-rgb), 0.07); }

  #lanes { position: relative; flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding-bottom: 8px; scrollbar-width: thin; }
  #lanebox { position: relative; display: flex; }
  #gut { position: relative; flex: none; width: var(--gut); }
  #plot { flex: none; cursor: crosshair; }
  .lh { position: absolute; left: 0; right: 10px; display: flex; align-items: center; gap: 6px; box-sizing: border-box; padding-left: 6px; margin-left: -6px; border-radius: 3px; }
  .lh { cursor: pointer; }
  .lh .ln { flex: 1; min-width: 0; align-self: stretch; padding: 0; border: 0; background: none; color: var(--text-primary); font: 400 var(--text-xs) / 1.2 var(--font-body); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .lh:hover .ln { text-decoration: underline; text-underline-offset: 2px; }
  .lh .n { flex: none; color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .lh.zero .ln { color: var(--text-tertiary); }
  .lh.iso .ln { font-weight: 500; }
  .lh.hot { background: var(--surface-hover); }
  #brush { position: absolute; top: 0; bottom: 0; display: none; background: rgba(var(--ink-rgb), 0.07); border-left: 1px solid var(--text-secondary); border-right: 1px solid var(--text-secondary); pointer-events: none; }

  /* a report opened in place under its line in the list: its fields, then what it can open */
  .row .thimble-details { padding: 8px 0 10px; cursor: default; }
  .det-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .det-when { margin-top: 6px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-secondary); }
  .det-sec { margin-top: 8px; }
  .det-sec > .h { margin-bottom: 3px; font: 500 var(--text-xs) / 1.3 var(--font-body); color: var(--text-tertiary); }
  .det-why { margin: 0; font: 400 var(--text-sm) / 1.5 var(--font-body); overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; }
  .facts dt { color: var(--text-tertiary); font-size: var(--text-xs); line-height: 1.5; }
  .facts dd { margin: 0; min-width: 0; font-size: var(--text-ui-sm); line-height: 1.45; overflow-wrap: anywhere; }
  .facts dd.mono { font: 400 var(--text-mono-sm) / 1.6 var(--font-mono); }
  .srcbox { padding: 6px 0 6px 8px; margin-left: -8px; border-radius: var(--radius-ui); }
  .kv { margin-top: 6px; }
  .kv .k { color: var(--text-tertiary); font-size: var(--text-xs); line-height: 1.4; }
  .kv .v { font: 400 10.5px / 1.5 var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .url { display: flex; align-items: flex-start; gap: 4px; min-width: 0; }
  .url a { flex: 1; min-width: 0; color: var(--text-primary); font: 400 10.5px / 1.5 var(--font-mono); overflow-wrap: anywhere; text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), 0.4); text-underline-offset: 2px; cursor: pointer; }
  .url a .ico { width: 11px; height: 11px; margin-left: 3px; vertical-align: -1px; }
  .url .ib { margin-top: -3px; }
  .det-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .det-acts .ico { width: 12px; height: 12px; }
  .marks { display: flex; flex-wrap: wrap; gap: 4px; }

  #listhead { flex: none; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--border-hairline); }
  #listhead .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 var(--text-ui-sm) / 1 var(--font-body); }
  #listhead .t .n { font-family: var(--font-mono); font-size: var(--text-mono); }
  #listhead .t .s { color: var(--text-tertiary); font-weight: 400; }
  #listwrap { position: relative; flex: 1 1 150px; min-height: 150px; }
  #list { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: thin; }
  .dh { position: absolute; left: 0; right: 0; box-sizing: border-box; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 14px; border-bottom: 1px solid var(--border-subtle); background: var(--surface-card); font: 500 var(--text-xs) / 1 var(--font-body); }
  .dh .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  #stick { position: absolute; left: 0; right: 10px; top: 0; height: 28px; display: none; }
  #stick .dh { right: 0; box-shadow: 0 6px 8px -8px rgba(var(--ink-rgb), 0.3); }
  #rows { position: relative; }
  .row { position: absolute; left: 0; right: 0; box-sizing: border-box; height: 46px; padding: 6px 12px 0 14px; border-bottom: 1px solid var(--border-hairline); cursor: pointer; overflow: hidden; }
  .row:hover { background: var(--surface-hover); }
  .row.sel { background: var(--surface-selected); }
  .row.sel:hover { background: var(--surface-selected); }
  .row .l1 { display: flex; align-items: center; gap: 7px; min-width: 0; height: 18px; }
  .row .tm { flex: none; color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .row .src { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-xs); }
  .row .rid { flex: none; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .row .l2 { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-tertiary); font-size: var(--text-xs); }
  .row .l2 .cl { color: var(--text-secondary); }
  .empty { padding: 26px 14px; color: var(--text-tertiary); font-size: var(--text-xs); }
  #gut .empty { padding: 20px 0; white-space: nowrap; }

  .pop { position: fixed; z-index: 60; min-width: 200px; max-width: 320px; max-height: 72vh; overflow: auto; padding: 4px; border-radius: var(--radius-ui); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), 0.14); font: 400 var(--text-ui-sm) / 1.3 var(--font-body); }
  .pop .head { padding: 8px 8px 4px; font: 500 var(--text-xs) / 1 var(--font-body); color: var(--text-tertiary); }
  .pop .head .n { margin-left: 6px; font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .pop.lanes { display: flex; flex-direction: column; width: min(320px, calc(100vw - 12px)); height: min(500px, calc(100vh - 60px)); max-height: none; overflow: hidden; padding: 4px; }
  /* a box that scrolls shows a shadow at the edge it can scroll past */
  .scrolls { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin;
    background: linear-gradient(var(--raised-bg) 30%, transparent) top / 100% 28px no-repeat local,
      linear-gradient(transparent, var(--raised-bg) 70%) bottom / 100% 28px no-repeat local,
      radial-gradient(farthest-side at 50% 0, rgba(var(--ink-rgb), 0.16), transparent) top / 100% 10px no-repeat scroll,
      radial-gradient(farthest-side at 50% 100%, rgba(var(--ink-rgb), 0.16), transparent) bottom / 100% 10px no-repeat scroll; }
  .pop .sep { height: 1px; margin: 4px 0; background: var(--border-hairline); }
  .pop .note { padding: 4px 8px 6px; color: var(--text-tertiary); }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: none; color: var(--text-primary); font: inherit; text-align: left; cursor: pointer; }
  .item:hover { background: var(--surface-hover); }
  .item:disabled { cursor: default; }
  .item .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .lab.none { color: var(--text-tertiary); }
  .item .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .box { display: inline-grid; place-items: center; flex: none; width: 14px; height: 14px; box-sizing: border-box; border: 1.5px solid rgba(var(--ink-rgb), 0.35); border-radius: 3px; }
  .box.on { border-color: var(--text-primary); background: var(--text-primary); }
  .box.on::after { content: ''; width: 6px; height: 3px; margin-top: -2px; border: solid var(--surface-card); border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg); }
  .more-link { display: block; width: 100%; padding: 4px 8px 6px 30px; border: 0; background: none; color: var(--text-secondary); font: inherit; font-size: var(--text-xs); text-align: left; cursor: pointer; }
  .more-link:hover { color: var(--text-primary); text-decoration: underline; }

  #tip { position: fixed; z-index: 70; display: none; max-width: 300px; padding: 7px 9px; border-radius: var(--radius-ui); background: var(--surface-card); box-shadow: 0 0 0 1px rgba(var(--ink-rgb), 0.12), 0 10px 28px -14px rgba(var(--ink-rgb), 0.32); pointer-events: none; font: 400 var(--text-xs) / 1.45 var(--font-body); }
  #tip .h { font-weight: 500; }
  #tip .w { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); }
  #tip .k { display: flex; align-items: center; gap: 6px; }
  #tip .k .n { margin-left: auto; padding-left: 12px; font-family: var(--font-mono); font-size: var(--text-mono-sm); color: var(--text-secondary); }
  #tip .x { margin-top: 3px; color: var(--text-secondary); }
</style>
</head>
<body>
<div id="ctl">
  <label class="search"><svg class="ico" viewBox="0 0 24 24"><path d="M4 10.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M15.2 15.2L20 20"/></svg><input id="q" class="field" type="search" placeholder="Search reports" autocomplete="off" spellcheck="false"></label>
  <button id="f-lane" class="field fbtn" type="button" aria-haspopup="menu" aria-expanded="false"></button>
  <span id="chips"></span>
  <span id="colour"></span>
</div>
<div id="main">
  <aside id="side">
    <div id="listhead"></div>
    <div id="listwrap"><div id="list" tabindex="-1"><div id="rows"></div></div><div id="stick"></div></div>
  </aside>
  <section id="tl">
    <div id="top"><div id="rread"></div><div id="range"></div></div>
    <div id="axrow"><div class="pad"></div><div id="axis"></div></div>
    <div id="lanes"><div id="lanebox"><div id="gut"></div><svg id="plot"></svg><div id="brush"></div></div></div>
  </section>
</div>
<div id="tip"></div>
<script>
'use strict'
// Activity Timeline: every report on one UTC time axis, a lane per data source and one each for the reports under
// review and the background controls. thimble's time range selector above the lanes holds the whole span of the data,
// its reports per moment in the Color by colors, with a viewfinder over it: drag its middle to pan, its edges to zoom,
// double-click for the whole span; it opens on the whole span. The lanes show the range's reports per bin, stacked by
// the Color by choice, as bars whose height grows with the log of the count, and once the range is six hours or less
// each report is its own mark at its second; the axis under the range is the one axis. A drag on the lanes zooms to the
// span dragged, Ctrl or ⌘ with the wheel zooms around the pointer (Shift or a sideways wheel pans), a click on a bar
// zooms to its bin, a click on a lane's name shows that lane alone and a shift-click adds or takes a lane. Lanes keep
// one height and scroll as a list. The side column lists the range's reports in time order; a click opens a report in
// place under its line, again closes it.
// Color: thimble's Color by control in the control row (thimble.colorBy) colors by confidence, class, disposition,
// source basis or catalog, or by a label; a value whose chip is off leaves the bars, the counts and the list. The list
// has the control's two tracks.
// Labels: the reader keeps only the reports the label filter keeps and hands each its marks, which give each report its
// value while a label is the color; list rows carry their row's ref as data-anchor, so thimble marks them; marks and
// bars are drawn in the values' colors by the page (data-anchor-unmarked).
const slug = (thimble.view && thimble.view.slug) || 'activity-timeline'
const DAY = 86400
const TICKS_BELOW = 6 * 3600 // a window this short shows each report as its own mark
const MIN_SPAN = 60
const LANE_H = 18, SEP = 10 // a lane's height, and the space before the lanes of reports not included
const RH = 46 // list row
const NONINC = new Set(['Review required', 'Background control'])
const COLS = ['r', 't', 'ln', 'sl', 'lane', 'confidence', 'disposition', 'broad_class', 'source_basis', 'catalog', 'why_included', 'mb']
const NO_CONF = 'No confidence' // a report with no confidence, named as its Color by chip names it
const MONTH = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const WEEKDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
const BINS = [1, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, DAY, 2 * DAY, 7 * DAY]
const ICON = {
  down: 'M6 9l6 6 6-6', x: 'M6 6l12 12M18 6L6 18', check: 'M5 12.5l4.5 4.5L19 7', plus: 'M12 5v14M5 12h14',
  file: 'M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5',
  copy: 'M9 9h10v11H9zM5 15V4h10', zoom: 'M4 10.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M15.2 15.2L20 20M10.5 7.5v6M7.5 10.5h6',
  tag: 'M3 12V4h8l10 10-8 8L3 12zM7.5 7.5h.01', ext: 'M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5',
}
const ico = (n, c = 'ico') => `<svg class="${c}" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const fmt = (n) => n.toLocaleString('en-US')
const plural = (n, one, many = one + 's') => `${fmt(n)} ${n === 1 ? one : many}`
const pad2 = (n) => String(n).padStart(2, '0')
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
const $ = (id) => document.getElementById(id)

// ---------------------------------------------------------------- time (seconds since 1970, UTC)
const dt = (t) => new Date(t * 1000)
const isoDay = (t) => dt(t).toISOString().slice(0, 10)
const isoMin = (t) => dt(t).toISOString().slice(0, 16)
const hms = (t) => dt(t).toISOString().slice(11, 19)
const hm = (t) => dt(t).toISOString().slice(11, 16)
const dmy = (t) => { const d = dt(t); return `${d.getUTCDate()} ${MONTH[d.getUTCMonth()]} ${d.getUTCFullYear()}` }
const dm = (t) => { const d = dt(t); return `${d.getUTCDate()} ${MONTH[d.getUTCMonth()]}` }
const monthStart = (t, k = 0) => { const d = dt(t); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + k, 1) / 1000 }
function spanWords(a, b) {
  // a window in words: its days, and its times when it is not whole days
  const whole = a % DAY === 0 && b % DAY === 0
  if (whole) {
    const last = b - DAY
    if (last === a) return `${WEEKDAY[dt(a).getUTCDay()]} ${dmy(a)}`
    if (a === monthStart(a) && b === monthStart(a, 1)) return `${MONTH[dt(a).getUTCMonth()]} ${dt(a).getUTCFullYear()}`
    return dt(a).getUTCFullYear() === dt(last).getUTCFullYear() ? `${dm(a)} – ${dmy(last)}` : `${dmy(a)} – ${dmy(last)}`
  }
  const sec = a % 60 || b % 60
  const tm = (t) => (sec ? hms(t) : hm(t))
  // a span that ends at midnight ends at 24:00 of its day
  if (isoDay(a) === isoDay(b - 1)) return `${dmy(a)}, ${tm(a)}–${b % DAY === 0 ? (sec ? '24:00:00' : '24:00') : tm(b)}`
  return `${dm(a)} ${tm(a)} – ${dm(b)} ${tm(b)}`
}
const binStart = (t, b) => (b === 7 * DAY ? Math.floor((t - 4 * DAY) / b) * b + 4 * DAY : Math.floor(t / b) * b) // weeks from Monday

// ---------------------------------------------------------------- data
// The reader sends every report the label filter keeps as columns, a page at a time (COLS): r the reader's row, t the
// seconds since t0, ln and sl the report's lines in all-reports.csv and report-sources.csv, a column per field (an
// index into names) and mb its marks as bits.
let D = null, N = 0, C = null, T = new Float64Array(0)
let IDS = '', IDW = 8 // the start of each report's report_id, IDW characters each, one after another
let rowAt = new Map()
let loadSeq = 0
let labelState = { labels: [], filter: null, all: null, palette: null }
let EXT = [0, DAY] // the whole span of the data: the first report's UTC day to the end of the last report's

const S = {
  lanes: new Set(), // lane codes shown alone; empty for all
  q: '', found: null, // the search and the reader rows that hold it
  sel: null, detail: null, // the report opened in place: its reader row and its fetched details
  keep: null, // a row a citation opened, kept whatever the label filter keeps
}

async function load() {
  // the pages in turn (one holds every report unless the corpus grows); each column decoded from its differences
  // and its packed codes
  const my = ++loadSeq
  const parts = []
  let from = 0
  try {
    do {
      const page = await thimble.fetch({ op: 'overview', from, ...(S.keep != null ? { keep: [S.keep] } : {}) }, { key: 'overview' })
      if (my !== loadSeq) return false
      parts.push(page)
      from = page.next
    } while (from != null)
  } catch (e) {
    if (e && e.name === 'AbortError') return false
    throw e
  }
  const first = parts[0]
  const n = parts.reduce((s, p) => s + p.n, 0)
  const cols = Object.fromEntries(COLS.map((k) => [k, new Int32Array(n)]))
  const t = new Float64Array(n)
  const A = first.alphabet, at = new Int16Array(128).fill(0)
  for (let k = 0; k < A.length; k++) at[A.charCodeAt(k)] = k
  let o = 0
  for (const p of parts) {
    let r = p.start - 1, tt = 0, ln = 0, sl = 0
    for (let j = 0; j < p.n; j++) {
      r += p.r ? p.r[j] : 1; tt += p.t[j]; ln += p.ln[j]
      if (p.sl[j]) sl += p.sl[j]
      cols.r[o + j] = r; t[o + j] = first.t0 + tt; cols.ln[o + j] = ln; cols.sl[o + j] = p.sl[j] ? sl : 0
    }
    for (const [f, { w, s: str }] of Object.entries(p.codes)) {
      const col = cols[f]
      if (!col) continue
      for (let j = 0; j < p.n; j++) { let v = 0; for (let k = 0; k < w; k++) v = v * 64 + at[str.charCodeAt(j * w + k)]; col[o + j] = v }
    }
    for (const [j, bits] of p.mb) cols.mb[o + j] = bits
    o += p.n
  }
  D = first
  N = n
  C = cols
  T = t
  IDW = first.id_chars || 8
  IDS = parts.map((p) => p.ids || ''.padEnd(p.n * IDW)).join('')
  rowAt = new Map()
  for (let i = 0; i < N; i++) rowAt.set(C.r[i], i)

// ---------------------------------------------------------------- popovers: one at a time, closed by a click outside or Escape

// ---------------------------------------------------------------- the control row

function laneCounts() {

// Data source: every data source, the reports under review and the background controls last, in a column that scrolls,

// ---------------------------------------------------------------- layout: the lanes, one height each
let G = 150 // the gutter of lane names, px
let PW = 400 // the plot's width
let layout = null // {rows: [{c, non?, y, h}], h}
function laneLayout() {
  // the lanes with a report that passes the filters, in the reader's order (largest first, the reports under review and
  // the background controls last), each LANE_H high; a range shows the lanes with a report in it, the whole span every
  // lane; the lanes scroll as a list when they do not fit
  const inWin = new Map(), ever = new Map(), [a, b] = W()

  for (let i = 0; i < N; i++) if (passes(i)) {

  }
  const sel0 = S.sel != null && rowAt.has(S.sel) ? C.lane[rowAt.get(S.sel)] : null

    r.y = y; r.h = LANE_H; y += LANE_H

// a lane's count: its reports in the range

}

// ---------------------------------------------------------------- the timeline
// the gutter is as wide as the longest lane name and its count need, up to almost half the timeline
let measure = null
function textWidth(text, font) {
  if (!measure) measure = document.createElement('canvas').getContext('2d')
  measure.font = font
  return measure.measureText(text).width
}
function sizes() {
  const w = $('tl').clientWidth - 14
  const body = getComputedStyle(document.body).fontFamily, mono = token('--font-mono') || 'monospace'
  // as wide as every lane's name and the widest count need, whichever lanes show, so the plot stays where it is when a
  // lane is shown alone
  const most = textWidth(fmt(N), `400 11px ${mono}`)
  let need = 0
  for (const c of D.lanes) need = Math.max(need, textWidth(laneName(c), `400 12px ${body}`) + 8 + most)
  G = Math.round(clamp(need + 18, 140, Math.min(280, w * 0.46)))

const TofX = (x) => { const [a, b] = W(); return a + (x / PW) * (b - a) }

// the lanes: bars per bin, or each report's mark in a short window

function renderLanes() {
  if (!layout) layout = laneLayout()

  const K = VALS.length
  const rows = layout.rows, rowOf = new Map()

  const svg = $('plot'), H = layout.h

  for (const r of rows) s += `<line class="rule" x1="0" x2="${PW}" y1="${r.y + r.h - 0.5}" y2="${r.y + r.h - 0.5}"/>`

// lane names: a click shows that lane alone (again shows every lane); a shift-click adds a lane to the lanes shown

// it pans; a plain wheel scrolls the lanes), a click on a bar zooms to its bin and a click on a mark opens its report;
// every zoom goes through the range selector
;(() => {
  const svg = $('plot'), brush = $('brush')
  let drag = null
  const xAt = (ev) => clamp(ev.clientX - svg.getBoundingClientRect().left, 0, PW)
  svg.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0 || ev.metaKey || ev.ctrlKey) return
    drag = { x: xAt(ev), moved: false, target: ev.target }
    svg.setPointerCapture(ev.pointerId)
  })
  svg.addEventListener('pointermove', (ev) => {
    if (drag) {
      const x = xAt(ev)
      if (!drag.moved && Math.abs(x - drag.x) < 4) return
      drag.moved = true
      hideTip()
      const l = Math.min(x, drag.x), r = Math.max(x, drag.x)
      brush.style.display = 'block'
      brush.style.left = G + l + 'px'
      brush.style.width = r - l + 'px'
      return
    }
    hover(ev)
  })
  svg.addEventListener('pointerup', (ev) => {
    if (!drag) return
    const d = drag
    drag = null
    brush.style.display = 'none'
    if (d.moved) {
      const x = xAt(ev), t1 = TofX(Math.min(x, d.x)), t2 = TofX(Math.max(x, d.x))
      return setWin([t1, Math.max(t2, t1 + MIN_SPAN)])
    }
    const mk = d.target.closest && d.target.closest('.mk')
    if (mk) return pick(C.r[+mk.dataset.i], true)
    const bar = d.target.closest && d.target.closest('.bar')
    if (bar && drawn && drawn.mode === 'bars') {
      const x = +bar.dataset.b.split(':')[1], t0 = drawn.first + x * drawn.B
      return setWin([t0, t0 + drawn.B])
    }
  })
  svg.addEventListener('pointerleave', () => { if (!drag) { hideTip(); setHot(null) } })
  svg.addEventListener('wheel', (ev) => {
    if (!D) return
    const unit = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? 400 : 1
    const dx = ev.deltaX * unit, dy = ev.deltaY * unit
    const zoom = ev.ctrlKey || ev.metaKey || ev.altKey
    if (!zoom && !ev.shiftKey && Math.abs(dx) <= Math.abs(dy)) return // the lanes scroll
    ev.preventDefault()
    const [a, b] = W()
    if (!zoom) {
      const d = ((ev.shiftKey && !dx ? dy : dx) / PW) * (b - a)
      const [ra, rb] = R(), sh = clamp(d, ra - a, rb - b)
      if (sh) setWin([a + sh, b + sh], true)
      return
    }
    zoomBy(Math.exp(dy * 0.0022), TofX(xAt(ev)), true)
  }, { passive: false })
})()
function zoomBy(f, at, quick) {
  const [a, b] = W(), [ra, rb] = R()
  const span = clamp((b - a) * f, MIN_SPAN, rb - ra)
  const p = (at - a) / (b - a)
  let na = at - p * span
  na = clamp(na, ra, rb - span)
  setWin([na, na + span], quick)
}
// the range set through the range selector, which tells the page (its onChange draws the lanes and the list)
function setWin(w) {
  const [ra, rb] = R()
  if (w) {
    let [a, b] = w
    a = Math.max(ra, a); b = Math.min(rb, b)
    if (b - a < MIN_SPAN) { const m = (a + b) / 2; a = Math.max(ra, m - MIN_SPAN / 2); b = a + MIN_SPAN }
    w = b - a >= rb - ra - 1 ? null : [a, b]
  }
  if (w) range.set(w[0], w[1])
  else range.set(null)
}

// hover: a bar's counts by category, or a mark's report
const tip = $('tip')
let hotRow = null
function setHot(j) {
  if (hotRow === j) return
  hotRow = j
  for (const el of $('gut').querySelectorAll('.lh')) el.classList.toggle('hot', el.dataset.row != null && +el.dataset.row === j)
}
function hideTip() { tip.style.display = 'none' }
function showTip(html, ev) {
  tip.innerHTML = html
  tip.style.display = 'block'
  tip.style.left = Math.max(4, Math.min(innerWidth - tip.offsetWidth - 8, ev.clientX + 12)) + 'px'
  tip.style.top = Math.max(4, Math.min(innerHeight - tip.offsetHeight - 8, ev.clientY + 14)) + 'px'
}
function hover(ev) {
  if (!drawn || !layout) return
  const y = ev.clientY - $('plot').getBoundingClientRect().top
  const j = layout.rows.findIndex((r) => y >= r.y && y < r.y + r.h)
  setHot(j < 0 ? null : j)
  const bar = ev.target.closest && ev.target.closest('.bar')
  if (bar && drawn.mode === 'bars') {
    const [jj, x] = bar.dataset.b.split(':').map(Number), r = drawn.rows[jj], t0 = drawn.first + x * drawn.B
    const nm = r.group ? `${r.group.length} smaller sources` : laneName(r.c)
    let rows = ''
    for (const k of ORD) { const c = drawn.binned[jj][x * drawn.K + k]; if (c) rows += `<div class="k"><span class="sw" style="--c:${catColour(k)}"></span>${esc(catName(k))}<span class="n">${fmt(c)}</span></div>` }
    return showTip(`<div class="h">${esc(nm)}</div><div class="w">${esc(drawn.B === DAY ? `${WEEKDAY[dt(t0).getUTCDay()]} ${dmy(t0)}` : spanWords(t0, t0 + drawn.B))}</div>${rows}`, ev)
  }
  const mk = ev.target.closest && ev.target.closest('.mk')
  if (mk) {
    const i = +mk.dataset.i
    let same = 0
    for (let q = lowerBound(T[i]); q < N && T[q] === T[i]; q++) if (C.lane[q] === C.lane[i] && passes(q)) same++
    return showTip(`<div class="h">${esc(laneName(C.lane[i]))}</div><div class="w">${dmy(T[i])} ${hms(T[i])} UTC</div>${colour.off ? '' : `<div class="k"><span class="sw" style="--c:${colourOf(i)}"></span>${esc(catName(VAL[i]))}</div>`}<div class="x">${esc(name('confidence', C.confidence[i]) || NO_CONF)} · ${esc(name('broad_class', C.broad_class[i]))}</div>${same > 1 ? `<div class="x">${same} reports in this lane at this second</div>` : ''}<div class="x">${esc(name('why_included', C.why_included[i]).slice(0, 160))}</div>`, ev)
  }
  hideTip()
}

// ---------------------------------------------------------------- the list: the range's reports in time order
// Each UTC day opens with its header, which names the day with its year and stays at the list's top while its reports
// scroll under it. A row gives its report's time, lane and the start of its report_id, then its broad_class and
// why_included: reports of the same lane and second often share all but their report_id. A click opens the report in
// place under its line (thimble.expand), its fields and what it can open, and again closes it. Each row's left edge is
// its value's color, and the list's two tracks show where each value's reports are (the Color by control's strip).
let listRows = [] // the column indices of the reports listed
let items = [] // what the list holds in order: a report's column index, or -1 - k for the header of days[k]
let days = [] // [{t0, n}] each day listed and its reports there
let tops = new Float64Array(1) // where each item starts, and the list's height after the last
let itemOf = new Int32Array(0) // a report's column index -> its item, -1 for none
let listReset = false // the range changed: the list starts again at its top, or at the open report
const DH = 28 // a day's header
let EXH = 260 // the open report's details, px: measured once they are drawn
const heightOf = (k) => (items[k] < 0 ? DH : C.r[items[k]] === S.sel ? RH + EXH : RH)
function computeList() {
  const [a, b] = W()
  listRows = []; items = []; days = []
  if (itemOf.length !== N) itemOf = new Int32Array(N)
  itemOf.fill(-1)
  let cur = null
  for (let i = lowerBound(a), z = lowerBound(b); i < z; i++) {
    if (!passes(i)) continue
    const d = Math.floor(T[i] / DAY)
    if (d !== cur) { days.push({ t0: d * DAY, n: 0 }); items.push(-days.length); cur = d }
    days[days.length - 1].n++
    itemOf[i] = items.length
    items.push(i)
    listRows.push(i)
  }
  layoutList()
  // the two tracks: each report's value in the list's order, a day's header about half a row; each report's ref for
  // the labels' ticks, and its time and first words for the preview
  const vals = [], refs = [], at = []
  for (const k of items) {
    if (k < 0) { vals.push(null); refs.push(null); at.push(-1); continue }
    const v = VON[VAL[k]] ? VALS[VAL[k]] : null
    vals.push(v, v); refs.push(refOf(k), null); at.push(k, k)
  }
  colour.strip('#list', { rows: vals, refs, preview: (q) => { const i = at[q]; return i == null || i < 0 ? '' : { when: `${dm(T[i])} ${hms(T[i])}`, text: `${laneName(C.lane[i])} · ${name('broad_class', C.broad_class[i])} · ${name('why_included', C.why_included[i])}` } } })
}
// where each item starts, the open report taller by its details
function layoutList() {
  tops = new Float64Array(items.length + 1)
  let y = 0
  for (let k = 0; k < items.length; k++) { tops[k] = y; y += heightOf(k) }
  tops[items.length] = y
}
function renderListHead() {
  $('listhead').innerHTML = `<span class="t"><span class="n">${fmt(listRows.length)}</span> ${listRows.length === 1 ? 'report' : 'reports'}</span>`
}
const dayWords = (t0) => `${WEEKDAY[dt(t0).getUTCDay()]} ${dmy(t0)}`
function dayHtml(k, top, anchored) {
  const d = days[k]
  const anchor = anchored ? UNIT(isoDay(d.t0), ` data-anchor-text="${dayWords(d.t0)}"`) : ''
  return `<div class="dh"${anchor} style="top:${top}px">${dayWords(d.t0)}<span class="n">${plural(d.n, 'report')}</span></div>`
}
function rowHtml(i, top) {
  const ref = refOf(i), sref = srcRefOf(i), lane = laneName(C.lane[i])
  const conf = name('confidence', C.confidence[i]) || NO_CONF, cls = name('broad_class', C.broad_class[i])
  const why = name('why_included', C.why_included[i]), id = idOf(i)
  const src = sref ? `<span class="src" data-anchor="${esc(sref)}" data-anchor-text="${esc(lane)}">${esc(lane)}</span>` : `<span class="src">${esc(lane)}</span>`
  const open = C.r[i] === S.sel
  return `<div class="row${open ? ' sel' : ''}" data-r="${C.r[i]}" data-anchor="${esc(ref)}" data-anchor-text="${esc(lane)} · ${dmy(T[i])} ${hms(T[i])} UTC · ${esc(conf)} · ${esc(cls)} · ${esc(why)}" style="top:${top}px${open ? `;height:${RH + EXH}px` : ''}"${colour.attr(i)}><div class="l1"><span class="tm">${hms(T[i])}</span>${src}<span class="rid" title="report_id">${esc(id)}</span></div><div class="l2"><span class="cl">${esc(cls)}</span> · ${esc(why)}</div>${open ? detailHtml(i) : ''}</div>`
}
function itemAt(y) { let lo = 0, hi = items.length; while (lo < hi) { const m = (lo + hi) >> 1; if (tops[m + 1] <= y) lo = m + 1; else hi = m } return lo }
function renderList() {
  const box = $('list'), rows = $('rows'), stick = $('stick')
  if (!items.length) { rows.innerHTML = `<div class="empty">No report passes these filters in this range</div>`; rows.style.height = 'auto'; stick.style.display = 'none'; return }
  rows.style.height = tops[items.length] + 'px'
  const top = box.scrollTop, hgt = box.clientHeight
  let h = ''
  for (let k = itemAt(Math.max(0, top - 300)); k < items.length && tops[k] < top + hgt + 300; k++) {
    h += items[k] < 0 ? dayHtml(-items[k] - 1, tops[k], true) : rowHtml(items[k], tops[k])
  }
  rows.innerHTML = h
  // the open report's details, measured: its row takes their height
  const ex = rows.querySelector('.row.sel .thimble-details')
  if (ex) {
    const need = Math.ceil(ex.offsetHeight) + 4
    if (Math.abs(need - EXH) > 1) { EXH = need; layoutList(); rows.style.height = tops[items.length] + 'px'; return renderList() }
  }
  // the day of the item at the top, while its header is scrolled away
  let k = itemAt(top + 1)
  while (k > 0 && items[k] >= 0) k--
  const show = items[k] < 0 && tops[k] < top
  stick.style.display = show ? 'block' : 'none'
  if (show) stick.innerHTML = dayHtml(-items[k] - 1, 0, false)
}
$('list').addEventListener('scroll', () => requestAnimationFrame(renderList), { passive: true })
// a click on a row opens its report in place under its line, the row kept under the pointer; again closes it. A click
// inside the details works their buttons.
$('rows').addEventListener('click', (ev) => {
  if (ev.metaKey || ev.ctrlKey) return
  const r = ev.target.closest('.row')
  if (!r) return
  if (ev.target.closest('.thimble-details')) return detailClick(ev)
  const row = +r.dataset.r
  thimble.expand(r, () => toggleOpen(row), { find: () => $('rows').querySelector(`.row[data-r="${row}"]`) })
})
function listTopOf(i) { const k = i >= 0 && i < itemOf.length ? itemOf[i] : -1; return k < 0 ? -1 : tops[k] }
function scrollListTo(i, centre) {
  const y = listTopOf(i)
  if (y < 0) return
  const box = $('list')
  // centred in what the list shows below the day's header that stays at its top
  if (centre || y < box.scrollTop + DH || y + RH > box.scrollTop + box.clientHeight) box.scrollTop = Math.max(0, y - (box.clientHeight + DH) / 2 + RH / 2)
  renderList()
}

// ---------------------------------------------------------------- a report opened in place
function detailHtml(i) {
  const d = S.detail && S.detail.row === S.sel ? S.detail : null
  const conf = name('confidence', C.confidence[i]) || NO_CONF
  const tag = (t) => `<span class="chip chip-tone-neutral">${esc(t)}</span>`
  const tags = `${tag(conf)}${tag(name('disposition', C.disposition[i]))}${name('catalog', C.catalog[i]) === 'supplemental' ? tag('supplemental catalog') : ''}`
  const when = `${WEEKDAY[dt(T[i]).getUTCDay()]} ${dmy(T[i])} · ${hms(T[i])} UTC`
  let body = '<div class="det-sec empty">Reading the report</div>'
  if (d) {
    const s = d.source
    const src = s ? `<div class="det-sec srcbox" data-anchor="${esc(s.ref)}" data-anchor-text="${esc(s.data_source)}"><dl class="facts"><dt>data_source</dt><dd>${esc(s.data_source)}</dd><dt>source_basis</dt><dd class="mono">${esc(s.source_basis || '—')}</dd><dt>matched_sources</dt><dd>${esc(s.matched_sources || '—')}</dd></dl></div>` : ''
    const marks = (d.marks || []).length ? `<div class="det-sec"><div class="h">Labels</div><div class="marks">${d.marks.map((m) => { const l = (labelState.all || labelState.labels || []).find((x) => x.name === m.label); return `<span class="chip chip-key" data-label="${esc(l ? l.id : '')}" style="--c:${esc(m.colour)}"><span class="chip-sw"></span><span class="chip-text">${esc(m.label === m.value ? m.label : `${m.label}: ${m.value}`)}</span></span>` }).join('')}</div></div>` : ''
    body = `<div class="det-sec"><div class="h">why_included</div><p class="det-why">${esc(d.why_included || '')}</p></div>${src}${marks}<div class="det-sec"><div class="kv"><div class="k">report_id</div><div class="v">${esc(d.report_id || '')}</div></div><div class="kv"><div class="k">report_date_utc</div><div class="v">${esc(d.report_date_utc || '')}</div></div><div class="kv"><div class="k">report_url</div><div class="url"><a href="${esc(d.report_url || '')}" data-url title="${esc(d.report_url || '')}, an outside page: a click copies it">${esc(d.report_url || '')}</a><button class="btn btn-ghost btn-sm ib" type="button" data-copy title="Copy the address" aria-label="Copy the address">${ico('copy')}</button></div></div></div>`
  }
  return `<div class="thimble-details" data-thimble-chrome><div class="det-tags">${tags}</div><div class="det-when">${when}</div>${body}<div class="det-acts"><button class="btn btn-secondary btn-sm" type="button" data-near>${ico('zoom')}The hour around it</button><button class="btn btn-secondary btn-sm" type="button" data-file>${ico('file')}Its row in the file</button></div></div>`
}
function detailClick(ev) {
  const b = ev.target.closest('button, a')
  if (!b) return
  const i = rowAt.get(S.sel)
  if (b.dataset.file != null && i != null) return thimble.navigate(refOf(i), { browser: true })
  if (b.dataset.near != null && i != null) { const m = Math.floor(T[i] / 60) * 60; return setWin([m - 1800, m + 1800]) }
  if (b.dataset.url != null || b.dataset.copy != null) {
    ev.preventDefault()
    const a = b.closest('.thimble-details').querySelector('[data-url]')
    if (!a) return
    const rg = document.createRange(); rg.selectNodeContents(a)
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg)
    let ok = false
    try { ok = document.execCommand('copy') } catch { ok = false }
    if (b.dataset.copy != null) { b.title = ok ? 'Copied' : 'Selected: press ⌘C to copy'; b.innerHTML = ico(ok ? 'check' : 'copy') }
  }
}
// the report of reader row r opened in place, or closed when it was open; its details fetched, then drawn in its row
function toggleOpen(r) {
  if (S.sel === r) { S.sel = null; S.detail = null; layoutList(); return renderList() }
  S.sel = r
  S.detail = null
  layoutList()
  renderList()
  fetchDetail(r)
}
async function fetchDetail(r) {
  let d = null
  try { d = await thimble.fetch({ op: 'report', r, ...(S.keep != null ? { keep: [S.keep] } : {}) }, { key: 'report' }) } catch (e) { if (e && e.name === 'AbortError') return; throw e }
  if (S.sel !== r) return
  S.detail = d
  const el = $('rows').querySelector(`.row[data-r="${r}"]`)
  if (el) thimble.expand(el, () => renderList(), { find: () => $('rows').querySelector(`.row[data-r="${r}"]`) })
  else renderList()
}
// a report picked in the lanes or by a citation: opened in place, in the range and the filters that would drop it
// cleared, the list scrolled to it
async function pick(r) {
  const i = rowAt.get(r)
  if (i == null) return
  S.sel = r
  S.detail = null
  if (!passes(i)) clearFilters()
  if (!(T[i] >= W()[0] && T[i] < W()[1])) range.set(null)
  render()
  scrollListTo(i, true)
  await fetchDetail(r)
  scrollListTo(i)
}

// ---------------------------------------------------------------- render
let frame = null
function schedule() { if (frame == null) frame = requestAnimationFrame(() => { frame = null; draw() }) }
function draw() {
  if (!D) return
  chipCounts()
  layout = laneLayout()
  sizes()
  renderAxis(); renderLanes()
  computeList(); renderListHead()
  if (listReset) {
    listReset = false
    const y = S.sel != null && rowAt.has(S.sel) ? listTopOf(rowAt.get(S.sel)) : -1
    const box = $('list')
    box.scrollTop = y >= 0 ? Math.max(0, y - (box.clientHeight + DH) / 2 + RH / 2) : 0
  }
  renderList()
}
function render() {
  if (!D) return
  renderCtl(); overview(); draw()
  if (S.sel != null && rowAt.has(S.sel) && listTopOf(rowAt.get(S.sel)) >= 0) scrollListTo(rowAt.get(S.sel))
}
// a change of what is in scope starts the list again at its top
function rescope() { $('list').scrollTop = 0; render(); if (openPop && openPop.relabel) openPop.relabel() }
// the control row is drawn before the reports arrive, so the page has its controls while it loads
$('f-lane').innerHTML = `Data source${ico('down')}`
$('f-lane').onclick = (ev) => {
  if (ev.target.closest('[data-clear]')) { close(); S.lanes.clear(); return rescope() }
  laneMenu()
}
let typing = null
$('q').addEventListener('input', (e) => {
  clearTimeout(typing)
  typing = setTimeout(async () => {
    const q = e.target.value.trim()
    S.q = q
    if (!q) {
      S.found = null
      if (searchWin !== undefined) { const w = searchWin; searchWin = undefined; range.set(w[0], w[1]) }
    } else {
      let res
      try { res = await thimble.fetch({ op: 'search', q }, { key: 'search' }) } catch (err) { if (err && err.name === 'AbortError') return; throw err }
      if (S.q !== q) return
      S.found = new Set(res.rows)
      // a search whose hits all lie outside the range shows the whole span; one with no hit keeps the range
      const inside = (w) => res.rows.some((r) => { const i = rowAt.get(r); return i != null && T[i] >= w[0] && T[i] < w[1] })
      if (res.rows.length && !isWhole() && !inside(W())) { const w = [range.from, range.to]; range.set(null); searchWin = w }
    }
    rescope()
  }, 220)
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (openPop) return close()
    if (S.sel != null) { S.sel = null; S.detail = null; return render() }
  }
})
// the gutter is measured in the page's faces, so it is laid out again once they have loaded
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (D) render() })
let resizeTimer = null
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 100) })

// ---------------------------------------------------------------- places
// A report opens in place in the list, its lane in view and the filters that would drop it cleared; a lane shows alone;
// a day or a window opens zoomed to it; a lane within a day or a window shows alone and zoomed.
function clearFilters() { S.lanes.clear(); S.found = null; S.q = ''; searchWin = undefined; $('q').value = '' }
async function openPlace(t) {
  if (t.r != null) return pick(t.r)
  if (t.lane != null || t.from != null) {
    clearFilters()
    if (t.lane != null) S.lanes = new Set([t.lane])
    if (t.from != null) { render(); setWin([t.from, t.to]); return }
    range.set(null)
  }
  render()
}
thimble.onOpen(async (place) => {
  const t = (place && place.target) || {}
  if (t.r != null) S.keep = t.r
  if (!D || (t.r != null && !rowAt.has(t.r))) { if (!(await load())) return }
  await openPlace(t)
})
thimble.onLabels(async (state) => {
  const was = JSON.stringify([labelState.labels, labelState.filter])
  labelState = { labels: state.labels || [], filter: state.filter || null, all: state.all || null, palette: state.palette || null }
  if (!D) return
  if (openPop && openPop.relabel) openPop.relabel()
  if (JSON.stringify([labelState.labels, labelState.filter]) === was) { renderCtl(); return draw() }
  if (!(await load())) return
  if (S.sel != null && !rowAt.has(S.sel)) { S.sel = null; S.detail = null }
  render()
  if (S.sel != null) fetchDetail(S.sel)
})
</script>
</body>
</html>
