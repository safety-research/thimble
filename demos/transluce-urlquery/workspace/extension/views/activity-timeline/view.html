<!doctype html>
<html>
<head>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-card); overflow: hidden; }
  * { box-sizing: border-box; }
  #view { height: 100%; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 12px 16px 10px; border-bottom: 1px solid var(--border-subtle); }
  #search { flex: 0 1 240px; min-width: 180px; }
  #color { min-width: min(300px, 100%); max-width: 100%; }
  #overview { flex: none; max-height: 52%; overflow: hidden auto; }
  .time { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 180px minmax(0, 1fr); padding: 8px 16px 0; background: var(--surface-card); }
  #read { flex-direction: row; gap: 10px; margin-bottom: 4px; }
  #key { align-self: center; }
  #lanes { padding: 2px 16px 8px; }
  #body { flex: 1; min-height: 0; border-top: 1px solid var(--border-hairline); }
  .listbox { display: flex; flex-direction: column; min-height: 0; }
  .lhead { flex: none; display: flex; align-items: baseline; gap: 8px; min-width: 0; padding: 8px 16px 4px; }
  .lhead b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 var(--text-sm) / 1.4 var(--font-body); }
  .lhead span { flex: none; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); font-variant-numeric: tabular-nums; }
  .lhead .btn { flex: none; margin-left: auto; }
  #list { flex: 1; min-height: 0; }
  .rep .why { margin: 0 0 10px; }
  .rep .acts { display: flex; gap: 8px; margin: 0 0 12px; }
  .rep h4 { margin: 14px 0 4px; font: 500 var(--text-xs) / 1.4 var(--font-body); }
  .rep .list-row { gap: 10px; min-width: 0; cursor: pointer; }
  .rep .list-row > * { flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 var(--text-xs) / 1.6 var(--font-body); }
  .rep .list-row .file { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.6 var(--font-mono); }
  .rep .list-row .text { flex: 1; min-width: 0; font-family: var(--font-mono); }
  .rep .rec { margin-top: 12px; }
</style>
</head>
<body>
<div id="view">
  <div class="top">
    <span id="search"></span>
    <span id="filter"></span>
    <span id="rows"></span>
    <span id="color"></span>
  </div>
  <div id="overview">
    <div class="time">
      <div></div><div id="read"></div>
      <div></div><div id="range"></div>
      <div id="key"></div><div id="axis"></div>
    </div>
    <div id="lanes"></div>
  </div>
  <div id="body">
    <div class="listbox">
      <div class="lhead" id="lhead" data-thimble-chrome></div>
      <div id="list"></div>
    </div>
  </div>
</div>
<script>
// Activity Timeline: every URLQuery report on one UTC time axis, a lane per data source (Rows), colored by confidence
// (Color by). The viewfinder picks the time the lanes and the table show; wide ranges draw each lane as bars of
// reports per bin, narrow ones each report as its own mark. A report opens in the side panel.
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const $ = (id) => document.getElementById(id)
const CODED = ['source', 'confidence', 'disposition', 'broad_class', 'source_basis', 'matched_sources', 'catalog', 'why']
const MARKS = 4000 // reports in the range above which the lanes draw bars per bin
let E = [], span = null, shown = [], picked = null, open = null, keep = [], narrowTo = null
let busy = false, seq = 0, markLoaded, NAMES = null, FILES = []
const loaded = new Promise((ok) => (markLoaded = ok))

async function start() {
  const meta = await thimble.fetch({ op: 'meta' }, { key: 'meta' })
  NAMES = meta.names
  FILES = meta.files
  const FIELDS = [
    {
      name: 'confidence', title: 'Confidence', description: 'The qualitative confidence in agent-like activity, blank outside the included reports',
      values: [
        { name: 'significant', color: 2, meaning: 'Higher qualitative confidence in agent-like activity' },
        { name: 'suggestive', color: 1, meaning: 'Moderate qualitative confidence in agent-like activity' },
      ],
    },
    {
      name: 'source', title: 'Data source', values: meta.order,
      description: "The report's data_source in report-sources.csv; Review required or Background control for a report with no source row",
    },
    {
      name: 'disposition', title: 'Disposition', description: 'Whether the report is included, needs review, or is a background control',
      values: ['included', 'review_required', 'background'],
      meanings: { included: 'An included report', review_required: 'A candidate whose relation to an agent-like workflow needs review', background: 'A background control' },
    },
    { name: 'broad_class', title: 'Broad class', description: "The report's primary method class" },
    { name: 'source_basis', title: 'Source basis', description: 'How the data source was assigned, in report-sources.csv' },
    {
      name: 'catalog', title: 'Catalog', description: 'Whether additional-cited-reports.csv, the supplement, lists the report',
      values: ['main', 'supplement'], meanings: { main: 'Only in the main catalog', supplement: 'Listed in additional-cited-reports.csv' },
    },
  ]
  window.search = thimble.search({ mount: '#search', in: '#body', placeholder: 'Search reports', onChange: () => load() })
  window.color = thimble.colorBy({ mount: '#color', fields: FIELDS, initial: 'confidence', onChange: load })
  window.filter = thimble.filterBy({ mount: '#filter', fields: FIELDS, onChange: load })
  window.rows = thimble.rows({ mount: '#rows', fields: FIELDS, initial: 'source', onChange: () => { pick(null); load() } })
  window.range = thimble.timeRange({ mount: '#range', readout: '#read', gap: 30 * 86400, onChange: draw, onInput: drawLanes })
  window.painted = { keeps: () => true, valueOf: (e) => e.value, colorOf: (v) => color.colorOf(v), attr: (e) => color.attr(e) }
  window.lanes = thimble.timeline({
    mount: '#lanes', keyMount: '#key', rows, range, color: painted, names: 180, follow: '#list',
    density: () => inRange > MARKS,
    tip: (e) => `${e.confidence || e.disposition.replace('_', ' ')} · ${e.source} · ${e.broad_class.replace('_', ' ')} · ${e.id}`,
    onPick: (lane) => pick(picked && picked.key === lane.key ? null : lane),
    onMark: (e) => show(e.r, true),
  })
  window.side = thimble.side({ mount: '#body', empty: 'Click a report', onClose: () => { open = null } })
  window.table = thimble.table({
    mount: '#list', side, search, color: painted,
    columns: [
      { name: 't', title: 'Time (UTC)', type: 'time', drop: false, days: true },
      { name: 'source', title: 'Data source', width: 170, min: 120, drop: 1 },
      { name: 'confidence', title: 'Confidence', width: 92, min: 92, drop: 2 },
      { name: 'broad_class', title: 'Class', width: 116, min: 116, drop: 3 },
      { name: 'id', title: 'Report', width: 290, min: 290, drop: 4 },
      { name: 'why', title: 'Why included' },
    ],
    details: (e) => ({ title: e.source, sub: `${range.format(e.t, 1)} · ${e.disposition.replace('_', ' ')}${e.confidence ? ' · ' + e.confidence : ''}`, render: (body) => details(body, e) }),
    onOpen: (e) => { open = e.r; reset.check() },
  })
  thimble.divider({ top: '#overview' })
  window.reset = thimble.onReset({ changed: () => picked != null, reset: () => { pick(null); keep = []; load() } })
  let labelFilter = null
  thimble.onLabels((s) => { const f = JSON.stringify(s.filter || null); if (f !== labelFilter) { labelFilter = f; load() } })
  const moved = (id, e, v) => {
    const m = id && thimble.markOf(e.ref)
    const got = m && (m.values || []).find((x) => x.id === id)
    return !!m && (got ? String(got.value) : null) !== (v ?? null)
  }
  let later = null
  thimble.onMarks(() => {
    if ((color.label || rows.label) && shown.some((e) => moved(color.label, e, e.value) || moved(rows.label, e, e.group))) { clearTimeout(later); later = setTimeout(load, 300) }
  })
  addEventListener('resize', draw)
  await load()
}

let inRange = 0

async function load() {
  const my = ++seq
  const query = { op: 'overview', color: color.query(), filter: filter.query(), rows: rows.query(), q: search.text.trim(), keep }
  const cols = {}, counts = {}, fcounts = {}
  let from = 0
  busy = true
  head()
  try {
    do {
      const page = await thimble.fetch({ ...query, from }, { key: 'reports' })
      if (my !== seq) return
      if (page.span) span = page.span
      for (const k in page.cols) (cols[k] = cols[k] || []).push(...page.cols[k])
      for (const k in page.counts) counts[k] = (counts[k] || 0) + page.counts[k]
      for (const k in page.fcounts) fcounts[k] = (fcounts[k] || 0) + page.fcounts[k]
      from = page.next
    } while (from != null)
  } catch (e) {
    if (e.name === 'AbortError') return
    throw e
  } finally {
    if (my === seq) busy = false
  }
  const n = (cols.r || []).length
  E = new Array(n)
  for (let i = 0; i < n; i++) {
    const e = { r: cols.r[i], t: cols.t[i], id: cols.id[i], ref: `${FILES[cols.f[i]]}#L${cols.n[i]}`, value: cols.value[i], group: cols.group[i] }
    for (const k of CODED) e[k] = NAMES[k][cols[k][i]] || ''
    E[i] = e
  }
  color.counts(counts)
  filter.counts(fcounts)
  const pad = Math.max(3600, (span[1] - span[0]) * 0.005)
  range.data({ times: E.map((e) => e.t), values: E.map((e) => e.value), span: [span[0] - pad, span[1] + pad] })
  markLoaded()
  if (narrowTo != null && filter.field === 'source') narrowNow()
  draw()
  if (!opened) {
    opened = true
    const first = shown.find((e) => e.confidence === 'significant') || shown[0]
    if (first && open == null) table.open(first.ref)
  }
}
let opened = false

function drawLanes() {
  if (!span || !NAMES) return
  thimble.timeAxis('#axis', range.scale($('axis').clientWidth))
  inRange = 0
  for (const e of E) if (range.has(e.t)) inRange++
  lanes.draw(E)
}

function draw() {
  if (!span || !NAMES) return
  drawLanes()
  drawList()
}

function drawList() {
  const inLane = (e) => !picked || (rows.groupOf(e) ?? null) === picked.value
  shown = E.filter((e) => range.has(e.t) && inLane(e))
  table.draw(shown)
  if (!busy) search.kept(search.text.trim() ? shown.filter((e) => !keep.includes(e.r)).map((e) => e.ref) : null)
  head()
}

function head() {
  const what = picked ? `${rows.by ? rows.by.title + ': ' : ''}${picked.name}` : 'In the range'
  const when = shown.length ? `${range.format(shown[0].t, 60)} – ${range.format(shown[shown.length - 1].t, 60)}` : ''
  $('lhead').innerHTML = `<b>${esc(what)}</b>${when ? `<span>${esc(when)}</span>` : ''}<span>${span ? `${shown.length.toLocaleString()} ${shown.length === 1 ? 'report' : 'reports'}` : ''}${busy ? ' · loading…' : ''}</span>` +
    (picked ? '<button class="btn btn-ghost btn-sm" type="button" data-all>Every lane</button>' : '')
}

function pick(lane) {
  picked = lane ? { key: lane.key, value: lane.value, name: lane.name } : null
  if (window.lanes) lanes.choose(picked ? picked.key : null)
  if (span) drawList()
  if (window.reset) reset.check()
}

async function show(r, keys) {
  if (!E.some((e) => e.r === r)) { keep = [r]; await load() }
  const e = E.find((x) => x.r === r)
  if (!e) return
  if (!range.has(e.t)) {
    const w = Math.min(range.to - range.from, 7 * 86400)
    range.set(e.t - w / 2, e.t + w / 2)
  }
  if (picked && (rows.groupOf(e) ?? null) !== picked.value) pick(null)
  drawList()
  table.open(e.ref)
  if (keys) $('list').focus({ preventScroll: true })
}

const FILE_WORDS = { 'all-reports.csv': 'Catalog row', 'additional-cited-reports.csv': 'Supplement row', 'report-sources.csv': 'Source row' }
const ORDER = ['report_id', 'report_date_utc', 'disposition', 'confidence', 'broad_class', 'why_included', 'data_source', 'source_basis', 'matched_sources', 'timestamp_precision', 'caveat', 'report_url']

async function details(body, e) {
  body.innerHTML = '<div class="rep"></div>'
  let d
  try {
    d = await thimble.fetch({ op: 'record', r: e.r }, { key: 'record' })
  } catch (err) {
    if (err.name === 'AbortError') return
    throw err
  }
  if (open !== e.r || !d || !body.isConnected) return
  const f = d.fields
  const url = f.report_url || ''
  const value = {}
  for (const k of ORDER) if (f[k] != null && f[k] !== '') value[k] = f[k]
  value.catalog = d.vals.catalog || ''
  const box = body.firstElementChild
  box.innerHTML = `<div class="why" data-anchor="${esc(d.ref)}"></div>` +
    (url ? `<div class="acts"><a class="btn btn-secondary btn-sm" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open on urlquery.net</a></div>` : '') +
    `<h4 data-thimble-chrome>Rows</h4>` +
    d.lines.map((l) => `<div class="list-row" data-go="${esc(l.ref)}" data-anchor="${esc(l.ref)}" title="${esc(l.ref)}"><span class="file">${esc(FILE_WORDS[l.file] || l.file)} · L${l.line}</span><span class="text">${esc(l.text)}</span></div>`).join('') +
    '<div class="rec"></div>'
  thimble.text(box.querySelector('.why'), f.why_included || d.vals.why || '', { format: 'plain' })
  thimble.record({ mount: box.querySelector('.rec'), value, ref: d.ref, find: search.text.trim() || undefined, color: { attr: () => painted.attr(e) } })
}

$('body').addEventListener('click', (ev) => {
  const go = ev.target.closest('[data-go]')
  if (go && !ev.metaKey && !ev.ctrlKey && !ev.altKey) thimble.navigate(go.dataset.go, { browser: true })
})
$('lhead').addEventListener('click', (ev) => { if (ev.target.closest('[data-all]')) pick(null) })

function narrow(source) {
  narrowTo = source
  if (filter.field === 'source') narrowNow()
  else filter.choose('source')
}
function narrowNow() {
  const want = narrowTo
  narrowTo = null
  for (const v of filter.values) if ((v.value === want) !== v.on) filter.toggle(v.value)
}

thimble.onOpen(async (place) => {
  const t = (place && place.target) || {}
  await loaded
  if (t.r != null) return show(t.r)
  if (t.source) return narrow(t.source)
  if (t.from != null && t.to != null) range.set(t.from, t.to)
})
start()
</script>
</body>
</html>
