<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .chip, .btn, .seg), its Colour by control and the theme's tokens come with the frame; this
     page lays out the control row, the timeline (its header, the context strip, the axis and the lanes) and the side
     column (a report's details over the list of the reports in view) */
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--surface-card); color: var(--text-primary); font: 400 var(--text-ui-sm) / 1.4 var(--font-body); font-variant-numeric: tabular-nums; }
  button { font: inherit; }
  .ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  #ctl { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; padding: 9px 14px; border-bottom: 1px solid var(--border-hairline); }
  .search { position: relative; flex: 0 1 170px; min-width: 110px; }
  .search .field { width: 100%; padding-left: 27px; }
  .search .ico { position: absolute; left: 8px; top: 50%; margin-top: -7px; color: var(--text-tertiary); pointer-events: none; }
  .fbtn { flex: none; padding: 0 7px 0 9px; }
  .fbtn .ico { width: 12px; height: 12px; color: var(--text-tertiary); }
  .fbtn .v { font-weight: 500; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .fbtn .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .fbtn .sws { display: inline-flex; gap: 2px; }
  #chips { display: contents; }
  /* the Colour by control takes the row's free width, and a line of its own when less than its least is left */
  #colour { flex: 1 1 320px; min-width: 260px; margin-left: 4px; }
  #chips .chip { max-width: 240px; }
  .chip .ico { width: 10px; height: 10px; }
  #top { flex: none; display: flex; align-items: stretch; }
  #legend { flex: none; width: var(--gut); box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; padding: 0 10px 3px 0; min-height: 54px; }
  #topr { flex: none; display: flex; flex-direction: column; justify-content: space-between; }
  .lg-scale { margin-top: 2px; color: var(--text-tertiary); font-size: var(--text-2xs); line-height: 13px; }
  .sw { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }

  #main { flex: 1; min-height: 0; display: flex; }
  #tl { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 0 0 0 14px; }
  #side { order: 2; flex: none; width: clamp(266px, 29vw, 420px); min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--border-hairline); }

  #tlhead { flex: none; display: flex; align-items: center; gap: 8px; height: 40px; padding-right: 10px; }
  #win { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1; }
  #win .w { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 var(--text-ui-sm) / 1.2 var(--font-body); margin-right: 4px; }
  .ib { flex: none; width: 24px; padding: 0; }
  #range { flex: none; }

  svg { display: block; overflow: visible; user-select: none; -webkit-user-select: none; }
  svg text { font: 400 10.5px var(--font-mono); fill: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  svg text.strong { fill: var(--text-secondary); }
  svg .grid { stroke: var(--border-hairline); }
  svg .major { stroke: rgba(var(--ink-rgb), 0.16); }
  svg .rule { stroke: rgba(var(--ink-rgb), 0.07); }
  #ctx { height: 36px; cursor: crosshair; }
  #axis { height: 18px; }
  #ctx .winbox { fill: none; stroke: var(--text-primary); stroke-width: 1.5; }
  #ctx .shade { fill: var(--surface-card); opacity: 0.72; }

  #lanes { position: relative; flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding-bottom: 8px; scrollbar-width: thin; }
  #lanebox { position: relative; display: flex; }
  #gut { position: relative; flex: none; width: var(--gut); }
  #plot { flex: none; cursor: crosshair; }
  .lh { position: absolute; left: 0; right: 10px; display: flex; align-items: center; gap: 6px; box-sizing: border-box; padding-left: 6px; margin-left: -6px; border-radius: 3px; }
  .lh { cursor: pointer; }
  .lh .ln { flex: 1; min-width: 0; align-self: stretch; padding: 0; border: 0; background: none; color: var(--text-primary); font: 400 var(--text-xs) / 1.2 var(--font-body); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .lh:hover .ln { text-decoration: underline; text-underline-offset: 2px; }
  .lh .n { flex: none; color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .lh .n .of { color: var(--text-tertiary); }
  .lh.zero .ln { color: var(--text-tertiary); }
  .lh.iso .ln { font-weight: 500; }
  .lh.grp .ln { color: var(--text-secondary); }
  .lh.hot { background: var(--surface-hover); }
  .lh.small .ln, .lh.small .n { font-size: 10.5px; }
  /* the open lane: taller, its reports in the list beside */
  .lh.open { align-items: flex-start; padding-top: 3px; background: rgba(var(--ink-rgb), 0.035); }
  .lh.open .ln { align-self: auto; font-weight: 500; }
  #plot .openbg { fill: rgba(var(--ink-rgb), 0.035); }
  #plot text.ymax { fill: var(--text-tertiary); }
  #brush { position: absolute; top: 0; bottom: 0; display: none; background: rgba(var(--ink-rgb), 0.07); border-left: 1px solid var(--text-secondary); border-right: 1px solid var(--text-secondary); pointer-events: none; }

  /* the open report takes the height it needs; past what leaves the list a few rows, it scrolls */
  #detail { flex: 0 1 auto; min-height: 0; max-height: 50%; overflow-y: auto; border-bottom: 1px solid var(--border-hairline); scrollbar-width: thin; }
  #detail:empty { display: none; }
  .det { position: relative; padding: 12px 14px 14px 14px; }
  .det-top { display: flex; align-items: flex-start; gap: 8px; }
  .det-top h2 { flex: 1; min-width: 0; margin: 0; font: 500 var(--text-lg) / 1.3 var(--font-body); overflow-wrap: anywhere; }
  .det-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; }
  .det-when { margin-top: 6px; font: 400 var(--text-mono) / 1.4 var(--font-mono); color: var(--text-secondary); }
  .det-sec { margin-top: 10px; }
  .det-sec > .h { margin-bottom: 3px; font: 500 var(--text-xs) / 1.3 var(--font-body); color: var(--text-tertiary); }
  .det-why { margin: 0; font: 400 var(--text-sm) / 1.5 var(--font-body); overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; }
  .facts dt { color: var(--text-tertiary); font-size: var(--text-xs); line-height: 1.5; }
  .facts dd { margin: 0; min-width: 0; font-size: var(--text-ui-sm); line-height: 1.45; overflow-wrap: anywhere; }
  .facts dd.mono { font: 400 var(--text-mono-sm) / 1.6 var(--font-mono); }
  .srcbox { padding: 6px 0 6px 8px; margin-left: -8px; border-radius: var(--radius-ui); }
  .kv { margin-top: 6px; }
  .kv .k { color: var(--text-tertiary); font-size: var(--text-xs); line-height: 1.4; }
  .kv .v { font: 400 10.5px / 1.5 var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .url { display: flex; align-items: flex-start; gap: 4px; min-width: 0; }
  .url a { flex: 1; min-width: 0; color: var(--text-primary); font: 400 10.5px / 1.5 var(--font-mono); overflow-wrap: anywhere; text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), 0.4); text-underline-offset: 2px; cursor: pointer; }
  .url a .ico { width: 11px; height: 11px; margin-left: 3px; vertical-align: -1px; }
  .url .ib { margin-top: -3px; }
  .det-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .det-acts .ico { width: 13px; height: 13px; }
  .caveat { margin: 10px 0 0; color: var(--text-tertiary); font-size: var(--text-2xs); line-height: 1.45; }
  .marks { display: flex; flex-wrap: wrap; gap: 4px; }

  #listhead { flex: none; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--border-hairline); }
  #listhead .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 var(--text-ui-sm) / 1 var(--font-body); }
  #listhead .t .n { font-family: var(--font-mono); font-size: var(--text-mono); }
  #listhead .t .s { color: var(--text-tertiary); font-weight: 400; }
  #listwrap { position: relative; flex: 1 1 150px; min-height: 150px; }
  #list { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: thin; }
  .dh { position: absolute; left: 0; right: 0; box-sizing: border-box; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 14px; border-bottom: 1px solid var(--border-subtle); background: var(--surface-card); font: 500 var(--text-xs) / 1 var(--font-body); }
  .dh .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  #stick { position: absolute; left: 0; right: 10px; top: 0; height: 28px; display: none; }
  #stick .dh { right: 0; box-shadow: 0 6px 8px -8px rgba(var(--ink-rgb), 0.3); }
  #rows { position: relative; }
  .row { position: absolute; left: 0; right: 0; box-sizing: border-box; height: 46px; padding: 6px 12px 0 14px; border-bottom: 1px solid var(--border-hairline); cursor: pointer; }
  .row:hover { background: var(--surface-hover); }
  .row.sel { background: var(--surface-selected); }
  .row.sel::after { content: ''; position: absolute; inset: 0; border: 1.5px solid var(--text-primary); border-radius: 2px; pointer-events: none; }
  .row .l1 { display: flex; align-items: center; gap: 7px; min-width: 0; height: 18px; }
  .row .tm { flex: none; color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .row .src { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-xs); }
  .row .rid { flex: none; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .row .l2 { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-tertiary); font-size: var(--text-xs); }
  .row .l2 .cl { color: var(--text-secondary); }
  .empty { padding: 26px 14px; color: var(--text-tertiary); font-size: var(--text-xs); }
  #gut .empty { padding: 20px 0; white-space: nowrap; }

  .pop { position: fixed; z-index: 60; min-width: 200px; max-width: 320px; max-height: 72vh; overflow: auto; padding: 4px; border-radius: var(--radius-ui); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), 0.14); font: 400 var(--text-ui-sm) / 1.3 var(--font-body); }
  .pop .head { padding: 8px 8px 4px; font: 500 var(--text-xs) / 1 var(--font-body); color: var(--text-tertiary); }
  .pop .head .n { margin-left: 6px; font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .pop.more { display: flex; width: min(560px, calc(100vw - 12px)); max-width: none; height: min(500px, calc(100vh - 60px)); max-height: none; overflow: hidden; padding: 0; }
  .more-grid { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .more-grid .col { min-height: 0; overflow-y: auto; padding: 4px; scrollbar-width: thin; }
  .more-grid .col.src { display: flex; flex-direction: column; overflow: hidden; border-left: 1px solid var(--border-hairline); }
  /* a box that scrolls shows a shadow at the edge it can scroll past */
  .scrolls { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin;
    background: linear-gradient(var(--raised-bg) 30%, transparent) top / 100% 28px no-repeat local,
      linear-gradient(transparent, var(--raised-bg) 70%) bottom / 100% 28px no-repeat local,
      radial-gradient(farthest-side at 50% 0, rgba(var(--ink-rgb), 0.16), transparent) top / 100% 10px no-repeat scroll,
      radial-gradient(farthest-side at 50% 100%, rgba(var(--ink-rgb), 0.16), transparent) bottom / 100% 10px no-repeat scroll; }
  .pop .sep { height: 1px; margin: 4px 0; background: var(--border-hairline); }
  .pop .note { padding: 4px 8px 6px; color: var(--text-tertiary); }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: none; color: var(--text-primary); font: inherit; text-align: left; cursor: pointer; }
  .item:hover { background: var(--surface-hover); }
  .item:disabled { cursor: default; }
  .item .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .lab.none { color: var(--text-tertiary); }
  .item .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .box { display: inline-grid; place-items: center; flex: none; width: 14px; height: 14px; box-sizing: border-box; border: 1.5px solid rgba(var(--ink-rgb), 0.35); border-radius: 3px; }
  .box.on { border-color: var(--text-primary); background: var(--text-primary); }
  .box.on::after { content: ''; width: 6px; height: 3px; margin-top: -2px; border: solid var(--surface-card); border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg); }
  .more-link { display: block; width: 100%; padding: 4px 8px 6px 30px; border: 0; background: none; color: var(--text-secondary); font: inherit; font-size: var(--text-xs); text-align: left; cursor: pointer; }
  .more-link:hover { color: var(--text-primary); text-decoration: underline; }

  #tip { position: fixed; z-index: 70; display: none; max-width: 300px; padding: 7px 9px; border-radius: var(--radius-ui); background: var(--surface-card); box-shadow: 0 0 0 1px rgba(var(--ink-rgb), 0.12), 0 10px 28px -14px rgba(var(--ink-rgb), 0.32); pointer-events: none; font: 400 var(--text-xs) / 1.45 var(--font-body); }
  #tip .h { font-weight: 500; }
  #tip .w { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); }
  #tip .k { display: flex; align-items: center; gap: 6px; }
  #tip .k .n { margin-left: auto; padding-left: 12px; font-family: var(--font-mono); font-size: var(--text-mono-sm); color: var(--text-secondary); }
  #tip .x { margin-top: 3px; color: var(--text-secondary); }
</style>
</head>
<body>
<div id="ctl">
  <label class="search"><svg class="ico" viewBox="0 0 24 24"><path d="M4 10.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M15.2 15.2L20 20"/></svg><input id="q" class="field" type="search" placeholder="Search reports" autocomplete="off" spellcheck="false"></label>
  <button id="f-broad_class" class="field fbtn" type="button" aria-haspopup="menu" aria-expanded="false"></button>
  <button id="f-more" class="field fbtn" type="button" aria-haspopup="menu" aria-expanded="false"></button>
  <span id="chips"></span>
  <span id="colour"></span>
</div>
<div id="main">
  <aside id="side">
    <div id="detail"></div>
    <div id="listhead"></div>
    <div id="listwrap"><div id="list" tabindex="-1"><div id="rows"></div></div><div id="stick"></div></div>
  </aside>
  <section id="tl">
    <div id="tlhead">
      <span id="win"></span>
    </div>
    <div id="top"><div id="legend"></div><div id="topr"><svg id="ctx"></svg><svg id="axis"></svg></div></div>
    <div id="lanes"><div id="lanebox"><div id="gut"></div><svg id="plot"></svg><div id="brush"></div></div></div>
  </section>
</div>
<div id="tip"></div>
<script>
'use strict'
// Activity Timeline: every report on one UTC time axis, a lane per data source and one each for the reports under
// review and the background controls. The context strip holds the whole span of the data, from the first report's day
// to the last's, with the window boxed, and a drag on it picks the window; the timeline opens on the months that hold
// 99% of the reports (DEF), and the fit button goes from there to the whole span and back; the lanes show the window's reports per bin, stacked by the Colour
// by choice, as bars whose height grows with the log of the count, and once the window is six hours or less each
// report is its own mark at its second. A drag on the lanes zooms to the span dragged, the wheel zooms around the
// pointer, a click on a bar zooms to its bin, a click on a lane's name opens the lane (taller, its bars on a linear
// scale, and its reports in the list) and a shift-click shows lanes alone. The side column lists the window's reports
// in time order, and a report clicked anywhere opens in full above the list.
// Colour: thimble's Colour by control in the control row (thimble.colourBy) colours by confidence, class, disposition,
// source basis or catalog, or by a label; a value whose chip is off leaves the bars, the counts and the list. The list
// has the control's coloured scrollbar.
// Labels: the reader keeps only the reports the label filter keeps and hands each its marks, which give each report its
// value while a label is the colour; list rows and the open report carry their row's ref as data-anchor, so thimble
// marks them; marks and bars are drawn in the values' colours by the page (data-anchor-unmarked).
const slug = (thimble.view && thimble.view.slug) || 'activity-timeline'
const DAY = 86400
const TICKS_BELOW = 6 * 3600 // a window this short shows each report as its own mark
const MIN_SPAN = 60
const LANE_MIN = 17, LANE_MIN_ALL = 11, LANE_MAX = 140, SEP = 10
const OPEN_SHARE = 0.3, OPEN_MIN = 84, OPEN_MAX = 200 // the open lane's height: its share of the lanes' room, within these px
const RH = 46 // list row
const NONINC = new Set(['Review required', 'Background control'])
const COLS = ['r', 't', 'ln', 'sl', 'lane', 'confidence', 'disposition', 'broad_class', 'source_basis', 'catalog', 'why_included', 'mb']
const FILTERS = ['confidence', 'disposition', 'broad_class', 'source_basis', 'catalog']
const FNAME = { confidence: 'Confidence', disposition: 'Disposition', broad_class: 'Class', source_basis: 'Source basis', catalog: 'Catalog', lane: 'Data source' }
const MORE = ['disposition', 'source_basis', 'catalog']
const MONTH = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const WEEKDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
const BINS = [1, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, DAY, 2 * DAY, 7 * DAY]
const ICON = {
  down: 'M6 9l6 6 6-6', x: 'M6 6l12 12M18 6L6 18', check: 'M5 12.5l4.5 4.5L19 7', plus: 'M12 5v14M5 12h14',
  out: 'M4 10.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M15.2 15.2L20 20M7.5 10.5h6',
  fit: 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',
  file: 'M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5',
  copy: 'M9 9h10v11H9zM5 15V4h10', zoom: 'M4 10.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M15.2 15.2L20 20M10.5 7.5v6M7.5 10.5h6',
  tag: 'M3 12V4h8l10 10-8 8L3 12zM7.5 7.5h.01', ext: 'M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5',
}
const ico = (n, c = 'ico') => `<svg class="${c}" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const fmt = (n) => n.toLocaleString('en-US')
const plural = (n, one, many = one + 's') => `${fmt(n)} ${n === 1 ? one : many}`
const pad2 = (n) => String(n).padStart(2, '0')
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
const $ = (id) => document.getElementById(id)

// ---------------------------------------------------------------- time (seconds since 1970, UTC)
const dt = (t) => new Date(t * 1000)
const isoDay = (t) => dt(t).toISOString().slice(0, 10)
const isoMin = (t) => dt(t).toISOString().slice(0, 16)
const hms = (t) => dt(t).toISOString().slice(11, 19)
const hm = (t) => dt(t).toISOString().slice(11, 16)
const dmy = (t) => { const d = dt(t); return `${d.getUTCDate()} ${MONTH[d.getUTCMonth()]} ${d.getUTCFullYear()}` }
const dm = (t) => { const d = dt(t); return `${d.getUTCDate()} ${MONTH[d.getUTCMonth()]}` }
const monthStart = (t, k = 0) => { const d = dt(t); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + k, 1) / 1000 }
function spanWords(a, b) {
  // a window in words: its days, and its times when it is not whole days
  const whole = a % DAY === 0 && b % DAY === 0
  if (whole) {
    const last = b - DAY
    if (last === a) return `${WEEKDAY[dt(a).getUTCDay()]} ${dmy(a)}`
    if (a === monthStart(a) && b === monthStart(a, 1)) return `${MONTH[dt(a).getUTCMonth()]} ${dt(a).getUTCFullYear()}`
    return dt(a).getUTCFullYear() === dt(last).getUTCFullYear() ? `${dm(a)} – ${dmy(last)}` : `${dmy(a)} – ${dmy(last)}`
  }
  const sec = a % 60 || b % 60
  const tm = (t) => (sec ? hms(t) : hm(t))
  if (isoDay(a) === isoDay(b - 1)) return `${dmy(a)}, ${tm(a)}–${tm(b)}`
  return `${dm(a)} ${tm(a)} – ${dm(b)} ${tm(b)}`
}
function binWords(b) {
  if (b >= 7 * DAY) return 'per week'
  if (b >= DAY) return b === DAY ? 'per day' : `per ${b / DAY} days`
  if (b >= 3600) return b === 3600 ? 'per hour' : `per ${b / 3600} hours`
  if (b >= 60) return b === 60 ? 'per minute' : `per ${b / 60} minutes`
  return b === 1 ? 'per second' : `per ${b} seconds`
}
const binStart = (t, b) => (b === 7 * DAY ? Math.floor((t - 4 * DAY) / b) * b + 4 * DAY : Math.floor(t / b) * b) // weeks from Monday

// ---------------------------------------------------------------- data
// The reader sends every report the label filter keeps as columns, a page at a time (COLS): r the reader's row, t the
// seconds since t0, ln and sl the report's lines in all-reports.csv and report-sources.csv, a column per field (an
// index into names) and mb its marks as bits.
let D = null, N = 0, C = null, T = new Float64Array(0)
let IDS = '', IDW = 8 // the start of each report's report_id, IDW characters each, one after another
let rowAt = new Map()
let loadSeq = 0
let labelState = { labels: [], filter: null, all: null, palette: null }
let EXT = [0, DAY] // the whole span of the data: the first report's UTC day to the end of the last report's
// the window the timeline opens on: from the start of the month of the report after which 99% of the reports come to
// the end of the data, so the busy months fill the lanes while the context strip shows the whole span and the stretch
// left out; null when that is most of the span
let DEF = null

const S = {
  win: null, // [a, b], the window of the lanes; null for the opening window (DEF), EXT itself for the whole span
  lanes: new Set(), // lane codes shown alone; empty for all
  open: null, // the open lane's code: taller, its reports in the list; null for none
  f: Object.fromEntries(FILTERS.map((k) => [k, new Set()])), // field -> the value codes kept
  q: '', found: null, // the search and the reader rows that hold it
  expanded: false, // the smaller sources shown in their own lanes
  sel: null, detail: null, // the open report's reader row and its fetched details
  keep: null, // a row a citation opened, kept whatever the label filter keeps
}

async function load() {
  // the pages in turn (one holds every report unless the corpus grows); each column decoded from its differences
  // and its packed codes
  const my = ++loadSeq
  const parts = []
  let from = 0
  try {
    do {
      const page = await thimble.fetch({ op: 'overview', from, ...(S.keep != null ? { keep: [S.keep] } : {}) }, { key: 'overview' })
      if (my !== loadSeq) return false
      parts.push(page)
      from = page.next
    } while (from != null)
  } catch (e) {
    if (e && e.name === 'AbortError') return false
    throw e
  }
  const first = parts[0]
  const n = parts.reduce((s, p) => s + p.n, 0)
  const cols = Object.fromEntries(COLS.map((k) => [k, new Int32Array(n)]))
  const t = new Float64Array(n)
  const A = first.alphabet, at = new Int16Array(128).fill(0)
  for (let k = 0; k < A.length; k++) at[A.charCodeAt(k)] = k
  let o = 0
  for (const p of parts) {
    let r = p.start - 1, tt = 0, ln = 0, sl = 0
    for (let j = 0; j < p.n; j++) {
      r += p.r ? p.r[j] : 1; tt += p.t[j]; ln += p.ln[j]
      if (p.sl[j]) sl += p.sl[j]
      cols.r[o + j] = r; t[o + j] = first.t0 + tt; cols.ln[o + j] = ln; cols.sl[o + j] = p.sl[j] ? sl : 0
    }
    for (const [f, { w, s: str }] of Object.entries(p.codes)) {
      const col = cols[f]
      if (!col) continue
      for (let j = 0; j < p.n; j++) { let v = 0; for (let k = 0; k < w; k++) v = v * 64 + at[str.charCodeAt(j * w + k)]; col[o + j] = v }
    }
    for (const [j, bits] of p.mb) cols.mb[o + j] = bits
    o += p.n
  }
  D = first
  N = n
  C = cols
  T = t
  IDW = first.id_chars || 8
  IDS = parts.map((p) => p.ids || ''.padEnd(p.n * IDW)).join('')
  rowAt = new Map()
  for (let i = 0; i < N; i++) rowAt.set(C.r[i], i)
  if (D.total) EXT = [Math.floor(D.t0 / DAY) * DAY, Math.floor(D.t1 / DAY) * DAY + DAY]
  if (!DEF && N) {
    const a = monthStart(T[Math.floor(N * 0.01)])
    DEF = a - EXT[0] > (EXT[1] - EXT[0]) * 0.2 ? [a, EXT[1]] : null
  }
  assignValues()
  return true
}

const name = (k, v) => (D.names[k] && D.names[k][v]) ?? ''
const laneName = (c) => name('lane', c)
const laneKey = (c) => D.keys[String(c)] || ''
const refOf = (i) => `${D.files.all}#L${C.ln[i]}`
const idOf = (i) => IDS.substr(i * IDW, IDW).trim()
const srcRefOf = (i) => (C.sl[i] && D.files.src ? `${D.files.src}#L${C.sl[i]}` : null)
const R = () => EXT
const W = () => S.win || DEF || R()
const isWhole = () => { const [a, b] = W(); return a <= EXT[0] && b >= EXT[1] }
const isDef = () => !S.win && DEF != null
const inDef = (t) => !DEF || (t >= DEF[0] && t < DEF[1])
function lowerBound(t) { let lo = 0, hi = N; while (lo < hi) { const m = (lo + hi) >> 1; if (T[m] < t) lo = m + 1; else hi = m } return lo }
function passes(i, skip) {
  if (S.found && !S.found.has(C.r[i])) return false
  for (const k of FILTERS) if (k !== skip && S.f[k].size && !S.f[k].has(C[k][i])) return false
  if (skip !== 'lane' && S.lanes.size && !S.lanes.has(C.lane[i])) return false
  if (skip !== 'colour' && !VON[VAL[i]]) return false
  return true
}

// ---------------------------------------------------------------- colour
// thimble's Colour by control: a field of the reports, or a label. Each report takes one value of the choice (VAL, an
// index into VALS, the choice's values as strings and null for none); the chips give each value its colour and whether
// it is on, and their order is a bar's stack from the bottom (ORD). While a label is the colour, a report's value is
// the first of that label's values among the marks the reader gave it.
const FIELDS_BY = [
  { name: 'confidence', title: 'Confidence', values: [{ name: 'significant', colour: 2 }, { name: 'suggestive', colour: 1 }] },
  { name: 'broad_class', title: 'Class', values: ['source_request', 'indirection', 'custom_program'] },
  { name: 'disposition', title: 'Disposition', values: ['included', 'review_required', 'background'] },
  { name: 'source_basis', title: 'Source basis' },
  { name: 'catalog', title: 'Catalog', values: ['main', 'supplemental'] },
]
let VAL = new Int16Array(0), VALS = [null], ORD = [0], VCOL = ['#a09c93'], VON = [true], VNAME = ['']
const noneColour = () => token('--label-none') || '#a09c93'
// a report's value of a field, by its column index; null for a blank cell
const fieldValue = (f, i) => (D && C && C[f] && typeof i === 'number' ? name(f, C[f][i]) || null : null)
const colour = thimble.colourBy({
  mount: '#colour',
  fields: FIELDS_BY.map((f) => ({ ...f, value: (i) => fieldValue(f.name, i) })),
  chips: 'filter',
  strip: '#list',
  onChange: () => { if (D) { assignValues(); rescope() } },
})
function assignValues() {
  if (!D) return
  const by = colour.by
  VAL = new Int16Array(N)
  if (by && by.field && C[by.field]) {
    VALS = (D.names[by.field] || []).map((v) => (v === '' ? null : v))
    const col = C[by.field]
    for (let i = 0; i < N; i++) VAL[i] = col[i]
  } else if (by && by.label) {
    const ks = (D.marks || []).map((m, k) => (m.label === by.title ? k : -1)).filter((k) => k >= 0)
    VALS = [null, ...ks.map((k) => D.marks[k].value)]
    for (let i = 0; i < N; i++) {
      const b = C.mb[i]
      let v = 0
      if (b) for (let q = 0; q < ks.length; q++) if (b & (1 << ks[q])) { v = q + 1; break }
      VAL[i] = v
    }
  } else VALS = [null]
  syncChips()
}
// the chips' counts: the window's reports that pass every other filter, by value
function chipCounts() {
  const [a, b] = W(), n = new Int32Array(VALS.length)
  for (let i = lowerBound(a), z = lowerBound(b); i < z; i++) if (passes(i, 'colour')) n[VAL[i]]++
  const map = {}
  VALS.forEach((v, k) => { const key = v == null ? '' : v; map[key] = (map[key] || 0) + n[k] })
  colour.counts(map)
  syncChips()
}
function syncChips() {
  const at = new Map(VALS.map((v, k) => [v == null ? '' : v, k]))
  ORD = []
  VCOL = VALS.map((v) => colour.colourOf(v) || noneColour())
  VON = VALS.map((v) => colour.isOn(v))
  VNAME = VALS.map((v) => v ?? 'none')
  for (const c of colour.values) {
    const k = at.get(c.value == null ? '' : c.value)
    if (k == null || ORD.includes(k)) continue
    ORD.push(k)
    VNAME[k] = c.name
  }
  for (let k = 0; k < VALS.length; k++) if (!ORD.includes(k)) ORD.push(k)
}
// thimble hides every anchored element whose label value is turned off, a unit's value being the one most of its
// records take, so while a label is the colour with a value off the lanes, bars and days are not anchored as units:
// a lane or a day of mixed values would vanish with the value most of its reports take
const unitsAnchored = () => !(colour.label && colour.values.some((v) => !v.on))
const UNIT = (key, rest) => (unitsAnchored() ? ` data-anchor="view:${slug}/${key}"${rest}` : '')
const catOf = (i) => VAL[i]
const catColour = (k) => VCOL[k] || noneColour()
const catName = (k) => VNAME[k] || 'none'
const colourOf = (i) => catColour(VAL[i])

// ---------------------------------------------------------------- popovers: one at a time, closed by a click outside or Escape
let openPop = null
function close() { if (openPop) { openPop.anchor.setAttribute('aria-expanded', 'false'); openPop.remove(); openPop = null } }
function pop(anchor, html, align = 'left') {
  // measured before the open popover closes, since the anchor may be inside it
  const rect = anchor.getBoundingClientRect()
  close()
  const p = document.createElement('div')
  p.className = 'pop'
  p.setAttribute('role', 'menu')
  p.innerHTML = html
  document.body.appendChild(p)
  p.rect = rect
  p.align = align
  place(p, anchor, align)
  p.anchor = anchor
  anchor.setAttribute('aria-expanded', 'true')
  openPop = p
  return p
}
function place(p, anchor, align) {
  const r = anchor.isConnected ? anchor.getBoundingClientRect() : p.rect, w = p.offsetWidth
  p.style.top = Math.max(6, Math.min(r.bottom + 4, innerHeight - p.offsetHeight - 6)) + 'px'
  p.style.left = Math.max(6, Math.min(innerWidth - w - 6, align === 'right' ? r.right - w : r.left)) + 'px'
}
function repop(html) {
  if (!openPop) return
  const sc = [openPop, ...openPop.querySelectorAll('.scrolls, .col')].map((e) => e.scrollTop)
  openPop.innerHTML = html
  place(openPop, openPop.anchor, openPop.align)
  ;[openPop, ...openPop.querySelectorAll('.scrolls, .col')].forEach((e, k) => { e.scrollTop = sc[k] || 0 })
}
document.addEventListener('mousedown', (e) => { if (openPop && !openPop.contains(e.target) && !openPop.anchor.contains(e.target)) close() })
const toggled = (anchor) => (openPop && openPop.anchor === anchor ? (close(), true) : false)

// ---------------------------------------------------------------- the control row
function counts(k) {
  // each value of field k with the reports of the window that pass every other filter
  const [a, b] = W(), n = new Map()
  for (let i = lowerBound(a), z = lowerBound(b); i < z; i++) if (passes(i, k)) n.set(C[k][i], (n.get(C[k][i]) || 0) + 1)
  for (const v of (k === 'lane' ? S.lanes : S.f[k])) if (!n.has(v)) n.set(v, 0)
  const order = k === 'lane' ? D.lanes : null
  return [...n].sort((p, q) => (order ? order.indexOf(p[0]) - order.indexOf(q[0]) : q[1] - p[1]))
}
const valueName = (k, v) => (k === 'lane' ? laneName(v) : name(k, v)) || 'blank'
function checklist(k, max = 99, keep = null) {
  const all = counts(k).filter(([v]) => !keep || keep(v)), sel = k === 'lane' ? S.lanes : S.f[k]
  const rows = all.slice(0, max).map(([v, n]) => `<button class="item" data-k="${k}" data-v="${v}"><span class="box${sel.has(v) ? ' on' : ''}"></span><span class="lab${name(k, v) || k === 'lane' ? '' : ' none'}">${esc(valueName(k, v))}</span><span class="n">${fmt(n)}</span></button>`).join('')
  return rows + (all.length > max ? `<button class="more-link" data-all="${k}">${all.length - max} more</button>` : '')
}
function toggleValue(k, v) {
  const s = k === 'lane' ? S.lanes : S.f[k]
  s.has(v) ? s.delete(v) : s.add(v)
  rescope()
}
function filterMenu(k) {
  const b = $('f-' + k)
  if (toggled(b)) return
  const p = pop(b, `<div class="head">${FNAME[k]}</div>${checklist(k)}`)
  p.onclick = (ev) => { const it = ev.target.closest('[data-v]'); if (it) { toggleValue(k, +it.dataset.v); repop(`<div class="head">${FNAME[k]}</div>${checklist(k)}`) } }
}
// More: confidence, disposition, source basis and catalog on the left; every data source on the right, in a column of
// its own that scrolls, its shadow showing there is more below
function moreMenu() {
  const b = $('f-more')
  if (toggled(b)) return
  const html = () => {
    const isSrc = (c) => !NONINC.has(laneName(c)), src = counts('lane').filter(([c]) => isSrc(c))
    const non = checklist('lane', 99, (c) => !isSrc(c))
    return `<div class="more-grid"><div class="col">${['confidence', ...MORE].map((k) => `<div class="head">${FNAME[k]}</div>${checklist(k)}`).join('')}</div><div class="col src"><div class="head">${FNAME.lane}<span class="n">${src.length}</span></div><div class="scrolls">${checklist('lane', 99, isSrc)}${non ? `<div class="head">Not included</div>${non}` : ''}</div></div></div>`
  }
  const p = pop(b, html())
  p.classList.add('more')
  place(p, b, 'left')
  p.relabel = () => repop(html())
  p.onclick = (ev) => {
    const it = ev.target.closest('[data-v]')
    if (it) { toggleValue(it.dataset.k, +it.dataset.v); repop(html()) }
  }
}
function fbtn(k) {
  const b = $('f-' + k), set = S.f[k]
  const v = set.size === 1 ? valueName(k, [...set][0]) : set.size ? `${set.size}` : ''
  b.classList.toggle('active', set.size > 0)
  b.innerHTML = `${FNAME[k]}${v ? `: <span class="v">${esc(v)}</span>` : ''}${ico('down')}`
}
// a filter that is set: thimble's active filter chip, its name and value, × at its end; the whole chip clears it
const fchip = (text, attrs) => `<button type="button" class="chip chip-tone-neutral chip-act active"${attrs} title="Clear this filter" aria-label="Clear the filter ${esc(text)}"><span class="chip-text">${esc(text)}</span>${ico('x')}</button>`
function renderCtl() {
  fbtn('broad_class')
  const n = MORE.reduce((s, k) => s + S.f[k].size, 0) + (S.lanes.size ? 1 : 0)
  const more = $('f-more')
  more.innerHTML = `More${n ? ` <span class="n">${n}</span>` : ''}${ico('down')}`
  more.classList.toggle('active', n > 0)
  const chips = []
  if (labelState.filter) {
    const f = labelState.filter, l = (labelState.all || labelState.labels || []).find((x) => x.name === f.label)
    chips.push(fchip(f.label === f.value ? f.label : `${f.label} · ${f.value}`, ` data-unfilter data-label="${esc(l ? l.id : '')}"`))
  }
  if (S.lanes.size) {
    const t = S.lanes.size === 1 ? laneName([...S.lanes][0]) : `${S.lanes.size} lanes`
    chips.push(fchip(`Lane · ${t}`, ' data-k="lane"'))
  }
  for (const k of [...MORE, 'confidence']) if (S.f[k].size) {
    const t = S.f[k].size === 1 ? valueName(k, [...S.f[k]][0]) : `${S.f[k].size} values`
    chips.push(fchip(`${FNAME[k]} · ${t}`, ` data-k="${k}"`))
  }
  if (S.found) chips.push(fchip(`Search · ${S.q}`, ' data-q'))
  $('chips').innerHTML = chips.join('')
  renderLegend()
}
$('chips').onclick = (ev) => {
  const b = ev.target.closest('button')
  if (!b) return
  if (b.dataset.unfilter != null) return thimble.setFilter(null, null).catch(() => {})
  if (b.dataset.q != null) { S.q = ''; S.found = null; $('q').value = '' }
  else if (b.dataset.k === 'lane') S.lanes.clear()
  else S.f[b.dataset.k].clear()
  rescope()
}
// beside the strip, how a lane's bars count: the bin and the most reports in one, or each report at its second; the
// values' colours are the Colour by chips in the control row
function renderLegend() {
  $('legend').innerHTML = drawn ? (drawn.mode === 'bars' ? `<span class="lg-scale" title="Bar heights grow with the log of the count">${binWords(drawn.B)}, at most ${fmt(drawn.max)}</span>` : '<span class="lg-scale">each report at its second</span>') : ''
}

// ---------------------------------------------------------------- layout: the lanes that fit
let G = 150 // the gutter of lane names, px
let PW = 400 // the plot's width
let layout = null // {rows: [{c?, group?, y, h}], h}
function laneLayout() {
  // the lanes with a report in the range that passes the filters, in the reader's order (largest first, the reports
  // under review and the background controls last); the smallest sources share a lane when the lanes do not fit
  const [ra, rb] = R(), has = new Map(), inWin = new Map(), ever = new Map(), [a, b] = W()
  let total = 0
  for (let i = 0; i < N; i++) if (passes(i)) {
    const c = C.lane[i]
    total++
    ever.set(c, (ever.get(c) || 0) + 1)
    if (T[i] < ra || T[i] >= rb) continue
    has.set(c, (has.get(c) || 0) + 1)
    if (T[i] >= a && T[i] < b) inWin.set(c, (inWin.get(c) || 0) + 1)
  }
  const sel0 = S.sel != null && rowAt.has(S.sel) ? C.lane[rowAt.get(S.sel)] : null
  if (sel0 != null && !has.has(sel0)) has.set(sel0, 0)
  // a window shows the lanes with a report in it; the whole span shows every lane that has one
  const order = D.lanes.filter((c) => has.has(c) && (isWhole() || inWin.get(c) || c === sel0 || c === S.open))
  const src = order.filter((c) => !NONINC.has(laneName(c))), non = order.filter((c) => NONINC.has(laneName(c)))
  let avail = Math.max(120, $('lanes').clientHeight - 10)
  // the open lane stays in its own lane and takes OPEN_SHARE of the height; the other lanes share the rest
  const open = S.open != null && order.includes(S.open) ? S.open : null
  const openH = open != null ? Math.round(clamp(avail * OPEN_SHARE, OPEN_MIN, OPEN_MAX)) : 0
  const room = avail - (open != null ? openH - LANE_MIN : 0)
  const sep = src.length && non.length ? SEP : 0
  let rows = [...src.map((c) => ({ c })), ...non.map((c) => ({ c, non: true }))]
  const crowded = (room - sep) / rows.length < LANE_MIN && src.length > 4
  if (crowded) {
    if (S.expanded) avail -= 22
    else {
      const k = Math.max(3, Math.floor((room - sep) / LANE_MIN) - non.length - 1)
      const sel = S.sel != null && rowAt.has(S.sel) ? C.lane[rowAt.get(S.sel)] : null
      // the lane of the open report and the open lane stand alone whatever their size, in the reader's order
      let shown = src.slice(0, k)
      const keepers = [sel, open].filter((c, q, all) => c != null && src.includes(c) && !shown.includes(c) && all.indexOf(c) === q)
      if (keepers.length) shown = [...src.slice(0, Math.max(1, k - keepers.length)), ...keepers]
      shown = src.filter((c) => shown.includes(c))
      const rest = src.filter((c) => !shown.includes(c))
      if (rest.length > 3) rows = [...shown.map((c) => ({ c })), { group: rest }, ...non.map((c) => ({ c, non: true }))]
    }
  }
  const isOpen = (r) => open != null && !r.group && r.c === open
  const h = Math.floor(clamp((avail - sep - openH) / Math.max(1, rows.length - (open != null ? 1 : 0)), LANE_MIN_ALL, LANE_MAX))
  let y = 0
  for (const r of rows) {
    if (r.non && sep && !rows.some((x) => x.non && x.y != null)) y += sep
    r.open = isOpen(r)
    r.y = y; r.h = r.open ? Math.max(openH, h) : h; y += r.h
  }
  return { rows, h: y, inWin, has, ever, total, grouped: rows.some((r) => r.group), canGroup: S.expanded && crowded }
}
// a lane's count: its reports in the window, and in the opening window of all its reports when it leaves some out
function laneCount(r) {
  const sum = (m) => (r.group ? r.group.reduce((t, c) => t + (m.get(c) || 0), 0) : m.get(r.c) || 0)
  const n = sum(layout.inWin), all = sum(layout.ever)
  if (!isDef() || all <= n) return { n, text: fmt(n), html: fmt(n) }
  return { n, text: `${fmt(n)} of ${fmt(all)}`, html: `${fmt(n)}<span class="of"> of ${fmt(all)}</span>` }
}

// ---------------------------------------------------------------- the timeline
// the gutter is as wide as the longest lane name and its count need, up to almost half the timeline
let measure = null
function textWidth(text, font) {
  if (!measure) measure = document.createElement('canvas').getContext('2d')
  measure.font = font
  return measure.measureText(text).width
}
function sizes(lay) {
  const w = $('tl').clientWidth - 14
  const body = getComputedStyle(document.body).fontFamily, mono = token('--font-mono') || 'monospace'
  let need = 0
  for (const r of lay ? lay.rows : []) {
    const nm = r.group ? plural(r.group.length, 'smaller source') : laneName(r.c)
    need = Math.max(need, textWidth(nm, `400 12px ${body}`) + 8 + textWidth(laneCount(r).text, `400 11px ${mono}`))
  }
  G = Math.round(clamp(need + 18, 140, Math.min(280, w * 0.46)))
  document.documentElement.style.setProperty('--gut', G + 'px')
  PW = Math.max(160, w - G - 14 - ($('lanes').offsetWidth - $('lanes').clientWidth))
}
const X = (t) => { const [a, b] = W(); return ((t - a) / (b - a)) * PW }
const TofX = (x) => { const [a, b] = W(); return a + (x / PW) * (b - a) }
function pickBin(span, px, fine) {
  for (const b of BINS) { const w = (b / span) * px; if (w >= (b >= DAY ? 1 : fine)) return b }
  return BINS[BINS.length - 1]
}

// the axis steps: seconds, minutes, hours, days, weeks, then calendar months
const STEPS = [1, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, DAY, 2 * DAY, 7 * DAY, 'm1', 'm3', 'm6', 'm12']
// the finest step whose labels fit between its ticks; the strip and the lanes' axis take their ticks from here, so on
// the whole range they tick at the same places, each label just after its tick
const CH = 6.3 // px a character of an axis label takes
const labelChars = (s) => (typeof s === 'string' ? 3 : s >= DAY ? 6 : s >= 60 ? 5 : 8)
function ticks(a, b, px) {
  const span = b - a
  for (const s of STEPS) {
    const approx = typeof s === 'number' ? s : +s.slice(1) * 30.4 * DAY
    if ((approx / span) * px < labelChars(s) * CH + 6) continue
    const out = []

    w = b - a >= rb - ra - 1 ? (DEF ? [ra, rb] : null) : DEF && a === DEF[0] && b === DEF[1] ? null : [a, b]
  }
  S.win = w
  listReset = true
  if (quick) schedule()
  else render()
}

// hover: a bar's counts by category, or a mark's report
const tip = $('tip')
let hotRow = null
function setHot(j) {
  if (hotRow === j) return
  hotRow = j
  for (const el of $('gut').querySelectorAll('.lh')) el.classList.toggle('hot', el.dataset.row != null && +el.dataset.row === j)
}
function hideTip() { tip.style.display = 'none' }
function showTip(html, ev) {
  tip.innerHTML = html
  tip.style.display = 'block'
  tip.style.left = Math.max(4, Math.min(innerWidth - tip.offsetWidth - 8, ev.clientX + 12)) + 'px'
  tip.style.top = Math.max(4, Math.min(innerHeight - tip.offsetHeight - 8, ev.clientY + 14)) + 'px'
}
function hover(ev) {
  if (!drawn || !layout) return
  const y = ev.clientY - $('plot').getBoundingClientRect().top
  const j = layout.rows.findIndex((r) => y >= r.y && y < r.y + r.h)
  setHot(j < 0 ? null : j)
  const bar = ev.target.closest && ev.target.closest('.bar')
  if (bar && drawn.mode === 'bars') {
    const [jj, x] = bar.dataset.b.split(':').map(Number), r = drawn.rows[jj], t0 = drawn.first + x * drawn.B
    const nm = r.group ? `${r.group.length} smaller sources` : laneName(r.c)
    let rows = ''
    for (const k of ORD) { const c = drawn.binned[jj][x * drawn.K + k]; if (c) rows += `<div class="k"><span class="sw" style="--c:${catColour(k)}"></span>${esc(catName(k))}<span class="n">${fmt(c)}</span></div>` }
    return showTip(`<div class="h">${esc(nm)}</div><div class="w">${esc(drawn.B === DAY ? `${WEEKDAY[dt(t0).getUTCDay()]} ${dmy(t0)}` : spanWords(t0, t0 + drawn.B))}</div>${rows}`, ev)
  }
  const mk = ev.target.closest && ev.target.closest('.mk')
  if (mk) {
    const i = +mk.dataset.i
    let same = 0
    for (let q = lowerBound(T[i]); q < N && T[q] === T[i]; q++) if (C.lane[q] === C.lane[i] && passes(q)) same++
    return showTip(`<div class="h">${esc(laneName(C.lane[i]))}</div><div class="w">${dmy(T[i])} ${hms(T[i])} UTC</div><div class="k"><span class="sw" style="--c:${colourOf(i)}"></span>${esc(name('confidence', C.confidence[i]) || 'blank')} · ${esc(name('broad_class', C.broad_class[i]))}</div>${same > 1 ? `<div class="x">${same} reports in this lane at this second</div>` : ''}<div class="x">${esc(name('why_included', C.why_included[i]).slice(0, 160))}</div>`, ev)
  }
  hideTip()
}

// ---------------------------------------------------------------- the list: the window's reports in time order
// Each UTC day opens with its header, which names the day with its year and stays at the list's top while its reports
// scroll under it. A row gives its report's time, lane and the start of its report_id, then its broad_class and
// why_included: reports of the same lane and second often share all but their report_id. While a lane is open the list
// holds that lane's reports. Each row's left edge is its value's colour, and the list's scrollbar shows where each
// value's reports are (the Colour by control's strip).
let listRows = [] // the column indices of the reports listed
let items = [] // what the list holds in order: a report's column index, or -1 - k for the header of days[k]
let days = [] // [{t0, n}] each day listed and its reports there
let tops = new Float64Array(1) // where each item starts, and the list's height after the last
let itemOf = new Int32Array(0) // a report's column index -> its item, -1 for none
let listReset = false // the window changed: the list starts again at its top, or at the open report
const DH = 28 // a day's header
function computeList() {
  const [a, b] = W()
  listRows = []; items = []; days = []
  if (itemOf.length !== N) itemOf = new Int32Array(N)
  itemOf.fill(-1)
  let cur = null
  for (let i = lowerBound(a), z = lowerBound(b); i < z; i++) {
    if (!passes(i) || (S.open != null && C.lane[i] !== S.open)) continue
    const d = Math.floor(T[i] / DAY)
    if (d !== cur) { days.push({ t0: d * DAY, n: 0 }); items.push(-days.length); cur = d }
    days[days.length - 1].n++
    itemOf[i] = items.length
    items.push(i)
    listRows.push(i)
  }
  tops = new Float64Array(items.length + 1)
  let y = 0
  for (let k = 0; k < items.length; k++) { tops[k] = y; y += items[k] < 0 ? DH : RH }
  tops[items.length] = y
  // the coloured scrollbar: each report's value in the list's order, a day's header about half a row
  const vals = []
  for (const k of items) { if (k < 0) vals.push(null); else { const v = VON[VAL[k]] ? VALS[VAL[k]] : null; vals.push(v, v) } }
  colour.strip('#list', { rows: vals })
}
function renderListHead() {
  const open = S.open != null ? S.open : null
  const all = open != null ? (layout ? layout.ever.get(open) || 0 : listRows.length) : layout ? layout.total : listRows.length
  const what = `<span class="n">${fmt(listRows.length)}</span>${all > listRows.length ? ` <span class="s">of</span> <span class="n">${fmt(all)}</span>` : ''} ${all === 1 ? 'report' : 'reports'}${S.win && !isWhole() ? ` <span class="s">in the window</span>` : ''}`
  $('listhead').innerHTML = open != null
    ? `<span class="t"${UNIT(esc(laneKey(open)), ` data-anchor-unmarked data-anchor-text="${esc(laneName(open))}"`)}>${esc(laneName(open))} <span class="s">·</span> ${what}</span><button class="btn btn-ghost btn-sm ib" type="button" data-unopen title="Every lane" aria-label="Every lane">${ico('x')}</button>`
    : `<span class="t">${what}</span>`
}
$('listhead').addEventListener('click', (ev) => { if (ev.target.closest('[data-unopen]')) setOpen(null) })
// a lane opened or closed: taller in the lanes, its reports in the list from the top
function setOpen(c) {
  S.open = c
  listReset = true
  render()
}
const dayWords = (t0) => `${WEEKDAY[dt(t0).getUTCDay()]} ${dmy(t0)}`
function dayHtml(k, top, anchored) {
  const d = days[k]
  const anchor = anchored ? UNIT(isoDay(d.t0), ` data-anchor-text="${dayWords(d.t0)}"`) : ''
  return `<div class="dh"${anchor} style="top:${top}px">${dayWords(d.t0)}<span class="n">${plural(d.n, 'report')}</span></div>`
}
function rowHtml(i, top) {
  const ref = refOf(i), sref = srcRefOf(i), lane = laneName(C.lane[i])
  const conf = name('confidence', C.confidence[i]) || 'blank', cls = name('broad_class', C.broad_class[i])
  const why = name('why_included', C.why_included[i]), id = idOf(i)
  const src = sref ? `<span class="src" data-anchor="${esc(sref)}" data-anchor-text="${esc(lane)}">${esc(lane)}</span>` : `<span class="src">${esc(lane)}</span>`
  return `<div class="row${C.r[i] === S.sel ? ' sel' : ''}" data-r="${C.r[i]}" data-anchor="${esc(ref)}" data-anchor-text="${esc(lane)} · ${dmy(T[i])} ${hms(T[i])} UTC · ${esc(conf)} · ${esc(cls)} · ${esc(why)}" style="top:${top}px"${colour.attr(i)}><div class="l1"><span class="tm">${hms(T[i])}</span>${src}<span class="rid" title="report_id">${esc(id)}</span></div><div class="l2"><span class="cl">${esc(cls)}</span> · ${esc(why)}</div></div>`
}
function itemAt(y) { let lo = 0, hi = items.length; while (lo < hi) { const m = (lo + hi) >> 1; if (tops[m + 1] <= y) lo = m + 1; else hi = m } return lo }
function renderList() {
  const box = $('list'), rows = $('rows'), stick = $('stick')
  if (!items.length) { rows.innerHTML = `<div class="empty">No report passes these filters in this window</div>`; rows.style.height = 'auto'; stick.style.display = 'none'; return }
  rows.style.height = tops[items.length] + 'px'
  const top = box.scrollTop, hgt = box.clientHeight
  let h = ''
  for (let k = itemAt(Math.max(0, top - 300)); k < items.length && tops[k] < top + hgt + 300; k++) {
    h += items[k] < 0 ? dayHtml(-items[k] - 1, tops[k], true) : rowHtml(items[k], tops[k])
  }
  rows.innerHTML = h
  // the day of the item at the top, while its header is scrolled away
  let k = itemAt(top + 1)
  while (k > 0 && items[k] >= 0) k--
  const show = items[k] < 0 && tops[k] < top
  stick.style.display = show ? 'block' : 'none'
  if (show) stick.innerHTML = dayHtml(-items[k] - 1, 0, false)
}
$('list').addEventListener('scroll', () => requestAnimationFrame(renderList), { passive: true })
$('rows').addEventListener('click', (ev) => {
  if (ev.metaKey || ev.ctrlKey) return
  const r = ev.target.closest('.row')
  if (r) pick(+r.dataset.r, false)
})
function listTopOf(i) { const k = i >= 0 && i < itemOf.length ? itemOf[i] : -1; return k < 0 ? -1 : tops[k] }
function scrollListTo(i, centre) {
  const y = listTopOf(i)
  if (y < 0) return
  const box = $('list')
  // centred in what the list shows below the day's header that stays at its top
  if (centre || y < box.scrollTop + DH || y + RH > box.scrollTop + box.clientHeight) box.scrollTop = Math.max(0, y - (box.clientHeight + DH) / 2 + RH / 2)
  renderList()
}

// ---------------------------------------------------------------- a report in full
function renderDetail() {
  const el = $('detail')
  if (S.sel == null) { el.innerHTML = ''; return }
  const i = rowAt.get(S.sel)
  const d = S.detail && S.detail.row === S.sel ? S.detail : null
  if (i == null) { el.innerHTML = ''; return }
  const lane = laneName(C.lane[i]), conf = name('confidence', C.confidence[i]) || 'blank'
  const ref = refOf(i)
  const tag = (t) => `<span class="chip chip-tone-neutral">${esc(t)}</span>`
  const tags = `${tag(conf)}${tag(name('broad_class', C.broad_class[i]))}${tag(name('disposition', C.disposition[i]))}${name('catalog', C.catalog[i]) === 'supplemental' ? tag('supplemental catalog') : ''}`
  const when = `${WEEKDAY[dt(T[i]).getUTCDay()]} ${dmy(T[i])} · ${hms(T[i])} UTC`
  let body = '<div class="det-sec empty">Reading the report</div>'
  if (d) {
    const s = d.source
    const src = s ? `<div class="det-sec srcbox" data-anchor="${esc(s.ref)}" data-anchor-text="${esc(s.data_source)}"><dl class="facts"><dt>data_source</dt><dd>${esc(s.data_source)}</dd><dt>source_basis</dt><dd class="mono">${esc(s.source_basis || '—')}</dd><dt>matched_sources</dt><dd>${esc(s.matched_sources || '—')}</dd></dl></div>` : ''
    const marks = (d.marks || []).length ? `<div class="det-sec"><div class="h">Labels</div><div class="marks">${d.marks.map((m) => { const l = (labelState.all || labelState.labels || []).find((x) => x.name === m.label); return `<span class="chip chip-key" data-label="${esc(l ? l.id : '')}" style="--c:${esc(m.colour)}"><span class="chip-sw"></span><span class="chip-text">${esc(m.label === m.value ? m.label : `${m.label}: ${m.value}`)}</span></span>` }).join('')}</div></div>` : ''
    body = `<div class="det-sec"><div class="h">why_included</div><p class="det-why">${esc(d.why_included || '')}</p></div>${src}${marks}<div class="det-sec"><div class="kv"><div class="k">report_id</div><div class="v">${esc(d.report_id || '')}</div></div><div class="kv"><div class="k">report_date_utc</div><div class="v">${esc(d.report_date_utc || '')}</div></div><div class="kv"><div class="k">report_url</div><div class="url"><a href="${esc(d.report_url || '')}" data-url title="${esc(d.report_url || '')}, an outside page: a click copies it">${esc(d.report_url || '')}</a><button class="btn btn-ghost btn-sm ib" type="button" data-copy title="Copy the address" aria-label="Copy the address">${ico('copy')}</button></div></div></div>${d.caveat ? `<p class="caveat">${esc(d.caveat)}</p>` : ''}`
  }
  el.innerHTML = `<div class="det" data-anchor="${esc(ref)}" data-anchor-text="${esc(lane)} · ${dmy(T[i])} ${hms(T[i])} UTC · ${esc(conf)}"${colour.attr(i)}><div class="det-top"><h2>${esc(lane)}</h2><button class="btn btn-ghost btn-sm ib" type="button" data-near title="The hour around it" aria-label="The hour around it">${ico('zoom')}</button><button class="btn btn-ghost btn-sm ib" type="button" data-file title="Its row in the file" aria-label="Its row in the file">${ico('file')}</button><button class="btn btn-ghost btn-sm ib" type="button" data-close title="Close" aria-label="Close">${ico('x')}</button></div><div class="det-tags">${tags}</div><div class="det-when">${when}</div>${body}</div>`
}
$('detail').addEventListener('click', (ev) => {
  if (ev.metaKey || ev.ctrlKey) return
  const b = ev.target.closest('button, a')
  if (!b) return
  const i = rowAt.get(S.sel)
  if (b.dataset.close != null) { S.sel = null; S.detail = null; return render() }
  if (b.dataset.file != null && i != null) return thimble.navigate(refOf(i), { browser: true })
  if (b.dataset.near != null && i != null) { const m = Math.floor(T[i] / 60) * 60; return setWin([m - 1800, m + 1800]) }
  if (b.dataset.url != null || b.dataset.copy != null) {
    const a = $('detail').querySelector('[data-url]')
    if (!a) return
    const range = document.createRange(); range.selectNodeContents(a)
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range)
    let ok = false
    try { ok = document.execCommand('copy') } catch { ok = false }
    if (b.dataset.copy != null) { b.title = ok ? 'Copied' : 'Selected: press ⌘C to copy'; b.innerHTML = ico(ok ? 'check' : 'copy') }
  }
})
async function pick(r, fromLanes) {
  const i = rowAt.get(r)
  if (i == null) return
  if (S.sel === r && !fromLanes) { S.sel = null; S.detail = null; return render() }
  S.sel = r
  S.detail = null
  if (!(T[i] >= W()[0] && T[i] < W()[1])) S.win = inDef(T[i]) ? null : [...EXT]
  if (S.open != null && S.open !== C.lane[i]) S.open = null
  if (!passes(i)) clearFilters()
  render()
  scrollListTo(i, true)
  let d = null
  try { d = await thimble.fetch({ op: 'report', r, ...(S.keep != null ? { keep: [S.keep] } : {}) }, { key: 'report' }) } catch (e) { if (e && e.name === 'AbortError') return; throw e }
  if (S.sel !== r) return
  S.detail = d
  renderDetail()
  scrollListTo(i, true)
}

// ---------------------------------------------------------------- render
let frame = null
function schedule() { if (frame == null) frame = requestAnimationFrame(() => { frame = null; draw() }) }
function draw() {
  if (!D) return
  chipCounts()
  layout = laneLayout()
  sizes(layout)
  renderAxis(); renderCtx(); renderLanes(); renderHead(); renderLegend()
  computeList(); renderListHead()
  if (listReset) {
    listReset = false
    const y = S.sel != null && rowAt.has(S.sel) ? listTopOf(rowAt.get(S.sel)) : -1
    const box = $('list')
    box.scrollTop = y >= 0 ? Math.max(0, y - (box.clientHeight + DH) / 2 + RH / 2) : 0
  }
  renderList()
}
function render() {
  if (!D) return
  scopeV++
  renderCtl(); renderDetail(); draw()
  if (S.sel != null && rowAt.has(S.sel) && listTopOf(rowAt.get(S.sel)) >= 0) scrollListTo(rowAt.get(S.sel))
}
// a change of what is in scope starts the list again at its top
function rescope() { $('list').scrollTop = 0; render(); if (openPop && openPop.relabel) openPop.relabel() }
// the control row is drawn before the reports arrive, so the page has its controls while it loads
$('f-broad_class').innerHTML = `${FNAME.broad_class}${ico('down')}`
$('f-more').innerHTML = `More${ico('down')}`
$('f-broad_class').onclick = () => filterMenu('broad_class')
$('f-more').onclick = () => moreMenu()
let typing = null
$('q').addEventListener('input', (e) => {
  clearTimeout(typing)
  typing = setTimeout(async () => {
    const q = e.target.value.trim()
    S.q = q
    if (!q) S.found = null
    else {
      let res
      try { res = await thimble.fetch({ op: 'search', q }, { key: 'search' }) } catch (err) { if (err && err.name === 'AbortError') return; throw err }
      if (S.q !== q) return
      S.found = new Set(res.rows)
      const inside = (w) => res.rows.some((r) => { const i = rowAt.get(r); return i != null && T[i] >= w[0] && T[i] < w[1] })
      if (!isWhole() && !inside(W())) S.win = !DEF || inside(DEF) ? null : [...EXT]
    }
    rescope()
  }, 220)
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (openPop) return close()
    if (S.sel != null) { S.sel = null; S.detail = null; return render() }
    if (S.open != null) return setOpen(null)
    if (S.win) return setWin(null)
  }
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return
  if (e.key === '-' || e.key === '_') { const [a, b] = W(); zoomBy(3, (a + b) / 2) }
  if (e.key === '0') setWin(null)
})
// the gutter is measured in the page's faces, so it is laid out again once they have loaded
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (D) render() })
let resizeTimer = null
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 100) })

// ---------------------------------------------------------------- places
// A report opens in full, its lane in view and the filters that would drop it cleared; a lane opens, taller and its
// reports in the list; a day or a window opens zoomed to it; a lane within a day or a window opens and zoomed.
function clearFilters() { for (const k of FILTERS) S.f[k].clear(); S.lanes.clear(); S.found = null; S.q = ''; $('q').value = '' }
async function openPlace(t) {
  if (t.r != null) return pick(t.r, true)
  if (t.lane != null || t.from != null) {
    clearFilters()
    S.open = t.lane != null ? t.lane : null
    if (t.from != null) {
      S.win = null
      setWin([t.from, t.to])
      return
    }
    S.win = null
    if (DEF && S.open != null) {
      let there = false
      for (let i = lowerBound(DEF[0]), z = lowerBound(DEF[1]); i < z && !there; i++) there = C.lane[i] === S.open
      if (!there) S.win = [...EXT]
    }
  }
  render()
}
thimble.onOpen(async (place) => {
  const t = (place && place.target) || {}
  if (t.r != null) S.keep = t.r
  if (!D || (t.r != null && !rowAt.has(t.r))) { if (!(await load())) return }
  await openPlace(t)
})
thimble.onLabels(async (state) => {
  const was = JSON.stringify([labelState.labels, labelState.filter])
  labelState = { labels: state.labels || [], filter: state.filter || null, all: state.all || null, palette: state.palette || null }
  if (!D) return
  if (openPop && openPop.relabel) openPop.relabel()
  if (JSON.stringify([labelState.labels, labelState.filter]) === was) { renderCtl(); return draw() }
  if (!(await load())) return
  if (S.sel != null && !rowAt.has(S.sel)) { S.sel = null; S.detail = null }
  render()
  if (S.sel != null) {
    try { const d = await thimble.fetch({ op: 'report', r: S.sel }, { key: 'report' }); if (d && d.row === S.sel) { S.detail = d; renderDetail() } } catch (e) { if (!e || e.name !== 'AbortError') throw e }
  }
})
</script>
