<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .chip, .btn), its Search, Rows, Filter by and Color by controls, its time range selector,
     the divider, the side panel and the theme's tokens come with the frame; this page lays out the control row, the
     overview (the range selector, the axis and the lanes), the list of the same lanes under it, and what the side panel
     holds: a lane's episodes and their reports, or one report in full */
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--surface-card); color: var(--text-primary); font: 400 var(--text-ui-sm) / 1.4 var(--font-body); font-variant-numeric: tabular-nums; }
  button { font: inherit; }
  .ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  #ctl { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; padding: 9px 14px; border-bottom: 1px solid var(--border-hairline); }
  .search { position: relative; flex: 0 1 170px; min-width: 110px; }
  .search .field { width: 100%; padding-left: 27px; }
  .search .ico { position: absolute; left: 8px; top: 50%; margin-top: -7px; color: var(--text-tertiary); pointer-events: none; }
  #chips { display: contents; }
  /* Color by takes the row's free width, and a line of its own when less than its least is left */
  #colour { flex: 1 1 300px; min-width: 240px; margin-left: 4px; }
  .chip .ico { width: 10px; height: 10px; }

  #main { flex: 1; min-height: 0; }
  #stack { display: flex; flex-direction: column; min-height: 0; }
  /* the overview: the range selector over the lanes' time, its readout in the lanes' gutter, the one axis, the lanes */
  /* as tall as its lanes need, up to a little over half the height, until the divider is moved */
  /* its lanes scroll inside it, so it grows no scrollbar of its own when the divider moves */
  #tl { position: relative; flex: 0 1 auto; max-height: 56%; min-height: 120px; display: flex; flex-direction: column; padding: 0 0 0 14px; overflow: hidden !important; }
  #top { flex: none; display: flex; align-items: center; padding: 10px 0 4px; }
  #rread { flex: none; width: var(--gut); min-width: 0; box-sizing: border-box; padding-right: 10px; white-space: normal; overflow: hidden; }
  #range { flex: none; }
  #axrow { flex: none; display: flex; }
  #axrow .pad { flex: none; width: var(--gut); }
  #axis { flex: none; }
  .sw { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }

  svg { display: block; overflow: visible; user-select: none; -webkit-user-select: none; }
  svg text { font: 400 10.5px var(--font-mono); fill: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  svg .grid { stroke: var(--border-hairline); }
  svg .major { stroke: rgba(var(--ink-rgb), 0.16); }
  svg .rule { stroke: rgba(var(--ink-rgb), 0.07); }

  #lanes { position: relative; flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding-bottom: 8px; scrollbar-width: thin; }
  #lanebox { position: relative; display: flex; }
  #gut { position: relative; flex: none; width: var(--gut); }
  #plot { flex: none; cursor: crosshair; }
  .lh { position: absolute; left: 0; right: 10px; display: flex; align-items: center; gap: 6px; box-sizing: border-box; padding-left: 6px; border-radius: 3px; cursor: pointer; }
  .lh .ln { flex: 1; min-width: 0; align-self: stretch; padding: 0; border: 0; background: none; color: var(--text-primary); font: 400 var(--text-xs) / 1.2 var(--font-body); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .lh:hover .ln { text-decoration: underline; text-underline-offset: 2px; }
  .lh .n { flex: none; color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .lh.zero .ln { color: var(--text-tertiary); }
  /* a gutter too narrow for the names and their counts keeps the names */
  #gut.tight .lh .n { display: none; }
  .lh.hot { background: var(--surface-hover); }
  .lh.iso { background: var(--surface-selected); }
  .lh.iso .ln { font-weight: 600; }
  #brush { position: absolute; top: 0; bottom: 0; display: none; background: rgba(var(--ink-rgb), 0.07); border-left: 1px solid var(--text-secondary); border-right: 1px solid var(--text-secondary); pointer-events: none; }
  /* the pointer's time, a thin line across the lanes; the span of the side panel's reports in view, a light tint */
  #cursor { position: absolute; top: 0; display: none; width: 1px; background: rgba(var(--ink-rgb), 0.45); pointer-events: none; }
  #span { position: absolute; top: 0; display: none; background: rgba(var(--ink-rgb), 0.06); box-shadow: inset 1px 0 0 rgba(var(--ink-rgb), 0.24), inset -1px 0 0 rgba(var(--ink-rgb), 0.24); pointer-events: none; }

  /* the list of the lanes, in the overview's order */
  #listsec { flex: 1 1 0; min-height: 90px; display: flex; flex-direction: column; }
  #listhead { flex: none; display: flex; align-items: baseline; gap: 8px; min-height: 34px; padding: 9px 14px 0; box-sizing: border-box; font-size: var(--text-xs); color: var(--text-secondary); white-space: nowrap; overflow: hidden; }
  #listhead b { color: var(--text-primary); font: 500 var(--text-ui-sm) / 1.3 var(--font-body); }
  #listhead .n { font-family: var(--font-mono); font-size: var(--text-mono-sm); color: var(--text-primary); }
  #listhead > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #listhead .s { color: var(--text-tertiary); }
  .cols { display: grid; align-items: center; column-gap: 12px; padding: 0 14px; }
  #listcols { flex: none; height: 26px; overflow: hidden; border-bottom: 1px solid var(--border-hairline); color: var(--text-tertiary); font: 400 var(--text-xs) / 1 var(--font-body); }
  #listcols span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* the list of lanes holds groups, which take no colour: the kit's plain track (colour.strip('#list')) */
  #list { position: relative; flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; }
  .lrow { height: 30px; box-sizing: border-box; border-bottom: 1px solid var(--border-hairline); cursor: pointer; }
  .lrow:hover { background: var(--surface-hover); }
  .lrow.sel, .lrow.sel:hover { background: var(--surface-selected); }
  .lrow.sel .nm { font-weight: 600; }
  .lrow > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .nm { font-size: var(--text-ui-sm); }
  .num { text-align: right; font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .lrow .t { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .lrow .t.last { text-align: right; }
  .sep-row { height: 8px; }
  .spark { display: block; width: 100%; height: 14px; }
  .empty { padding: 22px 14px; color: var(--text-tertiary); font-size: var(--text-xs); }
  #gut .empty { padding: 20px 0; white-space: nowrap; }

  /* the side panel: a lane's episodes, each a heading over its reports, the heading of the episode at the top held there */
  .eps, .ep-rows { position: relative; }
  .ep-stick { position: sticky; top: -10px; height: 0; z-index: 2; }
  .ep-stick .eh { top: 0; box-shadow: 0 6px 8px -8px rgba(var(--ink-rgb), 0.3); }
  .eh { position: absolute; left: 0; right: 0; box-sizing: border-box; padding: 6px 2px 4px 6px; border-bottom: 1px solid var(--border-subtle); background: var(--surface-card); cursor: pointer; }
  .eh .l1 { display: flex; align-items: baseline; gap: 8px; min-width: 0; height: 18px; }
  .eh .w { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 var(--text-xs) / 1.4 var(--font-body); }
  .eh:hover .w { text-decoration: underline; text-underline-offset: 2px; }
  .eh .d, .eh .n { flex: none; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .eh .l2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(60px, 0.45fr); align-items: center; gap: 10px; height: 14px; margin-top: 2px; }
  .er { position: absolute; left: 0; right: 0; box-sizing: border-box; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 2px 0 6px; border-bottom: 1px solid var(--border-hairline); cursor: pointer; overflow: hidden; }
  .er:hover { background: var(--surface-hover); }
  .er.sel, .er.sel:hover { background: var(--surface-selected); }
  .er .tm { flex: none; color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .er .gp { flex: none; width: 52px; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); text-align: right; }
  .er .rid { flex: none; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .er .cl { flex: none; font-size: var(--text-xs); color: var(--text-secondary); }
  .er .why { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-xs); }

  /* a report in full in the side panel */
  .det { padding: 2px 0 8px 8px; margin-left: -8px; }
  .det-back { margin: 0 0 8px -6px; }
  .det-back .ico { width: 12px; height: 12px; }
  .det-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .det-when { margin-top: 6px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-secondary); }
  .det-sec { margin-top: 12px; }
  .det-sec > .h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font: 500 var(--text-xs) / 1.3 var(--font-body); color: var(--text-tertiary); }
  .det-why { margin: 0; font: 400 var(--text-sm) / 1.5 var(--font-body); overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; }
  .facts dt { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.6 var(--font-mono); }
  .facts dd { margin: 0; min-width: 0; font-size: var(--text-ui-sm); line-height: 1.45; overflow-wrap: anywhere; }
  .facts dd.mono { font: 400 var(--text-mono-sm) / 1.6 var(--font-mono); }
  .url { display: flex; align-items: flex-start; gap: 4px; min-width: 0; }
  .url a { flex: 1; min-width: 0; color: var(--text-primary); font: 400 10.5px / 1.6 var(--font-mono); overflow-wrap: anywhere; text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), 0.4); text-underline-offset: 2px; cursor: pointer; }
  .ib { flex: none; width: 24px; padding: 0; }
  .det-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .det-acts .ico { width: 12px; height: 12px; }
  .marks { display: flex; flex-wrap: wrap; gap: 4px; }

  #tip { position: fixed; z-index: 2147482600; display: none; max-width: 300px; padding: 7px 9px; border-radius: var(--radius-ui); background: var(--surface-card); box-shadow: 0 0 0 1px rgba(var(--ink-rgb), 0.12), 0 10px 28px -14px rgba(var(--ink-rgb), 0.32); pointer-events: none; font: 400 var(--text-xs) / 1.45 var(--font-body); }
  #tip .h { font-weight: 500; }
  #tip .w { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); }
  #tip .k { display: flex; align-items: center; gap: 6px; }
  #tip .k .n { margin-left: auto; padding-left: 12px; font-family: var(--font-mono); font-size: var(--text-mono-sm); color: var(--text-secondary); }
  #tip .x { margin-top: 3px; color: var(--text-secondary); }
</style>
</head>
<body>
<div id="ctl">
  <label class="search"><svg class="ico" viewBox="0 0 24 24"><path d="M4 10.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M15.2 15.2L20 20"/></svg><input id="q" class="field" type="search" placeholder="Search reports" autocomplete="off" spellcheck="false"></label>
  <span id="rows"></span>
  <span id="filter"></span>
  <span id="chips"></span>
  <span id="colour"></span>
</div>
<div id="main">
  <div id="stack">
    <section id="tl">
      <div id="top"><div id="rread"></div><div id="range"></div></div>
      <div id="axrow"><div class="pad"></div><div id="axis"></div></div>
      <div id="lanes"><div id="lanebox"><div id="gut"></div><svg id="plot"></svg><div id="span"></div><div id="cursor"></div><div id="brush"></div></div></div>
    </section>
    <section id="listsec">
      <div id="listhead"></div>
      <div id="listcols" class="cols"></div>
      <div id="list" tabindex="-1"></div>
    </section>
  </div>
</div>
<div id="tip"></div>
<script>
'use strict'
// Activity Timeline: every report on one UTC time axis, a lane per data source (Rows picks another field or a label),
// under thimble's time range selector, which holds the whole span with its reports per moment in the Color by colors and
// a viewfinder over it; it opens on the whole span. The lanes show the range's reports per bin, stacked by the Color by
// choice, as bars whose height grows with the log of the count, and once the range is six hours or less each report is
// its own mark at its second. A drag on the lanes zooms to the span dragged, Ctrl or ⌘ with the wheel zooms around the
// pointer, a click on a bar zooms to its bin and a click on a lane's name chooses the lane. Under the overview the list
// holds the same lanes in the same order, each with its reports over its own span (a sparkline between its first and its
// last report), its count, its episodes and its mix of the Color by values; a drag on the divider between them moves it.
// A lane chosen opens its episodes in the side panel, the bursts of its reports less than two hours apart, each a heading
// over its reports; a report there opens in full in the panel. The span of the panel's reports in view is a light tint
// across the lanes.
// Rows, Filter by and Color by (thimble.rows, thimble.filterBy, thimble.colorBy) read a report's value of a field from
// its columns and of a label from the marks the reader hands it, so every label over the files groups, filters and
// colors the same way. Color by is the only color, and it colors the reports (the bars, the marks and the panel's report
// rows): a lane or an episode is never colored whole, it shows the mix of its reports' values as the kit's small
// proportion bar (thimble.mix), and the list of lanes has the kit's plain track. A value whose chip is off keeps its
// reports in the bars, the counts and the lists, in gray; Filter by is what hides them.
// Labels: the reader keeps only the reports the label filter keeps and hands each its marks; the lanes, their rows and
// the episodes carry their units as data-anchor, the panel's report rows their row's ref, so thimble marks them.
const slug = (thimble.view && thimble.view.slug) || 'activity-timeline'
const DAY = 86400
const TICKS_BELOW = 6 * 3600 // a window this short shows each report as its own mark
const MIN_SPAN = 60
const LANE_H = 18, SEP = 10 // a lane's height, and the space before the lanes of reports not included
const ERH = 30, EHH = 44 // a report's row and an episode's heading in the side panel
const SLICES = 40 // a sparkline's slices
const NONINC = new Set(['Review required', 'Background control'])
const COLS = ['r', 't', 'ln', 'sl', 'lane', 'confidence', 'disposition', 'broad_class', 'source_basis', 'catalog', 'why_included', 'mb']
const NO_CONF = 'No confidence'
const MONTH = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const WEEKDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
const BINS = [1, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, DAY, 2 * DAY, 7 * DAY]
const ICON = {
  x: 'M6 6l12 12M18 6L6 18', check: 'M5 12.5l4.5 4.5L19 7', left: 'M15 6l-6 6 6 6',
  file: 'M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5',
  copy: 'M9 9h10v11H9zM5 15V4h10', zoom: 'M4 10.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M15.2 15.2L20 20M10.5 7.5v6M7.5 10.5h6',
}
const ico = (n, c = 'ico') => `<svg class="${c}" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const fmt = (n) => n.toLocaleString('en-US')
const plural = (n, one, many = one + 's') => `${fmt(n)} ${n === 1 ? one : many}`
const pad2 = (n) => String(n).padStart(2, '0')
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
const $ = (id) => document.getElementById(id)

// ---------------------------------------------------------------- time (seconds since 1970, UTC)
const dt = (t) => new Date(t * 1000)
const isoDay = (t) => dt(t).toISOString().slice(0, 10)
const isoMin = (t) => dt(t).toISOString().slice(0, 16)
const isoSec = (t) => dt(t).toISOString().slice(0, 19) + 'Z'
const hms = (t) => dt(t).toISOString().slice(11, 19)
const hm = (t) => dt(t).toISOString().slice(11, 16)
const dmy = (t) => { const d = dt(t); return `${d.getUTCDate()} ${MONTH[d.getUTCMonth()]} ${d.getUTCFullYear()}` }
const dm = (t) => { const d = dt(t); return `${d.getUTCDate()} ${MONTH[d.getUTCMonth()]}` }
const monthStart = (t, k = 0) => { const d = dt(t); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + k, 1) / 1000 }
function spanWords(a, b) {
  // a window in words: its days, and its times when it is not whole days
  const whole = a % DAY === 0 && b % DAY === 0
  if (whole) {
    const last = b - DAY
    if (last === a) return `${WEEKDAY[dt(a).getUTCDay()]} ${dmy(a)}`
    if (a === monthStart(a) && b === monthStart(a, 1)) return `${MONTH[dt(a).getUTCMonth()]} ${dt(a).getUTCFullYear()}`
    return dt(a).getUTCFullYear() === dt(last).getUTCFullYear() ? `${dm(a)} – ${dmy(last)}` : `${dmy(a)} – ${dmy(last)}`
  }
  const sec = a % 60 || b % 60
  const tm = (t) => (sec ? hms(t) : hm(t))
  // a span that ends at midnight ends at 24:00 of its day
  if (isoDay(a) === isoDay(b - 1)) return `${dmy(a)}, ${tm(a)}–${b % DAY === 0 ? (sec ? '24:00:00' : '24:00') : tm(b)}`
  return `${dm(a)} ${tm(a)} – ${dm(b)} ${tm(b)}`
}
// an episode's span: its first report's day and time to its last report's time, the day again when it changes
function epWords(a, b) {
  const head = `${WEEKDAY[dt(a).getUTCDay()]} ${dmy(a)} ${hm(a)}`
  if (b <= a) return head
  return `${head} – ${isoDay(a) === isoDay(b) ? hm(b) : `${dm(b)} ${hm(b)}`}`
}
function dur(s) {
  s = Math.max(0, Math.round(s))
  if (s < 60) return `${s}s`
  if (s < 3600) return `${Math.floor(s / 60)}m ${pad2(s % 60)}s`
  if (s < DAY) return `${Math.floor(s / 3600)}h ${pad2(Math.floor((s % 3600) / 60))}m`
  return `${Math.floor(s / DAY)}d ${Math.floor((s % DAY) / 3600)}h`
}
function gapText(s) {
  if (s == null) return ''
  if (s < 60) return `+${s}s`
  if (s < 3600) return `+${Math.floor(s / 60)}m`
  return `+${Math.floor(s / 3600)}h ${pad2(Math.floor((s % 3600) / 60))}m`
}
const binStart = (t, b) => (b === 7 * DAY ? Math.floor((t - 4 * DAY) / b) * b + 4 * DAY : Math.floor(t / b) * b) // weeks from Monday

// ---------------------------------------------------------------- data
// The reader sends every report the label filter keeps as columns, a page at a time (COLS): r the reader's row, t the
// seconds since t0, ln and sl the report's lines in all-reports.csv and report-sources.csv, a column per field (an
// index into names) and mb its marks as bits.
let D = null, N = 0, C = null, T = new Float64Array(0)
let IDS = '', IDW = 8 // the start of each report's report_id, IDW characters each, one after another
let rowAt = new Map()
let loadSeq = 0
let labelState = { labels: [], filter: null, all: null, palette: null }
let EXT = [0, DAY] // the whole span of the data: the first report's UTC day to the end of the last report's
let GAP = 7200

const S = {
  q: '', found: null, // the search and the reader rows that hold it
  lane: null, // the chosen lane: its group's key
  view: 'episodes', // what the side panel shows: the lane's episodes, or one report in full
  sel: null, detail: null, // the report opened in full: its reader row and its fetched details
  keep: null, // a row a citation opened, kept whatever the label filter keeps
  epTop: 0, // the episodes' scroll, kept while a report shows in full
  span: null, // [t0, t1] of the panel's reports in view
}

async function load() {
  // the pages in turn (one holds every report unless the corpus grows); each column decoded from its differences
  // and its packed codes
  const my = ++loadSeq
  const parts = []
  let from = 0
  try {
    do {
      const page = await thimble.fetch({ op: 'overview', from, ...(S.keep != null ? { keep: [S.keep] } : {}) }, { key: 'overview' })
      if (my !== loadSeq) return false
      parts.push(page)
      from = page.next
    } while (from != null)
  } catch (e) {
    if (e && e.name === 'AbortError') return false
    throw e
  }
  const first = parts[0]
  const n = parts.reduce((s, p) => s + p.n, 0)
  const cols = Object.fromEntries(COLS.map((k) => [k, new Int32Array(n)]))
  const t = new Float64Array(n)
  const A = first.alphabet, at = new Int16Array(128).fill(0)
  for (let k = 0; k < A.length; k++) at[A.charCodeAt(k)] = k
  let o = 0
  for (const p of parts) {
    let r = p.start - 1, tt = 0, ln = 0, sl = 0
    for (let j = 0; j < p.n; j++) {
      r += p.r ? p.r[j] : 1; tt += p.t[j]; ln += p.ln[j]
      if (p.sl[j]) sl += p.sl[j]
      cols.r[o + j] = r; t[o + j] = first.t0 + tt; cols.ln[o + j] = ln; cols.sl[o + j] = p.sl[j] ? sl : 0
    }
    for (const [f, { w, s: str }] of Object.entries(p.codes)) {
      const col = cols[f]
      if (!col) continue
      for (let j = 0; j < p.n; j++) { let v = 0; for (let k = 0; k < w; k++) v = v * 64 + at[str.charCodeAt(j * w + k)]; col[o + j] = v }
    }
    for (const [j, bits] of p.mb) cols.mb[o + j] = bits
    o += p.n
  }
  D = first
  N = n
  C = cols
  T = t
  GAP = first.gap || 7200
  IDW = first.id_chars || 8
  IDS = parts.map((p) => p.ids || ''.padEnd(p.n * IDW)).join('')

function valuesUnder(by) {

// ---------------------------------------------------------------- Rows and Filter by

let rows = null, filter = null
function controls() {

// Rows: the lanes, each report's group (GRP) an index into GROUPS, {key, name, value, unit, non}; a data source's lanes

    const at = new Map()

// ---------------------------------------------------------------- the lanes and their rows: one pass over the reports
// The lanes with a report that passes the filters, in Rows' order, each LANE_H high, a gap before the lanes of reports
// not included; the whole span shows every such lane (and every class of a label), a range those with a report in it

// value.
let layout = null

// ---------------------------------------------------------------- the timeline

let measure = null

}

const X = (t) => { const [a, b] = W(); return ((t - a) / (b - a)) * PW }

// the lanes: bars per bin, or each report's mark in a short window

  for (const r of lanes) s += `<line class="rule" x1="0" x2="${PW}" y1="${r.y + r.h - 0.5}" y2="${r.y + r.h - 0.5}"/>`
  if (mode === 'bars') {

    const e = EP.eps[+head.dataset.k]
    if (!e) return
    const a = T[e.ix[0]], b = T[e.ix[e.ix.length - 1]], pad = Math.max(300, (b - a) * 0.08)
    return setWin([a - pad, b + pad + 1])
  }
  const row = ev.target.closest('.er')
  if (row) openReport(C.r[+row.dataset.i], true)
})
// the chosen lane's name in the overview and its row in the list, scrolled into view when they are out of it
function revealLane() {
  const g = groupOfLane()
  if (g < 0 || !layout) return
  const r = layout.rows.find((x) => x.g === g)
  const lanes = $('lanes')
  if (r && (r.y < lanes.scrollTop || r.y + r.h > lanes.scrollTop + lanes.clientHeight)) lanes.scrollTop = Math.max(0, r.y - lanes.clientHeight / 2)
  const row = $('list').querySelector(`.lrow[data-g="${g}"]`), list = $('list')
  if (row && (row.offsetTop < list.scrollTop || row.offsetTop + row.offsetHeight > list.scrollTop + list.clientHeight)) list.scrollTop = Math.max(0, row.offsetTop - list.clientHeight / 2)
}
function closeSide() { if (side.isOpen) side.close(); S.span = null; placeSpan() }
function forgetSide() { S.lane = null; S.view = 'episodes'; S.sel = null; S.detail = null; S.span = null }
// a lane chosen in the overview or the list: its episodes in the panel; the lane chosen again closes it
function chooseLane(g) {
  const key = GROUPS[g] ? GROUPS[g].key : null
  if (key == null) return
  if (S.lane === key && side.isOpen && S.view === 'episodes') { forgetSide(); closeSide(); return draw() }
  S.lane = key
  S.view = 'episodes'
  S.sel = null
  S.detail = null
  draw()
}

// ---------------------------------------------------------------- a report in full in the side panel
async function openReport(r, fromList) {
  const i = rowAt.get(r)
  if (i == null) return
  if (fromList && side.body) S.epTop = side.body.scrollTop
  else S.epTop = null
  S.lane = GROUPS[GRP[i]] ? GROUPS[GRP[i]].key : S.lane
  S.sel = r
  S.view = 'detail'
  S.detail = null
  if (!(T[i] >= W()[0] && T[i] < W()[1])) range.set(null)
  draw()
  if (!fromList) revealLane()
  let d = null
  try { d = await thimble.fetch({ op: 'report', r, ...(S.keep != null ? { keep: [S.keep] } : {}) }, { key: 'report' }) } catch (e) { if (e && e.name === 'AbortError') return; throw e }
  if (S.sel !== r) return
  S.detail = d
  drawDetail()
}
function backToEpisodes() {
  const top = S.epTop
  S.view = 'episodes'
  S.sel = null
  S.detail = null
  draw(false, top)
}
const facts = (rows) => `<dl class="facts">${rows.filter(([, v]) => v != null && v !== '').map(([k, v, mono]) => `<dt>${esc(k)}</dt><dd${mono ? ' class="mono"' : ''}>${esc(Array.isArray(v) ? v.join(', ') : v)}</dd>`).join('')}</dl>`
function section(title, part, keys, monoKeys = []) {
  if (!part) return ''
  const rec = part.record || part
  return `<div class="det-sec" data-anchor="${esc(part.ref)}" data-anchor-text="${esc(title)}"><div class="h">${esc(title)}<button type="button" class="chip chip-tone-evidence chip-act" data-file="${esc(part.ref)}" title="Open ${esc(part.ref)} in the File browser">${ico('file')}${esc(String(part.ref).split('#')[0].split('/').pop())}</button></div>${facts(keys.map((k) => [k, rec[k], monoKeys.includes(k)]))}</div>`
}
function drawDetail() {
  const i = rowAt.get(S.sel)
  if (i == null) return
  const d = S.detail && S.detail.row === S.sel ? S.detail : null
  const g = GRP[i]
  const conf = name('confidence', C.confidence[i]) || NO_CONF
  const tag = (t) => `<span class="chip chip-tone-neutral">${esc(t)}</span>`
  const tags = `${tag(conf)}${tag(name('disposition', C.disposition[i]))}${tag(name('broad_class', C.broad_class[i]))}${name('catalog', C.catalog[i]) === 'supplemental' ? tag('supplemental catalog') : ''}`
  const when = `${WEEKDAY[dt(T[i]).getUTCDay()]} ${dmy(T[i])} · ${hms(T[i])} UTC`
  let body = '<div class="det-sec empty">Reading the report</div>'
  if (d) {
    const marks = (d.marks || []).length ? `<div class="det-sec"><div class="h">Labels</div><div class="marks">${d.marks.map((m) => { const l = labelOf(m.id) || (labelState.all || []).find((x) => x.name === m.label); return `<span class="chip chip-key" data-label="${esc(l ? l.id : '')}" style="--c:${esc(m.colour)}"><span class="chip-sw"></span><span class="chip-text">${esc(m.label === m.value ? m.label : `${m.label}: ${m.value}`)}</span></span>` }).join('')}</div></div>` : ''
    body = `<div class="det-sec"><div class="h">why_included</div><p class="det-why">${esc(d.why_included || '')}</p></div>`
      + (d.caveat ? `<div class="det-sec"><div class="h">caveat</div><p class="det-why">${esc(d.caveat)}</p></div>` : '')
      + section('Source row', d.source, ['data_source', 'source_basis', 'matched_sources'], ['source_basis'])
      + section('Selection provenance', d.provenance, ['source_batch', 'group', 'source', 'record_kind', 'selection_basis', 'description'], ['source_batch', 'record_kind', 'selection_basis'])
      + section('Supplemental decision', d.supplement, ['source_batch', 'disposition', 'confidence', 'broad_class', 'basis', 'reason', 'classification_provenance'], ['source_batch', 'basis'])
      + section('Confidence change', d.override, ['episode', 'previous_confidence', 'confidence', 'basis', 'reason', 'unchanged_fields'], ['basis'])
      + marks
      + `<div class="det-sec">${facts([['report_id', d.report_id, true], ['report_date_utc', d.report_date_utc, true], ['timestamp_precision', d.timestamp_precision, true]])}<dl class="facts" style="margin-top:3px"><dt>report_url</dt><dd><div class="url"><a href="${esc(d.report_url || '')}" data-url title="${esc(d.report_url || '')}, an outside page: a click copies it">${esc(d.report_url || '')}</a><button class="btn btn-ghost btn-sm ib" type="button" data-copy title="Copy the address" aria-label="Copy the address">${ico('copy')}</button></div></dd></dl></div>`
  }
  const back = `<button class="btn btn-ghost btn-sm det-back" type="button" data-back>${ico('left')}${esc(sideTitle(g))} · episodes</button>`
  // the same report drawn again keeps where its details were scrolled
  const keep = side.isOpen && side.ref === refOf(i) ? side.body.scrollTop : 0
  side.open({
    title: sideTitle(g), sub: `report ${idOf(i)} · ${dmy(T[i])} ${hms(T[i])}`, ref: refOf(i),
    html: `${back}<div class="det" data-anchor="${esc(refOf(i))}" data-anchor-text="${esc(laneName(C.lane[i]))} · ${dmy(T[i])} ${hms(T[i])} UTC · ${esc(conf)}"><div class="det-tags">${tags}</div><div class="det-when">${when}</div>${body}<div class="det-acts"><button class="btn btn-secondary btn-sm" type="button" data-near>${ico('zoom')}The hour around it</button><button class="btn btn-secondary btn-sm" type="button" data-file="${esc(refOf(i))}">${ico('file')}Its row in the file</button></div></div>`,
  })
  if (keep) side.body.scrollTop = keep
  S.span = null
  placeSpan()
}
function detailClick(ev) {
  const b = ev.target.closest('button, a')
  if (!b) return
  const i = rowAt.get(S.sel)
  if (b.dataset.back != null) return backToEpisodes()
  if (b.dataset.file) return thimble.navigate(b.dataset.file, { browser: true })
  if (b.dataset.near != null && i != null) { const m = Math.floor(T[i] / 60) * 60; return setWin([m - 1800, m + 1800]) }
  if (b.dataset.url != null || b.dataset.copy != null) {
    ev.preventDefault()
    const a = side.body.querySelector('[data-url]')
    if (!a) return
    const rg = document.createRange(); rg.selectNodeContents(a)
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg)
    let ok = false
    try { ok = document.execCommand('copy') } catch { ok = false }
    if (b.dataset.copy != null) { b.title = ok ? 'Copied' : 'Selected: press ⌘C to copy'; b.innerHTML = ico(ok ? 'check' : 'copy') }
  }
}

// ---------------------------------------------------------------- render
let frame = null
function schedule() { if (frame == null) frame = requestAnimationFrame(() => { frame = null; draw() }) }
// everything drawn again from the state: the counts, the lanes, the list and the side panel; `fresh` starts the
// panel's episodes at their top
function draw(fresh, keepTop) {
  if (!D) return
  chipCounts()
  filterCounts()
  layout = laneLayout()
  sizes()
  renderAxis(); renderLanes()
  renderList()
  if (S.lane != null) drawSide(keepTop != null ? keepTop : fresh || !side.isOpen ? 0 : side.body.scrollTop)
  else { closeSide() }
}
function render() {
  if (!D) return
  renderCtl(); overview(); draw()
}
// a change of what is in scope: the overview's records again, and the lists from their tops
function rescope() { $('list').scrollTop = 0; renderCtl(); overview(); draw(true) }
let typing = null
$('q').addEventListener('input', (e) => {
  clearTimeout(typing)
  typing = setTimeout(async () => {
    const q = e.target.value.trim()
    S.q = q
    if (!q) {
      S.found = null
      if (searchWin !== undefined) { const w = searchWin; searchWin = undefined; range.set(w[0], w[1]) }
    } else {
      let res
      try { res = await thimble.fetch({ op: 'search', q }, { key: 'search' }) } catch (err) { if (err && err.name === 'AbortError') return; throw err }
      if (S.q !== q) return
      S.found = new Set(res.rows)
      // a search whose hits all lie outside the range shows the whole span; one with no hit keeps the range
      const inside = (w) => res.rows.some((r) => { const i = rowAt.get(r); return i != null && T[i] >= w[0] && T[i] < w[1] })
      if (res.rows.length && !isWhole() && !inside(W())) { const w = [range.from, range.to]; range.set(null); searchWin = w }
    }
    rescope()
  }, 220)
})
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || !side.isOpen || e.defaultPrevented) return
  if (S.view === 'detail') return backToEpisodes()
  forgetSide(); closeSide(); draw()
})
// the gutter is measured in the page's faces, so it is laid out again once they have loaded
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (D) render() })
// the overview and the list laid out again when their width changes: the window, or the side panel opening or closing
let resizeTimer = null, laidW = -1
new ResizeObserver(() => {
  const w = $('stack').clientWidth
  if (w === laidW) return
  laidW = w
  clearTimeout(resizeTimer)
  resizeTimer = setTimeout(() => { if (D) { sizes(); renderAxis(); renderLanes(); renderList(); renderEpisodes() } }, 60)
}).observe($('stack'))

// ---------------------------------------------------------------- places
// A report opens in full in the side panel, in its lane, the search that would drop it cleared; a lane opens with its
// episodes, a data source's under Rows by data source; an episode opens its lane zoomed to it; a day or a window opens
// zoomed to it.
function clearSearch() { S.found = null; S.q = ''; searchWin = undefined; $('q').value = '' }
async function openPlace(t) {
  if (t.r != null) {
    const i = rowAt.get(t.r)
    if (i != null && !passes(i)) clearSearch()
    renderCtl(); overview()
    return openReport(t.r)
  }
  if (t.lane != null) {
    clearSearch()
    if (rows && (!rows.by || rows.by.field !== 'lane')) { rows.choose('lane'); assignGroups() }
    S.lane = 'l' + t.lane
    S.view = 'episodes'
    S.sel = null
  }
  renderCtl(); overview()
  if (t.from != null) { setWin([t.from, t.to]); requestAnimationFrame(revealLane); return }
  if (t.lane != null) range.set(null)
  draw(true)
  revealLane()
}
thimble.onOpen(async (place) => {
  const t = (place && place.target) || {}
  if (t.r != null) S.keep = t.r
  if (!D || (t.r != null && !rowAt.has(t.r))) { if (!(await load())) return }
  await openPlace(t)
})
thimble.onLabels(async (state) => {
  const was = JSON.stringify([labelState.labels, labelState.filter])
  labelState = { labels: state.labels || [], filter: state.filter || null, all: state.all || null, palette: state.palette || null }
  if (!D) return
  if (JSON.stringify([labelState.labels, labelState.filter]) === was) { renderCtl(); assignAll(); return draw() }
  if (!(await load())) return
  if (S.sel != null && !rowAt.has(S.sel)) { S.sel = null; S.detail = null; S.view = 'episodes' }
  render()
  if (S.sel != null && S.view === 'detail') openReport(S.sel, false)
})
</script>
