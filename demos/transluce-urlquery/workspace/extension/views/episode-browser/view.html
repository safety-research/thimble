<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .chip, .btn, .seg, .table), its Color by control, its time range selector and the theme's
     tokens come with the frame; this page lays out a control row, the time range over every episode, the lanes of the
     episodes in the range, and the list of episodes, an episode opening under its row */
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--surface-card); color: var(--text-primary); font: 400 var(--text-ui-sm) / 1.4 var(--font-body); }
  .ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .dim { color: var(--text-tertiary); }

  /* the control row */
  #bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 9px 14px; border-bottom: 1px solid var(--border-hairline); }
  .fbtn { flex: none; padding: 0 7px 0 9px; }
  .fbtn .ico { width: 12px; height: 12px; color: var(--text-tertiary); }
  .fbtn .k { color: var(--text-secondary); }
  .fbtn .v { font-weight: 500; }
  .fbtn .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .fbtn .clr { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-right: -3px; border-radius: 4px; color: var(--text-tertiary); }
  .fbtn .clr:hover { background: var(--track-bg); color: var(--text-primary); }
  .chip .ico { width: 10px; height: 10px; }
  /* the Color by control takes the row's free width, and a line of its own when less than its least is left */
  #colour { flex: 1 1 320px; min-width: 260px; margin-left: 4px; }
  .sw { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }

  /* the page under the control row: the strip above, the list and the open episode below, though the list comes
     first in the document */
  #body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #strip { order: 1; flex: none; position: relative; padding: 8px 0 2px 0; border-bottom: 1px solid var(--border-hairline); }
  /* the time range: its readout in the lanes' name column, the overview over the lanes' time */
  #rhead { position: relative; display: flex; align-items: center; min-height: 40px; padding-bottom: 6px; }
  #rread { flex: none; box-sizing: border-box; padding: 0 10px 0 14px; overflow: hidden; }
  #rread .thimble-range-dates { white-space: normal; }
  #range { flex: none; }
  #lanes { position: relative; }
  #axis { margin-top: 1px; }
  #main { order: 2; flex: 1; min-height: 0; display: flex; position: relative; }

  #gut { position: absolute; left: 0; top: 0; }
  .lane { position: absolute; left: 0; display: flex; align-items: center; gap: 6px; box-sizing: border-box; padding: 0 10px 0 14px; color: var(--text-primary); font: 400 var(--text-xs) / 1 var(--font-body); cursor: pointer; white-space: nowrap; }
  .lane:hover .nm { text-decoration: underline; text-underline-offset: 2px; }
  .lane .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .lane .n { flex: none; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .lane.sel .nm { font-weight: 600; }
  .lane.other { color: var(--text-secondary); }
  #plot { display: block; overflow: visible; user-select: none; -webkit-user-select: none; }
  #plot text { font: 400 10.5px var(--font-mono); fill: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  #plot text.maj { fill: var(--text-secondary); }
  #plot .lanerule { stroke: rgba(var(--ink-rgb), 0.06); }
  #plot .sep { stroke: rgba(var(--ink-rgb), 0.18); }
  #plot .axis { stroke: rgba(var(--ink-rgb), 0.22); }
  #plot .grid { stroke: rgba(var(--ink-rgb), 0.07); }
  #plot .squeeze { fill: rgba(var(--ink-rgb), 0.045); }
  #plot .month { fill: rgba(var(--ink-rgb), 0.022); }
  #plot .brk { stroke: var(--text-tertiary); stroke-width: 1.2; fill: none; }
  #plot .dot { cursor: pointer; }
  #plot .dot.hl > :first-child { stroke: var(--text-primary); stroke-width: 1.5; stroke-opacity: 1; }
  #plot .gline { stroke: var(--text-primary); stroke-opacity: 0.35; pointer-events: none; }

  /* the list of episodes */
  #list { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
  .lhead { flex: none; display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 14px; }
  .lhead .count { flex: none; color: var(--text-secondary); font-size: var(--text-xs); white-space: nowrap; }
  .ckeys { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--text-secondary); font-size: var(--text-xs); white-space: nowrap; }
  .ckey { display: inline-flex; align-items: center; gap: 5px; }
  .ckey .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .ckeys[hidden] { display: none; }
  #rtbl .sw, .ckey .sw { box-shadow: inset 0 0 0 1px rgba(var(--ink-rgb), 0.16); }
  .lhead .count b { color: var(--text-primary); font: 500 var(--text-mono-sm) / 1 var(--font-mono); }
  .lhead .seg { flex: none; margin-left: auto; }
  #allBtn { flex: none; gap: 4px; }
  #allBtn .ico { width: 12px; height: 12px; transition: transform 0.12s; }
  #allBtn[aria-expanded='true'] .ico { transform: rotate(180deg); }
  /* every episode in view, summed up: how many and their reports, by size, and the sources with the most reports */
  #all { flex: none; display: grid; grid-template-columns: max-content minmax(220px, 1fr) minmax(240px, 1.2fr); gap: 6px 32px; padding: 6px 14px 12px; border-bottom: 1px solid var(--border-hairline); }
  #all[hidden] { display: none; }
  #all .facts { display: grid; grid-template-columns: max-content; align-content: start; gap: 6px 22px; }
  #all .fact .k, #all .cap { color: var(--text-tertiary); font: 400 var(--text-xs) / 1.3 var(--font-body); }
  #all .fact .v { font: 500 var(--text-ui-sm) / 1.35 var(--font-mono); font-variant-numeric: tabular-nums; }
  #all .cap { margin-bottom: 3px; }
  #all .grid { display: grid; grid-template-columns: minmax(0, max-content) minmax(40px, 1fr) max-content max-content; align-items: center; gap: 2px 10px; font: 400 var(--text-xs) / 1.45 var(--font-body); }
  #all .grid .r { text-align: right; font: 400 var(--text-mono-sm) / 1.45 var(--font-mono); font-variant-numeric: tabular-nums; }
  #all .grid .h { color: var(--text-tertiary); }
  #all .grid .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #all .grid .b { display: block; height: 7px; border-radius: 1px; background: var(--viz-ink-3); }
  #all .grid .gs { cursor: pointer; }
  #all .grid .gs:hover { text-decoration: underline; text-underline-offset: 2px; }
  .scroll { flex: 1; min-height: 0; overflow: auto; }
  #tbl { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
  #tbl th { cursor: pointer; user-select: none; }
  #tbl th:hover { color: var(--text-primary); }
  #tbl th.on { color: var(--text-primary); }
  #tbl th .ar { display: inline-block; width: 8px; margin-left: 2px; }
  #tbl th, #tbl td, #tbl-measure th, #tbl-measure td { padding-left: 5px; padding-right: 5px; }
  #tbl-measure th, #tbl-measure td { white-space: nowrap; }
  #tbl-measure td.src { padding-left: 14px; font: 400 var(--text-ui-sm) / 1.4 var(--font-body); }
  #tbl th:first-child, #tbl td:first-child { padding-left: 14px; }
  #tbl td.se { padding-top: 3px; padding-bottom: 3px; line-height: 1.3; }
  #tbl td.se span { display: block; overflow: hidden; text-overflow: ellipsis; }
  #tbl td.se .to { color: var(--text-tertiary); }
  #tbl td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #tbl td.src { font: 400 var(--text-ui-sm) / 1.4 var(--font-body); }
  #tbl td.t { color: var(--text-secondary); }
  #tbl .num, #tbl th.num { text-align: right; }
  #tbl tbody tr.active > td { background: var(--surface-selected); }
  #tbl tbody tr.active > td.src { font-weight: 600; }
  .none { color: var(--text-tertiary); }
  .mix { display: flex; height: 8px; border-radius: 2px; overflow: hidden; background: rgba(var(--ink-rgb), 0.06); }
  .mix i { display: block; height: 100%; }
  .mix i + i { box-shadow: inset 1px 0 0 var(--surface-card); }
  .spark { display: block; width: 100%; height: 14px; }
  .mk { display: flex; height: 8px; border-radius: 2px; overflow: hidden; background: rgba(var(--ink-rgb), 0.08); }
  .mk i { display: block; height: 100%; }
  .empty { padding: 28px 14px; color: var(--text-tertiary); font-size: var(--text-xs); }
  .empty .btn { margin-left: 8px; }

  /* the open episode, a row of the list under the episode's own */
  #tbl tbody tr.epx > td { padding: 0; cursor: default; white-space: normal; overflow: visible; background: var(--surface-card); border-bottom: 1px solid var(--border-strong); }
  #tbl tbody tr.epx:hover > td { background: var(--surface-card); }
  #tbl tbody tr.active > td { border-bottom-color: transparent; }
  #ep { display: flex; flex-direction: column; min-width: 0; padding-bottom: 6px; }
  #rtbl tr.more > td { height: 1px; padding: 0; border: 0; }
  .ep-head { flex: none; padding: 10px 14px 8px; }
  .ep-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ep-top h2 { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 var(--text-sm) / 1.3 var(--font-body); }
  .ep-top .grow { flex: 1; }
  .ep-top .btn { padding: 0 5px; }
  .ep-when { margin-top: 2px; color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 8px; }
  .stat { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .stat .k { color: var(--text-tertiary); font: 400 var(--text-xs) / 1.2 var(--font-body); white-space: nowrap; }
  .stat .v { font: 500 var(--text-ui-sm) / 1.3 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat .v small { color: var(--text-tertiary); font-weight: 400; font-size: var(--text-xs); }
  .ep-mix { display: flex; align-items: center; gap: 12px; margin-top: 9px; }
  .ep-mix .mix { flex: 1 1 120px; max-width: 260px; height: 10px; }
  .ep-mix .keys { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--text-secondary); font-size: var(--text-xs); }
  #rate { flex: none; padding: 2px 14px 4px; }
  #rate svg { display: block; overflow: visible; }
  #rate text { font: 400 10px var(--font-mono); fill: var(--text-tertiary); }
  #rate .bin { cursor: pointer; }
  #rate .bin:hover rect { opacity: 0.8; }
  #rate .base { stroke: rgba(var(--ink-rgb), 0.2); }
  /* the open episode's reports run on in the list, their header held under the list's while they scroll */
  #rtbl thead th { top: var(--thead-h, 30px); }
  #rtbl { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
  #rtbl th:first-child, #rtbl td:first-child { padding-left: 14px; }
  #rtbl td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #rtbl td.gap { text-align: right; color: var(--text-tertiary); }
  #rtbl td.gap.fast { color: var(--text-primary); }
  #rtbl td.why { font: 400 var(--text-xs) / 1.4 var(--font-body); color: var(--text-secondary); }
  #rtbl td.cl { font-family: var(--font-body); font-size: var(--text-xs); }
  #rtbl td.cl .sw { margin-right: 6px; vertical-align: -1px; }
  #rtbl td.cf { font-family: var(--font-body); font-size: var(--text-xs); }
  #rtbl td.cf.sig { font-weight: 600; }
  #rtbl td.cf.sug { color: var(--text-secondary); }
  #rtbl td.lnk { padding-right: 10px; text-align: right; }
  #rtbl tr.day > td { padding: 10px 14px 4px; cursor: default; border-bottom: 1px solid var(--border-strong); font: 500 var(--text-ui-sm) / 1.3 var(--font-body); }
  #rtbl tr.day .n { margin-left: 8px; font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-tertiary); }
  #rtbl tbody tr.day:hover, #rtbl tbody tr.det:hover, #rtbl tbody tr.more:hover { background: none; }
  #rtbl tr.sel > td { background: var(--surface-selected); }
  #rtbl tr.det > td { padding: 4px 14px 14px; background: var(--surface-selected); white-space: normal; cursor: default; font-family: var(--font-body); }
  #rtbl tr.flash > td { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: rgba(var(--ink-rgb), 0.12); } to { background: transparent; } }
  a.ext { display: inline-grid; place-items: center; width: 20px; height: 18px; border-radius: 4px; color: var(--text-tertiary); vertical-align: middle; }
  a.ext:hover { background: var(--track-bg); color: var(--text-primary); }
  a.ext .ico { width: 13px; height: 13px; }

  .det-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px 22px; }
  .det-sec h4 { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; font: 500 var(--text-ui-sm) / 1.3 var(--font-body); }
  .det-sec h4 .chip { margin-left: auto; }
  .det-sec dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 0; }
  .det-sec dt { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.45 var(--font-mono); }
  .det-sec dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font: 400 var(--text-ui-sm) / 1.45 var(--font-body); }
  .det-sec dd.mono { font: 400 var(--text-mono-sm) / 1.45 var(--font-mono); }
  .det-sec dd .copy { width: 24px; margin: -3px 0 -3px 4px; padding: 0; vertical-align: middle; }
  .det-sec dd .copy .ico { width: 12px; height: 12px; }
  .det-sec.wide { grid-column: 1 / -1; }

  .pop { position: fixed; z-index: 60; min-width: 200px; max-width: 320px; max-height: 72vh; overflow: auto; padding: 4px; border-radius: var(--radius-ui); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), 0.14); font: 400 var(--text-ui-sm) / 1.3 var(--font-body); }
  .pop .head { padding: 8px 8px 4px; font: 500 var(--text-xs) / 1 var(--font-body); color: var(--text-tertiary); }
  .pop .sep { height: 1px; margin: 4px 0; background: var(--border-hairline); }
  .pop .note { padding: 4px 8px 6px; color: var(--text-tertiary); }
  .pop .find { display: block; width: calc(100% - 8px); margin: 4px; box-sizing: border-box; }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: none; color: var(--text-primary); font: inherit; text-align: left; cursor: pointer; }
  .item:hover { background: var(--surface-hover); }
  .item:disabled { cursor: default; opacity: 0.5; }
  .item .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .box { display: inline-grid; place-items: center; flex: none; width: 14px; height: 14px; box-sizing: border-box; border: 1.5px solid rgba(var(--ink-rgb), 0.35); border-radius: 3px; }
  .box.on { border-color: var(--text-primary); background: var(--text-primary); }
  .box.on::after { content: ''; width: 6px; height: 3px; margin-top: -2px; border: solid var(--surface-card); border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg); }
  .range { display: flex; align-items: center; gap: 6px; padding: 4px 8px 8px; color: var(--text-secondary); font-size: var(--text-xs); }
  .range .field { width: 132px; }
  .range .field.num { width: 72px; }
  .pop .seg { margin: 2px 8px 8px; }

  #tip { position: fixed; z-index: 70; display: none; max-width: 300px; padding: 7px 9px; border-radius: var(--radius-ui); background: var(--surface-card); box-shadow: 0 0 0 1px rgba(var(--ink-rgb), 0.12), 0 10px 28px -14px rgba(var(--ink-rgb), 0.32); pointer-events: none; font: 400 var(--text-xs) / 1.45 var(--font-body); }
  #tip b { font-weight: 600; }
  #tip .m { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.45 var(--font-mono); }
  #tip .tep.more { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border-hairline); }
  #toast { position: fixed; z-index: 80; left: 50%; bottom: 14px; transform: translateX(-50%); display: none; padding: 6px 10px; border-radius: var(--radius-ui); background: var(--surface-inverse); color: var(--text-on-inverse); font: 400 var(--text-xs) / 1.3 var(--font-body); }
</style>
</head>
<body>
<header id="bar">
  <button id="f-src" class="field fbtn" type="button" aria-haspopup="menu" aria-expanded="false"></button>
  <button id="f-size" class="field fbtn" type="button" aria-haspopup="menu" aria-expanded="false"></button>
  <span id="colour"></span>
</header>
<div id="body">
  <main id="main">
    <section id="list">
      <div class="lhead" id="lhead"><span class="count" id="count"></span><button class="btn btn-secondary btn-sm" id="allBtn" type="button" aria-expanded="false" aria-controls="all"></button><span class="ckeys" id="ckeys"></span><span class="seg seg-track" id="sortSeg"><button class="seg-opt" data-sort="n" type="button">Largest first</button><button class="seg-opt" data-sort="start" type="button">In time order</button></span></div>
      <div id="all" hidden></div>
      <div class="scroll" id="lscroll" tabindex="-1">
        <table id="tbl" class="table">
          <colgroup id="cols"></colgroup>
          <thead><tr id="thead"></tr></thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
    </section>
  </main>
  <section id="strip">
    <div id="rhead"><div id="rread"></div><div id="range"></div></div>
    <div id="lanes"><div id="gut"></div><svg id="plot"></svg></div>
    <div id="axis"></div>
  </section>
</div>
<div id="tip"></div>
<div id="toast" role="status"></div>
<script>
'use strict'
// Episode Browser: the catalog as episodes, the reports of one data source less than two hours apart. thimble's time
// range selector holds every episode's start over the whole span, and its viewfinder picks the time the page shows; the
// lanes under it show each episode in that time as a dot at its start, one lane per data source, sized by its reports;
// the list holds one row per episode that starts in the range, sorted by size or time; a click opens an episode under
// its row with its reports in time order and their rate, and a click on a report opens it in full under its own row.
// "All episodes" sums up the episodes in view above the list. The control row narrows by source and by the least size
// of an episode, and holds thimble's Color by control, whose chips filter by any field it colors by, and its Reset.
// Color: the Color by control (thimble.colorBy) colors by confidence, class, disposition, source basis or cohort, or
// by a label; the reader gives each report its value and each episode its reports per value, which color the dots,
// the overview, the list's color bars, the rate chart and a report row's left edge. A value whose chip is off leaves
// the counts. The broad classes are drawn in grey inks only, so the Color by choice is the page's one color.
// Labels: the reader counts only the reports the label filter keeps. List rows and dots carry their episode as
// data-anchor, report rows their catalog row, so thimble marks them.
const slug = (thimble.view && thimble.view.slug) || 'episode-browser'
const unitRef = (key) => `view:${slug}/${key}`
const CLS = [['sr', 'source_request'], ['ind', 'indirection'], ['cp', 'custom_program']]
const CLS_NAME = Object.fromEntries(CLS)
const CLS_KEY = Object.fromEntries(CLS.map(([k, n]) => [n, k]))
// the broad classes in three inks, light to dark from a direct request to a submitted program, in every state, so the
// labels' colours stay the page's only colours
const INK = { sr: '--viz-ink-4', ind: '--viz-ink-2', cp: '--viz-ink-1' }
const DISP = [['all', 'All'], ['included', 'Included'], ['review_required', 'Needs review'], ['background', 'Background']]
const TAIL = ['No source row', 'Needs review', 'Background control'] // lanes at the strip's foot, in this order
const MONTH = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const WEEKDAY = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
const LH = 16 // a lane's height
const RMAX = 7.5 // the largest dot's radius, so a dot stays inside its lane
const ROWS = 200 // an episode's reports drawn before Show more
const DAY = 86400
const ICON = {
  down: 'M6 9l6 6 6-6', x: 'M6 6l12 12M18 6L6 18', left: 'M15 6l-6 6 6 6', right: 'M9 6l6 6-6 6',
  file: 'M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5',
  ext: 'M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5',
  copy: 'M9 9h10v11H9zM5 15V4h10', tag: 'M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9-9-9zM8 8h.01', plus: 'M12 5v14M5 12h14',
  pencil: 'M4 20h4L19 9l-4-4L4 16v4z',
}
const ico = (n, c = 'ico') => `<svg class="${c}" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const num = (n) => Number(n || 0).toLocaleString('en-US')
const plural = (n, one, many = one + 's') => `${num(n)} ${n === 1 ? one : many}`
const pad2 = (n) => String(n).padStart(2, '0')
const $ = (id) => document.getElementById(id)

// ---------------------------------------------------------------- time (t in seconds since 1970, shown in UTC)
const dt = (t) => new Date(t * 1000)
const dayKey = (t) => dt(t).toISOString().slice(0, 10)
const dm = (t) => `${dt(t).getUTCDate()} ${MONTH[dt(t).getUTCMonth()]}`

  const per = SIZES.map(([nm, lo, hi]) => { const xs = shown.filter((e) => e.n >= lo && e.n <= hi); return [nm, xs.length, xs.reduce((a, e) => a + e.n, 0)] })
  const maxR = Math.max(1, ...per.map((p) => p[2]))
  const by = new Map()
  for (const e of shown) { const m = by.get(e.g) || [0, 0]; m[0]++; m[1] += e.n; by.set(e.g, m) }
  const sources = [...by.keys()].filter((g) => !TAIL.includes(gname(g))).length
  const top = [...by].sort((p, q) => q[1][1] - p[1][1]).slice(0, 5)
  const maxT = Math.max(1, ...top.map((x) => x[1][1]))
  const bar = (n, m) => `<span><span class="b" style="width:${Math.max(n ? 2 : 0, (100 * n) / m).toFixed(1)}%"></span></span>`
  box.innerHTML = `<div class="facts"><div class="fact"><div class="k">Data sources</div><div class="v">${num(sources)}</div></div><div class="fact"><div class="k">The 10 largest hold</div><div class="v">${shown.length ? share([...shown].sort((p, q) => q.n - p.n).slice(0, 10).reduce((a, e) => a + e.n, 0), reports) : '–'}</div></div></div>`
    + `<div><div class="cap">By size</div><div class="grid"><span class="h">reports in it</span><span></span><span class="r h">episodes</span><span class="r h">reports</span>${per.map(([nm, ne, nr]) => `<span>${nm}</span>${bar(nr, maxR)}<span class="r">${num(ne)}</span><span class="r">${num(nr)}</span>`).join('')}</div></div>`
    + `<div><div class="cap">Sources with the most reports</div><div class="grid"><span class="h"></span><span></span><span class="r h">episodes</span><span class="r h">reports</span>${top.map(([g, [ne, nr]]) => `<span class="nm gs" data-g="${g}" title="${esc(gname(g))}">${esc(gname(g))}</span>${bar(nr, maxT)}<span class="r">${num(ne)}</span><span class="r">${num(nr)}</span>`).join('')}</div></div>`
}
$('allBtn').onclick = () => {
  allOpen = !allOpen
  try { localStorage.setItem('episode-browser:all', allOpen ? '1' : '0') } catch (e) { /* kept for this page only */ }
  renderAllEpisodes()
}
$('all').onclick = (ev) => {
  const g = ev.target.closest('[data-g]')
  if (!g) return
  S.src = new Set([+g.dataset.g])
  rescope()
}

// ---------------------------------------------------------------- the open episode
let epSeq = 0
async function openEpisode(key, opts = {}) {
  if (!key) return
  const my = ++epSeq
  if (S.open !== key) { S.rep = opts.report ?? null; S.keep = opts.report ?? null; REP = null; S.limit = ROWS }
  S.open = key
  renderList()
  markOpen(opts.scrollList)
  renderStrip()
  let d
  try {
    d = await thimble.fetch({ op: 'episode', key, colour: colour.query(), ...(S.keep != null ? { keep: S.keep } : {}) }, { key: 'episode' })
  } catch (e) { if (e && e.name === 'AbortError') return; throw e }
  if (my !== epSeq) return
  if (!d) { closeEpisode(); return }
  EP = d
  if ($('ep')) renderEpisode()
  if (S.rep != null) await openReport(S.rep, { scroll: true, keepOpen: true })
}
// the open episode's row at the top of the list, under its header, so the episode opened under it is in view
function markOpen(scrollList) {
  const tr = S.open ? $('tb').querySelector(`tr[data-key="${CSS.escape(S.open)}"]`) : null
  if (!tr || !scrollList) return
  const box = $('lscroll'), head = $('thead').getBoundingClientRect().height
  box.scrollTop = Math.max(0, tr.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - head)
}
function closeEpisode() {
  S.open = null; S.rep = null; EP = null; REP = null; S.keep = null
  renderList(); renderStrip()
}
function step(dir) {
  if (!shown.length) return
  const at = shown.findIndex((e) => e.key === S.open)
  const next = shown[Math.max(0, Math.min(shown.length - 1, at < 0 ? 0 : at + dir))]
  if (next && next.key !== S.open) openEpisode(next.key, { scrollList: true })
}
function renderEpisode() {
  const d = EP, pane = $('ep')
  whyShown = null
  whyShown = whyOn()
  const rows = d.rows
  const e = byKey.get(d.key)
  const counts = { sr: 0, ind: 0, cp: 0 }
  let sig = 0, coh = 0
  for (const r of rows) { const k = CLS_KEY[r.broad_class]; if (k) counts[k]++; if (r.confidence === 'significant') sig++; if (r.cohort) coh++ }
  const n = rows.length
  const multiDay = dayKey(d.start) !== dayKey(d.end)
  const at = shown.findIndex((x) => x.key === d.key)
  const disp = e ? gdisp(e.g) : 'included'
  const stats = [
    ['Reports', num(n)],
    ...(d.all > 1 ? [['Peak minute', num(d.peak_minute)], ['Peak hour', num(d.peak_hour)]] : []),
    ['Significant', num(sig)],
    ['Cohort', share(coh, n)],
  ]
  const anchor = unitsAnchored() ? ` data-anchor="${esc(unitRef(d.key))}" data-anchor-name="${esc(d.group)} episode, ${esc(when(d.start))}"` : ''
  pane.innerHTML = `<div class="ep-head"${anchor}>
    <div class="ep-top"><h2>${esc(d.group)}</h2>${disp !== 'included' ? `<span class="chip chip-sans chip-tone-neutral">${esc(DISP.find((x) => x[0] === disp)[1])}</span>` : ''}<span class="grow"></span>
      <button class="btn btn-ghost btn-sm" type="button" data-step="-1" aria-label="Previous episode"${at <= 0 ? ' disabled' : ''}>${ico('left')}</button><button class="btn btn-ghost btn-sm" type="button" data-step="1" aria-label="Next episode"${at < 0 || at >= shown.length - 1 ? ' disabled' : ''}>${ico('right')}</button><button class="btn btn-ghost btn-sm" type="button" data-close aria-label="Close">${ico('x')}</button></div>
    <div class="ep-when">${esc(dmy(d.start))} ${hms(d.start)}${d.end > d.start ? ` → ${multiDay ? esc(dmy(d.end)) + ' ' : ''}${hms(d.end)}` : ''} UTC${d.end > d.start ? ` · ${esc(dur(d.end - d.start))}` : ''}</div>
    <div class="stats">${stats.map(([k, v]) => `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>
    ${byClass() ? '' : `<div class="ep-mix">${mixBar(counts, n)}<span class="keys">${CLS.map(([k, nm]) => classKey(k, nm, counts[k])).join('')}</span></div>`}
  </div>
  <div id="rate"></div>
  <div id="rscroll">
    <table id="rtbl" class="table">
      <colgroup><col style="width: 86px"><col style="width: 76px"><col style="width: 126px"><col style="width: 86px">${whyOn() ? '<col>' : ''}<col style="width: 40px"></colgroup>
      <thead><tr><th>Time</th><th style="text-align:right">Gap</th><th>Class</th><th>Confidence</th>${whyOn() ? '<th>Why included</th>' : ''}<th></th></tr></thead>
      <tbody id="rtb"></tbody>
    </table>
  </div>`
  pane.querySelector('.ep-top').onclick = (ev) => {
    const b = ev.target.closest('button')
    if (!b || b.disabled) return
    if (b.dataset.close != null) return closeEpisode()
    if (b.dataset.step) step(+b.dataset.step)
  }
  renderRate()
  renderReports()
}
// the reports per bin of time across the episode, by their values under the Colour by choice in the chips' order
function renderRate() {
  const box = $('rate'), d = EP
  const rows = d.rows
  if (!box) return
  if (rows.length < 3 || d.end - d.start < 120) { box.innerHTML = ''; box.style.display = 'none'; return }
  box.style.display = ''
  const L = 0, w = box.clientWidth - 28, h = 54
  const spanS = d.end - d.start
  const B = [10, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, DAY].find((b) => spanS / b <= Math.max(24, Math.min(110, w / 6))) || DAY
  const a = Math.floor(d.start / B) * B, nb = Math.floor((d.end - a) / B) + 1
  const bins = Array.from({ length: nb }, () => ({ n: 0, parts: new Map(), first: -1 }))
  rows.forEach((r, i) => {
    const b = bins[Math.floor((r.t - a) / B)]
    if (!b) return
    b.n++
    if (b.first < 0) b.first = i
    const key = r.value == null ? '' : r.value
    b.parts.set(key, (b.parts.get(key) || 0) + 1)
  })
  const max = Math.max(...bins.map((b) => b.n)), bw = (w - L) / nb
  const fill = (k) => valColour(k === '' ? null : k)
  const order = [...colour.values.map((v) => (v.value == null ? '' : v.value))]
  for (const r of rows) { const k = r.value == null ? '' : r.value; if (!order.includes(k)) order.push(k) }
  let s = `<line class="base" x1="${L}" x2="${w}" y1="${h + 0.5}" y2="${h + 0.5}"/>`
  bins.forEach((b, i) => {
    if (!b.n) return
    let y = h
    let g = ''
    for (const k of order) {
      const v = b.parts.get(k)
      if (!v) continue
      const hh = (v / max) * (h - 2)
      y -= hh
      g += `<rect x="${L + i * bw + 0.5}" y="${y}" width="${Math.max(1, bw - 1)}" height="${hh}" fill="${esc(fill(k))}"/>`
    }
    const t0 = a + i * B
    g += `<rect x="${L + i * bw}" y="0" width="${bw}" height="${h}" fill="transparent"><title>${hm(Math.max(t0, d.start))}–${hm(Math.min(t0 + B, d.end + 1))} · ${plural(b.n, 'report')} · the tallest bar ${plural(max, 'report')}</title></rect>`
    s += `<g class="bin" data-first="${b.first}">${g}</g>`
  })
  const ticks = []
  const step = [60, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, DAY, 2 * DAY].find((st) => (w - L) / (spanS / st) >= 70) || 2 * DAY
  for (let t = Math.ceil(d.start / step) * step; t <= d.end; t += step) ticks.push(t)
  const xOf = (t) => L + ((t - a) / (nb * B)) * (w - L)
  for (const t of ticks) s += `<text x="${xOf(t)}" y="${h + 12}" text-anchor="middle">${t % DAY === 0 ? dm(t) : hm(t)}</text>`
  box.innerHTML = `<svg width="${w}" height="${h + 16}">${s}</svg>`
  box.querySelector('svg').onclick = (ev) => {
    const g = ev.target.closest('.bin')
    if (g) revealRow(+g.dataset.first)
  }
}
function binName(b) {
  if (b < 60) return `/${b} s`
  if (b === 60) return '/min'
  if (b < 3600) return `/${b / 60} min`
  if (b === 3600) return '/hour'
  if (b < DAY) return `/${b / 3600} h`
  return '/day'
}
async function revealRow(i) {
  if (i < 0) return
  if (i >= S.limit) { S.limit = Math.ceil((i + 1) / ROWS) * ROWS; renderReports() }
  const r = EP.rows[i]
  const tr = $('rtb').querySelector(`tr[data-i="${r.i}"]`)
  if (tr) { tr.scrollIntoView({ block: 'center' }); tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash') }
}
let whyShown = null // whether the open episode's table has the why_included column, set as it is drawn
const whyOn = () => (whyShown == null ? ($('ep').clientWidth || 0) >= 560 : whyShown)
const repCols = () => (whyOn() ? 6 : 5)
function reportRow(r) {
  const k = CLS_KEY[r.broad_class]
  const fast = r.gap != null && r.gap < 10
  const conf = r.confidence === 'significant' ? 'sig' : r.confidence === 'suggestive' ? 'sug' : ''
  const open = S.rep === r.i
  return `<tr data-i="${r.i}" data-anchor="${esc(r.ref)}" data-anchor-name="Report of ${esc(r.report_date_utc || when(r.t))}" class="${open ? 'sel' : ''}"${colour.attr(r)}>`
    + `<td>${hms(r.t)}</td><td class="gap${fast ? ' fast' : ''}">${esc(gapText(r.gap))}</td>`
    + `<td class="cl">${k && !byClass() ? `<span class="sw" style="--c:${clsColour(k)}"></span>` : ''}${esc(r.broad_class || '')}</td>`
    + `<td class="cf ${conf}">${r.confidence ? esc(r.confidence) : '<span class="none">–</span>'}</td>`
    + (whyOn() ? `<td class="why">${esc(r.why_short || '')}</td>` : '')
    + `<td class="lnk">${r.report_url ? `<a class="ext" href="${esc(r.report_url)}" target="_blank" rel="noopener noreferrer" data-url="${esc(r.report_url)}" title="${esc(r.report_url)}" aria-label="Report on urlquery.net">${ico('ext')}</a>` : ''}</td></tr>`
    + (open ? `<tr class="det" data-anchor="${esc(r.ref)}" data-anchor-name="Report of ${esc(r.report_date_utc || when(r.t))}"><td colspan="${repCols()}">${details()}</td></tr>` : '')
}
function renderReports() {
  const tb = $('rtb')
  if (!tb) return
  const rows = EP.rows
  const multiDay = dayKey(EP.start) !== dayKey(EP.end)
  const drawn = rows.slice(0, S.limit)
  const perDay = new Map()
  if (multiDay) for (const r of rows) perDay.set(dayKey(r.t), (perDay.get(dayKey(r.t)) || 0) + 1)
  let h = '', day = null
  for (const r of drawn) {
    if (multiDay && dayKey(r.t) !== day) {
      day = dayKey(r.t)
      h += `<tr class="day"><td colspan="${repCols()}">${WEEKDAY[dt(r.t).getUTCDay()]} ${esc(dmy(r.t))}<span class="n">${plural(perDay.get(day), 'report')}</span></td></tr>`
    }
    h += reportRow(r)
  }
  if (rows.length > drawn.length) h += `<tr class="more"><td colspan="${repCols()}"></td></tr>`
  if (!rows.length) h = `<tr><td colspan="${repCols()}" class="empty">No report of this episode passes the label filter</td></tr>`
  tb.innerHTML = h
  moreSeen.disconnect()
  const more = tb.querySelector('tr.more')
  if (more) moreSeen.observe(more)
}
// the next reports drawn as the list scrolls near the last
const moreSeen = new IntersectionObserver((es) => {
  if (!es.some((x) => x.isIntersecting) || !EP || S.limit >= EP.rows.length) return
  S.limit += ROWS
  renderReports()
}, { root: $('lscroll'), rootMargin: '600px 0px' })
document.addEventListener('click', (ev) => {
  const a = ev.target.closest('a.ext, [data-copy]')
  if (!a || ev.metaKey || ev.ctrlKey) return
  ev.preventDefault()
  ev.stopPropagation()
  copy(a.dataset.url || a.dataset.copy, a)
}, true)
// the frame opens no page outside thimble, so a report's link is copied; where the frame may not write the clipboard
// the link opens selected in a field beside it
async function copy(text, anchor) {
  let ok = false
  try { await navigator.clipboard.writeText(text); ok = true } catch (e) {
    const ta = document.createElement('textarea')
    ta.value = text
    ta.style.position = 'fixed'; ta.style.opacity = '0'
    document.body.appendChild(ta)
    ta.select()
    try { ok = document.execCommand('copy') } catch (e2) { ok = false }
    ta.remove()
  }
  if (ok) return toast(`Copied ${text}`)
  const p = pop(anchor, `<input class="field find" readonly value="${esc(text)}" style="width:330px" aria-label="Report link">`, 'right')
  p.style.maxWidth = '360px'
  place(p, anchor, 'right')
  const i = p.querySelector('input')
  i.focus(); i.select()
}
// a click in the open episode: a cell's file opens in the File browser, a report opens in full under its row
function epClick(ev) {
  const fc = ev.target.closest('[data-file]')
  if (fc) return thimble.navigate(fc.dataset.file, { browser: true })
  if (ev.target.closest('tr.det')) return
  const tr = ev.target.closest('#rtb tr[data-i]')
  if (!tr) return
  const i = +tr.dataset.i
  thimble.expand(tr, () => openReport(i), { find: () => $('rtb') && $('rtb').querySelector(`tr[data-i="${i}"]`) })
}
async function openReport(i, opts = {}) {
  if (S.rep === i && !opts.keepOpen) { S.rep = null; REP = null; return renderReports() }
  S.rep = i
  const at = EP.rows.findIndex((r) => r.i === i)
  if (at >= S.limit) S.limit = Math.ceil((at + 1) / ROWS) * ROWS
  if (!REP || REP.i !== i) REP = null
  renderReports()
  // the report at the top of the list, under the list's header and its episode's, so the report and as much of it in
  // full as fits are in view
  const scrollTo = () => {
    const tr = $('rtb') && $('rtb').querySelector(`tr[data-i="${i}"]`), rs = $('rscroll'), box = $('lscroll')
    if (!tr || !rs) return
    box.scrollTop += tr.getBoundingClientRect().top - box.getBoundingClientRect().top - $('thead').getBoundingClientRect().height - rs.querySelector('thead').getBoundingClientRect().height
  }
  if (opts.scroll) scrollTo()
  let d
  try { d = await thimble.fetch({ op: 'report', i }, { key: 'report' }) } catch (e) { if (e && e.name === 'AbortError') return; throw e }
  if (S.rep !== i) return
  REP = d
  // drawn again where it is: the row stays under the pointer, its details grow under it
  const tr = $('rtb') && $('rtb').querySelector(`tr[data-i="${i}"]`)
  if (tr && !opts.scroll) thimble.expand(tr, renderReports, { find: () => $('rtb') && $('rtb').querySelector(`tr[data-i="${i}"]`) })
  else renderReports()
  if (opts.scroll) scrollTo()
}
function dl(rec, keys, mono = []) {
  return `<dl>${keys.filter((k) => rec[k] != null && rec[k] !== '').map((k) => {
    const v = rec[k]
    const text = typeof v === 'string' ? v : Array.isArray(v) ? v.join(', ') : JSON.stringify(v)
    const url = typeof v === 'string' && /^https?:\/\//.test(v)
    return `<dt>${esc(k)}</dt><dd class="${mono.includes(k) ? 'mono' : ''}">${esc(text)}${url ? `<button class="btn btn-ghost btn-sm copy" type="button" data-copy="${esc(v)}" aria-label="Copy">${ico('copy')}</button>` : ''}</dd>`
  }).join('')}</dl>`
}
function section(title, part, keys, mono, wide) {
  if (!part) return ''
  const rec = part.record || {}
  const ks = keys || Object.keys(rec)
  return `<section class="det-sec${wide ? ' wide' : ''}" data-anchor="${esc(part.ref)}" data-anchor-name="${esc(title)}"><h4>${esc(title)}<button type="button" class="chip chip-tone-evidence chip-act" data-file="${esc(part.ref)}" title="Open ${esc(part.ref)} in the File browser">${ico('file')}${esc(part.ref.split('#')[0])}</button></h4>${dl(rec, ks, mono)}</section>`
}
function details() {
  const d = REP
  if (!d || d.i !== S.rep) return '<div class="empty">Reading the report</div>'
  return `<div class="det-grid thimble-details">${section('Catalog row', d.catalog, ['report_id', 'report_url', 'report_date_utc', 'timestamp_precision', 'disposition', 'confidence', 'broad_class', 'why_included', 'caveat'], ['report_id', 'report_url', 'report_date_utc'], true)}`
    + section('Source row', d.source, ['data_source', 'source_basis', 'matched_sources', 'report_date_utc'], ['report_date_utc'])
    + section('Selection provenance', d.provenance, ['source_batch', 'group', 'source', 'record_kind', 'selection_basis', 'description'])
    + section('Supplemental decision', d.supplement, ['source_batch', 'disposition', 'confidence', 'broad_class', 'basis', 'reason', 'classification_provenance'])
    + section('Confidence change', d.override, ['episode', 'previous_confidence', 'confidence', 'basis', 'reason', 'unchanged_fields'])
    + '</div>'
}

// ---------------------------------------------------------------- render
function renderAll() {
  if (!D) return
  feedRange()
  compute()
  chipCounts()
  renderBar()
  renderList()
  renderStrip()
  markOpen()
}
function rescope() {
  if (!D) return
  feedRange()
  compute()
  chipCounts()
  renderBar()
  renderList()
  renderStrip()
  markOpen()
  $('lscroll').scrollTop = 0
}
function clearFilters() { S.src.clear(); S.minN = 1; range.set(null) }
let resizeTimer = null
addEventListener('resize', () => {
  clearTimeout(resizeTimer)
  resizeTimer = setTimeout(() => {
    renderStrip()
    if (!EP) return
    const was = whyShown
    whyShown = null
    if (whyOn() !== was) renderEpisode()
    else { whyShown = was; renderRate() }
  }, 100)
})
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { if (openPop) return close(); if (S.open) return closeEpisode() }
  if (ev.target.closest && ev.target.closest('input, textarea, select')) return
  if (S.open && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && !ev.metaKey && !ev.ctrlKey) { ev.preventDefault(); step(ev.key === 'ArrowDown' ? 1 : -1) }
})

// ---------------------------------------------------------------- places
// An episode opens under its row, the filters that would hide it cleared, with a report opened in it when the citation
// names one; a data source's every episode opens with the view narrowed to it.
let ready = null
async function openPlace(t) {
  if (t.episode) {
    const e = byKey.get(t.episode)
    if (e && !passes(e)) { clearFilters(); rescope() }
    S.keep = t.report != null ? t.report : null
    S.rep = t.report != null ? t.report : null
    await openEpisode(t.episode, { scrollList: true, report: t.report })
    if (t.report != null && S.rep !== t.report) openReport(t.report, { scroll: true, keepOpen: true })
    return
  }
  if (t.group) {
    const g = D.groups.indexOf(t.group)
    clearFilters()
    if (g >= 0) S.src = new Set([g])
    closeEpisode()
    rescope()
  }
}
thimble.onOpen(async (place) => {
  const t = (place && place.target) || {}
  if (!ready) ready = loadAll()
  await ready
  await openPlace(t)
})
thimble.onLabels(async (st) => {
  const was = JSON.stringify([labelState.labels, labelState.filter])
  labelState = { labels: st.labels || [], filter: st.filter || null, all: st.all || null, palette: st.palette || null }
  if (!ready) return
  await ready
  if (JSON.stringify([labelState.labels, labelState.filter]) === was) { renderBar(); return }
  if (!(await loadAll())) return
  if (S.open) openEpisode(S.open)
})
if (!ready) ready = loadAll()
// widths are measured in the page's fonts, so again once a font has loaded
let fontTimer = null
const refit = () => { clearTimeout(fontTimer); fontTimer = setTimeout(() => { colW = null; if (D) { renderList(); markOpen(); renderStrip() } }, 50) }
if (document.fonts) {
  document.fonts.addEventListener('loadingdone', refit)
  Promise.all(['--font-mono', '--font-body'].map((v) => document.fonts.load(`400 12px ${token(v)}`).catch(() => null))).then(refit)
}
</script>
