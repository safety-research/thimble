<!doctype html>
<html>
<head>
<style>
  /* thimble's parts come with the frame: the search, Filter by, Rows, Color by, the time range and its axis, the lanes,
     the divider, the table, the side panel, the text, the record and the theme's tokens. This page lays them out. */
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-card); overflow: hidden; }
  * { box-sizing: border-box; }
  #view { height: 100%; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 12px 16px 10px; border-bottom: 1px solid var(--border-subtle); }
  #search { flex: 0 1 260px; min-width: 200px; }
  #color { min-width: min(300px, 100%); max-width: 100%; }
  /* the overview: the readout, the range and its axis over the lanes; the time stays put while the lanes scroll under
     it, and the divider under it sets its height */
  #overview { flex: none; max-height: 46%; overflow: hidden auto; }
  .time { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 112px minmax(0, 1fr); padding: 8px 16px 0; background: var(--surface-card); }
  #read { flex-direction: row; gap: 10px; margin-bottom: 4px; }
  #key { align-self: center; }
  #lanes { padding: 2px 16px 8px; }
  /* the list: what it shows named over the table, and the side panel at its right */
  #body { flex: 1; min-height: 0; border-top: 1px solid var(--border-hairline); }
  .listbox { display: flex; flex-direction: column; min-height: 0; }
  .lhead { flex: none; display: flex; align-items: baseline; gap: 8px; min-width: 0; padding: 8px 16px 4px; }
  .lhead b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 var(--text-sm) / 1.4 var(--font-body); }
  .lhead span { flex: none; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); font-variant-numeric: tabular-nums; }
  #list { flex: 1; min-height: 0; }
  /* a record in the side panel: its reasoning or its command and result, then the record itself */
  .words { margin: 0 0 12px; }
  .rec h4 { margin: 14px 0 4px; font: 500 var(--text-xs) / 1.4 var(--font-body); }
  .mono { white-space: pre-wrap; overflow-wrap: anywhere; font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); color: var(--text-secondary); margin: 0; }
  .record { margin-top: 16px; }
  .totx { margin-top: 16px; }
</style>
</head>
<body>
<div id="view">
  <div class="top">
    <span id="search"></span>
    <span id="filter"></span>
    <span id="rows"></span>
    <span id="color"></span>
  </div>
  <div id="overview">
    <div class="time">
      <div></div><div id="read"></div>
      <div></div><div id="range"></div>
      <div id="key"></div><div id="axis"></div>
    </div>
    <div id="lanes"></div>
  </div>
  <div id="body">
    <div class="listbox">
      <div class="lhead" id="lhead" data-thimble-chrome></div>
      <div id="list"></div>
    </div>
  </div>
</div>
<script>
// Activity Timeline: one agent transcript on a single UTC time axis. The top row searches the records, filters them
// (Filter by), groups the lanes (Rows, the tactic label by default) and colors them (Color by, the record's kind); the
// time range's viewfinder picks the time the lanes and the table show, with the context compaction flagged on the axis;
// a record opens in the side panel with its reasoning, or its tool call and result, and a link into the transcript.
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const cap = (s) => String(s).charAt(0).toUpperCase() + String(s).slice(1)
const $ = (id) => document.getElementById(id)
let E = []           // the records shown, in time order
let span = null, mark = null
let shown = []       // the table's records: those in the range and the lane chosen
let picked = null    // the lane chosen
let open = null      // the record in the side panel
let keep = []        // the row a citation opened, kept whatever the filters
let busy = false, seq = 0, markLoaded
const loaded = new Promise((ok) => (markLoaded = ok))

// the view's fields, which Filter by, Rows and Color by each offer; the tactic label and the others appear under
// "Labels" on their own
const FIELDS = [
  {
    name: 'kind', title: 'Kind', values: ['thinking', 'text', 'tool', 'prompt', 'system'],
    description: 'What the record is, from its role, type and content',
    meanings: {
      thinking: "The agent's reasoning, a turn wrapped in thinking tags", text: "The agent's prose, a turn with no thinking tags",
      tool: 'A tool call and its result', prompt: 'A prompt from the operator (the two context-compaction turns)',
      system: 'The system prompt that opens the run',
    },
  },
  {
    name: 'tool', title: 'Tool', description: 'The tool a tool call uses',
    meanings: {
      terminal: 'A shell command, or a read of a running session', view_tool: 'Reading a file',
      create_tool: 'Writing a new file', str_replace_tool: 'Editing a file',
    },
  },
  { name: 'role', title: 'Role', values: ['Assistant', 'Human', 'System'], description: 'Who the record is from' },
]

const search = thimble.search({ mount: '#search', in: '#body', placeholder: 'Search records', onChange: () => load() })
const color = thimble.colorBy({ mount: '#color', fields: FIELDS, initial: 'kind', onChange: load })
const filter = thimble.filterBy({ mount: '#filter', fields: FIELDS, onChange: load })
const rows = thimble.rows({ mount: '#rows', fields: FIELDS, initial: [{ label: 'tactic' }, 'kind'], onChange: () => { pick(null); load() } })
const range = thimble.timeRange({ mount: '#range', readout: '#read', onChange: draw })
// the lanes and the table draw each record in its Color by value, which holds for a label too; a row's bar is Color
// by's own (attr)
const painted = { keeps: () => true, valueOf: (e) => e.value, colorOf: (v) => color.colorOf(v), attr: (e) => color.attr(e) }
const lanes = thimble.timeline({
  mount: '#lanes', keyMount: '#key', rows, range, color: painted, names: 112, follow: '#list',
  tip: (e) => `${e.kind}${e.tool ? ' · ' + e.tool : ''} · ${e.text}`,
  onPick: (lane) => pick(picked && picked.key === lane.key ? null : lane),
  onMark: (e) => show(e.r, true),
})
const side = thimble.side({ mount: '#body', onClose: () => { open = null } })
// the records in the range as a table: the time, the kind, the tool (dropped first on a narrow table) and the text; a
// row opens in the side panel, and ↑ ↓ move it on
const table = thimble.table({
  mount: '#list', side, search, color: painted,
  columns: [
    { name: 't', title: 'Time', type: 'time', drop: false },
    { name: 'kind', title: 'Kind', width: 72 },
    { name: 'tool', title: 'Tool', width: 100, drop: 1 },
    { name: 'text', title: 'Text' },
  ],
  details: (e) => ({ title: `${cap(e.kind)}${e.tool ? ' · ' + e.tool : ''}`, sub: `${range.format(e.t, 1)} · ${e.role}`, render: (body) => details(body, e) }),
  onOpen: (e) => { open = e.r; reset.check() },
})
thimble.divider({ top: '#overview' })
const reset = thimble.onReset({ changed: () => picked != null || keep.length > 0, reset: () => { pick(null); keep = []; load() } })

async function load() {
  const my = ++seq
  const query = { op: 'overview', color: color.query(), filter: filter.query(), rows: rows.query(), q: search.text.trim(), keep }
  let page
  busy = true
  head()
  try {
    page = await thimble.fetch(query, { key: 'records' })
  } catch (e) {
    if (e.name === 'AbortError') return
    throw e
  } finally {
    if (my === seq) busy = false
  }
  if (my !== seq) return
  span = page.span
  mark = page.mark
  const cols = page.cols
  E = (cols.r || []).map((_, i) => Object.fromEntries(Object.keys(cols).map((k) => [k, cols[k][i]])))
  color.counts(page.counts)
  filter.counts(page.fcounts)
  const pad = Math.max(60, (span[1] - span[0]) * 0.01)
  range.data({ times: E.map((e) => e.t), values: E.map((e) => e.value), span: [span[0] - pad, span[1] + pad], marks: mark ? [mark] : [] })
  markLoaded()
  draw()
}

function draw() {
  if (!span) return
  thimble.timeAxis('#axis', range.scale($('axis').clientWidth), { marks: mark ? [mark] : [] })
  lanes.draw(E)
  drawList()
}

// the table: the records in the range and in the lane chosen
function drawList() {
  const inLane = (e) => !picked || (rows.groupOf(e) ?? null) === picked.value
  shown = E.filter((e) => range.has(e.t) && inLane(e))
  table.draw(shown)
  if (!busy) search.kept(shown.filter((e) => !keep.includes(e.r)).map((e) => e.ref))
  head()
}

// what the table shows, named over it: the lane chosen or every record, its span and how many
function head() {
  const what = picked ? `${rows.by ? rows.by.title + ': ' : ''}${picked.name}` : 'In the range'
  const when = shown.length ? `${range.format(shown[0].t, 60)} – ${range.format(shown[shown.length - 1].t, 60)}` : ''
  $('lhead').innerHTML = `<b>${esc(what)}</b>${when ? `<span>${esc(when)}</span>` : ''}<span>${span ? `${shown.length} ${shown.length === 1 ? 'record' : 'records'}` : ''}${busy ? ' · loading…' : ''}</span>` +
    (picked ? '<button class="btn btn-ghost btn-sm" type="button" data-all>Every lane</button>' : '')
}

function pick(lane) {
  picked = lane ? { key: lane.key, value: lane.value, name: lane.name } : null
  lanes.choose(picked ? picked.key : null)
  if (span) drawList()
  reset.check()
}

// a record in the side panel from anywhere: a mark, a citation, the table
async function show(r, keys) {
  if (!E.some((e) => e.r === r)) { keep = [r]; await load() }
  const e = E.find((x) => x.r === r)
  if (!e) return
  if (!range.has(e.t)) { const w = range.to - range.from; range.set(e.t - w / 2, e.t + w / 2) }
  if (picked && (rows.groupOf(e) ?? null) !== picked.value) pick(null)
  drawList()
  table.open(e.ref)
  if (keys) $('list').focus({ preventScroll: true })
}

// a record's details, once the reader sends it whole: its reasoning, or its command and result, then the record itself
// under its citation, and a link into the transcript in the File browser
async function details(body, e) {
  let d
  try {
    d = await thimble.fetch({ op: 'record', r: e.r }, { key: 'record' })
  } catch (err) {
    if (err.name === 'AbortError') return
    throw err
  }
  if (open !== e.r || !d || !body.isConnected) return
  body.innerHTML = '<div class="words"></div><div class="rec"></div>' +
    '<div class="totx"><button class="btn btn-secondary btn-sm" type="button" data-tx>Open in transcript</button></div>'
  const rec = body.querySelector('.rec')
  if (d.reasoning) thimble.text(body.querySelector('.words'), d.reasoning, { format: 'plain' })
  else body.querySelector('.words').remove()
  if (d.call) {
    rec.insertAdjacentHTML('beforeend', '<h4 data-thimble-chrome>Call</h4>')
    const el = document.createElement('div')
    rec.appendChild(el)
    thimble.record({ mount: el, value: d.call, ref: d.ref, mono: ['text', 'file_text', 'old_str', 'new_str', 'path'], color: false })
  }
  if (d.result != null) {
    rec.insertAdjacentHTML('beforeend', `<h4 data-thimble-chrome>Result</h4><pre class="mono">${esc(d.result)}</pre>`)
  }
  rec.insertAdjacentHTML('beforeend', '<div class="record"></div>')
  thimble.record({ mount: rec.querySelector('.record'), value: d.raw, ref: d.ref, mono: ['content', 'text', 'file_text', 'old_str', 'new_str', 'tool_result'], color: { attr: () => painted.attr(e) } })
  body.querySelector('[data-tx]').addEventListener('click', () => thimble.navigate(d.ref, { browser: true }))
}
addEventListener('resize', draw)
$('lhead').addEventListener('click', (ev) => { if (ev.target.closest('[data-all]')) pick(null) })

// the label filter changed: fetch again, since the reader keeps only what it keeps
let labelFilter = null
thimble.onLabels((s) => { const f = JSON.stringify(s.filter || null); if (f !== labelFilter) { labelFilter = f; load() } })
// a label's values arrive while it runs, which the lanes, the overview and the chips follow while it is Color by's or
// Rows' choice: fetch again when a mark gives a record another value than the reader did
const moved = (id, e, v) => {
  const m = id && thimble.markOf(e.ref)
  const got = m && (m.values || []).find((x) => x.id === id)
  return !!m && (got ? String(got.value) : null) !== (v ?? null)
}
let later = null
thimble.onMarks(() => {
  if ((color.label || rows.label) && E.some((e) => moved(color.label, e, e.value) || moved(rows.label, e, e.group))) { clearTimeout(later); later = setTimeout(load, 300) }
})

// a citation: a record in the side panel, or a window framed
thimble.onOpen(async (place) => {
  const t = (place && place.target) || {}
  await loaded
  if (t.r != null) return show(t.r)
  if (t.from && t.to) range.set(Date.parse(t.from + ':00Z') / 1000, Date.parse(t.to + ':00Z') / 1000)
})
load()
</script>
</body>
</html>
