<!doctype html>
<html>
<head>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--surface-card); color: var(--text-primary); font: 400 var(--text-ui-sm) / 1.4 var(--font-body); }
  .ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  #ctl { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; padding: 10px 14px; border-bottom: 1px solid var(--border-hairline); }
  .search { position: relative; flex: 0 1 112px; min-width: 96px; }
  .search .field { width: 100%; box-sizing: border-box; padding-left: 27px; }
  .search .ico { position: absolute; left: 8px; top: 50%; margin-top: -7px; color: var(--text-tertiary); pointer-events: none; }
  /* thimble's parts (.field, .btn, .chip), its Color by control, its time range selector and the theme's tokens come
     with the frame; this page only lays them out */
  #f-tool { flex: none; padding: 0 7px 0 9px; }
  #f-tool .ico { width: 12px; height: 12px; color: var(--text-tertiary); }
  #f-tool .v { font-weight: 500; }
  #f-density .ico { width: 13px; height: 13px; }
  .chip .ico { width: 10px; height: 10px; }
  .sw { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }

  #chart { position: relative; flex: none; padding: 8px 14px 6px; border-bottom: 1px solid var(--border-hairline); }
  svg { display: block; overflow: visible; user-select: none; -webkit-user-select: none; }
  svg text { font: 400 10.5px var(--font-mono); fill: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  svg text.lane { font: 400 12px var(--font-body); fill: var(--text-primary); }
  svg text.lane-n { font: 400 10px var(--font-mono); fill: var(--text-tertiary); }
  svg .grid { stroke: var(--border-hairline); }
  svg .rule { stroke: rgba(var(--ink-rgb), 0.08); }
  /* the time range selector over the lanes' time, its readout in the lane names' gutter; the lanes' one axis under it,
     with the context compaction's flag; a guide line through the lanes while the flag is hovered */
  .rrow { display: grid; grid-template-columns: var(--g) minmax(0, 1fr); align-items: center; padding-right: 4px; }
  #rread { align-self: center; }
  .arow { display: grid; grid-template-columns: var(--g) minmax(0, 1fr); padding-right: 4px; margin-top: 6px; }
  #lanewrap { position: relative; }
  #guide { position: absolute; top: 0; bottom: 6px; width: 0; border-left: 1px solid var(--text-secondary); opacity: 0.5; pointer-events: none; display: none; }
  .tick { cursor: pointer; }
  .lanehead { cursor: default; }

  #list { flex: 1; min-height: 0; overflow: auto; }
  #tbl { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
  #tbl th:first-child, #tbl td.t { padding-left: 14px; }
  #tbl thead th { position: sticky; top: 0; z-index: 1; background: var(--surface-card); text-align: left; padding: 7px 8px; font: 500 var(--text-xs) / 1 var(--font-body); color: var(--text-tertiary); border-bottom: 1px solid var(--border-hairline); }
  #tbl td { padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border-bottom: 1px solid var(--border-hairline); }
  #tbl tbody tr { scroll-margin-top: 34px; }
  #tbl td.t { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  #tbl td.i { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  #tbl td.x { font-family: var(--font-body); font-size: var(--text-xs); color: var(--text-primary); }
  #tbl .tool { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  #tbl tbody tr:hover > td { background: var(--surface-hover); }
  #tbl tbody tr.det:hover > td { background: none; }
  #tbl tr.active > td, #tbl tbody tr.active:hover > td { background: var(--surface-selected); border-bottom: 0; }
  #tbl tr.det > td { padding: 2px 16px 14px 14px; background: var(--surface-selected); border-bottom: 1px solid var(--border-strong); white-space: normal; cursor: default; }
  .empty { padding: 28px 14px; color: var(--text-tertiary); font-size: var(--text-xs); }

  .d-top { display: flex; align-items: flex-start; gap: 16px; margin-top: 8px; }
  .d-head { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .d-head .ach { font-weight: 500; }
  .d-head .meta { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .d-side { display: flex; flex: none; align-items: center; gap: 6px; }
  .d-side .btn { gap: 6px; }
  .d-side .btn .ico { width: 13px; height: 13px; color: var(--text-tertiary); }
  .d-sec { display: flex; align-items: center; gap: 8px; margin: 12px 0 3px; font: 500 var(--text-ui-sm) / 1.3 var(--font-body); color: var(--text-secondary); }
  .prose { margin: 4px 0 0; font: 400 var(--text-sm) / 1.5 var(--font-body); color: var(--text-primary); white-space: pre-wrap; overflow-wrap: anywhere; }
  .code { margin: 4px 0 0; padding: 8px 10px; border-radius: var(--radius-ui); background: var(--surface-card); box-shadow: inset 0 0 0 1px var(--border-hairline); font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .code.res { color: var(--text-secondary); }

  .pop { position: fixed; z-index: 60; min-width: 190px; max-width: 320px; max-height: 70vh; overflow: auto; padding: 4px; border-radius: var(--radius-ui); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), 0.14); font: 400 var(--text-ui-sm) / 1.3 var(--font-body); }
  .pop .head { padding: 8px 8px 4px; font: 500 var(--text-xs) / 1 var(--font-body); color: var(--text-tertiary); }
  .pop .sep { height: 1px; margin: 4px 0; background: var(--border-hairline); }
  .pop .note { padding: 4px 8px 6px; margin: 0; color: var(--text-tertiary); }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: none; color: var(--text-primary); font: inherit; text-align: left; cursor: pointer; }
  .item:hover { background: var(--surface-hover); }
  .item:disabled { cursor: default; }
  .item .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .lab.none { color: var(--text-tertiary); }
  .item .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .item .tick-on { width: 13px; height: 13px; color: var(--text-primary); }
  .box { display: inline-grid; place-items: center; flex: none; width: 14px; height: 14px; box-sizing: border-box; border: 1.5px solid rgba(var(--ink-rgb), 0.35); border-radius: 3px; }
  .box.on { border-color: var(--text-primary); background: var(--text-primary); }
  .box.on::after { content: ''; width: 6px; height: 3px; margin-top: -2px; border: solid var(--surface-card); border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg); }

  #tip { position: fixed; z-index: 70; display: none; max-width: 340px; padding: 7px 9px; border-radius: var(--radius-ui); background: var(--surface-card); box-shadow: 0 0 0 1px rgba(var(--ink-rgb), 0.12), 0 10px 28px -14px rgba(var(--ink-rgb), 0.32); pointer-events: none; font: 400 var(--text-xs) / 1.4 var(--font-body); }
  #tip .h { display: flex; align-items: center; gap: 6px; font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); color: var(--text-secondary); margin-bottom: 2px; }
  #tip .h .sw { width: 8px; height: 8px; }
</style>
</head>
<body>
<div id="ctl">
  <label class="search"><svg class="ico" viewBox="0 0 24 24"><path d="M4 10.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M15.2 15.2L20 20"/></svg><input id="q" class="field" type="search" placeholder="Search" aria-label="Search records" autocomplete="off" spellcheck="false"></label>
  <button id="f-tool" class="field" type="button" aria-expanded="false" aria-haspopup="menu"></button>
  <button id="f-density" class="btn btn-secondary btn-sm" type="button" aria-pressed="false"></button>
  <span id="colour"></span>
</div>
<section id="chart">
  <div class="rrow"><div id="rread"></div><div id="range"></div></div>
  <div class="arow"><div></div><div id="axis"></div></div>
  <div id="lanewrap"><svg id="lanes"></svg><div id="guide"></div></div>
</section>
<section id="list" tabindex="-1">
  <table id="tbl" class="table">
    <colgroup><col style="width: 92px"><col style="width: 116px"><col style="width: 120px"><col></colgroup>
    <thead><tr><th>Time</th><th>Activity</th><th>Tool</th><th>First line</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
</section>
<div id="tip"></div>
<script>
'use strict'
// Activity Timeline: one agent transcript on a time axis. thimble's time range selector holds the whole run, each
// record in the colour of its value under thimble's Color by control, with a viewfinder over it: the lanes and the list
// show the range it frames, and it opens on the whole run. The lanes lay the range's records out, one lane per
// activity, each a mark at its time in its value's colour, under the lanes' one axis; the context compaction (the two
// Human turns) is a flag on that axis and on the overview, and hovering its flag draws a guide line through the lanes.
// The list holds the range's records in time order with the list's two tracks, and a click opens a record in place
// under its row, with a button that opens the transcript at that message in Files. The control's chips are the value
// filter; Reset puts back the filters, the range and the record opened. Labels: the reader keeps only the records the
// label filter keeps and gives each its value under the colour choice; the list rows carry their file ref as
// data-anchor so thimble marks them.
const slug = (thimble.view && thimble.view.slug) || 'activity-timeline'
const ACTS = ['captcha', 'signup', 'money', 'exploit', 'infra', 'other'] // the reader's activity indices
const LANES = ['captcha', 'signup', 'money', 'exploit', 'infra', 'other'] // lane order, the order of the Activity chips
const ACT_LABEL = { captcha: 'Captcha', signup: 'Signup', money: 'Money', exploit: 'Exploit', infra: 'Infra', other: 'No activity' }
// a record's Activity under Color by: the scaffolding (system prompt, compaction turns) takes none
const ACT_VALUE = { captcha: 'Captcha', signup: 'Signup', money: 'Money', exploit: 'Exploit', infra: 'Infra', other: null }
const TOOL_LABEL = { '': 'Reasoning', terminal: 'terminal', create_tool: 'create', view_tool: 'view', str_replace_tool: 'str_replace', insert_tool: 'insert' }
const G = 150 // gutter for lane names and the range's readout
document.documentElement.style.setProperty('--g', G + 'px')
const ICON = {
  down: 'M6 9l6 6 6-6', x: 'M6 6l12 12M18 6L6 18', check: 'M5 12.5l4.5 4.5L19 7',
  file: 'M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5',
  open: 'M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4',
  bars: 'M4 20V10M10 20V4M16 20v-8M22 20h-20', plus: 'M12 5v14M5 12h14',
}
const ico = (n, c = 'ico') => `<svg class="${c}" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const NONE = () => token('--label-none') || '#a09c93'

// ---------------------------------------------------------------- time (seconds since 1970, UTC)
const hhmm = (t, s) => new Date(t * 1000).toISOString().slice(11, s ? 19 : 16)

// ---------------------------------------------------------------- data
let D = null, N = 0, C = null, T = new Float64Array(0), V = []
let rowAt = new Map()
let loadSeq = 0
let labelState = { labels: [], filter: null }
const texts = new Map()

const S = {
  q: '', found: null,
  tools: new Set(), // tool value indices kept; empty = all
  density: false,
  open: null, detail: null, raw: false,
  keepRow: null,
}

async function load() {
  const my = ++loadSeq
  const COLS = ['r', 't', 'ln', 'ix', 'a', 'tool', 'role', 'typ', 'hu']
  const c = Object.fromEntries(COLS.map((k) => [k, []]))
  const v = []
  let first = null, from = 0
  const choice = colour.query()
  do {
    const page = await thimble.fetch({ op: 'overview', from, colour: choice, ...(S.keepRow != null ? { keep: [S.keepRow] } : {}) }, { key: 'overview' })
    if (my !== loadSeq) return false
    if (!first) first = page
    for (const k of COLS) for (const x of page.cols[k] || []) c[k].push(x)
    for (const x of page.cols.v || []) v.push(x)
    from = page.next
  } while (from != null)
  D = first
  N = c.r.length
  C = Object.fromEntries(COLS.map((k) => [k, Int32Array.from(c[k])]))
  V = v
  loadedBy = choiceKey()
  T = Float64Array.from(c.t, (t) => D.t0 + t)
  rowAt = new Map()
  for (let i = 0; i < N; i++) rowAt.set(C.r[i], i)
  return true
}

const refOf = (i) => `${D.file}#L${C.ln[i]}`
const actOf = (i) => ACTS[C.a[i]] || 'other'
const toolName = (i) => (D.names.tool[C.tool[i]] ?? '')

// ---------------------------------------------------------------- Color by
// thimble's one control in the top row: the menu holds Off, Activity, Tool and every label (each with its
// definition), the chips the values (a click turns one off, which hides its records). A field's value is worked out
// here; a label's comes from the reader (V), which is fetched again when the choice moves to another label.
const colour = thimble.colorBy({
  mount: '#colour',
  fields: [
    // Exploit and Infra name their palette colours (olive, teal), so neither takes the sky blue that sits beside Captcha's blue
    { name: 'activity', title: 'Activity', values: ['Captcha', 'Signup', 'Money', { name: 'Exploit', colour: 5 }, { name: 'Infra', colour: 6 }], value: (i) => (C && typeof i === 'number' ? ACT_VALUE[actOf(i)] : null) },
    { name: 'tool', title: 'Tool', values: ['terminal', 'Reasoning', 'view', 'create', 'str_replace'], value: (i) => (C && typeof i === 'number' ? TOOL_LABEL[toolName(i)] || null : null) },
  ],
  chips: 'filter',
  strip: '#list',
  onChange: colourChanged,
})
let loadedBy = null
const choiceKey = () => { const q = colour.query(); return q ? (q.label ? `l:${q.label}` : `f:${q.field}`) : '' }
const valueAt = (i) => (colour.off ? null : colour.field ? colour.valueOf(i) : (V[i] ?? null))

// ---------------------------------------------------------------- the time range: the whole run, a viewfinder over it
// the context compaction: the two Human turns sit together, so they are one flag
function compactions() {
  const out = []
  for (const bd of (D && D.boundaries) || []) {
    const t = D.t0 + bd.t
    if (out.length && t - out[out.length - 1].t < 1800) continue
    out.push({ t, label: 'context compaction' })
  }
  return out
}
const range = thimble.timeRange({
  mount: '#range',
  readout: '#rread',
  onChange: () => { if (D) renderView() },
  onInput: () => { if (D) renderLanes() },
  onMark: (m) => guide(m),
})
const inWin = (i) => range.has(T[i])

// ---------------------------------------------------------------- scope + colour
function passes(i) {
  if (S.found && !S.found.has(C.r[i])) return false
  if (S.tools.size && !S.tools.has(C.tool[i])) return false
  return true
}
let scoped = []
function compute() {
  scoped = []
  for (let i = 0; i < N; i++) if (passes(i)) scoped.push(i)
  // the overview: every record in scope over the whole run, each in its value's colour
  let lo = Infinity, hi = -Infinity
  for (let i = 0; i < N; i++) { lo = Math.min(lo, T[i]); hi = Math.max(hi, T[i]) }
  if (!(hi > lo)) { lo = (lo || 0) - 60; hi = lo + 120 }
  const room = (hi - lo) * 0.004
  range.data({ span: [lo - room, hi + room], times: scoped.map((i) => T[i]), values: scoped.map((i) => valueAt(i)), marks: compactions() })
}
// what colours a mark, and whether it shows: its value's chip is on (the record opened always shows)
const colourOf = (i) => colour.colourOf(valueAt(i)) || NONE()
const isOn = (i) => colour.isOn(valueAt(i))
const shown = (i) => isOn(i) || C.r[i] === S.open
const byActivity = () => colour.field === 'activity'
const laneColour = (a) => (ACT_VALUE[a] ? colour.colourOf(ACT_VALUE[a]) : NONE())
// the chips' counts: the records in scope and in the range, by value ('' for none)
function counts() {
  const n = {}
  for (const i of scoped) if (inWin(i)) { const v = valueAt(i) ?? ''; n[v] = (n[v] || 0) + 1 }
  colour.counts(n)
}

// ---------------------------------------------------------------- popovers
let openPop = null
function close() { if (openPop) { openPop.anchor.setAttribute('aria-expanded', 'false'); openPop.remove(); openPop = null } }
function pop(anchor, html, align = 'left') {
  close()
  const p = document.createElement('div')
  p.className = 'pop'; p.setAttribute('role', 'menu'); p.innerHTML = html
  document.body.appendChild(p)
  const r = anchor.getBoundingClientRect(), w = p.offsetWidth
  p.style.top = Math.max(6, Math.min(r.bottom + 4, innerHeight - p.offsetHeight - 6)) + 'px'
  p.style.left = Math.max(6, Math.min(innerWidth - w - 6, align === 'right' ? r.right - w : r.left)) + 'px'
  p.anchor = anchor; anchor.setAttribute('aria-expanded', 'true'); openPop = p
  return p
}
document.addEventListener('mousedown', (e) => { if (openPop && !openPop.contains(e.target) && !openPop.anchor.contains(e.target)) close() })
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close() })
const toggled = (anchor) => (openPop && openPop.anchor === anchor ? (close(), true) : false)

// ---------------------------------------------------------------- control row
function toolCounts() {
  const n = new Map()
  for (let i = 0; i < N; i++) if (S.found ? S.found.has(C.r[i]) : true) n.set(C.tool[i], (n.get(C.tool[i]) || 0) + 1)
  return [...n].sort((a, b) => b[1] - a[1])
}
function toolMenu() {
  const b = document.getElementById('f-tool')
  if (toggled(b)) return
  const rows = toolCounts().map(([v, n]) => {
    const name = D.names.tool[v] ?? ''
    return `<button class="item" data-v="${v}"><span class="box${S.tools.has(v) ? ' on' : ''}"></span><span class="lab">${esc(TOOL_LABEL[name] || name)}</span><span class="n">${n}</span></button>`
  }).join('')
  const p = pop(b, rows)
  p.onclick = (ev) => { const it = ev.target.closest('[data-v]'); if (!it) return; const v = +it.dataset.v; S.tools.has(v) ? S.tools.delete(v) : S.tools.add(v); it.querySelector('.box').classList.toggle('on'); rescope() }
}
function renderCtl() {
  const b = document.getElementById('f-tool')
  const v = S.tools.size === 1 ? (TOOL_LABEL[D.names.tool[[...S.tools][0]]] || '') : S.tools.size ? `${S.tools.size}` : ''
  b.classList.toggle('active', S.tools.size > 0)
  b.innerHTML = `Tool${v ? `: <span class="v">${esc(v)}</span>` : ''}${ico('down')}`
  const dn = document.getElementById('f-density')
  dn.classList.toggle('active', S.density)
  dn.setAttribute('aria-pressed', S.density ? 'true' : 'false')
  dn.innerHTML = `${ico('bars')}Density`
  counts()
}

// ---------------------------------------------------------------- the lanes (one per activity), the chart of the range
const W = () => document.getElementById('chart').clientWidth - 28
let laneScale = null
function renderLanes() {
  const svg = document.getElementById('lanes'), w = W(), x0 = G, x1 = w - 4
  const LH = S.density ? 38 : 26, top = 4
  const sc = range.scale(Math.max(1, x1 - x0))
  laneScale = sc
  const X = (t) => x0 + sc.x(t)
  const rows = scoped.filter(inWin)
  const count = new Map(LANES.map((a) => [a, 0]))
  for (const i of rows) count.set(actOf(i), (count.get(actOf(i)) || 0) + 1)
  let s = ''
  const bottom = top + LANES.length * LH
  // light grid lines where the axis above has its ticks
  for (const k of sc.ticks(72)) s += `<line class="grid" x1="${X(k.t)}" x2="${X(k.t)}" y1="${top}" y2="${bottom}"/>`
  const sel = S.open != null && rowAt.has(S.open) ? rowAt.get(S.open) : null
  const mw = range.full ? 2.5 : 4
  // density per lane, on the range's bins
  let dens = null, bins = null
  if (S.density) {
    bins = sc.bins(4)
    dens = new Map(LANES.map((a) => [a, new Map()]))
    for (const i of rows) if (shown(i)) { const m = dens.get(actOf(i)); const b = sc.binOf(T[i]); if (b >= 0) m.set(b, (m.get(b) || 0) + 1) }
  }
  LANES.forEach((a, li) => {
    const y = top + li * LH, midY = y + (S.density ? 11 : LH / 2)
    // while Activity is the colour, each lane's swatch is its chip's colour and a lane whose chip is off is dimmed;
    // under another colour the lanes carry no swatch, so the only colours are the marks'
    const act = byActivity(), c = act ? laneColour(a) : token('--viz-ink-3'), dim = act && !colour.isOn(ACT_VALUE[a])
    s += `<line class="rule" x1="0" x2="${x1}" y1="${y + LH + 0.5}" y2="${y + LH + 0.5}"/>`
    if (act) s += `<rect x="0" y="${midY - 4.5}" width="9" height="9" rx="2" fill="${c}"${dim ? ' opacity=".4"' : ''}/>`
    s += `<text class="lane" x="${act ? 14 : 0}" y="${midY + 4}"${dim ? ' opacity=".5"' : ''}>${esc(ACT_LABEL[a])}</text>`
    s += `<text class="lane-n" x="${G - 14}" y="${midY + 4}" text-anchor="end"${dim ? ' opacity=".5"' : ''}>${(count.get(a) || 0).toLocaleString('en-US')}</text>`
    if (S.density && dens) {
      const m = dens.get(a), maxd = Math.max(1, ...[...m.values()]), base = y + LH - 2, dh = LH - 24
      for (const [b, cnt] of m) {
        const [b0, b1] = bins[b], hh = (cnt / maxd) * dh
        s += `<rect x="${X(b0) + 0.4}" y="${base - hh}" width="${Math.max(1, X(b1) - X(b0) - 0.8)}" height="${hh}" fill="${c}" opacity="${dim ? 0.1 : 0.28}"/>`
      }
    }
    for (const i of rows) if (actOf(i) === a && shown(i)) {
      const x = X(T[i]), isSel = i === sel
      s += `<rect class="tick" data-i="${i}" x="${x - mw / 2}" y="${midY - (isSel ? 7 : 5)}" width="${mw}" height="${isSel ? 14 : 10}" rx="1" fill="${colourOf(i)}"${isSel ? ' stroke="var(--text-primary)" stroke-width="1.5"' : ''}/>`
    }
  })
  svg.setAttribute('width', w); svg.setAttribute('height', bottom + 6)
  svg.innerHTML = s
  // the lanes' one readable axis, with the context compaction's flag, which draws its guide line while hovered
  thimble.timeAxis('#axis', sc, { marks: compactions(), onMark: (m) => guide(m) })
}
// a faint line through the lanes at a point event, while its flag is hovered
function guide(m) {
  const g = document.getElementById('guide')
  if (!m || !laneScale || !range.has(m.t)) { g.style.display = 'none'; return }
  g.style.left = G + laneScale.x(m.t) + 'px'
  g.style.display = 'block'
}
const lanesSvg = document.getElementById('lanes')
lanesSvg.addEventListener('click', (ev) => { const t = ev.target.closest('.tick'); if (t) pick(C.r[+t.dataset.i], true) })
const tip = document.getElementById('tip')
let tipFor = null
lanesSvg.addEventListener('mousemove', async (ev) => {
  const t = ev.target.closest('.tick')
  if (!t) { tipFor = null; tip.style.display = 'none'; return }
  const i = +t.dataset.i, r = C.r[i]
  tipFor = i
  if (!texts.has(r)) { await fetchTexts([r]); if (tipFor !== i) return }
  const tn = toolName(i)
  tip.innerHTML = `<div class="h"><span class="sw" style="--c:${colourOf(i)}"></span>#${C.ix[i]} · ${hhmm(T[i], 1)} · ${esc(ACT_LABEL[actOf(i)])}${tn ? ' · ' + esc(TOOL_LABEL[tn] || tn) : ''}</div>${esc((texts.get(r) || '').slice(0, 220))}`
  tip.style.display = 'block'
  tip.style.left = Math.max(4, Math.min(innerWidth - tip.offsetWidth - 8, ev.clientX + 12)) + 'px'
  tip.style.top = Math.min(innerHeight - tip.offsetHeight - 8, ev.clientY + 14) + 'px'
})
lanesSvg.addEventListener('mouseleave', () => { tipFor = null; tip.style.display = 'none' })

// ---------------------------------------------------------------- the list: the range's records, opened in place
async function fetchTexts(rows) {
  const want = rows.filter((r) => !texts.has(r))
  for (let p = 0; p < want.length; p += 1000) {
    const res = await thimble.fetch({ op: 'texts', rows: want.slice(p, p + 1000) })
    for (const [row, t] of res.texts) texts.set(row, t)
  }
}
const listRows = () => scoped.filter((i) => inWin(i) && shown(i))
let listSeq = 0
async function renderList() {
  const my = ++listSeq
  await fetchTexts(listRows().map((i) => C.r[i]))
  if (my !== listSeq) return
  drawList()
}
// the list drawn from the texts already read, every record of the range, so the tracks map the whole list
function drawList() {
  const rows = listRows()
  let h = ''
  for (const i of rows) {
    const r = C.r[i], ref = refOf(i), a = actOf(i), tn = toolName(i), text = texts.get(r) || ''
    // the row's colour is a bar on its left edge (data-colour, which thimble draws); a record shown although its chip is
    // off (the one opened) takes none, so the filter does not hide it
    const ca = isOn(i) ? colour.attr(i) : ''
    h += `<tr data-r="${r}" data-anchor="${esc(ref)}" data-anchor-text="${esc(text)}" class="${S.open === r ? 'active' : ''}"${ca}>`
    h += `<td class="t">${hhmm(T[i], 1)}</td>`
    h += `<td class="ach">${esc(ACT_LABEL[a])}</td>`
    h += `<td class="tool">${esc(TOOL_LABEL[tn] || tn || '—')}</td>`
    h += `<td class="x">${esc(text)}</td></tr>`
    if (S.open === r) h += `<tr class="det thimble-details" data-anchor="${esc(ref)}" data-anchor-text="${esc(text)}"><td colspan="4">${details(i)}</td></tr>`
  }
  if (!rows.length) h = `<tr><td colspan="4" class="empty">No records pass these filters</td></tr>`
  document.getElementById('tb').innerHTML = h
}
// what the tracks' preview says of a row: its time and its first line
colour.strip('#list', { preview: (el) => (el && el.querySelector && el.querySelector('td.t') ? { when: el.querySelector('td.t').textContent, text: (el.querySelector('td.x') || el).textContent.slice(0, 160) } : null) })
function details(i) {
  const d = S.detail
  if (!d || d.r !== C.r[i]) return '<div class="empty">Reading the record…</div>'
  const rec = d // S.detail is the record the reader answered with (its index, line and fields)
  const a = rec.activity || actOf(i)
  const inferred = !rec.timestamp || /T21:/.test(rec.timestamp)
  const when = (rec.time || '').replace('T', ' ').replace('Z', ' UTC')
  const head = `<span class="ach">${esc(ACT_LABEL[a])}</span>`
    + `<span class="meta">#${esc(rec.index)}</span>`
    + `<span class="meta"${inferred ? ' title="Placed from the records around it: its own stamp is the harness clock"' : ''}>${inferred ? '≈ ' : ''}${esc(when)}</span>`
    + `<span class="meta">${esc(rec.role || '')}${rec.tool ? ' · ' + esc(TOOL_LABEL[rec.tool] || rec.tool) : ' · ' + esc(TOOL_LABEL[''])}</span>`
  // step into the transcript at this message: the file opens in Files, in its Transcript mode, at the message's line
  const side = `<button class="btn btn-secondary btn-sm" type="button" data-file="${esc(rec.ref)}" title="Open ${esc(D.file)} in Files at line ${rec.line}">${ico('open')}Open in transcript</button>`
  let body = ''
  if (rec.type === 'ToolMessage') {
    if (rec.tool_call != null) body += `<div class="d-sec">Tool call — ${esc(rec.tool || 'tool')}</div><div class="code">${esc(typeof rec.tool_call === 'string' ? rec.tool_call : callText(rec.tool_call))}</div>`
    if (rec.tool_result != null) {
      // terminal output is shown as the terminal drew it (cleanTerminal); Raw shows the stored bytes
      const raw = String(rec.tool_result), clean = rec.tool === 'terminal' ? cleanTerminal(raw) : raw, differs = clean !== raw
      const rawBtn = differs ? `<button class="btn btn-ghost btn-sm${S.raw ? ' active' : ''}" type="button" data-raw aria-pressed="${S.raw}">Raw</button>` : ''
      body += `<div class="d-sec">Result${rawBtn}</div><div class="code res">${esc(S.raw || !differs ? raw : clean)}</div>`
    }
  } else if (rec.content != null) {
    body += `<div class="d-sec">${rec.role === 'Human' ? 'Context-compaction turn' : rec.role === 'System' ? 'System prompt' : 'Reasoning'}</div><div class="prose">${esc(rec.content)}</div>`
  }
  return `<div class="d-top"><div class="d-head">${head}</div><div class="d-side">${side}</div></div>${body}`
}
// terminal output cleaned for reading, as the File browser's Transcript mode cleans it (frontend/src/lib/terminal.ts):
// ANSI escapes and prompt counters dropped, carriage returns and backspaces applied, other control bytes dropped
// eslint-disable-next-line no-control-regex
const ANSI_RE = /\x1b[@-_][0-?]*[ -/]*[@-~]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)|\x1b[@-Z\\-_]/g
const COUNTER_RE = /<counter>\d*<\/counter> ?/g
// eslint-disable-next-line no-control-regex
const CTRL_RE = /[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g
function applyCursor(s) {
  const out = []
  let line = [], col = 0
  for (const ch of s) {
    if (ch === '\n') { out.push(line.join('')); line = []; col = 0; continue }
    if (ch === '\r') { col = 0; continue }
    if (ch === '\b') { if (col > 0) col--; continue }
    if (col < line.length) line[col] = ch
    else { while (line.length < col) line.push(' '); line.push(ch) }
    col++
  }
  out.push(line.join(''))
  return out.join('\n')
}
function cleanTerminal(s) {
  if (!s) return s
  const lines = applyCursor(s.replace(ANSI_RE, '').replace(COUNTER_RE, '')).replace(CTRL_RE, '').split('\n').map((l) => l.replace(/[ \t]+$/, ''))
  let a = 0, b = lines.length
  while (a < b && lines[a] === '') a++
  while (b > a && lines[b - 1] === '') b--
  return lines.slice(a, b).join('\n')
}
function callText(tc) {
  return Object.entries(tc).map(([k, v]) => `${k}: ${v}`).join('\n')
}
document.getElementById('tb').addEventListener('click', (ev) => {
  const fc = ev.target.closest('[data-file]')
  if (fc) return thimble.navigate(fc.dataset.file, { browser: true })
  if (ev.target.closest('[data-raw]')) { S.raw = !S.raw; return drawList() }
  if (ev.target.closest('tr.det')) return
  const tr = ev.target.closest('tr[data-r]')
  if (tr && !window.getSelection().toString()) pick(+tr.dataset.r)
})
// a record opens in place under its row, which stays where it is under the pointer; a second click closes it. From the
// lanes (scroll), the row is brought into view.
async function pick(r, scroll) {
  const rowEl = () => document.querySelector(`#tb tr[data-r="${r}"]`)
  if (S.open === r && !scroll) {
    const el = rowEl()
    S.open = null; S.detail = null
    thimble.expand(el, drawList)
    renderLanes()
    return
  }
  const i = rowAt.get(r)
  if (i == null) return
  S.open = r
  S.detail = null
  if (!inWin(i)) range.set(null)
  if (!passes(i)) { S.tools.clear(); S.found = null; S.q = ''; document.getElementById('q').value = ''; compute(); renderCtl() }
  await fetchTexts([r])
  const el = rowEl()
  if (el && !scroll) thimble.expand(el, drawList)
  else { drawList(); rowEl()?.scrollIntoView({ block: 'center' }) }
  renderLanes()
  const res = await thimble.fetch({ op: 'record', r, ...(S.keepRow != null ? { keep: [S.keepRow] } : {}) }, { key: 'record' })
  if (S.open !== r) return
  S.detail = res.record
  const el2 = rowEl()
  if (el2) thimble.expand(el2, drawList)
  else drawList()
}

// ---------------------------------------------------------------- render
function renderView() { counts(); renderLanes(); renderList() }
function render() { if (!D) return; compute(); renderCtl(); renderLanes(); renderList() }
function rescope() { document.getElementById('list').scrollTop = 0; render() }
document.getElementById('f-tool').onclick = () => toolMenu()
document.getElementById('f-density').onclick = () => { S.density = !S.density; renderCtl(); renderLanes() }
let typing = null
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(typing)
  typing = setTimeout(async () => {
    const q = e.target.value.trim()
    S.q = q
    if (!q) S.found = null
    else { const res = await thimble.fetch({ op: 'search', q }, { key: 'search' }); if (S.q !== q) return; S.found = new Set(res.rows) }
    rescope()
  }, 200)
})
let resizeTimer = null
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 120) })
// what Reset puts back of this page's own state: the Tool filter and the record opened (the kit puts back the search
// field, the chips and the range)
thimble.onReset({
  changed: () => S.tools.size > 0 || S.open != null,
  reset: () => { S.tools.clear(); S.open = null; S.detail = null; S.found = null; S.q = ''; rescope() },
})

// ---------------------------------------------------------------- places
async function openPlace(t) {
  if (t.r != null) { compute(); renderCtl(); return pick(t.r, true) }
  render()
}
thimble.onOpen(async (place) => {
  const t = (place && place.target) || {}
  if (t.r != null) S.keepRow = t.r
  if (!D || (t.r != null && !rowAt.has(t.r))) { if (!(await load())) return }
  await openPlace(t)
})
// the label filter is the reader's (thimble.kept): a change to it reads the rows again
thimble.onLabels(async (state) => {
  const was = JSON.stringify(labelState.filter)
  labelState = { labels: state.labels || [], filter: state.filter || null }
  if (!D || JSON.stringify(labelState.filter) === was) return
  if (!(await load())) return
  if (S.open != null && !rowAt.has(S.open)) { S.open = null; S.detail = null }
  render()
})
// Color by changed: another label is read from the reader again; a field, Off, or a chip turned off or on draws again
async function colourChanged() {
  if (!D) return
  if (colour.label && loadedBy !== choiceKey()) { if (!(await load())) return }
  if (S.open != null && !rowAt.has(S.open)) { S.open = null; S.detail = null }
  render()
}
// a label's values arriving while it runs change the rows' values while that label is the colour
let marksLater = null
thimble.onMarks(() => {
  if (!colour.label || !D) return
  clearTimeout(marksLater)
  marksLater = setTimeout(async () => {
    const was = V.join('\u0001')
    if ((await load()) && V.join('\u0001') !== was) render()
  }, 400)
})
</script>
