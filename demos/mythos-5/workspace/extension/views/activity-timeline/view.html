<!doctype html>
<html>
<head>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--surface-card); color: var(--text-primary); font: 400 var(--text-ui-sm) / 1.4 var(--font-body); }
  .ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  #ctl { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; padding: 10px 14px; border-bottom: 1px solid var(--border-hairline); }
  .search { position: relative; flex: 0 1 112px; min-width: 96px; }
  .search .field { width: 100%; box-sizing: border-box; padding-left: 27px; }
  .search .ico { position: absolute; left: 8px; top: 50%; margin-top: -7px; color: var(--text-tertiary); pointer-events: none; }
  /* thimble's parts (.field, .btn, .seg, Color by, Filter by, Rows, the time range, the lanes, the side panel, the
     divider) come with the frame; this page only lays them out */
  #mode { flex: none; }
  /* Color by takes the row's last stretch; where less than its button and a chip are left, it wraps to a line of its own */
  #colour { min-width: 220px; }

  /* the overview: the time range over the lanes, the lanes under it; the divider thimble inserts splits it from the list */
  /* no horizontal scroll: the overview and the list fit the pane's width (the divider sets the overview's overflow
     inline, so the rule below wins over it) */
  #overview { flex: none; min-height: 0; overflow: hidden auto; }
  #overview, #list { overflow-x: hidden !important; }
  #chart { padding: 8px 14px 6px; }
  .time { display: grid; grid-template-columns: var(--g) minmax(0, 1fr); align-items: center; column-gap: 0; }
  #rread { align-self: center; }
  #key { grid-column: 2; }
  #axis { grid-column: 2; }
  #lanes { --thimble-names: var(--g); margin-top: 4px; }

  #body { flex: 1; min-height: 0; }
  #list { overflow: hidden auto; }
  /* what the list shows: the selection and its count, named over the rows */
  #lhead { position: sticky; top: 0; z-index: 1; display: flex; align-items: baseline; gap: 8px; padding: 7px 14px 6px; background: var(--surface-card); border-bottom: 1px solid var(--border-hairline); }
  #lhead .t { font: 500 var(--text-sm) / 1.3 var(--font-body); color: var(--text-primary); }
  #lhead .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); font-variant-numeric: tabular-nums; }
  #lhead .clear { margin-left: auto; }
  #tbl { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
  #tbl td.t { padding-left: 14px; }
  #tbl td { padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border-bottom: 1px solid var(--border-hairline); }
  #tbl td.t { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  #tbl td.i { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  #tbl td.x { font-family: var(--font-body); font-size: var(--text-xs); color: var(--text-primary); }
  #tbl .tool { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  #tbl tbody tr:hover > td { background: var(--surface-hover); }
  #tbl tr.active > td { background: var(--surface-selected); }
  .empty { padding: 28px 14px; color: var(--text-tertiary); font-size: var(--text-xs); }

  /* a record in the side panel */
  .d-side { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .d-side .btn .ico { width: 13px; height: 13px; color: var(--text-tertiary); }
  .d-sec { display: flex; align-items: center; gap: 8px; margin: 12px 0 3px; font: 500 var(--text-ui-sm) / 1.3 var(--font-body); color: var(--text-secondary); }
  .d-sec:first-child { margin-top: 0; }
  .prose { margin: 4px 0 0; font: 400 var(--text-sm) / 1.5 var(--font-body); color: var(--text-primary); white-space: pre-wrap; overflow-wrap: anywhere; }
  .code { margin: 4px 0 0; padding: 8px 10px; border-radius: var(--radius-ui); background: var(--surface-card); box-shadow: inset 0 0 0 1px var(--border-hairline); font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .code.res { color: var(--text-secondary); }
  .d-meta { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
</style>
</head>
<body>
<div id="ctl">
  <label class="search"><svg class="ico" viewBox="0 0 24 24"><path d="M4 10.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M15.2 15.2L20 20"/></svg><input id="q" class="field" type="search" placeholder="Search" aria-label="Search records" autocomplete="off" spellcheck="false"></label>
  <span id="mode" class="seg seg-track" role="group" aria-label="Lanes show"><button class="seg-opt active" type="button" data-mode="events" aria-pressed="true">Events</button><button class="seg-opt" type="button" data-mode="density" aria-pressed="false">Density</button></span>
  <span id="filter"></span>
  <span id="rows"></span>
  <span id="colour"></span>
</div>
<section id="overview">
  <div id="chart">
    <div class="time"><div id="rread"></div><div id="range"></div><div id="key"></div><div id="axis"></div></div>
    <div id="lanes"></div>
  </div>
</section>
<div id="body">
  <section id="list" tabindex="-1">
    <div id="lhead"><span class="t"></span><span class="n"></span></div>
    <table id="tbl" class="table">
      <colgroup><col style="width: 92px"><col style="width: 132px"><col></colgroup>
      <thead hidden></thead>
      <tbody id="tb"></tbody>
    </table>
  </section>
</div>
<script>
'use strict'
// Activity Timeline: one agent transcript on a time axis. The time range holds the whole run and frames the part the
// lanes and the list show. The lanes are grouped by thimble's Rows control (a label such as tactic, or a field like
// Tool), colored by thimble's Color by control and filtered by thimble's Filter by control, all in the top row. Events
// draws each record as a mark in its lane at its time; Density draws each lane as bars on the range's bins, stacked by
// the Color by values. The context compaction (the two Human turns) is a flag on the axis. A record opens in the side
// panel beside the list, with a button that opens the transcript at that message; choosing a lane shows that lane's
// records, named over the list. The list rows carry their ref (so thimble marks them) and their time (so the lanes tint
// the rows in view); Reset puts back the filters, the range, the lane chosen and the record opened.
const TOOL_LABEL = { '': 'Reasoning', terminal: 'terminal', create_tool: 'create', view_tool: 'view', str_replace_tool: 'str_replace', insert_tool: 'insert' }
const G = 150 // the lane names' and the readout's gutter
document.documentElement.style.setProperty('--g', G + 'px')
const ICON = { open: 'M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4' }
const ico = (n, c = 'ico') => `<svg class="${c}" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const hhmm = (t, s) => new Date(t * 1000).toISOString().slice(11, s ? 19 : 16)

// ---------------------------------------------------------------- data (one item per loaded row)
let D = null, N = 0, items = [], byRow = new Map()
let loadSeq = 0
let labelState = { labels: [], filter: null }
const texts = new Map()
const S = { q: '', found: null, density: false, open: null, detail: null, raw: false, keepRow: null, lane: null }

const toolName = (ti) => TOOL_LABEL[(D && D.names.tool[ti]) || ''] || null

async function load() {
  const my = ++loadSeq
  const COLS = ['r', 't', 'ln', 'ix', 'tool', 'role', 'typ', 'hu', 'g']
  const c = Object.fromEntries(COLS.map((k) => [k, []]))
  let first = null, from = 0
  do {
    const page = await thimble.fetch({ op: 'overview', from, rows: rowsCtl.query(), ...(S.keepRow != null ? { keep: [S.keepRow] } : {}) }, { key: 'overview' })
    if (my !== loadSeq) return false
    if (!first) first = page
    for (const k of COLS) for (const x of page.cols[k] || []) c[k].push(x)
    from = page.next
  } while (from != null)
  D = first
  N = c.r.length
  loadedRows = rowsKey()
  items = []
  byRow = new Map()
  for (let i = 0; i < N; i++) {
    const it = {
      r: c.r[i], ref: `${D.file}#L${c.ln[i]}`, t: D.t0 + c.t[i], line: c.ln[i], ix: c.ix[i],
      tool: toolName(c.tool[i]), role: D.names.role[c.role[i]] || null, typ: D.names.typ[c.typ[i]],
      hu: !!c.hu[i], group: c.g[i] == null ? null : String(c.g[i]),
    }
    items.push(it)
    byRow.set(it.r, it)
  }
  return true
}
const itemOf = (r) => byRow.get(r)

// ---------------------------------------------------------------- Filter by, Rows, Color by (the top row)
// Filter by: which rows show, by Tool, Role or any label. Rows: what the lanes are grouped by — it opens on the tactic
// label where it has run, else on Tool; the label it groups by is not the colour. Color by: the one colour, Tool to open.
const FIELDS = [
  { name: 'tool', title: 'Tool', description: 'The tool the record called; Reasoning for a message with no tool call', value: (it) => (it && it.tool) || null },
  { name: 'role', title: 'Role', description: 'System (the one system prompt), Assistant, or Human (a context-compaction turn)', value: (it) => (it && it.role) || null },
]
const filter = thimble.filterBy({ mount: '#filter', fields: FIELDS, onChange: () => rescope() })
const rowsCtl = thimble.rows({ mount: '#rows', fields: FIELDS, initial: [{ label: 'tactic' }, 'tool'], onChange: rowsChanged })
const colour = thimble.colorBy({
  mount: '#colour',
  fields: [
    { name: 'tool', title: 'Tool', description: FIELDS[0].description,
      values: [
        { name: 'terminal', meaning: 'A shell command and its output' },
        { name: 'Reasoning', meaning: 'Reasoning or a reply, with no tool call' },
        { name: 'view', meaning: 'A file or folder read' },
        { name: 'create', colour: 5, meaning: 'A file written' },
        { name: 'str_replace', colour: 6, meaning: 'An edit to a file' },
      ],
      value: (it) => (it && it.tool) || null },
    { name: 'role', title: 'Role', description: FIELDS[1].description, value: (it) => (it && it.role) || null },
  ],
  initial: 'tool',
  strip: '#list',
  onChange: colourChanged,
})
let loadedRows = null
const rowsKey = () => { const q = rowsCtl.query(); return q ? (q.label ? `l:${q.label}` : `f:${q.field}`) : '' }

// ---------------------------------------------------------------- the time range: the whole run, a viewfinder over it
// the context compaction: the two Human turns sit together, so they are one flag
function compactions() {
  const out = []
  for (const bd of (D && D.boundaries) || []) {
    const t = D.t0 + bd.t
    if (out.length && t - out[out.length - 1].t < 1800) continue
    out.push({ t, label: 'context compaction' })
  }
  return out
}
const range = thimble.timeRange({
  mount: '#range',
  readout: '#rread',
  onChange: () => { if (D) renderView() },
  onInput: () => { if (D) lanes.draw(laneItems()) },
})
const inWin = (i) => range.has(i.t)

// ---------------------------------------------------------------- scope
function passes(i) { return !(S.found && !S.found.has(i.r)) }
let scoped = []
function compute() {
  scoped = items.filter((i) => passes(i) && filter.keeps(i))
  let lo = Infinity, hi = -Infinity
  for (const i of items) { lo = Math.min(lo, i.t); hi = Math.max(hi, i.t) }
  if (!(hi > lo)) { lo = (lo || 0) - 60; hi = lo + 120 }
  const room = (hi - lo) * 0.004
  range.data({ span: [lo - room, hi + room], times: scoped.map((i) => i.t), values: scoped.map((i) => colour.valueOf(i)), marks: compactions() })
}
// the chips' counts: the records in scope and in the range, by the Color by value
function counts() {
  const n = {}
  for (const i of scoped) if (inWin(i)) { const v = colour.valueOf(i) ?? ''; n[v] = (n[v] || 0) + 1 }
  colour.counts(n)
  const f = {}
  for (const i of scoped) if (inWin(i)) { const v = filter.valueOf(i) ?? ''; f[v] = (f[v] || 0) + 1 }
  filter.counts(f)
}

// ---------------------------------------------------------------- the lanes
const laneItems = () => scoped.filter(inWin)
const lanes = thimble.lanes({
  mount: '#lanes',
  keyMount: '#key',
  rows: rowsCtl,
  range,
  colour,
  names: G,
  time: (it) => it.t,
  density: () => S.density,
  follow: '#list',
  onPick: (lane) => { S.lane = lane.key === S.lane ? null : lane.key; pageCheck && pageCheck(); drawList() },
  onMark: (it) => pick(it.r),
})

// ---------------------------------------------------------------- the list: the records of the range, in the side panel
const side = thimble.side({ mount: '#body', onClose: () => { S.open = null; S.detail = null; drawList(); pageCheck && pageCheck() } })
const listRows = () => laneItems().filter((i) => !S.lane || laneKeyOf(i) === S.lane)
// a record's lane key, as the Rows control groups it (its reader-given group under the current Rows choice)
const laneKeyOf = (i) => { const g = rowsCtl.groupOf(i); return g == null ? '\u0000none' : String(g) }

async function fetchTexts(rows) {
  const want = rows.filter((r) => !texts.has(r))
  for (let p = 0; p < want.length; p += 1000) {
    const res = await thimble.fetch({ op: 'texts', rows: want.slice(p, p + 1000) })
    for (const [row, t] of res.texts) texts.set(row, t)
  }
}
let listSeq = 0
async function renderList() {
  const my = ++listSeq
  await fetchTexts(listRows().map((i) => i.r))
  if (my !== listSeq) return
  drawList()
}
function laneName(key) {
  if (key == null) return null
  for (const n of lanes.lanes) if (String(n.key) === String(key)) return n.name
  return key === '\u0000none' ? 'Not marked' : String(key)
}
function drawList() {
  const rows = listRows()
  const head = document.getElementById('lhead')
  const name = S.lane != null ? laneName(S.lane) : (rowsCtl.by ? 'All ' + rowsCtl.by.title.toLowerCase() + ' lanes' : 'All records')
  head.querySelector('.t').textContent = name
  head.querySelector('.n').textContent = rows.length.toLocaleString('en-US') + (rows.length === 1 ? ' record' : ' records')
  let clear = head.querySelector('.clear')
  if (S.lane != null) {
    if (!clear) { clear = document.createElement('button'); clear.className = 'btn btn-ghost btn-sm clear'; clear.type = 'button'; clear.textContent = 'All records'; clear.onclick = () => { S.lane = null; lanes.choose(null); drawList(); pageCheck && pageCheck() }; head.appendChild(clear) }
  } else if (clear) clear.remove()
  let h = ''
  for (const i of rows) {
    const text = texts.get(i.r) || ''
    const ca = colour.attr(i)
    h += `<tr data-r="${i.r}" data-anchor="${esc(i.ref)}" data-anchor-text="${esc(text)}" data-t="${i.t}" class="${S.open === i.r ? 'active' : ''}"${ca}>`
    h += `<td class="t">${hhmm(i.t, 1)}</td>`
    h += `<td class="tool">${esc(i.tool || '—')}</td>`
    h += `<td class="x">${esc(text)}</td></tr>`
  }
  if (!rows.length) h = `<tr><td colspan="3" class="empty">No records pass these filters</td></tr>`
  document.getElementById('tb').innerHTML = h
}
colour.strip('#list', { preview: (el) => (el && el.querySelector && el.querySelector('td.t') ? { when: el.querySelector('td.t').textContent, text: (el.querySelector('td.x') || el).textContent.slice(0, 160) } : null) })

// ---------------------------------------------------------------- a record in the side panel
function details(body, rec) {
  const inferred = !rec.timestamp || /T21:/.test(rec.timestamp)
  const when = (rec.time || '').replace('T', ' ').replace('Z', ' UTC')
  const meta = `<span class="d-meta">${rec.role || ''}${rec.tool ? ' · ' + esc(TOOL_LABEL[rec.tool] || rec.tool) : ' · ' + esc(TOOL_LABEL[''])}${inferred ? ' · ≈ ' : ' · '}${esc(when)}</span>`
  const openBtn = `<button class="btn btn-secondary btn-sm" type="button" data-file="${esc(rec.ref)}" title="Open ${esc(D.file)} in Files at line ${rec.line}">${ico('open')}Open in transcript</button>`
  let b = `<div class="d-side">${openBtn}</div>` + meta
  if (rec.type === 'ToolMessage') {
    if (rec.tool_call != null) b += `<div class="d-sec">Tool call — ${esc(rec.tool || 'tool')}</div><div class="code">${esc(typeof rec.tool_call === 'string' ? rec.tool_call : callText(rec.tool_call))}</div>`
    if (rec.tool_result != null) {
      const raw = String(rec.tool_result), clean = rec.tool === 'terminal' ? cleanTerminal(raw) : raw, differs = clean !== raw
      const rawBtn = differs ? `<button class="btn btn-ghost btn-sm${S.raw ? ' active' : ''}" type="button" data-raw aria-pressed="${S.raw}">Raw</button>` : ''
      b += `<div class="d-sec">Result${rawBtn}</div><div class="code res">${esc(S.raw || !differs ? raw : clean)}</div>`
    }
  } else if (rec.content != null) {
    b += `<div class="d-sec">${rec.role === 'Human' ? 'Context-compaction turn' : rec.role === 'System' ? 'System prompt' : 'Reasoning'}</div><div class="prose">${esc(rec.content)}</div>`
  }
  body.innerHTML = b
}
function openSide(i, rec) {
  side.open({
    title: `#${i.ix} · ${TOOL_LABEL[rec && rec.tool || toolName(0)] || (i.tool || 'Reasoning')}`,
    sub: hhmm(i.t, 1) + ' UTC',
    ref: i.ref,
    render: (body) => (rec ? details(body, rec) : (body.innerHTML = '<div class="empty">Reading the record…</div>')),
  })
}
// terminal output cleaned for reading, as the File browser's Transcript mode cleans it (frontend/src/lib/terminal.ts)
// eslint-disable-next-line no-control-regex
const ANSI_RE = /\x1b[@-_][0-?]*[ -/]*[@-~]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)|\x1b[@-Z\\-_]/g
const COUNTER_RE = /<counter>\d*<\/counter> ?/g
// eslint-disable-next-line no-control-regex
const CTRL_RE = /[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g
function applyCursor(s) {
  const out = []
  let line = [], col = 0
  for (const ch of s) {
    if (ch === '\n') { out.push(line.join('')); line = []; col = 0; continue }
    if (ch === '\r') { col = 0; continue }
    if (ch === '\b') { if (col > 0) col--; continue }
    if (col < line.length) line[col] = ch
    else { while (line.length < col) line.push(' '); line.push(ch) }
    col++
  }
  out.push(line.join(''))
  return out.join('\n')
}
function cleanTerminal(s) {
  if (!s) return s
  const lines = applyCursor(s.replace(ANSI_RE, '').replace(COUNTER_RE, '')).replace(CTRL_RE, '').split('\n').map((l) => l.replace(/[ \t]+$/, ''))
  let a = 0, b = lines.length
  while (a < b && lines[a] === '') a++
  while (b > a && lines[b - 1] === '') b--
  return lines.slice(a, b).join('\n')
}
function callText(tc) { return Object.entries(tc).map(([k, v]) => `${k}: ${v}`).join('\n') }

document.getElementById('tb').addEventListener('click', (ev) => {
  const tr = ev.target.closest('tr[data-r]')
  if (tr && !window.getSelection().toString()) pick(+tr.dataset.r)
})
document.getElementById('body').addEventListener('click', (ev) => {
  const fc = ev.target.closest('[data-file]')
  if (fc) return thimble.navigate(fc.dataset.file, { browser: true })
  if (ev.target.closest('[data-raw]') && side.body && S.detail) { S.raw = !S.raw; details(side.body, S.detail) }
})
// a record opens in the side panel; a second click on the same row closes it
async function pick(r, scroll) {
  const i = itemOf(r)
  if (i == null) return
  if (S.open === r && !scroll) { S.open = null; S.detail = null; side.close(); drawList(); pageCheck && pageCheck(); return }
  S.open = r
  S.detail = null
  if (!inWin(i)) range.set(null)
  if (!passes(i)) { S.found = null; S.q = ''; document.getElementById('q').value = ''; compute() }
  if (S.lane != null && laneKeyOf(i) !== S.lane) S.lane = null
  await fetchTexts([r])
  openSide(i, null)
  drawList()
  if (scroll) document.querySelector(`#tb tr[data-r="${r}"]`)?.scrollIntoView({ block: 'center' })
  pageCheck && pageCheck()
  const res = await thimble.fetch({ op: 'record', r, ...(S.keepRow != null ? { keep: [S.keepRow] } : {}) }, { key: 'record' })
  if (S.open !== r) return
  S.detail = res.record
  if (side.ref === i.ref) openSide(i, res.record)
}

// ---------------------------------------------------------------- render
function renderView() { counts(); lanes.draw(laneItems()); renderList() }
function render() { if (!D) return; compute(); counts(); lanes.draw(laneItems()); renderList() }
function rescope() { document.getElementById('list').scrollTop = 0; render() }
document.getElementById('mode').onclick = (ev) => {
  const o = ev.target.closest('[data-mode]')
  if (!o || (o.dataset.mode === 'density') === S.density) return
  S.density = o.dataset.mode === 'density'
  for (const b of document.querySelectorAll('#mode .seg-opt')) { const on = (b.dataset.mode === 'density') === S.density; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on ? 'true' : 'false') }
  lanes.draw(laneItems())
}
let typing = null
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(typing)
  typing = setTimeout(async () => {
    const q = e.target.value.trim()
    S.q = q
    if (!q) S.found = null
    else { const res = await thimble.fetch({ op: 'search', q }, { key: 'search' }); if (S.q !== q) return; S.found = new Set(res.rows) }
    rescope()
  }, 200)
})
let resizeTimer = null
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (D) lanes.draw(laneItems()) }, 120) })
thimble.divider({ top: '#overview' })
let pageCheck = null
pageCheck = thimble.onReset({
  changed: () => S.open != null || S.lane != null || S.density,
  reset: () => { S.open = null; S.detail = null; S.lane = null; S.found = null; S.q = ''; S.density = false; side.close(); lanes.choose(null); for (const b of document.querySelectorAll('#mode .seg-opt')) { const on = b.dataset.mode === 'events'; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on ? 'true' : 'false') } rescope() },
}).check

// ---------------------------------------------------------------- places, labels, colour, rows
async function openPlace(t) {
  if (t.r != null) { compute(); return pick(t.r, true) }
  render()
}
thimble.onOpen(async (place) => {
  const t = (place && place.target) || {}
  if (t.r != null) S.keepRow = t.r
  if (!D || (t.r != null && !byRow.has(t.r))) { if (!(await load())) return }
  await openPlace(t)
})
thimble.onLabels(async (state) => {
  const was = JSON.stringify(labelState.filter)
  labelState = { labels: state.labels || [], filter: state.filter || null }
  if (!D || JSON.stringify(labelState.filter) === was) return
  if (!(await load())) return
  if (S.open != null && !byRow.has(S.open)) { S.open = null; S.detail = null; side.close() }
  render()
}
)
async function colourChanged() {
  if (!D) return
  if (S.open != null && !byRow.has(S.open)) { S.open = null; S.detail = null; side.close() }
  render()
}
// Rows changed: the lane each record takes is read again (the reader gives it under the new choice)
async function rowsChanged() {
  if (!D) return
  S.lane = null
  lanes.choose(null)
  if (loadedRows !== rowsKey()) { if (!(await load())) return }
  render()
}
// a label's values arriving while it runs change the lanes (a label Rows groups by) or the colours (a label Color by
// uses): the rows are read again so the first frame's lanes are right
let marksLater = null
thimble.onMarks(() => {
  if (!D) return
  clearTimeout(marksLater)
  marksLater = setTimeout(async () => {
    const sig = items.map((i) => i.group).join('\u0001')
    if (rowsCtl.label && (await load()) && items.map((i) => i.group).join('\u0001') !== sig) render()
    else render()
  }, 300)
})
</script>
