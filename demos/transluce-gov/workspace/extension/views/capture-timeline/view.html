<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .chip, .btn, .seg), its Colour by control and the theme's tokens come with the frame; this
     page lays out the control row, a lane per section, and the capture log with the capture picked beside it */
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--surface-card); color: var(--text-primary); font: 400 var(--text-ui-sm) / 1.4 var(--font-body); }
  button { font: inherit; }
  .ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: var(--font-mono); }

  #ctl { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 9px 14px; border-bottom: 1px solid var(--border-hairline); }
  .search { position: relative; flex: 0 1 220px; min-width: 128px; }
  .search .field { width: 100%; box-sizing: border-box; padding-left: 27px; padding-right: 30px; }
  .search > .ico { position: absolute; left: 8px; top: 50%; margin-top: -7px; color: var(--text-tertiary); pointer-events: none; }
  #rx { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); }
  #colour { min-width: 340px; margin-left: 6px; }
  .fbtn.field { flex: none; padding: 0 7px 0 9px; }
  .fbtn .ico { width: 12px; height: 12px; color: var(--text-tertiary); }
  .fbtn .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  #chips { display: contents; }
  #chips .chip { flex: none; max-width: 240px; }
  #chips .ico { width: 10px; height: 10px; }

  #lanes { flex: none; position: relative; padding: 3px 0 2px; }
  #split { flex: none; height: 7px; margin-top: -3px; margin-bottom: -3px; position: relative; z-index: 5; cursor: row-resize; }
  #split::after { content: ''; position: absolute; left: 0; right: 0; top: 3px; height: 1px; background: var(--border-strong); }
  #split:hover::after, #split.drag::after { height: 2px; top: 2.5px; background: rgba(var(--ink-rgb), 0.4); }
  .lane { position: relative; display: flex; align-items: stretch; padding: 0 14px; cursor: crosshair; }
  .lane + .lane { border-top: 1px solid var(--border-hairline); }
  .lane:hover { background: rgba(var(--ink-rgb), 0.025); }
  .lane.sel { background: var(--surface-selected); }
  .gut { flex: none; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; padding-right: 12px; cursor: pointer; }
  .gut .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 400 var(--text-ui-sm) / 1.2 var(--font-body); }
  .gut .nm b { font-weight: 500; }
  .gut .nm .h { color: var(--text-tertiary); }
  .gut .st { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text-secondary); font: 400 10.5px / 1.25 var(--font-mono); font-variant-numeric: tabular-nums; }
  .gut .mix { display: flex; height: 4px; overflow: hidden; border-radius: 2px; background: rgba(var(--ink-rgb), 0.06); }
  .gut .mix i { display: block; height: 100%; }
  .lane.sel .gut .nm b { font-weight: 600; }
  .lane.empty .gut .nm, .lane.empty .gut .st { color: var(--text-tertiary); }
  svg.bars { display: block; flex: 1; min-width: 0; overflow: visible; user-select: none; -webkit-user-select: none; }
  svg text { font: 400 10px var(--font-mono); fill: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  svg text.d { fill: var(--text-secondary); }
  svg .base { stroke: var(--border-strong); stroke-width: 1; }
  svg .top { stroke: rgba(var(--ink-rgb), 0.09); stroke-width: 1; stroke-dasharray: 2 3; }
  svg .brk { stroke: var(--text-tertiary); stroke-width: 1.2; fill: none; }
  svg .brush { fill: rgba(var(--ink-rgb), 0.06); stroke: var(--text-primary); stroke-width: 1.25; }
  .lane > .chip { position: absolute; top: 3px; right: 16px; pointer-events: none; }

  /* the bottom: the log (one, or two side by side), and on demand the capture picked in it beside it or over it */
  #bottom { flex: 1; min-height: 0; display: flex; position: relative; }
  #log { flex: 1; min-width: 0; display: flex; }
  #cols { flex: 1; min-width: 0; display: flex; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
  .col[hidden] { display: none; }
  .col + .col { border-left: 1px solid var(--border-strong); }
  .lhead { flex: none; display: flex; flex-wrap: nowrap; align-items: center; column-gap: 8px; row-gap: 2px; min-width: 0; min-height: 34px; box-sizing: border-box; padding: 5px 8px 5px 14px; border-bottom: 1px solid var(--border-hairline); }
  .lhead .who { flex: none; max-width: 45%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
  .lhead select.field { flex: 0 1 auto; min-width: 90px; max-width: 220px; }
  .lhead .rng .rt { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .lhead .rng { display: inline-flex; align-items: center; gap: 2px; flex: 0 1 auto; min-width: 0; color: var(--text-primary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); white-space: nowrap; }
  .lhead .cnt { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .lhead .sp { flex: 1 1 0; }
  [data-unrange] .ico, [data-unpair] .ico, .hd [data-back] .ico { width: 12px; height: 12px; }
  .lhead .btn { flex: none; gap: 5px; }
  .lcap, .lr { display: grid; grid-template-columns: 62px 44px 46px 13px 64px minmax(0, 1fr); align-items: center; column-gap: 8px; padding: 0 12px 0 14px; }
  .lcap .org { margin-left: 6px; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .lcap > span:last-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  @container (max-width: 560px) {
    .lhead .btn .lbl { display: none; }
  }
  @container (max-width: 520px) {
    .lcap, .lr { grid-template-columns: 58px 40px 42px 13px minmax(0, 1fr); }
    .lcap .m, .lr .m { display: none; }
  }
  .lcap { flex: none; height: 24px; border-bottom: 1px solid var(--border-hairline); color: var(--text-tertiary); font: 400 10.5px / 1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; }
  .lcap .org { letter-spacing: 0; text-transform: none; }
  .rows { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .lr { height: 24px; cursor: pointer; font: 400 var(--text-mono-sm) / 24px var(--font-mono); }
  .lr:hover { background: var(--surface-hover); }
  .lr.on { background: var(--surface-selected); }
  .lr > span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .lr .t { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .lr .n { color: var(--text-secondary); text-align: right; }
  .lr .m { color: var(--text-tertiary); }
  .lr .u { display: flex; color: var(--text-primary); }
  .lr .u > span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .lr .u > .pre { flex: 0 100000 auto; min-width: 2ch; direction: rtl; text-align: left; }
  .lr .u > .pre > span { direction: ltr; unicode-bidi: isolate; }
  .lr .u > .post { flex: 0 1 auto; }
  .u mark, .det .url mark { background: rgba(var(--ink-rgb), 0.13); color: var(--text-primary); font-weight: 600; border-radius: 2px; }
  .u .cb, .det .url .cb { color: var(--text-tertiary); }
  .u .var, .det .url .var { padding: 0 2px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--border-strong); }
  .lr .b, .lcap .b { display: inline-flex; align-items: center; }
  .lr .doc, .lcap .doc { width: 12px; height: 12px; stroke-width: 2; color: var(--text-secondary); }
  .lcap .doc { color: var(--text-tertiary); }
  .lday { padding: 8px 14px 3px; border-bottom: 1px solid var(--border-hairline); color: var(--text-secondary); font: 500 var(--text-xs) / 1.2 var(--font-body); }
  .lmore { display: flex; justify-content: center; padding: 8px; }
  .note { padding: 18px 14px; color: var(--text-tertiary); font-size: var(--text-xs); }

  #detail { flex: 0 0 40%; min-width: 300px; max-width: 560px; overflow: auto; border-left: 1px solid var(--border-strong); }
  #detail[hidden] { display: none; }
  .back { display: none; }
  body.narrow #detail { display: none; }
  body.narrow.picked #log { display: none; }
  body.narrow.picked #detail { display: block; position: absolute; inset: 0; z-index: 4; min-width: 0; max-width: none; border-left: 0; background: var(--surface-card); }
  body.narrow.picked .back { display: inline-flex; margin: 8px 14px 0; }
  .det { padding: 10px 14px 16px; }
  .det h3 { margin: 0 0 2px; font: 500 var(--text-sm) / 1.35 var(--font-body); }
  .det .hd { display: flex; align-items: flex-start; gap: 8px; }
  .det .hd h3 { flex: 1; min-width: 0; }
  body.narrow .det .hd [data-back] { display: none; }
  .det .sub { color: var(--text-secondary); font: 400 var(--text-xs) / 1.45 var(--font-body); overflow-wrap: anywhere; }
  .det .url { margin: 8px 0 4px; font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); overflow-wrap: anywhere; color: var(--text-primary); }
  .det .ans { margin: 8px 0 6px; padding: 3px 0 3px 10px; font: 400 var(--text-ui-sm) / 1.35 var(--font-body); }
  .det .ans b { font-weight: 600; font-family: var(--font-mono); }
  .det .acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .det .acts .ico { width: 13px; height: 13px; }
  .det .sec { margin: 16px 0 5px; color: var(--text-secondary); font: 500 var(--text-xs) / 1.2 var(--font-body); }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 0; font: 400 var(--text-mono-sm) / 1.45 var(--font-mono); }
  .kv dt { color: var(--text-secondary); font-family: var(--font-body); font-size: var(--text-xs); }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; color: var(--text-primary); }
  .kv dd .none { color: var(--text-tertiary); }
  .body { margin: 4px 0 0; max-height: 280px; overflow: auto; padding: 8px 10px; border-radius: var(--radius-ui); background: var(--bg-sub); font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-primary); }
  .mems { max-height: 200px; overflow-y: auto; }
  .mem { display: grid; grid-template-columns: 64px 40px minmax(0, 1fr); gap: 8px; padding: 2px 4px 2px 8px; border-radius: 3px; font: 400 var(--text-mono-sm) / 1.45 var(--font-mono); cursor: pointer; }
  .mem:hover { background: var(--surface-hover); }
  .mem.on { background: var(--surface-selected); }
  .mem > span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .mem .t { color: var(--text-secondary); }

  .pop { position: fixed; z-index: 60; min-width: 200px; max-width: 320px; max-height: 70vh; overflow: auto; padding: 4px; border-radius: var(--radius-ui); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), 0.14); font: 400 var(--text-ui-sm) / 1.3 var(--font-body); }
  .pop .head { padding: 8px 8px 4px; font: 500 var(--text-xs) / 1 var(--font-body); color: var(--text-tertiary); }
  .pop .sep { height: 1px; margin: 4px 0; background: var(--border-hairline); }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: none; color: var(--text-primary); font: inherit; text-align: left; cursor: pointer; }
  .item:hover { background: var(--surface-hover); }
  .item .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .lab .h { color: var(--text-tertiary); }
  .item .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .box { display: inline-grid; place-items: center; flex: none; width: 14px; height: 14px; box-sizing: border-box; border: 1.5px solid rgba(var(--ink-rgb), 0.35); border-radius: 3px; }
  .box.on { border-color: var(--text-primary); background: var(--text-primary); }
  .box.on::after { content: ''; width: 6px; height: 3px; margin-top: -2px; border: solid var(--surface-card); border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg); }
  .pop.wide { max-width: none; max-height: none; padding: 0; overflow: visible; }
  .fgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: min(800px, calc(100vw - 12px)); }
  .fcol { max-height: min(64vh, 480px); overflow-y: auto; padding: 4px; }
  .fcol + .fcol { border-left: 1px solid var(--border-hairline); }
  .fcol .item { align-items: flex-start; min-height: 0; padding-top: 5px; padding-bottom: 5px; }
  .fcol .item .box { margin-top: 1px; }
  .fcol .item .lab { white-space: normal; overflow-wrap: anywhere; line-height: 1.3; }
  .fcol .item .n { line-height: 1.3; }
  .fsub { padding: 7px 8px 2px; color: var(--text-secondary); font: 500 var(--text-xs) / 1.2 var(--font-body); }

  #tip { position: fixed; z-index: 70; display: none; max-width: 300px; padding: 7px 9px; border-radius: var(--radius-ui); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px -14px rgba(var(--ink-rgb), 0.32); pointer-events: none; font: 400 var(--text-xs) / 1.45 var(--font-body); color: var(--text-primary); }
  #tip .h { margin-bottom: 3px; color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  #tip .r { display: flex; align-items: center; gap: 6px; padding-left: 8px; box-shadow: inset 3px 0 0 var(--c, transparent); font: 400 var(--text-mono-sm) / 1.6 var(--font-mono); }
  #tip .r .v { margin-left: auto; padding-left: 12px; }
  #wait { position: absolute; right: 16px; bottom: 6px; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); pointer-events: none; }
</style>
</head>
<body>
<div id="ctl">
  <label class="search"><svg class="ico" viewBox="0 0 24 24"><path d="M4 10.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M15.2 15.2L20 20"/></svg><input id="q" class="field" type="search" placeholder="Search URLs" autocomplete="off" spellcheck="false" aria-label="Search target URLs"><button id="rx" class="chip chip-plain chip-act" type="button" aria-pressed="false" title="Regular expression">.*</button></label>
  <button id="f-secs" class="field fbtn" type="button" aria-expanded="false" aria-haspopup="menu"></button>
  <button id="f-more" class="field fbtn" type="button" aria-expanded="false" aria-haspopup="menu"></button>
  <span id="chips"></span>
  <span id="colour"></span>
</div>
<section id="lanes"><span id="wait"></span></section>
<div id="split" role="separator" aria-orientation="horizontal" aria-label="Resize the lanes and the log"></div>
<div id="bottom">
  <section id="log"><div id="cols"></div></section>
  <aside id="detail"></aside>
</div>
<div id="tip"></div>
<script>
'use strict'
// Capture Timeline: a lane per section, its captures per minute stacked by the value the Colour by control
// colours by (the site's answer by default), on the lane's own axis fitted to its active periods (a gap of over an hour
// breaks it). A drag in a lane picks a time range and opens its capture log below, runs of near-identical URLs folded
// into one row; a second log can sit beside the first. A click on a log row opens the capture, or the run's captures,
// beside the log.
// Colour: thimble's Colour by control in the control row; the reader counts each minute by the chosen field's values
// or a label's, leaves out the values turned off, and gives each log row its value, which thimble draws as the row's
// left edge; the lanes draw the same colours themselves.
const slug = (thimble.view && thimble.view.slug) || 'capture-timeline'
const MONTH = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const WEEKDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
const BINS = [1, 2, 3, 5, 10, 15, 20, 30, 60, 120, 180, 360, 720, 1440] // minutes a bar may gather
const STEPS = [1, 2, 5, 10, 15, 30, 60, 120, 180, 360, 720, 1440] // minutes between axis labels
const BREAK = 14 // px between two active periods of a lane
const SEG_MIN = 30 // px an active period takes at least
const LABEL_CW = 6.1 // px per character of an axis label
const BAR_MAX = 7 // px a bar is wide at most, in a short period drawn wide
const PAGE = 200
const NARROW = 760 // below this pane width the capture opens over the log, and below twice it over two logs side by side
// the answer classes in their order, each in the label palette's colour it names: 2xx green, 3xx blue, 4xx olive, 5xx
// orange (the palette has no red)
const ANSWERS = [{ name: '2xx', colour: 3 }, { name: '3xx', colour: 1 }, { name: '4xx', colour: 5 }, { name: '5xx', colour: 2 }]
// the commonest status codes, most first, each in a colour of its answer's hue (2xx greens, 3xx blues, 4xx olive, 5xx
// orange and browns); the rarer codes take the places left
const STATUSES = [{ name: '302', colour: 1 }, { name: '200', colour: 3 }, { name: '504', colour: 2 }, { name: '500', colour: 7 }, { name: '404', colour: 5 }, { name: '503', colour: 11 }, { name: '301', colour: 8 }, { name: '202', colour: 9 }]
const CLS_WORD = { '2xx': 'the page was sent', '3xx': 'sent on to another address', '4xx': 'refused or not found', '5xx': 'server error or time-out' }
const CODE_WORD = { 200: 'the page was sent', 201: 'created', 202: 'accepted, not yet done', 204: 'no content', 206: 'part of the page was sent', 301: 'moved for good to another address', 302: 'sent on to another address', 303: 'sent on to another address', 304: 'not changed since the last copy', 307: 'sent on to another address for now', 308: 'moved for good to another address', 400: 'the site refused the request as malformed', 401: 'the site asked for a login', 403: 'the site refused access', 404: 'the site has no such page', 405: 'the site does not take this kind of request', 410: 'the page is gone', 429: 'the site said too many requests', 500: 'the site had an error', 502: 'a server in front of the site got no good answer', 503: 'the site was unavailable', 504: 'the site did not answer in time', 520: 'the site sent an unknown error', 524: 'the site did not answer in time' }
const WITHHELD_RX = /\[(?:REDACTED|OPAQUE_OMITTED|WITHHELD)/
const WITHHELD_NOTE = 'Transluce withheld the bracketed parts of this address'
const ICON = {
  down: 'M6 9l6 6 6-6', x: 'M6 6l12 12M18 6L6 18', check: 'M5 12.5l4.5 4.5L19 7',
  cols: 'M4 5h16v14H4zM12 5v14',
  doc: 'M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5M9 13h6M9 17h4',
  file: 'M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5',
  filter: 'M4 5h16l-6 7v6l-4 2v-8z',
  back: 'M15 6l-6 6 6 6',
}
const ico = (n, c = 'ico') => `<svg class="${c}" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const $ = (s) => document.querySelector(s)
const fmt = (n) => Number(n || 0).toLocaleString('en-US')
const plural = (n, one, many = one + 's') => `${fmt(n)} ${n === 1 ? one : many}`

// ---------------------------------------------------------------- time: t is seconds since 1970, shown in UTC
const D8 = (t) => new Date(t * 1000)
const dayOf = (t) => D8(t).toISOString().slice(0, 10)
const dm = (t) => { const d = D8(t); return `${d.getUTCDate()} ${MONTH[d.getUTCMonth()]}` }
const hm = (t) => D8(t).toISOString().slice(11, 16)
const hms = (t) => D8(t).toISOString().slice(11, 19)
const wd = (t) => WEEKDAY[D8(t).getUTCDay()]
const parseT = (s) => { const v = Date.parse(s); return Number.isFinite(v) ? v / 1000 : null }
function dur(s) {
  s = Math.round(Math.abs(s))
  if (s < 60) return `${s} s`
  if (s < 3600) return `${Math.floor(s / 60)} min`
  if (s < 86400) return `${Math.floor(s / 3600)} h${s % 3600 >= 60 ? ' ' + Math.floor((s % 3600) / 60) + ' min' : ''}`
  return `${Math.floor(s / 86400)} d${s % 86400 >= 3600 ? ' ' + Math.floor((s % 86400) / 3600) + ' h' : ''}`
}
function span(a, b) {
  if (a == null || b == null) return ''
  if (dayOf(a) === dayOf(b)) return `${dm(a)} ${hms(a)}–${hms(b)}`
  return `${dm(a)} ${hm(a)} – ${dm(b)} ${hm(b)}`
}
function period(a, b) {
  if (dayOf(a) === dayOf(b)) return `${dm(a)} ${hm(a)}–${hm(b)}`
  return `${dm(a)} ${hm(a)} – ${dm(b)} ${hm(b)}`
}

// ---------------------------------------------------------------- state
let D = null // the lanes: {lanes, vals, kind}
let F = null // every filter value with its count
const S = {
  f: { mime: null, host: null, red: null, coll: null, cited: null, q: '', rx: false },
  secs: null, // the sections shown, a Set, null for all
  cols: [], // the logs: [{sec, a, b}], one or two
  sel: null, // the open capture or run: {c, i, row_idx, run_idx, n, rec, members}
  split: 0.65, // the share of the pane's height the lanes may take
  badQ: null,
}
const LOG = [] // per log: {rows, off, runs, captures, span, loading, err}

const isSet = (k) => Array.isArray(S.f[k])
function fq() {
  const out = {}
  for (const k of ['mime', 'host', 'red', 'coll']) if (isSet(k)) out[k] = S.f[k]
  if (S.f.cited != null) out.cited = S.f.cited
  if (S.f.q) { out.q = S.f.q; out.rx = S.f.rx }
  return out
}
const laneOf = (id) => (D ? D.lanes.find((l) => l.id === id) : null)
const siteName = (l) => (l ? `${l.name} – ${l.host}` : '')

// ---------------------------------------------------------------- Colour by
// one control in the control row: the view's fields and every label in one menu, each value a chip with its count
// (a click turns it off, which leaves its captures out), a bar along the left edge of each log row, the coloured
// scrollbar on each log
const byV = (r) => r.v
const colour = thimble.colourBy({
  mount: '#colour',
  fields: [
    { name: 'answer', title: 'Answer', values: ANSWERS, value: byV },
    { name: 'status', title: 'Status code', values: STATUSES, value: byV },
    { name: 'mime', title: 'Content type', value: byV },
    { name: 'host', title: 'Host', value: byV },
    { name: 'saved', title: 'Saved response', value: byV },
    { name: 'withheld', title: 'Address withheld', value: byV },
  ],
  chips: 'filter',
  onChange: () => soon(),
})
const vname = (i) => (i >= 0 && D && D.vals ? D.vals[i] : null)
function fill(name) { return (name != null && colour.colourOf(name)) || 'var(--label-none)' }
// the order a bar stacks its values from the bottom: the answers 2xx to 5xx, any other field's values as its chips
// go, no value on top
function stackOrder() {
  if (!D) return []
  const ids = D.vals.map((_, i) => i)
  if (D.kind === 'answer') ids.sort((a, b) => (D.vals[a] < D.vals[b] ? -1 : 1))
  else {
    const at = new Map(colour.values.map((v, i) => [v.value, i]))
    ids.sort((a, b) => (at.has(D.vals[a]) ? at.get(D.vals[a]) : 1e9) - (at.has(D.vals[b]) ? at.get(D.vals[b]) : 1e9) || a - b)
  }
  return [...ids, -1]
}
function chipCounts() {
  const out = {}
  for (const l of shownLanes()) for (const [v, n] of l.allc || []) { const k = vname(v) ?? ''; out[k] = (out[k] || 0) + n }
  colour.counts(out)
}

// ---------------------------------------------------------------- loading
let lanesSeq = 0
async function loadLanes() {
  const my = ++lanesSeq
  let res
  try {
    res = await thimble.fetch({ op: 'lanes', f: fq(), facets: !F, colour: colour.query() }, { key: 'lanes', onProgress: (p) => { const el = $('#wait'); if (my === lanesSeq && el) el.textContent = p.note ? p.note : p.seconds >= 1 ? 'Reading the files…' : '' } })
  } catch (e) {
    if (e && e.name === 'AbortError') return false
    const el = $('#wait'); if (el) el.textContent = ''
    $('#lanes').insertAdjacentHTML('beforeend', `<div class="note">${esc((e && e.message) || 'The captures could not be read')}</div>`)
    return false
  }
  if (my !== lanesSeq) return false
  const w = $('#wait'); if (w) w.textContent = ''
  if (res && res.bad_query) { S.badQ = res.error; renderCtl(); return false }
  S.badQ = null
  if (res.facets) F = res.facets
  D = res
  return true
}

const logSeq = []
async function loadLog(c, opts = {}) {
  const col = S.cols[c]
  if (!col) return
  // a fresh load keeps the capture a citation asked for, or the one open in this log, in view and open
  if (!opts.append && !opts.prepend && !opts.at) {
    if (col.at) opts = { ...opts, at: col.at.ref, atRow: col.at.row }
    else if (S.sel && S.sel.c === c && S.sel.rec) opts = { ...opts, at: S.sel.rec.ref, atRow: S.sel.row_idx }
  }
  const my = (logSeq[c] = (logSeq[c] || 0) + 1)
  const prev = LOG[c]
  const append = opts.append && prev && prev.rows
  const prepend = opts.prepend && prev && prev.rows
  if (!append && !prepend) LOG[c] = { rows: [], off: 0, runs: 0, captures: 0, loading: true }
  else prev.loading = true
  if (!append && !prepend) renderCol(c)
  const q = { op: 'log', sec: col.sec, f: fq(), colour: colour.query() }
  if (col.a != null) { q.a = col.a; q.b = col.b }
  if (append) q.off = prev.off + prev.rows.length
  else if (prepend) { q.off = Math.max(0, prev.off - PAGE); q.lim = prev.off - q.off }
  else if (opts.at) q.at = opts.at
  let res
  try {
    res = await thimble.fetch(q, { key: 'log' + c, onProgress: () => {} })
  } catch (e) {
    if (e && e.name === 'AbortError') return
    if (my !== logSeq[c]) return
    LOG[c] = { rows: [], off: 0, runs: 0, captures: 0, err: (e && e.message) || 'The log could not be read' }
    return renderCol(c)
  }
  if (my !== logSeq[c]) return
  if (res.bad_query) { LOG[c] = { rows: [], off: 0, runs: 0, captures: 0, err: null }; return renderCol(c) }
  if (append) { prev.rows.push(...res.rows); prev.runs = res.runs; prev.captures = res.captures; prev.loading = false; return renderCol(c, { keepScroll: true }) }
  if (prepend) {
    const el = colEl(c)
    const sc = el && el.querySelector('.rows')
    const h0 = sc ? sc.scrollHeight : 0
    prev.rows.unshift(...res.rows); prev.off = res.off; prev.loading = false
    renderCol(c, { keepScroll: true })
    if (sc) sc.scrollTop += sc.scrollHeight - h0
    return
  }
  LOG[c] = { rows: res.rows, off: res.off, runs: res.runs, captures: res.captures, span: res.span, loading: false }
  renderCol(c)
  if (opts.at) {
    const at = res.at_idx != null ? res.at_idx : LOG[c].rows.findIndex((r) => r.ref === opts.at)
    delete col.at
    if (at < 0 && S.sel && S.sel.c === c) closeDetail()
    if (at >= 0) {
      const el = colEl(c).querySelector(`.lr[data-i="${at}"]`)
      if (el) el.scrollIntoView({ block: 'center' })
      openRow(c, at, opts.atRow, true)
    }
  }
}
function loadLogs() { S.cols.forEach((_, c) => loadLog(c)) }
async function refresh() {
  if (!(await loadLanes())) return
  // a log whose section no capture passes the filters moves to the first section that has some
  const first = S.cols[0] && laneOf(S.cols[0].sec)
  if (first && !first.total) {
    const other = shownLanes().find((l) => l.total && !S.cols.some((c) => c.sec === l.id))
    if (other) { S.cols[0] = { sec: other.id, a: null, b: null }; if (S.sel && S.sel.c === 0) closeDetail() }
  }
  renderAll(); loadLogs()
}
// the control, the labels and their marks may each ask for the same refresh at once
let soonTimer = null, pending = false
function soon(ms = 30) { clearTimeout(soonTimer); soonTimer = setTimeout(() => { if (opened) refresh(); else pending = true }, ms) }

// ---------------------------------------------------------------- popovers: one at a time, closed by a click outside or Escape
let openPop = null
function close() { if (openPop) { if (openPop.anchor) openPop.anchor.setAttribute('aria-expanded', 'false'); openPop.remove(); openPop = null } }
function pop(anchor, html, align = 'left') {
  close()
  const p = document.createElement('div')
  p.className = 'pop'
  p.setAttribute('role', 'menu')
  p.innerHTML = html
  document.body.appendChild(p)
  const r = anchor.getBoundingClientRect(), w = p.offsetWidth
  p.style.top = Math.max(6, Math.min(r.bottom + 4, innerHeight - p.offsetHeight - 6)) + 'px'
  p.style.left = Math.max(6, Math.min(innerWidth - w - 6, align === 'right' ? r.right - w : r.left)) + 'px'
  p.anchor = anchor
  anchor.setAttribute('aria-expanded', 'true')
  openPop = p

}
document.addEventListener('mousedown', (e) => { if (openPop && !openPop.contains(e.target) && !(openPop.anchor && openPop.anchor.contains(e.target))) close() })
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { close(); hideTip(); return }
  // the arrow keys step through the log the open capture is in
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && S.sel && !e.target.closest('input,select,textarea') && !openPop) {
    const lg = LOG[S.sel.c]
    const i = S.sel.i + (e.key === 'ArrowDown' ? 1 : -1)
    if (!lg || i < 0 || i >= lg.rows.length) return
    e.preventDefault()
    const c = S.sel.c
    openRow(c, i)
    const el = colEl(c) && colEl(c).querySelector(`.lr[data-i="${i}"]`)
    if (el) el.scrollIntoView({ block: 'nearest' })
  }
})
const toggled = (anchor) => (openPop && openPop.anchor === anchor ? (close(), true) : false)

// ---------------------------------------------------------------- the control row
function renderCtl() {

  secs.classList.toggle('active', !!S.secs)
  const n = ['mime', 'host', 'red', 'coll'].filter(isSet).length + (S.f.cited != null ? 1 : 0)
  const more = $('#f-more')
  more.innerHTML = `${ico('filter')}Filters${n ? ` <span class="n">${n}</span>` : ''}${ico('down')}`
  more.classList.toggle('active', n > 0)
  const chips = []
  const name = (k, v) => { const row = F && F[k] && F[k].find((x) => x[0] === v); return row ? (row[1] || '(none)') : String(v) }
  const K = { mime: 'mime', host: 'host', red: 'source_url_redacted', coll: 'collection' }
  for (const k of ['mime', 'host', 'red', 'coll']) if (isSet(k)) {
    const vs = S.f[k]
    const v = vs.length === 1 ? name(k, vs[0]) : `${vs.length} values`
    chips.push(`<button class="chip chip-tone-neutral chip-act active" type="button" data-k="${k}" title="${esc(vs.map((x) => name(k, x)).join(', '))}" aria-label="Clear the filter ${K[k]} ${esc(v)}"><span class="chip-text">${K[k]} · ${esc(v)}</span>${ico('x')}</button>`)
  }
  if (S.f.cited != null) chips.push(`<button class="chip chip-tone-neutral chip-act active" type="button" data-k="cited" aria-label="Clear the filter response body ${S.f.cited ? 'saved' : 'none'}"><span class="chip-text">response body · ${S.f.cited ? 'saved' : 'none'}</span>${ico('x')}</button>`)

}
$('#chips').onclick = (ev) => {
  const b = ev.target.closest('button[data-k]')
  if (!b) return

  else S.f[b.dataset.k] = null

}
let typing = null
$('#q').addEventListener('input', (e) => {
  clearTimeout(typing)
  typing = setTimeout(() => { S.f.q = e.target.value; refresh() }, 260)
})
$('#rx').onclick = () => { S.f.rx = !S.f.rx; renderCtl(); if (S.f.q) refresh() }

function check(on) { return `<span class="box${on ? ' on' : ''}"></span>` }
function secsMenu() {
  const b = $('#f-secs')
  if (toggled(b) || !D) return
  const rows = D.lanes.map((l) => `<button class="item" data-s="${esc(l.id)}">${check(!S.secs || S.secs.has(l.id))}<span class="lab">${esc(l.name)} <span class="h">${esc(l.host)}</span></span><span class="n">${fmt(l.all)}</span></button>`).join('')
  const p = pop(b, `<button class="item" data-s="*">${check(!S.secs)}<span class="lab">All sites</span></button><div class="sep"></div>${rows}`)
  p.onclick = (ev) => {
    const it = ev.target.closest('[data-s]')
    if (!it) return
    const id = it.dataset.s
    if (id === '*') S.secs = null
    else if (ev.target.closest('.box') || ev.shiftKey || ev.metaKey) {
      const set = new Set(S.secs || D.lanes.map((l) => l.id))
      set.has(id) ? set.delete(id) : set.add(id)
      S.secs = set.size && set.size < D.lanes.length ? set : null
    } else S.secs = new Set([id])
    if (S.secs && S.secs.size === D.lanes.length) S.secs = null
    if (S.secs && !S.cols.some((c) => S.secs.has(c.sec))) {
      const first = D.lanes.find((l) => S.secs.has(l.id))
      if (first) { S.cols = [{ sec: first.id, a: null, b: null }]; S.sel = null; loadLogs() }
    }
    close(); renderAll()
  }
}
function moreMenu() {
  const b = $('#f-more')
  if (toggled(b) || !F) return
  const item = (k, v, name, n) => `<button class="item" data-k="${k}" data-v="${v}">${check(isSet(k) && S.f[k].includes(v))}<span class="lab" title="${esc(name)}">${esc(name)}</span><span class="n">${fmt(n)}</span></button>`
  const list = (k) => F[k].filter((x) => x[2] > 0).sort((p, q) => q[2] - p[2]).map(([v, name, n]) => item(k, v, name || '(none)', n)).join('')
  // every host, under the sections that ask for it
  const hostName = (v) => ((F.host.find((x) => x[0] === v) || [])[1]) || '(withheld)'
  const hosts = (D ? D.lanes : []).map((l) => `<div class="fsub">${esc(l.name)}</div>${((F.sec_hosts || {})[l.id] || []).map(([v, n]) => item('host', v, hostName(v), n)).join('')}`).join('')
  const cited = `<button class="item" data-cited="1">${check(S.f.cited === true)}<span class="lab">saved</span><span class="n">${fmt(F.cited)}</span></button><button class="item" data-cited="0">${check(S.f.cited === false)}<span class="lab">none</span><span class="n">${fmt(F.total - F.cited)}</span></button>`
  const html = `<div class="fgrid"><div class="fcol"><div class="head">mime</div>${list('mime')}</div><div class="fcol"><div class="head">host</div>${hosts}</div><div class="fcol"><div class="head">source_url_redacted</div>${list('red')}<div class="sep"></div><div class="head">collection</div>${list('coll')}<div class="sep"></div><div class="head">response body</div>${cited}</div></div>`
  const p = pop(b, html)
  p.classList.add('wide')
  const r = b.getBoundingClientRect()
  p.style.left = Math.max(6, Math.min(innerWidth - p.offsetWidth - 6, r.left)) + 'px'
  p.style.top = Math.max(6, Math.min(r.bottom + 4, innerHeight - p.offsetHeight - 6)) + 'px'
  p.onclick = (ev) => {
    const ci = ev.target.closest('[data-cited]')
    if (ci) {
      const v = ci.dataset.cited === '1'
      S.f.cited = S.f.cited === v ? null : v
      p.querySelectorAll('[data-cited]').forEach((x) => x.querySelector('.box').classList.toggle('on', S.f.cited === (x.dataset.cited === '1')))
      return refresh()
    }
    const it = ev.target.closest('[data-k]')
    if (!it) return
    const k = it.dataset.k, v = +it.dataset.v
    const set = new Set(isSet(k) ? S.f[k] : [])
    set.has(v) ? set.delete(v) : set.add(v)
    S.f[k] = set.size ? [...set] : null
    p.querySelectorAll(`[data-k="${k}"][data-v="${v}"] .box`).forEach((x) => x.classList.toggle('on', set.has(v)))
    refresh()
  }
}
$('#f-secs').onclick = () => secsMenu()
$('#f-more').onclick = () => moreMenu()

// ---------------------------------------------------------------- the lanes
// a text cut in the middle to fit px in the font, keeping more of its end (a host's domain)
const measure = (() => { const c = document.createElement('canvas').getContext('2d'); return (txt, font) => { c.font = font; return c.measureText(txt).width } })()
const FAMILY = () => getComputedStyle(document.body).fontFamily || 'sans-serif'
function fitText(txt, px, font) {
  if (!txt || measure(txt, font) <= px) return txt
  const cut = (k) => txt.slice(0, Math.ceil(k * 0.4)) + '…' + txt.slice(txt.length - Math.floor(k * 0.6))
  let lo = 2, hi = txt.length - 1
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (measure(cut(mid), font) <= px) lo = mid; else hi = mid - 1 }
  return cut(lo)
}
// Each lane's axis is its section's active periods side by side, each as wide as its share of the active time (at
// least SEG_MIN px), BREAK px between two. A bar gathers 1 minute, or more where minutes are narrower than 2 px, and
// stands as tall as its captures per minute on the lane's own scale; its parts are the values of the Colour by choice.
const shownLanes = () => (D ? D.lanes.filter((l) => !S.secs || S.secs.has(l.id)) : [])
function laneHeight(n) {
  const H = document.body.clientHeight || 676
  const ctl = $('#ctl').offsetHeight
  const room = Math.max(0, H * S.split - ctl - 6)
  return Math.max(28, Math.min(72, Math.floor(room / Math.max(1, n))))
}
// Each active period as wide as its share of the lane's active time, but at least as wide as the label of its start
// (all of them narrower together when the lane cannot hold them), BREAK px between two.
const startLabel = (t) => `${dm(t)} ${hm(t)}`
function layout(segs, W) {
  const du = segs.map(([a, b]) => Math.max(60, b - a))
  const room = W - BREAK * (segs.length - 1)
  let mins = segs.map(([a]) => Math.max(SEG_MIN, startLabel(a).length * LABEL_CW + 8))
  const need = mins.reduce((x, y) => x + y, 0)
  if (segs.length > 1 && need > room * 0.8) mins = mins.map((m) => (m * room * 0.8) / need)
  let widths = du.map(() => 0)
  const fixed = new Set()
  for (let pass = 0; pass <= segs.length; pass++) {
    const free = room - [...fixed].reduce((x, i) => x + mins[i], 0)
    const sum = du.reduce((x, d, i) => x + (fixed.has(i) ? 0 : d), 0)
    let again = false
    widths = du.map((d, i) => (fixed.has(i) ? mins[i] : (d / sum) * free))
    widths.forEach((w, i) => { if (!fixed.has(i) && w < mins[i]) { fixed.add(i); again = true } })
    if (!again) break
  }
  let x = 0
  return segs.map(([a, b], i) => { const o = { a, b, x0: x, x1: x + widths[i] }; x += widths[i] + BREAK; return o })
}
// A lane's active periods as the files have them, but a gap shorter than 6 h and than a twentieth of the lane's span is
// no break; the same at every width.
function joinSegs(segs) {
  const near = Math.min(6 * 3600, (segs[segs.length - 1][1] - segs[0][0]) / 20)
  const out = []
  for (const x of segs) {
    const last = out[out.length - 1]
    if (last && x[0] - last[1] < near) last[1] = x[1]
    else out.push([x[0], x[1]])
  }

}
function xOf(L, t) {
  for (const s of L) if (t <= s.b) return t < s.a ? s.x0 : s.x0 + ((t - s.a) / (s.b - s.a)) * (s.x1 - s.x0)
  const s = L[L.length - 1]
  return s.x1
}
function tOf(L, x) {
  for (let i = 0; i < L.length; i++) {
    const s = L[i]
    if (x <= s.x1 || i === L.length - 1) {
      if (x < s.x0) return s.a
      return Math.min(s.b, s.a + ((x - s.x0) / Math.max(1, s.x1 - s.x0)) * (s.b - s.a))
    }
    if (x < L[i + 1].x0) return x - s.x1 < L[i + 1].x0 - x ? s.b : L[i + 1].a
  }

}
const LANE = new Map() // lane id -> {L, bins, W, H, top}
function binsOf(lane, L) {
  // gather the lane's minutes into each period's bars, each bar's captures by value
  const t0 = lane.segs[0][0]
  const out = []
  let si = 0
  const per = L.map((s) => {
    const ppm = (s.x1 - s.x0) / Math.max(1, (s.b - s.a) / 60)
    const k = BINS.find((b) => b * ppm >= 2) || 1440
    return { k, ppm }
  })
  let cur = null
  for (let j = 0; j < lane.m.length; j++) {
    const t = t0 + lane.m[j] * 60
    while (si < L.length - 1 && t >= L[si].b) si++
    const s = L[si], { k, ppm } = per[si]
    const b = Math.floor((t - s.a) / 60 / k)
    if (!cur || cur.s !== si || cur.b !== b) {
      cur = { s: si, b, k, x: s.x0 + b * k * ppm, w: Math.max(1, Math.min(k * ppm, BAR_MAX, s.x1 - (s.x0 + b * k * ppm))), c: new Map(), t: s.a + b * k * 60, peak: 0 }
      out.push(cur)
    }
    const row = lane.c[j]
    let tot = 0
    for (let i = 0; i < row.length; i += 2) { cur.c.set(row[i], (cur.c.get(row[i]) || 0) + row[i + 1]); tot += row[i + 1] }
    cur.peak = Math.max(cur.peak, tot)
  }
  for (const b of out) { let n = 0; for (const v of b.c.values()) n += v; b.n = n; b.rate = n / b.k }

}
function ticks(L, W) {
  // labels under the bars: each period's start with its day, then round times that fit, a day where it changes
  const out = []
  let lastEnd = -Infinity, lastDay = null
  const cw = LABEL_CW
  for (const s of L) {
    const txt = startLabel(s.a)
    const w = txt.length * cw
    const x = Math.min(s.x0, W - w)
    if (x >= lastEnd + 4) { out.push({ x, txt, d: true }); lastEnd = x + w; lastDay = dayOf(s.a) }
    const pxMin = (s.x1 - s.x0) / Math.max(1, (s.b - s.a) / 60)
    const step = STEPS.find((m) => m * pxMin >= 70)
    if (!step) continue
    for (let t = Math.ceil((s.a + 60) / (step * 60)) * step * 60; t < s.b; t += step * 60) {
      const tx0 = s.x0 + ((t - s.a) / (s.b - s.a)) * (s.x1 - s.x0)
      const nd = dayOf(t) !== lastDay
      const tx = nd ? `${dm(t)} ${hm(t)}` : hm(t)
      const tw = tx.length * cw
      if (tx0 - tw / 2 < lastEnd + 8 || tx0 + tw / 2 > W) continue
      out.push({ x: tx0, txt: tx, mid: true, d: nd })
      lastEnd = tx0 + tw / 2
      if (nd) lastDay = dayOf(t)
    }
  }
  return out
}
function mixHtml(lane, order) {

  const tot = lane.total || 0
  if (!tot) return '<div class="mix"></div>'
  return `<div class="mix">${order.filter((v) => by.get(v)).map((v) => `<i style="width:${((100 * by.get(v)) / tot).toFixed(2)}%;background:${esc(fill(vname(v)))}" title="${esc(`${vname(v) ?? noValue()} · ${fmt(by.get(v))} · ${pct(by.get(v), tot)}%`)}"></i>`).join('')}</div>`
}
function renderLanes() {
  const box = $('#lanes')
  const lanes = shownLanes()
  if (!D) return

function narrow() { const w = document.body.clientWidth || 1000; document.body.classList.toggle('narrow', w < NARROW || (S.cols.length > 1 && w < 2 * NARROW)) }
// the logs' scroll while the capture covers them
let coveredScroll = null
function renderDetail() {
  const el = $('#detail')
  const sel = S.sel
  narrow()
  const covers = (on) => on && document.body.classList.contains('narrow')
  const was = covers(document.body.classList.contains('picked'))
  if (!was && covers(!!sel)) coveredScroll = [...document.querySelectorAll('#cols .rows')].map((x) => x.scrollTop)
  document.body.classList.toggle('picked', !!sel)
  if (was && !covers(!!sel) && coveredScroll) { const keep = coveredScroll; coveredScroll = null; document.querySelectorAll('#cols .rows').forEach((x, i) => { x.scrollTop = keep[i] || 0 }) }
  if (!sel) { el.hidden = true; el.innerHTML = ''; return }
  el.hidden = false
  const back = `<button class="btn btn-secondary btn-sm back" data-back type="button">${ico('back')}The log</button>`
  if (sel.err) { el.innerHTML = `${back}<div class="det"><div class="sub">${esc(sel.err)}</div></div>`; return }
  if (!sel.rec) { el.innerHTML = `${back}<div class="det"><div class="sub">Reading the capture…</div></div>`; return }
  const rec = sel.rec, row = sel.row
  const lane = laneOf(rec.section)
  const cols = Object.fromEntries(rec.columns || [])
  const t = parseT((cols.captured_at_utc || '').trim())
  const st = (cols.indexed_http_status || '').trim()
  const line = (rec.ref || '').split('#L')[1] || ''
  const path = (rec.ref || '').split('#')[0]
  const by = colour.by
  const onAnswer = !!(by && by.field === 'answer')
  const one = row && row.n === 1 && row.row_idx === rec.row_idx
  const urlSeg = one && row.segs ? row.segs.map(([x, k]) => segHtml(x, k)).join('') : esc(rec.decoded_url || cols.target_url || '')
  let h = `${back}<div class="det" data-anchor="${esc(rec.ref)}" data-anchor-text="${esc(cols.target_url || '')}">`
  h += `<div class="hd"><h3>${esc(lane ? lane.name : rec.section)} · ${t != null ? esc(`${dm(t)} ${hms(t)} UTC`) : ''}</h3><button class="btn btn-ghost btn-sm" data-back type="button" title="Close the capture" aria-label="Close the capture">${ico('x')}</button></div>`
  h += `<div class="sub">${row && row.n > 1 ? `${rec.row_idx === row.row_idx ? 'The first' : 'One'} of ${fmt(row.n)} captures in this row` : 'One capture'} · line ${esc(line)} of <span class="mono">${esc(path)}</span></div>`
  h += `<div class="ans"${onAnswer ? colour.attr(rec) : ''}><b>${esc(st || '–')}</b> · ${esc(CODE_WORD[+st] || CLS_WORD[clsOf(st)] || 'no status')}</div>`
  if (by && !onAnswer) h += `<div class="ans"${by.field ? colour.attr(rec) : ''}>${esc(by.title)}: <b>${esc(rec.v ?? noValue())}</b></div>`
  if (cols.reviewed_origin_status) h += `<div class="sub">Status when Transluce checked the site: <b class="mono">${esc(cols.reviewed_origin_status)}</b></div>`
  h += `<div class="url">${urlSeg}</div>`
  if (WITHHELD_RX.test(cols.target_url || '')) h += `<div class="sub">${WITHHELD_NOTE}</div>`
  if (rec.decoded_url && rec.decoded_url !== cols.target_url) h += `<div class="sub">As written: <span class="mono">${esc(cols.target_url)}</span></div>`
  h += `<div class="acts"><button class="btn btn-secondary btn-sm" data-file="${esc(rec.ref)}" type="button">${ico('file')}Open line ${esc(line)} in the file</button></div>`
  if (sel.members && sel.members.rows && sel.members.rows.length) {
    const m = sel.members
    h += `<div class="sec">The ${fmt(m.n)} captures in this row</div><div class="mems">`
    for (const x of m.rows) h += `<div class="mem${x.row_idx === rec.row_idx ? ' on' : ''}" data-row="${x.row_idx}" data-anchor="${esc(x.ref)}" data-anchor-text="${esc(x.url)}" title="${esc(x.url)}"${colour.attr(x)}><span class="t">${hms(parseT(x.time))}</span><span>${esc(x.status)}</span><span>${esc(pathOf(x.url))}</span></div>`
    if (m.n > m.rows.length) h += `<div class="lmore"><button class="btn btn-ghost btn-sm" data-members type="button">Show ${fmt(Math.min(200, m.n - m.rows.length))} more of ${fmt(m.n - m.rows.length)}</button></div>`
    h += '</div>'
  }
  if (rec.response) {
    const rsp = rec.response
    h += `<div class="sec">Saved response body${rsp.http_status ? ` · status ${esc(rsp.http_status)}` : ''}</div><div class="sub mono">${esc(rsp.file)}</div>`
    h += rsp.text != null ? `<pre class="body">${esc(rsp.text.slice(0, 6000))}</pre>` : '<div class="sub">The file could not be read</div>'
  }
  h += `<div class="sec">The row in the file</div><dl class="kv">${(rec.columns || []).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v ? esc(v) : '<span class="none">empty</span>'}</dd>`).join('')}</dl></div>`
  el.innerHTML = h
}
$('#detail').addEventListener('click', async (ev) => {
  const t = ev.target
  if (t.closest('[data-back]')) return closeDetail()
  const f = t.closest('[data-file]')
  if (f) return thimble.navigate(f.dataset.file, { browser: true })
  if (t.closest('[data-members]') && S.sel && S.sel.members) {
    const sel = S.sel, col = S.cols[sel.c]
    try {
      const more = await thimble.fetch({ op: 'run', sec: col.sec, a: col.a, b: col.b, f: fq(), run_idx: sel.run_idx, off: sel.members.rows.length, colour: colour.query() }, { key: 'run', onProgress: () => {} })
      if (S.sel !== sel) return
      const box = $('#detail .mems'), top = box ? box.scrollTop : 0
      sel.members.rows.push(...more.rows)
      renderDetail()
      const box2 = $('#detail .mems')
      if (box2) box2.scrollTop = top
    } catch (e) { /* a newer pick took over */ }
    return
  }
  const m = t.closest('.mem[data-row]')
  if (m && S.sel && !ev.metaKey && !ev.ctrlKey) {
    S.sel.row_idx = +m.dataset.row
    const my = ++detailSeq
    try {
      const rec = await thimble.fetch({ op: 'record', row_idx: S.sel.row_idx, colour: colour.query() }, { key: 'record', onProgress: () => {} })
      if (my !== detailSeq || !S.sel) return
      S.sel.rec = rec
      const box = $('#detail .mems'), top = box ? box.scrollTop : 0
      renderDetail()
      const box2 = $('#detail .mems')
      if (box2) box2.scrollTop = top
    } catch (e) { /* a newer pick took over */ }
  }
})

// ---------------------------------------------------------------- render and places
function renderAll() { narrow(); renderCtl(); chipCounts(); renderLanes(); renderCols(); renderDetail(); if (S.sel) refreshDetail() }
let lanesW = 0
new ResizeObserver(() => { const w = $('#lanes').clientWidth; if (D && w !== lanesW) { lanesW = w; requestAnimationFrame(renderLanes) } }).observe($('#lanes'))
let resizeTimer = null
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (!D) return; narrow(); renderLanes(); S.cols.forEach((_, c) => renderCol(c, { keepScroll: true })) }, 120) })

function defaultCols() {
  const lanes = shownLanes()
  if (!S.cols.length || !S.cols.every((c) => laneOf(c.sec))) S.cols = lanes.length ? [{ sec: lanes[0].id, a: null, b: null }] : []
}
async function openPlace(t) {
  t = t || {}
  if (t.sec && laneOf(t.sec)) {
    if (S.secs && !S.secs.has(t.sec)) S.secs.add(t.sec)
    const a = t.a != null ? t.a : null, b = t.b != null ? t.b : null
    S.cols = [{ sec: t.sec, a, b }]
    LOG.length = 0
    S.sel = null
    renderAll()
    if (t.row_idx != null) S.cols[0].at = { ref: t.ref, row: t.row_idx }
    return loadLog(0)
  }
  defaultCols()
  renderAll()
  loadLogs()
}
// the page loads the lanes at once and opens the place thimble hands it, or the first section's log
let pendingPlace = null, opened = false
async function start() {
  if (!(await loadLanes())) return
  // a label turned on while the first lanes were read takes the colour: read them again by it
  while (pending) { pending = false; if (!(await loadLanes())) return }
  opened = true
  openPlace(pendingPlace)
}
thimble.onOpen((place) => {
  const t = (place && place.target) || null
  if (!opened) { pendingPlace = t; return }
  openPlace(t)
})
// the label filter keeps fewer captures; a label's values arrive while it runs, which the lanes follow while a label is
// the colour
let labelKey = null
thimble.onLabels((state) => {
  const key = JSON.stringify([(state.labels || []).map((l) => [l.id, l.values]), state.filter || null])
  if (labelKey !== null && key !== labelKey) soon()
  labelKey = key
})
thimble.onMarks(() => { if (colour.label) soon(300) })
start()
</script>
