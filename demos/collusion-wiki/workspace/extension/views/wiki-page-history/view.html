<!doctype html>
<html>
<head>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-card); overflow: hidden; }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }
  #view { height: 100%; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 12px 16px 10px; border-bottom: 1px solid var(--border-subtle); }
  #search { flex: 0 1 220px; min-width: 180px; }
  #filter { flex: 0 1 300px; min-width: 200px; }
  #color { flex: 1 1 340px; min-width: min(340px, 100%); max-width: 100%; }
  /* the overview: every record over time, under the time range's viewfinder */
  #overview { flex: none; padding: 8px 16px 6px; }
  #read { flex-direction: row; gap: 10px; margin-bottom: 4px; }
  /* the pages in the range, with the page opened in the side panel */
  #body { flex: 1; min-height: 0; border-top: 1px solid var(--border-hairline); }
  .listbox { display: flex; flex-direction: column; min-height: 0; height: 100%; }
  .lhead { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; padding: 8px 16px 4px; font: 400 var(--text-sm) / 1.4 var(--font-body); }
  .lhead b { font-weight: 500; }
  .lhead .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); font-variant-numeric: tabular-nums; }
  .lhead .btn { margin-left: auto; }
  #list { flex: 1; min-height: 0; }
  .neg { color: var(--status-negative); }
  .pos { color: var(--status-positive); }
  /* a page's history in the side panel: its facts, who wrote when, then each record in time order */
  .facts { margin: 0 0 8px; color: var(--text-secondary); font: 400 var(--text-xs) / 1.6 var(--font-body); }
  .lanes { max-height: 190px; overflow: hidden auto; margin: 0 0 10px; }
  .rev, .del { padding: 8px 0 10px 10px; border-top: 1px solid var(--border-hairline); }
  .rh, .del { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font: 400 var(--text-xs) / 1.6 var(--font-body); }
  .rh { margin-bottom: 6px; }
  .user { padding: 0; border: 0; background: none; cursor: pointer; font-weight: 600; color: var(--text-primary); }
  .user:hover { text-decoration: underline; }
  .user.none { font-weight: 400; color: var(--text-tertiary); }
  .ip, time, .seq, .pm { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.6 var(--font-mono); font-variant-numeric: tabular-nums; }
  .sum { color: var(--text-secondary); }
  .pm { margin-left: auto; }
  .dw { font-weight: 600; }
  .hist .edge { height: 1px; }
</style>
</head>
<body>
<div id="view">
  <div class="top">
    <span id="search"></span>
    <span id="filter"></span>
    <span id="color"></span>
  </div>
  <div id="overview">
    <div id="read"></div>
    <div id="range"></div>
    <div id="axis"></div>
  </div>
  <div id="body">
    <div class="listbox">
      <div class="lhead" id="lhead" data-thimble-chrome></div>
      <div id="list"></div>
    </div>
  </div>
</div>
<script>
const SLUG = 'wiki-page-history'
const CHUNK = 6 // records a page's history draws at a time, as it scrolls
const AHEAD = 24 // records whose texts one fetch gets, ahead of the drawing
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const $ = (id) => document.getElementById(id)
const unit = (key) => `view:${SLUG}/${key}`
const plural = (n, one, many = one + 's') => `${n.toLocaleString('en')} ${n === 1 ? one : many}`
const stamp = (t) => new Date(t * 1000).toISOString().slice(0, 19).replace('T', ' ')
const day = (t) => new Date(t * 1000).toISOString().slice(0, 10)
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const md = (t) => { const d = new Date(t * 1000); return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}` }
const span = (a, b) => (md(a) === md(b) ? md(a) : `${md(a)} – ${md(b)}`)
const ipOf = (ip) => (ip ? `${ip}.*` : '')

const FIELDS = [
  {
    name: 'kind', title: 'Kind', description: 'A revision saved, or a delete the administrator logged in events.jsonl',
    values: [{ name: 'save', color: 1, meaning: 'A revision saved, a line of revisions.jsonl' }, { name: 'delete', color: 13, meaning: 'The administrator deleted the page' }],
  },
  { name: 'wiki', title: 'Wiki', description: 'The wiki the page is on' },
  { name: 'user', title: 'Username', description: 'The username the editor gave when saving, or the administrator who deleted' },
  {
    name: 'after', title: 'After a delete', description: 'The first save after a delete: restored when its text is the one the page had before the delete, else re-created',
    values: [{ name: 'restored', meaning: 'Saved after a delete with the text the page had before it' }, { name: 're-created', meaning: 'Saved after a delete with another text' }],
  },
]

let O = null // the overview: pages, users, values and the records as columns (reader.py _overview)
let vals = [] // each record's Color by value
let pageUsers = new Map() // page -> Set of the usernames of its records
let shown = [] // the table's rows
let who = null, whoInfo = null // a username whose pages the list keeps
let openKey = null, P = null, pendingWant = null
let markLoaded
const loaded = new Promise((ok) => (markLoaded = ok))

const search = thimble.search({ mount: '#search', in: '#body', placeholder: 'Search pages and usernames', onChange: () => drawList() })
const filter = thimble.filterBy({ mount: '#filter', fields: FIELDS, initial: 'wiki', onChange: load })
const color = thimble.colorBy({ mount: '#color', fields: FIELDS, initial: 'kind', onChange: load })
const range = thimble.timeRange({ mount: '#range', readout: '#read', height: 40, onChange: () => drawList() })
const side = thimble.side({ mount: '#body', width: 0.6, min: 420, onClose: () => { openKey = null; P = null } })
const table = thimble.table({
  mount: '#list', side, search, color: false, key: 'pages',
  sort: { by: 'revs', desc: true },
  columns: [
    { name: 'name', title: 'Page', sub: (r) => `${r.wiki} · ${span(r.first, r.last)}` },
    { name: 'mix', title: 'Mix', width: 56, sort: false, drop: 3, value: () => '', html: (r) => thimble.mix(r.mix) },
    { name: 'revs', title: 'Revisions', type: 'number', drop: false },
    { name: 'editors', title: 'Usernames', type: 'number', drop: 2 },
    { name: 'dels', title: 'Deletes', type: 'number', html: (r) => (r.dels ? `<span class="neg" title="deleted">✕</span> ${r.dels}` : '') },
    { name: 'last', title: 'Last', type: 'time', drop: 1 },
  ],
  details: (r) => {
    const w = pendingWant
    pendingWant = null
    openKey = r.key
    return { title: r.name, sub: r.wiki, render: (body) => fillPage(body, r.key, w) }
  },
})
const reset = thimble.onReset({ changed: () => who != null, reset: () => { who = null; whoInfo = null; drawList() } })

async function load() {
  let o
  try {
    o = await thimble.fetch({ op: 'overview', color: color.query(), filter: filter.query() }, { key: 'overview' })
  } catch (e) {
    if (e.name === 'AbortError') return
    throw e
  }
  O = o
  vals = o.ev.v.map((i) => (i < 0 ? null : o.values[i]))
  pageUsers = new Map()
  for (let i = 0; i < o.ev.p.length; i++) {
    let s = pageUsers.get(o.ev.p[i])
    if (!s) pageUsers.set(o.ev.p[i], (s = new Set()))
    s.add(o.ev.u[i])
  }
  color.counts(o.counts)
  filter.counts(o.fcounts)
  const pad = Math.max(3600, (o.span[1] - o.span[0]) * 0.005)
  range.data({ times: o.ev.t, values: vals, span: [o.span[0] - pad, o.span[1] + pad] })
  markLoaded()
  drawList()
  if (openKey && side.isOpen) fillPage(side.body, openKey, firstInView())
}

// the pages with a record in the range, their counts there, kept by the search (a page's name or a username on it)
// and by the username chosen
function drawList() {
  if (!O) return
  thimble.timeAxis('#axis', range.scale($('axis').clientWidth))
  const ev = O.ev, st = new Map()
  for (let i = 0; i < ev.t.length; i++) {
    const t = ev.t[i]
    if (!range.has(t)) continue
    let s = st.get(ev.p[i])
    if (!s) st.set(ev.p[i], (s = { revs: 0, dels: 0, users: new Set(), first: t, last: t, mix: {} }))
    if (ev.k[i]) s.dels++
    else { s.revs++; s.users.add(ev.u[i]) }
    if (t < s.first) s.first = t
    if (t > s.last) s.last = t
    const v = vals[i] ?? ''
    s.mix[v] = (s.mix[v] || 0) + 1
  }
  const q = search.text.trim()
  const hits = q ? new Set(O.users.map((u, i) => (u && search.has(u) ? i : -1)).filter((i) => i >= 0)) : null
  const whoIdx = who == null ? -1 : O.users.indexOf(who)
  shown = []
  for (const pg of O.pages) {
    const s = st.get(pg.p)
    if (!s) continue
    const us = pageUsers.get(pg.p) || new Set()
    if (who != null && !us.has(whoIdx)) continue
    if (hits && !search.has(pg.name) && ![...us].some((u) => hits.has(u))) continue
    shown.push({ ref: unit(pg.key), key: pg.key, p: pg.p, wiki: pg.wiki, name: pg.name, revs: s.revs, dels: s.dels, editors: s.users.size, first: s.first, last: s.last, mix: s.mix })
  }
  table.draw(shown)
  search.kept(q ? shown.map((r) => r.ref) : null)
  head()
  reset.check()
}

function head() {
  const n = `<span class="n">${plural(shown.length, 'page')}</span>`
  if (who == null) { $('lhead').innerHTML = `<b>Pages</b>${n}`; return }
  const role = whoInfo && whoInfo.name === who && whoInfo.role ? `<span class="n">${esc(whoInfo.role)}</span>` : ''
  const anchor = whoInfo && whoInfo.name === who && whoInfo.ref ? ` data-anchor="${esc(whoInfo.ref)}"` : ''
  $('lhead').innerHTML = `<span>Pages with records by</span><span class="chip chip-sans chip-tone-neutral"${anchor}><span class="chip-text">${esc(who)}</span></span>${role}${n}` +
    '<button class="btn btn-ghost btn-sm" type="button" data-all>Every username</button>'
}

async function setWho(name) {
  who = name
  whoInfo = null
  drawList()
  try {
    whoInfo = await thimble.fetch({ op: 'user', name }, { key: 'user' })
  } catch (e) {
    if (e.name === 'AbortError') return
    throw e
  }
  if (who === name) head()
}

// ------------------------------------------------------------------------------------------------ one page's history

const userBtn = (u) => (u ? `<button class="user" type="button" data-user="${esc(u)}">${esc(u)}</button>` : '<span class="user none">no username</span>')
const afterChip = (it) => (it.after ? `<span class="chip chip-sans chip-tone-neutral"><span class="chip-text">${esc(it.after)}</span></span>` : '')

function block(it, k) {
  if (it.kind === 'delete') {
    return `<div class="del" data-anchor="${esc(it.ref)}" data-t="${it.t}" data-k="${k}"${color.attr(it)}><span class="neg" aria-hidden="true">✕</span><span class="dw">deleted</span>${userBtn(it.user)}<span class="ip" title="IP prefix">${esc(ipOf(it.ip))}</span><time>${stamp(it.t)}</time>${it.summary ? `<span class="sum">${esc(it.summary)}</span>` : ''}</div>`
  }
  return `<div class="rev" data-anchor="${esc(it.ref)}" data-t="${it.t}" data-k="${k}"${color.attr(it)}><div class="rh">${userBtn(it.user)}<span class="ip" title="IP prefix">${esc(ipOf(it.ip))}</span><time>${stamp(it.t)}</time><span class="seq">rev ${it.seq}</span>${it.summary ? `<span class="sum">${esc(it.summary)}</span>` : ''}${afterChip(it)}<span class="pm"></span></div><div class="dm"></div></div>`
}

async function fillPage(body, key, want) {
  body.innerHTML = '<div class="facts"></div><div class="lanes"></div><div class="hist"><div class="edge" data-edge="top"></div><div class="recs"></div><div class="edge" data-edge="end"></div></div>'
  let d
  try {
    d = await thimble.fetch({ op: 'page', key, color: color.query(), filter: filter.query() }, { key: 'page' })
  } catch (e) {
    if (e.name === 'AbortError') return
    throw e
  }
  if (!d || openKey !== key || !body.isConnected) return
  P = { ...d, body, lo: 0, hi: 0, texts: new Map(), busy: false }
  const saves = d.items.filter((it) => it.kind === 'save'), dels = d.items.length - saves.length
  const users = new Set(saves.map((it) => it.user))
  const facts = body.querySelector('.facts')
  if (d.ref) facts.setAttribute('data-anchor', d.ref)
  facts.textContent = [plural(saves.length, 'revision'), plural(users.size, 'username'), dels ? plural(dels, 'delete') : '',
    d.items.length ? `${stamp(d.items[0].t).slice(0, 16)} – ${stamp(d.items[d.items.length - 1].t).slice(0, 16)}` : '',
    d.before ? `${plural(d.before, 'earlier revision')} not stored` : ''].filter(Boolean).join(' · ')
  // who wrote on the page and when: a lane per username, a delete a ✕ in the problem red
  const lanes = thimble.timeline({
    mount: body.querySelector('.lanes'), rows: 'user', names: 150,
    problem: (it) => it.kind === 'delete', words: { problem: 'deleted' },
    tip: (it) => `${it.kind === 'delete' ? 'deleted' : 'rev ' + it.seq} · ${it.user || 'no username'}${it.summary ? ' · ' + it.summary : ''}`,
    onMark: (it) => goTo(P.items.indexOf(it)),
  })
  lanes.draw(d.items)
  if (!d.items.length) return
  const at = want ? d.items.findIndex((it) => it.ref === want) : -1
  await windowAt(at >= 0 ? at : 0)
  if (at >= 0) reveal(at)
}

// the history drawn afresh from record k on
async function windowAt(k) {
  const lo = Math.max(0, k - 2)
  P.lo = P.hi = lo
  P.body.querySelector('.recs').innerHTML = ''
  await extend(1)
  P.body.scrollTop = 0
  pump()
}

// the texts of records [a, b) of the history, fetched once
async function texts(a, b) {
  const need = P.items.slice(a, b).filter((it) => it.kind === 'save' && !P.texts.has(it.pos)).map((it) => it.pos)
  if (!need.length) return true
  const key = P.key
  let got
  try {
    got = await thimble.fetch({ op: 'bodies', key, at: need }, { key: 'bodies' })
  } catch (e) {
    if (e.name === 'AbortError') return false
    throw e
  }
  if (!P || P.key !== key || !got) return false
  for (const [pos, t] of Object.entries(got.bodies)) P.texts.set(+pos, t)
  return true
}

// CHUNK more records drawn after the last (dir 1) or before the first (dir -1)
async function extend(dir) {
  if (!P || P.busy) return
  const a = dir > 0 ? P.hi : Math.max(0, P.lo - CHUNK), b = dir > 0 ? Math.min(P.items.length, P.hi + CHUNK) : P.lo
  if (a >= b) return
  P.busy = true
  const mine = P
  try {
    const fa = dir > 0 ? a : Math.max(0, a - AHEAD + CHUNK), fb = dir > 0 ? Math.min(P.items.length, a + AHEAD) : b
    if (!(await texts(fa, fb)) || P !== mine) return
    const recs = P.body.querySelector('.recs')
    const box = document.createElement('div')
    box.innerHTML = P.items.slice(a, b).map((it, j) => block(it, a + j)).join('')
    for (const el of box.querySelectorAll('.rev')) {
      const it = P.items[+el.dataset.k], t = P.texts.get(it.pos) || { body: '', before: '' }
      const pm = el.querySelector('.pm')
      if (t.body === t.before) { pm.textContent = '±0'; el.querySelector('.dm').remove(); continue }
      const d = thimble.diff({ mount: el.querySelector('.dm'), before: t.before, after: t.body, context: 2 })
      pm.innerHTML = [d.added ? `<span class="pos">+${d.added}</span>` : '', d.removed ? `<span class="neg">−${d.removed}</span>` : ''].filter(Boolean).join(' ')
    }
    const scroller = P.body, h0 = scroller.scrollHeight
    if (dir > 0) { recs.append(...box.children); P.hi = b } else { recs.prepend(...box.children); P.lo = a; scroller.scrollTop += scroller.scrollHeight - h0 }
  } finally {
    mine.busy = false
  }
}

// more of the history while an end of it is near the view
async function pump() {
  for (let n = 0; n < 40 && P && !P.busy; n++) {
    const box = P.body.getBoundingClientRect()
    const top = P.body.querySelector('[data-edge="top"]'), end = P.body.querySelector('[data-edge="end"]')
    if (!top || !end) return
    if (P.hi < P.items.length && end.getBoundingClientRect().top < box.bottom + 600) await extend(1)
    else if (P.lo > 0 && top.getBoundingClientRect().bottom > box.top - 300) await extend(-1)
    else return
    // a frame between draws, so the panel paints and scrolls while more comes in
    await new Promise((ok) => requestAnimationFrame(ok))
  }
}

// record k in view, drawn first when it is not
async function goTo(k) {
  if (!P || k < 0) return
  if (k < P.lo || k >= P.hi) await windowAt(k)
  reveal(k)
}
function reveal(k) {
  const el = P && P.body.querySelector(`[data-k="${k}"]`)
  if (!el) return
  el.scrollIntoView({ block: 'start' })
  el.removeAttribute('data-thimble-snap')
  void el.offsetWidth
  el.setAttribute('data-thimble-snap', '')
  setTimeout(() => el.removeAttribute('data-thimble-snap'), 1600)
  pump()
}
function firstInView() {
  if (!P || !P.body.isConnected) return null
  const top = P.body.getBoundingClientRect().top
  const el = [...P.body.querySelectorAll('[data-k]')].find((e) => e.getBoundingClientRect().bottom > top)
  return el ? P.items[+el.dataset.k].ref : null
}

let pumping = 0
side.body.addEventListener('scroll', () => { if (!pumping) pumping = requestAnimationFrame(() => { pumping = 0; pump() }) })

// a page opened from a citation or a link: its row when the list shows it, else the page alone
async function openPage(key, ref) {
  await loaded
  if (openKey === key && P && P.key === key && side.isOpen) { if (ref) goTo(P.items.findIndex((it) => it.ref === ref)); return }
  pendingWant = ref || null
  const row = shown.find((r) => r.key === key)
  if (row && table.open(row.ref) !== false && openKey === key) return
  const pg = O.pages.find((x) => x.key === key)
  const w = pendingWant
  pendingWant = null
  openKey = key
  side.open({ title: pg ? pg.name : key.split('~').slice(1).join('~'), sub: pg ? pg.wiki : key.split('~')[0], ref: unit(key), render: (body) => fillPage(body, key, w) })
}

$('body').addEventListener('click', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const u = e.target.closest('[data-user]')
  if (u) return setWho(u.dataset.user)
  if (e.target.closest('[data-all]')) { who = null; whoInfo = null; drawList() }
})
addEventListener('resize', () => drawList())
let labelFilter = null
thimble.onLabels((s) => { const f = JSON.stringify(s.filter || null); if (f !== labelFilter) { labelFilter = f; load() } })
thimble.onOpen(async (place) => {
  const t = (place && place.target) || {}
  await loaded
  if (t.page) return openPage(t.page, t.ref)
  if (t.user) return setWho(t.user)
  if (t.request) { openKey = null; P = null; side.open({ title: 'Request', sub: t.request.time || '', ref: t.ref, render: (body) => thimble.record({ mount: body, value: t.request, ref: t.ref }) }) }
})
load()
</script>
</body>
</html>
