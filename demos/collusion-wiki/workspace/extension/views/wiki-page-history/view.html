<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .chip, .btn, .seg, .list-row), its Color by control, its time range selector and the
     theme's tokens come with the frame; this page lays out the control row, the range and its chart, the list of pages
     and the open page's history */
  :root { --add-bg: color-mix(in oklab, var(--status-positive) 13%, transparent); --rem-bg: color-mix(in oklab, var(--status-negative) 12%, transparent); }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--surface-card); color: var(--text-primary); font: 400 var(--text-ui-sm) / 1.4 var(--font-body); }
  button { font: inherit; }
  .ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); font-variant-numeric: tabular-nums; }

  /* the control row */
  #ctl { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; padding: 9px 14px 8px; }
  .search { position: relative; flex: 0 1 170px; min-width: 120px; }
  .search .field { width: 100%; padding-left: 27px; }
  .search .ico { position: absolute; left: 8px; top: 50%; margin-top: -7px; color: var(--text-tertiary); pointer-events: none; }
  .fbtn { flex: none; padding: 0 7px 0 9px; }
  .fbtn .ico { width: 12px; height: 12px; color: var(--text-tertiary); }
  .fbtn .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .fbtn .v { max-width: 140px; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .fbtn .clr { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-right: -3px; border-radius: 4px; color: var(--text-tertiary); }
  .fbtn .clr:hover { background: var(--track-bg); color: var(--text-primary); }
  .chip > .ico { width: 10px; height: 10px; }
  #colour { flex: 1 1 360px; min-width: 300px; }
  .sw { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
  .sw.none { background: none; }

  /* the range: the time range selector, its readout in the gutter and its overview over the chart; the chart of the
     range below it, its key in the gutter, and the chart's one axis */
  #hist { position: relative; flex: none; padding: 8px 0 2px; border-bottom: 1px solid var(--border-hairline); }
  #range { padding: 0 16px 6px 14px; }
  #range .thimble-range-read { width: 188px; min-width: 188px; }
  #chart { position: relative; height: 62px; }
  #gut { position: absolute; left: 14px; top: 6px; display: flex; flex-direction: column; gap: 3px; width: 190px; font: 400 var(--text-xs) / 1.25 var(--font-body); color: var(--text-secondary); }
  #gut .k { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #gut b { font: 500 var(--text-mono-sm) / 1.25 var(--font-mono); color: var(--text-primary); font-variant-numeric: tabular-nums; }
  /* the revisions' mark in the key: the colours they are drawn in, side by side */
  .msw { display: inline-flex; flex: none; width: 10px; height: 10px; overflow: hidden; border-radius: 2px; }
  .msw i { flex: 1 1 0; background: var(--c); }
  #hs { position: absolute; left: 0; top: 0; display: block; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  #ax { margin: 0 16px 0 214px; }
  svg text { font: 400 10.5px var(--font-mono); fill: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  svg .rule { stroke: rgba(var(--ink-rgb), 0.18); }
  svg .grid { stroke: var(--border-hairline); }

  /* the two panes */
  #main { flex: 1; min-height: 0; display: flex; }
  #left { flex: 0 0 clamp(290px, 36%, 440px); min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border-hairline); }
  #lh { flex: none; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--border-hairline); }
  #count { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); font-size: var(--text-xs); }
  #count b { color: var(--text-primary); font: 500 var(--text-mono-sm) / 1 var(--font-mono); }
  #sort { flex: none; width: 168px; }
  #list { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; outline: none; }
  #vl { position: relative; }
  .row { position: absolute; left: 0; right: 0; box-sizing: border-box; height: 50px; padding: 7px 12px 6px 14px; border-bottom: 1px solid var(--border-hairline); cursor: pointer; }
  .row:hover { background: rgba(var(--ink-rgb), 0.035); }
  .row.sel { background: var(--surface-selected); }
  .row .r1, .row .r2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .row .r2 { margin-top: 4px; }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 var(--text-ui-sm) / 1.3 var(--font-body); }
  .row .nm b { font-weight: 500; background: var(--track-bg); border-radius: 2px; }
  .row .nr { flex: none; display: inline-flex; align-items: center; gap: 2px; font: 400 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .row .nr .ico { width: 11px; height: 11px; color: var(--text-tertiary); }
  .row .dl { flex: none; display: inline-flex; align-items: center; gap: 2px; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .row .dl .ico { width: 11px; height: 11px; }
  .row .meta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-tertiary); font-size: var(--text-xs); line-height: 1.2; }
  .row svg { flex: none; display: block; }
  .row .nu { flex: none; display: inline-flex; align-items: center; gap: 2px; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .row .nu .ico { width: 11px; height: 11px; }
  .empty { padding: 28px 14px; color: var(--text-tertiary); font-size: var(--text-xs); }

  #right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #ph { flex: none; padding: 10px 16px 4px; }
  #ph .h1 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; padding: 2px 0 2px 2px; }
  #ph h2 { flex: 0 1 auto; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 15px / 1.3 var(--font-body); }
  #ph .h1 > .chip, #ph .h1 > .btn { flex: none; }
  #ph .sp { flex: 1; }
  #ph .h2 { margin: 2px 0 0 2px; color: var(--text-secondary); font-size: var(--text-xs); }
  #ph .h2 b { font: 500 var(--text-mono-sm) / 1 var(--font-mono); color: var(--text-primary); }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 3px 18px; margin: 8px 0 4px 2px; }
  .fact.wide { grid-column: span 2; }
  .fact { display: flex; align-items: baseline; gap: 8px; min-width: 0; margin: 0; }
  .fact dt { flex: none; width: 92px; color: var(--text-tertiary); font-size: var(--text-xs); }
  .fact dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); }
  .unames { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 4px 0 8px 2px; }
  .unames.all { max-height: 168px; overflow-y: auto; padding: 6px; border-radius: var(--radius-ui); box-shadow: inset 0 0 0 1px var(--border-hairline); }
  #pst { position: relative; flex: none; padding: 4px 16px 8px; border-bottom: 1px solid var(--border-hairline); }
  #ps { display: block; cursor: pointer; }
  #blocks { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }

  /* a page's history: revisions, deletes and requests */
  .day { position: sticky; top: 0; z-index: 2; padding: 6px 16px 5px; background: var(--surface-card); border-bottom: 1px solid var(--border-hairline); color: var(--text-secondary); font: 500 var(--text-xs) / 1.2 var(--font-body); }
  .blk { position: relative; border-bottom: 1px solid var(--border-hairline); scroll-margin-top: 30px; }
  .blk.flash { background: var(--surface-selected); }
  .bh { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; min-width: 0; padding: 8px 16px 6px; }
  .bh .seq { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .bh .tm { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .who { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0; border: 0; background: none; color: var(--text-primary); font: 500 var(--text-ui-sm) / 1.4 var(--font-body); cursor: pointer; }
  .who:hover { text-decoration: underline; text-underline-offset: 2px; }
  .who.anon { color: var(--text-secondary); font-style: italic; font-weight: 400; }
  .bh .ip { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .ip .k { margin-right: 3px; color: var(--text-tertiary); font: 500 9.5px / 1 var(--font-body); letter-spacing: 0.06em; }
  .bh .cs { min-width: 0; overflow-wrap: anywhere; color: var(--text-primary); font-size: var(--text-ui-sm); }
  .bh .cs::before { content: '“'; color: var(--text-tertiary); }
  .bh .cs::after { content: '”'; color: var(--text-tertiary); }
  .bh .br { display: inline-flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 4px 9px; margin-left: auto; }
  .stat { display: inline-flex; gap: 6px; font: 500 var(--text-mono-sm) / 1.4 var(--font-mono); font-variant-numeric: tabular-nums; }
  .stat .a { color: var(--status-positive); font-weight: 500; }
  .stat .r { color: var(--status-negative); font-weight: 500; }
  .stat .z { color: var(--text-tertiary); font-weight: 400; }
  .btn .ico { width: 13px; height: 13px; }
  .diff { padding: 0 0 8px; font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); }
  .diff .dl { display: grid; grid-template-columns: 16px minmax(0, 1fr); padding: 0 16px 0 12px; color: var(--text-secondary); }
  .diff .dl .sg { font-weight: 600; user-select: none; -webkit-user-select: none; }
  .diff .dl .tx { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diff .dl.a { background: var(--add-bg); color: var(--text-primary); }
  .diff .dl.a .sg { color: var(--status-positive); }
  .diff .dl.r { background: var(--rem-bg); color: var(--text-primary); }
  .diff .dl.r .sg { color: var(--status-negative); }
  .diff .dl.gap { display: block; padding: 1px 16px 1px 28px; font: italic 400 var(--text-xs) / 1.5 var(--font-body); }
  .diff .dl.full { color: var(--text-primary); }
  .diff .dl.wh .tx, .whs { color: var(--text-tertiary); font-style: italic; opacity: 0.75; }
  .nob { padding: 0 16px 8px 28px; color: var(--text-tertiary); font-size: var(--text-xs); }
  .more-lines { margin: 0 0 8px 22px; }
  .diff.clip { position: relative; max-height: 560px; overflow: hidden; }
  .diff.clip::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: linear-gradient(transparent, var(--surface-card)); pointer-events: none; }
  .bfacts { margin: 0; padding: 2px 16px 10px 28px; }
  .bfacts .fact dd { white-space: normal; overflow-wrap: anywhere; }
  .ev { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; padding: 7px 16px; }
  .ev.del { background: rgba(var(--ink-rgb), 0.035); }
  .ev .flink { margin-left: auto; }
  .ev.del > .ico { color: var(--text-secondary); }
  .ev > b { font-weight: 500; }
  .ev .tm, .ev .ip { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .ev .cs { color: var(--text-primary); }
  .ev code { min-width: 0; overflow-wrap: anywhere; color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .edge { height: 1px; }
  .evcard { margin: 14px 16px; padding: 12px 14px; border-radius: var(--radius-card); box-shadow: inset 0 0 0 1px var(--border-hairline); }
  .evcard h3 { margin: 0 0 6px; font: 600 var(--text-sm) / 1.3 var(--font-body); }
  .evcard .facts { grid-template-columns: 1fr; }
  .evcard .fact dd { white-space: normal; overflow-wrap: anywhere; }

  /* popovers: one at a time, closed by a click outside or Escape; they and the tip lie above the tracks */
  .pop { position: fixed; z-index: 2147482500; min-width: 200px; max-width: 340px; max-height: 72vh; overflow: auto; padding: 4px; border-radius: var(--radius-ui); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(var(--ink-rgb), 0.14); font: 400 var(--text-ui-sm) / 1.3 var(--font-body); }
  .pop .head { padding: 8px 8px 4px; color: var(--text-tertiary); font: 500 var(--text-xs) / 1 var(--font-body); }
  .pop .sep { height: 1px; margin: 4px 0; background: var(--border-hairline); }
  .pop .note { padding: 4px 8px 6px; color: var(--text-tertiary); font-size: var(--text-xs); }
  .pop .pad { padding: 4px 8px 6px; }
  .pop .field { width: 100%; }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: none; color: var(--text-primary); text-align: left; cursor: pointer; }
  .item:hover { background: var(--surface-hover); }
  .item.cur { background: var(--surface-selected); }
  .item .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .lab.none { color: var(--text-tertiary); font-style: italic; }
  .item .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .switch { position: relative; flex: none; width: 24px; height: 14px; border-radius: 7px; background: rgba(var(--ink-rgb), 0.18); }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface-card); transition: left 0.12s; }
  .switch.on { background: var(--text-primary); }
  .switch.on::after { left: 12px; }
  .range { display: flex; align-items: center; gap: 6px; padding: 4px 8px 8px; color: var(--text-secondary); font-size: var(--text-xs); }
  .range .field { width: 132px; }
  .pal { display: grid; grid-template-columns: repeat(6, 22px); gap: 4px; padding: 6px; }
  .pal button { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: var(--c); cursor: pointer; }
  .pal button.cur { box-shadow: 0 0 0 2px var(--surface-card), 0 0 0 3.5px var(--text-primary); }
  .upop { width: 360px; max-width: calc(100vw - 16px); padding: 0; }
  .upop .uh { display: flex; align-items: center; gap: 8px; padding: 10px 12px 2px 12px; }
  .upop .uh b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 var(--text-sm) / 1.3 var(--font-body); }
  .upop .facts { grid-template-columns: 1fr; margin: 6px 12px 4px; }
  .upop .fact dt { width: 84px; }
  .upop .acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px 8px; }
  .upop .pages { max-height: 240px; overflow-y: auto; padding: 0 4px 4px; border-top: 1px solid var(--border-hairline); }
  .up { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 8px 0 10px; border-radius: 4px; cursor: pointer; }
  .up:hover { background: var(--surface-hover); }
  .up.uhd { min-height: 26px; cursor: default; color: var(--text-tertiary); font-size: var(--text-xs); }
  .up.uhd:hover { background: none; }
  .up.uhd .n { color: var(--text-tertiary); font-family: var(--font-body); font-size: var(--text-xs); }
  .up .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .up .wk { color: var(--text-tertiary); font-size: var(--text-xs); }
  .up .n { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); white-space: nowrap; }
  .up .ico { width: 12px; height: 12px; color: var(--text-tertiary); }

  #tip { position: fixed; z-index: 2147482600; display: none; max-width: 340px; padding: 7px 9px; border-radius: var(--radius-ui); background: var(--surface-card); box-shadow: 0 0 0 1px rgba(var(--ink-rgb), 0.12), 0 10px 28px -14px rgba(var(--ink-rgb), 0.32); pointer-events: none; font: 400 var(--text-xs) / 1.4 var(--font-body); }
  #tip .h { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
</style>
</head>
<body>
<div id="ctl">
  <label class="search"><svg class="ico" viewBox="0 0 24 24"><path d="M4 10.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M15.2 15.2L20 20"/></svg><input id="q" class="field" type="search" placeholder="Page name" autocomplete="off" spellcheck="false"></label>
  <button id="f-user" class="field fbtn" type="button" aria-haspopup="menu" aria-expanded="false"></button>
  <span id="colour"></span>
</div>
<div id="hist"><div id="range"></div><div id="chart"><div id="gut"></div><svg id="hs"></svg></div><div id="ax"></div></div>
<div id="main">
  <section id="left">
    <div id="lh"><span id="count"></span><select id="sort" class="field" aria-label="Sort pages">
      <option value="n:-1">Most revisions</option>
      <option value="n:1">Fewest revisions</option>
      <option value="u:-1">Most usernames</option>
      <option value="f:-1">Newest first edit</option>
      <option value="f:1">Oldest first edit</option>
      <option value="l:-1">Latest last edit</option>
      <option value="l:1">Earliest last edit</option>
      <option value="d:-1">Most deletes</option>
      <option value="name:1">Name</option>
    </select></div>
    <div id="list" tabindex="0"><div id="vl"></div></div>
  </section>
  <section id="right">
    <div id="ph"></div>
    <div id="pst"><svg id="ps"></svg></div>
    <div id="blocks" tabindex="-1"></div>
  </section>
</div>
<div id="tip"></div>
<script>
'use strict'
// Wiki Page History. The control row narrows the pages by name and username, and holds thimble's Color by control: a
// revision's wiki, its kind of save, its page's status (deleted or never deleted), or any label, each value a chip that
// filters. Below it, thimble's time range selector is the one control for time: its overview holds every
// revision over the whole span and its viewfinder frames the range the view shows. The chart of the range counts the
// revisions (above the line, stacked by the colour's values) and deletes (below it) of those pages per bin, on the
// chart's one axis, and a drag on it sets the range. The list on the left holds the pages in the range, each with its
// revisions and deletes on the same bins as the chart, and the list's tracks beside it; the page picked opens on the
// right as its history in the range and of the username filtered by, revision by revision, each a row with the colour's
// bar on its edge, a link to its line and its diff against the revision before, with its delete events and requests in
// place, more as the list scrolls, and the tracks of the revisions read so far.
// Labels: the reader keeps only the pages, revisions and events the label filter keeps, and hands every revision the
// marks of the labels that are on, from which the page reads the value of the label colored by; a page's row carries
// the page as its data-anchor (view:<slug>/<page_id>), each revision and event its line, so thimble marks them.
const SLUG = (thimble.view && thimble.view.slug) || 'wiki-page-history'
const unitRef = (key) => `view:${SLUG}/${key}`
const WITHHELD = '[pre-2026 line withheld]'
const ROW_H = 50
const CHUNK = 30 // history items a fetch reads in full
const FEW_NAMES = 12 // usernames a page's details show before All
const LIST_PAD = 8 // rows drawn beyond the list's view
const MONTH = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const WEEKDAY = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
const G = 214 // the chart's gutter
const ICON = {
  down: 'M6 9l6 6 6-6', x: 'M6 6l12 12M18 6L6 18', check: 'M5 12.5l4.5 4.5L19 7',
  trash: 'M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3',
  info: 'M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18zM12 11v6M12 7.5h.01',
  file: 'M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5',
  tag: 'M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9zM7.5 7.5h.01', plus: 'M12 5v14M5 12h14',
  text: 'M4 6h16M4 10h16M4 14h10M4 18h12', edit: 'M4 20h4L19 9l-4-4L4 16zM14 6l4 4', user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20a7.5 7.5 0 0 1 15 0', globe: 'M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18zM3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18',
}
const ico = (n, c = 'ico') => `<svg class="${c}" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const fmt = (n) => Number(n || 0).toLocaleString('en-US')
const plural = (n, one, many = one + 's') => `${fmt(n)} ${n === 1 ? one : many}`
const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const $ = (id) => document.getElementById(id)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))

// ---------------------------------------------------------------- time: T is seconds since 1970, shown in UTC
const date = (T) => new Date(T * 1000)
const dm = (T) => { const d = date(T); return `${d.getUTCDate()} ${MONTH[d.getUTCMonth()]}` }
const hm = (T) => date(T).toISOString().slice(11, 16)
const hms = (T) => date(T).toISOString().slice(11, 19)

  return `${dm(a)} ${hm(a)} – ${dm(b)} ${hm(b)}`
}

  return `${weekday(t0).slice(0, 3)} ${dm(t0)} ${hm(t0)}–${dayKey(t1) !== dayKey(t0) && hm(t1) === '00:00' ? '24:00' : hm(t1)}`

// ---------------------------------------------------------------- data
// O: the reader's overview, every page the label filter keeps as columns (pages), with its revisions (revs) and
// deletes (dels) in page order; times are seconds since O.t0.
let O = null, N = 0
let rowOf = new Map() // reader page index -> row
let RS = null, RE = null, DS = null, DE = null // each row's revisions and deletes, as ranges of the columns
let LN = [] // page names in lower case
let userAt = new Map() // username -> its index in O.users
let byUser = null // username index -> the rows it wrote in
let labelState = { labels: [], filter: null, all: null, palette: null }
let labelsV = 0

const S = {
  q: '', user: null, sort: 'n', dir: -1,
  range: null, // the range the time range selector frames, [from, to) in seconds since O.t0, null for the whole span
  sel: null, // the open page (reader page index)
  picked: false, // the analyst picked the open page, rather than the view opening the first
  pinfo: false, // the open page's details shown
  keepPage: null, // a page a citation opened, shown whatever the label filter keeps
  event: null, // an event no page holds, shown on the right
}

let ovSeq = 0
async function loadOverview() {
  for (;;) {
    const my = ++ovSeq, v = labelsV
    let res
    try {
      res = await thimble.fetch({ op: 'overview', ...(S.keepPage != null ? { keep: [S.keepPage] } : {}) }, { key: 'overview' })
    } catch (e) {
      if (e && e.name === 'AbortError') return false
      throw e
    }
    if (my !== ovSeq) return false
    if (v !== labelsV) continue
    O = res
    N = O.pages.p.length
    rowOf = new Map()
    for (let r = 0; r < N; r++) rowOf.set(O.pages.p[r], r)
    RS = new Int32Array(N); RE = new Int32Array(N); DS = new Int32Array(N); DE = new Int32Array(N)
    let k = 0, j = 0
    for (let r = 0; r < N; r++) {
      const p = O.pages.p[r]
      RS[r] = k
      while (k < O.revs.rp.length && O.revs.rp[k] === p) k++
      RE[r] = k
      DS[r] = j
      while (j < O.dels.dp.length && O.dels.dp[j] === p) j++
      DE[r] = j
    }
    LN = O.pages.name.map((s) => String(s).toLowerCase())
    userAt = new Map(O.users.map((u, i) => [u, i]))
    byUser = null
    return true
  }
}
function userRows(u) {
  if (!byUser) {
    byUser = new Map()
    for (let r = 0; r < N; r++) for (let k = RS[r]; k < RE[r]; k++) {
      const x = O.revs.ru[k]
      let s = byUser.get(x)
      if (!s) byUser.set(x, (s = new Set()))
      s.add(r)
    }
  }
  return byUser.get(u) || new Set()
}
const userName = (u) => (u >= 0 && O ? O.users[u] : '')

// ---------------------------------------------------------------- filters and order
const inR = (t) => !S.range || (t >= S.range[0] && t < S.range[1])
function inRange(r) {
  for (let k = RS[r]; k < RE[r]; k++) if (inR(O.revs.rt[k])) return true
  for (let k = DS[r]; k < DE[r]; k++) if (inR(O.dels.dt[k])) return true
  return false
}
// whether row r meets every filter but those `skip` names (one name or a list); a page whose wiki or status the analyst
// turned off in Color by meets none
function passes(r, skip) {
  const sk = (k) => skip === k || (Array.isArray(skip) && skip.includes(k))
  if (S.q && !LN[r].includes(S.q)) return false
  if (!sk('colour') && pageLevel() && !colour.isOn(pageValue(r))) return false
  if (!sk('user') && S.user != null && !(userAt.has(S.user) && userRows(userAt.get(S.user)).has(r))) return false
  if (!sk('range') && S.range && !inRange(r)) return false
  return true
}
let rows = [] // the rows that pass, in order
let charted = [] // the rows that pass every filter but the range, which the chart counts
let counted = [] // and those of a value turned off too, which the chips count
function compute() {
  rows = []; charted = []; counted = []
  for (let r = 0; r < N; r++) {
    if (!passes(r, ['range', 'colour'])) continue
    counted.push(r)
    if (pageLevel() && !colour.isOn(pageValue(r))) continue
    charted.push(r)
    if (!S.range || inRange(r)) rows.push(r)
  }
  const P = O.pages, k = S.sort, d = S.dir
  const by = k === 'name' ? (a, b) => LN[a] < LN[b] ? -1 : LN[a] > LN[b] ? 1 : 0 : (a, b) => (P[k][a] - P[k][b]) * d || (P.n[b] - P.n[a]) || (LN[a] < LN[b] ? -1 : 1)
  rows.sort(by)
}
function clearFilters() {
  S.q = ''; $('q').value = ''; S.user = null
  S.range = null
  range.set(null)
}

// ---------------------------------------------------------------- colour
// thimble's Color by control, in the control row: a revision's wiki, its kind of save (the base its diff is against)
// or its page's status, deleted or never deleted, or any label, in one menu; the values as chips, each with its
// revisions in the chart, that filter their records when turned off. A record the control is handed is {wiki, save,
// status} for a revision or a page (a page takes no save); a label's value is that label's among the record's marks,
// which the reader sends.
const NONE = () => token('--viz-ink-3') || '#a19d94'
const BASE_NAME = ['New page', 'Edit', 'After a delete', 'First stored'] // the reader's BASES: new, prev, deleted, withheld
const STATUS = ['deleted', 'never deleted']
const colour = thimble.colorBy({
  mount: '#colour',
  fields: [
    // a fourth value names olive, so it does not take the sky blue that sits beside the first value's blue
    { name: 'wiki', title: 'Wiki', values: ['dse', 'probier', 'fractal', { name: 'dorfwiki', colour: 5 }] },
    { name: 'save', title: 'Kind of save', values: [...BASE_NAME.slice(0, 3), { name: BASE_NAME[3], colour: 5 }] },
    { name: 'status', title: 'Status', values: STATUS },
  ],
  chips: 'filter',
  onChange: () => { if (O) { compute(); renderAll(); if (!dropGone() && S.sel != null) openPage(S.sel, null, true) } },
})
// whether the colour is a field of the page itself, which a page's row takes and is filtered by
const pageLevel = () => colour.field === 'wiki' || colour.field === 'status'
// the value of a label among marks given as bits of indices into `marks`, null for none
function labelValue(bits, marks) {
  const lab = colour.label
  const l = lab && (labelState.all || labelState.labels || []).find((x) => x.id === lab)
  if (!l || !bits || !marks) return null
  for (let j = 0; j < marks.length; j++) if (bits & (1 << j) && marks[j].label === l.name) return marks[j].value
  return null
}
const pageStatus = (r) => (O.pages.d[r] ? STATUS[0] : STATUS[1])
// revision k of the overview, on row r
function revValue(k, r) {
  if (colour.label) return labelValue(O.revs.rb[k], O.marks)
  const f = colour.field
  return f === 'wiki' ? O.wikis[O.pages.w[r]] : f === 'save' ? BASE_NAME[O.revs.rk[k]] : f === 'status' ? pageStatus(r) : null
}
// a page's record, and a revision's of the open page
const pageRec = (r) => ({ wiki: O.wikis[O.pages.w[r]], status: pageStatus(r) })
const openStatus = () => { const r = rowOf.get(S.sel); return r != null ? pageStatus(r) : PG.page.deletes ? STATUS[0] : STATUS[1] }
function blockRec(b) {
  return { ref: b.ref, wiki: PG.page.wiki, save: BASE_NAME[['new', 'prev', 'deleted', 'withheld'].indexOf(b.base)], status: openStatus() }
}
// item i of the open page's strip
function stripValue(st, i) {
  if (colour.label) return labelValue(st.b[i], PG.marks)
  if (st.k[i] !== 'r') return null
  const f = colour.field
  return f === 'wiki' ? PG.page.wiki : f === 'save' ? BASE_NAME[st.kb[i]] : f === 'status' ? openStatus() : null
}
// a page's value, for its row and the list's tracks: its wiki, its status, or the label's value among its records'
// marks; a kind of save belongs to a revision, so a page takes none
function pageValue(r) {
  if (colour.label) return labelValue(O.pages.pm[r], O.marks)
  const f = colour.field
  return f === 'wiki' ? O.wikis[O.pages.w[r]] : f === 'status' ? pageStatus(r) : null
}
// a value's colour where it is on, the dim ink where the analyst turned it off, the plain ink for no value
const valueInk = (v, ink, dim) => (v == null ? ink : colour.isOn(v) ? colour.colourOf(v) || ink : dim)

// ---------------------------------------------------------------- popovers
let openPop = null

function pop(anchor, html, { align = 'left', cls = '' } = {}) {
  closePop()
  const p = document.createElement('div')
  p.className = 'pop ' + cls
  p.setAttribute('role', 'menu')
  p.innerHTML = html
  document.body.appendChild(p)
  p.anchor = anchor
  p.align = align
  place(p)
  anchor.setAttribute('aria-expanded', 'true')
  openPop = p
  return p
}
// below its anchor, or above it when there is more room there, inside the page
function place(p) {
  p.style.maxHeight = ''
  const r = p.anchor.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight
  const below = innerHeight - r.bottom - 10, above = r.top - 10
  const top = h <= below || below >= above ? r.bottom + 4 : r.top - 4 - Math.min(h, above)
  p.style.maxHeight = Math.max(160, Math.floor(h <= below || below >= above ? below : above)) + 'px'
  p.style.top = Math.max(6, top) + 'px'
  p.style.left = Math.max(6, Math.min(innerWidth - w - 6, p.align === 'right' ? r.right - w : r.left)) + 'px'

document.addEventListener('mousedown', (e) => { if (openPop && !openPop.contains(e.target) && !(openPop.anchor && openPop.anchor.contains(e.target))) closePop() })
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop() })
const toggled = (anchor) => (openPop && openPop.anchor === anchor ? (closePop(), true) : false)

// ---------------------------------------------------------------- the control row
function renderCtl() {
  const u = $('f-user')
  u.classList.toggle('active', S.user != null)
  u.innerHTML = S.user != null ? `Username <span class="v">${esc(S.user || 'anonymous')}</span><span class="clr" data-clear="user" role="button" aria-label="Every username">${ico('x')}</span>` : `Username${ico('down')}`
}
function clearOne(what) {
  if (what === 'user') S.user = null
  closePop(); rescope()
  if (what === 'user' && S.sel != null) openPage(S.sel)
}
let typing = null
$('q').addEventListener('input', (e) => { clearTimeout(typing); typing = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); rescope() }, 120) })

// the username filter: every username of the pages that pass the other filters, by the pages it wrote in
$('f-user').onclick = (e) => {
  const b = $('f-user')
  if (e.target.closest('[data-clear]')) return clearOne('user')
  if (toggled(b)) return
  const pages = new Map()
  for (let r = 0; r < N; r++) {
    if (!passes(r, 'user')) continue
    const seen = new Set()
    for (let k = RS[r]; k < RE[r]; k++) seen.add(O.revs.ru[k])
    for (const u of seen) pages.set(u, (pages.get(u) || 0) + 1)
  }
  const all = [...pages].sort((a, b2) => b2[1] - a[1] || (O.users[a[0]] < O.users[b2[0]] ? -1 : 1))
  const p = pop(b, `<div class="pad"><input class="field" id="uq" type="search" placeholder="Username" autocomplete="off" spellcheck="false"></div><div id="ul"></div>`)
  const list = p.querySelector('#ul')
  const draw = (q) => {
    const hit = q ? all.filter(([u]) => O.users[u].toLowerCase().includes(q)) : all
    list.innerHTML = (S.user != null ? `<button class="item" data-u="-1" type="button"><span class="lab">Every username</span></button><div class="sep"></div>` : '') +
      hit.slice(0, 200).map(([u, n]) => `<button class="item${O.users[u] === S.user ? ' cur' : ''}" type="button" data-u="${u}"><span class="lab${O.users[u] ? '' : ' none'}">${esc(O.users[u] || 'anonymous')}</span><span class="n">${fmt(n)}</span></button>`).join('') +
      (hit.length > 200 ? `<div class="note">${fmt(hit.length - 200)} more</div>` : '') + (hit.length ? '' : '<div class="note">No username</div>')
  }
  draw('')
  const input = p.querySelector('#uq')
  input.focus()
  input.oninput = () => draw(input.value.trim().toLowerCase())
  list.onclick = (e) => {
    const it = e.target.closest('[data-u]')
    if (!it) return
    S.user = +it.dataset.u < 0 ? null : O.users[+it.dataset.u]
    closePop(); rescope()
    if (S.sel != null) openPage(S.sel)
  }
}
// the chips' counts: the revisions in the range of the pages the other filters keep that take each value, a value
// turned off counted too
function renderCounts() {
  const counts = {}
  for (const r of counted) {
    for (let k = RS[r]; k < RE[r]; k++) {
      if (!inR(O.revs.rt[k])) continue
      const v = revValue(k, r), key = v == null ? '' : v
      counts[key] = (counts[key] || 0) + 1
    }
  }
  colour.counts(counts)
}


// ---------------------------------------------------------------- the range and its chart
// thimble's time range selector is the one control for time: its overview holds every revision of the pages the other
// filters keep over the whole span, in the colour's values, and its viewfinder frames the range, which the chart below
// draws per bin and the list and the history keep to. It opens on the whole span.
const range = thimble.timeRange({ mount: '#range', height: 22, onChange: (rg) => setRange(rg) })
// the range as S.range holds it, [from, to) in seconds since O.t0, null for the whole span
const rangeNow = () => (range.full ? null : [range.from - O.t0, range.to - O.t0])
function setRange() {
  if (!O) return
  const want = rangeNow()
  if (JSON.stringify(want) === JSON.stringify(S.range)) return
  S.range = want
  rescope()
  if (S.sel != null) openPage(S.sel)
}
// the overview's records: every revision and delete of the pages the other filters keep, and the deletes of pages known
// only from a delete, each with its value (a delete takes its page's wiki or status, and no kind of save or label value);
// true when the range it opens on (the one thimble kept for the view) is not the one S.range held
function renderRange() {
  const times = [], values = [], lvl = pageLevel()
  for (const r of charted) {
    for (let k = RS[r]; k < RE[r]; k++) { times.push(O.t0 + O.revs.rt[k]); values.push(revValue(k, r)) }
    for (let k = DS[r]; k < DE[r]; k++) { times.push(O.t0 + O.dels.dt[k]); values.push(lvl ? pageValue(r) : null) }
  }
  if (S.user == null) {
    const G2 = O.gone
    for (let k = 0; k < G2.ot.length; k++) {
      const wk = O.wikis[G2.ow[k]]
      if (S.q && !String(G2.on[k]).toLowerCase().includes(S.q)) continue
      const v = colour.field === 'wiki' ? wk : colour.field === 'status' ? STATUS[0] : null
      if (lvl && !colour.isOn(v)) continue
      times.push(O.t0 + G2.ot[k]); values.push(v)
    }
  }
  range.data({ times, values, span: [O.t0 + O.span[0], O.t0 + O.span[1]] })

  const want = rangeNow()
  if (JSON.stringify(want) === JSON.stringify(S.range)) return false
  S.range = want
  return true
}

// The chart of the range: the revisions of the pages that pass every filter, per bin of the range, above the line, each
// bin's bar stacked by the colour's values that are on, in the chips' order; the deletes of those pages, and of pages
// known only from a delete, below it in one series. Its bins are the rows' bins, so each row's strip is a small multiple
// of it. A drag on it sets the range, a double click shows the whole span.

let stripW = 120
const stripWidth = () => Math.round(clamp($('list').clientWidth * 0.36, 70, 200))

      if (!inR(t)) continue
      const i = sc.binOf(O.t0 + t)
      if (i < 0) continue
      const v = revValue(k, r)
      if (!colour.isOn(v)) continue
      revs[i]++; nr++
      by[i][v == null || !slot.has(v) ? NS - 1 : slot.get(v)]++
    }
    for (let k = DS[r]; k < DE[r]; k++) {
      const t = O.dels.dt[k]
      if (!inR(t)) continue
      const i = sc.binOf(O.t0 + t)
      if (i < 0) continue
      dels[i]++; nd++
    }
  }
  // deletes of pages with no stored revision, which no row holds: counted where the name and Color by filters let
  // them (each is a deleted page), and while no username is filtered by, since a delete has no author's revisions
  if (S.user == null) {
    const G2 = O.gone
    const lvl = pageLevel()
    for (let k = 0; k < G2.ot.length; k++) {
      const wk = O.wikis[G2.ow[k]]
      if (S.q && !String(G2.on[k]).toLowerCase().includes(S.q)) continue
      if (lvl && !colour.isOn(colour.field === 'wiki' ? wk : STATUS[0])) continue
      const t = G2.ot[k]
      if (!inR(t)) continue
      const i = sc.binOf(O.t0 + t)
      if (i < 0) continue
      gone[i]++; nd++
    }
  }

  for (let i = 0; i < nb; i++) { maxR = Math.max(maxR, revs[i]); maxD = Math.max(maxD, dels[i] + gone[i]) }
  const hy = (n) => (n ? Math.max(1.5, Math.sqrt(n / maxR) * up) : 0)
  const dy = (n) => (n ? Math.max(1.5, Math.sqrt(n / maxD) * down) : 0)
  let s = ''
  for (let i = 0; i < nb; i++) {
    const xa = x0 + Math.max(0, sc.x(bins[i][0])), xb = x0 + Math.min(x1 - x0, sc.x(bins[i][1]))
    if (xb <= xa) continue
    const bw = Math.max(0.8, xb - xa - (xb - xa > 4 ? 1 : 0.3))
    if (revs[i]) {
      const hh = hy(revs[i])
      let y = base
      for (let j = 0; j < NS; j++) {
        if (!by[i][j]) continue
        const part = hh * (by[i][j] / revs[i])
        y -= part
        s += `<rect x="${xa.toFixed(2)}" y="${y.toFixed(2)}" width="${bw.toFixed(2)}" height="${part.toFixed(2)}" fill="${esc(fills[j])}"/>`
      }
    }
    if (dels[i] || gone[i]) s += `<rect x="${xa.toFixed(2)}" y="${base + 1}" width="${bw.toFixed(2)}" height="${dy(dels[i] + gone[i]).toFixed(2)}" fill="${red}"/>`
  }
  s += `<line class="rule" x1="${x0}" x2="${x1}" y1="${base + 0.5}" y2="${base + 0.5}"/>`
  s += `<rect id="brush" x="0" y="1" width="0" height="${base + down + 2}" rx="2" fill="rgba(var(--ink-rgb),.06)" stroke="var(--text-primary)" stroke-width="1.2" display="none"/>`
  svg.setAttribute('width', w); svg.setAttribute('height', h)
  svg.innerHTML = s
  // the key: each series with a mark drawn as it is, the revisions in the colours of the values that are on (one grey
  // with Color by Off), the deletes in theirs
  const sw = vals.length ? vals.slice(0, 8).map((v) => `<i style="--c:${esc(colour.colourOf(v) || ink)}"></i>`).join('') : `<i style="--c:${esc(ink)}"></i>`
  $('gut').innerHTML = `<span class="k"><span class="msw">${sw}</span><b>${fmt(nr)}</b>${nr === 1 ? 'revision' : 'revisions'}</span>` +
    `<span class="k"><span class="sw" style="--c:${red}"></span><b>${fmt(nd)}</b>${nd === 1 ? 'delete' : 'deletes'}</span>`
  svg.bins = { revs, dels, gone, nb, by, vals, fills }

}

  const body = bodies.get(i)
  if (!body) return '<div class="nob">Empty page</div>'
  return `<div class="diff">${body.split('\n').map((s) => lineHtml([' ', s], true)).join('')}</div>`
}
function ipHtml(v) { return v ? `<span class="ip" title="IP prefix, its first two parts"><span class="k">IP</span>${esc(v)}.*.*</span>` : '' }
function who(name) {
  return name ? `<button class="who" type="button" data-user="${esc(name)}">${esc(name)}</button>` : `<button class="who anon" type="button" data-user="">anonymous</button>`
}
function revHtml(b, pos) {
  const T = isoT(b.time)
  const full = fullOn.has(b.i), info = infoOn.has(b.i)
  const tag = b.base === 'withheld' ? '<span class="chip chip-tone-neutral" title="The first revision the files hold: earlier revisions of the page were withheld, so this shows the page as it stood">first stored</span>'
    : b.base === 'deleted' ? '<span class="chip chip-tone-neutral" title="The page was deleted before this save, so every line of it counts as added">after a delete</span>'
    : b.base === 'new' ? '<span class="chip chip-tone-neutral" title="The page\'s first revision: every line counts as added">new page</span>' : ''
  const stat = b.base === 'withheld' ? '' : `<span class="stat">${b.add ? `<b class="a">+${fmt(b.add)}</b>` : ''}${b.rem ? `<b class="r">−${fmt(b.rem)}</b>` : ''}${!b.add && !b.rem ? '<b class="z">±0</b>' : ''}</span>`
  const text = b.change_summary || (b.diff || []).find((l) => l[0] === '+' && String(l[1]).trim())?.[1] || ''
  let h = `<article class="blk rev" data-pos="${pos}" data-i="${b.i}" data-anchor="${esc(b.ref)}" data-anchor-text="${esc(String(text).slice(0, 300))}"${colour.attr(blockRec(b))}>` +
    `<div class="bh" data-thimble-chrome><span class="seq">r${esc(b.seq)}</span><span class="tm">${T != null ? hms(T) : esc(b.time)}</span>${who(b.label)}${b.admin ? '<span class="chip chip-tone-neutral">admin</span>' : ''}${ipHtml(b.ip16)}` +
    `${b.change_summary ? `<span class="cs">${esc(b.change_summary)}</span>` : ''}<span class="br">${tag}${stat}` +
    `<button class="btn btn-ghost btn-sm${full ? ' active' : ''}" type="button" data-full title="The page as this revision left it">${ico('text')}Full text</button><button class="btn btn-ghost btn-sm${info ? ' active' : ''}" type="button" data-info aria-label="Details" title="Details">${ico('info')}</button>${fileLink(b.ref)}</span></div>`
  if (info) {
    const base = { prev: `r${b.seq - 1}`, new: 'an empty page, the first revision', deleted: 'an empty page, after a delete', withheld: 'none, earlier revisions withheld' }[b.base] || b.base
    h += `<dl class="facts bfacts thimble-details">${fact('rev_id', b.rev_id, true)}${fact('time', whenUTC(b.time))}${fact('write_date', whenUTC(b.write_date))}${fact('body_len', fmt(b.body_len))}${fact('lines', fmt(b.lines))}${fact('request_action', b.request_action == null ? 'null' : b.request_action)}${fact('compared with', base)}<div class="fact"><button class="btn btn-ghost btn-sm" type="button" data-file>${ico('file')}Open in the File browser</button></div></dl>`
  }
  h += full ? bodyHtml(b.i) : diffHtml(b)
  return h + '</article>'
}
function delHtml(b, pos) {
  const T = isoT(b.time)
  return `<div class="blk ev del" data-pos="${pos}" data-anchor="${esc(b.ref)}" data-anchor-text="${esc(b.change_summary || '')}">${ico('trash')}<b>Deleted</b><span class="tm">${T != null ? hms(T) : esc(b.time)}</span>${who(b.actor_label)}${ipHtml(b.ip16)}${b.change_summary ? `<span class="cs">${esc(b.change_summary)}</span>` : ''}${fileLink(b.ref)}</div>`
}
function reqHtml(b, pos) {
  const T = isoT(b.time)
  return `<div class="blk ev req" data-pos="${pos}" data-anchor="${esc(b.ref)}" data-anchor-text="${esc(b.request || b.request_action || '')}">${ico('globe')}<b>Request</b><span class="tm">${T != null ? hms(T) : esc(b.time)}</span>${b.label ? who(b.label) : ''}${ipHtml(b.ip16)}${b.request_action ? `<span class="chip chip-tone-neutral">${esc(b.request_action)}</span>` : ''}${b.request ? `<code>${esc(b.request)}</code>` : ''}${fileLink(b.ref)}</div>`
}
function blockHtml(b, pos) { return b.kind === 'delete' ? delHtml(b, pos) : b.kind === 'request' ? reqHtml(b, pos) : revHtml(b, pos) }
// whether the Color by chips keep an item of the history: a revision by its value; a delete or a request, which takes no
// field's value, always under a field, and by its label value under a label
function keptItem(b) {
  if (b.kind === 'delete' || b.kind === 'request') return !colour.label || colour.keeps({ ref: b.ref })
  return colour.keeps(blockRec(b))
}
function renderBlocks() {
  let h = ''
  if (bFrom > 0) h += '<div class="edge" id="top"></div>'
  let day = null, kept = 0
  blocks.forEach((b, k) => {
    if (!keptItem(b)) return
    kept++
    const T = isoT(b.time)
    const d = T != null ? dayKey(T) : ''
    if (d !== day) { day = d; h += `<div class="day">${T != null ? `${weekday(T)} ${dm(T)}` : ''}</div>` }
    h += blockHtml(b, bFrom + k)
  })
  if (bFrom + blocks.length < bTotal) h += '<div class="edge" id="end"></div>'
  else if (!kept) h += `<div class="empty">No revision of this page meets these filters</div>`
  $('blocks').innerHTML = h
  fitClips($('blocks'))
  renderBlocksStrip()
}
// the history's tracks: where each revision read so far stands, and what the preview says of one
function renderBlocksStrip() {
  colour.strip($('blocks'), {
    preview: (el) => {
      const tm = el.querySelector && el.querySelector('.tm')
      const day = el.closest && el.previousElementSibling
      const who = el.querySelector && el.querySelector('.who')
      const cs = el.querySelector && el.querySelector('.cs')
      return { when: tm ? tm.textContent : '', text: [who ? who.textContent : '', cs ? cs.textContent : el.getAttribute('data-anchor-text') || ''].filter(Boolean).join(' · ') }
    },
  })
}
// the history drawn again where it is, as when the colour changes
function rerenderBlocks() {
  const box = $('blocks'), top = box.scrollTop
  renderBlocks()
  box.scrollTop = top
  watchEnd()
}
function rerender(b) {
  const k = blocks.indexOf(b)
  const el = $('blocks').querySelector(`[data-pos="${bFrom + k}"]`)
  if (el) {
    el.outerHTML = blockHtml(b, bFrom + k)
    const now = $('blocks').querySelector(`[data-pos="${bFrom + k}"]`)
    if (now) fitClips(now)
  }
}
$('blocks').addEventListener('click', async (e) => {
  const u = e.target.closest('[data-user]')
  if (u) return userPop(u.dataset.user, u)
  const el = e.target.closest('.blk')
  if (!el) return
  const b = blocks[+el.dataset.pos - bFrom]
  if (!b) return
  if (e.target.closest('[data-long]')) { longOn.add(b.ref); return rerender(b) }
  if (e.target.closest('[data-file]')) return thimble.navigate(b.ref, { browser: true })
  // a revision's details and its full text open in place under its line, the line kept where it is
  if (e.target.closest('[data-info]')) { infoOn.has(b.i) ? infoOn.delete(b.i) : infoOn.add(b.i); return thimble.expand(el, () => rerender(b)) }
  if (e.target.closest('[data-full]')) {
    if (fullOn.has(b.i)) { fullOn.delete(b.i); return thimble.expand(el, () => rerender(b)) }
    fullOn.add(b.i)
    thimble.expand(el, () => rerender(b))
    if (!bodies.has(b.i)) {
      const res = await thimble.fetch({ op: 'body', i: b.i })
      if (res) bodies.set(b.i, res.body)
      if (fullOn.has(b.i)) rerender(b)
    }
  }
})
let moreBusy = false
async function more() {
  if (moreBusy || !PG || bFrom + blocks.length >= bTotal) return
  moreBusy = true
  const my = pageSeq
  try {
    const res = await thimble.fetch(pageQuery({ from: bFrom + blocks.length }), { key: 'page-more' })
    if (my !== pageSeq || !res) return
    blocks = blocks.concat(res.blocks); bTotal = res.total
    const box = $('blocks'), top = box.scrollTop
    renderBlocks(); box.scrollTop = top
  } catch (e) {
    if (!(e && e.name === 'AbortError')) throw e
  } finally { moreBusy = false }
  watchEnd()
}
async function earlier() {
  if (!PG || bFrom <= 0) return
  const my = pageSeq
  const from = Math.max(0, bFrom - CHUNK)
  const res = await thimble.fetch(pageQuery({ from, n: bFrom - from }), { key: 'page-more' })
  if (my !== pageSeq || !res) return
  const box = $('blocks'), before = box.scrollHeight - box.scrollTop
  blocks = res.blocks.concat(blocks); bFrom = from; bTotal = res.total
  renderBlocks()
  box.scrollTop = box.scrollHeight - before
  watchEnd()
}
// more of the history as either end comes near the view
const endSeen = new IntersectionObserver((es) => {
  for (const x of es) if (x.isIntersecting) x.target.id === 'top' ? earlier() : more()
}, { root: $('blocks'), rootMargin: '400px 0px 400px 0px' })
function watchEnd() {
  endSeen.disconnect()
  for (const id of ['end', 'top']) { const el = $(id); if (el) endSeen.observe(el) }
}

// an event no page holds: a delete of a page with no stored revision, or a request that names none
async function showEvent(line) {
  const my = ++pageSeq
  const res = await thimble.fetch({ op: 'event', line }, { key: 'page' })
  if (my !== pageSeq) return
  S.event = line; S.sel = null; PG = null
  for (const el of document.querySelectorAll('.row.sel')) el.classList.remove('sel')
  $('ps').innerHTML = ''; $('ps').setAttribute('height', 0); $('ph').innerHTML = ''
  if (!res) { $('blocks').innerHTML = '<div class="empty">The event is not in the files</div>'; return }
  const T = isoT(res.time)
  const kind = res.event_type === 'delete' ? `Deleted ${res.page || res.page_key || 'page'}` : res.event_type === 'request' ? 'Request' : res.event_type
  const facts = Object.entries(res).filter(([k]) => k !== 'ref').map(([k, v]) => fact(k, v == null ? 'null' : typeof v === 'object' ? JSON.stringify(v) : String(v))).join('')
  $('blocks').innerHTML = `<div class="evcard" data-anchor="${esc(res.ref)}" data-anchor-text="${esc(res.request || res.change_summary || res.request_action || '')}"><h3>${esc(kind)}</h3><div class="h2 mono">${T != null ? `${weekday(T)} ${dm(T)} ${hms(T)} UTC` : ''}</div><dl class="facts">${facts}</dl></div>`
}

// ---------------------------------------------------------------- a username and its pages
async function userPop(name, anchor) {
  if (openPop && openPop.anchor === anchor) return closePop()
  const p = pop(anchor, `<div class="note">Reading ${esc(name || 'anonymous')}</div>`, { cls: 'upop' })
  const res = await thimble.fetch({ op: 'user', name }, { key: 'user' }).catch(() => null)
  if (openPop !== p) return
  if (!res) { p.innerHTML = '<div class="note">Not in the files</div>'; return }
  const T = (s) => { const t = isoT(s); return t == null ? '' : `${dm(t)} ${hm(t)}` }
  requestAnimationFrame(() => { if (openPop === p) place(p) })
  const pages = res.pages || []
  const inPage = PG && PG.users.some(([u]) => O.users[u] === name)
  p.innerHTML = `<div${res.ref ? ` data-anchor="${esc(res.ref)}" data-anchor-text="${esc(name)}"` : ''}><div class="uh"><b>${esc(name || 'anonymous')}</b>${O.admins.includes(name) ? '<span class="chip chip-tone-neutral">admin</span>' : ''}${res.role ? `<span class="chip chip-tone-neutral">${esc(res.role)}</span>` : ''}</div>` +
    `<dl class="facts">${fact('revisions', fmt(res.stored_revisions ?? pages.reduce((a, x) => a + (x.edits || 0), 0)))}${fact('pages', fmt(pages.length))}${fact('first write', T(res.first_write))}${fact('last write', T(res.last_write))}${res.stored_revision_ips != null ? fact('IPs', fmt(res.stored_revision_ips)) : ''}${res.stored_revision_ip16 != null ? fact('IP prefixes', fmt(res.stored_revision_ip16)) : ''}${fact('wikis', (res.wikis || []).join(', '))}${res.deletes ? fact('deletes', fmt(res.deletes)) : ''}</dl>` +
    `<div class="acts"><button class="btn btn-secondary btn-sm" type="button" data-act="list">${S.user === name ? 'Every username' : 'Only this username'}</button></div>` +
    `<div class="pages"><div class="up uhd"><span class="nm">${plural(pages.length, 'page')}</span><span class="n">revisions / page total</span></div>${pages.map((x) => x.p == null ? `<div class="up"><span class="nm">${esc(x.page_id)}</span></div>` : `<div class="up" data-p="${x.p}"${x.key ? ` data-anchor="${esc(unitRef(x.key))}" data-anchor-text="${esc(x.name)}"` : ''}><span class="nm">${esc(x.name)}</span><span class="wk">${esc(x.wiki)}</span>${x.deletes ? ico('trash') : ''}<span class="n">${fmt(x.edits)} / ${fmt(x.n_revs)}</span></div>`).join('')}</div></div>`
  p.onclick = (e) => {
    const a = e.target.closest('[data-act]')
    if (a && a.dataset.act === 'list') { S.user = S.user === name ? null : name; closePop(); rescope(); if (S.sel != null) openPage(S.sel); return }
    const row = e.target.closest('[data-p]')
    if (row) {
      const pi = +row.dataset.p
      closePop()
      const r = rowOf.get(pi)
      if (r != null && !passes(r)) { clearFilters(); compute(); renderAll() }
      scrollListTo(rows.indexOf(r))
      S.picked = true
      openPage(pi)
    }
  }
}

// ---------------------------------------------------------------- render
// the range's overview first: the range thimble kept for the view, which it opens on, decides the rows
function renderAll() { if (!O) return; renderCtl(); if (renderRange()) compute(); renderCounts(); renderHist(); renderListHead(); renderList(); renderListStrip() }
// the open page, once the filters no longer keep it, gives way to the list's first page (or to none); true when it did
function dropGone() {
  if (S.sel == null || rows.some((r) => O.pages.p[r] === S.sel)) return false
  S.sel = null; S.picked = false; PG = null
  $('ph').innerHTML = ''; $('ps').innerHTML = ''; $('ps').setAttribute('height', 6)
  $('blocks').innerHTML = rows.length ? '' : '<div class="empty">No page meets these filters</div>'
  if (S.event == null && rows.length) openPage(O.pages.p[rows[0]])
  return true
}
function rescope() {
  if (!O) return
  compute(); $('list').scrollTop = 0; renderAll()
  if (dropGone()) return
  if (S.sel == null && S.event == null && rows.length) openPage(O.pages.p[rows[0]])
}
// Reset, in Color by's row: the username, the sort and the page picked go back to how the view opens (the
// first page of the list); the kit puts back the search field, the chips and the range itself
thimble.onReset({
  changed: () => S.user != null || S.sort !== 'n' || S.dir !== -1 || S.picked || S.pinfo || S.event != null,
  reset: () => {
    S.user = null; S.q = ''; S.sort = 'n'; S.dir = -1; $('sort').value = 'n:-1'
    S.picked = false; S.pinfo = false; S.event = null; S.sel = null; S.range = null
    if (!O) return
    compute(); $('list').scrollTop = 0; renderAll()
    if (rows.length) openPage(O.pages.p[rows[0]])
  },
})
let resizeT = null
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { renderAll(); if (PG) renderPageStrip() }, 100) })

// ---------------------------------------------------------------- places
// A page opens with its row in view; a revision, delete or request opens in its page's history, the filters that would
// hide it cleared; a username narrows the list to its pages; an event no page holds opens by itself.
let booted = null
function boot() {
  if (!booted) booted = (async () => { if (await loadOverview()) { compute(); renderAll() } })()
  return booted
}
async function openPlace(t) {
  closePop()
  if (t.user != null) {
    S.user = t.user
    compute(); renderAll()
    if (S.sel == null && rows.length) openPage(O.pages.p[rows[0]])
    return userPop(t.user, $('f-user'))
  }
  if (t.event != null) { compute(); renderAll(); return showEvent(t.event) }
  if (t.p != null && t.p >= 0) {
    const r = rowOf.get(t.p)
    if (r != null && !passes(r)) clearFilters()
    compute(); renderAll()
    if (r != null) scrollListTo(rows.indexOf(r))
    const focus = t.rev != null ? { rev: t.rev } : t.del != null ? { del: t.del } : t.req != null ? { req: t.req } : null
    S.picked = true
    return openPage(t.p, focus)

  }
  compute(); renderAll()
  if (S.sel == null && rows.length) openPage(O.pages.p[rows[0]])
}
let opened = false
function pageByKey(key) {
  if (!O || !key) return null
  const k = String(key).trim().toLowerCase()
  let best = null
  for (let r = 0; r < N; r++) {
    const id = `${O.wikis[O.pages.w[r]]}/${O.pages.name[r]}`.toLowerCase()
    if ((O.keys[r] || '').toLowerCase() === k || id === k || id.replace('/', '~') === k || LN[r] === k)
      if (best == null || O.pages.n[r] > O.pages.n[best]) best = r
  }
  return best == null ? null : O.pages.p[best]
}
thimble.onOpen(async (place) => {
  opened = true
  let t = (place && place.target) || {}
  if (t.p == null && t.event == null && t.user == null && place && place.key) {
    await boot()
    const p = pageByKey(place.key)
    if (p != null) t = { p }
  }
  if (t.p != null && t.p >= 0) S.keepPage = t.p
  await boot()
  if (!O) return
  if (t.p != null && t.p >= 0 && !rowOf.has(t.p)) { if (!(await loadOverview())) return }
  await openPlace(t)
})
thimble.onLabels(async (st) => {
  const was = JSON.stringify([labelState.labels, labelState.filter])
  labelState = { labels: st.labels || [], filter: st.filter || null, all: st.all || null, palette: st.palette || null }
  if (JSON.stringify([labelState.labels, labelState.filter]) === was) { if (O) { compute(); renderAll(); if (PG) { renderPageStrip(); rerenderBlocks() } } return }

  labelsV++
  if (!O) return
  if (!(await loadOverview())) return
  compute(); renderAll()
  if (!dropGone() && S.sel != null) openPage(S.sel, null, true)
})
boot().then(() => { if (!opened && O && S.sel == null && rows.length) openPage(O.pages.p[rows[0]]) })
</script>
