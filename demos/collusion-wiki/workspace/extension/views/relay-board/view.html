<!doctype html>
<html>
<head>
<style>
  /* thimble's parts (.field, .chip, .btn, .seg, .table, .avatar), its Colour by control and the theme's tokens come with
     the frame; this page lays out the control bar, the task table, the thread and the save beside it */
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--surface-card); color: var(--text-primary); font: 400 var(--text-ui-sm) / 1.4 var(--font-body);
    --add-bg: color-mix(in oklab, var(--status-positive) 13%, transparent); --rem-bg: color-mix(in oklab, var(--status-negative) 11%, transparent); }
  button { font: inherit; color: inherit; }
  .ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---- the control bar and the key */
  #bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px 6px; }
  .search { position: relative; flex: 0 1 220px; min-width: 130px; }
  .search .field { width: 100%; padding-left: 27px; box-sizing: border-box; }
  .search .ico { position: absolute; left: 8px; top: 50%; margin-top: -7px; color: var(--text-tertiary); pointer-events: none; }
  .fbtn { flex: none; padding: 0 7px 0 9px; }
  .fbtn .ico { width: 12px; height: 12px; color: var(--text-tertiary); }
  .fbtn .v { font-weight: 500; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .fbtn .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  #bar { border-bottom: 1px solid var(--border-hairline); padding-bottom: 8px; }
  #colour { min-width: 340px; }
  .sw { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }

  /* ---- the three panes */
  #main { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--famw, 560px) minmax(0, 1fr) var(--detw, 0px); grid-template-rows: minmax(0, 1fr); }
  #fams { grid-column: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; border-right: 1px solid var(--border-hairline); position: relative; }
  body.fm-hidden #fams { display: none; }
  #thread { grid-column: 2; min-width: 0; display: flex; flex-direction: column; }
  #det { grid-column: 3; min-width: 0; display: none; flex-direction: column; border-left: 1px solid var(--border-hairline); background: var(--surface-card); }
  body.det-open #det { display: flex; }

  /* the task table: one row per timed task, its strip its messages per hour on the axis the header draws */
  #ft { width: 100%; table-layout: fixed; border-collapse: collapse; }
  #ft th, #ft td { padding: 0 6px; height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ft th:first-child, #ft td:first-child { padding-left: 12px; }
  #ft th { height: 32px; vertical-align: bottom; padding-bottom: 4px; }
  #ft th.num, #ft td.num { text-align: right; }
  #ft td { cursor: pointer; font: 400 var(--text-mono-sm) / 1.2 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-primary); }
  #ft td.nm { font: 400 var(--text-ui-sm) / 1.2 var(--font-body); }
  #ft td.t { color: var(--text-secondary); }
  #ft td.st { padding: 0 8px 0 6px; overflow: visible; }
  #ft tr.fam:hover td { background: var(--surface-hover); }
  #ft tr.all td { height: 26px; border-bottom: 1px solid var(--border-strong); }
  #ft tr.all td.nm { font-weight: 600; }
  #ft tr.gap td { border-top: 1px solid var(--border-strong); }
  #ft tr.special td.nm { color: var(--text-secondary); }
  #ft tr.none td { color: var(--text-tertiary); }
  #ft tr.active td { background: var(--surface-selected); }
  #ft tr.active td.nm { font-weight: 600; color: var(--text-primary); }
  #ft th.st { padding: 0 8px 0 6px; overflow: visible; }
  #ft th.st svg { margin-bottom: -5px; }
  body.fm-compact #ft .wide { display: none; }
  body.fm-compact #ft tr.fam td { height: 17px; border-bottom: 0; }
  body.fm-compact #ft tr.fam.all td { height: 20px; }
  body.fm-compact #ft th { height: 30px; padding-bottom: 2px; line-height: 1; }
  body.fm-compact #ft td.nm { font-size: 12px; line-height: 15px; }
  body.fm-compact #ft td { line-height: 15px; }
  #ft tr.sub td { height: 12px; padding-bottom: 3px; color: var(--text-tertiary); font: 400 10.5px / 12px var(--font-body); }
  #ft tr.sub.all td { border-bottom: 1px solid var(--border-strong); }
  body.fm-compact .strip { height: 13px; }
  body.fm-compact tr.all .strip { height: 16px; }
  .strip { display: block; width: 100%; height: 14px; overflow: visible; touch-action: none; cursor: crosshair; }
  tr.all .strip { height: 19px; }
  #axis { display: block; width: 100%; height: 30px; overflow: visible; touch-action: none; cursor: crosshair; }
  svg text { font: 400 10px var(--font-mono); fill: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  svg text.day { fill: var(--text-secondary); }
  svg text.edge { font: 400 9.5px var(--font-body); fill: var(--text-secondary); }
  #ft th svg text { text-transform: none; letter-spacing: 0; }
  svg .tick { stroke: var(--border-strong); }
  svg .base { stroke: rgba(var(--ink-rgb), 0.14); }
  .edge { cursor: pointer; text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), 0.3); }
  #brush { position: absolute; display: none; pointer-events: none; background: rgba(var(--ink-rgb), 0.08); box-shadow: inset 1px 0 0 var(--text-primary), inset -1px 0 0 var(--text-primary); }

  /* the thread */
  #thead { flex: none; padding: 9px 16px 8px; border-bottom: 1px solid var(--border-hairline); }
  .th-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
  .th-title { flex: none; max-width: 60%; font: 600 var(--text-sm) / 1.3 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .th-stats { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.3 var(--font-mono); min-width: 0; }
  #famPick { flex: none; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; }
  .chips:empty { display: none; }
  .chip > .ico { width: 10px; height: 10px; }
  .btn .ico { width: 12px; height: 12px; }
  #msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 24px; outline: none; }
  .day { position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 8px; padding: 10px 16px 5px; background: var(--surface-card); border-bottom: 1px solid var(--border-hairline); font: 500 var(--text-ui-sm) / 1.3 var(--font-body); }
  .day .n { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .msg { content-visibility: auto; contain-intrinsic-size: auto var(--est, 80px); position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 10px; padding: 8px 16px 8px 14px; cursor: pointer; border-bottom: 1px solid rgba(var(--ink-rgb), 0.05); }
  .msg:hover { background: rgba(var(--ink-rgb), 0.035); }
  .msg.sel { background: var(--surface-selected); outline: 1px solid var(--border-strong); outline-offset: -1px; }
  .msg .avatar { margin-top: 1px; }
  .mh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; font-size: var(--text-xs); line-height: 1.35; color: var(--text-secondary); }
  .mh time { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.35 var(--font-mono); }
  .mh button { padding: 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .mh .who { font-weight: 600; font-size: var(--text-ui-sm); color: var(--text-primary); cursor: pointer; }
  .mh .who:hover, .mh .pg:hover { text-decoration: underline; text-underline-offset: 2px; }
  .mh .who.none { color: var(--text-tertiary); font-weight: 400; font-style: italic; }
  .mh .pg { color: var(--text-secondary); cursor: pointer; overflow-wrap: anywhere; }
  .mh .fam { color: var(--text-secondary); }
  .mh .kd { display: inline-flex; align-items: center; gap: 4px; color: var(--text-secondary); }
  .mh .kd .sw { width: 8px; height: 8px; }
  .mh .chip b { font-weight: 600; }
  .nw { white-space: nowrap; }
  .mh .lv { display: inline-flex; align-items: center; gap: 4px; color: var(--text-primary); }
  .mtx { margin-top: 3px; font: 400 var(--text-ui-sm) / 1.5 var(--font-body); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-primary); }
  .mtx.wait { height: var(--wait, 1.5em); border-radius: 3px; background: rgba(var(--ink-rgb), 0.05); }
  .more { margin-top: 2px; padding: 0; border: 0; background: none; color: var(--text-secondary); font: 400 var(--text-xs) / 1.4 var(--font-body); cursor: pointer; }
  .more:hover { color: var(--text-primary); text-decoration: underline; }
  .tok { padding: 0 2px; border-radius: 3px; background: rgba(var(--ink-rgb), 0.08); font-weight: 600; }
  .hit { border-radius: 2px; background: var(--hl-bg-strong); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 2px; }
  .sys { content-visibility: auto; contain-intrinsic-size: auto 26px; display: flex; align-items: baseline; gap: 8px; padding: 4px 16px 4px 50px; color: var(--text-secondary); font: 400 var(--text-xs) / 1.4 var(--font-body); cursor: pointer; }
  .sys time { font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  .sys:hover { color: var(--text-primary); }
  .sys.sel { background: var(--surface-selected); outline: 1px solid var(--border-strong); outline-offset: -1px; color: var(--text-primary); }
  .empty { padding: 32px 16px; color: var(--text-secondary); font-size: var(--text-xs); }
  .empty button { margin-left: 6px; }
  .earlier { padding: 10px 16px 2px; }

  /* the save beside the thread */
  .dh { flex: none; display: flex; align-items: flex-start; gap: 6px; padding: 10px 10px 8px 14px; border-bottom: 1px solid var(--border-hairline); }
  .dh-main { flex: 1; min-width: 0; }
  .dh-title { font: 600 var(--text-sm) / 1.3 var(--font-body); overflow-wrap: anywhere; cursor: pointer; }
  .dh-title:hover { text-decoration: underline; text-underline-offset: 2px; }
  .dh-sub { margin-top: 2px; color: var(--text-secondary); font-size: var(--text-xs); }
  .dh-sub .mono { color: var(--text-secondary); }
  .dh > .btn { flex: none; }
  .dacts { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 14px 0; }
  .facts { flex: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 3px 14px; margin: 0; padding: 8px 14px; border-bottom: 1px solid var(--border-hairline); }
  .fact { display: flex; align-items: baseline; gap: 8px; min-width: 0; margin: 0; }
  .fact dt { flex: none; width: 64px; color: var(--text-secondary); font-size: var(--text-xs); }
  .fact dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 var(--text-mono-sm) / 1.5 var(--font-mono); }
  .fact.wide { grid-column: 1 / -1; }
  .fact dd.wrap { white-space: normal; overflow-wrap: anywhere; font-family: var(--font-body); font-size: var(--text-xs); }
  .fact dd .addn { color: var(--status-positive); }
  .fact dd .remn { color: var(--status-negative); }
  .tabs { flex: none; padding: 8px 12px 6px; border-bottom: 1px solid var(--border-hairline); }
  .tabs .seg { flex-wrap: wrap; }
  .tabs .n { color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .dbody { flex: 1; min-height: 0; overflow: auto; padding: 8px 0 16px; }
  .body { margin: 0 12px; padding: 6px 0; border-radius: var(--radius-ui); box-shadow: inset 0 0 0 1px var(--border-hairline); font: 400 var(--text-mono-sm) / 1.55 var(--font-mono); }
  .bl { display: grid; grid-template-columns: 32px 14px minmax(0, 1fr); padding-right: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bl .ln { color: var(--text-tertiary); text-align: right; padding-right: 6px; user-select: none; }
  .bl .pl { user-select: none; font-weight: 600; }
  .bl.add { background: var(--add-bg); }
  .bl.add .pl { color: var(--status-positive); }
  .bl.rem { background: var(--rem-bg); }
  .bl.rem .pl { color: var(--status-negative); }
  .bhead { margin: 12px 14px 4px; font: 500 var(--text-xs) / 1.3 var(--font-body); color: var(--text-secondary); }
  .note { margin: 0 14px 8px; color: var(--text-secondary); font-size: var(--text-xs); }
  .lrow { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 2px 10px; padding: 5px 14px; cursor: pointer; font-size: var(--text-xs); }
  .lrow:hover { background: rgba(var(--ink-rgb), 0.04); }
  .lrow.cur { background: var(--surface-selected); }
  .lrow time { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.45 var(--font-mono); white-space: nowrap; }
  .lrow .w { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .lrow .w .sw { width: 8px; height: 8px; }
  .lrow .x { grid-column: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .x.dim { color: var(--text-tertiary); font-style: italic; }
  .lhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; padding: 10px 14px 3px; font: 500 var(--text-ui-sm) / 1.3 var(--font-body); }
  .lhead .t { min-width: 0; overflow-wrap: anywhere; }
  .lhead .n { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); white-space: nowrap; }
  .lhead .linkbtn { margin-left: auto; }

  /* popovers and the tip, above the coloured scrollbar the Colour by control lays over the thread */
  .pop { position: fixed; z-index: 2147482500; min-width: 200px; max-width: 320px; max-height: 72vh; overflow: auto; padding: 4px; border-radius: var(--radius-ui); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 10px 28px rgba(0, 0, 0, 0.18); font: 400 var(--text-ui-sm) / 1.3 var(--font-body); }
  .pop .head { padding: 8px 8px 4px; font: 500 var(--text-xs) / 1 var(--font-body); color: var(--text-secondary); }
  .pop .sep { height: 1px; margin: 4px 0; background: var(--border-hairline); }
  .pop .note { margin: 0; padding: 4px 8px 6px; }
  .pop .field.find { width: calc(100% - 8px); margin: 4px; box-sizing: border-box; }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: none; text-align: left; cursor: pointer; }
  .item:hover { background: var(--surface-hover); }
  .item.sub { padding-left: 30px; min-height: 26px; }
  .item.cur { background: var(--surface-selected); }
  .item .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .n { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1 var(--font-mono); }
  .item .act { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 4px; color: var(--text-secondary); }
  .item .act:hover { background: var(--track-bg); color: var(--text-primary); }
  .item .act .ico { width: 12px; height: 12px; }
  .item .tick-on { width: 13px; height: 13px; }
  .box { display: inline-grid; place-items: center; flex: none; width: 14px; height: 14px; box-sizing: border-box; border: 1.5px solid rgba(var(--ink-rgb), 0.4); border-radius: 3px; }
  .box.on { border-color: var(--text-primary); background: var(--text-primary); }
  .box.on::after { content: ''; width: 6px; height: 3px; margin-top: -2px; border: solid var(--surface-card); border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg); }
  .switch { position: relative; flex: none; width: 24px; height: 14px; border-radius: 7px; background: rgba(var(--ink-rgb), 0.22); }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface-card); transition: left 0.12s; }
  .switch.on { background: var(--text-primary); }
  .switch.on::after { left: 12px; }
  .range { display: grid; grid-template-columns: minmax(0, 1fr) 84px; align-items: center; gap: 6px; padding: 2px 8px 4px; }
  .range .field { width: 100%; }
  .pal { display: grid; grid-template-columns: repeat(6, 22px); gap: 4px; padding: 6px; }
  .pal button { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: var(--c); cursor: pointer; }
  .pal button.cur { box-shadow: 0 0 0 2px var(--surface-card), 0 0 0 3.5px var(--text-primary); }
  #tip { position: fixed; z-index: 2147482600; display: none; max-width: 260px; padding: 6px 8px; border-radius: var(--radius-ui); background: var(--raised-bg); box-shadow: var(--raised-ring), 0 8px 22px rgba(0, 0, 0, 0.18); pointer-events: none; font: 400 var(--text-xs) / 1.45 var(--font-body); color: var(--text-primary); }
  #tip .h { color: var(--text-secondary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); }
  #tip .r { display: flex; align-items: center; gap: 6px; }
  #tip .r .sw { width: 8px; height: 8px; }
</style>
</head>
<body>
<div id="bar">
  <label class="search"><svg class="ico" viewBox="0 0 24 24"><path d="M4 10.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M15.2 15.2L20 20"/></svg><input id="q" class="field" type="search" placeholder="Search the added text" autocomplete="off" spellcheck="false"></label>
  <button id="f-when" class="field fbtn" type="button" aria-haspopup="menu" aria-expanded="false"></button>
  <button id="f-user" class="field fbtn" type="button" aria-haspopup="menu" aria-expanded="false"></button>
  <span id="colour"></span>
</div>
<div id="main">
  <section id="fams"><table id="ft" class="table"><colgroup id="fcols"></colgroup><thead id="fh"></thead><tbody id="fb"></tbody></table><div id="brush"></div></section>
  <section id="thread"><div id="thead"></div><div id="msgs" tabindex="0"></div></section>
  <aside id="det"></aside>
</div>
<div id="tip"></div>
<script>
'use strict'
// Relay Board: every save of the wiki pages as the message it added, threaded by timed task. The table on the
// left counts each task's messages, pages and usernames in the filters, with a strip of its messages per hour on one
// shared axis, stacked by the values of what the Colour by control colours by; a drag on any strip picks a time window.
// The thread holds the chosen task's messages in time order, each with the colour's bar on its left edge and the
// thread's coloured scrollbar beside it, and a click opens the save beside it: the page at that save with the lines it
// added and removed, the page's other saves and the username's messages in every task. The bar searches the added
// text, picks days, hours and usernames, and holds the Colour by control: a message's kind, wiki or signature, or any
// label, each value a chip that turns its messages off or on.
// Labels: the reader keeps only the records the label filter keeps and hands each its marks, from which the page reads
// the value of the label coloured by; every message, in the thread and beside it, carries its line's ref as
// data-anchor, so thimble draws the label's bar.
const slug = (thimble.view && thimble.view.slug) || 'relay-board'
const HISTORY = 'wiki-page-history'
const MONTH = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const WEEKDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
const CHUNK = 120 // a thread longer than this opens at the axis's span, its earlier rows behind a button
const CLAMP = 12 // lines of a long message shown before it is opened
const AXIS_SHARE = 0.005 // the axis spans the days around the busiest that hold at least this share of its messages
const ICON = {
  down: 'M6 9l6 6 6-6', x: 'M6 6l12 12M18 6L6 18', check: 'M5 12.5l4.5 4.5L19 7',
  file: 'M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5',
  tag: 'M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9zM7.5 7.5h.01', plus: 'M12 5v14M5 12h14', edit: 'M4 20h4L19 9l-4-4L4 16zM14 6l4 4',
  clock: 'M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18zM12 7v5l3 2', user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
  hist: 'M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 8v4l3 2', filter: 'M4 5h16l-6 7v6l-4 2v-8z',
}
const ico = (n, c = 'ico') => `<svg class="${c}" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const num = (n) => Number(n).toLocaleString('en-US')
const plural = (n, one, many = one + 's') => `${num(n)} ${n === 1 ? one : many}`
const pad2 = (n) => String(n).padStart(2, '0')
const $ = (id) => document.getElementById(id)

// ---------------------------------------------------------------- time, in UTC
const dayKey = (t) => new Date(t * 1000).toISOString().slice(0, 10)
const midnight = (k) => Date.parse(k + 'T00:00:00Z') / 1000
const dm = (t) => { const d = new Date(t * 1000); return `${d.getUTCDate()} ${MONTH[d.getUTCMonth()]}` }
const hm = (t) => new Date(t * 1000).toISOString().slice(11, 16)
const hms = (t) => new Date(t * 1000).toISOString().slice(11, 19)
const dayName = (t) => { const d = new Date(t * 1000); return `${WEEKDAY[d.getUTCDay()]} ${d.getUTCDate()} ${MONTH[d.getUTCMonth()]}` }
const when = (t) => `${dm(t)} ${hm(t)}`

// ---------------------------------------------------------------- data
// The reader sends every save the label filter keeps as columns in one answer: dr and dt (its row and time, as steps
// from the row before), ln (its line), pg, u, tk, sg (indices into pages, users, tasks, signatures), na and nr (lines
// added and removed), k (its kind: 0 no new text, 1 Text, 2 Links) and mb (its marks as bits); the page adds r and t
// back, and m, its first mark.
const SENT = ['dr', 'dt', 'ln', 'pg', 'u', 'tk', 'sg', 'na', 'nr', 'k', 'mb']
let D = null, N = 0, C = {}, T = new Float64Array(0)
let rowAt = new Map()
let loadSeq = 0
let labelState = { labels: [], filter: null, all: null, palette: null }
const texts = new Map() // reader row -> [text, cut]

const S = {
  task: null, page: null, users: new Set(), win: null, q: '', found: null,
  open: null, detail: null, tab: 'page', keepRow: null, expanded: new Set(),
}
let loading = null

async function load() {
  const my = ++loadSeq
  const c = Object.fromEntries(SENT.map((k) => [k, []]))
  let first = null, from = 0
  do {
    const page = await thimble.fetch({ op: 'overview', from, ...(S.keepRow != null ? { keep: [S.keepRow] } : {}) })
    if (my !== loadSeq) return false
    if (!first) first = page
    for (const k of SENT) for (const v of page.cols[k] || []) c[k].push(v)
    from = page.next
  } while (from != null)
  D = first
  D.afterDelete = new Set(first.ad || [])
  N = c.ln.length
  C = Object.fromEntries(SENT.filter((k) => k !== 'dr' && k !== 'dt').map((k) => [k, Int32Array.from(c[k])]))
  C.r = new Int32Array(N); C.m = new Int32Array(N); T = new Float64Array(N)
  let r = -1, t = D.t0
  for (let i = 0; i < N; i++) {
    r += c.dr[i]; t += c.dt[i]
    C.r[i] = r; T[i] = t
    C.m[i] = C.mb[i] ? 31 - Math.clz32(C.mb[i] & -C.mb[i]) : -1
  }
  rowAt = new Map()
  for (let i = 0; i < N; i++) rowAt.set(C.r[i], i)
  taskName = D.tasks.map((f) => f[1])
  D.sig = labelSig(D.on || [], D.filter)
  return true
}
let taskName = []
const SPECIAL = () => [D.tasks.length - 2, D.tasks.length - 1] // Shared pages, No task in the name
const pageName = (p) => (D.pages[p] || [])[0] || ''
const pageId = (p) => (D.pages[p] || [])[4] || ''
const pageKey = (p) => (D.pages[p] || [])[5] || ''
const pageTask = (p) => (D.pages[p] || [])[1]
const userName = (u) => D.users[u] || ''
const refOf = (i) => `${D.path}#L${C.ln[i]}`
const isMsg = (i) => C.k[i] > 0
// whether save i meets every filter but those `skip` names (one name or a list of them); a message whose value the
// Colour by control turned off meets none
function passes(i, skip) {
  const sk = (k) => skip === k || (Array.isArray(skip) && skip.includes(k))
  if (isMsg(i)) { if (!sk('colour') && !colour.isOn(valOf(i))) return false }
  else if (S.page == null || C.pg[i] !== S.page || S.found) return false // a save without new text shows only in its page's thread
  if (S.found && !S.found.has(C.r[i])) return false
  if (!sk('user') && S.users.size && !S.users.has(C.u[i])) return false
  if (!sk('win') && S.win && (T[i] < S.win[0] || T[i] >= S.win[1])) return false
  if (!sk('task')) {
    if (S.page != null && C.pg[i] !== S.page) return false
    if (S.task != null && C.tk[i] !== S.task) return false
  }
  return true
}

// ---------------------------------------------------------------- the axis
// The strips share one axis: the unbroken run of days around the busiest day, each with at least AXIS_SHARE of that
// day's messages, or the window picked.
let AX = [0, 1]
let SPAN0 = [0, 1]
function computeSpan() {
  const per = new Map()
  let lo = Infinity, hi = -Infinity, total = 0
  for (let i = 0; i < N; i++) {
    if (!isMsg(i)) continue
    const d = Math.floor(T[i] / 86400)
    per.set(d, (per.get(d) || 0) + 1)
    lo = Math.min(lo, d); hi = Math.max(hi, d); total++
  }
  if (!total) { SPAN0 = [0, 86400]; return }
  let peak = lo
  for (const [d, n] of per) if (n > per.get(peak)) peak = d
  const min = per.get(peak) * AXIS_SHARE
  const best = [peak, peak]
  while ((per.get(best[0] - 1) || 0) >= min && best[0] - 1 >= lo) best[0]--
  while ((per.get(best[1] + 1) || 0) >= min && best[1] + 1 <= hi) best[1]++
  SPAN0 = [best[0] * 86400, (best[1] + 1) * 86400]
}
function axis() { AX = S.win ? [S.win[0], S.win[1]] : SPAN0 }
let stripW = 200
const binSize = (span) => [300, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400].find((b) => span / b <= Math.max(24, stripW / 2.5)) || 86400

// ---------------------------------------------------------------- colour
// thimble's Colour by control, in the bar: a message's kind, its page's wiki or its signature, or any label, in one
// menu; the values as chips that turn their messages off or on; the colour as a bar on each message's left edge and
// as the thread's scrollbar. Each field's value is worked out here from the columns the reader sent (the row index is
// the record the control is handed); a label's is the value of that label among the row's marks.
const SIGNED = ['Username', 'Another name', 'Unsigned'] // the added text signed with its username, with another name, or not
function sigOf(i) {
  const sg = D.sigs[C.sg[i]] || ''
  return !sg ? SIGNED[2] : sg.toLowerCase() === userName(C.u[i]).toLowerCase() ? SIGNED[0] : SIGNED[1]
}
const colour = thimble.colourBy({
  mount: '#colour',
  fields: [
    { name: 'kind', title: 'Kind', values: ['Text only', 'With links'], value: (i) => (isMsg(i) ? D.kinds[C.k[i]] : null) },
    { name: 'wiki', title: 'Wiki', values: ['dse', 'probier', 'fractal', 'dorfwiki'], value: (i) => (isMsg(i) ? D.wikis[(D.pages[C.pg[i]] || [])[3]] : null) },
    { name: 'signed', title: 'Signature', values: SIGNED, value: (i) => (isMsg(i) ? sigOf(i) : null) },
  ],
  chips: 'filter',
  strip: '#msgs',
  onChange: () => { if (D) render(true) },
})
// the value message i takes under the colour, null for none
function valOf(i) {
  if (!D) return null
  const lab = colour.label
  if (!lab) return colour.valueOf(i)
  const l = (labelState.all || labelState.labels || []).find((x) => x.id === lab)
  if (!l) return null
  for (let j = 0; j < D.marks.length; j++) if (C.mb[i] & (1 << j) && D.marks[j].label === l.name) return D.marks[j].value
  return null
}
// the strips' slots: the chips' values in their order, the messages with no value last
let SLOT = new Map(), SLOTS = []
const nSlots = () => SLOTS.length + 1
const slotOf = (i) => { const v = valOf(i); return v == null ? SLOTS.length : SLOT.has(v) ? SLOT.get(v) : SLOTS.length }
const slotColour = (j) => (j < SLOTS.length ? colour.colourOf(SLOTS[j]) || 'var(--label-none)' : 'var(--viz-ink-4)')
const slotName = (j) => (j < SLOTS.length ? SLOTS[j] : 'No value')

// ---------------------------------------------------------------- per task
let FAM = [], ALL = null
function computeFams() {
  const B = binSize(AX[1] - AX[0])
  const mk = () => ({ msgs: 0, pages: new Set(), users: new Set(), first: Infinity, last: -Infinity, bins: new Map(), before: 0, after: 0 })
  FAM = taskName.map(mk)
  ALL = mk()
  const ns = nSlots()
  for (let i = 0; i < N; i++) {
    if (!isMsg(i) || !passes(i, 'task')) continue
    for (const f of [FAM[C.tk[i]], ALL]) {
      f.msgs++; f.pages.add(C.pg[i]); if (C.u[i]) f.users.add(C.u[i]) // a save with no username counts toward no username
      if (T[i] < f.first) f.first = T[i]
      if (T[i] > f.last) f.last = T[i]
      if (T[i] < AX[0]) { f.before++; continue }
      if (T[i] >= AX[1]) { f.after++; continue }
      const b = Math.floor((T[i] - AX[0]) / B)
      let a = f.bins.get(b)
      if (!a) { a = new Int32Array(ns); f.bins.set(b, a) }
      a[slotOf(i)]++
    }
  }
  return B
}

// ---------------------------------------------------------------- popovers: one at a time, closed by a click outside or Escape
let openPop = null
function close() { if (openPop) { openPop.anchor.setAttribute('aria-expanded', 'false'); openPop.remove(); openPop = null } }
function pop(anchor, html, align = 'left') {
  close()
  const p = document.createElement('div')
  p.className = 'pop'
  p.setAttribute('role', 'menu')
  p.innerHTML = html
  document.body.appendChild(p)
  place(p, anchor, align)
  p.anchor = anchor
  anchor.setAttribute('aria-expanded', 'true')
  openPop = p
  return p
}
function place(p, anchor, align) {
  const r = anchor.getBoundingClientRect(), w = p.offsetWidth
  p.style.top = Math.max(6, Math.min(r.bottom + 4, innerHeight - p.offsetHeight - 6)) + 'px'
  p.style.left = Math.max(6, Math.min(innerWidth - w - 6, align === 'right' ? r.right - w : r.left)) + 'px'
}
document.addEventListener('mousedown', (e) => { if (openPop && !openPop.contains(e.target) && !openPop.anchor.contains(e.target)) close() })
const toggled = (anchor) => (openPop && openPop.anchor === anchor ? (close(), true) : false)

// ---------------------------------------------------------------- the bar and the colour's counts
function renderBar() {
  const w = $('f-when')
  w.classList.toggle('active', !!S.win)
  w.innerHTML = `${ico('clock')}${S.win ? `<span class="v">${winText(S.win)}</span>` : 'When'}${ico('down')}`
  const u = $('f-user')
  u.classList.toggle('active', S.users.size > 0)
  u.innerHTML = `${ico('user')}${S.users.size === 1 ? `<span class="v">${esc(userName([...S.users][0]) || 'no username')}</span>` : S.users.size ? `Usernames <span class="n">${S.users.size}</span>` : 'Username'}${ico('down')}`
  renderColour()
}
function winText(w) {
  const a = w[0], b = w[1] - 1
  return dayKey(a) === dayKey(b) ? `${dm(a)} ${hm(a)}–${hm(w[1]) === '00:00' ? '24:00' : hm(w[1])}` : `${when(a)} – ${dm(b)} ${hm(w[1]) === '00:00' ? '24:00' : hm(w[1])}`
}
// the chips' counts: the messages of every task in the other filters that take each value, as the table's first row
// counts them, a value turned off counted too; then the strips' slots in the chips' order
let curBin = 3600
function renderColour() {
  if (!D) return
  const counts = {}
  for (let i = 0; i < N; i++) {
    if (!isMsg(i) || !passes(i, ['colour', 'task'])) continue
    const v = valOf(i), k = v == null ? '' : v
    counts[k] = (counts[k] || 0) + 1
  }
  colour.counts(counts)
  SLOTS = colour.values.map((x) => x.value).filter((v) => v != null)
  SLOT = new Map(SLOTS.map((v, j) => [v, j]))
}

// when: whole days, or a window from a day and hour to another
$('f-when').onclick = () => whenMenu()
function whenMenu() {
  const b = $('f-when')
  if (toggled(b)) return
  const per = new Map()
  for (let i = 0; i < N; i++) if (isMsg(i) && passes(i, 'win')) { const k = dayKey(T[i]); per.set(k, (per.get(k) || 0) + 1) }
  const days = [...per.keys()].sort()
  if (!days.length) return
  const a = S.win ? S.win[0] : SPAN0[0], z = S.win ? S.win[1] : SPAN0[1]
  const dayOpts = (sel) => days.map((d) => `<option value="${d}"${d === sel ? ' selected' : ''}>${dayName(midnight(d))}</option>`).join('')
  const hourOpts = (sel, end) => Array.from({ length: 24 }, (_, h) => h + (end ? 1 : 0)).map((h) => `<option value="${h}"${h === sel ? ' selected' : ''}>${pad2(h)}:00</option>`).join('')
  const zd = dayKey(z - 1), zh = Math.round((z - midnight(zd)) / 3600)
  const html = `<div class="head">From</div><div class="range"><select class="field" id="w-ad">${dayOpts(dayKey(a))}</select><select class="field" id="w-ah">${hourOpts(Math.floor((a - midnight(dayKey(a))) / 3600))}</select></div>
    <div class="head">To</div><div class="range"><select class="field" id="w-zd">${dayOpts(zd)}</select><select class="field" id="w-zh">${hourOpts(zh, true)}</select></div>
    <div class="sep"></div><div class="head">Days, with their messages</div>${days.map((d) => `<button class="item${S.win && S.win[0] === midnight(d) && S.win[1] === midnight(d) + 86400 ? ' cur' : ''}" data-day="${d}" type="button"><span class="lab">${dayName(midnight(d))}</span><span class="n">${num(per.get(d))}</span></button>`).join('')}
    ${S.win ? '<div class="sep"></div><button class="item" data-clear type="button"><span class="lab">Every day</span></button>' : ''}`
  const p = pop(b, html)
  const apply = () => {
    const from = midnight(p.querySelector('#w-ad').value) + 3600 * +p.querySelector('#w-ah').value
    const to = midnight(p.querySelector('#w-zd').value) + 3600 * +p.querySelector('#w-zh').value
    if (to > from) setWin([from, to])
  }
  for (const s of p.querySelectorAll('select')) s.onchange = apply
  p.onclick = (ev) => {
    const d = ev.target.closest('[data-day]')
    if (d) { setWin([midnight(d.dataset.day), midnight(d.dataset.day) + 86400]); close(); return }
    if (ev.target.closest('[data-clear]')) { setWin(null); close() }
  }
}
function setWin(w) { S.win = w; rescope() }

// usernames: the most active in the filters, narrowed by typing
$('f-user').onclick = () => userMenu()
function userMenu(find = '') {
  const b = $('f-user')
  if (!find && toggled(b)) return
  const per = new Map()
  for (let i = 0; i < N; i++) if (isMsg(i) && passes(i, 'user')) per.set(C.u[i], (per.get(C.u[i]) || 0) + 1)
  for (const u of S.users) if (!per.has(u)) per.set(u, 0)
  const draw = (q) => {
    const ql = q.toLowerCase()
    const list = [...per].filter(([u]) => !ql || userName(u).toLowerCase().includes(ql)).sort((x, y) => S.users.has(y[0]) - S.users.has(x[0]) || y[1] - x[1])
    return `<div class="head">Usernames, with their messages here</div>` + list.slice(0, 120).map(([u, n]) => `<button class="item" data-u="${u}" type="button"><span class="box${S.users.has(u) ? ' on' : ''}"></span><span class="lab">${esc(userName(u) || 'no username')}</span><span class="n">${num(n)}</span></button>`).join('')
      + (list.length > 120 ? `<div class="note">${num(list.length - 120)} more: type to find one</div>` : '') + (S.users.size ? '<div class="sep"></div><button class="item" data-clear type="button"><span class="lab">Every username</span></button>' : '')
  }
  const p = pop(b, `<input class="field find" placeholder="Find a username" value="${esc(find)}" spellcheck="false"><div class="ul">${draw(find)}</div>`)
  const inp = p.querySelector('input')
  inp.focus()
  inp.oninput = () => { p.querySelector('.ul').innerHTML = draw(inp.value) }
  p.onclick = (ev) => {
    if (ev.target.closest('[data-clear]')) { S.users.clear(); close(); rescope(); return }
    const it = ev.target.closest('[data-u]')
    if (!it) return
    const u = +it.dataset.u
    S.users.has(u) ? S.users.delete(u) : S.users.add(u)
    it.querySelector('.box').classList.toggle('on')
    rescope(true)
  }
}

// ---------------------------------------------------------------- layout
// The table shows every column while there is room, only the name, messages and strip when the save is open beside a
// narrow pane, and folds into the thread's title when there is no room for it at all.
function layout() {
  const W = document.body.clientWidth, open = S.open != null
  const mode = !open ? (W >= 1000 ? 'full' : 'compact') : W >= 1600 ? 'full' : W >= 1000 ? 'compact' : 'hidden'
  document.body.classList.toggle('fm-full', mode === 'full')
  document.body.classList.toggle('fm-compact', mode === 'compact')
  document.body.classList.toggle('fm-hidden', mode === 'hidden')
  document.body.classList.toggle('det-open', open)
  const famw = mode === 'full' ? Math.round(Math.min(660, Math.max(560, W * 0.56))) : mode === 'compact' ? Math.round(Math.min(340, Math.max(300, W * 0.3))) : 0
  const detw = open ? Math.round(Math.min(520, Math.max(340, W * (mode === 'hidden' ? 0.48 : 0.36)))) : 0
  const main = $('main')
  main.style.setProperty('--famw', famw + 'px')
  main.style.setProperty('--detw', detw + 'px')
  return mode
}

// ---------------------------------------------------------------- the task table
function renderFams() {
  const mode = layout()
  renderColour()
  if (mode === 'hidden') return
  const cols = mode === 'full'
    ? '<col style="width:140px"><col style="width:60px"><col style="width:52px"><col style="width:80px"><col>'
    : '<col style="width:124px"><col style="width:56px"><col>'
  $('fcols').innerHTML = cols
  const wide = (h) => (mode === 'full' ? h : '')
  $('fh').innerHTML = `<tr><th>Task</th><th class="num" title="Messages: saves that added text">Msgs</th>${wide('<th class="num" title="Pages with a message">Pages</th><th class="num" title="Usernames with a message; a save with no username counts toward none">Usernames</th>')}<th class="st"><svg id="axis"></svg></th></tr>`
  axis(); computeFams()
  const [shared, other] = SPECIAL()
  const order = taskName.map((_, f) => f).filter((f) => f !== shared && f !== other).sort((a, b) => FAM[b].msgs - FAM[a].msgs)
  const act = (f) => ((f === -1 ? S.task == null && S.page == null : S.task === f) ? ' active' : '')
  const row = (f, cls, name, anchor) => `<tr class="fam ${cls}${act(f)}" data-f="${f}"${anchor}><td class="nm" title="${esc(name)}">${esc(name)}</td><td class="num" data-k="msgs"></td>${wide('<td class="num" data-k="pages"></td><td class="num" data-k="users"></td>')}<td class="st"><svg class="strip" data-f="${f}"></svg></td></tr>`
    + (mode === 'full' ? '' : `<tr class="sub ${cls}${act(f)}" data-f="${f}"${anchor}><td colspan="3" data-k="sub"></td></tr>`)
  const anchorOf = (f) => ` data-anchor="view:${slug}/${esc(D.tasks[f][0])}" data-anchor-text="${esc(taskName[f])}: ${plural(FAM[f].msgs, 'message')}"`
  let h = row(-1, 'all', 'All messages', '')
  for (const f of order) h += row(f, '', taskName[f], anchorOf(f))
  h += row(shared, 'special gap', taskName[shared], anchorOf(shared))
  h += row(other, 'special', taskName[other], anchorOf(other))
  $('fb').innerHTML = h
  const svgs = $('fb').querySelectorAll('svg.strip')
  stripW = Math.max(40, (svgs[0] && svgs[0].getBoundingClientRect().width) || 200)
  const B = computeFams() // again, with the bins the strip's width takes
  curBin = B
  for (const tr of $('fb').querySelectorAll('tr[data-f]')) {
    const f = +tr.dataset.f, x = f === -1 ? ALL : FAM[f]
    tr.title = x.msgs ? `${plural(x.msgs, 'message')} on ${plural(x.pages.size, 'page')} by ${plural(x.users.size, 'username')}, ${when(x.first)} – ${when(x.last)} UTC` : ''
    tr.classList.toggle('none', !x.msgs)
    for (const td of tr.querySelectorAll('[data-k]')) td.textContent = cell(x, td.dataset.k)
  }
  drawAxis()
  const hs = mode === 'full' ? [19, 14] : [16, 13]
  // the tasks' strips on one scale, the two rows of pages with no task on another, All tasks on its own
  const taskMax = Math.max(1, ...order.map((f) => peak(FAM[f]))), specialMax = Math.max(1, peak(FAM[shared]), peak(FAM[other]))
  scaleOf = (f) => (f === -1 ? peak(ALL) : f === shared || f === other ? specialMax : taskMax)
  for (const sv of svgs) { const f = +sv.dataset.f; drawStrip(sv, f === -1 ? ALL : FAM[f], B, f === -1 ? hs[0] : hs[1], scaleOf(f)) }
}
const span = (x) => (dayKey(x.first) === dayKey(x.last) ? `${when(x.first)}–${hm(x.last)}` : `${when(x.first)} – ${when(x.last)}`)
const cell = (x, k) => k === 'sub' ? (x.msgs ? `${plural(x.pages.size, 'page')} · ${plural(x.users.size, 'username')} · ${dayKey(x.first) === dayKey(x.last) ? dm(x.first) : `${dm(x.first)} – ${dm(x.last)}`}` : '') : k === 'pages' ? num(x.pages.size) : k === 'msgs' ? num(x.msgs) : k === 'users' ? num(x.users.size) : !x.msgs ? '' : when(k === 'first' ? x.first : x.last)
let scaleOf = () => 1
function peak(x) { let max = 1; for (const a of x.bins.values()) { let n = 0; for (const v of a) n += v; if (n > max) max = n } return max }
function drawStrip(svg, x, B, h, max) {
  const w = stripW, sp = AX[1] - AX[0], nb = Math.ceil(sp / B), bw = w / nb
  const ns = nSlots()
  const paths = Array.from({ length: ns }, () => '')
  // a bar's height is the square root of its share of the scale, so that a task with few messages still shows beside
  // the busiest; its kinds (or label values) split the bar by their counts
  for (const [b, a] of x.bins) {
    let y = h
    const x0 = (b * bw).toFixed(2), ww = Math.max(0.8, bw - (bw > 3 ? 0.6 : 0)).toFixed(2)
    let tot = 0
    for (const v of a) tot += v
    const full = Math.max(1, Math.sqrt(Math.min(1, tot / max)) * (h - 1))
    for (let j = 0; j < ns; j++) {
      if (!a[j]) continue
      const hh = Math.max(0.6, (a[j] / tot) * full)
      y -= hh
      paths[j] += `M${x0} ${y.toFixed(2)}h${ww}v${hh.toFixed(2)}h-${ww}z`
    }
  }
  let s = `<line class="base" x1="0" x2="${w}" y1="${h - 0.5}" y2="${h - 0.5}"/>`
  for (let j = ns - 1; j >= 0; j--) if (paths[j]) s += `<path d="${paths[j]}" fill="${esc(slotColour(j))}"/>`
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`)
  svg.setAttribute('height', h)
  svg.innerHTML = s
}
// day (or hour) labels on one line, with the messages before and after the span at its ends; a label that would run
// into another is left out
function drawAxis() {
  const svg = $('axis'), w = stripW, h = 30, y = 22, sp = AX[1] - AX[0], cw = 6.4
  const X = (t) => ((t - AX[0]) / sp) * w
  const taken = []
  const free = (a, b) => taken.every(([p, q]) => b + 7 <= p || a >= q + 7)
  let s = ''
  const pre = `‹ ${num(ALL.before)} before`, post = `${num(ALL.after)} after ›`

}
const pageRows = (i) => { const out = []; for (let j = 0; j < N; j++) if (C.pg[j] === C.pg[i]) out.push(j); return out }
const userRows = (i) => { const out = []; if (!C.u[i]) return out; for (let j = 0; j < N; j++) if (C.u[j] === C.u[i] && isMsg(j)) out.push(j); return out }
function lrow(j, i, withPage) {
  const r = C.r[j], [t] = texts.get(r) || ['']
  const msg = isMsg(j)
  const first = msg ? (t.split('\n').find((s) => s.trim()) || '') : C.nr[j] ? `removed ${plural(C.nr[j], 'line')}, no new text` : 'no new text'
  return `<div class="lrow${j === i ? ' cur' : ''}" data-go="${r}" data-anchor="${esc(refOf(j))}" data-anchor-text="${esc(t || first)}"${msg ? colour.attr(j) : ''}><time>${dm(T[j])} ${hm(T[j])}</time><span class="w">${esc(withPage ? pageName(C.pg[j]) : userName(C.u[j]) || 'no username')}</span><span class="x${msg ? '' : ' dim'}">${msg ? marked(first, true) : esc(first)}</span></div>`
}
function renderDetail() {
  const box = $('det'), r = S.open
  if (r == null || !rowAt.has(r)) { box.innerHTML = ''; return }
  const i = rowAt.get(r), d = S.detail && S.detail.row === r ? S.detail : null
  const u = userName(C.u[i]), ref = refOf(i)
  const prows = pageRows(i), urows = userRows(i)
  const tabs = [['page', 'Page then', ''], ['pagemsgs', 'Page’s saves', num(prows.length)], ['user', 'Username’s messages', num(urows.length)]]
  const fact = (k, v, cls = '', html = null) => `<div class="fact${cls.includes('wide') ? ' wide' : ''}"><dt>${k}</dt><dd class="${cls}" title="${esc(v)}">${html != null ? html : esc(v ?? '—')}</dd></div>`
  let facts = ''
  if (d) {
    const sig = d.signature ? (d.signature.toLowerCase() === String(d.label || '').toLowerCase() ? `${d.signature} (the username)` : `${d.signature} (not the username)`) : ''
    facts = fact('rev_id', d.rev_id, 'wide') + fact('seq', d.seq) + fact('ip16', d.ip16) + fact('body_len', d.body_len)
      + fact('lines', `+${d.n_added} −${d.n_removed}`, '', `<span class="addn">+${num(d.n_added)}</span> <span class="remn">−${num(d.n_removed)}</span>`)
      + fact('kind', d.kind) + fact('summary', d.change_summary == null ? '—' : d.change_summary, 'wide wrap')
      + (sig ? fact('signed', sig, 'wide wrap') : '')
  }
  let body = '<div class="note">Reading the save</div>'
  if (d && S.tab === 'page') {
    const add = new Set(d.added_lines || [])
    const lines = (d.body || '').split('\n')
    body = (d.earlier_lost ? '<div class="note">The file holds no earlier save of this page, so every line counts as added</div>' : d.before_row == null ? '<div class="note">The page’s first save: every line is added</div>' : d.after_delete ? '<div class="note">The page was deleted before this save, so the wiki started it again and every line counts as added</div>' : '')
      + `<div class="body">${d.body ? lines.map((s, k) => `<div class="bl${add.has(k) ? ' add' : ''}"><span class="ln">${k + 1}</span><span class="pl">${add.has(k) ? '+' : ''}</span><span>${marked(s) || ' '}</span></div>`).join('') : '<div class="note">The page is empty</div>'}</div>`
      + ((d.removed_lines || []).length ? `<div class="bhead">Removed by this save · ${plural(d.n_removed, 'line')}</div><div class="body">${d.removed_lines.map((s) => `<div class="bl rem"><span class="ln"></span><span class="pl">−</span><span>${esc(s) || ' '}</span></div>`).join('')}${d.removed_more ? `<div class="note">and ${plural(d.removed_more, 'more line')}</div>` : ''}</div>` : '')
  } else if (S.tab === 'pagemsgs') {
    body = `<div class="lhead"><span class="t">${esc(pageName(C.pg[i]))}</span><span class="n">${plural(prows.filter(isMsg).length, 'message')} in ${plural(prows.length, 'save')}</span><button class="btn btn-ghost btn-sm linkbtn" type="button" data-narrow="${C.pg[i]}">${ico('filter')}Show in the thread</button></div>` + prows.map((j) => lrow(j, i, false)).join('')
  } else if (S.tab === 'user') {
    const byFam = new Map()
    for (const j of urows) { const f = C.tk[j]; if (!byFam.has(f)) byFam.set(f, []); byFam.get(f).push(j) }
    body = u ? `<div class="lhead"><span class="t">${esc(u)}</span><span class="n">${plural(urows.length, 'message')}</span><button class="btn btn-ghost btn-sm linkbtn" type="button" data-only="${C.u[i]}">${ico('filter')}Only this username</button></div>` + [...byFam].sort((a, b) => b[1].length - a[1].length).map(([f, js]) => `<div class="lhead">${esc(taskName[f])}<span class="n">${num(js.length)}</span></div>${js.map((j) => lrow(j, i, true)).join('')}`).join('') : '<div class="note">This save has no username</div>'
  }
  const keepTop = box.querySelector('.dbody') ? box.querySelector('.dbody').scrollTop : 0
  box.innerHTML = `<div class="dh" data-anchor="${esc(ref)}" data-anchor-text="${esc((texts.get(r) || [''])[0])}"><div class="dh-main"><div class="dh-title" data-pg="${C.pg[i]}" data-thimble-chrome title="Show this page's messages in the thread">${esc(pageName(C.pg[i]))}</div><div class="dh-sub" data-thimble-chrome>${esc(taskName[C.tk[i]])} · ${esc(u || 'no username')} · <span class="mono nw">${dayName(T[i])} ${hms(T[i])} UTC</span></div></div><button class="btn btn-ghost btn-sm" type="button" data-close aria-label="Close">${ico('x')}</button></div>`
    + `<div class="dacts"><button class="chip chip-tone-evidence chip-act" type="button" data-file="${esc(ref)}" title="Open the line in the File browser">${ico('file')}Line ${C.ln[i]}</button><button class="chip chip-sans chip-act" type="button" data-history="${esc(pageId(C.pg[i]) + (d && d.seq != null ? `@${d.seq}` : ''))}" title="Open this save in its page's history in Wiki Page History">${ico('hist')}Page history</button></div>`
    + `<dl class="facts">${facts}</dl>`
    + `<div class="tabs"><div class="seg seg-track" role="tablist">${tabs.map(([k, t, n]) => `<button class="seg-opt${S.tab === k ? ' active' : ''}" data-tab="${k}" type="button" role="tab" aria-selected="${S.tab === k}">${t}${n ? ` <span class="n">${n}</span>` : ''}</button>`).join('')}</div></div>`
    + `<div class="dbody">${body}</div>`
  const db = box.querySelector('.dbody'), firstAdd = db.querySelector('.bl.add')
  if (d && S.tab === 'page' && firstAdd && S.scrolled !== r) { S.scrolled = r; db.scrollTop = Math.max(0, firstAdd.getBoundingClientRect().top - db.getBoundingClientRect().top + db.scrollTop - 40) }
  else if (S.scrolled === r && S.tabWas === S.tab) db.scrollTop = keepTop
  S.tabWas = S.tab
}
$('det').addEventListener('click', (ev) => {
  if (ev.target.closest('[data-close]')) return closeDetail()
  const tb = ev.target.closest('[data-tab]')
  if (tb) { S.tab = tb.dataset.tab; renderDetail(); return }
  const fc = ev.target.closest('[data-file]')
  if (fc) return thimble.navigate(fc.dataset.file, { browser: true })
  const hb = ev.target.closest('[data-history]')
  if (hb) return thimble.navigate(`view:${HISTORY}/${hb.dataset.history}`)
  const nr = ev.target.closest('[data-narrow]')
  if (nr) return narrowPage(+nr.dataset.narrow)
  const on = ev.target.closest('[data-only]')
  if (on) { S.users = new Set([+on.dataset.only]); S.task = null; S.page = null; return rescope() }
  const pg = ev.target.closest('[data-pg]')
  if (pg) return narrowPage(+pg.dataset.pg)
  const go = ev.target.closest('[data-go]')
  if (go) return goTo(+go.dataset.go)
})
// open another save: in the thread when the filters show it, else beside the thread as it is
async function goTo(r, block = 'center') {
  const i = rowAt.get(r)
  if (i == null) return
  const k = thread.indexOf(i)
  if (k >= 0 && k < first) await showEarlier()
  pick(r, true, block)
}

// ---------------------------------------------------------------- render
function render(keepScroll) {
  if (!D) return Promise.resolve()
  if (S.open != null && !rowAt.has(S.open)) { S.open = null; S.detail = null }
  axis()
  computeThread()
  renderBar()
  renderFams()
  renderHead()
  renderDetail()
  return renderThread(keepScroll)
}
function rescope(keepScroll) { return render(keepScroll) }
let typing = null
$('q').addEventListener('input', (e) => {
  clearTimeout(typing)
  typing = setTimeout(async () => {
    const q = e.target.value.trim()
    S.q = q
    if (!q) S.found = null
    else {
      let res
      try { res = await thimble.fetch({ op: 'search', q }, { key: 'search' }) } catch (err) { return }
      if (S.q !== q) return
      S.found = new Set(res.rows)
    }
    rescope()
  }, 220)
})
let resizeTimer = null
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (D) { renderBar(); renderFams(); renderHead() } }, 120) })

// ---------------------------------------------------------------- places
// A save opens in its task's thread, the filters that would hide it cleared, with the page at that save beside it; a
// task opens its thread; a page opens its messages.
function clearFilters() { S.page = null; S.users.clear(); S.win = null; S.q = ''; S.found = null; $('q').value = '' }
async function openPlace(t) {
  if (t.r != null && rowAt.has(t.r)) {
    const i = rowAt.get(t.r)
    clearFilters()
    S.task = C.tk[i]
    if (!isMsg(i)) S.page = C.pg[i]
    S.open = t.r
    await render()
    await goTo(t.r)
    return
  }
  if (t.task) {
    const f = D.tasks.findIndex((x) => x[0] === t.task)
    clearFilters()
    S.task = f >= 0 ? f : null
    return render()
  }
  if (t.page) {
    const p = D.pages.findIndex((x) => x[5] === t.page || x[4] === t.page)
    clearFilters()
    if (p >= 0) { S.page = p; S.task = pageTask(p) }
    return render()
  }
  if (S.task == null && S.page == null && !S.users.size && !S.win && !S.q) S.task = firstTask()
  render()
}
// with no place to open, the board opens on the task with the most messages, so its thread shows relay messages first
function firstTask() {
  const per = new Map(), [shared, other] = SPECIAL()
  for (let i = 0; i < N; i++) if (isMsg(i) && C.tk[i] !== shared && C.tk[i] !== other) per.set(C.tk[i], (per.get(C.tk[i]) || 0) + 1)
  let best = null
  for (const [f, n] of per) if (best == null || n > per.get(best)) best = f
  return best
}
loading = load().then((ok) => { if (ok) { computeSpan(); if (!opened) { S.task = firstTask(); render() } } return ok })
let opened = false
thimble.onOpen(async (place) => {
  const t = (place && place.target) || {}
  opened = true
  if (t.r != null && S.keepRow !== t.r) {
    S.keepRow = t.r
    if (D && !rowAt.has(t.r)) { await load(); computeSpan() }
  }
  if (!D) { await loading; if (!D) { await load(); computeSpan() } }
  if (!D) return
  if (t.r != null && !rowAt.has(t.r)) { await load(); computeSpan() }
  await openPlace(t)
})
// what the reader's marks and filter answered for: the names of the labels on, and the filter
const labelSig = (names, f) => JSON.stringify([[...names].sort(), f ? [f.label, f.value] : null])
thimble.onLabels(async (state) => {
  labelState = { labels: state.labels || [], filter: state.filter || null, all: state.all || null, palette: state.palette || null }
  if (!D) return
  if (labelSig(labelState.labels.map((l) => l.name), labelState.filter) === D.sig) { renderBar(); renderFams(); if (S.open != null) renderDetail(); return } // colours only
  if (!(await load())) return
  computeSpan()
  if (S.open != null && !rowAt.has(S.open)) { S.open = null; S.detail = null }
  render(true)
})
</script>
