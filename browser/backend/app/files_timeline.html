<!doctype html>
<html>
<head>
<style>
  /* the File browser's Timeline mode (source_events.py): the view kit's parts laid out as the worked example
     plugin/viewers/timeline lays them out, for any file whose records carry a time */
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-card); overflow: hidden; }
  * { box-sizing: border-box; }
  #view { height: 100%; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 12px 16px 10px; border-bottom: 1px solid var(--border-subtle); }
  .top:empty { display: none; }
  #search { flex: 0 1 260px; min-width: 200px; }
  #color { min-width: min(300px, 100%); max-width: 100%; }
  /* the overview: the readout, the range and its axis over the lanes, one column of time with the lanes' names in its
     gutter; the time stays put while the lanes scroll under it, and the divider under it sets its height */
  #overview { flex: none; max-height: 46%; overflow: hidden auto; }
  .time { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 112px minmax(0, 1fr); padding: 8px 16px 0; background: var(--surface-card); }
  #read { flex-direction: row; gap: 10px; margin-bottom: 4px; }
  #key { align-self: center; }
  #lanes { padding: 2px 16px 8px; }
  /* the list: what it shows named over the table, and the side panel at its right */
  #body { flex: 1; min-height: 0; border-top: 1px solid var(--border-hairline); }
  .listbox { display: flex; flex-direction: column; min-height: 0; height: 100%; }
  .lhead { flex: none; display: flex; align-items: baseline; gap: 8px; min-width: 0; padding: 8px 16px 4px; }
  .lhead b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 var(--text-sm) / 1.4 var(--font-body); }
  .lhead span { flex: none; color: var(--text-tertiary); font: 400 var(--text-mono-sm) / 1.4 var(--font-mono); font-variant-numeric: tabular-nums; }
  .lhead .btn { flex: none; margin-left: auto; }
  #list { flex: 1; min-height: 0; }
  .empty { padding: 24px 16px; color: var(--text-tertiary); font: 400 var(--text-sm) / 1.5 var(--font-body); }
</style>
</head>
<body>
<div id="view">
  <div class="top">
    <span id="search"></span>
    <span id="filter"></span>
    <span id="rows"></span>
    <span id="color"></span>
  </div>
  <div id="overview">
    <div class="time">
      <div></div><div id="read"></div>
      <div></div><div id="range"></div>
      <div id="key"></div><div id="axis"></div>
    </div>
    <div id="lanes"></div>
  </div>
  <div id="body">
    <div class="listbox">
      <div class="lhead" id="lhead" data-thimble-chrome></div>
      <div id="list"></div>
    </div>
  </div>
</div>
<script>
// The File browser's Timeline mode: a file's records on one time axis. The reader sends every record that has a time
// (GET /source/events), each with its values of the keys that name a kind or a who, which Filter by, Rows and Color by
// offer; the time range's viewfinder picks the time the lanes and the table show, and a record opens in the side panel
// with its fields, read whole when it opens.
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const $ = (id) => document.getElementById(id)
let E = [] // the records with a time, in time order: {ref, line, t, text, v}
let span = null
let shown = [] // the table's records: those Filter by keeps, in the range and in the lane chosen
let picked = null // the lane chosen, whose records the table shows: {key, value, name}
let info = null // what the reader said of the file: its time key, how many records it placed and left out
let parts = null
let markLoaded
const loaded = new Promise((ok) => (markLoaded = ok))
const plural = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : many}`

function build(keys, initial) {
  // each key the reader found is a field of Filter by, Rows and Color by, its value the record's in `v`
  const FIELDS = keys.map((k, i) => ({ name: k.key, title: k.key, value: (e) => e.v[i] }))
  const search = thimble.search({ mount: '#search', in: '#body', placeholder: 'Search records' })
  const color = thimble.colorBy({ mount: '#color', fields: FIELDS, initial: initial.color || '', strip: '#list', onChange: draw })
  const filter = thimble.filterBy({ mount: '#filter', fields: FIELDS, onChange: draw })
  const rows = thimble.rows({ mount: '#rows', fields: FIELDS, initial: initial.rows || undefined, onChange: () => { pick(null); draw() } })
  const range = thimble.timeRange({ mount: '#range', readout: '#read', onChange: draw })
  const lanes = thimble.timeline({
    mount: '#lanes', keyMount: '#key', rows, range, names: 112, follow: '#list',
    tip: (e) => `${e.line ? `L${e.line} · ` : ''}${e.text}`,
    onPick: (lane) => pick(picked && picked.key === lane.key ? null : lane),
    onMark: (e) => show(e, true),
  })
  const side = thimble.side({ mount: '#body' })
  // the records as a table: the time (the date on a day's first record), the keys the reader found, which a narrow
  // table drops first, and the record's words; a row opens in the side panel, and ↑ ↓ move it to the next
  const keyCols = keys.slice(0, 3).map((k, i) => ({ name: k.key, title: k.key, width: 110, drop: 3 - i, value: (e) => e.v[i] ?? '' }))
  const table = thimble.table({
    mount: '#list', side, search, color,
    columns: [
      { name: 't', title: 'Time', type: 'time', drop: false, days: true },
      ...keyCols,
      { name: 'text', title: 'Record' },
      { name: 'line', title: 'Line', type: 'id', drop: 4 },
    ],
    details: (e) => ({ title: e.v.slice(0, 2).filter((x) => x != null).join(' · ') || e.text || `Line ${e.line}`, sub: `${range.format(e.t, 1)}${e.line ? ` · line ${e.line}` : ''}`, render: (body) => details(body, e) }),
  })
  thimble.divider({ top: '#overview' })
  thimble.onReset({ changed: () => picked != null, reset: () => pick(null) })
  addEventListener('resize', draw)
  $('lhead').addEventListener('click', (ev) => { if (ev.target.closest('[data-all]')) pick(null) })
  return { search, color, filter, rows, range, lanes, table }
}

async function load() {
  const got = await thimble.fetch({ op: 'events' }, { key: 'events' })
  info = got
  E = got.events || []
  if (!E.length) {
    $('view').innerHTML = `<div class="empty">No record of this file has a time${got.time ? ` under ${esc(got.time)}` : ''}.</div>`
    markLoaded()
    return
  }
  parts = build(got.keys || [], got.initial || {})
  const a = E[0].t, b = E[E.length - 1].t
  const pad = Math.max(1, (b - a) * 0.005)
  span = [a - pad, b + pad]
  parts.range.data({ times: E.map((e) => e.t), span })
  markLoaded()
  draw()
}

function draw() {
  if (!span || !parts) return
  const { filter, range, lanes, rows } = parts
  thimble.timeAxis('#axis', range.scale($('axis').clientWidth))
  const kept = E.filter((e) => filter.keeps(e))
  lanes.draw(kept)
  const inLane = (e) => !picked || (rows.groupOf(e) ?? null) === picked.value
  shown = kept.filter((e) => range.has(e.t) && inLane(e))
  parts.table.draw(shown)
  head()
}

// what the table shows, named over it: the lane chosen or every record in the range, its first and last time, how
// many, and the records the reader left out (no time, or past what one answer places)
function head() {
  const { range, rows } = parts
  const what = picked ? `${rows.by ? rows.by.title + ': ' : ''}${picked.name}` : 'In the range'
  const when = shown.length ? `${range.format(shown[0].t, 60)} – ${range.format(shown[shown.length - 1].t, 60)}` : ''
  const left = [info.untimed ? `${plural(info.untimed, 'record', 'records')} with no ${info.time}` : '', info.partial ? `the first ${plural(info.total, 'record', 'records')} with a time` : ''].filter(Boolean).join(' · ')
  $('lhead').innerHTML = `<b>${esc(what)}</b>${when ? `<span>${esc(when)}</span>` : ''}<span>${plural(shown.length, 'record', 'records')}</span>` +
    (left ? `<span title="Raw shows every line of the file">${esc(left)}</span>` : '') +
    (picked ? '<button class="btn btn-ghost btn-sm" type="button" data-all>Every lane</button>' : '')
}

function pick(lane) {
  picked = lane ? { key: lane.key, value: lane.value, name: lane.name } : null
  parts.lanes.choose(picked ? picked.key : null)
  draw()
}

// a record in the side panel from a mark or a citation: the range moves to it, and the table opens its row
function show(e, keys) {
  const { range, rows, table } = parts
  if (!range.has(e.t)) { const w = range.to - range.from; range.set(e.t - w / 2, e.t + w / 2) }
  if (picked && (rows.groupOf(e) ?? null) !== picked.value) picked = null
  draw()
  table.open(e.ref)
  if (keys) $('list').focus({ preventScroll: true })
}

// a record in the side panel: its first two keys' values as its title, its time and line under it, and its fields, read
// whole once it opens, under its citation
async function details(body, e) {
  body.innerHTML = '<div class="rec"></div>'
  let d
  try {
    d = await thimble.fetch({ op: 'record', ref: e.ref }, { key: 'record' })
  } catch (err) {
    if (err.name === 'AbortError') return // the next record's fetch took its place, as ↓ moves on
    throw err
  }
  if (!d || !body.isConnected) return
  thimble.record({ mount: body.firstElementChild, value: d.record, ref: e.ref })
}

// a citation of the file: the record it names, or the last record that starts at or before its line
thimble.onOpen(async (place) => {
  await loaded
  const ref = place && place.ref
  if (!ref || !E.length || !parts) return
  const at = /#L(\d+)/.exec(ref)
  const line = at ? Number(at[1]) : null
  let e = E.find((x) => x.ref === ref)
  if (!e && line != null) for (const x of E) if (x.line <= line && (!e || x.line > e.line)) e = x
  if (e) show(e)
})
load()
</script>
</body>
</html>
