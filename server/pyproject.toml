[project]
name = "thimble-browser"
version = "0.1.0"
license = "Apache-2.0"
description = "thimble browser: a workspace in a web page for making sense of a folder of files with Claude"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.132",
  "uvicorn>=0.30",
  # the chat's Claude sessions: the person's own Claude Code, started headless (agent.py)
  "claude-agent-sdk>=0.2",
  # what a card's code runs on, in the sandbox (cards/runner.py)
  "ipython>=8",
  "pandas>=2.2",
  "altair>=5.3",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
thimble-browser = "thimble_browser.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thimble_browser"]
