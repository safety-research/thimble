[project]
name = "thimble-browser"
version = "0.1.0"
license = "Apache-2.0"
description = "thimble browser: a workspace in a web page for making sense of a folder of files with Claude"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.132",
  "uvicorn>=0.30",
  # the agents' loops call the Messages API (agent.py, llm.py); google-auth gets a Google identity token, one of the
  # token sources of Workload Identity Federation (wif.py)
  "anthropic>=1.13",
  "google-auth>=2.30",
  "requests>=2.32",
  "jsonschema>=4.20",
  # what a card's code runs on, in the sandbox (cards/runner.py)
  "ipython>=8",
  "pandas>=2.2",
  "altair>=5.3",
  "matplotlib>=3.9",
  # the text of a PDF's pages, for the excerpt of a page ref (readers/pdfs.py)
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
# the view builder's check of a view's page in headless Chromium (views/page_check.py); without it the check is skipped
# with a line that says so. Chromium itself: `playwright install chromium`
pagecheck = ["playwright>=1.50"]

[project.scripts]
thimble-browser = "thimble_browser.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thimble_browser"]
