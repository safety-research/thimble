name: Hand new issues to Claude

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  post-to-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Claude for a PR
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          CLAUDE_MEMBER_ID: ${{ secrets.CLAUDE_MEMBER_ID }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_URL: ${{ github.event.issue.user.html_url }}
        run: |
          # the issue's own text is escaped for Slack, so it cannot mention anyone or make links of its own; its
          # Markdown headings and bold become Slack's bold, and the small print under it goes
          jq -n '
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            def mrkdwn: gsub("(?m)^\\s*<sub>.*</sub>\\s*$"; "") | esc | gsub("(?m)^#{1,6}[ \\t]+(?<h>[^\\n]+)"; "*\(.h)*") | gsub("\\*\\*(?<b>[^*\\n]+)\\*\\*"; "*\(.b)*") | sub("\\s+$"; "");
            {
              head: "*New issue <\(env.ISSUE_URL)|#\(env.ISSUE_NUMBER)>: \(env.ISSUE_TITLE | esc)*\nopened by <\(env.ISSUE_AUTHOR_URL)|@\(env.ISSUE_AUTHOR | esc)>",
              details: (env.ISSUE_BODY // "" | if length > 3000 then .[:3000] + "…" else . end | mrkdwn),
              ask: "<@\(env.CLAUDE_MEMBER_ID)> create a PR to fix this. When the PR changes how thimble looks, include before and after screenshots in it."
            }' > msg.json
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ]; then
            # the headline in the channel, the details and the ask in its thread
            post() { curl -sSf -X POST -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json; charset=utf-8' --data @- https://slack.com/api/chat.postMessage; }
            ts=$(jq '{channel: env.SLACK_CHANNEL_ID, text: .head, unfurl_links: false}' msg.json | post | jq -er 'if .ok then .ts else error(.error) end')
            jq --arg ts "$ts" '{channel: env.SLACK_CHANNEL_ID, thread_ts: $ts, text: ([.details, .ask] | map(select(. != "")) | join("\n\n")), unfurl_links: false}' msg.json | post | jq -e '.ok' > /dev/null
          else
            # a webhook cannot reply in a thread: one message
            jq '{text: ([.head, .details, .ask] | map(select(. != "")) | join("\n\n")), unfurl_links: false}' msg.json |
              curl -sSf -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
          fi
