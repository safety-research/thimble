# Once a day, and by hand from the Actions tab: install the newest Claude Code from npm and check thimble's plugin, the
# thimble-cc-mod plugin and the marketplace with `claude plugin validate --strict`. It reads each manifest and hooks
# module, and lists the mods API events and calls the module uses, so a Claude Code release that drops or renames one
# fails here. It runs no thimble code, needs no secret and calls no model. It has no push or pull_request trigger, and
# GitHub runs a schedule only from the default branch.
name: claude-code-canary

on:
  schedule:
    - cron: "17 6 * * *"  # 06:17 UTC every day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-code-canary
  cancel-in-progress: true

env:
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"  # no telemetry or error reports from a runner with no login

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22  # Claude Code's npm package needs Node 22 or later

      # into a folder of its own, put first on PATH for the steps after it
      - name: Install the newest Claude Code
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund @anthropic-ai/claude-code@latest
          echo "$RUNNER_TEMP/claude-code/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Claude Code's version
        run: claude --version

      - name: Validate thimble's plugin
        run: claude plugin validate --strict plugin

      - name: Validate thimble-cc-mod
        run: claude plugin validate --strict mods/thimble-cc-mod

      - name: Validate the marketplace
        run: claude plugin validate --strict .
