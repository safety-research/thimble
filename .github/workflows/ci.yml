# The checks every push and pull request must pass, which can also be run by hand from the Actions tab. Each step is
# one step of scripts/check.sh, the command a contributor runs locally, so CI and a local run check the same things.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # the steps after it run a pull request's code, which needs no token
          fetch-depth: 0  # the whole history, so the commits step finds the base

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # first, since it needs nothing installed and fails in seconds
      - name: Content
        run: scripts/check.sh content

      # the commits a pull request or a push adds, after its base
      - name: Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check.sh commits

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache the headless Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'backend/uv.lock') }}

      - name: Install
        run: scripts/check.sh install

      - name: Backend
        run: scripts/check.sh backend

      - name: Frontend
        run: scripts/check.sh frontend

      # in the Chromium that Install put in; under CI (which Actions sets) a Chromium that does not start fails the step
      # instead of skipping it
      - name: Browser
        run: scripts/check.sh browser
