# The checks every push and pull request runs, which can also be run by hand from the Actions tab. The first step scans
# the new commits with scripts/scan.sh's generic patterns (CI has no private lists). Each step after it is one step
# of scripts/check.sh, the command a contributor runs locally, so CI and a local run check the same things.
#
# Claude Code comes from npm (@anthropic-ai/claude-code), pinned to a version the plugin was tested with. Its
# `claude plugin validate` and `claude plugin test` need no login, so all four steps run here.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_VERSION: 2.1.304
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # the steps after it run a pull request's code, which needs no token
          fetch-depth: 0  # the scan reads the history of the pushed commits

      - name: Scan the new commits for private paths and secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            scripts/scan.sh --generic "$BASE..$HEAD_SHA"
          else  # a new branch, a force push or a manual run: the commits no other branch has
            scripts/scan.sh --generic "$HEAD_SHA" --not --exclude="origin/$GITHUB_REF_NAME" --remotes=origin
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Install Python with pandas and pytest
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/py"
          uv pip install --python "$RUNNER_TEMP/py/bin/python" pandas pytest
          echo "THIMBLE_PYTHON=$RUNNER_TEMP/py/bin/python" >> "$GITHUB_ENV"

      - name: Validate the plugin
        run: scripts/check.sh validate

      - name: Hooks tests
        run: scripts/check.sh plugin

      - name: Node tests
        run: scripts/check.sh node

      - name: Python tests
        run: scripts/check.sh python
