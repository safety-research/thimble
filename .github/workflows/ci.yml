# thimble browser's checks: a scan of the new commits for private paths and secrets (scripts/scan.sh's generic
# patterns; CI has no private lists), the server's tests (with bubblewrap and the sandbox runtime, so the sandbox tests
# run) and the page's type check and build.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the scan reads the history of the pushed commits
      - name: Scan the new commits for private paths and secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            scripts/scan.sh --generic "$BASE..$HEAD_SHA"
          else  # a new branch, a force push or a manual run: the commits no other branch has
            scripts/scan.sh --generic "$HEAD_SHA" --not --exclude="origin/$GITHUB_REF_NAME" --remotes=origin
          fi

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the prompt parity test reads the terminal plugin's branch
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install bubblewrap, and let it make its namespaces (the runner's AppArmor keeps it from them)
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Sandbox check (installs the sandbox runtime pinned in server/sandbox, fails when it does not work)
        run: scripts/thimble-browser --check-sandbox
      - name: Tests
        working-directory: server
        run: uv run --extra dev pytest -q

  page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type check and build
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npx tsc -b && npx vite build
